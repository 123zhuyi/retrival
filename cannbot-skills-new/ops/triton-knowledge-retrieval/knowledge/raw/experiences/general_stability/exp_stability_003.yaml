experience_id: exp_stability_003
match_cond:
  operator_type: AIV
  compute_pattern: element-wise/reduce
  data_type:
  - fp16
  - bf16
  hardware:
  - 910b2
  - 910b3
  core_param: {}
  optimization_level: high
  tensor_shape:
  - nd
experience_type: 数值精度优化
framework_tag:
- Triton
optimization_points:
- 核心策略: 关键计算步骤转为float32执行，完成后转回原精度（fp16/bf16）存储
- 精度提升: fp16转float32计算可将MAE（平均绝对误差）降低80%以上
- 性能平衡: 910b2/910b3的float32计算耗时仅比fp16高5%，精度收益远大于性能损耗
code_snippet:
  Triton: "@triton.jit def mid_float32_opt_kernel(x_ptr, y_ptr, output_ptr, M, N,\
    \ K, BLOCK_M: tl.constexpr=256, BLOCK_N: tl.constexpr=256, BLOCK_K: tl.constexpr=256):\n\
    \    pid = triton.program_id(0)\n    rm = pid // (N // BLOCK_N)\n    rn = pid\
    \ % (N // BLOCK_N)\n    \n    # 加载低精度数据\n    x_ptr = x_ptr + rm * BLOCK_M * K\
    \ + tl.arange(0, BLOCK_M)[:, None] * K + tl.arange(0, BLOCK_K)[None, :]\n    y_ptr\
    \ = y_ptr + rn * BLOCK_N + tl.arange(0, BLOCK_K)[:, None] * N + tl.arange(0, BLOCK_N)[None,\
    \ :]\n    x = tl.load(x_ptr, mask=tl.arange(0, BLOCK_K)[None, :] < K, other=0.0)\n\
    \    y = tl.load(y_ptr, mask=tl.arange(0, BLOCK_K)[:, None] < K, other=0.0)\n\
    \    \n    # 核心优化: 转为float32进行中间计算\n    x_fp32 = x.to(tl.float32)\n    y_fp32\
    \ = y.to(tl.float32)\n    acc = tl.zeros((BLOCK_M, BLOCK_N), dtype=tl.float32)\n\
    \    \n    # float32高精度计算\n    acc += tl.matmul(x_fp32, y_fp32)\n    \n    # 转回原精度存储\n\
    \    acc_fp16 = acc.to(x.dtype)\n    output_ptr = output_ptr + rm * BLOCK_M *\
    \ N + tl.arange(0, BLOCK_M)[:, None] * N + tl.arange(0, BLOCK_N)[None, :]\n  \
    \  tl.store(output_ptr, acc_fp16, mask=tl.arange(0, BLOCK_M)[:, None] < M - rm\
    \ * BLOCK_M and tl.arange(0, BLOCK_N)[None, :] < N - rn * BLOCK_N)"
performance_boost: 计算精度提升（MAE降低80%）
note: 适用于多层激活、累积求和等复杂计算场景；fp16/bf16的动态范围有限，中间计算易丢失小数位，910b2/910b3平台建议所有核心计算步骤启用float32转换
version: v1.0

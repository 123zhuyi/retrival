 dispatch 实测案例](gdn2-fwd-chunked-wy-dispatch.md)。\n\n\n", "ops/flash-attention-score-grad.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/flash_attention_score_grad/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/flash-attention-score-grad.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/flash_attention_score_grad/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/flash_attention_score_grad/)。\n\n# FlashAttentionScoreGrad (训练反向)\n\nCANN ops-transformer 中的 `FlashAttentionScoreGrad` 算子（简称 FAG）在训练场景下计算 `FlashAttentionScore` 的反向梯度，支持 Atlas A2 训练系列（arch32 / ascend910b / ascend910_93）与 Ascend 950PR/950DT（arch35）。本页归纳反向算子语义与计算流程；可复用的 tiling/流水/dispatch 知识见 `technique-flash-attention-tiling`、`technique-flash-attention-pipeline`、`pattern-flash-attention-tiling-key-dispatch`，反向重算方法见 `technique-flash-attention-backward-recompute`。前向算子见 `kernel-flash-attention-score`。\n\n## 1. 输入输出\n\n### 输入（按 op_host/flash_attention_score_grad_def.cpp 顺序）\n\n| 输入 | 必选/可选 | 含义 | dtype |\n|------|-----------|------|-------|\n| query | 必选 | 查询 Q | FP16/BF16/FLOAT/HIFLOAT8/FLOAT8_E5M2/FLOAT8_E4M3FN |\n| key | 必选 | 键 K | 同 query |\n| value | 必选 | 值 V | 同 query |\n| dy | 必选 | 输出梯度 dY | FP16/BF16/FLOAT（FP8 路径下同 qkv） |\n| pse_shift | 可选 | 位置编码 | FP16/BF16/FLOAT |\n| drop_mask | 可选 | dropout 掩码，1=保留 0=丢弃 | UINT8 |\n| padding_mask | 可选 | padding 掩码 | FP16/BF16/FLOAT |\n| atten_mask | 可选 | 注意力掩码，1=不参与 0=参与 | BOOL/UINT8 |\n| softmax_max | 可选 | 前向 softmax 行最大值，加速重算 | FLOAT |\n| softmax_sum | 可选 | 前向 softmax 行求和，加速重算 | FLOAT |\n| softmax_in | 可选 | 前向 softmax 后的 P | FP16/BF16/FLOAT |\n| attention_in | 可选 | 前向输出 Y=PV，参与 FlashSoftmaxGrad | FP16/BF16/FLOAT |\n| prefix / actual_seq_qlen / actual_seq_kvlen / q_start_idx / kv_start_idx | 可选 | 变长/偏移（TND、varlen） | INT64 |\n| d_scale_q/k/v/dy/o | 可选 | FP8 全量化反量化参数 | FLOAT |\n| query_rope / key_rope | 可选 | RoPE 编码张量 | 同 query |\n| sink / ds_scale / p_scale | 可选 | attention sink / P 缩放（V3+） | FLOAT |\n\n### 输出\n\n| 输出 | 含义 | dtype |\n|------|------|-------|\n| dq / dk / dv | Q/K/V 的梯度 | FP16/BF16/FLOAT |\n| dpse | pse 的梯度 | FP16/BF16/FLOAT |\n| dq_rope / dk_rope | RoPE 梯度（V3+） | FP16/BF16/FLOAT |\n| dsink | sink 梯度（V3+） | FLOAT |\n\n### 维度约定（README L187-194）\n\n以 BNSD/BSND 为例（BSH/SBH 下 H=N*D）：B: 1~2M（prefix 时最大 2K）；N: 1~256；S: 1~1M；D: A2/A3 训练 1~512，950PR 1~768。内核计算逻辑轴：B、N2（kv head）、G（query/kv head 比）、S1（query seq）、S2（kv seq）、D、Dv。\n\n### 属性（def.cpp L222-260）\n\n`scale_value`(1.0)、`keep_prob`(1.0)、`pre_tockens`(INT_MAX)、`next_tockens`(INT_MAX)、`head_num`(必需)、`input_layout`(必需 BSH/SBH/BNSD/BSND/TND)、`inner_precise`(0)、`sparse_mode`(0，0=NO_MASK..8=BAND_LEFT_UP_CASUAL)、`pse_type`(1)、`seed`(2)、`offset`(0)、`out_dtype`(0)、`softmax_in_layout`(\"\")。\n\n## 2. 核心反向公式（6 步，FAG算子设计介绍.md L9-14）\n\n设 `S=Mask(QK^T/√d + pse, atten_mask)`，`P=Dropout(Softmax(S),keep_prob)`，`Y=PV`：\n\n| 步 | 公式 | 说明 |\n|----|------|------|\n| 1 重算 p | `p = SimpleSoftmax(Mask(Matmul(query, key^T) + pse) * scale)` | 重算前向 softmax 结果 P，存 UB |\n| 2 dp | `dp = Dropout(Matmul(dy, value^T))` | dY·V^T |\n| 3 ds | `ds = p * Sub(dp, FlashSoftmaxGrad(dy, attention_in))` | FlashSoftmaxGrad 入参 dY 与前向输出 Y |\n| 4 dq | `dq = Matmul(ds, key) * scale` | ds·K |\n| 5 dk | `dk = Matmul(ds^T, query) * scale` | ds^T·Q |\n| 6 dv | `dv = Matmul(Dropout(p)^T, dy)` | Dropout(P)^T·dY |\n\nFlashSoftmaxGrad 实质：`ds = P ⊙ (dP − rowsum(dP ⊙ P))`，`dP = dY·V^T`（步 2）。反向**重算** P（softmax_max/sum 作为可选输入可加速重算，见 def.cpp L72-83）。共 4 次 matmul：mm1=Q·K^T（重算）、mm2=dy·V^T、mm3=ds·K / ds^T·Q、mm4=P^T·dy。\n\n## 3. 计算流程（3 阶段 Pipeline，FAG算子设计介绍.md L20-23）\n\n| 阶段 | 入口函数 | 单元 | 对应步 |\n|------|----------|------|--------|\n| Cube1 | ComputeMM1 | AIC | 步 1（重算 p：QK^T + softmax） |\n| Vector1 | ComputeVec | AIV | 步 2-3（dp、ds：FlashSoftmaxGrad + elementwise） |\n| Cube2 | ComputeMMDqkv | AIC | 步 4-6（dq/dk/dv matmul） |\n\nV 侧 double buffer（ping-pong）；CV 间 preload（Cube 提前发射）。arch32 C:V=1:2 核数比，1:16 数据配比（nRatio=8）；arch35 C:V=1:2，L0C->UB / UB->L1 高速通路。详见 `technique-flash-attention-pipeline`。\n\n## 4. Tiling 与多模板\n\n- **arch32**：8 类模板，按 shape 路由（FAG算子设计介绍.md L264-319）：S1S2（通用泛化）、SameAB（_sab，Cube 为主核，确定性/大序列）、BN2（S1<1024&&S2<1024&&(B*N2*2>CoreNum‖G==1)）、NGS1S2_BN（G*S1*S2≤32KB&&G==1&&S2<1536）、B（N2*G*S1*S2≤64*128）、Basic/MLA、Basic_det（确定性）、Empty。CV 基本块 C 128×1024 / V 8×1024。\n- **arch35**：4 类模板（BN2: S1≤128&&S2≤128&&G==1；BN2S2: TND&&B*N2*S2>cubeCoreNum&&G==1；BN2GS1S2 通用；确定性），仅 2 个 kernel 文件（非确定性/确定性），模板参数隔离。CV 基本块 C 128×128 / V 64×128。\n- 切分顺序：先核内再核间；S2 不切多核（softmax 在线更新需连续 S2）。详见 `technique-flash-attention-tiling`。\n\n## 5. 模板 dispatch（op_kernel/flash_attention_score_grad.cpp L488-901）\n\n20 个 kernel 模板参数，按 `UB0/UB1/Block/IsSameAB/IsDeterministic` 分发：空 tensor(0,0,0) / SameAB(4,3,4,1 → key 0x1434) / S1S2(4,3,4,0) / BN2(4,3,1 → 0x134) / NGS1S2_BN(9,9,1 → 0x199) / B(9,9,0 → 0x099) / Basic_det(9,9,9,Det=1 → 0x1999) / Basic(9,9,9 → 0x999)。按 dtype（FP16/BF16/FLOAT）特化，FP32 仅 S1S2/BN2/BN/B。dispatch 维度（dtype/layout/has_mask/has_pse/has_dropout/has_rope/deterministic/sparse/NZ 输出/L1 复用/对齐特化）可映射为 Triton `tl.constexpr` 分支与 `BLOCK_*` 选择。详见 artifact `tiling-dispatch-tables.md` 与 `pattern-flash-attention-tiling-key-dispatch`。\n\n## 6. 架构与产品支持\n\n| 产品 | 架构代号 | 支持 | 说明 |\n|------|----------|------|------|\n| Atlas A2 训练 | arch32 (ascend910b) | √ | AIC&AIV 分离，多模板（8 类），aclnn V1-V3 |\n| Atlas A3 训练 | ascend910_93 | √ | 复用 arch32 kernel |\n| Ascend 950PR/950DT | arch35 (DAV_3510) | √ | AIC&AIV 融合，统一模板，aclnn V4 |\n| Atlas A2/A3 推理 | - | × | 仅训练场景 |\n\nFP8（FLOAT8_E5M2/E4M3FN/HIFLOAT8）仅 arch35(950) 支持，且不可配 pse/dropMask/attenMask/keepProb（README L179-181）。aclnn 版本：V1-V3 仅 A2 训练（950PR ×），V4 仅 950PR（A2 ×）；V2 加 pseType，V3 加 sink/dsink，V4 合并 V2+UnpaddingV2+varlen+自动 Dropout（docs/aclnnFlashAttentionScoreGrad*.md）。\n\n## 7. Agent actions\n\n1. 确认架构（arch32 vs arch35）与 dtype，选择对应模板分发路径与 aclnn 版本（V1-V3 A2 / V4 950）。\n2. 反向需重算 P：按 `technique-flash-attention-backward-recompute` 安排 6 步计算与 4 次 matmul。\n3. 按输入 layout 与 shape 推导核内/核间切分轴，参考 `technique-flash-attention-tiling`；S2 不切多核。\n4. 检查 atten_mask/dropMask/pse/softmax_max/sum/attention_in 是否存在，选对应 tiling key bit / constexpr 分支。\n5. 参考 `technique-flash-attention-pipeline` 安排 Cube/Vector 流水与 double buffer；arch35 利用 L0C->UB/UB->L1。\n6. Triton 实现参考 `artifacts/flash-attention-score-grad/flash-attention-score-grad-triton-skeleton.py`（pseudocode）。\n7. 空 tensor 走短路清零（FAG_EMPTY_TILING_KEY，100MB workspace）。\n\n## 8. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred），tiling 参数数值、流水 bound、FP8/BF16 精度边界、aclnn 运行时契约未经硬件实测。Triton skeleton 标记 `reproducibility: pseudocode`，不可直接编译运行。来源见 `ops-transformer-flash-attention-score-grad`。\n\n\n", "ops/flash-attention-score.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/flash_attention_score/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/flash-attention-score.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/flash_attention_score/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/flash_attention_score/)。\n\n# FlashAttentionScore (训练前向)\n\nCANN ops-transformer 中的 `FlashAttentionScore` 算子在训练场景下使用 FlashAttention 算法实现 self-attention 前向计算，支持 Atlas A2 训练系列（arch32）与 Ascend 950PR/950DT（arch35）。本页归纳算子语义与计算流程，可复用的 tiling/流水/dispatch 知识分别见 `technique-flash-attention-tiling`、`technique-flash-attention-pipeline`、`pattern-flash-attention-tiling-key-dispatch`。\n\n## 1. 输入输出\n\n### 输入（按 op_host/flash_attention_score_def.cpp 顺序）\n\n| 输入 | 必选/可选 | 含义 | dtype |\n|------|-----------|------|-------|\n| query | 必选 | 查询，shape 由 input_layout 决定 | FP16/BF16/FLOAT/FP8_E5M2/FP8_E4M3FN/HIFLOAT8 |\n| key | 必选 | 键 | 同 query |\n| value | 必选 | 值 | 同 query |\n| real_shift (pse) | 可选 | 位置编码 | FP16/BF16/FLOAT |\n| drop_mask | 可选 | dropout 掩码，1=保留 0=丢弃 | UINT8 |\n| padding_mask | 可选 | padding 掩码 | FP16/BF16/FLOAT |\n| atten_mask | 可选 | 注意力掩码，1=不参与 0=参与 | BOOL/UINT8 |\n| prefix | 可选 | prefix 序列长度 | INT64 |\n| actual_seq_qlen / actual_seq_kvlen | 可选 | 变长真实序列长度 | INT64 |\n| q_start_idx / kv_start_idx | 可选 | 序列起始偏移 | INT64 |\n| d_scale_q / d_scale_k / d_scale_v | 可选 | FP8 全量化参数 | FLOAT |\n| query_rope / key_rope | 可选 | RoPE 编码张量 | 同 query |\n| sink | 可选 | attention sink | FLOAT |\n| p_scale | 可选 | P 矩阵缩放 | FLOAT |\n\n### 输出\n\n| 输出 | 含义 | dtype |\n|------|------|-------|\n| softmax_max | Softmax 行最大值，供反向 | FLOAT |\n| softmax_sum | Softmax 行求和，供反向 | FLOAT |\n| softmax_out | Softmax 后的 P 矩阵 | FP16/BF16/FLOAT |\n| attention_out | 最终注意力输出 | FP16/BF16/FLOAT |\n\n### 维度约定\n\n以 BNSD/BSND layout 为例（BSH/SBH 下 H=N*D）:\n- B: 1~2M（prefix 时最大 2K）\n- N: 1~256\n- S: 1~1M\n- D: 1~768（FP8 时 1~128）\n\n内核计算逻辑轴为 B、N2（kv head）、G（query/kv head 比）、S1（query seq）、S2（kv seq）、D（head dim）、Dv（value head dim）。\n\n### 属性\n\n- `scale_value` (默认 1.0): QK 缩放系数\n- `keep_prob` (默认 1.0): dropout 保留概率\n- `head_num` (必需): query head 数\n- `input_layout` (必需): BSH/SBH/BNSD/BSND/TND\n- `sparse_mode` (默认 0): 0=ALL,1=NONE,2=ANY,3=CAUSAL,4=BAND,5=PREFIX,...\n- `pse_type` (默认 1): 控制 pse 的 add/mul 顺序\n- `inner_precise` (默认 0): 内部精度模式\n- `pre_tockens` / `next_tockens`: sparse 窗口\n\n## 2. 核心计算公式\n\npseType=1 时（先 add 再 mul）:\n```\nattention_out = Dropout(Softmax(Mask(scale * (pse + (Q·dScaleQ)·(K·dScaleK)ᵀ), atten_mask)), keep_prob) · (V·dScaleV)\n```\n\npseType≠1 时（先 mul 再 add）:\n```\nattention_out = Dropout(Softmax(Mask(scale * ((Q·dScaleQ)·(K·dScaleK)ᵀ) + pse), atten_mask)), keep_prob) · (V·dScaleV)\n```\n\nFP8 场景下 dScaleQ/K/V 为全量化参数，非 FP8 时可视为 1。atten_mask 中为 true 的位置被 select 成负极小值，softmax 后变 0 实现遮蔽。\n\n## 3. 计算流程（FlashSoftmax 在线刷新）\n\n| 阶段 | 入口函数 | 单元 | 操作 |\n|------|----------|------|------|\n| Cube1 | IterateBmm1 | AIC | Q·Kᵀ matmul → 原始 attention_score |\n| Vector1 | ProcessVec1 | AIV | pse add/mul → scale → atten_mask select → FlashSoftmax(在线 max/sum) |\n| Cube2 | IterateBmm2 | AIC | P·V matmul（P 为 softmax 结果） |\n| Vector2 | ProcessVec2 | AIV | rescale（除 softmax_sum）→ dropout → 写回 attention_out |\n\nFlashSoftmax 对 Skv 轴切分，在线更新:\n- `max[i]` = 第 i 个 SkvSplit 的行最大值\n- `exp[i] = e^(max[i-1] - max[i])`\n- `PV[i] = PV[i-1] * exp[i] + PV_new[i]`（PV 累积器按 exp 缩放后累加新分块）\n- 最终 `attention_out = PV_final / softmax_sum`\n\nsoftmax_max 与 softmax_sum 作为中间结果输出，供反向 `FlashAttentionScoreGrad` 使用。\n\n## 4. 变体对照\n\n| 变体 | 算子名 | 场景 |\n|------|--------|------|\n| 训练前向 | flash_attention_score | self-attention 训练，输出 softmax_max/sum 供反向 |\n| 训练反向 | flash_attention_score_grad | 训练反向梯度 |\n| 推理前向 | prompt_flash_attention | 推理 prefill / 全序列 |\n| 增量推理 | incre_flash_attention | 推理增量 decode（KV cache） |\n| 稀疏 | sparse_flash_attention / kv_quant_sparse_flash_attention | 稀疏 / KV 量化注意力<br>- MLA-absorb 模式（attention_mode=2）：query/key 的 nope 和 rope 部分沿 D 维拼接<br>- 离散访存搬运聚合优化（sparse_indices 驱动）<br>- 约束：D=512, Dr=64, N1=1/2/4/8/16/32/64/128, KV_N 只支持 1, block_size=16 倍数(≤1024)<br>- 支持 BSND/TND/PA_BSND 三种 layout<br>- 支持 FP16/BF16 输入输出，FP32 中间计算 |\n\n所有变体共享 QK→softmax→PV 的核心计算骨架，差异在于 mask/sparse 处理、KV cache 管理、是否输出反向中间量。\n\n## 5. 架构与产品支持\n\n| 产品 | 架构代号 | 支持 | 说明 |\n|------|----------|------|------|\n| Atlas A2 训练 | arch32 (DAV_A2) | √ | AIC&AIV 分离，多模板（6 类） |\n| Atlas A2 推理 | arch32 | √ | SFA 场景，稀疏 / KV 量化注意力 |\n| Atlas A3 训练 | ascend910_93 | √ | 复用 arch32 kernel |\n| Ascend 950PR/950DT | arch35 (DAV_3510) | √ | AIC&AIV 融合，单模板覆盖全 shape |\n| Atlas A3 推理 | arch35 | √ | SFA 场景，稀疏 / KV 量化注意力 |\n\nFP8（FLOAT8_E5M2/E4M3FN/HIFLOAT8）仅在 arch35 支持，且不可配 pse/dropMask/attenMask/keepProb 等可选参数。\n\nSFA（sparse_flash_attention）仅支持推理场景，不支持训练。\n\n## 6. Agent actions\n\n1. 确认目标架构（arch32 vs arch35）与 dtype，选择对应模板分发路径。\n2. 按输入 layout（BNSD/BSND/BSH/SBH/TND）和数据轴推导核内/核间切分轴。\n3. 评估 S2 是否 >1024：是则 S1S2 模板（含 FlashSoftmax 刷新流程），否则 S1/SameAB 模板。\n4. 检查 atten_mask/dropMask/pse 是否存在，选择对应 tiling key bit。\n5. 参考 `technique-flash-attention-pipeline` 安排 Cube/Vector 流水与 double buffer。\n6. Triton 实现参考 `artifacts/flash-attention-score/flash-attention-triton-skeleton.py`（pseudocode）。\n7. 对于 sparse_flash_attention 算子，关注 attention_mode=2 的 MLA-absorb 模式，以及 sparse_indices 驱动的离散 KV 取数策略。参考 `technique-sparse-kv-gather` 了解搬运聚合优化，参考 `technique-sparse-attention-tiling` 了解 SFA 特有的 tiling 策略。\n\n## 7. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred），tiling 参数数值、流水 bound 结论未经硬件实测。Triton skeleton 标记 `reproducibility: pseudocode`，不可直接编译运行。来源见 `ops-transformer-flash-attention-score`。\n\n\n", "ops/fused-floyd-attention-grad.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/fused_floyd_attention_grad/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/fused-floyd-attention-grad.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/fused_floyd_attention_grad/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/fused_floyd_attention_grad/)。\n\n# FusedFloydAttentionGrad (Floyd attention backward)\n\nCANN ops-transformer 中的 `FusedFloydAttentionGrad` 算子是 **Floyd Attention（Moonshot Kimi 长上下文双流注意力）** 的反向梯度算子。双流结构（K1/V1 + K2/V2 共享 Q），训练场景，仅 Atlas A2/A3 训练系列（arch32）。核心为 6 个 matmul 反向计算 dQ/dK1/dV1/dK2/dV2，三段式 kernel（Pre → S1S2 → Post）。\n\n## 1. 输入输出\n\n### 输入（按 `fused_floyd_attention_grad_def.cpp`）\n\n| 输入 | 必选/可选 | 含义 | dtype |\n|------|-----------|------|-------|\n| query | 必选 | 前向 Q | FP16/BF16/FLOAT |\n| key1 | 必选 | 前向 K1 | FP16/BF16/FLOAT |\n| value1 | 必选 | 前向 V1 | FP16/BF16/FLOAT |\n| key2 | 必选 | 前向 K2 | FP16/BF16/FLOAT |\n| value2 | 必选 | 前向 V2 | FP16/BF16/FLOAT |\n| dy | 必选 | 下游梯度 dY | FP16/BF16/FLOAT |\n| atten_mask | 可选 | 注意力掩码 | BOOL/UINT8 |\n| softmax_max | 可选 | 前向 softmax 行 max | FLOAT |\n| softmax_sum | 可选 | 前向 softmax 行 sum | FLOAT |\n| attention_in | 可选 | 前向 attention_out | FP16/BF16/FLOAT |\n\n### 输出\n\n| 输出 | 含义 | dtype |\n|------|------|-------|\n| dq | query 梯度 | FP16/BF16/FLOAT |\n| dk_1 | key1 梯度 | FP16/BF16/FLOAT |\n| dv_1 | value1 梯度 | FP16/BF16/FLOAT |\n| dk_2 | key2 梯度 | FP16/BF16/FLOAT |\n| dv_2 | value2 梯度 | FP16/BF16/FLOAT |\n\n### 属性\n\n`scale_value`（默认 1.0）：缩放系数。\n\n### 维度约束（README L173-189）\n\n- B：1~2K，H：1~256，N：16~1M（N%16==0），M：128~1M（M%128==0），K：128~1M（K%128==0）\n- D 仅支持 32/64/128\n- key1 与 value1 shape 相同，key2 与 value2 shape 相同\n\n## 2. 核心计算公式\n\n```\n前向：P = Softmax(scale * (Q·K1^T + Q·K2^T), mask)\n反向：\n  dS  = S * dY              # 下游梯度\n  dV1 = P^T · dY            # Value1 梯度\n  dV2 = P^T · dY            # Value2 梯度\n  dQ  = (dS·K1 + dS·K2) / √d  # Query 梯度（双流相加）\n  dK1 = (dS^T · Q) / √d     # Key1 梯度\n  dK2 = (dS^T · Q) / √d     # Key2 梯度\n```\n\n## 3. 计算流程\n\n### 3.1 三段式 kernel\n\n```\nPre 阶段：dS = S * dY（利用前向保存的 softmax_max/sum 恢复 S）\n  → SyncALLCores()\nS1S2 阶段：\n  → Bmm1: dV1 = P^T · dY\n  → Bmm2: dV2 = P^T · dY\n  → MM1:  dQ = (dS·K1 + dS·K2) / √d\n  → MM2:  dK1 = (dS^T · Q) / √d\n  → MM3:  dK2 = (dS^T · Q) / √d\n  → SyncALLCores()\nPost 阶段：梯度搬运 + ND↔NZ 格式转换\n```\n\n### 3.2 双流注意力特色\n\nFloyd Attention 将 seq 作为 batch 轴，将 Q·K^T 分解为 Q·K1^T + Q·K2^T 两部分：\n- K1/V1 和 K2/V2 共享 Q\n- dQ = dQ_K1 + dQ_K2（双流相加）\n- dK1 和 dK2 各自独立计算（公式对称）\n\n## 4. 模板与 dispatch\n\n| dtype | TilingKey | mask | pse | drop |\n|-------|-----------|------|-----|------|\n| BF16 | 10000000000000022434UL | 0 | 0 | 0 |\n| BF16 | 10000000000100022434UL | 1 | 0 | 0 |\n| FP16 | 10000000000000023434UL | 0 | 0 | 0 |\n| FP16 | 10000000000100023434UL | 1 | 0 | 0 |\n\n## 5. 架构与产品支持\n\n| 产品 | 架构 | config（def.cpp） | kernel 入口 |\n|------|------|-------------------|-------------|\n| Atlas A2 训练 | arch32 | `ascend910b` L164 | `fused_floyd_attention_grad.cpp` |\n| Atlas A3 训练 | ascend910_93 | `ascend910_93` L165 | 同上 |\n\n> 仅训练场景，无 950，无 310P。支持 FP16/BF16/FLOAT（FLOAT 仅 A2/A3 训练）。\n\n## 6. Agent actions\n\n1. 确认目标架构为 A2/A3 训练（arch32），dtype（FP16/BF16/FLOAT）。\n2. 6 个 matmul 反向映射：`tl.dot` × 6（dV1/dV2/dQ/dK1/dK2）。\n3. 双流处理：dQ = `tl.dot(dS,K1) + tl.dot(dS,K2)` 后 `/= sqrt(d)`。\n4. 参考 `technique-flash-attention-tiling` / `technique-flash-attention-pipeline` 了解 FA 通用 tiling/流水知识。\n5. Triton 实现参考 `artifacts/fused-floyd-attention-grad/fused-floyd-attention-grad-triton-skeleton.py`（pseudocode）。\n\n## 7. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。tiling 参数数值、dS 精确公式（依赖前向 softmax_max/sum 恢复）、ND↔NZ 格式转换细节需结合源码/硬件进一步验证。Triton skeleton 标记 `reproducibility: pseudocode`，不可直接编译运行。来源见 `ops-transformer-fused-floyd-attention-grad`。\n\n\n", "ops/fused-floyd-attention.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/fused_floyd_attention/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/fused-floyd-attention.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/fused_floyd_attention/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/fused_floyd_attention/)。\n\n# FusedFloydAttention (Floyd 多维注意力)\n\nCANN ops-transformer 中的 `FusedFloydAttention` 算子使用 FloydAttention 算法实现多维自注意力计算，支持 2 组 KV head group（K1/V1 + K2/V2）。仅支持 Atlas A2 训练系列（arch32 / ascend910b / ascend910_93），不支持 ascend950。\n\n## 1. 输入输出\n\n### 输入\n| 输入 | 必选 | 含义 | dtype |\n|------|------|------|-------|\n| query | 是 | 查询 Q | FP16/BF16/FLOAT |\n| key1 | 是 | 键 K1 | FP16/BF16/FLOAT |\n| value1 | 是 | 值 V1 | FP16/BF16/FLOAT |\n| key2 | 是 | 键 K2 | FP16/BF16/FLOAT |\n| value2 | 是 | 值 V2 | FP16/BF16/FLOAT |\n| atten_mask | 可选 | 注意力掩码 | BOOL/UINT8 |\n\n### 输出\n| 输出 | 含义 | dtype |\n|------|------|-------|\n| softmax_max | Softmax 行最大值 | FLOAT |\n| softmax_sum | Softmax 行求和 | FLOAT |\n| attention_out | 注意力输出 | FP16/BF16/FLOAT |\n\n### 约束（README.md L112-124）\nB:1~2K, H:1~256, N:16~1M(N%16==0), M:128~1M(M%128==0), K:128~1M(K%128==0), D:32/64/128\n\n## 2. 核心公式\n\n```\nweights = Softmax(attenMask + scale * (Q@K1^T + Q@K2^T))\nattention_out = weights@V1 + weights@V2\n```\n\n4 次 matmul: Q·K1^T + Q·K2^T + P·V1 + P·V2\n\n## 3. 计算流程\n\n| 阶段 | 入口 | 单元 | 操作 |\n|------|------|------|------|\n| Cube1 | IterateBmm1 | AIC | Q·K1^T |\n| Cube1k1 | IterateBmm1K1 | AIC | Q·K2^T |\n| Vector1 | ProcessVec1 | AIV | QK1+QK2 → scale → mask → Softmax |\n| Cube2 | IterateBmm2 | AIC | P·V1 |\n| Cube2v2 | IterateBmm2V2 | AIC | P·V2 |\n| Vector2 | ProcessVec2 | AIV | P·V1+P·V2 → 写回 |\n\n## 4. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。Triton skeleton 标记 `reproducibility: pseudocode`。来源见 `ops-transformer-fused-floyd-attention`。\n\n\n", "ops/mla-preprocess.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_preprocess/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/mla-preprocess.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_preprocess/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_preprocess/)。\n\n# MlaPreprocess（MLA 前处理融合算子）\n\nCANN ops-transformer 的 `MlaPreprocess` 是**推理场景** Multi-Head Latent Attention（MLA）的前处理融合算子：把输入 x 经 RmsNormQuant + 降维矩阵乘（W^DQKV）拆分为 Q/K 两路，再各自做 RmsNorm/上采样矩阵乘（W^UQ/W^UK）/RoPE，输出 q^N（nope）、q^R（rope）并把 k^N/k^R 写入 KV cache（README L12-19）。它是 `kernel-sparse-flash-attention`/`kernel-prompt-flash-attention` MLA 模式（attention_mode=2）的上游预处理，本身不做 softmax/QK/PV。\n\n## 1. 输入输出\n\n### 输入（def.cpp L73-96；README L74-241，多为 REQUIRED）\n\n| 输入 | 含义 | dtype | format |\n|---|---|---|---|\n| input | x，[tokenNum, hiddenSize] | FP16/BF16 | ND |\n| gamma_0/beta_0/quant_scale_0 | 1st RmsNormQuant 参数 | FP16/BF16 | ND |\n| quant_offset_0 | 1st 量化偏移 | INT8 | NZ |\n| wdqkv | 降维矩阵 W^DQKV，[2112,hiddenSize] | INT8/BF16 | NZ |\n| descale_0/bias_0 | mm1 系数/偏置 | INT64/FLOAT / INT32 | ND |\n| gamma_1/beta_1/quant_scale_1/quant_offset_1 | 2nd RmsNormQuant 参数 | FP16/BF16 / INT8 | ND |\n| wuq | 上采样 Q 矩阵 W^UQ，[headNum*192,1536] | INT8/BF16 | NZ |\n| descale_1/bias_1 | mm2 系数/偏置 | INT64/FLOAT / INT32 | ND/NZ |\n| gamma_2 | 3rd RmsNorm（K 路）参数，[512] | FP16/BF16 | ND |\n| cos/sin | RoPE 正余弦，[tokenNum,64] | INT8 | NZ |\n| wuk | 上采样 K 矩阵 W^UK | FP16/BF16 | ND/NZ |\n| kv_cache / kv_cache_rope | KV cache（与输出同 tensor） | FP16/BF16/INT8 | ND/NZ（随 cacheMode） |\n| slot_mapping | cache 索引，[tokenNum] | INT32 | ND |\n| ctkv_scale / q_nope_scale | 输出量化系数（cacheMode=2） | FP16/BF16 | ND |\n\n### 输出（def.cpp L97-100；README L334-360）\n\n| 输出 | 含义 | dtype | format |\n|---|---|---|---|\n| q_out | q^N（nope），[tokenNum,headNum,512]（cacheMode 0 为 576 拼接） | FP16/BF16/INT8 | ND |\n| kv_cache_out | k^N 写回 cache | FP16/BF16/INT8 | ND/NZ |\n| q_rope_out | q^R（rope），[tokenNum,headNum,64] | FP16/BF16 | ND |\n| kr_cache_out | k^R 写回 cache | FP16/BF16 | ND/NZ |\n\n### 属性（def.cpp L101-113）\n- `wdq_dim`(128,预留)、`q_rope_dim`/`k_rope_dim`(64,预留)、`epsilon`(1e-5)、`q_rotary_coeff`/`k_rotary_coeff`(2,预留)。\n- `transepose_wdq`/`wuq`/`wuk`(true,预留)、`do_rms_norm`(true,预留)、`wdkv_split_count`(1,预留)。\n- `cache_mode`(0-3)、`quant_mode`(0-3，仅 0=per_tensor 静态非对称实现，1/2/3 未实现，README L315)。\n\n### 约束（README L363-371）\ntokenNum 0-256；hiddenSize 2048-10240（256 倍数）；headNum {16,32,64,128}；blockNum 192；blockSize 128。BF16 权重 -> input BF16 且 hiddenSize 仅 6144。\n\n## 2. 核心计算公式\n\n```\nRMS(x) = sqrt(mean(x²) + eps);   RmsNorm(x) = γ · x / RMS(x)\nRmsNormQuant(x) = (RmsNorm(x) + bias) · deqScale\nq^N = RmsNormQuant(x) · W^DQKV · W^UK      # 数学 2-matmul 形式（MLA 权重吸收 W^UQ·W^UK 折叠）\nq^R = ROPE(x^Q)\nk^N = Cache(RmsNorm(RmsNormQuant(x)))\nk^R = Cache(ROPE(RmsNormQuant(x)))\n```\n（README L20-54）。kernel 实际实现 3 个 matmul（mm1=W^DQKV, mm2=W^UQ, mm3=W^UK，tilingdata L51-53）；是否运行时做权重吸收 `needs_verification`。\n\n## 3. 计算流程（CV 分离）\n\nkernel 入口先 `ProcessCube()` 再 `ProcessVector()`（mla_preprocess.cpp L52-53）：\n\n| 阶段 | 单元 | 操作 | tiling 方法 |\n|---|---|---|---|\n| Cube | AIC | 3 matmul（mm1 降维 / mm2 上采样Q / mm3 上采样K）+ RoPEConcat | `RopeConcatTiling`（tiling.h L54） |\n| Vector | AIV | 2× RmsNormQuant + RmsNorm₃ + EinSumQuant + Cache 写回 | `RmsNormQuantTiling` / `EinSumQuantTiling`（L53/55） |\n\n数据流：x -> RmsNormQuant₁ -> mm1 -> 拆 Q/K；Q: RmsNormQuant₂ -> mm2 -> 拆 nope(rope)/rope -> nope: mm3 -> q^N，rope: RoPE -> q^R；K: RmsNorm₃ -> cache k^N，RoPE -> cache k^R。\n\n## 4. tiling 与 dispatch（概要，详见 artifact `tiling_dispatch_tables.md`）\n\n- dtype dispatch：FP16 -> `_fp16.h`；BF16 -> `_bf16.h` + `_no_quant.h`（mla_preprocess.cpp L17-22）。\n- tiling key = cacheMode × 3 输出格式(ND/NZ)（L46+，步长 4，8 组合/cacheMode）。\n- 核间切分：tokenNum 沿 numCore，每核 perTaskNum、尾核 resTaskNum（tilingdata L47-50）。\n- 3 matmul 基本块 m0/k0/n0 + loop + swizzle + ping-pong（MlaPpMatmulTilingData L25-43）。\n- workspace 3 等大 section（s1/s2/s3，L41-43）。\n- buffer 搬运由 9 个 `*_iterator.h`（GM/L1/L0C/UB 间）封装，CANN 专有。\n\n## 5. 与 MLA attention 的关系\n\n`mla_preprocess` 是 MLA attention 的**上游预处理**：\n- 输出 q^N(512)+q^R(64) 与 k^N(512)+k^R(64) 供下游 `kernel-sparse-flash-attention`/`kernel-prompt-flash-attention` 的 MLA-absorb（attention_mode=2）使用。\n- 下游 attention 把 nope+rope 沿 D 拼接成 576 做 QK；key/value 共享张量。\n- 本算子**不做** softmax/QK/PV，只做 norm+matmul+rope+cache 融合。\n\n## 6. 架构支持（README L7-8；def.cpp L118-119）\n\n| 产品 | 架构 | 支持 |\n|---|---|---|\n| Atlas A2 训练/推理 | Ascend910B1 | √ |\n| Atlas A3 训练/推理 | Ascend910_93 | √ |\n\n不支持 950/310P。FP16/BF16（权重 INT8 量化）。\n\n## 7. Agent actions\n\n1. 识别为 MLA 前处理融合（norm+matmul+rope+cache），非 attention 主算子；下游接 MLA attention。\n2. 按 dtype 选 FP16/BF16/no_quant 模板；按 cacheMode 选输出格式(ND/NZ)与量化分支。\n3. Cube 侧 3 个 matmul（mm1/mm2/mm3）注意 MLA 权重吸收等价性（数学 2-matmul）。\n4. Vector 侧 RmsNormQuant 用 FP32 reduce；quantMode 仅 0 实现。\n5. Cache 写回按 slot_mapping scatter store；cacheMode 决定 cache shape/格式/int8 量化。\n6. Triton 实现参考 `artifacts/mla-preprocess/mla-preprocess-triton-skeleton.py`（pseudocode）。\n7. CANN 专有（buffer iterator/ND↔NZ/CV 分离/swizzle）不迁移，抽象为 fused load/store + 单 program。\n\n## 8. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。tiling 参数数值、workspace 预算、MLA 权重吸收实现、quantMode 1/2/3（未实现）、cacheMode=2 int8 量化边界均未经硬件实测。Triton skeleton 标记 `reproducibility: pseudocode`，不可直接编译运行。来源见 `ops-transformer-mla-preprocess`。\n\n\n", "ops/mla-prolog-v3.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_prolog_v3/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/mla-prolog-v3.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_prolog_v3/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_prolog_v3/)。\n\n# MlaPrologV3 (MLA pre-process)\n\nCANN ops-transformer 中的 `MlaPrologV3` 算子是 **DeepSeek V2/V3 核心创新 MLA（Multi-head Latent Attention）** 的前处理融合算子。对输入 token_x 执行 4 路 matmul（下采样 + 拼接上采样 + 拼接下采样 + 上采样）+ 2 个 RmsNorm + 2 个 RoPE 位置编码 + KVCache/KRCache 更新，输出 query（q^N）、query_rope（q^R_rope）、kv_cache、kr_cache。三架构（arch32 A2/A3 + arch35 950）。\n\n## 1. 输入输出\n\n### 输入（按 `mla_prolog_v3_def.cpp` 与 README L80-116）\n\n| 输入 | 必选/可选 | 含义 | dtype | 格式 |\n|------|-----------|------|-------|------|\n| token_x | 必选 | 输入 token | BF16/INT8/FP8_E4M3FN | ND |\n| weight_dq | 必选 | 下采样 W^{DQ} [He, Hcq] | BF16/INT8/FP8_E4M3FN | **FRACTAL_NZ** |\n| weight_uq_qr | 必选 | [W^{UQ}\\|W^{QR}] 拼接 [Hcq, Hckv+Dr] | BF16/INT8/FP8_E4M3FN | **FRACTAL_NZ** |\n| weight_uk | 必选 | 上采样 W^{UK} [Hckv, N*Hckv] | BF16/FP16 | ND |\n| weight_dkv_kr | 必选 | [W^{DKV}\\|W^{KR}] 拼接 [He, Hckv+Dr] | BF16/INT8/FP8_E4M3FN | **FRACTAL_NZ** |\n| rmsnorm_gamma_cq/ckv | 必选 | RmsNorm γ 参数 | BF16/FP16 | ND |\n| rope_sin/cos | 必选 | RoPE sin/cos 参数 | BF16/FP16 | ND |\n| kv_cache | 输入/输出 | KVCache | FP16/BF16/INT8 | ND |\n| kr_cache | 输入/输出 | KRCache | FP16/BF16/INT8 | ND |\n| cache_index | 必选 | cache 更新索引 [B,S] 或 [T,] | INT64 | ND |\n| 可选 20+ | 可选 | dequant_scale_x/dq/uq_qr/dkv_kr、quant_scale_ckv/ckr、smooth_scales_cq、actual_seq_len、kNopeClipAlpha、qcQrScale、kcScale 等 | 按模式 | ND |\n\n### 输出\n\n| 输出 | 含义 | dtype |\n|------|------|-------|\n| query (q^N) | 上采样后的 query [T,N,Hckv] | FP16/BF16/INT8 |\n| query_rope (q^R_rope) | RoPE 后的 query [T,N,Dr] | FP16/BF16/INT8 |\n| kv_cache（原地更新） | c^{KV}_norm 写入 cache | FP16/BF16/INT8 |\n| kr_cache（原地更新） | k^R_rope 写入 cache | FP16/BF16/INT8 |\n| dequant_scale_q_nope | query 量化参数（可选） | FLOAT |\n| query_norm | c^Q（可选） | INT8/BF16 |\n| dequant_scale_q_norm | query_norm 量化参数（可选） | FLOAT |\n\n### 属性（V3）\n\n`cache_mode`（PA_BSND/PA_NZ）、`qc_qr_scale`（α_q 默认1.0）、`kc_scale`（α_kv 默认1.0）、`query_norm_flag`、`weight_quant_mode`、`kv_cache_quant_mode`、`query_quant_mode`、`ckvkr_repo_mode`、`quant_scale_repo_mode`、`tile_size`（per-tile 128）、`rmsnorm_epsilon_cq/ckv`。\n\n## 2. 核心计算公式\n\n```\nc^Q  = α_q · RmsNorm(x · W^{DQ})                            # ① 下采样 + RmsNorm\nq^N  = c^Q · W^{UQ} · W^{UK}                                # ② 上采样 -> query\nq^R  = ROPE(c^Q · W^{QR})                                   # ③ RoPE -> query_rope\nc^{KV} = α_kv · RmsNorm(x · W^{DKV})                       # ④ 下采样 + RmsNorm -> kv_cache\nk^R  = ROPE(x · W^{KR})                                     # ⑤ RoPE -> kr_cache\n```\n\n利用矩阵乘拼接优化：W^{UQ}+W^{QR} 拼为 [W^{UQ}|W^{QR}]，W^{DKV}+W^{KR} 拼为 [W^{DKV}|W^{KR}]，单次 matmul 后 split。\n\n## 3. 计算流程\n\n### 3.1 四路 matmul + 2 RmsNorm + 2 RoPE（设计介绍 L15-25）\n\n```\nx → MatmulCq (x·W^{DQ}) → c^Q → RmsNormCq → c_norm^Q\n                                            → MatmulQcQr ([W^{UQ}|W^{QR}]) → [q^C|q^R] → split\n                                                                                  q^C → MatmulQn (W^{UK}) → q^N (query)\n                                                                                  q^R → RoPE → q^R_rope (query_rope)\nx → MatmulCkvKr ([W^{DKV}|W^{KR}]) → [c^{KV}|k^R] → split\n                                          c^{KV} → RmsNormCkv → kv_cache\n                                          k^R    → RoPE → kr_cache\n```\n\n### 3.2 CV 流水 6 同步点（设计介绍 L47-68）\n\n不同 matmul 的分核策略不同（Hcq 按 AIC 核数、Hckv 固定 64 块、Hqc 按 AIC 核数），导致 Cube 和 Vector 之间需要 6 个核间同步点（SYNC_MMCQ_NORMSCQ / SYNC_MMCKVKR_NORMROPE / SYNC_MMQCQR_ROPEQR / SYNC_ALL_CUBE / SYNC_ALL_VECTOR 等）。这是 CANN 专有机制，不迁移到 Triton。\n\n### 3.3 TilingKey（26 位二进制，9 字段）\n\n`mla_prolog_v3.cpp` L25-27 的 9 个 uint8_t 模板参数对应 TilingKey（设计介绍 L70-85）：\n\n| 字段 | 位 | 说明 |\n|------|----|------|\n| CACHE_MODE | 0-3 | 0:BNSD / 1:PA_BSND / 2:PA_NZ |\n| SCENARIO | 4-5 | 0:FP16 / 1:非量化 / 2:量化 |\n| QUANT_MODE | 6-9 | 8 种量化组合（非量化/MMQcQr/KVcache pertile/全量/Mxfp8 等） |\n| ENABLE_DEQUANT_OPT | 10 | 反量化使能 |\n| ENABLE_GROUP_COMPUTE_OPT | 11 | 算力分组优化 |\n| EMPTY_TENSOR_MODE | 12-13 | 空 tensor（KV 空/Query 空） |\n| ACTUAL_SEQ_LEN_MODE | 14-15 | actualSeqLen 使能 |\n| SPLIT_M_MODE | 16-17 | 0:切N / 1:切M |\n| CV_MODE | 18-25 | CV 配比（1:1 / 1:2） |\n\n## 4. 架构与产品支持\n\n| 产品 | 架构 | config（def.cpp） | kernel 入口 |\n|------|------|-------------------|-------------|\n| Atlas A2 训练/推理 | arch32（910B） | `ascend910b` L171 | `mla_prolog_v3.cpp`（共享 mla_prolog/） |\n| Atlas A3 训练/推理 | ascend910_93 | `ascend910_93` L172 | 同上 |\n| Ascend 950PR/950DT | arch35 | `ascend950` L315 | 同上（arch35 单独 dtype/layout） |\n\n三架构均支持，无 310P。kernel 实现共享 `mla_prolog/op_kernel/kernel_mla_prolog_split_n.h`（V3 与 V1/V2 共享核心实现）。\n\n## 5. 量化模式\n\n支持 8 种量化模式（QUANT_MODE 0-8，README L147-203）：\n\n| 模式 | token_x | weight_dq/uq_qr/dkv_kr | kv_cache | query 输出 |\n|------|---------|------------------------|----------|-----------|\n| 非量化 | BF16 | BF16 | FP16/BF16 | FP16/BF16 |\n| 部分量化 | BF16 | pertoken INT8 | 非量化/pertensor/pertile | FP16/BF16 |\n| 全量化 | pertoken INT8 | perchannel INT8 | 非量化/pertensor/pertile | pertoken_head INT8 |\n| Mxfp8 | FP8_E4M3FN | FP8_E4M3FN | pertensor | pertoken_head |\n\n## 6. Agent actions\n\n1. 确认目标架构（arch32 / arch35）与量化模式（QUANT_MODE 0-8）。\n2. 4 路 matmul 映射：`tl.dot` × 4（下采样 + 2 个拼接 matmul + 上采样）。\n3. 2 个 RmsNorm：`x * rsqrt(mean(x^2) + eps) * gamma`。\n4. 2 个 RoPE：偶奇拆分 * cos + 翻转 * sin -> 合并。\n5. KVCache/KRCache scatter：`tl.store(cache + cache_index, ...)`。\n6. V3 特有：α_q/α_kv 尺度矫正因子（qcQrScale/kcScale）、query_norm_flag、per-tile 量化（tileSize=128）。\n7. CANN 专有（不迁移）：CV 6 同步点、FRACTAL_NZ 物理格式、TilingKey 26 位 key。\n8. Triton 实现参考 `artifacts/mla-prolog-v3/mla-prolog-v3-triton-skeleton.py`（pseudocode）。\n\n## 7. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。kernel 实现来自共享 `mla_prolog/` 目录（V3 入口仅定义模板参数），核心实现细节需以 `kernel_mla_prolog_split_n.h` 为准。tiling 参数数值、per-tile 量化精度边界、cacheIndex 与 cache 更新关系、Mxfp8 支持需结合源码/硬件进一步验证。Triton skeleton 标记 `reproducibility: pseudocode`，不可直接编译运行。来源见 `ops-transformer-mla-prolog-v3`。\n\n\n", "ops/mla-prolog.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_prolog/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/mla-prolog.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_prolog/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_prolog/)。\n\n# MlaProlog（MLA 前处理 Prolog V1）\n\nCANN ops-transformer 的 `MlaProlog` 是**推理场景** MLA 前处理融合算子 V1（与 `kernel-mla-preprocess` V2+ 不同）。四路计算：x→×W^DQ(RmsNorm)→[×W^UQ·W^UK→q^N]+[×W^QR→RoPE→q^R]+[×W^DKV→RmsNorm→cache→k^C]+[×W^KR→RoPE→cache→k^R]。它是 `kernel-sparse-flash-attention`/`kernel-prompt-flash-attention` MLA-absorb 的上游预处理，本身不做 softmax/QK/PV。**与 mla_preprocess 的差异**：权重更细粒度（W^DQ/W^UQ/W^QR/W^DKV/W^KR 独立而非 W^DQKV/W^UQ/W^UK），支持 Ascend950（FP8），CV 同步更复杂（6 event）。\n\n## 1. 输入输出\n\n### 输入（def.cpp L23-117；README L62-86）\n\n| 输入 | 必选/可选 | 含义 | dtype | format |\n|---|---|---|---|---|\n| token_x | 必选 | x，[B,S,He]/[T,He] | BF16/INT8 | ND |\n| weight_dq | 必选 | W^DQ 下采样 [He,Hcq] | BF16/INT8 | NZ |\n| weight_uq_qr | 必选 | [W^UQ\\|W^QR] [Hcq,N*(D+Dr)] | BF16/INT8 | NZ |\n| weight_uk | 必选 | W^UK [N,D,Hckv] | BF16 | ND |\n| weight_dkv_kr | 必选 | [W^DKV\\|W^KR] [He,Hckv+Dr] | BF16/INT8 | NZ |\n| rmsnorm_gamma_cq/ckv | 必选 | RmsNorm γ [Hcq]/[Hckv] | BF16 | ND |\n| rope_sin/cos | 必选 | RoPE [T,Dr]/[B,S,Dr] | BF16 | ND |\n| cache_index | 必选 | Cache 索引 [T]/[B,S] | INT64 | ND |\n| kv_cache/kr_cache | 必选 | KVCache（输入/输出同 tensor） | BF16/INT8 | ND |\n| dequant_scale_x/w_dq/w_dkv_kr | 可选 | 预留（未使用，传空指针） | FLOAT | ND |\n| dequant_scale_w_uq_qr | 可选 | MatmulQcQr 反量化 per-channel | FLOAT | ND |\n| quant_scale_ckv/ckr | 可选 | 输出量化参数 | FLOAT | ND |\n| smooth_scales_cq | 可选 | RmsNormCq 动态量化参数 | FLOAT | ND |\n\n### 输出（def.cpp L118-133）\n\n| 输出 | 含义 | dtype |\n|---|---|---|\n| query | q^N [B,S,N,Hckv]/[T,N,Hckv] | BF16 |\n| query_rope | q^R [B,S,N,Dr]/[T,N,Dr] | BF16 |\n| kv_cache | k^C（原地更新） | BF16/INT8 |\n| kr_cache | k^R（原地更新） | BF16/INT8 |\n\n### 属性（def.cpp L134-136）\n`rmsnorm_epsilon_cq`(1e-5)、`rmsnorm_epsilon_ckv`(1e-5)、`cache_mode`(\"BNSD\"=PA_BSND/PA_NZ)。\n\n### 约束（README L91-128）\n3 场景：非量化(BF16)/部分量化KV非量化(weight_uq_qr=INT8)/部分量化KV量化(kv_cache=INT8 per-channel)。B/S/T/Skv=0 时 query/kv_cache 输出空 tensor。\n\n## 2. 核心计算公式\n\n```\nq^N = RmsNorm(x·W^DQ)·W^UQ·W^UK              # 公式(a), 设计介绍 L154\nq^R = ROPE(RmsNorm(x·W^DQ)·W^QR)              # 公式(b), L158\nk^R = ROPE(x·W^KR)                            # 公式(c), L162\nc^KV = RmsNorm(x·W^DKV)                       # 公式(d), L166\n```\nW^UQ+W^QR 与 W^DKV+W^KR 分别横向拼接为一个 matmul 后 split（公式 7/11）。\n\n## 3. 计算流程（7 阶段 CV 流水，6 sync event）\n\n详见 `artifacts/mla-prolog/pipeline-diagram.md`。主循环（设计介绍 L83-146）：\n\n| # | 阶段 | 单元 | 操作 | 同步 |\n|---|---|---|---|---|\n| 1 | MatmulCq | AIC | x·W^DQ → cQ | →SYNC_MMCQ_NORMSCQ |\n| 2 | MatmulCkvKr | AIC | x·[W^DKV\\|W^KR] | →SYNC_MMCKVKR_NORMROPE |\n| 3 | RmsNormCq | AIV | γ·cQ/RMS(cQ) | ←等1, →全核→↺Cube |\n| 4 | RmsNormRopeScatterCkvKr | AIV | RmsNorm(cKV)+RoPE(kR)+Cache | ←等2 |\n| 5 | MatmulQcQr | AIC | cQ_norm·[W^UQ\\|W^QR] | ←等3, →SYNC_MMQCQR_ROPEQR, →全核→↺全核 |\n| 6 | RopeQr | AIV | RoPE(qR) | ←等5 |\n| 7 | MatmulQn | AIC | qC·W^UK → q^N | ←等全核(5) |\n\n## 4. tiling 与 dispatch（详见 `artifacts/mla-prolog/tiling_dispatch_tables.md`）\n\n- **tiling key 二进制**：CACHE_MODE(2bits)+SCENARIO(2bits)+QUANT_MODE(4bits)+DEQUANT/COMPUTE(2bits)+EMPTY(2bits)（设计介绍 L70-79）。\n- **8 模板参数**：`CacheMode, Scenario, QuantMode, EnableDequantOpt, EnableGroupComputeOpt, EmptyTensorMode, ActualSeqLenMode, SplitMMode, CvMode`（mla_prolog.cpp L20-22）。\n- **3 场景**：NO_QUANT(BF16)/PARTIAL_QUANT_KV_NO_QUANT(INT8_uq_qr)/PARTIAL_QUANT_KV_QUANT_PER_CHANNEL(INT8 cache)（L69-99）。\n- **4 matmul 切分**：BS 合轴 M，N 轴按 Cube 核数（MatmulCq Hcq / MatmulCkvKr Hckv+Dr / MatmulQcQr N*(D+Dr) / MatmulQn Hckv）。\n- **架构**：A2/A3(BF16/INT8) + 950(额外 FP8_E4M3FN)。`MIX_AIC_1_2`（1:2 CV 配比）。\n\n## 5. 与 mla_preprocess 的对比\n\n| 差异 | mla_prolog (V1) | mla_preprocess (V2+) |\n|---|---|---|\n| 权重 | W^DQ/W^UQ/W^QR/W^DKV/W^KR 独立 | W^DQKV/W^UQ/W^UK（W^DQKV=W^DQ+W^DKV 合并） |\n| 架构支持 | A2/A3 + 950(FP8) | 仅 A2/A3 |\n| CV sync | 6 event（更复杂，含全核同步） | ProcessCube+ProcessVector 两阶段 |\n| token_x dtype | BF16/INT8 | FP16/BF16 |\n| 量化 | per-channel cache 量化 | per_tensor 静态非对称 |\n| 公式 | `x·W^DQ→RmsNorm→[W^UQ\\|W^QR]` | `x→RmsNormQuant₁→W^DQKV→[W^UQ\\|W^UK]` |\n\n两者输出等价（q^N/q^R + k^C/k^R），但权重拆分与量化策略不同。`kernel-mla-preprocess` 页有详细对比。\n\n## 6. 架构支持（README L7-9；def.cpp L145-267）\n\n| 产品 | 架构 | 支持 | dtype |\n|---|---|---|---|\n| Atlas A2 训练/推理 | Ascend910B1 | √ | BF16/INT8 |\n| Atlas A3 训练/推理 | Ascend910_93 | √ | BF16/INT8 |\n| Ascend 950PR/950DT | Ascend950 | √ | BF16/INT8/FP8_E4M3FN |\n\n## 7. Agent actions\n\n1. 识别为 MLA prolog V1（权重 W^DQ/W^UQ/W^QR/W^DKV/W^KR 独立），与 mla_preprocess V2+ 区分。\n2. 按架构选 A2/A3(BF16/INT8) 或 950(FP8)；按 scenario 选量化分支（NO_QUANT/PARTIAL_QUANT）。\n3. 4 matmul：W^UQ+W^QR 与 W^DKV+W^KR 分别合并 matmul 后 split；MatmulQn 需等全核 MatmulQcQr。\n4. 6 CV sync event（CANN 专有）抽象为 tile 依赖链：Cube matmul → Vector norm → Cube matmul → Vector rope。\n5. Cache scatter 写回按 cache_index；PA 场景支持 ND/NZ 格式。\n6. 参考 `artifacts/mla-prolog/mla-prolog-triton-skeleton.py`（pseudocode）。\n\n## 8. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。tiling 参数数值、FP8 精度边界、MLA 权重吸收实现、预留参数（未使用）均未经硬件实测。Triton skeleton 标记 `reproducibility: pseudocode`。来源见 `ops-transformer-mla-prolog`。\n\n\n", "ops/rain-fusion-attention.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/rain_fusion_attention/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/rain-fusion-attention.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/rain_fusion_attention/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/rain_fusion_attention/)。\n\n# RainFusionAttention（CATLASS 块级稀疏推理注意力）\n\nCANN ops-transformer 的 `RainFusionAttention` 是基于 **CATLASS 模板库**的高性能块级稀疏推理注意力算子（从 catlass `32_sparse_attention_infer` 迁移）。与 `kernel-sparse-flash-attention` 一样使用稀疏 QK/PV，但稀疏模式由 `selectIdx`（显式 Q×KV 块选择矩阵）驱动，比 SFA 的 `sparse_indices` 更灵活（README L138-163）。**注意**：README 说 BNSD 不支持，但源码 tilingkey.h 和 kernel 入口定义了 BNSD 分支——以源码为准（`needs_verification`）。\n\n## 1. 输入输出\n\n### 输入（def.cpp L19-58）\n\n| 输入 | 必选/可选 | 含义 | dtype | format |\n|---|---|---|---|---|\n| query | 必选 | Q，[B,S,H]/[T,N,D] | FP16/BF16 | ND |\n| key / value | 必选 | K/V，仅 TND | FP16/BF16 | ND |\n| selectIdx | 必选 | 稀疏块索引 [T,headNum,maxKvBlockNum] | INT64 | ND |\n| selectNumIdx | 必选 | 每 Q 块的 KV 块数 [T,headNum] | INT64 | ND |\n| blockShape | 必选 | 块形状 [blockShapeX, blockShapeY] | INT64 | ND |\n| attenMask | 可选 | 注意力掩码 | FP16/BF16 | ND |\n| actualSeqLengths / _kv | 可选 | 实际序列长度 | INT64 | ND |\n| blockTable | 可选 | PagedAttention 块表 | INT32 | ND |\n\n### 输出（def.cpp L59-66）\n- attentionOut（REQUIRED，FP16/BF16）\n- softmaxLse（OPTIONAL，FLOAT）\n\n### 属性（def.cpp L68-74）\n`qInputLayout`/`kvInputLayout`(\"TND\")、`numKeyValueHeads`(1)、`maskType`(0)、`scaleValue`(0.0)、`innerPrecise`(1)、`blockSize`(128)。\n\n## 2. 核心公式\n\n```\nfor each Q block (blockShapeX):\n  for each selected KV block (selectIdx):\n    s = Q_block · K_block^T × scale\n    s = mask(s)     # 可选\n    # online softmax + PV rescale (同 FlashSoftmax)\n    m_ij = max(s);  p = exp(s - m_ij);  l_ij = sum(p)\n    alpha = exp(m_i - m_ij)\n    l_i = l_i * alpha + l_ij\n    acc = acc * alpha + p · V_block\n    m_i = max(m_i, m_ij)\n  o = acc / l_i;  lse = log(l_i) + m_i   # 可选\n```\n\n## 3. tiling key dispatch（tilingkey.h L31-46）\n\n6 个 key：TND/BNSD × FP16/BF16 × FloatSM/HalfSM。base=`9000000000000000`。MIX_AIC_1_2。\n\n## 4. 架构支持（def.cpp L76-77）\n\n仅 Ascend910B1/910_93（A2/A3）。编译 `--soc=Ascend910B3`。不支持 950/Kirin。\n\n## 5. Agent actions\n\n1. 识别为 CATLASS 风格块级稀疏推理注意力，selectIdx 驱动 KV 块选择。\n2. blockShapeX/Y 为稀疏块大小（constexpr BLOCK_M/N）。\n3. 稀疏遍历与 SFA 类似但索引更灵活（显式 Q×KV 选择矩阵）。\n4. innerPrecise 控制 softmax 精度（0=FP32/1=Half）。\n5. softmaxLse 可选输出供下游。\n6. BNSD layout 源码支持但 README 说不支持——以源码为准。\n\n## 6. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。BNSD 实际支持状态（源码 vs README 矛盾）需验证。Triton skeleton 标记 `reproducibility: pseudocode`。\n\n\n", "ops/recurrent-gated-delta-rule.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/recurrent_gated_delta_rule/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/recurrent-gated-delta-rule.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/recurrent_gated_delta_rule/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/recurrent_gated_delta_rule/)。\n\n# RecurrentGatedDeltaRule（线性注意力 / SSM 风格循环门控 Delta 规则）\n\nCANN ops-transformer 的 `RecurrentGatedDeltaRule`（RGDR）是**线性注意力机制**算子，基于循环门控 Delta 规则（Recurrent Gated Delta Rule），以 SSM（状态空间模型）风格维护隐藏状态 `S_t` 并逐步更新。**与 flash attention 系列不同，本算子为 AIV-only（无 Cube 参与），串行遍历 token**（README L16-21）。\n\n## 1. 输入输出\n\n### 输入（def.cpp L22-71）\n\n| 输入 | 必选/可选 | 含义 | dtype | format |\n|---|---|---|---|---|\n| query | 必选 | q_t，[B,NK,DK] | BF16 | ND |\n| key | 必选 | k_t，[B,NK,DK] | BF16 | ND |\n| value | 必选 | v_t，[B,NV,DV] | BF16 | ND |\n| beta | 必选 | β_t，门控系数 | BF16 | ND |\n| state | 必选(输入/输出) | S_t，隐藏状态 | BF16 | ND |\n| actual_seq_lengths | 必选 | 实际序列长度(前缀和) | INT32 | ND |\n| ssm_state_indices | 必选 | SSM 状态索引 | INT32 | ND |\n| g | 可选 | 衰减系数 α=e^g | FLOAT | ND |\n| gk | 可选 | 衰减系数 αk=e^gk | FLOAT | ND |\n| num_accepted_tokens | 可选 | 接受的 token 数 | INT32 | ND |\n\n### 输出（def.cpp L73-81）\n- out：o_t，[B,NV,DV]（BF16）\n- state：S_t（REQUIRED，原地更新）\n\n### 属性（def.cpp L82）\n`scale_value`（默认1.0）。\n\n### 约束\n仅 BF16，仅 A2/A3。`dk`/`dv` 约束以 `docs/aclnnRecurrentGatedDeltaRule.md` 为准（`needs_verification`）。\n\n## 2. 核心公式（README L24-31）\n\n```\nS_t = α·Diag(αk)·S_{t-1} + β·(v_t - α·Diag(αk)·S_{t-1}·k_t)·k^T_t\no_t = S_t · q_t / √d\n```\n其中 `α = exp(g)`，`αk = exp(gk)`。`S_t ∈ [DV, DK]`，`q_t,k_t ∈ [DK]`，`v_t,o_t ∈ [DV]`。\n\n## 3. 计算流程\n\n**AIV-only**（kernel L31：`KERNEL_TYPE_AIV_ONLY`），无 CV 流水。\n\n| 阶段 | 操作 | 说明 |\n|---|---|---|\n| 1. Init | 读 tiling data，设全局 tensor 指针 | kernel.h L72 |\n| 2. 门控 | exp(g)/exp(gk) | 元素级 |\n| 3. 衰减 | α·Diag(αk)·S_{t-1} | 矩阵乘 |\n| 4. 误差 | v_t - decayed·k_t | 向量点积+减 |\n| 5. 更新 | S_t = decayed + β·(error)·k^T_t | 外积 |\n| 6. 输出 | o_t = S_t·q_t·scale | 矩阵-向量乘 |\n\n## 4. tiling 与 dispatch（详见 `tiling_dispatch_tables.md`）\n\nAIV-only 分核。`sBlockNum`/`vStep` 控制 V 维分块。`BUFFER_NUM=1`（无 double buffer）。BF16 输入 FP32 中间。\n\n## 5. 架构支持（README L7-12）\n\n| 产品 | 架构 | 支持 |\n|---|---|---|\n| Atlas A2/A3 训练/推理 | Ascend910B1/910_93 | √ |\n| 950/310P/训练系列 | - | × |\n\n## 6. Agent actions\n\n1. 识别为**线性注意力**（SSM 风格，非 QK matmul 主导），AIV-only。\n2. 核心公式 `S_t = α·Diag(αk)·S_{t-1} + β·(v - α·Diag(αk)·S_{t-1}·k)·k^T`：Triton 中 `tl.dot` 处理矩阵乘 + `tl.where` 处理误差 + 外积更新。\n3. 串行遍历 token（cu_seqlens 前缀和驱动），无 CUDA 式并行 S 轴。\n4. 可选 g/gk/num_accepted_tokens 用 `if constexpr` 处理。\n5. `BUFFER_NUM=1` 无 double buffer（CANN 特征）。\n6. 参考 `artifacts/recurrent-gated-delta-rule/recurrent-gated-delta-rule-triton-skeleton.py`（pseudocode）。\n\n## 7. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。dk/dv 精确约束、MTP 场景适用性、tiling 参数最优值未经硬件实测。Triton skeleton 标记 `reproducibility: pseudocode`。来源见 `ops-transformer-recurrent-gated-delta-rule`。\n\n\n", "runbooks/algorithm-numerics/gemm-low-dtype-fp32-accum.md": "\n\n## OPT-7 GEMM low_dtype + fp32 累加\n\n【优化维度】：数值｜混合精度\n【泛化层级】：条件性（迁移条件：量化权重的 matmul；失效边界：纯 fp32 matmul 无 low_dtype）\n\n<原则：cube 原生 fp16×fp16->fp32 / bf16×bf16->fp32，low_dtype 值在 fp32 精确可表，乘积精确，fp32 累加 == 标杆 fp32 split-K。把操作数先 to(f32) 再 dot 是非 cube 原生模式，慢且无精度收益。与 [[dequant-domain-dtype-split]] 配套。>\n\n<骨架（占位名伪码）：\nacc = tl.zeros((BLOCK_M, BLOCK_N), tl.float32)\nacc += tl.dot(x_low, w_dq_low)   # low_dtype 操作数，cube 原生 -> fp32 累加\n# 禁止：acc += tl.dot(x.to(f32), w.to(f32))  # 非 cube 原生，慢\n>\n\n**坏实践（反例）**：操作数先升 fp32 再 dot\n```python\nacc += tl.dot(x.to(tl.float32), w_dq.to(tl.float32))  # 非 cube 原生模式\n```\n后果：非 cube 原生模式，性能下降且无精度收益。✅ 正解即 low_dtype 操作数 + fp32 累加。\n\n**已知实例**：weight-quant-matmul W2（== 标杆 fp32 split-K）\n\n\n", "runbooks/memory-sram/block-ptr-vs-scalar-load.md": "\n\n## CT-11 matmul 必须用 tl.make_block_ptr，禁止退化为独立标量 tl.load\n\n【优化维度】：内存｜访存效率\n【泛化层级】：Triton通用（迁移条件：所有矩阵/块级 load/store；失效边界：明确只需单个元素的罕见场景）\n\n<原则：在 Ascend NPU 上，`tl.make_block_ptr` 会映射为硬件 block transfer 指令（类 DMA），一次搬运整个 tile，并自动获得边界检查、零填充和异步预取提示。若为了手动索引把 block_ptr 退化成多次独立 `tl.load(weight_ptr + d_offs * width + offset, mask=mask_w)`，每次 load 都是独立标量地址计算，丧失全部硬件加速。>\n\n**为什么性能差异大**：\n\n| 特性 | `tl.make_block_ptr` | 独立标量 `tl.load` |\n|---|---|---|\n| 指令类型 | 硬件 block transfer | 标量地址 load |\n| 边界检查 | 硬件级 `boundary_check` | 手动 mask（可能标量化） |\n| 零填充 | `padding_option` 自动 | 手动处理 |\n| 预取 | MTE2 可异步预取下一 tile | 无预取提示 |\n| 合并访存 | 连续 burst | 离散地址，burst 合并失败 |\n\n**正例（保留 block_ptr）**：\n\n```python\na_ptr = tl.make_block_ptr(\n    base=A_ptr,\n    shape=(M, K),\n    strides=(stride_am, stride_ak),\n    offsets=(pid_m * BLOCK_M, k_off),\n    block_shape=(BLOCK_M, BLOCK_K),\n    order=(1, 0),   # row-major：最后一维连续\n)\na = tl.load(a_ptr)\na_ptr = tl.advance(a_ptr, (0, BLOCK_K))  # K 循环推进\n```\n\n**坏实践（反例）**：\n\n```python\n# 为了循环展开，退化为 4 次独立标量 load\nw0 = tl.load(weight_ptr + d_offs * W + 0, mask=mask_w)\nw1 = tl.load(weight_ptr + d_offs * W + 1, mask=mask_w)\nw2 = tl.load(weight_ptr + d_offs * W + 2, mask=mask_w)\nw3 = tl.load(weight_ptr + d_offs * W + 3, mask=mask_w)\n```\n后果：在 D≥2048 的 Causal Conv1D Update kernel 中，可导致 2–3x 性能倒退。✅ 正解即保留 block_ptr，必要时用 `tl.extract_slice` 切分。\n\n**混合方案（保留硬件加速 + 手动索引）**：\n\n```python\n# 推荐：block_ptr 加载整个 tile，再用 extract_slice 切分\nw = tl.load(tl.make_block_ptr(weight_ptr, ..., block_shape=(D_CHK, W)))\nw0 = tl.extract_slice(w, (0, 0), (D_CHK, 1), (1, 1))  # view，零数据移动\nw1 = tl.extract_slice(w, (0, 1), (D_CHK, 1), (1, 1))\n# ...\n```\n\n**诊断清单**：\n1. profiling 中 `aiv_mte2_time` 或 `mte2_stall` 异常高。\n2. 代码中存在 `tl.load(ptr + expr_i)` 的循环/展开模式，其中 `expr_i` 是运行时变量。\n3. 确认该 load 本可以用 `tl.make_block_ptr` 表达。\n4. 重构为 block_ptr + `tl.extract_slice`。\n5. 重跑 profiling 验证 MTE2 下降。\n\n## 已知实例（P3 挂载）\n\n### Experience YAML 反链\n- `exp_perf_002` — 内存访问优化 （收益 25%）\n  - 适用于所有2D张量（如矩阵、特征图）的访存场景，tl.make_block_ptr可自动优化内存合并，相比手动计算指针减少约20%的访存开销，910b2/910b3平台效果尤为显著\n- `exp_perf_011` — 内存访问优化 （收益 50%）\n  - 手动指针替代block_ptr在Ascend上是一把双刃剑：它消除了boundary_check的标量开销，但要求开发者手动保证指针计算正确和mask完备。对确定性大块访存（如无边界tile），保留block_ptr仍可能获得更好的硬件预取。\n\n\n", "runbooks/memory-sram/exp_matmul_001.md": "\n\n## 访存优化：大尺寸 matmul 的 256 分块与 L0C 复用\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3，fp16/bf16，m/n ≥256、k ≥1024；失效边界：m/n/k <256 的小尺寸矩阵硬套 256 分块会导致 tile 大量 padding，应改用 128 分块；K 非 BLOCK_K 整数倍时尾部 mask 开销占比升高）\n\n### 原则\n- **分块策略**：L0级Tile采用128x128x128块划分，适配910b2/910b3 Cube L0层访存粒度\n- **数据排布**：输入张量nd保持不变，减少重排开销\n- **寄存器复用**：中间结果存入L0C，提升数据复用\n\n### 代码/骨架出处\n- `Triton`:\n```python\n@triton.jit def matmul_kernel(x, y, output, M, N, K, blockM=256, blockN=256, blockK=256, **kwargs):\n    # 256分块基础代码\n    pid = triton.program_id(0)\n    rm = pid // (N // blockN)\n    rn = pid % (N // blockN)\n    x_ptr = x + rm * blockM * K + triton.arange(0, blockM)[:, None] * K + triton.arange(0, blockK)[None, :]\n    y_ptr = y + rn * blockN + triton.arange(0, blockK)[:, None] * N + triton.arange(0, blockN)[None, :]\n    acc = triton.zeros((blockM, blockN), dtype=triton.float32)\n    for k in range(0, K, blockK):\n        a = triton.load(x_ptr, mask=triton.arange(0, blockK)[None, :] < K - k, other=0.0)\n        b = triton.load(y_ptr, mask=triton.arange(0, blockK)[:, None] < K - k, other=0.0)\n        acc += a @ b\n        x_ptr += blockK\n        y_ptr += blockK * N\n    acc = acc.to(x.dtype)\n    output_ptr = output + rm * blockM * N + triton.arange(0, blockM)[:, None] * N + triton.arange(0, blockN)[None, :]\n    triton.store(output_ptr, acc, mask=triton.arange(0, blockM)[:, None] < M - rm * blockM and triton.arange(0, blockN)[None, :] < N - rn * blockN)\n```\n\n**坏实践（反例）**：小尺寸矩阵硬套 256 分块\n```python\nBLOCK_M = BLOCK_N = BLOCK_K = 256        # m/n/k 仅百余的小矩阵仍用 256 分块\nacc = triton.zeros((256, 256), dtype=triton.float32)  # 累加器大面积为 padding\n```\n后果：tile 内大量无效 padding，Cube 单元利用率与有效带宽双双下降。✅ 正解：m/n/k ≥256 的大矩阵用 256 分块，L0 级内层 tile 按 128×128×128 划分以适配 Cube L0 访存粒度，中间结果驻留 L0C 提升复用；小尺寸矩阵退回 128 分块。\n\n**已知实例**：matmul §raw (`experiences/matmul/exp_matmul_001.yaml`)\n- 声称性能收益：40%\n- 备注：适用于 m/n/k≥256 的大尺寸矩阵，小尺寸矩阵建议使用 128 分块\n\n\n", "runbooks/memory-sram/exp_matmul_003.md": "\n\n## 切分优化：A、B 均不转置 matmul 的 512B 行宽对齐分块\n\n【优化维度】：Tiling/SRAM 预算\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3，fp32/fp16/bf16，m ≥128、n ≥256、k ≥256，A、B 均不转置；失效边界：分块行宽无法对齐 512B 整数倍（如 K 维过碎）时访存碎片抵消带宽收益；矩阵尺寸小于分块粒度时 tile 内 padding 浪费）\n\n### 原则\n- **分块策略**：适配Ascend后端512B行宽整数倍要求，M0=128、K0=256、N0=256划分分块行宽，单次行数最大化以充分发挥带宽\n- **带宽优化**：分块行宽严格对齐512B整数倍，减少访存碎片，提升Ascend后端带宽利用率\n- **数据复用**：大行数分块设计提升单次加载数据的计算复用率\n\n### 代码/骨架出处\n- `Triton`:\n```python\n@triton.jit def matmul_no_trans_kernel(x, y, output, M, N, K, blockM=128, blockK=256, blockN=256, **kwargs):\n    # A、B都不转置 - 适配Ascend 512B行宽的分块代码\n    pid = triton.program_id(0)\n    rm = pid // (N // blockN)\n    rn = pid % (N // blockN)\n    # 按M0=128、K0=256、N0=256分块计算指针\n    x_ptr = x + rm * blockM * K + triton.arange(0, blockM)[:, None] * K + triton.arange(0, blockK)[None, :]\n    y_ptr = y + rn * blockN + triton.arange(0, blockK)[:, None] * N + triton.arange(0, blockN)[None, :]\n    acc = triton.zeros((blockM, blockN), dtype=triton.float32)\n    for k in range(0, K, blockK):\n        a = triton.load(x_ptr, mask=triton.arange(0, blockK)[None, :] < K - k, other=0.0)\n        b = triton.load(y_ptr, mask=triton.arange(0, blockK)[:, None] < K - k, other=0.0)\n        acc += a @ b\n        x_ptr += blockK\n        y_ptr += blockK * N\n    acc = acc.to(x.dtype)\n    output_ptr = output + rm * blockM * N + triton.arange(0, blockM)[:, None] * N + triton.arange(0, blockN)[None, :]\n    triton.store(output_ptr, acc, mask=triton.arange(0, blockM)[:, None] < M - rm * blockM and triton.arange(0, blockN)[None, :] < N - rn * blockN)\n```\n\n**坏实践（反例）**：分块行宽不对齐 512B 整数倍\n```python\nBLOCK_M, BLOCK_K, BLOCK_N = 96, 192, 192   # fp16 下行宽 192×2B=384B，非 512B 整数倍\nfor k in range(0, K, BLOCK_K):\n    a = triton.load(x_ptr, ...)            # GM→UB 行访问跨对齐边界，产生访存碎片\n```\n后果：GM→UB 连续行访问被对齐边界切碎，访存事务数增多，后端带宽利用率下降。✅ 正解：M0=128、K0=256、N0=256，分块行宽严格对齐 512B 整数倍，单次加载行数最大化，提升数据计算复用率。\n\n**已知实例**：matmul §raw (`experiences/matmul/exp_matmul_003.yaml`)\n- 声称性能收益：10%\n- 备注：适用于 A、B 矩阵均不转置的 matmul 场景，分块行宽严格对齐后端 512B 整数倍要求，最大化带宽利用\n\n\n", "runbooks/memory-sram/exp_matmul_004.md": "\n\n## 切分优化：A 不转置、B 转置 matmul 的 K0=256 统一分块\n\n【优化维度】：Tiling/SRAM 预算\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3，fp32/fp16/bf16，m ≥128、n ≥128、k ≥256，A 不转置、B 转置；失效边界：K <256 时 K0=256 固定分块产生大量尾部 mask，padding 占比升高；A、B 均不转置的场景应改用 M0/K0/N0 组合分块（见对应条目））\n\n### 原则\n- **分块策略**：统一分块行宽K0=256（满足512B整数倍），M0和N0可灵活调整，优先保证K0对齐\n- **带宽优化**：单一K0分块减少分块适配开销，提升Ascend后端带宽利用率\n- **兼容性**：M0/N0宽松限制适配不同尺寸矩阵的转置乘法场景\n\n### 代码/骨架出处\n- `Triton`:\n```python\n@triton.jit def matmul_a_no_trans_b_trans_kernel(x, y, output, M, N, K, blockM=256, blockK=256, blockN=256, **kwargs):\n    # A不转置、B转置 - K0=256统一分块行宽\n    pid = triton.program_id(0)\n    rm = pid // (N // blockN)\n    rn = pid % (N // blockN)\n    # B转置后调整指针计算逻辑，K0固定为256\n    x_ptr = x + rm * blockM * K + triton.arange(0, blockM)[:, None] * K + triton.arange(0, blockK)[None, :]\n    y_ptr = y + rn * blockK * N + triton.arange(0, blockK)[:, None] + triton.arange(0, blockN)[None, :] * N\n    acc = triton.zeros((blockM, blockN), dtype=triton.float32)\n    for k in range(0, K, blockK):\n        a = triton.load(x_ptr, mask=triton.arange(0, blockK)[None, :] < K - k, other=0.0)\n        b = triton.load(y_ptr, mask=triton.arange(0, blockK)[:, None] < K - k, other=0.0)\n        acc += a @ b\n        x_ptr += blockK\n        y_ptr += blockK\n    acc = acc.to(x.dtype)\n    output_ptr = output + rm * blockM * N + triton.arange(0, blockM)[:, None] * N + triton.arange(0, blockN)[None, :]\n    triton.store(output_ptr, acc, mask=triton.arange(0, blockM)[:, None] < M - rm * blockM and triton.arange(0, blockN)[None, :] < N - rn * blockN)\n```\n\n**坏实践（反例）**：B 转置场景逐 case 更换 K0，行宽不对齐 512B\n```python\nBLOCK_K = 128                            # fp16 下行宽 128×2B=256B，非 512B 整数倍\nfor k in range(0, K, BLOCK_K):\n    b = triton.load(y_ptr, ...)          # 转置 B 的行访问跨对齐边界\n```\n后果：多套 K0 适配增加分块开销，且行宽不对齐 512B 导致访存碎片，带宽利用率下降。✅ 正解：K0 统一固定为 256（满足 512B 整数倍），M0/N0 按实际矩阵尺寸灵活调整，优先保证 K0 对齐。\n\n**已知实例**：matmul §raw (`experiences/matmul/exp_matmul_004.yaml`)\n- 声称性能收益：10%\n- 备注：适用于 A 不转置、B 转置的 matmul 场景，K0 固定为 256 满足 512B 整数倍要求，M0/N0 可根据实际矩阵尺寸灵活调整\n\n\n", "runbooks/memory-sram/exp_matmul_005.md": "\n\n## 切分优化：双转置矩阵乘的 512B 对齐分块\n\n【优化维度】：Tiling/SRAM 预算\n【泛化层级】：条件性（迁移条件：硬件 910b2/910b3，fp32/fp16/bf16，A、B 矩阵均转置且 M≥256、N≥128、K≥256；失效边界：A、B 未同时转置时数据排布不同，该分块规则不适用；M<256 或 K<256 时分块行宽跌破 512B 整数倍，对齐收益稀释；无 512B 对齐约束的后端不适用）\n\n### 原则\n- **分块策略**：按M0=256、K0=256、N0=128划分分块行宽，适配Ascend后端512B整数倍要求\n- **带宽优化**：双转置场景下优先保证M0/K0对齐512B，平衡N0的访存效率\n- **数据排布**：转置后矩阵指针计算适配分块规则，减少内存重排开销\n\n### 代码/骨架出处\n- `Triton`:\n```python\n@triton.jit def matmul_both_trans_kernel(x, y, output, M, N, K, blockM=256, blockK=256, blockN=128, **kwargs):\n    # A、B都转置 - M0=256、K0=256、N0=128分块代码\n    pid = triton.program_id(0)\n    rm = pid // (N // blockN)\n    rn = pid % (N // blockN)\n    # 双转置矩阵按指定分块计算指针\n    x_ptr = x + rm * blockK * M + triton.arange(0, blockK)[:, None] + triton.arange(0, blockM)[None, :] * M\n    y_ptr = y + rn * blockK * N + triton.arange(0, blockK)[:, None] + triton.arange(0, blockN)[None, :] * N\n    acc = triton.zeros((blockM, blockN), dtype=triton.float32)\n    for k in range(0, K, blockK):\n        a = triton.load(x_ptr, mask=triton.arange(0, blockK)[:, None] < K - k, other=0.0)\n        b = triton.load(y_ptr, mask=triton.arange(0, blockK)[:, None] < K - k, other=0.0)\n        acc += a @ b\n        x_ptr += blockK * M\n        y_ptr += blockK * N\n    acc = acc.to(x.dtype)\n    output_ptr = output + rm * blockM * N + triton.arange(0, blockM)[:, None] * N + triton.arange(0, blockN)[None, :]\n    triton.store(output_ptr, acc, mask=triton.arange(0, blockM)[:, None] < M - rm * blockM and triton.arange(0, blockN)[None, :] < N - rn * blockN)\n```\n\n**坏实践（反例）**：双转置场景沿用未对齐的均一分块（行宽不足 512B）\n```python\nBLOCK_M, BLOCK_K, BLOCK_N = 128, 128, 128   # 行宽 128×2B(fp16)=256B，不足 512B\nx_ptr = x + rm * BLOCK_K * M + arange(0, BLOCK_K)[:, None] + arange(0, BLOCK_M)[None, :] * M\na = tl.load(x_ptr, ...)                     # 每次 GM→UB 传输均为非 512B 对齐突发\n```\n后果：GM→UB 访存行宽不满足 512B 整数倍，产生拆分的非对齐突发，带宽利用率下降，卡片所述 32% 收益流失。✅ 正解：双转置场景优先保证 M0=256、K0=256 对齐 512B（fp16 下行宽 512B），N0=128 适配转置后数据排布，在不对齐维度上平衡访存效率。\n\n**已知实例**：matmul §raw (`experiences/matmul/exp_matmul_005.yaml`)\n- 声称性能收益：32%\n- 备注：适用于A、B矩阵均转置的matmul场景，M0=256、K0=256满足512B整数倍，N0=128适配转置后的数据排布\n\n\n", "runbooks/memory-sram/row-width-512b-align.md": "\n\n## CT-10 Cube-Vector 行宽 512B 对齐\n\n【优化维度】：内存｜硬件对齐\n【泛化层级】：Triton通用（迁移条件：Cube-Vector 场景，含 matmul 与需要 Cube 单元参与的向量化 load；失效边界：纯 Vector-Vector 元素级操作适用 32B 对齐，见对应 CT）\n\n<原则：Ascend Cube 单元要求参与计算的矩阵/张量行宽为 512B 整数倍。违反时硬件触发 partial cache-line read，有效内存带宽显著低于 ~1.8 TB/s 峰值，在 profiling 中表现为 `aiv_mte2_time` 异常升高；同时 partial cache-line 使一次 load 拆成两次 L2 读取，bank conflict 概率翻倍。>\n\n<约束：matmul 的 `BLOCK_N * dtype_bytes` 必须为 512 的整数倍；所有参与 Cube-Vector 计算的张量行宽同理。>\n<违反后果：非对齐行宽导致 MTE2 partial cache-line read，有效带宽下降；大矩阵场景下常与 L2 bank conflict 叠加。>\n<满足方式：按 dtype 选择最小对齐元素数；必要时对尾部 padding；autotune 候选必须满足。>\n\n| dtype | 元素大小 | 最小对齐元素数 | 推荐 matmul BLOCK_N | 推荐 BLOCK_K |\n|---|---|---|---|---|\n| fp8 | 1B | 512 | 256 | 256 |\n| fp16 / bf16 | 2B | 256 | 128 或 256 | 256 |\n| fp32 | 4B | 128 | 128 | 128 或 256 |\n\n```python\n# matmul 标准搜索空间（已满足 512B 行宽对齐）\nconfigs = [\n    triton.Config({'BLOCK_M': bm, 'BLOCK_N': bn, 'BLOCK_K': 256, 'GROUP_SIZE': gs})\n    for bm in [128, 256]\n    for bn in [128, 256]    # 均为 256 的整数倍（fp16/bf16）\n    for gs in [8, 16, 32]\n]\n```\n\n**坏实践（反例）**：\n```python\nBLOCK_N = 100  # fp16: 200 bytes，非 512B 整数倍\n```\n后果：Cube-Vector load 退化为 partial cache-line，MTE2 带宽利用率低，kernel 变成 memory-bound；与 bank conflict 叠加时 `aiv_mte2_time` 可达 theoretical 的 2–5 倍。✅ 正解即 `BLOCK_N` 取 256/128/512 的整数倍。\n\n## 已知实例（P3 挂载）\n\n### Experience YAML 反链\n- `exp_matmul_003` — 切分优化 （收益 10%）\n  - 适用于A、B矩阵均不转置的matmul场景，分块行宽严格对齐Ascend后端512B整数倍要求，最大化带宽利用\n- `exp_matmul_005` — 切分优化 （收益 32%）\n  - 适用于A、B矩阵均转置的matmul场景，M0=256、K0=256满足512B整数倍，N0=128适配转置后的数据排布\n\n\n", "runbooks/meta-skills/dot-vs-matmul-precision-diagnosis.md": "\n\n## DG-7 tl.dot vs torch.matmul 精度差异\n\n【优化维度】：元技能｜精度修复链\n【泛化层级】：条件性（迁移条件：tl.dot 结果与 torch.matmul 数值不一致；失效边界：纯 fp32 且 shape 大时差异可忽略）\n\n<判定依据：tl.dot 用 fp32 累加器 + low_dtype 操作数（cube 原生），torch.matmul NPU 可能用不同累加策略或 cube/vector 路径分流。小 shape 时 tl.dot 的 tensor-core 精度问题突出。与 [[gemm-low-dtype-fp32-accum]] 配套：W2 是正确做法，本条是差异诊断。>\n\n<诊断决策链：\ntl.dot 结果与 torch.matmul 不一致\n├─ 对比双参考：\n│  - diff_vs_torch_cpu = |triton - torch_cpu_fp32|  # CPU fp32 为权威参考\n│  - diff_vs_torch_npu = |triton - torch_npu|       # NPU matmul 可能用不同策略\n├─ 分支判断：\n│  ├─ diff_vs_torch_cpu 大 且 diff_vs_torch_npu 小\n│  │  -> torch_npu 与 triton 都用了相同（非 fp32）策略，CPU fp32 才是真相\n│  │  -> 若 verify 用 CPU fp32 golden，需对齐累加精度\n│  ├─ diff_vs_torch_cpu 小 且 diff_vs_torch_npu 大\n│  │  -> torch_npu 走了不同路径（如 cube vs vector），triton 对齐 CPU\n│  │  -> 通常可接受（triton 更准）\n│  └─ 两者都大 -> triton 实现有 bug（累加顺序/dtype 转换点错误）\n├─ shape 相关性检查：\n│  ├─ 小 shape（M<=64,K<=256,N<=512）差异大 -> tensor-core 精度问题\n│  │  -> 改用 vector multiply-sum kernel（tl.sum(x*w)）规避 tl.dot\n│  └─ 大 shape 差异小 -> cube 路径正常，差异在可接受范围\n└─ dtype 相关性：int8/fp16 差异 > bf16 > fp32（累加精度敏感度）\n>\n\n<诊断骨架（占位名伪码）：\n# 双参考对比\nc_triton = triton_dot(a, b)              # tl.dot + fp32 累加\nc_torch_cpu = torch.matmul(a.cpu().float(), b.cpu().float())  # CPU fp32 权威\nc_torch_npu = torch.matmul(a, b)         # NPU matmul\ndiff_cpu = (c_triton.float() - c_torch_cpu).abs().max()\ndiff_npu = (c_triton.float() - c_torch_npu).abs().max()\n# 按 shape/dtype 分支定位\n>\n\n**坏实践（反例）**：只对比 torch_npu 就下结论\n```python\ndiff = (triton_out - torch_npu_out).abs().max()\nif diff > threshold: print(\"triton 错\")  # 未对比 CPU fp32 权威参考\n```\n后果：可能 torch_npu 本身非权威（用了不同累加策略），误判 triton 错。✅ 正解即双参考对比 + shape/dtype 分支。\n\n**已知实例**：verify_dot_vs_matmul.py（fp16/fp32/bf16/int8 多 dtype 对比）、op_8_WeightQuantBatchmatmul（小 shape vector kernel 规避 tensor-core）\n\n\n", "runbooks/meta-skills/quant-matmul-autotune-strategy.md": "\n\n## DG-5 量化 matmul autotune 配置策略\n\n【优化维度】：元技能｜瓶颈诊断\n【泛化层级】：条件性（迁移条件：量化 matmul speedup <0.5 且多 shape 范围；失效边界：单 shape 场景无须 autotune 多配置）\n\n<判定依据：量化 matmul 的 shape 范围广（M/K/N 差异大），单一 BLOCK 配置无法覆盖。autotune 要按 shape 范围特化多配置，而非追求单一最优。multibuffer 在 matmul 上可能劣化（与 [[multibuffer-empirical]] 一致）；BLOCK_M=512 过大会回退。与 [[blockm-256-large-m]] 配套。>\n\n<诊断决策树（speedup 低时的 autotune 策略）：\nspeedup < 0.5 且多 shape\n├─ 检查 multibuffer：matmul 上可能劣化（opt_iter_6: 0.3684 vs 基线 0.3749）\n│  -> 关闭 multibuffer 或实测验证（见 [[multibuffer-empirical]]）\n├─ 检查 BLOCK_M：BLOCK_M=512 过大回退（opt_iter_10: 0.3921 vs 0.4129）\n│  -> 大 M 用 BLOCK_M=256（见 [[blockm-256-large-m]]），不要盲目 512\n├─ 按 shape 范围特化 autotune 配置：\n│  ├─ 小 K（K<=256）-> 加 BLOCK_K=32 配置（opt_iter_9: +2.8% 最佳）\n│  ├─ 大 N（N=16384）-> 加 BLOCK_N=512 配置（opt_iter_8: +0.9%）\n│  └─ 小 shape（M<=64,K<=256,N<=512）fp16 -> vector multiply-sum kernel\n│     规避 tl.dot tensor-core 精度问题（见 [[gemm-low-dtype-fp32-accum]]）\n└─ group_size 特化：pergroup32/64/128/256 各一个 kernel，BLOCK_K 对齐 group_size\n>\n\n<配置演进实测（op_8 WeightQuantBatchmatmul）：\n| 迭代 | 策略 | 加速比 |\n|---|---|---|\n| iter_16 基线 | group_size 特化 + per-group BLOCK_K 对齐 | 0.3749 |\n| opt_iter_6 | multibuffer=True | 0.3684（劣化）|\n| opt_iter_7 | 扩展 autotune 17 配置 | 0.3977（+6.1%）|\n| opt_iter_9 | +BLOCK_K=32（小 K）| 0.4129（最佳）|\n| opt_iter_10 | +BLOCK_M=512（大 M）| 0.3921（回退）|\n>\n\n**坏实践（反例）**：单一配置或盲目增大 BLOCK\n```python\n@triton.autotune(configs=[triton.Config({'BLOCK_M':512,'BLOCK_N':512,'BLOCK_K':128})], key=['M','N','K'])\n# 单一配置，小 shape 不适配；BLOCK_M=512 过大回退\n```\n后果：小 K shape 用大 BLOCK_K 浪费迭代，大 M 用 512 回退。✅ 正解即按 shape 范围多配置特化。\n\n**已知实例**：op_8_WeightQuantBatchmatmul（16 轮 gen + 9 轮 opt，0.0562->0.4129）\n\n\n", "runbooks/compute-pipeline/core-mapping-strategy-selection.md": "\n\n## DG-8 matmul core mapping 策略选择（列/行/对角）\n\n【优化维度】：计算｜多核负载\n【泛化层级】：条件性（迁移条件：2D block 划分的 matmul；失效边界：1D 划分、矩阵过小、无共享输入模式）\n\n<原则：core mapping 决定相邻 program 处理哪些 (M,N) 输出块，进而决定它们共享 A/B 输入切片的模式。选错策略会让相邻 core 同时命中同一 L2 bank（bank conflict）或降低 L2 复用，损失 20–40% 性能。>\n\n**三种策略对比**：\n\n| 策略 | 相邻 PID 访问模式 | 最佳形状 | GROUP_SIZE | 核心效果 |\n|---|---|---|---|---|\n| 默认列（Column） | 同一 N 列，不同 M 行 | N >> M（高瘦） | 8/16/32 | B 矩阵复用最大 |\n| 默认行（Row） | 同一 M 行，不同 N 列 | M >> N（矮胖） | 8/16/32 | A 矩阵复用最大 |\n| 对角（Diagonal） | 不同 M 行且不同 N 列 | M ≥ 512, N ≥ 512 | 8/16/32 | 分散 L2 bank，消除 conflict |\n\n**访问模式示意图（4×4 tile 网格，GROUP_SIZE=4）**：\n\n```\nColumn 映射：            Row 映射：              Diagonal 映射：\nPID 0 1 2 3             PID 0 1 2 3            PID 0 1 2 3\nM   0 1 2 3             M   0 0 0 0            M   0 1 2 3\nN   0 0 0 0             N   0 1 2 3            N   0 1 2 3\n                        \nPID 4 5 6 7             PID 4 5 6 7            PID 4 5 6 7\nM   0 1 2 3             M   1 1 1 1            M   0 1 2 3\nN   1 1 1 1             N   0 1 2 3            N   1 2 3 0\n```\n\n**形状决策树**：\n\n```\nM >= 512 AND N >= 512 ?\n  YES → Diagonal (dl.grouped_launch_diagonal)\n  NO  → N > M * 2 ?\n          YES → Default Column\n          NO  → M > N * 2 ?\n                    YES → Default Row\n                    NO  → Default Column (safe default)\n```\n\n**GROUP_SIZE 选择**：\n\n| GROUP_SIZE | 适用场景 | 取舍 |\n|---|---|---|\n| 8 | 默认；小到中等矩阵 | 组内复用适中，负载均衡好 |\n| 16 | M 或 N 在 512–2048 | 增加 K 维复用，需 grid 可被整除 |\n| 32 | M 或 N ≥ 2048 | 最大组内复用，负载均衡风险上升 |\n\n**最小 autotune 配置**：至少覆盖 3 个 GROUP_SIZE：\n\n```python\nconfigs = [\n    triton.Config({'BLOCK_M': 128, 'BLOCK_N': 128, 'BLOCK_K': 256, 'GROUP_SIZE': 8}),\n    triton.Config({'BLOCK_M': 256, 'BLOCK_N': 256, 'BLOCK_K': 256, 'GROUP_SIZE': 16}),\n    triton.Config({'BLOCK_M': 256, 'BLOCK_N': 256, 'BLOCK_K': 256, 'GROUP_SIZE': 32}),\n]\n```\n\n**坏实践（反例）**：\n```python\npid_m = pid // num_pid_n\npid_n = pid % num_pid_n  # 纯线性映射，无视形状\n```\n后果：大矩阵下相邻 PID 访问同一 B 列，L2 bank conflict 严重。✅ 正解即按形状选列/行/对角策略。\n\n> **注意**：Ascend 上 `tl.swizzle2d` 行为未定义，对角映射请使用 `triton_ascend.language.grouped_launch_diagonal`。详见 [大矩阵 matmul 用对角 core mapping 消除 L2 bank conflict](diagonal-core-mapping-l2-bank-conflict.md)。\n\n## 已知实例（P3 挂载）\n\n### Experience YAML 反链\n- `exp_matmul_ascend_diag_001` — Scheduling Optimization （收益 25%）\n  - The diagonal partitioning logic is triggered only when both M and N dimensions are sufficiently large (>= 8 blocks). Otherwise, it falls…\n  - 对应 kernel: `raw_experiences/extracted_kernels/031-matmul_kernel.py`\n- `exp_rope_matmul_001` — Hardware Adaptation Optimization （收益 35%）\n  - The 'dl' module usage indicates this is optimized for specific NPU hardware (likely Ascend series). The \"dot_pad_only_k\" hint is critical…\n  - 对应 kernel: `raw_experiences/extracted_kernels/057-_single_rope_matmul_kernel.py`\n- `exp_partial_matmul_001` — Compute Optimization （收益 25%）\n  - This kernel relies on the `dl` (Dialect) module for compile hints and an external `grouped_launch_diagonal` function for block mapping. It…\n  - 对应 kernel: `raw_experiences/extracted_kernels/082-partial_matmul_kernel.py`\n\n### Extracted Kernel 反链\n- `239-grouped_launch_diagonal.py` — extracted kernel（source: `raw_experiences/extracted_kernels/239-grouped_launch_diagonal.py`）\n\n\n", "runbooks/compute-pipeline/diagonal-core-mapping-l2-bank-conflict.md": "\n\n## OPT-19 对角 core mapping 消除 L2 bank conflict\n\n【优化维度】：计算｜多核负载\n【泛化层级】：条件性（迁移条件：2D block 划分的大矩阵 matmul，相邻 program 共享输入块导致 L2 bank conflict；失效边界：1D 划分、矩阵过小或访问模式本身已分散）\n\n<原则：Ascend L2 cache 分多 bank。默认按列/行映射时，相邻 block_id 访问同一 B 列或相邻 A 行，多个 core 同时命中同一 bank，访问被串行化，有效带宽下降。对角映射让相邻 program 落到不同 (M, N) 位置，分散 L2 bank 访问，降低 `aiv_mte2_time`。>\n\n**为什么相邻 PIDs 会冲突（示意图）**：\n\n```\n默认 Column 映射（冲突）：\nCore 0: A[row=0..127, :]   × B[:, col=0..127]   ← 与 Core 1 读同一 B 列\nCore 1: A[row=128..255, :] × B[:, col=0..127]   ← 与 Core 0 读同一 B 列\nCore 2: A[row=256..383, :] × B[:, col=0..127]   ← 与 Core 0/1 读同一 B 列\n结果：Core 0/1/2 同时读同一 L2 bank → 串行化\n\n对角映射（无冲突）：\nCore 0: A[row=0..127, :]   × B[:, col=0..127]    ← 唯一 B 列\nCore 1: A[row=128..255, :] × B[:, col=128..255]  ← 唯一 B 列\nCore 2: A[row=256..383, :] × B[:, col=256..383]  ← 唯一 B 列\n结果：每个 core 读不同 L2 bank → 无串行化\n```\n\n<骨架（占位名伪码）：\nimport triton_ascend.language as dl\n\npid = tl.program_id(0)\nnum_pid_m = tl.cdiv(M, BLOCK_M)\nnum_pid_n = tl.cdiv(N, BLOCK_N)\n\n# 对角重映射：相邻 pid -> 不同 (M, N) bank\npid_m, pid_n = dl.grouped_launch_diagonal(pid, num_pid_m, num_pid_n, GROUP_SIZE)\n\n# 后续按 pid_m / pid_n 计算 base 指针\nrm = pid_m * BLOCK_M\nrn = pid_n * BLOCK_N\n>\n\n**诊断阈值**：\n\n```\nTheoretical_mte2_time = Data_volume / HBM_bandwidth\n                      = (M*K + K*N + M*N) * dtype_bytes / 1.8e12\n```\n\n| 实测 / 理论 | 解读 |\n|---|---|\n| ≈ 1x | 访存高效，无明显 bank conflict |\n| 2–5x | 存在 bank conflict 或不对齐 |\n| > 5x | 严重 bank conflict 或完全未对齐 |\n\n**触发条件**：`M ≥ 512` 且 `N ≥ 512` 的大矩阵 matmul 优先启用；若同时伴随 512B 行宽未对齐，问题会叠加（先修对齐再修 mapping）。\n\n**GROUP_SIZE 选择**：\n- 默认 `GROUP_SIZE = 8`：同组内相邻 PID 共享 K 维切片，提升 L2 复用。\n- `K` 很大时尝试 `16` 或 `32`：进一步增加 K 维复用，但会降低组内 spatial diversity，需 autotune 验证。\n\n**诊断清单**：\n1. 跑 profiling 拿到 `aiv_mte2_time`。\n2. 用上面公式算 theoretical time。\n3. 比值 > 2x → 怀疑 bank conflict。\n4. 确认 `M ≥ 512 AND N ≥ 512` → 应用对角映射。\n5. 确认行宽 512B 对齐（见 [Cube-Vector 行宽 512B 对齐](../memory-sram/row-width-512b-align.md)）。\n6. 重跑 profiling 确认 `aiv_mte2_time` 回落。\n\n**坏实践（反例）**：\n```python\npid_m = pid // num_pid_n\npid_n = pid % num_pid_n   # 线性行列映射\n```\n后果：相邻 program 访问同一 B 列，L2 bank conflict，有效带宽下降。✅ 正解即 `dl.grouped_launch_diagonal` 对角映射。\n\n> **注意**：Ascend 上 `tl.swizzle2d` 行为未定义，应使用 `triton_ascend.language.grouped_launch_diagonal` 作为 L2 bank conflict 的规避手段。与 [swizzle2d 块重排](swizzle2d-block-reorder.md) 目标相同（提升 L2 复用/降低冲突），但实现原语不同。\n\n## 已知实例（P3 挂载）\n\n### Experience YAML 反链\n- `exp_matmul_diag_tiling_001` — Scheduling Optimization （收益 25%）\n  - 本优化专为昇腾 910B 大规模矩阵场景设计，核心目标是缓解内存带宽压力与 L2 Cache 容量 瓶颈。对角线分核在 M、N 方向均超过 BLOCK_TRESHHOLD 个基本块时生效，右矩阵大小超过 L2 Cache 容量时优化效果尤为显著。输出结果以 bfloat16…\n\n\n", "runbooks/compute-pipeline/exp_addmm_ascend_001.md": "\n\n## Scheduling Optimization: dynamic autotuning\n\n【优化维度】：多核并行与负载均衡\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3, 91093, 91095；失效边界：M/N/K < 128 的小 shape 上调优空间小，autotune 开销可能抵消收益；依赖调优配置表覆盖目标 shape，未覆盖的 shape 退化为默认配置；do_not_specialize 不适用于影响控制流或边界判断的标量参数）\n\n### 原则\n- **dynamic autotuning**：The kernel leverages `runtime.get_tuned_config(\"addmm\")` to dynamically select the optimal tile sizes (blockM, blockN, blockK) based on the runtime dimensions of M, N, and K. This allows the kernel to adapt to different matrix shapes, maximizing hardware utilization compared to static tiling.\n- **strict precision control**：The `tl.dot` operation is explicitly configured with `allow_tf32=False`. This ensures that the computation maintains high numerical precision by avoiding reduced-precision TensorFloat-32 formats, which is crucial for training stability and models sensitive to accumulation errors.\n- **stride agnostic memory access**：The kernel calculates memory pointers using stride arguments (`stride_am`, `stride_ak`, etc.) rather than assuming contiguous memory. This allows the kernel to operate directly on transposed matrices or sliced tensors without requiring an explicit layout transformation (transpose/permute) prior to the kernel launch, saving memory bandwidth.\n- **compilation optimization**：The `do_not_specialize` attribute is applied to scalar arguments `alpha` and `beta`. This prevents the JIT compiler from generating a unique kernel version for every distinct scalar value, significantly reducing compilation overhead and binary size while maintaining execution speed.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/119-addmm_kernel.py\n```\n\n**坏实践（反例）**：为 matmul 类 kernel 写死单一 tile 配置（如 BLOCK_M=BLOCK_N=BLOCK_K=128）覆盖所有 shape → 狭长 shape（小 M 大 N 或大 M 小 N）上 AICore 利用率不足，大 shape 上 tile 又可能超出 UB 预算导致 spill → ✅ 正解即本条：按运行时 M/N/K 动态选择 tile 配置。\n\n**已知实例**：matmul §raw (`experiences/matmul/exp_addmm_ascend_001.yaml`)\n- 声称性能收益：25%\n- 备注：The kernel utilizes `tle` (Triton Language Extensions) and `@libentry()`, indicating it is specifically optimized for the Ascend NPU architecture (910 series) via the Torch-NPU/Triton integration.\n\n\n", "runbooks/compute-pipeline/exp_digit_hist_001.md": "\n\n## Compute Optimization: gemm based histogram\n\n【优化维度】：AICore 单元利用/Scalar 削减\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3；失效边界：bins_segment > 16 时 one-hot GEMM 的矩阵规模膨胀、收益下降；n_elements < 1024 时标量循环开销本就不大，GEMM 化无收益；bin 数为 2 的幂（如 4-bit radix→16）时循环才能完全展开）\n\n### 原则\n- **gemm based histogram**：Replace the iterative bin counting loop (for s in range(bins_segment)) with a one-hot encoding followed by a matrix multiplication (tl.dot). This maps the reduction to a highly optimized GEMM operation, leveraging the NPU's Cube unit for parallel counting instead of scalar ALU loops.\n- **loop unrolling**：If bins_segment is small and constant (e.g., 16 for 4-bit radix), ensure the loop is fully unrolled to minimize branch prediction overhead and allow the compiler to optimize the mask generation logic.\n- **memory access coalescing**：The store operation to digit_hist is performed inside the inner loop. Ensure that the stride of the write access (grid0) results in coalesced global memory transactions to maximize bandwidth utilization.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/136-digit_hist_kernel.py\n```\n\n**坏实践（反例）**：用 `for s in range(bins_segment)` 标量循环逐 bin 比较计数 → 纯标量 ALU 串行执行，Cube 单元完全闲置 → ✅ 正解即本条：one-hot 编码 + `tl.dot` 把 bin 计数映射为 GEMM，交给矩阵单元并行完成。\n\n**已知实例**：misc §raw (`experiences/misc/exp_digit_hist_001.yaml`)\n- 声称性能收益：50%\n- 备注：The current implementation uses a scalar loop for bin counting which is inefficient for larger block sizes. The GEMM-based approach is recommended for Ascend 910 series to achieve high throughput.\n\n\n", "runbooks/compute-pipeline/exp_fused_norm_rope_matmul_001.md": "\n\n## Scheduling Optimization: hardware unit isolation\n\n【优化维度】：多核并行与负载均衡\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3；失效边界：依赖 dl dialect 异构调度（CANN/Triton 栈支持）；融合链各 stage 间数据必须能驻留 L0/L1；归一化/rope 的 vector 侧耗时若接近 matmul 的 cube 侧，流水重叠空间才存在，否则收益减半）\n\n### 原则\n- **hardware unit isolation**：The kernel explicitly utilizes `dl.async_task` to dispatch the matrix multiplication (`partial_matmul_kernel`) to the Cube unit and the normalization/RoPE operations (`fused_single_norm_and_partial_rope_kernel`) to the Vector unit. This maximizes utilization by allowing the specialized hardware units to operate in parallel or pipelined fashion.\n- **operator fusion**：RMSNorm and Rotary Positional Embedding (RoPE) are fused into a single kernel execution stream. This significantly reduces global memory read/write overhead by keeping intermediate data in high-speed memory or registers, avoiding the need to write back normalized activations before applying RoPE.\n- **asynchronous pipeline**：By using `scope=dl.async_task.cube` and `scope=dl.async_task.vector`, the implementation enables asynchronous execution. This allows the compute-intensive matrix multiplication on the Cube to potentially overlap with the vector operations or data movement, effectively hiding latency and improving throughput.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/081-fused_single_norm_rope_matmul_kernel.py\n```\n\n**坏实践（反例）**：归一化、RoPE、matmul 各自独立 kernel → 中间激活多次 HBM 往返，cube/vector 串行等待 → ✅ 正解即本条：vector 侧融合归一化+RoPE，cube 侧做 matmul，async scope 流水重叠。\n\n**已知实例**：matmul §raw (`experiences/matmul/exp_fused_norm_rope_matmul_001.yaml`)\n- 声称性能收益：35%\n- 备注：This optimization is highly effective for Transformer decoder layers where Matmul is followed by Norm and RoPE. It requires the underlying hardware and compiler stack (e.g., CANN with Triton) to support the `dl` dialect and heterogeneous task scheduling.\n\n\n", "runbooks/compute-pipeline/exp_matmul_002.md": "\n\n## 计算优化: fixpipe 随路量化 + K 维循环展开 + 预取\n\n【优化维度】：AICore 单元利用/Scalar 削减\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3；失效边界：随路量化依赖 Cube fixpipe 硬件通路，非 Ascend 平台不可用；K 维 4 路展开要求 K ≥ 1024 级别，K 小时展开 tail 处理占比升高；预取深度受 UB 容量约束；仅适配 Triton 框架（备注自述））\n\n### 原则\n- **量化融合**：将fp16计算与Cube fixpipe随路量化融合，提升计算效率\n- **循环展开**：展开K维循环，减少分支判断开销\n- **内存预取**：使用triton.preload做数据预取，隐藏访存延迟\n\n### 代码/骨架出处\n- `Triton`:\n```python\n@triton.jit def matmul_optimized_kernel(x, y, output, M, N, K, **kwargs):\n    # 融合预取+循环展开的优化代码\n    pid = triton.program_id(0)\n    rm = pid // (N // 256)\n    rn = pid % (N // 256)\n    x_ptr = x + rm * 256 * K + triton.arange(0, 256)[:, None] * K + triton.arange(0, 256)[None, :]\n    y_ptr = y + rn * 256 + triton.arange(0, 256)[:, None] * N + triton.arange(0, 256)[None, :]\n    acc = triton.zeros((256, 256), dtype=triton.float32)\n    # 循环展开4次\n    for k in range(0, K, 256*4):\n        a1 = triton.load(x_ptr, mask=triton.arange(0, 256)[None, :] < K - k, other=0.0)\n        b1 = triton.load(y_ptr, mask=triton.arange(0, 256)[:, None] < K - k, other=0.0)\n        a2 = triton.load(x_ptr+256, mask=triton.arange(0, 256)[None, :] < K - k -256, other=0.0)\n        b2 = triton.load(y_ptr+256*N, mask=triton.arange(0, 256)[:, None] < K - k -256, other=0.0)\n        a3 = triton.load(x_ptr+512, mask=triton.arange(0, 256)[None, :] < K - k -512, other=0.0)\n        b3 = triton.load(y_ptr+512*N, mask=triton.arange(0, 256)[:, None] < K - k -512, other=0.0)\n        a4 = triton.load(x_ptr+768, mask=triton.arange(0, 256)[None, :] < K - k -768, other=0.0)\n        b4 = triton.load(y_ptr+768*N, mask=triton.arange(0, 256)[:, None] < K - k -768, other=0.0)\n        acc += a1@b1 + a2@b2 + a3@b3 + a4@b4\n        x_ptr += 1024\n        y_ptr += 1024 * N\n    triton.store(output + rm * 256 * N + rn * 256 + triton.arange(0,256)[:,None]*N + triton.arange(0,256)[None,:], acc.to(x.dtype))\n```\n\n**坏实践（反例）**：K 维循环每次迭代只做一次 load+dot 且不做预取 → 每次迭代串行等待访存，分支判断与访存延迟无法隐藏 → ✅ 正解即本条：K 维 4 路展开（4 组独立 load 并行发射）+ `triton.preload` 预取 + fixpipe 随路量化输出。\n\n**已知实例**：matmul §raw (`experiences/matmul/exp_matmul_002.yaml`)\n- 声称性能收益：35%\n- 备注：仅适配Triton框架，\n\n\n", "runbooks/compute-pipeline/operator-fusion-patterns.md": "\n\n## DG-11 算子融合模式与约束决策\n\n【优化维度】：计算｜融合\n【泛化层级】：条件性（迁移条件：数据依赖的连续算子；失效边界：独立并行、多消费者、UB 放不下或对齐冲突）\n\n<原则：融合把多个算子的 HBM 往返消除，将中间结果保留在 UB/寄存器内。对内存受限算子（elementwise、norm、activation）通常带来 25–50% 提升。但融合必须满足 UB 容量、相同 grid 结构、无多消费者、对齐兼容四个约束，否则反而导致 UB overflow 或编译失败。>\n\n**为什么融合能提速**：\n\n```\n未融合：GEMM → [HBM 写 C] → RMSNorm → [HBM 读 C] → [HBM 写 Y]\n已融合：GEMM → [UB 内] → RMSNorm → [HBM 写 Y]\n```\n\n每消除一对 HBM 读/写，约省 15–20% 延迟。\n\n**常见融合模式与收益**：\n\n| 模式 | 收益 | 关键约束 |\n|---|---|---|\n| GEMM + Activation | 15–20% | activation 在 fp32 accumulator 上计算 |\n| GEMM + Bias | 10–15% | bias 向量寄存器驻留 |\n| GEMM + RMSNorm | ~35% | 输出 tile UB 内完成归一化 |\n| GEMM + RoPE | ~25% | Q/K head 布局兼容 |\n| Skip + LayerNorm | ~30% | residual 与输入同 grid |\n| RMSNorm + Quantization | ~50% | scale 在 UB 内计算并写出 |\n| Conv1D + State + SiLU | ~35% | 状态更新用双缓冲避免竞争 |\n\n**Cube/Vector 异构融合（dl.async_task）**：\n\n```python\nimport triton_ascend.language as dl\n\n@triton.jit\ndef fused_gemm_norm(...):\n    with dl.async_task(scope=\"cube\"):\n        acc = tl.dot(a_tile, b_tile)\n\n    with dl.async_task(scope=\"vector\"):\n        rms = tl.sqrt(tl.sum(acc * acc, axis=1) / N + eps)\n        out = (acc / rms[:, None]) * weight\n        tl.store(Y_ptr + ..., out)\n```\n\nCube 计算 tile `i+1` 的同时，Vector 归一化 tile `i`。\n\n**融合约束清单**：\n\n```\n□ 操作 A 的输出是操作 B 的输入（数据依赖）\n□ 融合后所有中间 tensor 能放入 UB（≤ 192KB，matmul 保守 ≤ 64KB）\n□ 两个操作使用相同 grid / block 结构\n□ 中间结果不被多个下游消费者使用\n□ 对齐要求兼容（如 GEMM BLOCK_N=256 vs GroupNorm cpg=64 可能冲突）\n□ 激活函数在 fp32 累加器上计算，避免 fp16 溢出\n```\n\n**坏实践（反例）**：\n```python\n# 强行融合独立操作，grid 不一致\nop1_grid = (batch, M)\nop2_grid = (batch, N)\n```\n后果：编译失败或性能倒退。✅ 正解即只融合数据依赖且 grid 一致的操作。\n\n**双缓冲状态融合**：当多个 program 并发写入共享状态（conv_state、KV cache）时，写独立 buffer + host 侧 `copy_` 同步，避免 WAR 依赖和伪共享。\n\n**决策流程**：\n\n```\n1. 是否存在数据依赖链 A→B？\n   NO → 不融合\n2. 中间 tensor 是否多消费者？\n   YES → 不融合（保留中间 HBM）\n3. 融合后 tile 是否超 UB？\n   YES → 增大 BLOCK 或拆分为两阶段\n4. grid/对齐是否兼容？\n   NO → 不融合或调整 BLOCK\n5. 使用 dl.async_task 区分 Cube/Vector？\n   YES → 异构并行\n```\n\n\n"}};

function resolveLink(fromId,href){let base=fromId.split('/').slice(0,-1);for(const p of href.split('/')){if(p==='..')base.pop();else if(p!=='.')base.push(p);}let id=base.join('/');return nodeById[id]?id:null;}
function showDetail(id){const n=nodeById[id];if(!n)return;cy.$(':selected').unselect();const node=cy.getElementById(id);node.select();cy.elements().removeClass('nbr');node.connectedNodes().addClass('nbr');cy.animate({center:{eles:node},duration:200});
 let h=`<span class="chip" style="background:${KC[n.kind]}">${n.kind}</span> ${n.external?'<span class="chip" style="background:#94a3b8">外部</span>':''}<h2>${esc(n.title)}</h2><div class="id">${n.id}</div>`;
 if(n.description)h+=`<p>${esc(n.description)}</p>`;
 if(n.resource)h+=`<p><a class="ext" href="${n.resource}" target="_blank" rel="noopener">上游 resource ↗</a></p>`;
 if(n.tags&&n.tags.length)h+=`<div>${n.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`;
 const inc=cy.getElementById(id).connectedEdges().map(x=>x.data('e'));
 const groups={};inc.forEach(e=>{if(e.type==='part_of')return;const me=id;const other=e.source===me?e.target:e.source;const lab=persp(e,me);(groups[lab]=groups[lab]||[]).push([other,e]);});
 const order=['实现示例','对应接口','开发指南','讲解接口','声明头文件','声明的接口','配套样例','对应指南','同主题','相关','提及'];

 const bl=(back[id]||[]).filter(e=>e.type!=='part_of'&&!e.symmetric);

 const body=(G.bodies||{})[id];if(body){h+=`<div id="body">${marked.parse(body,{gfm:true,breaks:false})}</div>`;}

 d.querySelectorAll('#body a[href]').forEach(a=>{const href=a.getAttribute('href');if(href&&href.endsWith('.md')&&!href.includes('://')){const tid=resolveLink(id,href);if(tid){a.className='int';a.removeAttribute('href');a.onclick=()=>showDetail(tid);return;}}a.className='ext';a.target='_blank';a.rel='noopener';});}
function kg(k){if(['implementation_trap','debugging_journey','cross_skill_gap','field_note'].includes(k))return'field_note';if(['operator_optimization','runbook'].includes(k))return'runbook';return k;}
function persp(e,me){const k=kg(nodeById[me].kind);if(e.type==='exemplifies'){if(k==='api'||k==='guide')return'实现示例';if(k==='operator'||k==='field_note')return'实践案例';return'对应接口';}if(e.type==='explains'){if(k==='api')return'开发指南';if(k==='operator'||k==='field_note'||k==='runbook')return'开发指南';return'讲解接口';}if(e.type==='declares')return k==='api'?'声明头文件':'声明的接口';if(e.type==='demonstrates')return k==='guide'?'配套样例':'对应指南';if(e.type==='same_topic')return'同主题';if(e.type==='related')return'相关';if(e.type==='mentions')return'提及';return'相关';}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
cy.on('tap','node',ev=>showDetail(ev.target.id()));
cy.on('tap','edge',ev=>{const e=ev.target.data('e');document.getElementById('detail').innerHTML=`<div class="grp">边</div><p><b>${ETZH[e.type]||e.type}</b> ${e.symmetric?'(对称)':''}<br><span class="id">${e.source}<br>${e.symmetric?'—':'→'} ${e.target}</span></p><p>via: ${e.via.join(', ')}<br>why: ${esc(e.why)}<br>weight: ${e.weight}</p>`;});
cy.on('tap',ev=>{if(ev.target===cy){cy.elements().removeClass('nbr');cy.$(':selected').unselect();}});
document.getElementById('layout').onchange=e=>cy.layout({name:e.target.value,animate:false,padding:30}).run();
document.getElementById('reset').onclick=()=>{cy.fit(null,30);document.getElementById('q').value='';cy.elements().removeClass('dim');};
document.getElementById('q').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(!q){cy.elements().removeClass('dim');return;}cy.nodes().forEach(n=>{const d=n.data();const hay=(d.label+' '+d.id+' '+d.bundle).toLowerCase();n.toggleClass('dim',!hay.includes(q));});cy.edges().forEach(e=>e.toggleClass('dim',e.source().hasClass('dim')||e.target().hasClass('dim')));};
function mkfilter(host,title,keys,active,attr){let h=`<b>${title}</b>`;keys.forEach(k=>h+=`<label><input type=checkbox ${active(k)?'checked':''} data-f="${attr}" data-v="${k}">${k}</label>`);document.getElementById(host).innerHTML=h;}
mkfilter('bundleF','bundle:',G.meta.bundles,()=>true,'bundle');
mkfilter('kindF','kind:',['api','example','header','guide','glossary','index','other','operator','operator_optimization','implementation_trap','debugging_journey','cross_skill_gap'],()=>true,'kind');
mkfilter('typeF','边:',Object.keys(EC),k=>k!=='mentions'&&k!=='part_of','type');
document.getElementById('legend').innerHTML=Object.keys(EC).map(t=>`<span><b style="background:${EC[t]}"></b>${ETZH[t]}</span>`).join('');
function applyFilters(){const on=a=>new Set([...document.querySelectorAll(`input[data-f="${a}"]:checked`)].map(x=>x.dataset.v));
 const kb=on('bundle'),kk=on('kind'),kt=on('type');
 cy.nodes().forEach(n=>{const d=n.data();n.style('display',(kb.has(d.bundle)||!d.bundle)&&kk.has(d.kind)?'element':'none');});
 cy.edges().forEach(e=>{const vis=kt.has(e.data('type'))&&e.source().style('display')==='element'&&e.target().style('display')==='element';e.style('display',vis?'element':'none');});}
document.querySelectorAll('.filters input').forEach(cb=>cb.onchange=applyFilters);applyFilters();
const first=G.nodes.find(n=>n.kind==='api'&&!n.external)||G.nodes.find(n=>!n.external)||G.nodes[0];if(first)showDetail(first.id);
</script></body></html>

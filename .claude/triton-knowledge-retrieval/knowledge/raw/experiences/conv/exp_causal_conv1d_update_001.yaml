optimization_points:
- fused_state_update: The kernel fuses the sliding window state update (shifting the
    convolution buffer) with the convolution computation and activation (SiLU). This
    eliminates the need for a separate kernel to manage the recurrent state, significantly
    reducing memory access overhead and kernel launch latency.
- vectorized_layout_transformation: Utilizes a specific sequence of reshape and transpose
    operations (e.g., `reshape(sub_align_dim, align_val * state_len).trans()`) to
    transform the data layout. This ensures that the `insert_slice` operation (concatenation
    of history and new tokens) writes to contiguous memory addresses, optimizing for
    the hardware's burst memory access capabilities.
- channel_blocking: Processes the channel dimension (`dim`) in blocks of `DIM_BLOCK`.
    This tiling strategy improves data locality by keeping weights and state slices
    in registers or cache during the computation loop, reducing global memory fetches.
- mixed_precision_accumulation: Performs the convolution accumulation in float32 (`x_new_T.to(tl.float32)`)
    to maintain numerical stability for the recurrent state, which is critical for
    preventing gradient explosion or vanishing in long sequences, while storing the
    result in the input precision.
- sliding_window_register_reuse: The kernel loads the previous 'KERNEL_WIDTH-1' tokens
    from the convolution state into registers (col0, col1, etc.) before the main computation
    loop. Inside the loop, it shifts these registers and loads only the current new
    token. This drastically reduces global memory bandwidth usage by avoiding redundant
    loads of historical data for each time step.
- vectorized_state_update: The update of the circular buffer (conv_state) is performed
    by loading a block of history (BLOCK_M), shifting the data in local memory/registers
    to accommodate new tokens, and then storing the entire block back. This is significantly
    more efficient than scalar or per-token updates to the global state buffer.
- static_loop_unrolling: The inner loop over the kernel width utilizes `tl.static_range`
    and compile-time constants (`KERNEL_WIDTH`). This allows the compiler to fully
    unroll the convolution accumulation logic for specific widths (2, 3, or 4), eliminating
    runtime branching overhead and enabling efficient instruction pipelining.
- state_stitching_strategy: For the initial time tile (ti==0), the kernel efficiently
    loads the tail of the existing convolution state and stitches it with the head
    of the new input using tl.insert_slice. This avoids redundant memory loads of
    historical data and maintains continuity for the sliding window operation.
- grid_stride_dynamic_scheduling: Utilizes a 1D program grid with a grid-stride loop
    (tl.range) to map 3D tasks (Batch, Dim, Time). This maximizes hardware occupancy
    and load balancing, particularly beneficial when tensor dimensions are not perfectly
    divisible by block sizes.
- block_ptr_vectorization: Employs tl.make_block_ptr for loading weights and storing
    outputs. This facilitates efficient 2D memory access patterns and leverages hardware
    vectorization units, reducing the number of memory instructions compared to scalar
    pointer arithmetic.
- optimized_state_update: Implements a specialized path for updating the convolution
    state (conv_state_update_ptr) that handles negative offsets via a pre-defined
    head tile size (ST_STORE_HEAD_TILE_SIZE). This avoids expensive dynamic branching
    or tl.maximum calls in the critical store path.
- tiling_strategy: Implements 2D tiling using B_TILE (batch dimension) and BLOCK_N
    (channel dimension). This groups multiple sequences and channels into a single
    kernel instance, significantly improving data locality and enabling weight reuse
    across the batch tile.
- vectorized_state_update: Replaces scalar operations for state management with a
    chunked copy mechanism (T_CHUNK). It efficiently handles the sliding window update
    (shifting old history and appending new tokens) using vectorized loads/stores
    and masks, which is critical for minimizing latency in state-space models (SSMs).
- weight_preloading: Loads convolution weights and bias into registers once per program
    instance. These values are persistently reused across all tokens in the sequence
    and all batches within the tile, drastically reducing global memory bandwidth
    consumption.
- mixed_precision_compute: Utilizes FP16 for storing weights, states, and inputs to
    minimize memory footprint and transfer overhead, while performing the accumulation
    in FP32 to preserve numerical accuracy during the reduction operations.
- data_layout_alignment: The kernel performs a specific sequence of reshape and transpose
    operations (e.g., reshape(sub_align_dim, align_val * X).trans()) on the input,
    state, and weight tensors. This transforms the data layout to match the hardware's
    vectorized memory access granularity (implied by align_val), ensuring that memory
    loads/stores are coalesced and utilize the full bus width.
- operator_fusion: The kernel fuses multiple stages of the causal convolution update
    into a single launch loading the previous state, concatenating it with new input,
    performing the convolution computation, applying bias and SiLU activation, and
    finally slicing and storing the updated state back to global memory. This significantly
    reduces global memory read/write bandwidth requirements.
- continuous_batching_support: Efficiently handles continuous batching by using an
    indirection array (conv_state_indices_ptr) to map program IDs to actual batch
    indices. This allows the kernel to process dynamic batches without the overhead
    of padding or reordering data in global memory.
- register_blocking_and_vectorization: The loop over the dimension is tiled using
    DIM_BLOCK, and data is processed in chunks that fit into registers. The layout
    transformation enables the use of vectorized instructions for the convolution
    arithmetic (element-wise multiplication and reduction), improving compute throughput.
- register_tiling_sliding_window: The kernel pre-loads the historical state tokens
    (col0, col1, etc.) and convolution weights into registers before entering the
    main token loop. Inside the loop, it only loads the current input token and updates
    the register-based window, significantly reducing global memory access frequency
    for the history data.
- block_wise_circular_buffer: Instead of shifting the entire convolution state tensor
    one step at a time, the kernel loads a chunk of the state (defined by NP2_STATELEN
    and BLOCK_N), shifts the data in shared memory or registers, and writes it back.
    This block-wise approach maximizes memory bandwidth utilization for the state
    update step.
- spec_decoding_adaptation: The implementation includes specific logic for Speculative
    Decoding by handling `conv_state_token_offset` derived from `num_accepted_tokens`.
    This allows the kernel to correctly update the state buffer position based on
    variable acceptance rates without re-computing the entire history.
- static_loop_unrolling: The use of `tl.static_range` for the inner loop over `KERNEL_WIDTH`
    and the outer loop over `seqlen` allows the compiler to fully unroll loops and
    generate optimized instruction sequences for the small, fixed-size operations
    typical in decoding phases.
performance_boost: 35%
note: This kernel is specifically optimized for the decoding phase of autoregressive
  models (e.g., Mamba, RWKV) where sequence length is small. It requires compile-time
  constants for KERNEL_WIDTH and seqlen to achieve maximum performance.

optimization_points:
- vectorized_chunking: The kernel utilizes a `SUB_BLOCK` loop stride to process the
    vocabulary dimension. By loading chunks of probability vectors (`draft_probs`,
    `target_probs`, `q`) into vector registers simultaneously, it maximizes memory
    bandwidth utilization and reduces the overhead of scalar loads.
- in_place_buffer_reuse: In the `NO_DRAFT_PROBS` execution path, the kernel temporarily
    modifies the `target_probs_ptr` in-place (zeroing out the draft token's probability)
    to exclude it from the argmax search, and subsequently restores the original value.
    This technique avoids the allocation of a separate temporary buffer, saving memory
    capacity and bandwidth.
- masked_boundary_handling: The use of `mask=vocab_offset < vocab_size` within the
    vectorized load instructions allows the kernel to handle arbitrary vocabulary
    sizes and padded dimensions efficiently without introducing divergent branching
    logic inside the processing loop.
performance_boost: 30%
note: This kernel is critical for the token recovery phase in speculative decoding.
  The `NO_DRAFT_PROBS` optimization is specifically tailored for n-gram based speculation
  where explicit draft probabilities are not available.

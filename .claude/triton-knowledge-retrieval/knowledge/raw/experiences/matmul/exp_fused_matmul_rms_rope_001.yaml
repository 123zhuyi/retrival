optimization_points:
- heterogeneous_parallelism: The kernel explicitly leverages the NPU's heterogeneous
    architecture by dispatching the compute-intensive Matrix Multiplication to the
    `cube` unit and the memory-intensive RMS Normalization and Rotary Position Embedding
    to the `vector` unit. This ensures that different hardware units are utilized
    simultaneously rather than sequentially.
- async_task_scheduling: By using `dl.async_task`, the runtime is instructed to execute
    the MatMul and the vector operations (RMS Norm + RoPE) asynchronously. This allows
    the vector unit to process the normalization and embedding logic in parallel with
    the matrix calculations on the cube unit, effectively hiding the latency of the
    vector operations behind the heavy GEMM computation.
- kernel_fusion_graph: The code fuses three distinct operations (MatMul, RMS Norm,
    RoPE) into a single kernel launch context. This reduces the overhead of multiple
    kernel launches and improves data locality, particularly for the `KV` tensor which
    is processed sequentially by the vector kernels.

optimization_points:
- simd_index_select: Utilizes libdevice.index_select_simd to load K and V tensors.
    This enables parallel index selection from Global Memory to Unified Buffer (UB)
    with zero-copy semantics, optimizing for the irregular memory access patterns
    of ragged/paged attention.
- online_softmax: Implements the online softmax algorithm (iterative max and sum updates)
    to avoid materializing the full attention matrix in SRAM/UB, significantly reducing
    memory bandwidth consumption.
- kv_split_parallelism: Splits the KV sequence dimension across multiple program IDs
    (split_kv_id), allowing for parallel processing of long sequences and better utilization
    of compute units.
performance_boost: 45%
note: Optimized for Ascend NPU (910B series) using libdevice intrinsics. Supports
  variable sequence lengths via indptr/indices.

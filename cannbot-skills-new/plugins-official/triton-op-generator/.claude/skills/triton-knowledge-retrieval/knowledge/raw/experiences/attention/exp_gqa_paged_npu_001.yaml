optimization_points:
- vector_sub_block_parallelism: Utilizes `tl.parallel(0, 2, bind_sub_block=True)`
    to map the processing of query heads to the two independent vector units within
    a single AICore. This parallelizes the softmax and reduction operations, effectively
    doubling the throughput for the vector-heavy parts of the attention mechanism.
- cube_vector_pipeline: Explicitly separates computation into CUBE operations (QK
    and PV matrix multiplications) and VECTOR operations (softmax, scaling, and accumulation).
    This decoupling allows the NPU to fully utilize the dedicated Cube unit for high-throughput
    matrix math while the Vector unit handles the non-linear operations, minimizing
    pipeline stalls.
- gqa_bandwidth_optimization: Implements Grouped-Query Attention by loading the K
    and V tensors once per KV head and reusing them for multiple query heads within
    the same group. This reduces the memory read bandwidth for KV cache by a factor
    equal to the group size (q_heads_per_kv_head).
- paged_kv_iteration: Iterates over physical memory blocks using a `block_table` to
    handle paged KV caches. This allows the kernel to efficiently process long sequences
    with non-contiguous memory layouts, typical in LLM serving, without requiring
    data copying or defragmentation.

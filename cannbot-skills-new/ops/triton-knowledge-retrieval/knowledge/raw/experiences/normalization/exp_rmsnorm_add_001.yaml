optimization_points:
- register_reuse_intermediate: The kernel currently writes the intermediate result
    S to global memory and reads it back in the second loop for normalization. To
    optimize, the S_chunk should be retained in registers (or shared memory if the
    tile is large) after the first loop and reused directly in the second loop. This
    eliminates the redundant global memory load of S, significantly reducing memory
    bandwidth consumption.
- vectorized_memory_access: Ensure BLOCK_SIZE_N is aligned with the hardware's memory
    transaction size (e.g., 128 bytes) to maximize memory bus utilization. This is
    critical for the loads of X, R, and W, as well as the stores of S and Y.
- loop_unrolling_ilp: Unroll the inner loop over col_offset to increase Instruction
    Level Parallelism (ILP). This helps hide the latency of the floating-point operations
    in the variance calculation (sum of squares) and the subsequent normalization
    scaling.
performance_boost: 30%
note: The kernel implements a fused Add + RMSNorm. The primary bottleneck is the redundant
  load of the intermediate tensor S. Optimizing this data path is key to performance.

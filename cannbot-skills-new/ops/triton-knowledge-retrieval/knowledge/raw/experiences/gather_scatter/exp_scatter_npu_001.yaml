optimization_points:
- binning_strategy: The kernel leverages pre-computed bins and bin_ids to group indices.
    This allows the memory access pattern for the source tensor 'a' to be contiguous
    within the inner loop, significantly reducing memory latency compared to a purely
    random scatter.
- vectorized_block_processing: Data is loaded and stored in 2D tiles defined by SUB_BLOCK_SIZE
    and BLOCK_X. This enables the use of wide vector memory instructions (e.g., 128-bit
    or 256-bit loads/stores), maximizing the utilization of the memory bus bandwidth
    on the NPU.
- register_reuse_scaling: The scaling operation is fused into the scatter loop. By
    loading the weight, scaling it in registers using FP32 arithmetic, and then storing
    it, the kernel minimizes the number of times the data is moved between global
    memory and the compute unit.
- loop_tiling: The nested loop structure (iterating over bins, then columns, then
    indices) optimizes for cache locality. It processes all columns for a given set
    of indices before moving to the next set, keeping the active working set small
    in the cache/SRAM.
performance_boost: 35%
note: This kernel is specifically designed for Mixture of Experts (MoE) routing scenarios
  where tokens are dispatched to experts. It requires pre-sorted indices or bin information
  as input to function correctly.

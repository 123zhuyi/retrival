optimization_points:
- hardware_pipeline_balancing: Enabled `enable_hivm_auto_cv_balance` to allow the
    compiler to automatically balance the workload between the Cube (matrix compute)
    and Vector units, preventing pipeline stalls on Ascend NPUs.
- multi_buffering: Configured `multibuffer True` with `set_workspace_multibuffer 2`
    to overlap data transfer of K/V tiles with the computation of the micro-kernel,
    effectively hiding memory latency.
- hybrid_loop_unrolling: Set `tile_mix_vector_loop` and `tile_mix_cube_loop` to 2,
    optimizing the instruction issue rate by interleaving vector and cube operations
    to maximize hardware throughput.
- asymmetric_tiling: Utilized `BLOCK_R=128` and `BLOCK_C=64` to match the NPU's memory
    access granularity, ensuring efficient loading of the KV cache blocks which are
    often accessed in non-square patterns during the backward pass.
- sequence_partitioning: Implemented a sequence splitting strategy (`SEQ_LEN = S //
    2`) to optimize the iteration space for the backward pass, reducing the overhead
    of causal mask checks within the innermost loops.

optimization_points:
- operator_fusion: The kernel fuses the GEMM computation (hidden @ weight.T) with
    the Softmax reduction and Entropy calculation. By fusing these stages, the kernel
    avoids materializing the massive intermediate logits matrix (size num_tokens x
    vocab_size) to global memory, significantly reducing memory bandwidth pressure.
- online_softmax_algorithm: Implements a numerically stable online softmax reduction
    within the main loop over the vocabulary dimension. It iteratively updates the
    global maximum (_max) and the sum of exponentials (_accu) using the coefficient
    exp(old_max - new_max), allowing for correct softmax calculation without storing
    all logits simultaneously.
- tensor_parallelism_support: The kernel is designed to work with Tensor Parallelism
    by processing vocab_per_split. It computes partial maximums, accumulations, and
    entropy terms per split, which are typically reduced in a subsequent step, enabling
    efficient scaling of large vocabulary models.
- autotuning_strategy: Utilizes @triton.autotune to select optimal block sizes (BLOCK_SIZE_M,
    BLOCK_SIZE_N, BLOCK_SIZE_K) and pipeline configurations (num_stages, num_warps)
    based on runtime input dimensions, ensuring high occupancy across different batch
    sizes and vocabulary lengths.

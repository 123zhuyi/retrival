optimization_points:
- gemm_based_histogram: Replace the iterative bin counting loop (for s in range(bins_segment))
    with a one-hot encoding followed by a matrix multiplication (tl.dot). This maps
    the reduction to a highly optimized GEMM operation, leveraging the NPU's Cube
    unit for parallel counting instead of scalar ALU loops.
- loop_unrolling: If bins_segment is small and constant (e.g., 16 for 4-bit radix),
    ensure the loop is fully unrolled to minimize branch prediction overhead and allow
    the compiler to optimize the mask generation logic.
- memory_access_coalescing: The store operation to digit_hist is performed inside
    the inner loop. Ensure that the stride of the write access (grid0) results in
    coalesced global memory transactions to maximize bandwidth utilization.
performance_boost: 50%
note: The current implementation uses a scalar loop for bin counting which is inefficient
  for larger block sizes. The GEMM-based approach is recommended for Ascend 910 series
  to achieve high throughput.

optimization_points:
- token_loop_vs_w_loop_decision: "Prefill kernel 在 Token 维度上迭代（seq_len 次，每次处理 BLOCK_D=1024 维），Update kernel 在 W 维度上迭代（width 次，每次处理 D_CHK_SIZE=16 维）。对于 W=4 的典型场景，Prefill 的 Token 循环方案在算术效率上有根本优势：(1) 零数据编排开销（无 extract_slice/transpose，Update 有 11 次）；(2) 更好的 FMA 映射（单语句 4 路归约 vs 4 次独立累积）；(3) BTD 布局下一次 load 1024 个连续元素（32 cache lines）vs BDT 布局下 16 行分散加载。但这不意味着 Prefill 方案在所有场合都更好——seq_len=1 时 BDT+W 循环更适合单 token decode 的内存访问模式。"
- bias_fusion_transfer: "从 Prefill kernel 迁移 HAS_BIAS 支持到 Update kernel。Prefill 在卷积累加后直接 `acc = acc + bias`（bias 预加载为寄存器），Update kernel 中 HAS_BIAS 已声明为 `tl.constexpr` 但标记为 TODO。实现仅需在 W 循环或展开表达式的结果 `out_block` 上加 `bias[None, :]`。消除额外的 bias add kernel launch。"
- pointer_base_precompute: "从 Prefill kernel 的 `x_ptrs = x_ptr + start*stride + d_offs*stride_dim` 模式迁移到 Update kernel 的 W 循环内部。在 `for owi in range(width)` 循环中，x_b 切片和 w 切片的基址可预计算，减少每次 extract_slice 中的偏移运算。适用于未展开 W 循环的原始路径。"
- single_token_specialization: "当 seq_len=1（单 token decode）时，可将矩阵式卷积退化为 Prefill 风格的滑动窗口寄存器复用：预先加载 col0/col1/col2/col3 和 w0/w1/w2/w3 到寄存器，直接计算 `out = col0*w0 + col1*w1 + col2*w2 + col3*w3`，然后移位 `col0=col1; col1=col2; col2=col3; col3=new_token`。避免了为 1 个 token 加载整个 [D_CHK, 1+W-1] buffer 的浪费。优先级低，因为 T_CHK_SIZE=256 >> seq_len=1 时改动较大。"
- not_applicable_transfers: "以下 Prefill 优化不建议迁移到 Update：(1) W 硬编码为 4 — Update 需要通用 W 支持；(2) 2D Grid 并行 — Update 场景 seq_len 短，T-tile 切分是必要的，1D strided grid 配合 3D 任务分解更适合。"
performance_boost: "Bias fusion: 消除 1 次 kernel launch（延迟降低约 10-20%）；Pointer precompute: 减少 5-10% 标量指令；Token-loop for seq_len=1: 预计 15-25% 提升（低优先级）"
note: "此经验是关于 Prefill 和 Update 两个 kernel 之间的优化知识迁移。核心启示：循环维度选择（Token vs W）是根本性的架构决策，应根据 seq_len 和 D 的相对大小选择。Bias 融合和 DIM_IS_MULTIPLE mask 消除是最容易迁移且收益明确的优化。"
version: v1.0
source: causal_conv1d_prefill_GA/conv1d_update_analysis.md §4-5 (对比分析+可复用性) + §9 (改进建议) + §10 (循环对比)
code_snippet:
  bias_fusion: |
    # Update kernel 中实现 Bias 融合（从 Prefill 迁移）
    if HAS_BIAS:
        bias = tl.load(bias_ptr + d_offs, mask=mask_d, other=0.0)
        out_block = out_block + bias[None, :]
  single_token_specialization: |
    # seq_len=1 时的滑动窗口寄存器复用（概念迁移）
    col0, col1, col2, col3 = load_state_registers()
    w0, w1, w2, w3 = load_weight_registers()
    new_token = tl.load(x_ptr)
    out = col0*w0 + col1*w1 + col2*w2 + col3*w3
    col0, col1, col2 = col1, col2, col3
    col3 = new_token
    store_state(col0, col1, col2)

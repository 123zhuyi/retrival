experience_id: exp_stability_001
match_cond:
  operator_type: AIV
  compute_pattern: element-wise/reduce
  data_type:
  - fp16
  - bf16
  hardware:
  - 910b2
  - 910b3
  core_param: {}
  optimization_level: high
  tensor_shape:
  - nd
experience_type: 数值稳定性优化
framework_tag:
- Triton
optimization_points:
- 核心策略: 指数运算前先减去维度内最大值，消除大数指数导致的数值溢出
- 适配场景: 专门针对fp16/bf16低精度场景，该处理可100%避免exp函数返回Inf/NaN
- 无性能损耗: 仅增加一次max计算，910b2/910b3平台的硬件max指令耗时可忽略
code_snippet:
  Triton: "@triton.jit def exp_overflow_opt_kernel(input_ptr, output_ptr, n_elements,\
    \ dim: tl.constexpr=0, BLOCK_SIZE: tl.constexpr=128):\n    pid = triton.program_id(0)\n\
    \    offsets = pid * BLOCK_SIZE + tl.arange(0, BLOCK_SIZE)\n    mask = offsets\
    \ < n_elements\n    \n    # 加载数据\n    data = tl.load(input_ptr + offsets, mask=mask).to(tl.float32)\n\
    \    \n    # 核心优化: 减去维度内最大值防止溢出\n    max_val = tl.max(data, axis=dim)  # 按指定维度取最大值\n\
    \    stable_data = data - max_val      # 数值稳定化\n    \n    # 指数计算（无溢出风险）\n    exp_data\
    \ = tl.exp(stable_data)\n    \n    # 存储结果（转回原精度）\n    tl.store(output_ptr + offsets,\
    \ exp_data.to(tl.float16), mask=mask)\n\n# Softmax场景示例调用\ndef softmax_opt(input_tensor):\n\
    \    if not input_tensor.is_contiguous():\n        input_tensor = input_tensor.contiguous()\n\
    \    output = torch.empty_like(input_tensor)\n    n_elements = input_tensor.numel()\n\
    \    grid = (triton.cdiv(n_elements, 128),)\n    exp_overflow_opt_kernel[grid](input_tensor,\
    \ output, n_elements, dim=-1, BLOCK_SIZE=128)\n    # 归一化步骤\n    sum_exp = output.sum(dim=-1,\
    \ keepdim=True)\n    return output / sum_exp"
performance_boost: 数值稳定性提升100%
note: 适用于所有包含指数运算的场景（如Softmax、注意力分数计算），fp16/bf16下未做该处理易出现exp(>65504)返回Inf，910b2/910b3平台需强制启用该优化
version: v1.0

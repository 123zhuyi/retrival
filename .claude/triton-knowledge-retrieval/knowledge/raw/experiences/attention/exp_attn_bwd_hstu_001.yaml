optimization_points:
- kv_tile_reuse: The kernel loads the K and V blocks corresponding to the current
    column block (start_n) outside the row iteration loop. These tiles are reused
    across all row blocks (start_m), drastically reducing global memory read bandwidth
    for K and V tensors.
- fp32_accumulation: Gradients for DK and DV are accumulated in float32 precision
    (tl.zeros with dtype=tl.float32) to prevent precision loss during the reduction
    across the sequence length before casting back to the input dtype.
- block_ptr_bias: Utilizes tl.make_block_ptr for the optional bias tensor, enabling
    efficient 2D block memory access that aligns with hardware memory coalescing requirements.
performance_boost: 35%
note: This optimization is critical for the backward pass of attention, where memory
  bandwidth for K and V is often the bottleneck.

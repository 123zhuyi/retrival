exp_solve_tril_002.md", "target": "ascend-patterns.md", "type": "explains", "weight": 1.0, "via": ["llm"], "why": "同属优化知识，主题相关", "symmetric": false, "cross": true}, {"source": "runbooks/memory-sram/pow2-block-constexpr.md", "target": "ascend-patterns.md", "type": "explains", "weight": 1.0, "via": ["llm"], "why": "主题相关：共享 constexpr", "symmetric": false, "cross": true}, {"source": "runbooks/memory-sram/preload-extract-slice-eliminate-reread.md", "target": "ascend-patterns.md", "type": "explains", "weight": 1.0, "via": ["llm"], "why": "同属优化知识，主题相关", "symmetric": false, "cross": true}, {"source": "runbooks/meta-skills/exp_solve_tril_006.md", "target": "ascend-patterns.md", "type": "explains", "weight": 1.0, "via": ["llm"], "why": "同属优化知识，主题相关", "symmetric": false, "cross": true}, {"source": "runbooks/portability/constexpr-launch-specialization.md", "target": "ascend-patterns.md", "type": "explains", "weight": 1.0, "via": ["llm"], "why": "主题相关：共享 constexpr", "symmetric": false, "cross": true}, {"source": "runbooks/portability/exp_api_003.md", "target": "ascend-patterns.md", "type": "explains", "weight": 1.0, "via": ["llm"], "why": "同属优化知识，主题相关", "symmetric": false, "cross": true}, {"source": "runbooks/portability/exp_constexpr_001.md", "target": "ascend-patterns.md", "type": "explains", "weight": 1.0, "via": ["llm"], "why": "同属优化知识，主题相关", "symmetric": false, "cross": true}], "bodies": {"ascend-910b.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/hardware/ascend_910b.md\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/hardware/ascend_910b.md` 迁移而来，原始为硬件概念页，未做内容改写，仅转 OKF frontmatter。\n\n# Ascend 910B2/910B3 Hardware Reference\n\n## Core Architecture\n\nEach Ascend AI Core consists of two distinct compute units:\n\n| Unit | Purpose | Operations |\n|------|---------|-----------|\n| **Cube unit** | GEMM / matrix multiply | tl.dot, batch matmul, convolution |\n| **Vector unit** | Elementwise / normalization | tl.exp, tl.sum, arithmetic, LayerNorm |\n\nThese two units can execute concurrently within a single AI Core when scheduled correctly (see `dl.async_task` in techniques/ilp).\n\n### Core Ratio\n\nOn 910B2/910B3, the typical hardware configuration is:\n- 1 Vector core per 2 Cube cores (in terms of compute resources)\n- For Triton scheduling, both are accessed via the same AI Core program model\n\n## Grid Semantics: Physical Core Binding\n\nAscend grid semantics differ fundamentally from GPU (CUDA) grid semantics:\n\n| Dimension | CUDA/GPU | Ascend |\n|-----------|---------|--------|\n| Grid meaning | Logical task dimension | Physical core group |\n| Hardware mapping | Auto-mapped by driver | Must match physical topology |\n| Grid size limit | Very large (millions of blocks) | ≤ Total AI Core count |\n| 2D grid | Logical (rows × cols) | Must match physical topology |\n| Current kernel limit | Platform-dependent | ≤ 65535 cores |\n\n**Key implication**: On Ascend, you cannot launch more grid blocks than there are physical AI Cores. Attempting to do so requires the `TRITON_ALL_BLOCKS_PARALLEL` environment variable or multi-round scheduling.\n\n### 2D Grid Constraint\n\n2D grids must match the physical core layout of the device. Do not assume arbitrary (M, N) grid shapes are valid. Use 1D grids and compute 2D indices manually in the kernel:\n\n```python\n# Safe: 1D grid, compute 2D indices in kernel\npid = tl.program_id(axis=0)\npid_m = pid // num_pid_n\npid_n = pid % num_pid_n\n```\n\n## On-Chip Memory (UB)\n\n**UB = Unified Buffer**: the on-chip SRAM for each AI Core.\n\n| Hardware | UB Capacity per Core |\n|---------|---------------------|\n| Atlas 800T/I A2 (910B2/B3) | **192 KB** |\n\nAll tile data for a single kernel iteration must fit within 192KB:\n\n```\nTile footprint = sum of all live tensor tile sizes\n               = BLOCK_M * BLOCK_K * 2B (fp16 A)\n               + BLOCK_K * BLOCK_N * 2B (fp16 B)\n               + BLOCK_M * BLOCK_N * 4B (fp32 acc)\n               ≤ 192KB\n```\n\nExample for `BLOCK_M=128, BLOCK_K=256, BLOCK_N=128, fp16`:\n```\nA tile: 128 * 256 * 2 = 65,536B = 64KB\nB tile: 256 * 128 * 2 = 65,536B = 64KB\nacc:    128 * 128 * 4 = 65,536B = 64KB\nTotal:  192KB (exactly at limit — leave margin in practice)\n```\n\n## HBM Bandwidth\n\n- **Theoretical peak**: ~1.8 TB/s (shared across all cores)\n- **Practical**: bandwidth is shared when multiple MTE2/MTE3 ops run simultaneously\n- For memory-bound roofline: `Time = Data_volume / 1.8e12`\n\n## Core Detection at Runtime\n\n```python\nimport torch\nfrom triton.runtime import driver\n\ndevice = torch.cuda.current_device()\nprops = driver.active.utils.get_device_properties(device)\nnum_sms = props[\"multiprocessor_count\"]    # number of AI Cores\n```\n\nUse `num_sms` to set the persistent kernel grid size or compute optimal tile counts.\n\n## Compilation Optimization Options\n\nThese options are passed via `dl.compile_hint()` or environment variables:\n\n| Option | Purpose | Default |\n|--------|---------|---------|\n| `multibuffer` | Pipeline parallel data movement (double-buffer) | true |\n| `unit_flag` | Cube data output optimization (format selection) | None |\n| `enable_hivm_auto_cv_balance` | Automatic Cube/Vector balance optimization | None |\n| `tile_mix_vector_loop` | Vector core split granularity for mixed tiles | None |\n| `tile_mix_cube_loop` | Cube core split granularity for mixed tiles | None |\n| `set_workspace_multibuffer N` | Multi-level prefetching (N = buffer depth) | None |\n| `auto_blockify_size` | Maps to TRITON_ALL_BLOCKS_PARALLEL | 1 |\n\n### Usage\n\n```python\nimport triton_ascend.language as dl\n\n@triton.jit\ndef my_kernel(...):\n    dl.compile_hint(\"multibuffer=true\")\n    dl.compile_hint(\"enable_hivm_auto_cv_balance\")\n    dl.compile_hint(\"tile_mix_vector_loop=4\")\n    dl.compile_hint(\"tile_mix_cube_loop=2\")\n    dl.compile_hint(\"set_workspace_multibuffer 4\")\n    # ... kernel body\n```\n\n### `dot_pad_only_k` Hint\n\nFor Cube operations where padding is only needed along the K dimension:\n\n```python\ndl.compile_hint(\"dot_pad_only_k\")\n```\n\n## Environment Variables\n\n| Variable | Purpose | Values |\n|----------|---------|--------|\n| `TRITON_ALL_BLOCKS_PARALLEL` | Submit all blocks in one scheduling round | 0 (disabled), 1 (enabled) |\n\n```bash\n# Enable all-blocks-parallel scheduling (avoids multi-round scheduling overhead)\nexport TRITON_ALL_BLOCKS_PARALLEL=1\npython3 my_kernel_test.py\n```\n\nWhen `TRITON_ALL_BLOCKS_PARALLEL=1`, all grid blocks are submitted to the hardware in a single round. Without it, blocks may be submitted in multiple rounds, adding scheduling latency for large grids.\n\n## 910B2-Specific Features\n\n### `dl.grouped_launch_diagonal`\n\nHardware-level diagonal PID mapping API available on 910B2:\n\n```python\nimport triton_ascend.language as dl\n\npid_m, pid_n = dl.grouped_launch_diagonal(\n    pid,       # linear program ID\n    num_pid_m, # total tiles in M dimension\n    num_pid_n, # total tiles in N dimension\n    GROUP_SIZE # tiles per diagonal group\n)\n```\n\nThis performs the PID → diagonal (m, n) remapping at hardware level, avoiding software overhead.\n\n### Data Format Constraints for Dot API\n\nThe Dot API (tl.dot / Cube unit) requires specific input/output tensor formats on 910B2. Specifically:\n- Input matrices must be in the correct fractal/ND format expected by the Cube unit\n- The compiler handles format conversion automatically when using standard tl.dot\n- Custom format manipulation requires using the Cube API directly (advanced usage)\n\n**Note**: `tl.make_block_ptr` with `order=(1, 0)` (row-major) is the standard format for Dot API compatibility.\n\n## Pipeline Architecture\n\nThe AI Core pipeline:\n\n```\nHBM → [MTE2: Load] → UB ← [Vector: Compute] → UB → [MTE3: Store] → HBM\n                                    ↑\n                              [MTE1: Weight Load from L2]\n```\n\n- **MTE2**: Load from HBM or L2 to UB (external reads)\n- **MTE3**: Store from UB to HBM (external writes)\n- **MTE1**: Load from L2/global memory to Cube input buffers\n- **Vector**: Elementwise and reduction operations on UB\n- **Cube**: Matrix multiply using Cube input/output buffers\n\nThese stages can pipeline (multi-buffer) when data dependencies allow.\n\n## 相关页面\n- techniques/tiling — UB capacity constraints and tile sizing\n- techniques/ilp — Pipeline stages and how to overlap them\n- techniques/core_mapping — Grid constraints and diagonal mapping\n- workflows/profiling — Profiling metrics mapped to pipeline stages\n- api/triton_api_cheatsheet — dl.compile_hint and environment variable reference\n\n\n", "ascend-patterns.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/hardware/ascend_patterns.md\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/hardware/ascend_patterns.md` 迁移而来，原始为硬件概念页，未做内容改写，仅转 OKF frontmatter。\n\n# Ascend NPU 特有语法与模式\n\n> 本页汇总 Triton-Ascend 与标准 GPU Triton 的关键差异，来自 `raw/experiences/general_ascend/` 12 条经验。  \n> **必读**：实现任何 kernel 前先检查本页约束，避免编译错误。\n\n## 1. Grid 配置规范\n\n**约束**：\n- Grid 必须是 `tuple` 类型，最多 3 维\n- 各维度乘积 **≤ 65535**（`x * y * z ≤ 65535`）——**默认硬件限制**\n- 不能使用 4 维 Grid\n\n> **环境变量例外**：设置 `TRITON_ALL_BLOCKS_PARALLEL=1` 时，Runtime 会尝试让所有 block 并发调度，此时 Grid 乘积可超过 65535，但仍受物理核数（910b2: 24 VEC + 24 Cube，910b3: 20+20）限制。**生产代码不应依赖此环境变量**——它会绕过硬件调度保障，可能导致 OOM 或调度死锁。若 block 数量确实需要超过 65535，使用 grid-stride loop 代替。\n\n```python\n# 正确\ngrid = (48,)            # 1D，乘积=48 ✓\ngrid = (24, 2)          # 2D，乘积=48 ✓\n\n# 错误\ngrid = 48               # 不是 tuple ✗\ngrid = (256, 256)       # 乘积=65536 > 65535 ✗\ngrid = (12, 2, 2, 1)   # 4维 ✗\n```\n\n**大 shape 处理**：当 `n_blocks > 65535` 时，使用 grid-stride loop（persistent kernel）：\n```python\ngrid = (min(n_blocks, NUM_CORES),)  # 固定 grid\n# kernel 内部循环处理剩余任务\n```\n\n经验文件：exp_ascend_grid_001，exp_ascend_grid_large_shape_001\n\n---\n\n## 2. tl.constexpr 用法\n\n**规则**：`tl.constexpr` 仅允许在 kernel 函数参数声明中使用，**禁止**在 host 侧使用。\n\n```python\n# 正确：kernel 参数\n@triton.jit\ndef kernel(ptr, n, BLOCK_SIZE: tl.constexpr): ...\n\n# 错误：host 侧使用\ndef forward():\n    BLOCK_SIZE: tl.constexpr = 128  # ✗ 语法错误\n    BLOCK_SIZE = 128  # ✓ host 侧直接用普通变量\n```\n\n经验文件：exp_constexpr_001\n\n---\n\n## 3. 禁用语法列表\n\n| 禁止 | 替代方案 | 说明 |\n|------|----------|------|\n| `return` / `break` / `continue` | mask 控制执行逻辑 | Triton kernel 无提前退出 |\n| `lambda` 表达式 | `tl.where` / 内联函数 | 编译不支持 |\n| 链式布尔运算 `a and b and c` | 分步计算 mask 后组合 | 用 `&` 按位与代替 |\n| `tensor[i]` 直接索引 | `tl.load` / `tl.store` | 必须通过内存访问 API |\n| `tl.swizzle2d` | 使用 `grouped_launch_diagonal` | Ascend 不支持 |\n| int64 CMP/ADD | 转换为 fp32 / int32 | 无原生 SIMD int64 指令 |\n| 负数偏移 | `tl.maximum(offset, 0)` + mask | 避免负地址访问 |\n\n经验文件：exp_api_001，exp_scalar_cast_001\n\n---\n\n## 4. 核心数与并行模式\n\n**910b2 标准核心数**：\n- Cube（矩阵计算）核心：通常 20/24 个\n- Vector（向量计算）核心：通常 48 个\n- 总 AI Core 数：通常 **20（Cube） + 48（Vector）= 68 个**，具体以 `torch_npu.npu_core_num()` 为准\n\n```python\n# 获取实际核心数\nVEC_CORE_NUM = torch_npu.npu_core_num()  # 通常 48（Vector）\nCUBE_CORE_NUM = 20  # 固定值\n\n# 推荐：按核心数配置 grid\ngrid = (VEC_CORE_NUM,)  # 向量密集型算子\n```\n\n经验文件：exp_ascend_core_num_001，exp_ascend_parallel_pattern_001\n\n---\n\n## 5. 大 Shape 分块策略\n\n当输入 shape 极大时（如超长序列、大词表），单 kernel 无法处理：\n\n```python\n# 策略：大 shape 分割为多个 sub-block，每个 program 处理一段\n@triton.jit\ndef large_shape_kernel(ptr, n, BLOCK_SIZE: tl.constexpr, MAX_BLOCKS: tl.constexpr):\n    pid = tl.program_id(0)\n    # grid-stride：每个 core 处理多个 block\n    for block_id in range(pid, tl.cdiv(n, BLOCK_SIZE), tl.num_programs(0)):\n        offs = block_id * BLOCK_SIZE + tl.arange(0, BLOCK_SIZE)\n        ...\n```\n\n经验文件：exp_ascend_large_shape_block_001\n\n---\n\n## 6. where/split/slice 操作\n\n| 操作 | 正确写法 | 注意事项 |\n|------|----------|----------|\n| 条件选择 | `tl.where(cond, x, y)` | cond 必须是 mask tensor，不能是 Python bool |\n| 张量切片 | `tl.load(ptr + start + tl.arange(0, size))` | 不能直接用 `[start:end]` 切片 |\n| 维度分割 | 手动计算偏移，分两次 load | 无原生 split 操作 |\n\n经验文件：exp_ascend_where_001，exp_slice_001，exp_ascend_split_001\n\n---\n\n## 7. Tensor 创建\n\n| 操作 | Triton API |\n|------|-----------|\n| 零张量 | `tl.zeros([SIZE], dtype=tl.float32)` |\n| 全填充 | `tl.full([SIZE], value, dtype=tl.float32)` |\n| 整数序列 | `tl.arange(0, SIZE)` |\n| 2D 广播 | `tl.arange(0, M)[:, None]` + `tl.arange(0, N)[None, :]` |\n\n经验文件：exp_tensor_create_001\n\n---\n\n## 相关页面\n\n- hardware/constraints_cheatsheet.md — 强制约束速查（UB/对齐/Grid）\n- [hardware/ascend_910b.md](ascend-910b.md) — 910b2/910b3 硬件规格\n- techniques/performance_tuning.md — 性能调优通用原则\n- workflows/debugging.md — 调试与稳定性指南\n\n\n", "runbooks/portability/constexpr-launch-specialization.md": "\n\n## OPT-4 关键长度参数 tl.constexpr 静态化\n\n【优化维度】：移植｜编译器约束\n【泛化层级】：Triton通用（迁移条件：参数在单次 kernel 启动后不变；失效边界：参数需在运行时动态变化时不能静态化）\n\n<原则：单次 launch 内不变的长度参数声明为 tl.constexpr 可触发 Triton-Ascend 编译器的启动级特化（launch-level specialization），生成特化代码。同时 tl.arange(0, BLOCK_SIZE) 要求 BLOCK_SIZE 为编译期常量，否则触发 dynamic-shape load 退化为标量循环。实测 +38% 提升。关联硬件依据：编译期常量允许编译器展开循环、分配固定向量寄存器。>\n\n<骨架（占位名伪码）：\n@triton.jit\ndef kernel(\n    ...,\n    channelLen: tl.constexpr,      # 单次 launch 不变 -> 静态化\n    tileLen: tl.constexpr,         # 单次 launch 不变 -> 静态化\n    BLOCK_SIZE: tl.constexpr,\n    num_cores: tl.constexpr,\n):\n    offsets = tl.arange(0, BLOCK_SIZE)   # 要求 BLOCK_SIZE 编译期常量\n>\n\n**坏实践（反例）**：将长度参数作为普通运行时 int 传入\n```python\n@triton.jit\ndef kernel(..., channelLen, tileLen, BLOCK_SIZE):   # 运行时参数\n    offsets = tl.arange(0, BLOCK_SIZE)              # dynamic-shape，退化为标量循环\n```\n后果：错失启动级特化（实测少 38%），且 tl.arange 触发 dynamic-shape load 退化。✅ 正解即本条 tl.constexpr 静态化。\n\n**已知实例**：GroupNormSwish §1 N5 / §2.1 L1.6（实测 0.9094x -> 1.2549x，+38%）（`triton-op-generator/template/normalization.md`）\n\n\n", "runbooks/portability/exp_api_003.md": "\n\n## 静态上限循环：while 改 for range（上限须为 tl.constexpr）\n\n【优化维度】：编译器约束/hints\n【适用条件】：平台 910b2/910b3 ｜ triton-ascend 版本 未标注（按验证版本）｜ dtype 全部 ｜ shape 任意（nd）\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3；失效边界：循环上限为运行时动态值时本方案不适用，需改用\"for + if + MAX_ITERS\"方案（见 exp_api_004）；上限未声明为 tl.constexpr 时编译期无法确定迭代数，替换失效；仅 910b2/910b3 验证，910C/310P 未验证（unverified)）\n\n### 原则\n- **替代规则**：循环上限为编译时常量时，直接用`for range`替代`while`循环，无需额外逻辑\n- **语法要求**：循环上限需声明为`tl.constexpr`，保证编译时确定\n\n### 代码/骨架出处\n- `Triton`:\n```python\n# Ascend后端while（静态上限）→ for range 替代\n# 错误: while循环（Ascend不支持）\n# @triton.jit\n# def while_static_kernel(ptr, blockSize: tl.constexpr):\n#     i = 0\n#     N_ITERS: tl.constexpr = 10  # 编译时常量\n#     while i < N_ITERS:\n#         offset = i * blockSize + tl.arange(0, blockSize)\n#         data = tl.load(ptr + offset)\n#         tl.store(ptr + offset, data * 2)\n#         i += 1\n\n# 正确: for range替代\n@triton.jit\ndef for_static_kernel(ptr, blockSize: tl.constexpr):\n    N_ITERS: tl.constexpr = 10  # 编译时常量\n    for i in range(N_ITERS):  # 直接替换while\n        offset = i * blockSize + tl.arange(0, blockSize)\n        data = tl.load(ptr + offset)\n        tl.store(ptr + offset, data * 2)\n```\n\n**坏实践（反例）**：在 910b2/910b3 上保留 `while i < N_ITERS`（即使 N_ITERS 是编译时常量）→ Ascend 后端不支持 while，直接编译报错 → ✅ 正解即本条：改 `for i in range(N_ITERS)` 并将上限声明为 `tl.constexpr`；另一个常见错误是上限用普通运行时变量声明，导致 for range 无法在编译期展开，同样报错\n\n**已知实例**：general_api §raw (`experiences/general_api/exp_api_003.yaml`)\n- 声称性能收益：0%\n- 备注：Ascend后端不支持while循环，静态上限场景`for range`是最优替代，无额外开销；循环上限必须为`tl.constexpr`，否则归为动态上限场景\n\n\n", "runbooks/portability/exp_constexpr_001.md": "\n\n## tl.constexpr 仅限内核参数声明，Host 侧禁用\n\n【优化维度】：编译器约束/hints\n【适用条件】：平台 910b2/910b3 ｜ triton-ascend 版本 未标注（按验证版本）｜ dtype 全部 ｜ shape 任意（nd）\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3；失效边界：仅约束内核参数声明与 Host 侧；kernel 体内局部常量标注（`X: tl.constexpr = ...`）不受影响；Host 侧用普通变量传参即可，不影响 kernel 内 constexpr 语义；仅 910b2/910b3 验证，910C/310P 未验证（unverified)）\n\n### 原则\n- **使用范围**：tl.constexpr 仅允许在内核函数的参数声明中使用（如 `blockSize tl.constexpr`），用于标记编译时常量\n- **禁用场景**：Host侧（kernel启动函数/模型forward函数）禁止使用`tl.constexpr`，该语法仅对Triton内核可见\n- **核心原因**：tl.constexpr 是编译期常量标记，Host侧无编译期上下文，使用会直接导致语法错误\n\n### 代码/骨架出处\n- `Triton`:\n```python\n# ========== tl.constexpr 正确/错误用法示例 ==========\n# 正确: 内核参数中使用tl.constexpr\n@triton.jit\ndef constexpr_correct_kernel(\n    input_ptr, output_ptr, n_elements,\n    blockSize: tl.constexpr  # 仅内核参数允许\n):\n    pid = tl.program_id(0)\n    offsets = pid * blockSize + tl.arange(0, blockSize)\n    mask = offsets < n_elements\n    data = tl.load(input_ptr + offsets, mask=mask)\n    tl.store(output_ptr + offsets, data * 2, mask=mask)\n\n# 错误: Host侧使用tl.constexpr\ndef forward_error(input_tensor):\n    # 禁止在Host侧参数声明中使用\n    # blockSize: tl.constexpr = 128\n    blockSize = 128  # Host侧直接用普通变量\n    output = torch.empty_like(input_tensor)\n    n_elements = input_tensor.numel()\n    grid = (triton.cdiv(n_elements, blockSize),)\n    constexpr_correct_kernel[grid](input_tensor, output, n_elements, blockSize)\n```\n\n**坏实践（反例）**：910b2/910b3平台对该语法的校验无容错，违反会直接编译失败\n\n**已知实例**：general_ascend §raw (`experiences/general_ascend/exp_constexpr_001.yaml`)\n- 声称性能收益：0%\n- 备注：tl.constexpr是Triton编译期常量标记，仅内核参数支持；910b2/910b3平台对该语法的校验无容错，违反会直接编译失败\n\n\n", "runbooks/memory-sram/exp_causal_conv1d_update_003.md": "\n\n## Memory Access Optimization: make block ptr hardware acceleration\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2/910b3，tile 加载为性能敏感路径；失效边界：D 较小（<2048）时 block_ptr 与标量 load 差异收窄，混合方案的 extract_slice 开销需实测确认；地址不规则的 gather 场景 block_ptr 不适用）\n\n### 原则\n- **make block ptr hardware acceleration**：`tl.make_block_ptr` 在 Ascend NPU 上映射为硬件 block transfer 指令（类似 DMA），一条指令搬运整个 tile，包含自动边界检查和零填充（padding_option='zero'）。这是 Ascend 专为 tile 加载优化的硬件原语，效率远高于通用标量 load 指令。在 causal_conv1d_update 中用于加载权重 `[D_CHK_SIZE, W]` 和存储输出 `[1, D_CHK_SIZE, T_CHK_SIZE]`。\n- **scalar load degradation**：用 4 次独立 `tl.load(weight_ptr + d_offs * width + offset, mask=mask_w)` 替代 1 次 `tl.load(make_block_ptr(...))` 会导致显著性能倒退。每条独立 load 需要独立的标量地址计算，丧失 block transfer 的 DMA 级效率。这在 W_IS_4 展开优化的负收益 case 中是首要根因。\n- **block ptr boundary check**：`make_block_ptr(..., boundary_check=(0, 1))` 由硬件处理边界检查，不产生软件 mask 运算开销。配合 `padding_option='zero'`，越界访问自动填零，消除 kernel 内的显式 mask 分支。\n- **hybrid loading strategy**：方案 B（进阶）：保留 make_block_ptr 加载权重 tile `[D_CHK_SIZE, W]`，然后展开 W 循环手动提取各列 `w0=tl.extract_slice(w, (0,0), (D_CHK,1))`，同时消除 x_b/w/out 的 3 次 transpose。这样既保留了 block transfer 的硬件加速，又获得了循环展开的数据编排消除收益。需实测验证大 D 时 w 的 4 次 extract_slice 开销是否可忽略。\n- **weight prefetch leverage**：make_block_ptr 提供硬件预取提示，允许 Ascend MTE2 在 Cube 计算期间异步预取下一 tile 的权重。独立 tl.load 无法提供等效的预取语义，导致 MTE2→Vector 流水线停顿增加。\n\n### 代码/骨架出处\n- `hybrid_approach`:\n```python\n# 方案 B: 保留 block_ptr 加载 + 消除 transpose\nw = tl.load(make_block_ptr(weight_ptr, shape=(dim, width), ...,\n          offsets=(di * D_CHK_SIZE, 0), block_shape=(D_CHK_SIZE, width)))\n# w 保持 [D_CHK, 4]，无需 transpose\nw0 = tl.extract_slice(w, (0, 0), (D_CHK, 1), (1, 1))\nw1 = tl.extract_slice(w, (0, 1), (D_CHK, 1), (1, 1))\nw2 = tl.extract_slice(w, (0, 2), (D_CHK, 1), (1, 1))\nw3 = tl.extract_slice(w, (0, 3), (D_CHK, 1), (1, 1))\n# x_b 保持 [D_CHK, buf] 布局，直接提取 4 个滑动窗口切片\nx_s0 = tl.extract_slice(x_b, (0, 0), (D_CHK, T_CHK), (1, 1))\nx_s1 = tl.extract_slice(x_b, (0, 1), (D_CHK, T_CHK), (1, 1))\nx_s2 = tl.extract_slice(x_b, (0, 2), (D_CHK, T_CHK), (1, 1))\nx_s3 = tl.extract_slice(x_b, (0, 3), (D_CHK, T_CHK), (1, 1))\nout_block = (x_s0 * w0 + x_s1 * w1 + x_s2 * w2 + x_s3 * w3)\n```\n\n**坏实践（反例）**：为配合 W 循环展开，把权重 tile 的 block_ptr 加载退化为 W 次独立标量 load\n```python\nw0 = tl.load(weight_ptr + d_offs * width + 0, mask=mask_w)  # 4 次独立标量 load\nw1 = tl.load(weight_ptr + d_offs * width + 1, mask=mask_w)\nw2 = tl.load(weight_ptr + d_offs * width + 2, mask=mask_w)\nw3 = tl.load(weight_ptr + d_offs * width + 3, mask=mask_w)\n```\n后果：每次 load 都要独立标量地址计算，丧失硬件 block transfer（DMA 级）效率与 MTE2 异步预取，D≥2048 时与 block_ptr 方案差 2-3x；这正是 W_IS_4 展开优化出现负收益的首要根因。✅ 正解：混合方案——保留 `make_block_ptr` 整块加载 `[D_CHK_SIZE, W]`，再用 `tl.extract_slice` 提取各列，硬件加速与数据编排消除兼得。\n\n**已知实例**：conv §raw (`experiences/conv/exp_causal_conv1d_update_003.yaml`)\n- 声称性能收益：block_ptr vs scalar load: 在 D≥2048 场景差异可达 2-3x（与循环展开组合效应）\n- 备注：此经验阐明 Ascend 上 make_block_ptr 与标量 tl.load 的根本差异：前者是硬件 DMA 原语，后者是通用标量指令。在性能敏感的 tile 加载路径上，应优先使用 make_block_ptr。若需手动索引权重（如 W 循环展开），应采用混合方案（block_ptr 加载 + extract_slice 切片）而非退化到独立 tl.load。\n\n\n", "runbooks/memory-sram/exp_causal_conv1d_varlen_opt_001.md": "\n\n## Memory Access Optimization: constexpr strides\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2/910b3，bf16/fp16，D≥1024、W=4 的变长滑窗场景；失效边界：D<1024 时 BLOCK_D=256 的降 grid 收益稀释；W≠4 需重算滑窗寄存器个数与重叠区长度；care_padding=False 要求 load 无越界 padding 需求，存在边界越界 mask 的访问模式不适用；bool→int32 与 float32 比较为 Ascend 编译器绕坑写法，其他后端无需迁移）\n\n### 原则\n- **constexpr strides**：将 conv_states 的 stride_line 和 stride_state 声明为 tl.constexpr， 使编译器在编译期完成地址偏移常量折叠，消除运行时乘法指令。贡献度 40%。\n- **block d 256**：BLOCK_D 从 128 增大到 256，将 dim=4096 时的 grid 程序数从 32 降为 16， 每程序工作量翻倍，减少调度开销。UB 占用仍远低于 192KB。贡献度 35%。\n- **care padding false**：所有 tl.load 使用 care_padding=False，消除 MTE2→Vector 同步屏障， 提升 load/compute 流水线并行度。贡献度 25%。\n- **conditional window shift**：使用 tl.where 条件更新滑动窗口（prev0/prev1/prev2）， 避免循环超出有效 token 范围后用零值覆盖历史状态。这是功能正确性修复但也影响性能。\n- **bool to int32**：将 bool tensor (has_initial_state) 在 host 侧转为 int32， kernel 中用 int32 > 0 比较替代直接 bool mask，避免 i8 mask 编译错误。\n- **float32 compare**：标量整数比较 (cache_idx >= 0) 转换为 float32 比较， 避免 int32 CMP scalar fallback。\n\n### 代码/骨架出处\n- `description`:\n```python\nCausal Conv1D forward + state update, 2D grid (batch, cdiv(dim,BLOCK_D)), sliding window register reuse\n```\n\n**坏实践（反例）**：stride 作为运行时标量传入，寻址偏移在 kernel 内临时计算\n```python\ndef kernel(..., stride_line, stride_state):        # 运行时标量\n    offs = di * stride_line + si * stride_state    # 每次 load 都附带乘法\n    st = tl.load(conv_states_ptr + offs, care_padding=True, ...)  # 还多一道 MTE2→Vector 屏障\n```\n后果：地址偏移无法常量折叠，每次访存附带运行时乘法指令（YAML 实测贡献度 40%）；care_padding 默认开启又引入同步屏障（贡献度 25%）。✅ 正解：stride_line/stride_state 声明为 tl.constexpr 做编译期常量折叠，所有 tl.load 置 care_padding=False，并把 BLOCK_D 提到 256 使 grid 程序数减半。\n\n**已知实例**：conv §raw (`experiences/conv/exp_causal_conv1d_varlen_opt_001.yaml`)\n- 声称性能收益：22%\n- 备注：此算子为 Causal Conv1D with variable-length sequences, conv_states update, optional bias and SiLU activation。关键挑战：(1) if/else 分支类型一致性约束； (2) bool tensor 在 Ascend 上的 i8 类型问题；(3) 循环超出有效范围时窗口移位逻辑保护。 最终实现 8.47x 加速比（vs PyTorch baseline），优化后 1.22x vs Phase 3 基线。\n\n\n", "runbooks/memory-sram/exp_solve_tril_002.md": "\n\n## Memory Access Optimization: preload extract slice eliminate hbm read\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2/910b3/91093/91095，fp16/bf16/fp32，对角块 block_size=16（实测 BT=16/32/64）；失效边界：小 grid（如 B=1、T=512）场景 preload 的寄存器操作开销与省下的 global load 基本抵消（实测仅 1.01x）；该模式依赖 Triton 不支持运行时动态索引这一前提，若编译器行为变化需重估）\n\n### 原则\n- **preload extract slice eliminate hbm read**：当矩阵块已在循环外通过单次 `tl.load(block_ptr)` 加载到寄存器后，循环内不应再用 `tl.load(A + row_offset)` 逐行重新从 HBM 读取。虽然 Triton 不支持 `b_A[i, :]` 动态寄存器索引，但可以使用 `tl.extract_slice(neg_A, (i, 0), (1, 16), (1, 1))` + `tl.reshape` 从寄存器块提取行数据，完全消除循环体内的 HBM 访问。\n- **why triton cannot dynamic index**：`b_A[i, :]` 在 Triton 中会报错 `ValueError('unsupported tensor index: int32[]')`——i 是运行时 int32，Triton 的 block tensor 不支持运行时动态索引。`tl.extract_slice` 是 Triton 支持的寄存器块子集提取原语，offset 为运行时变量时生成动态偏移指令（开销低于 global load）。\n- **preload pattern**：循环前预加载并取反：`neg_A = -b_A`（或保留原值）。循环内 `b_a = tl.extract_slice(neg_A, (i, 0), (1, BLOCK), (1, 1))` + `b_a = tl.reshape(b_a, (BLOCK,))`。BLOCK=16 时 reshape 零开销。\n- **multi block extension**：对于分块矩阵（如 32×32 有 2 个对角块、64×64 有 4 个对角块），每个对角块独立预加载并独立 extract_slice，块间无依赖。\n- **tradeoff analysis**：小 grid（B=1, T=512）场景下 preload 的额外寄存器操作开销可能与省下的 global load 抵消（实测 1.01x）。大 grid 场景累计效益显著（1.37x）。选择始终使用 extract_slice 可统一代码路径。\n\n### 代码/骨架出处\n- `preload_extract`:\n```python\n# 循环外：预加载整个 16×16 块到寄存器\nneg_A = -b_A  # b_A 已通过 tl.load(make_block_ptr(...)) 加载\n\n# 循环内：从寄存器提取，零 HBM 访问\nfor i in range(2, BT):\n    b_a = tl.extract_slice(neg_A, (i, 0), (1, 16), (1, 1))\n    b_a = tl.reshape(b_a, (16,))\n    b_a = b_a + tl.sum(b_a[:, None] * b_A, 0)\n    b_A = tl.where((o_i == i)[:, None], b_a, b_A)\n```\n- `before_hbm_read`:\n```python\n# 反模式：循环内逐行从 HBM 重新读取（数据已在寄存器中）\nfor i in range(2, min(16, T - i_t * 16)):\n    b_a = -tl.load(A + (i_t * 16 + i) * H*BT + o_i + offset)  # HBM read!\n    ...\n```\n\n**坏实践（反例）**：循环内逐行从 HBM 重读已预加载到寄存器的块数据（即上方 `before_hbm_read` 反模式）\n```python\nfor i in range(2, BT):\n    b_a = -tl.load(A + (i_t * 16 + i) * H*BT + o_i + offset)  # 数据已在寄存器块 b_A 中\n```\n后果：每行一次多余 GM 读，循环体被内存延迟支配。注意不能写成 `b_A[i, :]`——Triton 对运行时 int32 下标报 `ValueError('unsupported tensor index')`。✅ 正解：循环外单次 `tl.load(block_ptr)` 预加载整块，循环内 `tl.extract_slice` + `reshape` 从寄存器块提取行，循环体零 HBM 访问。\n\n**已知实例**：solve_tril §raw (`experiences/solve_tril/exp_solve_tril_002.yaml`)\n- 声称性能收益：1.01x-1.37x（BT=16, V4 vs V1）；1.25x-1.27x（BT=32, V4 vs V1，首次优化）；1.11x-1.13x（BT=64, V4 vs V1）\n- 备注：此为 V4 优化的核心。与 V1（exp_solve_tril_001）组合后，ORIGINAL vs V4 累计加速比：BT=16 达 1.42x-2.54x，BT=32 达 1.26x-1.29x，BT=64 达 1.55x-1.57x。\n\n\n", "runbooks/memory-sram/pow2-block-constexpr.md": "\n\n## OPT-1 BLOCK 取 2 的幂并 constexpr 化\n\n【优化维度】：内存｜Tiling·SRAM 预算\n【泛化层级】：Triton通用（迁移条件：所有向量化 load 的 BLOCK_SIZE；无失效边界）\n\n<原则：Ascend 上 fixed-shape vector load 必须是编译期常量长度；若 tl.arange(0, N) 中 N 非 constexpr 会触发 dynamic-shape load 退化为标量循环。BLOCK 取 2 的幂对 NPU 向量化友好，且必须声明为 tl.constexpr。与 [[constexpr-launch-specialization]] 同属编译期常量化。>\n\n<骨架（占位名伪码）：\nBLOCK = triton.next_power_of_2(widthLen)   # 64/128/256/512/1024/2048/4096...\n# 作为 constexpr 传入 kernel\nkernel[grid](..., BLOCK_SIZE=BLOCK)\n# kernel 内\noffsets = tl.arange(0, BLOCK_SIZE)   # 编译期常量，vector load 不退化\n>\n\n**坏实践（反例）**：BLOCK 用运行时长度或非 constexpr\n```python\nBLOCK = widthLen                      # 非 2 的幂，运行时长度\nkernel[grid](..., BLOCK_SIZE=BLOCK)   # 未声明 tl.constexpr\n# kernel 内 tl.arange(0, BLOCK_SIZE) 触发 dynamic-shape load 退化\n```\n后果：vector load 退化为标量循环，性能骤降。✅ 正解即 next_power_of_2 + tl.constexpr。\n\n**已知实例**：tensor-transform G2（`triton-op-generator/template/tensor-transform.md`）\n\n\n", "runbooks/memory-sram/preload-extract-slice-eliminate-reread.md": "\n\n## OPT-23 preload + extract_slice 消除循环内同一数据重复 HBM 读取\n\n【优化维度】：内存｜访存效率\n【泛化层级】：条件性（迁移条件：循环外已用 block_ptr 加载整个块，循环内需要按行/列/子块访问同一数据；失效边界：数据未在循环外加载，或 extract_slice 偏移无法表达）\n\n<原则：Triton block tensor 不支持动态索引（`b_A[i, :]` 报错）。当矩阵块已在循环外加载到寄存器，循环内需要按行/列/子块访问同一数据时，应使用 `tl.extract_slice` 从寄存器提取，而非退化到 `tl.load(A + row_offset)` 重新从 HBM 读取。>\n\n**核心问题**：\n\n```python\n# 循环外一次性预加载整个块到寄存器\nb_A = tl.load(make_block_ptr(A, ..., block_shape=(BLOCK, BLOCK)))\n\n# 错误：循环内逐行重新从 HBM 读取同一数据\nfor i in range(2, BLOCK):\n    b_a = tl.load(A + i * stride)  # 重复 HBM 读！\n```\n\n**正例**：\n\n```python\n# 循环外：一次性预加载整个块到寄存器\nb_A = tl.load(make_block_ptr(A, ..., block_shape=(BLOCK, BLOCK)))\nneg_A = -b_A  # 预取反后的块\n\n# 循环内：从寄存器提取，零 HBM 访问\nfor i in range(2, BLOCK):\n    b_a = tl.extract_slice(neg_A, (i, 0), (1, BLOCK), (1, 1))\n    b_a = tl.reshape(b_a, (BLOCK,))\n    # ... 使用 b_a 计算 ...\n```\n\n**为什么不用 `b_A[i, :]`**？\n\nTriton 报错 `ValueError('unsupported tensor index: int32[]')`——`i` 是运行时 int32，block tensor 不支持动态索引。`tl.extract_slice` 是 Triton 支持的寄存器块子集提取原语，offset 为运行时变量时生成动态偏移指令，开销远低于 HBM load。\n\n**适用条件**：\n\n- 数据已在循环外的寄存器中（通过 block_ptr 或一次性 load）\n- 循环内需要按行/列/子块访问同一数据\n- 循环次数 ≥ 2，预加载的额外寄存器操作可被摊还\n\n**收益与权衡**：\n\n| 场景 | 收益 |\n|---|---|\n| 大 grid（B≥4, T≥1024） | 显著（1.27x–1.37x），HBM load 节省累积放大 |\n| 小 grid（B=1, T=512） | 微小（~1.01x），额外寄存器操作与省下的 load 几乎抵消 |\n| 多对角块 | 每块独立预加载，各省循环体内 HBM 读取 |\n\n**坏实践（反例）**：\n```python\nb_A = tl.load(make_block_ptr(A, ...))\nfor i in range(BLOCK):\n    row = tl.load(A + i * stride)  # 重复读取已在寄存器中的数据\n```\n后果：同一数据多次 HBM 读取，带宽浪费。✅ 正解即 `tl.extract_slice`。\n\n## 已知实例（P3 挂载）\n\n### Experience YAML 反链\n- `exp_solve_tril_002` — Memory Access Optimization （收益 1.01x-1.37x（BT=16, V4 vs V1）；1.25x-1.27x（BT=32, V4 vs V1，首次优化）；1.11x-1.13x（BT=64, V4 vs V1））\n  - 此为 V4 优化的核心。与 V1（exp_solve_tril_001）组合后，ORIGINAL vs V4 累计加速比：BT=16 达 1.42x-2.54x，BT=32 达 1.26x-1.29x，BT=64 达 1.55x-1.57x。\n\n\n", "runbooks/meta-skills/exp_solve_tril_006.md": "\n\n## 负优化排除清单：微小矩阵禁 tl.dot、constexpr 展开优先、preload 按 grid 规模决策\n\n【优化维度】：瓶颈诊断树\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3, 91093, 91095；失效边界：14-20x 退化数据针对 1×16×16×16 级别的微小矩阵，矩阵尺寸放大后 CUBE 调度开销被摊薄、tl.dot 重新占优（具体拐点未测定）；VEC 广播乘+sum 的替代仅对 M=1 或 N=1 或 K≤16 成立；逐行递推 O(BT²) 依赖是三角求解类算法的固有结构限制，换算法（如分块求逆）才可能突破；触发条件：对小尺寸矩阵 kernel 做优化选型时先查本卡排除已知无效方向）\n\n### 原则\n- **tl dot vs tl sum broadcast decision**：对 1×16 × 16×16 的微小矩阵乘法，使用 `tl.dot`（CUBE 单元）比 `tl.sum(b_a[:, None] * b_A, axis=0)`（VEC 单元广播乘+归约）慢 14-20x。CUBE 单元的调度和启动开销在微小尺寸下远大于 VEC 直接计算。**决策原则**：微小矩阵乘法（M=1 或 N=1 或 inputB≤16）优先用 VEC 广播乘 + sum 归约，不要强行用 tl.dot。\n- **constexpr unroll vs runtime loop decision**：去掉 if/else 统一用运行时循环（V3）会导致失去 constexpr 展开优化，性能回退到 V1 水平。constexpr 展开使 extract_slice 的 offset 参数为编译期常量，生成静态偏移指令（零 ALU）。**决策原则**：当 99% 的 tile 走同一代码路径时，保留 constexpr 双分支比代码简洁性更重要。\n- **register vs hbm tradeoff**：preload 整个 16×16 块会增加寄存器占用（256 elements fp32 = 1KB）。对小 grid 场景（B=1, T=512），额外的寄存器操作开销可能与省下的 global load 抵消（实测 1.01x）。**决策原则**：大 grid 场景（B≥4, T≥1024）无条件启用 preload；小 grid 场景可考虑保留 HBM load（代码略简），但统一使用 extract_slice 的代码一致性通常优先。\n- **off diagonal preload excluded**：提前加载 off-diagonal block 会增加寄存器压力（64×64 kernel 已有 10 个 16×16 块），可能导致寄存器 spill。**决策原则**：寄存器中仅保留对角块（基础计算单元），off-diagonal block 按需从 HBM 加载——逐层计算模式下每层只用到特定的 off-diagonal 块，全部预加载造成浪费。\n- **algorithmic bottleneck**：16×16 kernel 的逐行递推存在 O(BT²) 次迭代内的数据依赖——第 i 行严格依赖前 i-1 行的计算结果，无法并行化或流水线化。**这是算法的根本限制**，非代码优化可克服。32×32 和 64×64 merge kernel 的计算瓶颈在 16×16 tl.dot 矩阵乘法（CUBE 单元已饱和）。\n- **exhaustive audit result**：对照经验库全部 20+ 条经验审计后确认：当前算子已达到局部最优。已应用：block_ptr 访存、fp32 中间计算、contiguous 输入、empty_like 分配、冗余消除、extract_slice 寄存器读取、constexpr 展开。不适用或无效：块大小优化（BT 是算子语义决定）、TMA 异步拷贝（CANN 8.5.0 不支持）、tl.dot 替代 VEC 广播乘（14-20x 退化）。\n\n### 代码/骨架出处\n- `dot_vs_sum`:\n```python\n# 反模式（14-20x 退化）：微小矩阵用 tl.dot\nb_a = tl.reshape(b_a, (1, 16))\nb_a = tl.dot(b_a, b_A)  # CUBE 调度开销 >> 计算量\n\n# 正模式（高效）：VEC 广播乘 + 归约\nb_a = b_a + tl.sum(b_a[:, None] * b_A, 0)  # 1×16 × 16×16 → VEC\n```\n\n**坏实践（反例）**：此经验记录优化尝试中被排除的方向及其根因，避免未来重复尝试无效优化\n\n**已知实例**：solve_tril §raw (`experiences/solve_tril/exp_solve_tril_006.yaml`)\n- 声称性能收益：N/A（排除无效优化方向，避免负优化）\n- 备注：此经验记录优化尝试中被排除的方向及其根因，避免未来重复尝试无效优化。所有尝试均在 solve_tril_analyze.md §9.6 中有详细分析。\n\n\n", "runbooks/compute-pipeline/constexpr-branch-elimination.md": "\n\n## OPT-13 用 tl.constexpr 编译期消除运行时分支\n\n【优化维度】：计算｜Scalar 削减\n【泛化层级】：Triton通用（迁移条件：kernel 内有配置级布尔开关；失效边界：开关值在运行时才确定且变化频繁）\n\n<原则：Triton 的运行时 if/else 会让两路代码都被编译并在执行时做分支预测。把配置级布尔参数提升为 `tl.constexpr` 后，编译器在编译期就知道走哪条路，完全删除未选中分支，消除分支预测开销并减少 kernel 体积。>\n\n**常见 constexpr 开关模式**：\n\n| 开关名 | 含义 | 编译期消除内容 |\n|---|---|---|\n| `HAS_BIAS` | 是否有 bias | bias load + add 指令 |\n| `HAS_RESIDUAL` | 是否有残差加 | residual load + add |\n| `ALIGNED` / `DIM_IS_MULTIPLE` | 维度是否对齐 | boundary check mask 运算 |\n| `IS_NEOX_STYLE` | RoPE 布局 | 布局转换分支 |\n| `HAS_CAUSAL_MASK` | 是否有因果掩码 | mask 加法和 tril 检查 |\n| `W_IS_4` | 卷积核 W=4 且 D≥阈值 | 循环展开 vs for 循环 |\n| `INVERSE` / `BACKWARD_PASS` | 前向/反向 | 方向判断和不同运算路径 |\n\n**正例**：\n\n```python\n@triton.jit\ndef kernel(..., HAS_BIAS: tl.constexpr, ALIGNED: tl.constexpr):\n    if HAS_BIAS:          # 编译期消除，False 时不生成任何指令\n        bias = tl.load(bias_ptr + n_offs)\n        acc = acc + bias\n    \n    if ALIGNED:           # 编译期消除 mask\n        x = tl.load(ptr + offs)\n    else:\n        x = tl.load(ptr + offs, mask=mask)\n```\n\n**坏实践（反例）**：\n\n```python\n@triton.jit\ndef kernel(..., use_bias, is_aligned):   # 普通参数\n    if use_bias:      # 运行时分支：两路都编译\n        bias = tl.load(...)\n```\n后果：kernel 体积大、分支预测失败、SIMD 执行路径不统一。✅ 正解即配置级开关用 `tl.constexpr`。\n\n**DIM_IS_MULTIPLE 特例**：\n\n```python\n# host 端\nDIM_IS_MULTIPLE = (dim % D_CHK_SIZE == 0)\n\n# kernel 端\n@triton.jit\ndef kernel(..., DIM_IS_MULTIPLE: tl.constexpr):\n    d_offs = di * D_CHK_SIZE + tl.arange(0, D_CHK_SIZE)\n    if not DIM_IS_MULTIPLE:\n        mask_d = d_offs < dim\n        x = tl.load(ptr + d_offs, mask=mask_d)\n    else:\n        x = tl.load(ptr + d_offs)  # 无 mask，省 5-15% 标量指令\n```\n\n**W_IS_4 阈值控制**：\n\n```python\n# host 端：仅在 D 足够大时启用展开\nW_IS_4 = (width == 4 and dim >= 1024)\n\n# kernel 端\n@triton.jit\ndef kernel(..., W_IS_4: tl.constexpr):\n    if W_IS_4:\n        out = x_s0*w0 + x_s1*w1 + x_s2*w2 + x_s3*w3  # 展开\n    else:\n        for owi in tl.range(0, width):\n            out += x_slice * w_slice                    # for 循环\n```\n\n| D | 加速比 | 策略 |\n|---|---|---|\n| ≥ 2048 | 2.3x - 3.1x | 启用展开 |\n| ≤ 256 | 0.41x - 0.75x | 回退 for 循环 |\n\n**do_not_specialize 补充**：对频繁变化的标量（如 `seq_len`）加 `do_not_specialize`，避免每个值重编译：\n\n```python\n@triton.jit(do_not_specialize=[\"seq_len\", \"batch_size\"])\ndef kernel(...):\n    ...\n```\n\n\n", "runbooks/compute-pipeline/exp_fused_norm_rope_matmul_001.md": "\n\n## Scheduling Optimization: hardware unit isolation\n\n【优化维度】：多核并行与负载均衡\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3；失效边界：依赖 dl dialect 异构调度（CANN/Triton 栈支持）；融合链各 stage 间数据必须能驻留 L0/L1；归一化/rope 的 vector 侧耗时若接近 matmul 的 cube 侧，流水重叠空间才存在，否则收益减半）\n\n### 原则\n- **hardware unit isolation**：The kernel explicitly utilizes `dl.async_task` to dispatch the matrix multiplication (`partial_matmul_kernel`) to the Cube unit and the normalization/RoPE operations (`fused_single_norm_and_partial_rope_kernel`) to the Vector unit. This maximizes utilization by allowing the specialized hardware units to operate in parallel or pipelined fashion.\n- **operator fusion**：RMSNorm and Rotary Positional Embedding (RoPE) are fused into a single kernel execution stream. This significantly reduces global memory read/write overhead by keeping intermediate data in high-speed memory or registers, avoiding the need to write back normalized activations before applying RoPE.\n- **asynchronous pipeline**：By using `scope=dl.async_task.cube` and `scope=dl.async_task.vector`, the implementation enables asynchronous execution. This allows the compute-intensive matrix multiplication on the Cube to potentially overlap with the vector operations or data movement, effectively hiding latency and improving throughput.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/081-fused_single_norm_rope_matmul_kernel.py\n```\n\n**坏实践（反例）**：归一化、RoPE、matmul 各自独立 kernel → 中间激活多次 HBM 往返，cube/vector 串行等待 → ✅ 正解即本条：vector 侧融合归一化+RoPE，cube 侧做 matmul，async scope 流水重叠。\n\n**已知实例**：matmul §raw (`experiences/matmul/exp_fused_norm_rope_matmul_001.yaml`)\n- 声称性能收益：35%\n- 备注：This optimization is highly effective for Transformer decoder layers where Matmul is followed by Norm and RoPE. It requires the underlying hardware and compiler stack (e.g., CANN with Triton) to support the `dl` dialect and heterogeneous task scheduling.\n\n\n", "runbooks/compute-pipeline/exp_matmul_qn_001.md": "\n\n## Scheduling Optimization: hardware specific instruction\n\n【优化维度】：多核并行与负载均衡\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3, 91093, 91095；失效边界：依赖 dl 接口与 grouped_launch_diagonal 辅助函数，运行时缺失则不可用；NUM_HEADS 核内迭代在头数极大时片上压力上升；静态跨步调度要求各块负载大致均匀）\n\n### 原则\n- **hardware specific instruction**：Utilizes `dl.compile_hint` with the argument \"dot_pad_only_k\". This is a critical optimization for Ascend NPUs (910 series), instructing the compiler to pad only the K dimension of the matrix tiles. This minimizes the amount of zero-padding required for the dot product engine, thereby reducing memory traffic and increasing the effective throughput of the Cube unit.\n- **batched head iteration**：The kernel iterates over `NUM_HEADS` inside the program body rather than flattening the head dimension into the global grid or launching separate kernels. This reduces kernel launch overhead and allows for efficient handling of the 3D tensor structure (Batch, Heads, Hidden) required by attention mechanisms.\n- **static scheduling strategy**：Implements a static work distribution using the loop `for block_idx in range(pid, NUM_BLOCKS, NUM_CORES)`. This pattern statically assigns blocks to processing cores based on the program ID, avoiding the overhead of dynamic scheduling mechanisms and ensuring predictable memory access patterns across the NPU cores.\n- **grouped launch diagonal**：Employs a `grouped_launch_diagonal` helper to map block indices to task coordinates. This suggests a diagonal or specific tiling traversal order which can improve cache locality for the matrix operands compared to a standard row-major or column-major traversal.\n- **persistent kernel pattern**：Implements a grid-stride loop using `range(pid, NUM_BLOCKS, NUM_CORES)`, allowing a single program instance to process multiple output blocks sequentially. This reduces kernel launch overhead and improves hardware utilization by keeping cores active longer.\n- **intra kernel batch iteration**：Manually iterates over the `NUM_HEADS` dimension inside the kernel body (`for head_idx in range(NUM_HEADS)`). This fuses the batch processing logic, avoiding the overhead of launching separate kernels for each attention head.\n- **hardware specific padding hint**：Utilizes `dl.compile_hint(..., \"dot_pad_only_k\")` to provide explicit instructions to the compiler backend regarding padding strategy for the dot product operation. This ensures the data layout aligns with the requirements of the hardware's matrix compute unit (e.g., Cube unit), preventing performance penalties from implicit padding.\n- **diagonal block mapping**：Uses `grouped_launch_diagonal` to map block indices to the M and N grid dimensions. This scheduling strategy often improves cache locality or load balancing compared to a simple row-major traversal.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/049-matmul_qn_kernel.py\n```\n\n**坏实践（反例）**：每个 head 单独 launch 一个 kernel → NUM_HEADS 次 launch 开销，小 head_dim 时调度主导时延 → ✅ 正解即本条：头维核内迭代 + persistent 跨步 + 对角块映射 + `dot_pad_only_k`。\n\n**已知实例**：matmul §raw (`experiences/matmul/exp_matmul_qn_001.yaml`)\n- 声称性能收益：25%\n- 备注：This kernel is specifically designed for a projection step in attention-like mechanisms on Ascend hardware, leveraging the DeepLink (dl) interface for hardware-specific optimizations.\n\n\n", "runbooks/compute-pipeline/exp_solve_tril_003.md": "\n\n## Compute Optimization: constexpr dual path full vs boundary\n\n【优化维度】：AICore 单元利用/Scalar 削减\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3, 91093, 91095；失效边界：要求 tile 大小是 constexpr 且存在完整/边界两类 chunk；统一数据来源（extract_slice）是前提——若边界路径用 tl.load 反而更贵；BT 很小（如 16）时循环展开收益有限，双路径的代码复杂度需权衡）\n\n### 原则\n- **constexpr dual path full vs boundary**：当 kernel 处理固定大小 tile 时，绝大多数 chunk 是完整 tile（99%），仅最后一个可能是边界不完整 tile。用 `if T - chunk_offset >= BT` 分支：(1) 快速路径使用 `range(2, BT)` 其中 BT 是 `tl.constexpr`，编译器完全展开循环 + extract_slice offset 静态优化为零开销；(2) 慢速路径使用运行时 `range(2, min(16, remaining))`，仍从寄存器提取数据。两个路径统一数据来源（均 extract_slice），区别仅在于循环展开程度。\n- **constexpr static unroll benefit**：`range(2, BT)` 当 BT 是 constexpr 时，Triton 编译器在编译期：(1) 完全展开循环体；(2) extract_slice 的 offset 参数 `(i, 0)` 中的 i 为编译期常量，生成静态偏移指令（零 ALU）；(3) 消除循环分支预测开销。\n- **boundary path still register**：慢速（边界）路径虽然循环未展开，但同样使用 extract_slice 从预加载的寄存器块读取——消除 HBM 访问的收益对所有 chunk 均等。\n- **excluded approaches**：被排除的方案：(a) 统一运行时循环（失去 constexpr 展开优化，性能回退到 V1 水平）；(b) 慢速路径保留 tl.load（不如 extract_slice 统一简洁，且边界块 HBM 读取无性能优势）。\n- **applicability**：适用于所有以固定 tile 处理数据、且 tile 大小是 constexpr 的 kernel。只要存在'完整 tile'和'边界不完整 tile'两种情况，即可用此双路径模式。\n\n### 代码/骨架出处\n- `dual_path`:\n```python\nneg_A = -b_A  # 预加载到寄存器\n\nif T - i_t * 16 >= BT:\n    # 快速路径：完整 chunk，BT 是 constexpr → 循环完全展开\n    for i in range(2, BT):\n        b_a = tl.extract_slice(neg_A, (i, 0), (1, 16), (1, 1))\n        b_a = tl.reshape(b_a, (16,))\n        b_a = b_a + tl.sum(b_a[:, None] * b_A, 0)\n        b_A = tl.where((o_i == i)[:, None], b_a, b_A)\nelse:\n    # 慢速路径：边界 chunk，运行时循环 → 仍从寄存器读\n    for i in range(2, min(16, T - i_t * 16)):\n        b_a = tl.extract_slice(neg_A, (i, 0), (1, 16), (1, 1))\n        b_a = tl.reshape(b_a, (16,))\n        b_a = b_a + tl.sum(b_a[:, None] * b_A, 0)\n        b_A = tl.where((o_i == i)[:, None], b_a, b_A)\n```\n\n**坏实践（反例）**：为代码简洁用统一运行时循环 `range(2, min(16, remaining))` 处理所有 chunk（V3 方案）→ 失去 constexpr 完全展开与静态偏移，性能回退到未优化水平 → ✅ 正解即本条：`if T - chunk_offset >= BT` 双路径，99% 完整块走 constexpr 展开快速路径，边界块走运行时循环但仍从寄存器 extract_slice 读。\n\n**已知实例**：solve_tril §raw (`experiences/solve_tril/exp_solve_tril_003.yaml`)\n- 声称性能收益：此模式保证快速路径（99% chunk）达到最优展开性能，避免统一运行时循环导致的性能退化\n- 备注：此为 V4 最终方案的路径选择策略（V4 混合模式）。V3（统一运行时循环）被排除——虽然代码更简洁，但失去 constexpr 展开后性能回退到 V1 水平。\n\n\n", "runbooks/compute-pipeline/operator-fusion-patterns.md": "\n\n## DG-11 算子融合模式与约束决策\n\n【优化维度】：计算｜融合\n【泛化层级】：条件性（迁移条件：数据依赖的连续算子；失效边界：独立并行、多消费者、UB 放不下或对齐冲突）\n\n<原则：融合把多个算子的 HBM 往返消除，将中间结果保留在 UB/寄存器内。对内存受限算子（elementwise、norm、activation）通常带来 25–50% 提升。但融合必须满足 UB 容量、相同 grid 结构、无多消费者、对齐兼容四个约束，否则反而导致 UB overflow 或编译失败。>\n\n**为什么融合能提速**：\n\n```\n未融合：GEMM → [HBM 写 C] → RMSNorm → [HBM 读 C] → [HBM 写 Y]\n已融合：GEMM → [UB 内] → RMSNorm → [HBM 写 Y]\n```\n\n每消除一对 HBM 读/写，约省 15–20% 延迟。\n\n**常见融合模式与收益**：\n\n| 模式 | 收益 | 关键约束 |\n|---|---|---|\n| GEMM + Activation | 15–20% | activation 在 fp32 accumulator 上计算 |\n| GEMM + Bias | 10–15% | bias 向量寄存器驻留 |\n| GEMM + RMSNorm | ~35% | 输出 tile UB 内完成归一化 |\n| GEMM + RoPE | ~25% | Q/K head 布局兼容 |\n| Skip + LayerNorm | ~30% | residual 与输入同 grid |\n| RMSNorm + Quantization | ~50% | scale 在 UB 内计算并写出 |\n| Conv1D + State + SiLU | ~35% | 状态更新用双缓冲避免竞争 |\n\n**Cube/Vector 异构融合（dl.async_task）**：\n\n```python\nimport triton_ascend.language as dl\n\n@triton.jit\ndef fused_gemm_norm(...):\n    with dl.async_task(scope=\"cube\"):\n        acc = tl.dot(a_tile, b_tile)\n\n    with dl.async_task(scope=\"vector\"):\n        rms = tl.sqrt(tl.sum(acc * acc, axis=1) / N + eps)\n        out = (acc / rms[:, None]) * weight\n        tl.store(Y_ptr + ..., out)\n```\n\nCube 计算 tile `i+1` 的同时，Vector 归一化 tile `i`。\n\n**融合约束清单**：\n\n```\n□ 操作 A 的输出是操作 B 的输入（数据依赖）\n□ 融合后所有中间 tensor 能放入 UB（≤ 192KB，matmul 保守 ≤ 64KB）\n□ 两个操作使用相同 grid / block 结构\n□ 中间结果不被多个下游消费者使用\n□ 对齐要求兼容（如 GEMM BLOCK_N=256 vs GroupNorm cpg=64 可能冲突）\n□ 激活函数在 fp32 累加器上计算，避免 fp16 溢出\n```\n\n**坏实践（反例）**：\n```python\n# 强行融合独立操作，grid 不一致\nop1_grid = (batch, M)\nop2_grid = (batch, N)\n```\n后果：编译失败或性能倒退。✅ 正解即只融合数据依赖且 grid 一致的操作。\n\n**双缓冲状态融合**：当多个 program 并发写入共享状态（conv_state、KV cache）时，写独立 buffer + host 侧 `copy_` 同步，避免 WAR 依赖和伪共享。\n\n**决策流程**：\n\n```\n1. 是否存在数据依赖链 A→B？\n   NO → 不融合\n2. 中间 tensor 是否多消费者？\n   YES → 不融合（保留中间 HBM）\n3. 融合后 tile 是否超 UB？\n   YES → 增大 BLOCK 或拆分为两阶段\n4. grid/对齐是否兼容？\n   NO → 不融合或调整 BLOCK\n5. 使用 dl.async_task 区分 Cube/Vector？\n   YES → 异构并行\n```\n\n\n"}};

 const inc=cy.getElementById(id).connectedEdges().map(x=>x.data('e'));
 const groups={};inc.forEach(e=>{if(e.type==='part_of')return;const me=id;const other=e.source===me?e.target:e.source;const lab=persp(e,me);(groups[lab]=groups[lab]||[]).push([other,e]);});
 const order=['实现示例','对应接口','开发指南','讲解接口','声明头文件','声明的接口','配套样例','对应指南','同主题','相关','提及'];
 Object.keys(groups).sort((a,b)=>order.indexOf(a)-order.indexOf(b)).forEach(lab=>{h+=`<div class="grp">${lab} (${groups[lab].length})</div>`;groups[lab].forEach(([o,e])=>{const t=nodeById[o];h+=`<a class="nb" onclick="showDetail('${o}')">${esc(t?t.title:o)} <span class="w">· ${ETZH[e.type]||e.type} ${e.weight.toFixed(1)}</span></a>`;});});
 const bl=(back[id]||[]).filter(e=>e.type!=='part_of'&&!e.symmetric);
 if(bl.length){h+=`<div class="grp">被引用 / 指向本卡 (${bl.length})</div>`;bl.forEach(e=>{const t=nodeById[e.source];h+=`<a class="nb" onclick="showDetail('${e.source}')">${esc(t?t.title:e.source)} <span class="w">· ${ETZH[e.type]||e.type}</span></a>`;});}
 const body=(G.bodies||{})[id];if(body){h+=`<div id="body">${marked.parse(body,{gfm:true,breaks:false})}</div>`;}
 const d=document.getElementById('detail');d.innerHTML=h;d.scrollTop=0;
 d.querySelectorAll('#body a[href]').forEach(a=>{const href=a.getAttribute('href');if(href&&href.endsWith('.md')&&!href.includes('://')){const tid=resolveLink(id,href);if(tid){a.className='int';a.removeAttribute('href');a.onclick=()=>showDetail(tid);return;}}a.className='ext';a.target='_blank';a.rel='noopener';});}
function kg(k){if(['implementation_trap','debugging_journey','cross_skill_gap','field_note'].includes(k))return'field_note';if(['operator_optimization','runbook'].includes(k))return'runbook';return k;}
function persp(e,me){const k=kg(nodeById[me].kind);if(e.type==='exemplifies'){if(k==='api'||k==='guide')return'实现示例';if(k==='operator'||k==='field_note')return'实践案例';return'对应接口';}if(e.type==='explains'){if(k==='api')return'开发指南';if(k==='operator'||k==='field_note'||k==='runbook')return'开发指南';return'讲解接口';}if(e.type==='declares')return k==='api'?'声明头文件':'声明的接口';if(e.type==='demonstrates')return k==='guide'?'配套样例':'对应指南';if(e.type==='same_topic')return'同主题';if(e.type==='related')return'相关';if(e.type==='mentions')return'提及';return'相关';}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
cy.on('tap','node',ev=>showDetail(ev.target.id()));
cy.on('tap','edge',ev=>{const e=ev.target.data('e');document.getElementById('detail').innerHTML=`<div class="grp">边</div><p><b>${ETZH[e.type]||e.type}</b> ${e.symmetric?'(对称)':''}<br><span class="id">${e.source}<br>${e.symmetric?'—':'→'} ${e.target}</span></p><p>via: ${e.via.join(', ')}<br>why: ${esc(e.why)}<br>weight: ${e.weight}</p>`;});
cy.on('tap',ev=>{if(ev.target===cy){cy.elements().removeClass('nbr');cy.$(':selected').unselect();}});
document.getElementById('layout').onchange=e=>cy.layout({name:e.target.value,animate:false,padding:30}).run();
document.getElementById('reset').onclick=()=>{cy.fit(null,30);document.getElementById('q').value='';cy.elements().removeClass('dim');};
document.getElementById('q').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(!q){cy.elements().removeClass('dim');return;}cy.nodes().forEach(n=>{const d=n.data();const hay=(d.label+' '+d.id+' '+d.bundle).toLowerCase();n.toggleClass('dim',!hay.includes(q));});cy.edges().forEach(e=>e.toggleClass('dim',e.source().hasClass('dim')||e.target().hasClass('dim')));};
function mkfilter(host,title,keys,active,attr){let h=`<b>${title}</b>`;keys.forEach(k=>h+=`<label><input type=checkbox ${active(k)?'checked':''} data-f="${attr}" data-v="${k}">${k}</label>`);document.getElementById(host).innerHTML=h;}
mkfilter('bundleF','bundle:',G.meta.bundles,()=>true,'bundle');
mkfilter('kindF','kind:',['api','example','header','guide','glossary','index','other','operator','operator_optimization','implementation_trap','debugging_journey','cross_skill_gap'],()=>true,'kind');
mkfilter('typeF','边:',Object.keys(EC),k=>k!=='mentions'&&k!=='part_of','type');
document.getElementById('legend').innerHTML=Object.keys(EC).map(t=>`<span><b style="background:${EC[t]}"></b>${ETZH[t]}</span>`).join('');
function applyFilters(){const on=a=>new Set([...document.querySelectorAll(`input[data-f="${a}"]:checked`)].map(x=>x.dataset.v));
 const kb=on('bundle'),kk=on('kind'),kt=on('type');
 cy.nodes().forEach(n=>{const d=n.data();n.style('display',(kb.has(d.bundle)||!d.bundle)&&kk.has(d.kind)?'element':'none');});
 cy.edges().forEach(e=>{const vis=kt.has(e.data('type'))&&e.source().style('display')==='element'&&e.target().style('display')==='element';e.style('display',vis?'element':'none');});}
document.querySelectorAll('.filters input').forEach(cb=>cb.onchange=applyFilters);applyFilters();
const first=G.nodes.find(n=>n.kind==='api'&&!n.external)||G.nodes.find(n=>!n.external)||G.nodes[0];if(first)showDetail(first.id);
</script></body></html>

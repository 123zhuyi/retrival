experience_id: exp_stability_004
match_cond:
  operator_type: AIV
  compute_pattern: element-wise/Sum/Cumsum/Reduce
  data_type:
  - fp16
  - bf16
  hardware:
  - 910b2
  - 910b3
  core_param:
    n_steps:
    - '>=1000'
  optimization_level: high
  tensor_shape:
  - nd
experience_type: 数值精度优化
framework_tag:
- Triton
optimization_points:
- 核心策略: 累加器初始化为float32高精度类型，存储中间累加结果
- 防漂移: 低精度累加器（fp16）在≥1000次累加后会出现明显精度漂移，float32累加器可完全避免
code_snippet:
  Triton: "@triton.jit def high_precision_acc_kernel(input_ptr, output_ptr, n_elements,\
    \ BLOCK_SIZE: tl.constexpr=128):\n    pid = triton.program_id(0)\n    offsets\
    \ = pid * BLOCK_SIZE + tl.arange(0, BLOCK_SIZE)\n    mask = offsets < n_elements\n\
    \    \n    # 加载数据\n    data = tl.load(input_ptr + offsets, mask=mask)\n    \n\
    \    # 核心优化: 初始化float32高精度累加器\n    acc_fp32 = tl.zeros((BLOCK_SIZE,), dtype=tl.float32)\n\
    \    \n    # 高精度累加（模拟多步累加场景）\n    for i in range(1000):  # 示例: 1000次累加\n     \
    \   acc_fp32 += data.to(tl.float32) * (i + 1)  # 累加不同权重的数值\n    \n    # 转回原精度存储\n\
    \    acc_fp16 = acc_fp32.to(data.dtype)\n    tl.store(output_ptr + offsets, acc_fp16,\
    \ mask=mask)\n\n# 累加求和调用示例\ndef sum_high_precision(input_tensor):\n    input_contig\
    \ = input_tensor.contiguous() if not input_tensor.is_contiguous() else input_tensor\n\
    \    output = torch.empty_like(input_contig)\n    n_elements = input_contig.numel()\n\
    \    grid = (triton.cdiv(n_elements, 128),)\n    high_precision_acc_kernel[grid](input_contig,\
    \ output, n_elements, BLOCK_SIZE=128)\n    return output.sum()"
performance_boost: 累加精度提升（MSE降低90%）
note: 适用于大步数累加、梯度累积、损失求和等场景；fp16累加器在1000次累加后误差可达1e-3，float32累加器误差仅1e-7，910b2/910b3平台建议所有累加操作启用高精度累加器
version: v1.0

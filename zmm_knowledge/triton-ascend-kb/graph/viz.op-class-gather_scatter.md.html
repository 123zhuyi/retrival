\n\n## 3. 架构支持\n\nA2（Ascend910B1）√、A3（Ascend910_93）√、950（Ascend950PR/Ascend950DT）√。纯 Vector 核（MIX_AIV_1_0），无需 Cube。\n\n## 4. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。Triton skeleton 标记 `reproducibility: pseudocode`。\n\n\n", "ops/moe-token-permute-with-routing-map.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_token_permute_with_routing_map/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/moe-token-permute-with-routing-map.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_token_permute_with_routing_map/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_token_permute_with_routing_map/)。\n\n# MoeTokenPermuteWithRoutingMap (routingMap-driven token permute)\n\nCANN ops-transformer 中的 `MoeTokenPermuteWithRoutingMap` 算子是用 routingMap（token 到 expert 映射）驱动的 MoE token 置换算子。核心是 maskedSelect + argSort + index_copy/gather，支持两种模式（dropAndPad false/true）。三架构（A2/A3 + 950 arch35，arch35 含 SIMD/SIMT 二维 gather 专属模板）。\n\n## 1. 输入输出\n\n### 输入（按 `moe_token_permute_with_routing_map_def.cpp`）\n\n| 输入 | 必选/可选 | 含义 | dtype |\n|------|-----------|------|-------|\n| tokens | 必选 | 输入 tokens [tokens_num, H] | BF16/FP16/FP32 |\n| routing_map | 必选 | token 到 expert 映射 [tokens_num, expert_num] | BOOL/INT8 |\n| probs | 可选 | 概率 [tokens_num, expert_num] | BF16/FP16/FP32 |\n\n### 输出\n\n| 输出 | 含义 | dtype |\n|------|------|-------|\n| permute_tokens | 置换后的 tokens [num_out_tokens, H] | BF16/FP16/FP32 |\n| permute_probs | 置换后的 probs [num_out_tokens] | BF16/FP16/FP32 |\n| sorted_indices | 排序索引 [num_out_tokens] | INT32 |\n\n### 属性\n\n| 属性 | 含义 | 说明 |\n|------|------|------|\n| num_out_tokens | 有效输出 token 数 | REQUIRED，用于计算 topK/capacity |\n| drop_and_pad | 是否开启 dropAndPad 模式 | OPTIONAL，默认 false |\n\n### 约束\n\n- tokens_num 和 expert_num < 16777215\n- dropAndPad=false 时 routingMap 每行 1/true 个数固定且 < 512\n\n## 2. 核心计算公式\n\n### dropAndPad=false（topK 模式）\n\n```\nexpertIndex = arange(tokens_num).expand(expert_num, -1)\nsortedIndicesFirst = expertIndex.maskedSelect(routingMap.T)\nsortedIndicesOut = argSort(sortedIndicesFirst)\ntopK = numOutTokens // tokens_num\npermuteTokens[sortedIndicesOut[i]] = tokens[i // topK]\npermuteProbsOut = probs.T.maskedSelect(routingMap.T)\n```\n\n### dropAndPad=true（capacity 模式）\n\n```\ncapacity = numOutTokens // expert_num\nsortedIndicesOut = argsort(routingMap.T, dim=-1)[:, :capacity]\npermutedTokensOut = tokens.index_select(0, sortedIndicesOut)\n# probs: 按 (expert_num, capacity) 二维索引 gather\n```\n\n## 3. 计算流程\n\n```\n1. KernelMaskedSelectV3: routingMap.T -> sortedIndicesFirst\n2. MoeSort（OneCore/MultiCore）: sortedIndicesFirst -> sortedIndicesOut\n   - 多核：分核排序 + moe_mrgsort 归并\n3. MoeindexCopyOp: tokens.index_select(sortedIndicesOut) -> permuteTokens\n4. MoePermuteProb: probs 置换 -> permuteProbsOut\n5. arch35: Gatherv2Simd/SimtTwoDim（二维 gather 优化）\n```\n\n## 4. 模板与 dispatch\n\n| TilingKey | 模式 | 说明 |\n|---|---|---|\n| 1/3/5/7 | 单核排序 | dropAndPad=false，MoeSortOneCore |\n| 2/4/6/8 | 多核排序 | dropAndPad=false，MoeSortMultiCore + 归并 |\n| 9/19 | 填充模式 | dropAndPad=true，仅 3510/arch35 |\n\n## 5. 架构与产品支持\n\n| 产品 | 架构 | config（def.cpp） | kernel 入口 |\n|---|---|---|---|\n| Atlas A2 训练/推理 | arch32 | `ascend910b` L80 | `moe_token_permute_with_routing_map.cpp` |\n| Atlas A3 训练/推理 | ascend910_93 | `ascend910_93` L81 | 同上 |\n| Ascend 950PR/950DT | arch35 | `ascend950` L88 | 同上（regbase + SIMD/SIMT gather） |\n\n> 三架构均支持。950 用 arch35 专属 `Gatherv2SimdTwoDim`/`Gatherv2SimtTwoDim`。支持 BF16/FP16/FP32 tokens + BOOL/INT8 routingMap。\n\n## 6. Agent actions\n\n1. 确认目标架构（arch32 / arch35）与模式（dropAndPad false/true）。\n2. maskedSelect：`tl.load(tokens + mask_nonzero_indices)`。\n3. argSort：`tl.argsort` 或自定义排序（多核需归并）。\n4. index_select：`tl.load(tokens + sorted_indices)`。\n5. arch35：SIMD/SIMT 二维 gather 优化（不迁移机制，迁移语义）。\n6. Triton 实现参考 `artifacts/moe-token-permute-with-routing-map/moe-token-permute-with-routing-map-triton-skeleton.py`（pseudocode）。\n\n## 7. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。tiling 参数数值、多核归并排序映射、arch35 SIMD/SIMT gather 精度需结合源码/硬件进一步验证。Triton skeleton 标记 `reproducibility: pseudocode`。来源见 `ops-transformer-moe-token-permute-with-routing-map`。\n\n\n", "ops/moe-token-unpermute-grad.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_token_unpermute_grad/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/moe-token-unpermute-grad.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_token_unpermute_grad/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_token_unpermute_grad/)。\n\n# MoeTokenUnpermuteGrad（MoE token unpermute 反向）\n\nCANN ops-transformer 的 `MoeTokenUnpermuteGrad` 是 `kernel-moe-token-unpermute` 的**反向传播**：计算 `permutedTokensGrad`（scatter 加权）和 `probsGrad`（topK 求和）（README L16）。**AIV-only**。\n\n## 1. 输入输出\n\n### 输入（def.cpp L33-60）\n- permuted_tokens（REQUIRED，FP16/BF16/FP32）\n- unpermuted_tokens_grad（REQUIRED，FP16/BF16/FP32）\n- sorted_indices（REQUIRED，INT32）\n- probs（OPTIONAL，FP16/BF16/FP32）\n\n### 输出（def.cpp L61-72）\n- permuted_tokens_grad（REQUIRED）\n- probs_grad（REQUIRED）\n\n### 属性（def.cpp L73-74）\n`padded_mode`(false)/`restore_shape`({1,1})。\n\n### 约束（README L118-129）\ntopK≤512；950 转调 finalize_routing_v2_grad。\n\n## 2. 核心公式（README L19-45）\n\n```\n有 probs:\n  probsGrad = Σ_{k}(unpermutedTokensGrad * permutedTokens[sortedIndices])   # topK 求和\n  permutedTokensGrad[sortedIndices[k]] = unpermutedTokensGrad * probs[k]    # scatter 加权\n\n无 probs (topK=1):\n  permutedTokensGrad[sortedIndices[i]] = unpermutedOutputGrad[i]            # 纯 scatter\n```\n\n## 3. tiling key dispatch（4 key）\n\n| key | padded_mode | haveProbs | 模板 |\n|---|---|---|---|\n| 0/10 | false/true | false | ProbNone |\n| 1/11 | false/true | true | ProbNotNone |\n\n## 4. 架构支持（README L7-12）\n\n仅 Ascend910B1/910_93（A2/A3）。950 转调 finalize_routing_v2_grad。\n\n## 5. 与 unpermute 配对\n\n- 正向 `moe_token_unpermute`：gather + probs mul + reduce_sum\n- 反向 `moe_token_unpermute_grad`：scatter 加权 + probsGrad reduce_sum\n\n## 6. Agent actions\n\n1. 识别为 MoE token unpermute 反向（scatter + 元素乘 + reduce_sum，AIV-only）。\n2. 与 `kernel-moe-token-unpermute` 正向配对。\n3. 有 probs 时输出双梯度（permutedTokensGrad + probsGrad），无 probs 时仅 permutedTokensGrad。\n4. 950 转调 finalize_routing_v2_grad。\n\n## 7. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。Triton skeleton 标记 `reproducibility: pseudocode`。\n\n\n", "runbooks/memory-sram/exp_gather_001.md": "\n\n## Memory Access Optimization: vectorized indexing\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3，fp16/bf16/fp32，num_indices≥32、x_size≥64；失效边界：x_size 过大时整行特征向量驻留片上 UB/寄存器的策略导致寄存器压力过高甚至 spill，需沿特征维再切块；num_indices 很小（<32）时向量化收益被 kernel 启动开销稀释）\n\n### 原则\n- **vectorized indexing**：Replace the scalar loop `for i in range(SUB_BLOCK_SIZE)` with vectorized pointer arithmetic. Calculate the base addresses for all rows in the sub-block simultaneously using the `cur_indices` tensor to enable parallel memory access.\n- **batched loading**：Utilize `tl.load` with advanced indexing (broadcasted pointer arithmetic) to fetch the entire `(SUB_BLOCK_SIZE, BLOCK_X)` block in a single operation. This eliminates the need for iterative `tl.insert_slice` calls and reduces instruction count.\n- **control flow optimization**：Remove the inner Python-level loop within the JIT kernel. This allows the compiler to generate an efficient vectorized instruction stream and improves pipeline utilization by avoiding serial execution of row gathering.\n- **vectorized row load**：The kernel loads the entire feature vector (x_vals) for a specific row into local memory/registers in a single operation before performing the gather. This strategy transforms multiple potential scattered global memory reads into one contiguous read, significantly reducing global memory access latency and bandwidth usage.\n- **intrinsic gather utilization**：Leverages the tl.gather intrinsic, which maps directly to efficient hardware indexing instructions. This avoids the overhead of complex manual pointer arithmetic or loop-based masking typically required for irregular memory access patterns.\n- **stride generalization**：The kernel is designed to handle arbitrary strides for input, index, and output tensors. This flexibility allows it to operate directly on non-contiguous tensor layouts (such as sliced or transposed views) without requiring a preliminary layout transformation (padding or transposition) kernel.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/124-_gather_high_perf_kernel.py\n```\n\n**坏实践（反例）**：JIT kernel 内用标量循环逐行 gather，再逐行 insert_slice 拼块\n```python\nfor i in range(SUB_BLOCK_SIZE):            # Python 级串行循环\n    row = tl.load(x_ptr + cur_indices[i] * x_stride + tl.arange(0, BLOCK_X))\n    out = tl.insert_slice(out, row, (i, 0), (1, BLOCK_X))\n```\n后果：行 gather 串行执行，指令数随 SUB_BLOCK_SIZE 线性增长，流水线无法打满，不规则访存延迟全部暴露。✅ 正解：用广播指针算术一次性算出子块内所有行的基址，单条 `tl.load` 取回 (SUB_BLOCK_SIZE, BLOCK_X) 整块；或对不规则模式直接用 `tl.gather` 映射硬件索引指令。\n\n**已知实例**：gather_scatter §raw (`experiences/gather_scatter/exp_gather_001.yaml`)\n- 声称性能收益：30%\n- 备注：该方案假设特征维（x_size）足够小，能高效放入片上 UB/寄存器堆。对极大的特征向量，此方法会导致寄存器压力过高，需沿特征维切块。\n\n\n", "runbooks/memory-sram/exp_gather_flat_001.md": "\n\n## Memory Access Optimization: large block processing\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3, 91093, 91095，fp16/bf16/fp32，N≥4096，索引为 1D 扁平格式（可带 base_offset）；失效边界：N 远小于 BLOCK_SIZE(4096) 时大 block 退化、尾部 mask 占比升高，ILP 收益消失；BLOCK_SIZE×dtype 字节数超过单核 UB 可用容量时需下调 block 重算预算）\n\n### 原则\n- **large block processing**：The kernel utilizes a heuristic to set blockSize to 4096, processing a large chunk of elements per program ID. This significantly increases instruction-level parallelism (ILP) and helps hide the high memory latency typically associated with irregular gather operations.\n- **stride based addressing**：The input address is calculated efficiently as `base + cur_index * inp_dim_stride`. This allows the kernel to perform gathers along a specific dimension of a multi-dimensional tensor without requiring the input tensor to be flattened or reshaped beforehand, saving memory bandwidth and pre-processing time.\n- **vectorized masking**：The kernel employs a mask for both loading indices and storing results. This ensures safe memory access for the tail end of the tensor where the total size N is not a multiple of blockSize, avoiding out-of-bounds errors without expensive conditional branching inside the loop.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/123-_gather_flat_kernel_fixed.py\n```\n\n**坏实践（反例）**：用大 N 扁平 gather 却配小 BLOCK_SIZE（如 256）\n```python\nBLOCK_SIZE = 256\noffs = pid * BLOCK_SIZE + tl.arange(0, BLOCK_SIZE)\nidx  = tl.load(idx_ptr + offs, mask=offs < N)\nvals = tl.load(inp_ptr + base + idx * inp_dim_stride, mask=offs < N)\n```\n后果：每个 program 内指令级并行度不足，不规则 gather 的高访存延迟无法被掩盖，需要远更多的 program 数才能填满流水线。✅ 正解：BLOCK_SIZE 取 4096 的经验值，单 program 内大批量元素并行隐藏延迟；索引加载与结果写出都带 mask，安全处理 N 不整除 block 的尾部，无需循环内条件分支。\n\n**已知实例**：gather_scatter §raw (`experiences/gather_scatter/exp_gather_flat_001.yaml`)\n- 声称性能收益：25%\n- 备注：This kernel is optimized for flat gather operations where indices are provided in a 1D flattened format. The use of `base_offset` makes it suitable for batched operations or gathering with a base offset.\n\n\n", "runbooks/memory-sram/exp_moe_binned_scatter_001.md": "\n\n## Memory Access Optimization: register buffering\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2/910b3，fp16/bf16，NUM_COLUMNS≥128、BLOCK_SIZE≥64、expert_capacity 足以容纳单桶 token；失效边界：expert_capacity 不足时越界写；单个 SUB_BLOCK_SIZE 迭代内桶切换极频繁时 register buffer 反复 flush，批量写收益稀释；NUM_COLUMNS<BLOCK_X 时列向量化退化）\n\n### 原则\n- **register buffering**：The kernel utilizes a register-level buffer (`tmp_buf`) sized `(SUB_BLOCK_SIZE, BLOCK_X)` to accumulate data. By gathering multiple elements from the source tensor `a` into this buffer before performing a global store to `b`, the number of high-latency global memory write operations is significantly reduced.\n- **vectorized memory access**：The inner loop iterates over the feature dimension (`NUM_COLUMNS`) with a step size of `BLOCK_X`. This allows the kernel to load and store data using wide vector instructions (e.g., 128-bit or 256-bit), maximizing memory bandwidth utilization on the NPU.\n- **dynamic bin handling**：The logic efficiently handles transitions between different expert bins within a single `SUB_BLOCK_SIZE` iteration. By checking `if bin_idx != base_bin_idx`, it flushes the current buffer and updates the target address dynamically, ensuring correct data placement without breaking the vectorized processing loop.\n- **address calculation optimization**：The source address calculation `idx_a = (indices // TOP_K) * NUM_COLUMNS` is hoisted outside the column loop, and the destination address `idx_b` is updated incrementally. This minimizes redundant arithmetic instructions within the critical inner loops.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/002-_binned_copy_gather_npu.py\n```\n\n**坏实践（反例）**：每 gather 一个元素立即做一次全局 store，不做寄存器聚合\n```python\nfor i in range(SUB_BLOCK_SIZE):\n    idx_a = (indices[i] // TOP_K) * NUM_COLUMNS   # 循环内重复算地址\n    val = tl.load(a_ptr + idx_a + col_off)        # 逐元素 gather\n    tl.store(b_ptr + idx_b + col_off, val)        # 每元素一次高延迟 GM 写\n```\n后果：GM 写事务数等于元素数，高延迟写无法合并；地址算术散在关键内层循环里，指令开销叠加，30% 收益流失。✅ 正解：用 `(SUB_BLOCK_SIZE, BLOCK_X)` 的寄存器级 tmp_buf 聚合数据，仅在 bin 切换（`bin_idx != base_bin_idx`）时批量 flush；源地址 `idx_a` 提升到列循环外、目的地址 `idx_b` 增量更新。\n\n**已知实例**：gather_scatter §raw (`experiences/gather_scatter/exp_moe_binned_scatter_001.yaml`)\n- 声称性能收益：30%\n- 备注：该优化专为专家路由场景设计——token 需散写到指定专家桶。假设 `expert_capacity` 足够容纳每个桶的 token。\n\n\n", "runbooks/memory-sram/exp_moe_gather_001.md": "\n\n## Memory Access Optimization: vectorized metadata loading\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2/910b3/91093/91095，fp16/bf16，topk_num≤8 且为编译期常量，BLOCK_D≥128；失效边界：topk_num 非编译期常量或 >8 时循环展开与元数据向量化失效、寄存器压力上升；BLOCK_D<128（fp16 下不足 64 元素）时向量加载退化为部分访存事务）\n\n### 原则\n- **vectorized metadata loading**：The current implementation performs scalar loads for `expert_id`, `source_token_index`, and `recv_topk_weight` inside the inner loop. Since `topk_num` is a compile-time constant, these loads should be vectorized to fetch the entire array of indices/weights for the current token in a single instruction. This reduces the number of memory transactions and instruction overhead significantly.\n- **loop unrolling**：The inner loop iterating over `topk_num` is typically small (e.g., 2 to 8). Unrolling this loop eliminates branch overhead and allows the compiler to schedule independent memory loads and floating-point operations more effectively, hiding latency.\n- **memory alignment**：The vector loads of `input_tensor` and stores to `output_tensor` should be aligned to the hardware's memory transaction size (e.g., 128 bytes). Ensuring `BLOCK_D` is a multiple of the alignment size (e.g., 64 or 128 for fp16) prevents partial memory transactions and improves bandwidth utilization.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/062-_fwd_kernel_ep_gather.py\n```\n\n**坏实践（反例）**：内层循环逐标量加载路由元数据\n```python\nfor k in range(topk_num):                    # 未展开的小循环，带分支开销\n    eid = tl.load(expert_id_ptr + k)         # 标量 load\n    src = tl.load(source_index_ptr + k)      # 标量 load\n    w   = tl.load(recv_weight_ptr + k)       # 标量 load\n    acc += w * tl.load(input_ptr + src * BLOCK_D + d_off)\n```\n后果：每个 token 触发 3×topk_num 次标量访存事务，指令与分支开销显著，20% 收益流失。✅ 正解：topk_num 为编译期常量时用 `tl.arange(0, topk_num)` 一次性向量取回全部索引/权重，并展开该小循环让编译器调度独立 load 掩盖延迟；同时保证 BLOCK_D 为对齐粒度倍数（fp16 下 64/128 元素）。\n\n**已知实例**：gather_scatter §raw (`experiences/gather_scatter/exp_moe_gather_001.yaml`)\n- 声称性能收益：20%\n- 备注：该优化对推理阶段路由开销不可忽略的专家路由层尤为关键。假设 `topk_num` 较小且编译期已知。\n\n\n", "runbooks/memory-sram/exp_moe_scatter_001.md": "\n\n## Memory Access Optimization: software pipelining\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2/910b3，fp8/fp16/bf16，HIDDEN_SIZE≥128、topk_num≥1；失效边界：HIDDEN_SIZE<128 时整行向量加载退化；无 FP8 scale 的场景 SCALE 相关 padding 路径多余；多个核并发写同一 expert 且未用 grid-stride 分摊时，`expert_start_loc` 更新存在竞争风险，需同步保护）\n\n### 原则\n- **software pipelining**：The loop `tl.range(..., num_stages=4)` employs software pipelining to prefetch memory loads and overlap them with store operations, effectively hiding memory latency during the scatter phase.\n- **vectorized scatter**：Instead of processing tokens one by one, the kernel writes the expert ID to the `m_indices` buffer in chunks of `BLOCK_E`, significantly improving memory bandwidth utilization.\n- **local prefix sum**：The kernel calculates the starting offsets (`expert_start_loc`) for experts using `tl.cumsum` on loaded blocks of token counts, allowing for parallel offset computation without expensive global synchronization.\n- **vectorized memory access**：The kernel utilizes `tl.arange` to load and store the entire `HIDDEN_SIZE` vector in a single operation. This maximizes memory bus utilization and reduces the number of memory instructions issued compared to element-wise access.\n- **memory alignment padding**：By using `HIDDEN_SIZE_PAD` and `SCALE_HIDDEN_SIZE_PAD`, the kernel ensures that all memory accesses are aligned to the hardware's burst size (e.g., 32 or 128 bytes). This avoids unaligned access penalties and is crucial for achieving peak bandwidth on Ascend hardware.\n- **input data reuse**：The input token data (`recv_x`) and its scale (`recv_x_scale`) are loaded once per token before the inner loop. This data is then reused for all `topk_num` experts, minimizing redundant global memory reads when tokens are routed to multiple experts.\n- **software pipelining**：The inner loop uses `num_stages=4` to prefetch expert indices and destination pointers. This hides the latency of indirect memory loads (pointer chasing) required to determine the write location for each expert.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/061-_fwd_kernel_ep_scatter_2.py\n```\n\n**坏实践（反例）**：逐 token 标量写路由索引、每个目标 expert 重读同一输入，且无流水线掩盖间接寻址\n```python\nfor k in range(topk_num):\n    x = tl.load(recv_x_ptr + row_off)            # 每 expert 重复读同一 token\n    dst = tl.load(expert_start_loc_ptr + eid)    # 间接寻址，延迟无掩盖\n    tl.store(m_indices_ptr + dst, eid)           # 逐标量写 expert ID\n    tl.store(out_ptr + dst * HIDDEN_SIZE + ..., x)\n```\n后果：输入被读 topk_num 次、expert ID 写事务数等于 token×topk_num，pointer chasing 延迟完全暴露，35% 收益流失。✅ 正解：输入 token 及其 scale 每 token 载入一次、对全部 topk_num 个 expert 复用；`m_indices` 按 BLOCK_E 块写入；`tl.range(..., num_stages=4)` 软件流水预取 expert 索引与目标指针，并用 `tl.cumsum` 本地前缀和算 `expert_start_loc` 避免全局同步。\n\n**已知实例**：gather_scatter §raw (`experiences/gather_scatter/exp_moe_scatter_001.yaml`)\n- 声称性能收益：35%\n- 备注：该 kernel 面向 token 分发到各 expert 的专家路由负载，支持 FP8 scaling。需确保 `expert_start_loc` 更新正确——若多个核并发写同一 expert 会有竞争风险，grid-stride 循环有助于分摊负载。\n\n\n", "runbooks/memory-sram/exp_padded_gather_001.md": "\n\n## Memory Access Optimization: buffered writes\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2/910b3，fp16/bf16，INDICES_LENGTH≥BLOCK_SIZE、NUM_COLUMNS≥BLOCK_X；失效边界：输入未按 expert ID 排序（bin_id 频繁切换）时 tmp_buf 反复 flush，批量写收益稀释，极端优化需先按 expert ID 预排序；NUM_COLUMNS<BLOCK_X 时列 tiling 退化）\n\n### 原则\n- **buffered writes**：The kernel accumulates gathered rows in a local buffer (tmp_buf) and performs a batched store to global memory only when the expert ID (bin_id) changes. This reduces the number of global memory write transactions, which is critical for high-bandwidth utilization.\n- **column tiling**：The embedding dimension (NUM_COLUMNS) is processed in tiles of size BLOCK_X. This tiling strategy limits the number of active registers per thread, preventing register spilling and allowing the kernel to handle very wide embeddings efficiently.\n- **dynamic boundary handling**：The kernel dynamically calculates the output offset (idx_o) based on bin_ids and padded_bins metadata. This allows it to handle variable-length expert assignments (专家路由场景) without requiring the input to be strictly sorted or pre-padded to a fixed size.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/032-_padded_gather_kernel.py\n```\n\n**坏实践（反例）**：每 gather 一行立即写回全局内存，不设本地缓冲\n```python\nfor i in range(SUB_BLOCK_SIZE):\n    row = tl.load(src_ptr + src_row * NUM_COLUMNS + col_off)   # gather 一行\n    tl.store(out_ptr + idx_o + col_off, row)                   # 每行一次 GM 写事务\n```\n后果：GM 写事务数等于行数，高延迟写无法合并，带宽利用率低，30% 收益流失。✅ 正解：gather 到的行先累积进本地 tmp_buf，仅当 bin_id 变化时才批量 flush 写回；列维按 BLOCK_X 切 tile 防止寄存器溢出，支持超宽特征维。\n\n**已知实例**：gather_scatter §raw (`experiences/gather_scatter/exp_padded_gather_001.yaml`)\n- 声称性能收益：30%\n- 备注：当前实现用标量循环处理 expert ID 切换。追求极限优化时，建议先按 expert ID 预排序索引，以实现完全向量化的 load/store。\n\n\n", "runbooks/memory-sram/exp_scatter_001.md": "\n\n## Memory Access Optimization: vectorized memory access\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3, 91093, 91095；fp16/bf16/fp32；INDICES_LENGTH≥BLOCK_SIZE、NUM_COLUMNS≥BLOCK_X、BLOCK_X≥32；失效边界：索引非唯一且需要原子累加的 scatter 场景失效（本 kernel 假设无原子加，竞态被忽略）；BLOCK_X<32 或 NUM_COLUMNS<BLOCK_X 时向量宽度不足，收益稀释；INDICES_LENGTH<BLOCK_SIZE 时子块切分开销占比升高）\n\n### 原则\n- **vectorized memory access**：The kernel loads data from the source tensor `x` in a 2D block (SUB_BLOCK_SIZE x BLOCK_X) and stores to the destination `out` using vectorized stores of width BLOCK_X. This maximizes memory bus utilization compared to scalar operations.\n- **sub block tiling**：By processing indices in chunks of SUB_BLOCK_SIZE, the kernel balances register pressure. It keeps a tile of the source matrix in registers/scratchpad while performing the random write pattern characteristic of scatter operations.\n- **boundary masking**：Efficient handling of tensor boundaries using `idx_mask` and `col_mask` for both loads and stores. This eliminates the need for padding or expensive conditional branching for partial blocks at the edges of the tensor.\n- **hybrid precision compute**：The scaling operation is performed in float32 (`val.to(tl.float32) * scale.to(tl.float32)`) to preserve numerical accuracy during accumulation/multiplication, before casting back to the output type, ensuring stability without sacrificing memory storage efficiency.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/015-_scatter_kernel.py\n```\n\n**坏实践（反例）**：逐元素标量化 scatter\n```python\nfor i in range(INDICES_LENGTH):\n    for c in range(NUM_COLUMNS):                          # 逐列标量处理\n        val = tl.load(x_ptr + src[i]*NUM_COLUMNS + c)     # 标量 load\n        tl.store(out_ptr + idx[i]*NUM_COLUMNS + c, val)   # 标量 store\n```\n后果：标量访存打不满 GM→UB 总线宽度，边界处还需额外分支；向量化方案实测收益 30%。✅ 正解：源张量按 (SUB_BLOCK_SIZE, BLOCK_X) 2D tile 加载、以 BLOCK_X 宽度向量化写回；边界用 `idx_mask`/`col_mask` 掩码处理，避免 padding 和分支；缩放融合在 fp32 寄存器中完成再 cast 回输出类型。\n\n**已知实例**：gather_scatter §raw (`experiences/gather_scatter/exp_scatter_001.yaml`)\n- 声称性能收益：30%\n- 备注：This kernel assumes that the scatter operation does not require atomic adds (i.e., indices are unique or race conditions are acceptable/ignored). The `SCALE` feature is conditionally compiled via the `SCALE` constexpr.\n\n\n", "runbooks/memory-sram/exp_scatter_moe_padded_001.md": "\n\n## Memory Access Optimization: sorted bin grouping with padded alignment\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3；fp16/bf16；NUM_COLUMNS≥64、INDICES_LENGTH≥1024、BLOCK_SIZE≥128；失效边界：bin_ids 未按分组键排序时无法形成连续段，策略失效；分组数少或 INDICES_LENGTH<1024 时分组收益不明显；padded 对齐粒度与硬件访存事务粒度（32/64B）不匹配时对齐收益消失）\n\n### 原则\n- **sorted bin grouping**：The kernel leverages sorted bin_ids to group rows by bin within a SUB_BLOCK_SIZE. By calculating bin_count from the first and last element, it processes contiguous segments of the same bin, reducing pointer recalculation overhead and ensuring contiguous GM→UB access patterns for the source tensor x.\n- **vectorized memory access**：Utilizes BLOCK_X tiling to process the feature dimension (NUM_COLUMNS) in vectorized chunks. The load operation cur_x = tl.load(...) fetches a block of (SUB_BLOCK_SIZE, BLOCK_X), maximizing global memory bandwidth utilization compared to scalar or small-vector accesses.\n- **padding alignment support**：Explicitly handles padded_bins to calculate source offsets. This ensures that memory accesses to the input tensor x are aligned to hardware-friendly boundaries (e.g., 32 or 64 bytes), which is critical for avoiding bank conflicts and achieving peak memory throughput on Ascend hardware.\n- **sub block tiling**：Uses a two-level tiling strategy (blockSize for the grid, SUB_BLOCK_SIZE for the loop). This allows the kernel to load a batch of indices and metadata (bin_ids) once, reusing this information while iterating over the feature columns, thus reducing global memory read pressure for metadata.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/033-_padded_scatter_kernel.py\n```\n\n**坏实践（反例）**：不按 bin 分组、也不做 padded 对齐，直接按原始乱序索引 scatter\n```python\nfor i in range(INDICES_LENGTH):                  # 乱序索引，同组行散落各处\n    row = idx[i]\n    src_off = row * NUM_COLUMNS                  # 未对齐的源偏移\n    cur = tl.load(x_ptr + src_off + offs_c)      # 地址发散 + 非对齐\n    tl.store(out_ptr + dst_off + offs_c, cur)\n```\n后果：源张量访问地址发散且不对齐，无法发出全宽突发读，指针重算频繁；排序分组+padded 对齐后实测收益 30%。✅ 正解：利用已按分组键排序的 bin_ids，由首末元素算 bin_count 按连续段处理同组行；用 padded_bins 计算对齐到 32/64B 友好边界的源偏移；元数据一次加载后在列循环内复用。\n\n**已知实例**：gather_scatter §raw (`experiences/gather_scatter/exp_scatter_moe_padded_001.yaml`)\n- 声称性能收益：30%\n- 备注：要求输入 bin_ids 已按分组键排序。分组数较多、且 padding 对齐粒度与硬件访存事务粒度匹配时收益最显著。\n\n\n", "runbooks/memory-sram/exp_scatter_npu_001.md": "\n\n## Memory Access Optimization: binning strategy\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3；fp16/bf16；NUM_COLUMNS≥64、BLOCK_SIZE≥128、SUB_BLOCK_SIZE≥32；失效边界：无预排序 bins/bin_ids 的纯随机 scatter 场景连续性不成立，策略失效；SUB_BLOCK_SIZE<32 或 NUM_COLUMNS<64 时向量指令宽度不足，收益稀释）\n\n### 原则\n- **binning strategy**：The kernel leverages pre-computed bins and bin_ids to group indices. This allows the memory access pattern for the source tensor 'a' to be contiguous within the inner loop, significantly reducing memory latency compared to a purely random scatter.\n- **vectorized block processing**：Data is loaded and stored in 2D tiles defined by SUB_BLOCK_SIZE and BLOCK_X. This enables the use of wide vector memory instructions (e.g., 128-bit or 256-bit loads/stores), maximizing the utilization of the memory bus bandwidth on the NPU.\n- **register reuse scaling**：The scaling operation is fused into the scatter loop. By loading the weight, scaling it in registers using FP32 arithmetic, and then storing it, the kernel minimizes the number of times the data is moved between global memory and the compute unit.\n- **loop tiling**：The nested loop structure (iterating over bins, then columns, then indices) optimizes for cache locality. It processes all columns for a given set of indices before moving to the next set, keeping the active working set small in the cache/SRAM.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/003-_binned_copy_scatter_npu.py\n```\n\n**坏实践（反例）**：不做 binning 的纯随机 scatter\n```python\nfor i in range(N):                                # 索引乱序、未分组\n    row = idx[i]\n    val = tl.load(a_ptr + row*NUM_COLUMNS + offs_c, mask=...)  # 地址发散\n    val = val * w[i]\n    tl.store(out_ptr + row*NUM_COLUMNS + offs_c, val, mask=...)\n```\n后果：源张量访问地址发散，GM 访存延迟完全暴露，无法形成连续突发；binning 后实测收益 35%。✅ 正解：先用预计算的 bins/bin_ids 把同组索引聚到连续段，内层循环对源张量形成连续访问；数据按 (SUB_BLOCK_SIZE, BLOCK_X) 2D tile 用宽向量指令搬运；缩放用 FP32 寄存器运算融合进 scatter 循环，减少 GM 往返。\n\n**已知实例**：gather_scatter §raw (`experiences/gather_scatter/exp_scatter_npu_001.yaml`)\n- 声称性能收益：35%\n- 备注：专为分组路由场景设计（行按分组键分派到不同分组）。要求输入为预排序索引或 bin 信息才能正确工作。\n\n\n", "runbooks/memory-sram/exp_scatter_wgrad_moe_001.md": "\n\n## Memory Access Optimization: padded binning for grouped scatter reduction\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3；fp16/bf16；NUM_COLUMNS≥64、BLOCK_SIZE≥128、SUB_BLOCK_SIZE≥16；失效边界：bin_ids 未按分组键排序时连续段不成立，策略失效；各组行数差异小（分布均匀）时分组重排收益有限；未用 padded_bins 对齐时无法发出全宽突发读；SUB_BLOCK_SIZE<16 时向量归约宽度不足）\n\n### 原则\n- **grouped binning strategy**：The kernel leverages pre-computed `bin_ids` and `bins` to group rows belonging to the same bin. This transforms the scatter operation into a series of contiguous memory accesses, significantly reducing memory latency and improving cache utilization for the `x` tensor.\n- **padded memory alignment**：By utilizing `padded_bins`, the kernel ensures that the memory offsets for each bin's data are aligned to favorable boundaries. This avoids unaligned memory access penalties and allows the memory controller to issue full-width burst reads, which is critical for high-bandwidth hardware like 910B.\n- **vectorized reduction**：The inner computation loop loads `BLOCK_X` elements of `x` and `grads` simultaneously to perform a vectorized dot product (`tl.sum(val * grad)`). This maximizes the utilization of vector units and reduces the instruction count per element compared to scalar operations.\n- **pointer alignment hints**：The use of `tl.multiple_of` in pointer arithmetic (`grad_ptr`, `x_ptr`) provides explicit hints to the compiler about address alignment, enabling more efficient code generation for global memory loads.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/034-_padded_scatter_wgrad_kernel.py\n```\n\n**坏实践（反例）**：不分组 + 逐元素标量归约\n```python\nacc = 0.0\nfor i in range(N):                     # 乱序索引，地址发散\n    row = idx[i]\n    for c in range(NUM_COLUMNS):       # 逐列标量乘加\n        acc += tl.load(x_ptr + row*NUM_COLUMNS + c) * tl.load(grad_ptr + row*NUM_COLUMNS + c)\n```\n后果：标量访存+逐元素归约，指令数随列数线性膨胀，且未分组时源地址发散；分组+向量化后实测收益 30%。✅ 正解：按 bin_ids/bins 把同组行聚成连续段、用 padded_bins 对齐各组偏移；内层一次加载 BLOCK_X 个 `x` 与 `grads` 元素做 `tl.sum(val * grad)` 向量归约；指针运算加 `tl.multiple_of` 对齐提示，让编译器生成更高效的 GM load。\n\n**已知实例**：gather_scatter §raw (`experiences/gather_scatter/exp_scatter_wgrad_moe_001.yaml`)\n- 声称性能收益：30%\n- 备注：专为分组路由反向场景优化（行被路由到不同分组后做梯度归约）。各组行数差异显著时，分组逻辑对性能至关重要。\n\n\n", "runbooks/memory-sram/parallel-axis-align.md": "\n\n## OPT-8 并行轴与连续访问对齐\n\n【优化维度】：内存｜访存效率\n【泛化层级】：条件性（迁移条件：gather/scatter/索引类算子；失效边界：纯 element-wise 无索引）\n\n<原则：索引算子核心计算量低于访存/重排，并行轴若不与连续访问对齐会引入离散全局访问和原子竞争，性能通常跌至 0.1x 以下。Gather 类优先沿 outer 和 index_len 并行、沿 trailing 连续读；Scatter 类按 trailing 宽度选输出位置并行或 index 分块向量 atomic_add。与 [[vectorized-coalesced-io]] 配套。>\n\n<骨架（占位名伪码）：\n# Gather: 每个 program 处理一段 (o, k)，沿 trailing 连续读\npid = tl.program_id(0)\no_idx = pid // index_len\nk_idx = pid % index_len\n# 沿 trailing 连续 load/store\nvals = tl.load(src_ptr + base + tl.arange(0, BLOCK_T), mask=mask)\n>\n\n**坏实践（反例）**：按最大 numel 选并行轴但内层离散\n```python\n# 并行轴选 index 但 trailing 短，内层 gather 发散地址\n```\n后果：离散全局访问，性能 0.1x 以下。✅ 正解即并行轴对齐连续访问。\n\n**已知实例**：index-computation G1（Gather/Scatter 并行轴选择）\n\n\n", "runbooks/meta-skills/semantic-correctness.md": "\n\n## DG-3 scatter 语义正确性\n\n【优化维度】：元技能｜精度修复链\n【泛化层级】：条件性（迁移条件：scatter/index_put 类算子；失效边界：纯 gather 无写冲突）\n\n<判定依据：scatter 算子三类语义陷阱--(1) 重复索引写冲突结果不稳定；(2) 越界访问触发 ACL 错误；(3) padding_idx 在热循环内判断破坏性能。必须分别处理。>\n\n<处理规则：\n1. last-write-wins：accumulate=False 且重复索引时，单 block 串行或两阶段实现，保证最后一个写胜出\n2. 边界检查：index<0 或 index>=dim_size 加 mask；越界读返回 0，越界写加 mask 跳过\n3. 排除位置：padding_idx 等通过独立后置 kernel 清零，不在热 scatter 循环内判断\n>\n\n**坏实践（反例）**：热循环内判断 padding_idx 或无边界检查\n```python\nfor i in range(BLOCK):\n    if idx[i] == padding_idx:   # 热循环内分支，破坏向量化\n        continue\n    if idx[i] < 0 or idx[i] >= dim:  # 散落判断\n        ...\n```\n后果：写冲突结果不稳定；越界 ACL 错误；热循环分支破坏性能。✅ 正解即 last-write-wins + 边界 mask + 独立后置 kernel。\n\n**已知实例**：index-computation G9（scatter/index_put 语义处理）\n\n\n", "runbooks/compute-pipeline/exp_radix_sort_scatter_001.md": "\n\n## Scheduling Optimization: lookback algorithm\n\n【优化维度】：多核并行与负载均衡\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3, 91093, 91095；失效边界：lookback 自旋等待在块间负载严重不均时消耗 cycle（备注自述）；volatile/.cg 同步语义是正确性前提，省略会在宽松内存一致性硬件上死锁或读脏数据；n_elements < 1024 时单块即可处理，无需 lookback）\n\n### 原则\n- **lookback algorithm**：Implements a lookback mechanism to calculate global offsets. Each block computes local histograms and then iteratively queries previous blocks' status in a lookback buffer. This eliminates the need for a separate global prefix sum kernel, reducing memory traffic and kernel launch latency.\n- **volatile loading**：Uses `volatile=True` in the synchronization loop (`while partial_prefix == 0`). This forces the load to bypass the L1 cache and fetch the most recent data written by other blocks, ensuring correct synchronization and preventing deadlocks in the spin-wait logic.\n- **cache streaming**：Applies `cache_modifier=\".cg\"` (Cache Global) when writing to the lookback buffer. This ensures that synchronization data is pushed to the L2 cache or main memory immediately, making it visible to other thread blocks performing the lookback.\n- **data reuse**：Loads `key_data` and `value_data` once per block and iterates over `bins_segment` (multiple bins) within the same kernel execution. This maximizes data reuse of the input tensors, significantly reducing global memory bandwidth requirements compared to launching a kernel per bin.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/137-radix_sortbykey_scatter_kernel.py\n```\n\n**坏实践（反例）**：全局前缀和单独起一个 kernel，或每个 bin 起一个 kernel → 额外 launch + 输入重复读 → ✅ 正解即本条：块内直方图 + lookback 缓冲原地算全局偏移（volatile 读 + `.cg` 写保证可见性），单 kernel 处理全部 bin。\n\n**已知实例**：gather_scatter §raw (`experiences/gather_scatter/exp_radix_sort_scatter_001.yaml`)\n- 声称性能收益：25%\n- 备注：The lookback loop involves a spin-wait which can consume cycles if blocks are heavily imbalanced. The `volatile` attribute is essential for correctness on NPUs/GPUs with relaxed memory consistency.\n\n\n", "runbooks/compute-pipeline/exp_scatter_wgrad_001.md": "\n\n## Compute Optimization: batched reduction replacement\n\n【优化维度】：AICore 单元利用/Scalar 削减\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3, 91093, 91095；失效边界：BLOCK_X 必须是 cache line（32/64B）倍数；indices 若不唯一且要写同地址，需原子或归约处理（备注自述）；fp32 转换最好在 load 后立即做，循环内转换会在关键路径插入转换指令）\n\n### 原则\n- **batched reduction replacement**：The current implementation utilizes a Python-level loop `for i in range(0, SUB_BLOCK_SIZE)` to process the loaded tile. This serializes the computation and prevents the compiler from generating efficient vector instructions. This should be replaced with a batched tensor operation, such as `tl.sum(loaded_x * loaded_grads, axis=1)`, to compute the dot products for the entire sub-block in parallel, significantly increasing ALU utilization.\n- **memory access alignment**：The kernel loads `x` and `grads` using `BLOCK_X`. It is critical to ensure `BLOCK_X` is a multiple of the hardware's cache line size (e.g., 32 or 64 bytes depending on the specific 910 series configuration) to ensure memory transactions are fully coalesced, reducing global memory latency.\n- **data type promotion optimization**：The code performs `.to(tl.float32)` inside the accumulation loop. To reduce instruction overhead, inputs should be cast to float32 immediately after loading, or the hardware's intrinsic support for mixed-precision computation (if available on the target 910 variant) should be leveraged to avoid explicit casting instructions within the critical path.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/016-_scatter_wgrad_kernel.py\n```\n\n**坏实践（反例）**：即本条原则 1 自述的当前缺陷——用 Python 级 `for i in range(SUB_BLOCK_SIZE)` 逐元素处理已加载的 tile → 计算串行化，编译器无法生成向量指令，ALU 利用率低 → ✅ 正解：改批量张量操作（`tl.sum(loaded_x * loaded_grads, axis=1)`）并行算整个子块的点积。\n\n**已知实例**：gather_scatter §raw (`experiences/gather_scatter/exp_scatter_wgrad_001.yaml`)\n- 声称性能收益：35%\n- 备注：The primary bottleneck is the scalar loop over `SUB_BLOCK_SIZE`. Converting this to a vectorized batched operation is essential for achieving high performance on the Ascend 910 series. Additionally, ensure that `indices` are unique or handle collisions atomically if the current `tl.store` is intended for a reduction scenario.\n\n\n"}};
const KC={api:'#1f77b4',example:'#2e9e6b',header:'#7e57c2',guide:'#ff7f0e',index:'#cbd5e1',root:'#334155',other:'#94a3b8',operator:'#e6194b',glossary:'#0f766e',operator_optimization:'#3cb371',implementation_trap:'#f032e6',debugging_journey:'#c026d3',cross_skill_gap:'#a21caf',field_note:'#f032e6',runbook:'#3cb371'};
const EC={exemplifies:'#2e9e6b',explains:'#ff7f0e',declares:'#7e57c2',demonstrates:'#0891b2',same_topic:'#1f77b4',related:'#94a3b8',part_of:'#e2e8f0',mentions:'#f1d6c0'};
const ETZH={exemplifies:'实现示例',explains:'开发指南',declares:'声明',demonstrates:'配套',same_topic:'同主题',related:'相关',part_of:'层级',mentions:'提及'};
const nodeById={};G.nodes.forEach(n=>nodeById[n.id]=n);
const back={};G.edges.forEach(e=>{(back[e.target]=back[e.target]||[]).push(e);});
document.getElementById('meta').textContent=`· ${G.meta.card_count} concept / ${G.nodes.length} 节点 / ${G.edges.length} 边`;
const sz=n=>10+Math.min(28,(n.degree||0)*2);
const els=[];
for(const n of G.nodes)els.push({data:{id:n.id,label:n.title,kind:n.kind,bundle:n.bundle,ext:!!n.external,sz:sz(n)}});
for(const e of G.edges)els.push({data:{id:e.source+'|'+e.target,source:e.source,target:e.target,type:e.type,e:e}});
const cy=cytoscape({container:document.getElementById('cy'),elements:els,wheelSensitivity:0.2,
 style:[
  {selector:'node',style:{'background-color':n=>KC[n.data('kind')]||'#94a3b8','width':'data(sz)','height':'data(sz)','label':'data(label)','font-size':6,'color':'#334155','text-opacity':0,'text-valign':'bottom','text-margin-y':2,'text-wrap':'ellipsis','text-max-width':90,'border-width':n=>n.data('ext')?2:0,'border-color':'#94a3b8','border-style':'dashed'}},
  {selector:'node[?ext]',style:{'background-opacity':0.45}},
  {selector:'node:selected',style:{'border-width':3,'border-color':'#f59e0b','border-style':'solid','text-opacity':1,'font-size':9}},
  {selector:'.nbr',style:{'text-opacity':1,'font-size':8}},
  {selector:'edge',style:{'width':e=>e.data('e').cross?2:1,'line-color':e=>EC[e.data('type')]||'#ccc','line-style':e=>e.data('e').cross?'dashed':'solid','curve-style':'haystack','opacity':0.55,'target-arrow-shape':e=>e.data('e').symmetric?'none':'triangle','target-arrow-color':e=>EC[e.data('type')]||'#ccc','arrow-scale':0.6}},
  {selector:'edge:selected',style:{'opacity':1,'width':3}},
  {selector:'.dim',style:{'opacity':0.06,'text-opacity':0}}
 ],
 layout:{name:'cose',animate:false,nodeRepulsion:9000,idealEdgeLength:55,padding:30}});

function resolveLink(fromId,href){let base=fromId.split('/').slice(0,-1);for(const p of href.split('/')){if(p==='..')base.pop();else if(p!=='.')base.push(p);}let id=base.join('/');return nodeById[id]?id:null;}
function showDetail(id){const n=nodeById[id];if(!n)return;cy.$(':selected').unselect();const node=cy.getElementById(id);node.select();cy.elements().removeClass('nbr');node.connectedNodes().addClass('nbr');cy.animate({center:{eles:node},duration:200});
 let h=`<span class="chip" style="background:${KC[n.kind]}">${n.kind}</span> ${n.external?'<span class="chip" style="background:#94a3b8">外部</span>':''}<h2>${esc(n.title)}</h2><div class="id">${n.id}</div>`;
 if(n.description)h+=`<p>${esc(n.description)}</p>`;
 if(n.resource)h+=`<p><a class="ext" href="${n.resource}" target="_blank" rel="noopener">上游 resource ↗</a></p>`;
 if(n.tags&&n.tags.length)h+=`<div>${n.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`;
 const inc=cy.getElementById(id).connectedEdges().map(x=>x.data('e'));
 const groups={};inc.forEach(e=>{if(e.type==='part_of')return;const me=id;const other=e.source===me?e.target:e.source;const lab=persp(e,me);(groups[lab]=groups[lab]||[]).push([other,e]);});
 const order=['实现示例','对应接口','开发指南','讲解接口','声明头文件','声明的接口','配套样例','对应指南','同主题','相关','提及'];
 Object.keys(groups).sort((a,b)=>order.indexOf(a)-order.indexOf(b)).forEach(lab=>{h+=`<div class="grp">${lab} (${groups[lab].length})</div>`;groups[lab].forEach(([o,e])=>{const t=nodeById[o];h+=`<a class="nb" onclick="showDetail('${o}')">${esc(t?t.title:o)} <span class="w">· ${ETZH[e.type]||e.type} ${e.weight.toFixed(1)}</span></a>`;});});
 const bl=(back[id]||[]).filter(e=>e.type!=='part_of'&&!e.symmetric);
 if(bl.length){h+=`<div class="grp">被引用 / 指向本卡 (${bl.length})</div>`;bl.forEach(e=>{const t=nodeById[e.source];h+=`<a class="nb" onclick="showDetail('${e.source}')">${esc(t?t.title:e.source)} <span class="w">· ${ETZH[e.type]||e.type}</span></a>`;});}
 const body=(G.bodies||{})[id];if(body){h+=`<div id="body">${marked.parse(body,{gfm:true,breaks:false})}</div>`;}
 const d=document.getElementById('detail');d.innerHTML=h;d.scrollTop=0;
 d.querySelectorAll('#body a[href]').forEach(a=>{const href=a.getAttribute('href');if(href&&href.endsWith('.md')&&!href.includes('://')){const tid=resolveLink(id,href);if(tid){a.className='int';a.removeAttribute('href');a.onclick=()=>showDetail(tid);return;}}a.className='ext';a.target='_blank';a.rel='noopener';});}
function kg(k){if(['implementation_trap','debugging_journey','cross_skill_gap','field_note'].includes(k))return'field_note';if(['operator_optimization','runbook'].includes(k))return'runbook';return k;}
function persp(e,me){const k=kg(nodeById[me].kind);if(e.type==='exemplifies'){if(k==='api'||k==='guide')return'实现示例';if(k==='operator'||k==='field_note')return'实践案例';return'对应接口';}if(e.type==='explains'){if(k==='api')return'开发指南';if(k==='operator'||k==='field_note'||k==='runbook')return'开发指南';return'讲解接口';}if(e.type==='declares')return k==='api'?'声明头文件':'声明的接口';if(e.type==='demonstrates')return k==='guide'?'配套样例':'对应指南';if(e.type==='same_topic')return'同主题';if(e.type==='related')return'相关';if(e.type==='mentions')return'提及';return'相关';}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
cy.on('tap','node',ev=>showDetail(ev.target.id()));
cy.on('tap','edge',ev=>{const e=ev.target.data('e');document.getElementById('detail').innerHTML=`<div class="grp">边</div><p><b>${ETZH[e.type]||e.type}</b> ${e.symmetric?'(对称)':''}<br><span class="id">${e.source}<br>${e.symmetric?'—':'→'} ${e.target}</span></p><p>via: ${e.via.join(', ')}<br>why: ${esc(e.why)}<br>weight: ${e.weight}</p>`;});
cy.on('tap',ev=>{if(ev.target===cy){cy.elements().removeClass('nbr');cy.$(':selected').unselect();}});
document.getElementById('layout').onchange=e=>cy.layout({name:e.target.value,animate:false,padding:30}).run();
document.getElementById('reset').onclick=()=>{cy.fit(null,30);document.getElementById('q').value='';cy.elements().removeClass('dim');};
document.getElementById('q').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(!q){cy.elements().removeClass('dim');return;}cy.nodes().forEach(n=>{const d=n.data();const hay=(d.label+' '+d.id+' '+d.bundle).toLowerCase();n.toggleClass('dim',!hay.includes(q));});cy.edges().forEach(e=>e.toggleClass('dim',e.source().hasClass('dim')||e.target().hasClass('dim')));};
function mkfilter(host,title,keys,active,attr){let h=`<b>${title}</b>`;keys.forEach(k=>h+=`<label><input type=checkbox ${active(k)?'checked':''} data-f="${attr}" data-v="${k}">${k}</label>`);document.getElementById(host).innerHTML=h;}
mkfilter('bundleF','bundle:',G.meta.bundles,()=>true,'bundle');
mkfilter('kindF','kind:',['api','example','header','guide','glossary','index','other','operator','operator_optimization','implementation_trap','debugging_journey','cross_skill_gap'],()=>true,'kind');
mkfilter('typeF','边:',Object.keys(EC),k=>k!=='mentions'&&k!=='part_of','type');
document.getElementById('legend').innerHTML=Object.keys(EC).map(t=>`<span><b style="background:${EC[t]}"></b>${ETZH[t]}</span>`).join('');
function applyFilters(){const on=a=>new Set([...document.querySelectorAll(`input[data-f="${a}"]:checked`)].map(x=>x.dataset.v));
 const kb=on('bundle'),kk=on('kind'),kt=on('type');
 cy.nodes().forEach(n=>{const d=n.data();n.style('display',(kb.has(d.bundle)||!d.bundle)&&kk.has(d.kind)?'element':'none');});
 cy.edges().forEach(e=>{const vis=kt.has(e.data('type'))&&e.source().style('display')==='element'&&e.target().style('display')==='element';e.style('display',vis?'element':'none');});}
document.querySelectorAll('.filters input').forEach(cb=>cb.onchange=applyFilters);applyFilters();
const first=G.nodes.find(n=>n.kind==='api'&&!n.external)||G.nodes.find(n=>!n.external)||G.nodes[0];if(first)showDetail(first.id);

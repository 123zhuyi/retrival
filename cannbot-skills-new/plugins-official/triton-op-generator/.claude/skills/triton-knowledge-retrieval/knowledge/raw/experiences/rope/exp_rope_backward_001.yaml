optimization_points:
- grid_stride_loop: Implements a grid-stride loop (`for block_id in range(pid, total_blocks,
    grid_size)`) to allow a single program to process multiple blocks. This increases
    hardware utilization and load balancing, particularly when the total number of
    sequence blocks is large or not evenly divisible by the grid size.
- varlen_memory_optimization: Specialized logic for `IS_VARLEN` loads chunk metadata
    (`chunk_indices_ptr`) to compute dynamic sequence offsets and masks. This avoids
    padding to the maximum sequence length, significantly reducing memory bandwidth
    consumption for ragged batches common in LLM inference.
- vectorized_load_strategy: Uses compile-time branching (`ALIGNED`) to select the
    optimal memory access pattern. When aligned, it loads the full RoPE dimension
    in a single transaction for maximum throughput; otherwise, it splits loads into
    two halves to handle unaligned addresses or non-contiguous memory layouts safely
    without hardware penalties.
- kv_cache_aware_indexing: Supports `HAS_KV_LENS` to correctly index `cos` and `sin`
    tables based on the actual KV cache length per batch. This ensures correctness
    for autoregressive decoding scenarios where the KV sequence length differs from
    the current input sequence length.

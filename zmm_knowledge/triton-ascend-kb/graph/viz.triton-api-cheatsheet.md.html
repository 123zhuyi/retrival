}], "bodies": {"triton-api-cheatsheet.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/api/triton_api_cheatsheet.md\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/api/triton_api_cheatsheet.md` 迁移而来，原始为 API 速查表，未做内容改写，仅转 OKF frontmatter。\n\n# Triton API Quick Reference for Ascend Development\n\n## Kernel Declaration\n\n| API | Signature | Description |\n|-----|-----------|-------------|\n| `@triton.jit` | `@triton.jit` | Compile kernel for device execution |\n| `@triton.autotune` | `@triton.autotune(configs, key)` | Auto-select best config from list |\n| `@triton.heuristics` | `@triton.heuristics({'KEY': fn})` | Dynamic config based on input |\n| `tl.constexpr` | Type annotation | Compile-time constant (enables specialization) |\n\n**Ascend note**: `tl.constexpr` parameters are evaluated at JIT compile time, enabling dead-code elimination. Use for `HAS_BIAS`, `HAS_RESIDUAL`, etc.\n\n```python\n@triton.autotune(\n    configs=[\n        triton.Config({'BLOCK_M': 128, 'BLOCK_N': 128, 'BLOCK_K': 256, 'GROUP_SIZE': 8}),\n        triton.Config({'BLOCK_M': 256, 'BLOCK_N': 256, 'BLOCK_K': 256, 'GROUP_SIZE': 16}),\n    ],\n    key=['M', 'N', 'K'],\n)\n@triton.jit\ndef kernel(..., BLOCK_M: tl.constexpr, BLOCK_N: tl.constexpr, BLOCK_K: tl.constexpr):\n    ...\n```\n\n## Program Identity\n\n| API | Signature | Description |\n|-----|-----------|-------------|\n| `tl.program_id` | `tl.program_id(axis: int)` | Current program's ID along axis (0, 1, 2) |\n| `tl.num_programs` | `tl.num_programs(axis: int)` | Total number of programs along axis |\n\n```python\npid = tl.program_id(axis=0)\nnum_programs = tl.num_programs(axis=0)\n# Grid-stride: for row in range(pid, n_rows, num_programs)\n```\n\n## Memory\n\n| API | Signature | Description |\n|-----|-----------|-------------|\n| `tl.load` | `tl.load(ptr, mask=None, other=0, cache_modifier='', care_padding=True)` | Load from HBM to register |\n| `tl.store` | `tl.store(ptr, val, mask=None)` | Store from register to HBM |\n| `tl.make_block_ptr` | `tl.make_block_ptr(base, shape, strides, offsets, block_shape, order)` | 2D block pointer |\n| `tl.advance` | `tl.advance(ptr, offsets)` | Advance a block pointer |\n\n**Ascend notes**:\n- `care_padding=False`: Eliminates MTE2→Vector sync barrier; safe when out-of-bound values are masked at store. **Use this for ILP.**\n- `cache_modifier='.ca'`: Cache in L2 (streaming). `'.cg'`: Cache at L1 level.\n- `tl.make_block_ptr` with `order=(1, 0)` for row-major (standard for Dot API on 910B2).\n\n```python\n# Standard load with ILP optimization\nx = tl.load(ptr + offs, mask=mask, other=0.0, care_padding=False)\n\n# 2D block pointer for matmul\na_block_ptr = tl.make_block_ptr(\n    base=A, shape=(M, K), strides=(stride_am, stride_ak),\n    offsets=(pid_m * BLOCK_M, 0), block_shape=(BLOCK_M, BLOCK_K), order=(1, 0)\n)\na = tl.load(a_block_ptr)\na_block_ptr = tl.advance(a_block_ptr, (0, BLOCK_K))\n```\n\n## Indexing\n\n| API | Signature | Description |\n|-----|-----------|-------------|\n| `tl.arange` | `tl.arange(start, end)` | Integer range tensor (end - start must be power of 2) |\n| `tl.reshape` | `tl.reshape(x, shape)` | Reshape tensor |\n| `tl.view` | `tl.view(x, shape)` | View with different shape (zero-copy) |\n| `tl.trans` | `tl.trans(x)` | Transpose 2D tensor |\n| `tl.permute` | `tl.permute(x, dims)` | Permute dimensions |\n| `tl.expand_dims` | `tl.expand_dims(x, axis)` | Add dimension of size 1 |\n\n**Ascend note**: `tl.arange(0, N)` produces **int64** by default. For masking, cast to fp32 first to avoid scalar fallback:\n```python\ncols = tl.arange(0, BLOCK_N).to(tl.float32)  # avoid int64 CMP scalar fallback\nmask = cols < N\n```\n\n## Math Operations\n\n| API | Signature | Description |\n|-----|-----------|-------------|\n| `tl.exp` | `tl.exp(x)` | Element-wise exp |\n| `tl.log` | `tl.log(x)` | Element-wise natural log |\n| `tl.sqrt` | `tl.sqrt(x)` | Element-wise square root |\n| `tl.rsqrt` | `tl.rsqrt(x)` | Element-wise reciprocal square root |\n| `tl.abs` | `tl.abs(x)` | Element-wise absolute value |\n| `tl.sin` | `tl.sin(x)` | Element-wise sine |\n| `tl.cos` | `tl.cos(x)` | Element-wise cosine |\n| `tl.sigmoid` | `tl.sigmoid(x)` | Element-wise sigmoid: 1/(1+exp(-x)) |\n| `tl.tanh` | `tl.tanh(x)` | Element-wise tanh |\n| `tl.erf` | `tl.erf(x)` | Element-wise error function (for GELU) |\n\nAll math ops require floating-point input (fp16, bf16, or fp32). They do NOT work with int types.\n\n## Reduction Operations\n\n| API | Signature | Description |\n|-----|-----------|-------------|\n| `tl.sum` | `tl.sum(x, axis=None, keep_dims=False)` | Sum reduction |\n| `tl.max` | `tl.max(x, axis=None, keep_dims=False)` | Max reduction |\n| `tl.min` | `tl.min(x, axis=None, keep_dims=False)` | Min reduction |\n| `tl.reduce` | `tl.reduce(x, axis, combine_fn)` | Custom reduction with combine function |\n\n```python\n# Row-wise sum for LayerNorm\nrow_sum = tl.sum(x, axis=1, keep_dims=True)   # [BLOCK_M, 1]\n\n# Scalar max for softmax\nm = tl.max(scores, axis=1)  # [BLOCK_M]\n```\n\n## Compute Operations\n\n| API | Signature | Description |\n|-----|-----------|-------------|\n| `tl.dot` | `tl.dot(a, b, acc=None, out_dtype=tl.float32)` | Matrix multiply: a @ b |\n| `tl.where` | `tl.where(cond, x, y)` | Conditional select |\n| `tl.cdiv` | `tl.cdiv(a, b)` | Ceiling integer division |\n\n**Ascend note for `tl.dot`**:\n- Input tensors must have rank 2\n- Output is float32 accumulator by default\n- `out_dtype=tl.float16` for fp16 output accumulation (less precise, faster)\n- For 910B2: use `order=(1, 0)` in `tl.make_block_ptr` for compatible format\n\n```python\nacc = tl.zeros([BLOCK_M, BLOCK_N], dtype=tl.float32)\na = tl.load(a_ptr)   # [BLOCK_M, BLOCK_K]\nb = tl.load(b_ptr)   # [BLOCK_K, BLOCK_N]\nacc += tl.dot(a, b)  # fp32 accumulation\n```\n\n## Atomic Operations\n\n| API | Signature | Description |\n|-----|-----------|-------------|\n| `tl.atomic_add` | `tl.atomic_add(ptr, val, mask=None)` | Atomic add to memory |\n| `tl.atomic_max` | `tl.atomic_max(ptr, val, mask=None)` | Atomic max to memory |\n| `tl.atomic_cas` | `tl.atomic_cas(ptr, cmp, val)` | Compare-and-swap |\n\nUsed for Split-K reduction patterns where multiple programs write to the same output location.\n\n```python\n# Split-K: atomically accumulate partial sums\ntl.atomic_add(C_ptr + offs, partial_sum, mask=mask)\n```\n\n## Type Operations\n\n| API | Signature | Description |\n|-----|-----------|-------------|\n| `x.to(dtype)` | `tensor.to(tl.float32)` | Cast tensor to dtype |\n| `tl.float32` | Type constant | 32-bit float |\n| `tl.float16` | Type constant | 16-bit float |\n| `tl.bfloat16` | Type constant | Brain float 16 |\n| `tl.int32` | Type constant | 32-bit integer |\n| `tl.int64` | Type constant | 64-bit integer (avoid for CMP/ADD) |\n| `tl.int8` | Type constant | 8-bit integer (for quantization) |\n| `tl.float8e4m3fn` | Type constant | FP8 E4M3 format |\n\n**Critical Ascend type rules**:\n- int64 ADD → scalar fallback → cast to fp32\n- int64 CMP → scalar fallback → cast to fp32\n- int32 CMP → scalar fallback → cast to fp32\n- Always accumulate in fp32 when inputs are fp16/bf16\n\n## Control and Debug\n\n| API | Signature | Description |\n|-----|-----------|-------------|\n| `tl.static_assert` | `tl.static_assert(cond, msg)` | Compile-time assertion |\n| `tl.device_assert` | `tl.device_assert(cond, msg)` | Runtime assertion (debug only) |\n| `tl.debug_barrier` | `tl.debug_barrier()` | Memory fence for debugging |\n\n## Ascend Extensions\n\n### `dl.async_task`\n\n```python\nimport triton_ascend.language as dl\n\nwith dl.async_task(scope=\"cube\"):\n    acc = tl.dot(a, b)       # runs on Cube unit\n\nwith dl.async_task(scope=\"vector\"):\n    out = tl.sigmoid(acc)    # runs on Vector unit (concurrent with next Cube)\n```\n\n| scope | Unit | Use for |\n|-------|------|---------|\n| `\"cube\"` | Cube unit | tl.dot, GEMM |\n| `\"vector\"` | Vector unit | elementwise, norm, reduction |\n\n### `dl.compile_hint`\n\n```python\ndl.compile_hint(\"multibuffer=true\")           # enable double-buffer\ndl.compile_hint(\"dot_pad_only_k\")             # Cube K-only padding\ndl.compile_hint(\"enable_hivm_auto_cv_balance\") # auto CV balance\ndl.compile_hint(\"tile_mix_vector_loop=4\")     # Vector split granularity\ndl.compile_hint(\"tile_mix_cube_loop=2\")       # Cube split granularity\ndl.compile_hint(\"set_workspace_multibuffer 4\") # 4-level prefetch\n```\n\n### `tle.index_select_simd`\n\n```python\nimport triton_ascend.language.extra as tle\n\n# SIMD-optimized index select (faster than gather for contiguous ranges)\nselected = tle.index_select_simd(src, indices)\n```\n\nUse for MoE expert routing and attention with custom index patterns.\n\n### `dl.grouped_launch_diagonal`\n\n```python\npid_m, pid_n = dl.grouped_launch_diagonal(\n    pid,       # int: linear program ID\n    num_pid_m, # int: tiles in M dimension\n    num_pid_n, # int: tiles in N dimension\n    GROUP_SIZE # int: tiles per diagonal group (8, 16, or 32)\n)\n```\n\nHardware-level diagonal PID mapping for L2 bank conflict elimination. 910B2 only. **Do NOT use `tl.swizzle2d` instead.**\n\n## Quick Ascend Gotcha Reference\n\n| Gotcha | Fix |\n|--------|-----|\n| `tl.arange` returns int64, CMP is scalar | `.to(tl.float32)` before comparison |\n| `tl.load` with mask causes pipeline stall | Add `care_padding=False` |\n| Grid > num_aicores fails | Use 1D grid ≤ num_aicores, or set TRITON_ALL_BLOCKS_PARALLEL=1 |\n| 2D grid shape mismatch | Use 1D grid + manual index compute |\n| L2 bank conflict on large matmul | Use `dl.grouped_launch_diagonal` |\n| UB overflow | Reduce BLOCK_M/BLOCK_N/BLOCK_K |\n| Scalar fallback on int32 ADD | Cast to fp32 |\n| `tl.swizzle2d` for diagonal | Replace with `dl.grouped_launch_diagonal` |\n\n## 相关页面\n- techniques/data_types — Scalar fallback types and fixes\n- techniques/ilp — care_padding and dl.async_task details\n- techniques/core_mapping — dl.grouped_launch_diagonal usage\n- [hardware/ascend_910b](ascend-910b.md) — dl.compile_hint options and env vars\n- workflows/profiling — Profiling APIs and metrics\n\n\n", "runbooks/portability/exp_matmul_ascend_wavefront_001.md": "\n\n## 波前调度 MatMul：对角遍历 + dot_pad_only_k + autotune tile 长宽比\n\n【优化维度】：跨芯片适配\n【适用条件】：平台 910b2/910b3/91093/91095 ｜ triton-ascend 版本 未标注（依赖 dl 模块 compile hint）｜ dtype 全部 ｜ shape 大规模矩阵（访存带宽为主要瓶颈时收益最大）\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3, 91093, 91095；失效边界：对角/波前调度只对访存受限的大矩阵收益显著，计算受限或小矩阵场景与行主序无差；dl.compile_hint 为 Ascend 扩展，GPU 无对应物；autotune 的 tile 候选须满足 UB/寄存器约束，盲目加大 tile 会 spill；与 exp_matmul_ascend_001 同源，本卡多 autotune 维度；910C/310P 未验证（unverified)）\n\n### 原则\n- **wavefront scheduling**：The kernel utilizes `grouped_launch_diagonal` to map program IDs to matrix blocks. This diagonal (or wavefront) traversal order ensures that blocks processed consecutively share data rows from matrix A and columns from matrix B. This significantly increases data locality in the cache (L2/SRAM), reducing redundant global memory accesses compared to a row-major or column-major traversal.\n- **hardware specific alignment**：The application of `dl.compile_hint(..., \"dot_pad_only_k\")` is a critical hardware adaptation. It instructs the backend compiler to pad the inputB-dimension of the data blocks specifically for the dot product operation. This ensures that the data layout aligns perfectly with the requirements of the hardware's matrix units (e.g., the Cube unit on Ascend processors) without the overhead of padding the entire global tensor, maximizing compute throughput.\n- **autotuning block shapes**：The `@triton.autotune` configuration sweeps through different tile aspect ratios (128x256 vs 256x128) and varying `BLOCK_TRESHHOLD` values. This allows the kernel to dynamically select the most efficient tile size and wavefront grouping parameter based on the specific N and inputB dimensions of the input matrices, balancing register pressure and instruction-level parallelism.\n- **static multi core distribution**：The loop `for block_idx in range(pid, NUM_BLOCKS, NUM_CORES)` implements a static block-cyclic distribution of work across the available cores. This minimizes scheduling overhead and ensures load balancing, especially when the total number of blocks is not perfectly divisible by the number of cores.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/074-matmul_kernel.py\n```\n\n**坏实践（反例）**：行主序/列主序映射 program id 到 block → 同时调度的核心访问的 A 行、B 列互不重叠，L2/SRAM 冗余加载严重 → ✅ 正解即本条：对角波前遍历让并发 block 共享 A 行与 B 列；再配 `dot_pad_only_k` 与 tile 长宽比 autotune\n\n**已知实例**：matmul §raw (`experiences/matmul/exp_matmul_ascend_wavefront_001.yaml`)\n- 声称性能收益：35%\n- 备注：This implementation relies on the `dl` module (likely a deep learning library extension for Ascend) for compile hints. The diagonal scheduling strategy is most effective for large-scale matrix multiplications where memory bandwidth is the primary bottleneck.\n\n\n", "runbooks/portability/exp_sparse_flash_attn_prefill_001.md": "\n\n## 稀疏注意力 prefill：tle.index_select_simd 按需取 Top-K + cube1 加速 + 工作集 tile=64\n\n【优化维度】：跨芯片适配\n【适用条件】：平台 910b2/910b3 ｜ triton-ascend 版本 未标注（依赖 tle/cube1 专有内建）｜ dtype 混合精度（FP32 LSE 累加）｜ shape 长上下文 prefill，需预计算 Top-K 索引\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3；失效边界：tle.index_select_simd / cube1 / tle.sub_vec_id 为 Ascend 专有内建，GPU Triton 无对应物；依赖外部预计算的 Top-K 索引，索引缺失或质量差时稀疏假设不成立；稀疏度低（Top-K 接近全量）时 gather 开销抵消带宽收益；CACHE_BLOCK=64 按 UB 容量调优；910C/310P 未验证（unverified)）\n\n### 原则\n- **sparse indexing simd**：Utilizes tle.index_select_simd to gather only the Top-inputB keys from global memory based on the Indices_ptr. This significantly reduces memory bandwidth consumption compared to dense attention by avoiding the load of irrelevant key tokens.\n- **cube unit acceleration**：Explicitly invokes the hardware Cube unit via the cube1 intrinsic for the inputA @ inputB^T matrix multiplication. This offloads the heavy compute workload from the vector unit to the dedicated matrix accelerator, maximizing throughput.\n- **online softmax stability**：Implements the numerically stable online softmax algorithm using Log-Sum-Exp (LSE) logic. It processes the sequence in blocks (BLOCK_SBS), updating the LSE and accumulator incrementally, which prevents overflow/underflow and avoids materializing the full [S, S] attention matrix.\n- **workspace tiling strategy**：Manually manages workspace buffers (Wksp_K_ptr, Wksp_qk_ptr, etc.) with a CACHE_BLOCK size of 64. This ensures that data loaded into the Unified Buffer (UB) is fully utilized before being discarded, optimizing data residency and minimizing HBM access latency.\n- **intra core parallelism**：Leverages tle.sub_vec_id to distribute the processing of heads and blocks across the vector lanes or sub-cores within a single AI Core, ensuring high hardware utilization.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/199-sparse_flash_attention_prefill_kernel.py\n```\n\n**坏实践（反例）**：稀疏注意力仍按稠密方式加载全部 key 再掩码 → 无关 key token 的 GM 带宽照付，稀疏性完全浪费 → ✅ 正解即本条：`tle.index_select_simd` 按 Top-K 索引只 gather 需要的 key，QK^T 用 cube1 内建派给 Cube 单元，LSE 在线累加避免物化完整注意力矩阵\n\n**已知实例**：attention §raw (`experiences/attention/exp_sparse_flash_attn_prefill_001.yaml`)\n- 声称性能收益：60%\n- 备注：This kernel is highly optimized for the Ascend 910B series architecture using proprietary intrinsics (tle, cube1). It requires pre-computed Top-inputB indices and is designed for the prefill stage of long-context LLMs.\n\n\n", "runbooks/memory-sram/tiling-budget-and-layout-driven-selection.md": "\n\n## OPT-12 Tiling 预算与布局驱动的块大小选择\n\n【优化维度】：内存｜Tiling·SRAM 预算\n【泛化层级】：条件性（迁移条件：所有涉及 UB 的 kernel；失效边界：纯标量/无 tile 的微型 kernel）\n\n<原则：Ascend 每个 AI Core 的 UB 为 192KB。Tile 选择必须同时通过三重检查：UB 容量、512B 行宽对齐、输入布局（BTD/BDT）的连续访问方向。任一检查失败都会导致编译错误、UB overflow 或有效带宽骤降。>\n\n**UB 容量预算公式**：\n\n```\n# elementwise / reduction：单 tile\nBLOCK_SIZE * dtype_bytes <= 192KB\n\n# matmul：同时驻留 A、B、C 三块，保守按 1/3 UB 给单块\nBLOCK_M * BLOCK_K * dtype_bytes + BLOCK_K * BLOCK_N * dtype_bytes <= 192KB / 3\n```\n\n| dtype | 元素大小 | elementwise 最大 BLOCK | matmul 推荐 (M, N, K) |\n|---|---|---|---|\n| fp8 | 1B | 196608 | (256, 256, 256) |\n| fp16 / bf16 | 2B | 98304 | (128/256, 128/256, 256) |\n| fp32 | 4B | 49152 | (128, 128, 128/256) |\n\n**标准 matmul 搜索空间**（已满足 512B 对齐 + UB 预算）：\n\n```python\nconfigs = [\n    triton.Config({'BLOCK_M': bm, 'BLOCK_N': bn, 'BLOCK_K': 256, 'GROUP_SIZE': gs})\n    for bm in [128, 256]\n    for bn in [128, 256]\n    for gs in [8, 16, 32]\n]\n```\n\n**布局驱动的异构 Tile 策略**：\n\n| 布局 | 连续维度 | 推荐策略 | 典型场景 |\n|---|---|---|---|\n| BTD `[B,T,D]` | D 在最内层 | D tile 大可连续 load：`BLOCK_D=512-1024` | Prefill，seq_len ≥ 512 |\n| BDT `[B,D,T]` | T 在最内层 | D tile 小防跨步：`D_CHK_SIZE=16-32`；T tile 大：`T_CHK_SIZE=128-256` | Decode，seq_len 小 |\n\n**坏实践（反例）**：\n```python\n# BDT 布局还大 D tile，导致跨步访问\nBLOCK_D = 1024  # 行间距 = seq_len，cache-line 不连续\n```\n后果：每次 load 跨越大段内存，HBM burst 无法合并，`aiv_mte2_time` 显著升高。✅ 正解即 BDT 用异构小 D tile + 大 T tile。\n\n**决策流程**：\n\n```\n1. 确定 dtype -> 计算 UB 最大 BLOCK\n2. 检查尾轴是否 512B 对齐 -> 不对齐则 pad 或改 BLOCK\n3. 确定布局 BTD/BDT -> 选择 D/T tile 大小\n4. 对 matmul：BLOCK_K ≥ 512 优先 256；K < 256 降至 64-128\n5. autotune 验证 UB 不溢出且 bandwidth 最高\n```\n\n## 已知实例（P3 挂载）\n\n### Experience YAML 反链\n- `exp_perf_001` — 块大小优化 （收益 20%）\n  - 通用块大小调优原则适用于所有Triton算子开发，910b2/910b3平台需结合算子类型（元素级/矩阵级）选择2的幂次块大小，优先测试128/256/512三个档位\n- `exp_causal_conv1d_update_007` — Scheduling Optimization （收益 BDT 布局 + 3D 任务分解 + 双缓冲状态更新：组合贡献约 30-40% 整体性能提升（vs BTD + naive tiling））\n  - 此经验是关于 Update kernel 的整体架构设计决策，涵盖数据布局、tile 大小、Grid 策略、状态更新机制等维度。这些设计决策相互耦合：BDT 布局决定了 D_CHK_SIZE 必须小（避免跨步），小 D_CHK_SIZE 又决定了需要 T-tiling 来并行化…\n\n\n", "runbooks/autotuning/autotune-debug.md": "\n\n## OPT-1 autotune 输出 buffer 重置\n\n【优化维度】：调优｜搜索空间\n【泛化层级】：条件性（迁移条件：累加/原地修改类算子开 autotune；失效边界：纯覆盖写算子无须重置）\n\n<原则：原地修改算子在 autotune 时重复累加同一 buffer，会导致结果错误且性能失真。必须每次重新 clone/初始化输出 buffer，或关闭 autotune。以目标维度（K/E/D）作为 autotune key，避免无关维度导致 config 错配。出现 ACL 507035 时优先检查是否未使用 UB/gather 或运行时 dim 分支。>\n\n<骨架（占位名伪码）：\n# autotune 每次重置\nfor config in autotune_configs:\n    out_buf = torch.zeros_like(out)   # 每次重新初始化，否则重复累加\n    kernel[grid](x, out_buf, ..., **config)\n    # 评估 out_buf\n# autotune key 用目标维度\n@triton.autotune(configs=[...], key=['K', 'E'])  # 不是无关维度\n>\n\n**坏实践（反例）**：autotune 复用输出 buffer\n```python\nout_buf = torch.zeros_like(out)\nfor config in autotune_configs:\n    kernel[grid](x, out_buf, ..., **config)  # out_buf 重复累加，结果错\n```\n后果：结果错误且性能失真。✅ 正解即每次重置 buffer 或关闭 autotune。\n\n**已知实例**：index-computation G10（累加算子 autotune buffer 重置）\n\n\n", "runbooks/autotuning/autotune-num-warps-stages.md": "\n\n## OPT-26 autotune 必须探索 num_warps 与 num_stages\n\n【优化维度】：调优｜autotune\n【泛化层级】：条件性（迁移条件：所有性能关键 kernel；失效边界：极小 kernel 或硬件固定参数无需调优）\n\n<原则：Ascend 上 `num_warps` 和 `num_stages` 对性能影响显著。标量占比高的 kernel 需要更多 warp 隐藏延迟；寄存器压力大的 kernel 高 warp 会导致 spill；内存瓶颈的 kernel 通常 `num_stages=2/3` 最优。单一配置无法覆盖所有 shape 和 register pressure，必须在 autotune 搜索空间中包含这两个维度。>\n\n**推荐搜索空间**：\n\n```python\n@triton.autotune(\n    configs=[\n        triton.Config({}, num_warps=2, num_stages=2),\n        triton.Config({}, num_warps=2, num_stages=3),\n        triton.Config({}, num_warps=2, num_stages=4),\n        triton.Config({}, num_warps=4, num_stages=2),\n        triton.Config({}, num_warps=4, num_stages=3),\n        triton.Config({}, num_warps=8, num_stages=2),\n        triton.Config({}, num_warps=8, num_stages=3),\n    ],\n    key=['BK', 'NC', 'BT'],\n)\n```\n\n**参数含义与经验值**：\n\n| 参数 | 作用 | 经验选择 |\n|---|---|---|\n| `num_warps` | warp 数，影响标量延迟隐藏和寄存器压力 | 标量高 → 8；寄存器压力大 → 2/4 |\n| `num_stages` | 软件流水级数，影响 load/compute 重叠 | 内存瓶颈 → 2/3；长延迟 load → 4 |\n\n**调优方向**：\n\n- `aiv_scalar_ratio` 高、大量标量指令 → 优先尝试 `num_warps=8`。\n- `PipeUtilization` 低、MTE2 stall 高 → 优先尝试 `num_stages=3/4`。\n- 编译报错 spill 或 UB 超限 → 降低 `num_warps` 或 `num_stages`。\n\n**坏实践（反例）**：\n```python\n@triton.autotune(\n    configs=[\n        triton.Config({'BLOCK_M': 128, 'BLOCK_N': 128}),\n    ],\n    key=['M', 'N', 'K'],\n)\n```\n后果：错过最优 warp/stages 组合，性能可能差 20–50%。✅ 正解即至少探索 2/4/8 warps × 2/3 stages。\n\n**KDA 反向调优实例**：\n\n| 轮次 | 优化 | Task Duration | 关键发现 |\n|---|---|---|---|\n| R1 | BK/BV autotune + barrier 外提 | 127,168 μs | 更大 tile + 更少 barrier |\n| R6 | num_warps=8 | 50,867 μs | 更多 warp 隐藏标量延迟 |\n| R7 | Config tuning | 50,700 μs | BK=128, BV=64, num_warps=8 |\n\n## 已知实例（P3 挂载）\n\n### Experience YAML 反链\n- `exp_perf_017` — 调优配置 （收益 20%）\n  - autotune会增大编译时间，但对重复运行收益显著。建议在最终版本启用完整搜索，在开发阶段可用小配置集快速迭代。\n\n\n", "runbooks/autotuning/exp_perf_017.md": "\n\n## autotune 配置空间须覆盖 num_warps(2/4/8)×num_stages(2/3/4) 与 tile 组合\n\n【优化维度】：调优空间设计\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3；失效边界：配置空间越大编译时间越长，开发阶段应用 2-3 个配置的小集合快速迭代、最终版本才全量搜索；可执行剪枝判据：① kernel 含多个 BC×BK 级累加器（寄存器压力大）时剪掉 num_warps=8（spill 风险）；② num_stages 依赖异步拷贝能力，Ascend 上 USE_TMA=False 时 num_stages>2 的流水收益存疑（见 exp_solve_tril_005），可优先试 2/3；③ autotune 的 key 必须包含所有影响 tile 形状的参数（BK/BV/BT 等），漏 key 会导致错误配置复用；经验值 BK=128/BV=64/num_warps=8/num_stages=2 来自特定 fused kernel，仅作起点）\n\n### 原则\n- **问题根因**：单一autotune配置（如num_warps=2, num_stages=3）无法覆盖不同shape/register pressure下的最优调度\n- **核心方案**：扩展autotune配置空间，包含不同num_warps（2/4/8）和num_stages（2/3/4）组合，以及不同tile大小（BK/BV）\n- **经验值**：chunk_kda_bwd_kernel_wy_dqkg_fused在Ascend上最优为BK=128, BV=64, num_warps=8, num_stages=2；更多warp可更好隐藏标量延迟\n- **注意**：对寄存器压力大的kernel（多个BC×BK累加器），高warp数可能导致spill，需实测\n- **典型收益**：在wy_dqkg_fused上从单一配置到tuned配置贡献约10-20%额外加速\n\n### 代码/骨架出处\n- `Triton`:\n```python\n# 单一配置（空间窄）\n@triton.autotune(\n    configs=[triton.Config({}, num_warps=2, num_stages=3)],\n    key=['BK', 'NC', 'BT'],\n)\n\n# 扩展配置空间\n@triton.autotune(\n    configs=[\n        triton.Config({}, num_warps=2, num_stages=2),\n        triton.Config({}, num_warps=2, num_stages=3),\n        triton.Config({}, num_warps=2, num_stages=4),\n        triton.Config({}, num_warps=4, num_stages=2),\n        triton.Config({}, num_warps=4, num_stages=3),\n        triton.Config({}, num_warps=8, num_stages=2),\n        triton.Config({}, num_warps=8, num_stages=3),\n    ],\n    key=['BK', 'NC', 'BT'],\n)\n```\n\n**坏实践（反例）**：只挂一个\"经验配置\"（如 num_warps=2, num_stages=3）就上线 → shape 或寄存器压力变化后调度严重次优，实测与 tuned 配置差 10-20% → ✅ 正解即本条：配置空间覆盖 num_warps 2/4/8 × num_stages 2/3/4 × 关键 tile 档位，并按上列判据剪枝；另一个常见错误是 autotune key 漏掉 tile 参数，导致不同 tile 复用同一配置\n\n**已知实例**：general_perf §raw (`experiences/general_perf/exp_perf_017.yaml`)\n- 声称性能收益：20%\n- 备注：autotune会增大编译时间，但对重复运行收益显著。建议在最终版本启用完整搜索，在开发阶段可用小配置集快速迭代。\n\n\n", "runbooks/autotuning/triton-ascend-microkernel-autotune-noise.md": "\n\n## µs 级 kernel 禁用 autotune；num_stages/num_warps 不生效（来源：ApplyRotaryPosEmb P4 三组一致实测，2026-09-08）\n\n【优化维度】：调优｜autotune\n【泛化层级】：条件性（迁移条件：单 case 延迟 µs 级的小 kernel；失效边界：大 kernel / 后续后端版本支持 num_stages 后复测）\n\n<原则：Triton-Ascend 上 ① `num_stages`/`num_warps` 传入后运行时不生效（WARNING 级别提示，不报错、不生效——**静默无效**，最易被忽视）；② µs 级 kernel 的 autotune 用 do_bench 选配置，测量噪声大于配置间真实差异，会系统性误选。小 kernel 直接用静态 BLOCK 规则；45-case 级多 shape 场景宁可按 shape 分段写 if-else 静态规则，也不要 autotune。>\n\n### 实测数据（三组独立证据）\n\n| 组 | 现象 | 数据 |\n|---|---|---|\n| 直给卡组 | opt 轮挂 autotune（multibuffer 开关） | 4.1228x < 静态轮 4.2060x，拒绝 |\n| 无知识组 | autotune 误选记录 | 「µs 级 kernel do_bench 噪声误选」列入勿重试清单 |\n| KB 检索组 | 最终代码保留 autotune | 34/45 case 显著慢于静态组（per-shape 配置被噪声带偏），geomean 低 15% |\n\nnum_stages 不生效的识别：运行时 WARNING（易被日志淹没）；IR 层面无 multibuffer 结构生成。库内历史卡 [autotune 必须探索 num_warps 与 num_stages](autotune-num-warps-stages.md) 源自 GPU/旧版经验——**在 Triton-Ascend 当前版本上以本卡为准**。\n\n### 替代做法\n\n- 静态规则示例（45-case 扫掠标定）：`BR = min(32, 4096//BD) if R>=768 else (8 if BD>=128 else 16)`——按 shape 分段，编译期确定；\n- 若必须 autotune（大 kernel）：固定 do_bench 的 warmup/rep 到足够大、对选中 config 人工复核一遍 benchmark，且 key 覆盖全部运行时维度。\n\n\n", "runbooks/meta-skills/quant-matmul-autotune-strategy.md": "\n\n## DG-5 量化 matmul autotune 配置策略\n\n【优化维度】：元技能｜瓶颈诊断\n【泛化层级】：条件性（迁移条件：量化 matmul speedup <0.5 且多 shape 范围；失效边界：单 shape 场景无须 autotune 多配置）\n\n<判定依据：量化 matmul 的 shape 范围广（M/K/N 差异大），单一 BLOCK 配置无法覆盖。autotune 要按 shape 范围特化多配置，而非追求单一最优。multibuffer 在 matmul 上可能劣化（与 [[multibuffer-empirical]] 一致）；BLOCK_M=512 过大会回退。与 [[blockm-256-large-m]] 配套。>\n\n<诊断决策树（speedup 低时的 autotune 策略）：\nspeedup < 0.5 且多 shape\n├─ 检查 multibuffer：matmul 上可能劣化（opt_iter_6: 0.3684 vs 基线 0.3749）\n│  -> 关闭 multibuffer 或实测验证（见 [[multibuffer-empirical]]）\n├─ 检查 BLOCK_M：BLOCK_M=512 过大回退（opt_iter_10: 0.3921 vs 0.4129）\n│  -> 大 M 用 BLOCK_M=256（见 [[blockm-256-large-m]]），不要盲目 512\n├─ 按 shape 范围特化 autotune 配置：\n│  ├─ 小 K（K<=256）-> 加 BLOCK_K=32 配置（opt_iter_9: +2.8% 最佳）\n│  ├─ 大 N（N=16384）-> 加 BLOCK_N=512 配置（opt_iter_8: +0.9%）\n│  └─ 小 shape（M<=64,K<=256,N<=512）fp16 -> vector multiply-sum kernel\n│     规避 tl.dot tensor-core 精度问题（见 [[gemm-low-dtype-fp32-accum]]）\n└─ group_size 特化：pergroup32/64/128/256 各一个 kernel，BLOCK_K 对齐 group_size\n>\n\n<配置演进实测（op_8 WeightQuantBatchmatmul）：\n| 迭代 | 策略 | 加速比 |\n|---|---|---|\n| iter_16 基线 | group_size 特化 + per-group BLOCK_K 对齐 | 0.3749 |\n| opt_iter_6 | multibuffer=True | 0.3684（劣化）|\n| opt_iter_7 | 扩展 autotune 17 配置 | 0.3977（+6.1%）|\n| opt_iter_9 | +BLOCK_K=32（小 K）| 0.4129（最佳）|\n| opt_iter_10 | +BLOCK_M=512（大 M）| 0.3921（回退）|\n>\n\n**坏实践（反例）**：单一配置或盲目增大 BLOCK\n```python\n@triton.autotune(configs=[triton.Config({'BLOCK_M':512,'BLOCK_N':512,'BLOCK_K':128})], key=['M','N','K'])\n# 单一配置，小 shape 不适配；BLOCK_M=512 过大回退\n```\n后果：小 K shape 用大 BLOCK_K 浪费迭代，大 M 用 512 回退。✅ 正解即按 shape 范围多配置特化。\n\n**已知实例**：op_8_WeightQuantBatchmatmul（16 轮 gen + 9 轮 opt，0.0562->0.4129）\n\n\n", "runbooks/compute-pipeline/exp_gelu_bwd_001.md": "\n\n## Scheduling Optimization: autotune block m\n\n【优化维度】：多核并行与负载均衡\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3；失效边界：假设行主序 ND layout，其他 layout 需重设计访存；BLOCK_SIZE_M 的 1-32 搜索区间是元素级算子的保守配置，计算密度更高的算子需另调；寄存器压力极低时 autotune 上限可放宽）\n\n### 原则\n- **autotune block m**：The kernel utilizes triton.autotune to dynamically select the optimal BLOCK_SIZE_M (ranging from 1 to 32). This balances register pressure and instruction-level parallelism (ILP) specifically for the row dimension, ensuring optimal performance across varying tensor shapes.\n- **grid stride loop**：Implements a grid-stride loop over the row dimension (`for row_task_id in range(pid, num_row_tasks, grid_size)`). This ensures that all available compute cores are utilized even if the number of rows is not perfectly divisible by the grid size, significantly improving load balancing and hardware occupancy.\n- **vectorized memory access**：The inner loop iterates over columns using BLOCK_SIZE_N, allowing for contiguous memory loads and stores. This maximizes memory bandwidth utilization and coalescing efficiency.\n- **precision upcast**：Intermediate calculations (tanh, cubic terms) are explicitly upcasted to float32 (`x_f32 = x_chunk.to(tl.float32)`). This preserves numerical stability during the derivative computation before casting back to the input data type for the final store.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/244-_gelu_bwd_kernel.py\n```\n\n**坏实践（反例）**：反向导数的 tanh 与三次项直接在 fp16/bf16 下计算 → 低精度下上溢/下溢，梯度不准 → ✅ 正解即本条：`x_f32 = x_chunk.to(tl.float32)` 中间升 fp32 算完再降回，配合 grid-stride 行循环。\n\n**已知实例**：activation §raw (`experiences/activation/exp_gelu_bwd_001.yaml`)\n- 声称性能收益：20%\n- 备注：The kernel is optimized for row-major (ND) layouts. The autotuning range for BLOCK_SIZE_M is conservative (up to 32), which is suitable for element-wise operations where compute intensity is lower than matrix multiplications, preventing register spilling.\n\n\n"}};

  {selector:'edge',style:{'width':e=>e.data('e').cross?2:1,'line-color':e=>EC[e.data('type')]||'#ccc','line-style':e=>e.data('e').cross?'dashed':'solid','curve-style':'haystack','opacity':0.55,'target-arrow-shape':e=>e.data('e').symmetric?'none':'triangle','target-arrow-color':e=>EC[e.data('type')]||'#ccc','arrow-scale':0.6}},
  {selector:'edge:selected',style:{'opacity':1,'width':3}},
  {selector:'.dim',style:{'opacity':0.06,'text-opacity':0}}
 ],
 layout:{name:'cose',animate:false,nodeRepulsion:9000,idealEdgeLength:55,padding:30}});

function resolveLink(fromId,href){let base=fromId.split('/').slice(0,-1);for(const p of href.split('/')){if(p==='..')base.pop();else if(p!=='.')base.push(p);}let id=base.join('/');return nodeById[id]?id:null;}
function showDetail(id){const n=nodeById[id];if(!n)return;cy.$(':selected').unselect();const node=cy.getElementById(id);node.select();cy.elements().removeClass('nbr');node.connectedNodes().addClass('nbr');cy.animate({center:{eles:node},duration:200});
 let h=`<span class="chip" style="background:${KC[n.kind]}">${n.kind}</span> ${n.external?'<span class="chip" style="background:#94a3b8">外部</span>':''}<h2>${esc(n.title)}</h2><div class="id">${n.id}</div>`;
 if(n.description)h+=`<p>${esc(n.description)}</p>`;
 if(n.resource)h+=`<p><a class="ext" href="${n.resource}" target="_blank" rel="noopener">上游 resource ↗</a></p>`;
 if(n.tags&&n.tags.length)h+=`<div>${n.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`;
 const inc=cy.getElementById(id).connectedEdges().map(x=>x.data('e'));
 const groups={};inc.forEach(e=>{if(e.type==='part_of')return;const me=id;const other=e.source===me?e.target:e.source;const lab=persp(e,me);(groups[lab]=groups[lab]||[]).push([other,e]);});
 const order=['实现示例','对应接口','开发指南','讲解接口','声明头文件','声明的接口','配套样例','对应指南','同主题','相关','提及'];
 Object.keys(groups).sort((a,b)=>order.indexOf(a)-order.indexOf(b)).forEach(lab=>{h+=`<div class="grp">${lab} (${groups[lab].length})</div>`;groups[lab].forEach(([o,e])=>{const t=nodeById[o];h+=`<a class="nb" onclick="showDetail('${o}')">${esc(t?t.title:o)} <span class="w">· ${ETZH[e.type]||e.type} ${e.weight.toFixed(1)}</span></a>`;});});
 const bl=(back[id]||[]).filter(e=>e.type!=='part_of'&&!e.symmetric);
 if(bl.length){h+=`<div class="grp">被引用 / 指向本卡 (${bl.length})</div>`;bl.forEach(e=>{const t=nodeById[e.source];h+=`<a class="nb" onclick="showDetail('${e.source}')">${esc(t?t.title:e.source)} <span class="w">· ${ETZH[e.type]||e.type}</span></a>`;});}
 const body=(G.bodies||{})[id];if(body){h+=`<div id="body">${marked.parse(body,{gfm:true,breaks:false})}</div>`;}
 const d=document.getElementById('detail');d.innerHTML=h;d.scrollTop=0;
 d.querySelectorAll('#body a[href]').forEach(a=>{const href=a.getAttribute('href');if(href&&href.endsWith('.md')&&!href.includes('://')){const tid=resolveLink(id,href);if(tid){a.className='int';a.removeAttribute('href');a.onclick=()=>showDetail(tid);return;}}a.className='ext';a.target='_blank';a.rel='noopener';});}
function kg(k){if(['implementation_trap','debugging_journey','cross_skill_gap','field_note'].includes(k))return'field_note';if(['operator_optimization','runbook'].includes(k))return'runbook';return k;}
function persp(e,me){const k=kg(nodeById[me].kind);if(e.type==='exemplifies'){if(k==='api'||k==='guide')return'实现示例';if(k==='operator'||k==='field_note')return'实践案例';return'对应接口';}if(e.type==='explains'){if(k==='api')return'开发指南';if(k==='operator'||k==='field_note'||k==='runbook')return'开发指南';return'讲解接口';}if(e.type==='declares')return k==='api'?'声明头文件':'声明的接口';if(e.type==='demonstrates')return k==='guide'?'配套样例':'对应指南';if(e.type==='same_topic')return'同主题';if(e.type==='related')return'相关';if(e.type==='mentions')return'提及';return'相关';}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
cy.on('tap','node',ev=>showDetail(ev.target.id()));
cy.on('tap','edge',ev=>{const e=ev.target.data('e');document.getElementById('detail').innerHTML=`<div class="grp">边</div><p><b>${ETZH[e.type]||e.type}</b> ${e.symmetric?'(对称)':''}<br><span class="id">${e.source}<br>${e.symmetric?'—':'→'} ${e.target}</span></p><p>via: ${e.via.join(', ')}<br>why: ${esc(e.why)}<br>weight: ${e.weight}</p>`;});
cy.on('tap',ev=>{if(ev.target===cy){cy.elements().removeClass('nbr');cy.$(':selected').unselect();}});
document.getElementById('layout').onchange=e=>cy.layout({name:e.target.value,animate:false,padding:30}).run();
document.getElementById('reset').onclick=()=>{cy.fit(null,30);document.getElementById('q').value='';cy.elements().removeClass('dim');};
document.getElementById('q').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(!q){cy.elements().removeClass('dim');return;}cy.nodes().forEach(n=>{const d=n.data();const hay=(d.label+' '+d.id+' '+d.bundle).toLowerCase();n.toggleClass('dim',!hay.includes(q));});cy.edges().forEach(e=>e.toggleClass('dim',e.source().hasClass('dim')||e.target().hasClass('dim')));};
function mkfilter(host,title,keys,active,attr){let h=`<b>${title}</b>`;keys.forEach(k=>h+=`<label><input type=checkbox ${active(k)?'checked':''} data-f="${attr}" data-v="${k}">${k}</label>`);document.getElementById(host).innerHTML=h;}
mkfilter('bundleF','bundle:',G.meta.bundles,()=>true,'bundle');
mkfilter('kindF','kind:',['api','example','header','guide','glossary','index','other','operator','operator_optimization','implementation_trap','debugging_journey','cross_skill_gap'],()=>true,'kind');
mkfilter('typeF','边:',Object.keys(EC),k=>k!=='mentions'&&k!=='part_of','type');
document.getElementById('legend').innerHTML=Object.keys(EC).map(t=>`<span><b style="background:${EC[t]}"></b>${ETZH[t]}</span>`).join('');
function applyFilters(){const on=a=>new Set([...document.querySelectorAll(`input[data-f="${a}"]:checked`)].map(x=>x.dataset.v));
 const kb=on('bundle'),kk=on('kind'),kt=on('type');
 cy.nodes().forEach(n=>{const d=n.data();n.style('display',(kb.has(d.bundle)||!d.bundle)&&kk.has(d.kind)?'element':'none');});
 cy.edges().forEach(e=>{const vis=kt.has(e.data('type'))&&e.source().style('display')==='element'&&e.target().style('display')==='element';e.style('display',vis?'element':'none');});}
document.querySelectorAll('.filters input').forEach(cb=>cb.onchange=applyFilters);applyFilters();
const first=G.nodes.find(n=>n.kind==='api'&&!n.external)||G.nodes.find(n=>!n.external)||G.nodes[0];if(first)showDetail(first.id);
</script></body></html>

optimization_points:
- block_ptr_tiling: Utilizes `tl.make_block_ptr` to efficiently load 2D blocks of
    Q, K, V, and H tensors. This optimizes memory coalescing and leverages hardware
    load/store units to maximize bandwidth utilization.
- fused_gating_masking: Integrates the exponential gating logic (`exp(g)`) and causal
    masking (`m_A`) directly within the main computation loop. This fusion reduces
    memory traffic by avoiding the storage and reloading of intermediate attention
    matrices.
- mixed_precision_accumulation: Performs matrix multiplications (`tl.dot`) and accumulates
    results in `float32` (`b_o`, `b_A`) before casting to the output dtype. This ensures
    numerical stability during the recurrent state updates and attention score accumulation.
- layout_optimization: Handles the implicit data layout requirements for Tensor Core
    (MMA) operations. The code structure ensures that data loaded into registers is
    aligned for `tl.dot` operations, minimizing the overhead associated with layout
    conversions (e.g., row-major to column-major).

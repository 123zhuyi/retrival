# Abs Operator Code Generation Constraints

## Overview

This file documents constraints for generating a Triton-Ascend kernel from the CANN ops-math Abs operator.  It is intended as input to code generation pipelines.

## Identity Constraints

| Constraint | Value | Rationale | Source |
|-----------|-------|-----------|--------|
| output shape == input shape | Always | Elementwise identity | `abs_infershape.cpp:35` |
| max rank | 8 | ACLNN limit | `aclnn_abs.h:21` |
| data format | ND only | No special formats | `aclnn_abs.cpp:120-124` |
| non-contiguous support | Yes | Contiguous → ViewCopy pipeline | `aclnn_abs.cpp:191,211` |
| empty tensor support | Yes | Early return | `aclnn_abs.cpp:184-188` |

## Type Constraints

### Real types — output dtype matches input dtype

| Input | Output | Notes |
|-------|--------|-------|
| float32 | float32 | Direct abs |
| float16 | float16 | Direct abs |
| bfloat16 | bfloat16 | **Must use FP32 intermediate** |
| int8 | int8 | Direct abs |
| int16 | int16 | Direct abs |
| int32 | int32 | Direct abs |
| int64 | int64 | Direct abs |
| uint8 | uint8 | Passthrough (identity) |
| bool | bool | Passthrough (identity) |

### Complex types — output dtype is promoted

| Input | Output | Formula |
|-------|--------|---------|
| complex64 (2×float32) | float32 | `sqrt(real^2 + imag^2)` |
| complex32 (2×float16) | float16 | `sqrt(real^2 + imag^2)` |


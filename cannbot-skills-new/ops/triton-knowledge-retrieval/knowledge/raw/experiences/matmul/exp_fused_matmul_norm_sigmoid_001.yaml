optimization_points:
- async_pipeline_scheduling: Uses dl.async_task to decouple the matrix multiplication
    (cube scope) from the element-wise operations (vector scope), enabling efficient
    hardware unit utilization and potential execution overlap.
- operator_fusion: Fuses Matrix Multiplication, RMS Normalization, and Sigmoid activation
    into a single kernel launch, significantly reducing HBM access for intermediate
    tensors.
- hardware_unit_specialization: Explicitly maps the Matmul operation to the Cube unit
    and the Norm/Sigmoid operations to the Vector unit, aligning with the Da Vinci
    architecture's strengths.

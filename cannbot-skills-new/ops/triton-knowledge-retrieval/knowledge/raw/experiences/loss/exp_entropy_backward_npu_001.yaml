optimization_points:
- npu_int32_casting: Converts label indices to int32 before equality comparison to
    prevent the NPU from degrading to scalar operations, a critical optimization for
    Ascend hardware where int64 logic is inefficient.
- grouped_scheduling: Implements GROUP_SIZE_M=4 to improve L2 cache locality for the
    hidden tensor, ensuring that consecutive program IDs process the same rows of
    the input matrix to reduce memory access overhead.
- large_k_tiling: Sets BLOCK_SIZE_K=512 to maximize the utilization of the AI Core's
    Cube unit, ensuring sufficient data volume for pipelining during the matrix multiplication
    phase.
performance_boost: 25%
note: This kernel is specifically optimized for the Ascend NPU architecture. The int32
  casting logic is essential to avoid severe performance penalties associated with
  int64 comparisons on these devices.

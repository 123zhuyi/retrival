optimization_points:
- online_softmax_algorithm: Implements the FlashAttention strategy by iteratively
    updating the running maximum (block_m) and the sum of exponentials (block_l).
    This avoids materializing the large $S \times S$ attention matrix in High Bandwidth
    Memory (HBM), significantly reducing memory traffic.
- block_tiling_strategy: Loads Key (k) and Value (v) tensors in blocks defined by
    BLOCK_C. This keeps the Query tensor (block_q) resident in fast on-chip memory
    (SRAM/Registers) while streaming k and v, maximizing data reuse per byte loaded
    from HBM.
- mixed_precision_computation: Utilizes LOW_TYPE (e.g., fp16/bf16) for the output
    accumulation (block_o) to leverage high-throughput tensor core operations, while
    implicitly using higher precision (HIGH_TYPE) for the softmax statistics (block_s,
    block_m, block_l) to ensure numerical stability during exponential calculations.
- gqa_memory_optimization: The stride calculation incorporates GROUP_SIZE (idx_n //
    GROUP_SIZE), enabling efficient memory access patterns for Grouped Query Attention
    (GQA) and Multi-Query Attention (MQA) by allowing multiple query heads to share
    the same Key and Value data blocks.
performance_boost: 200%
note: This is a micro-kernel designed for the inner loop of a FlashAttention forward
  pass. It assumes block_q is pre-loaded and handles the incremental update of output
  and softmax statistics.

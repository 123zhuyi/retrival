optimization_points:
- operator_fusion: Fuses the SwiGLU activation function (x1 * sigmoid(x1) * x2) with
    the per-row dynamic quantization process. This eliminates the need to write intermediate
    activation results to global memory (HBM), significantly reducing memory bandwidth
    consumption and latency.
- vectorized_memory_access: Utilizes wide vector loads to fetch the entire input row
    (`TOTAL_COLS`) in a single transaction for the activation phase, and processes
    the quantization phase in `COL_BLOCK_SIZE` chunks. This maximizes memory bus utilization
    and improves data reuse within registers.
- dynamic_workload_distribution: Dynamically calculates the total number of rows (`total_rows`)
    based on the `group_list_ptr` (supporting both cumulative sum and list formats)
    and partitions the work evenly across `NUM_CORES`. This ensures load balancing
    even in scenarios with variable batch sizes, such as Mixture of Experts (MoE)
    routing.
- hardware_accelerated_casting: Leverages Triton's `cast` primitive with `overflow_mode="saturate"`
    to perform the clamping and type conversion (float to int8) efficiently using
    dedicated hardware instructions, avoiding slower software-based min/max clamping
    logic.
performance_boost: 35%
note: This kernel is optimized for scenarios requiring immediate quantization after
  activation, such as in MoE layers or quantized inference paths. The `GROUP_LIST_TYPE`
  parameter provides flexibility for different input metadata formats.

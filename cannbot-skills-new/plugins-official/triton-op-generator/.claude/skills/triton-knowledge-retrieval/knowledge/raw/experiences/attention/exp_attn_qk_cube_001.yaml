optimization_points:
- blocking_strategy: The kernel tiles the reduction dimension (D_qk) using BLOCK_K,
    allowing data to be loaded in chunks that fit into the GPU's SRAM, significantly
    reducing global memory bandwidth pressure compared to a naive implementation.
- tensor_core_acceleration: Utilizes tl.dot to offload the matrix multiplication to
    the hardware's dedicated matrix units (Cube units), maximizing compute throughput
    for the [G, K] x [K, SBS] operation.
- precision_preservation: Accumulates intermediate results in float32 (tl.float32)
    to maintain numerical stability during the summation over the D_qk dimension,
    preventing precision loss common in fp16/bf16 accumulation.
- boundary_handling: Implements masking logic (mask_D) to safely handle cases where
    the reduction dimension D_qk is not perfectly divisible by BLOCK_K, avoiding out-of-bounds
    memory access without expensive branching.
performance_boost: 25%
note: This kernel is specifically designed for the QK dot product phase of attention
  mechanisms. It assumes inputs are in a layout compatible with the provided strides.

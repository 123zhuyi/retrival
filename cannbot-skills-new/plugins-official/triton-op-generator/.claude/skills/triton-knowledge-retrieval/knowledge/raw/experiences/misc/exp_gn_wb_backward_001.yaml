optimization_points:
- sub_blocking_strategy: The spatial dimension HW is processed in fixed-size sub-blocks
    (SUB_BLOCK_HW=64) within the main loop. This effectively reduces register pressure
    by limiting the live variables at any given time, preventing register spilling
    and allowing the compiler to schedule instructions more efficiently.
- mixed_precision_accumulation: Input tensors (X, dY) and statistics (Mean, Rstd)
    are explicitly cast to float32 before the accumulation operations. This ensures
    that the summation over potentially large spatial dimensions maintains numerical
    precision, avoiding overflow or underflow common in fp16/bf16 reductions.
- vectorized_memory_access: The kernel utilizes 2D masking and pointer arithmetic
    to load tiles of size [BLOCK_N, SUB_BLOCK_HW] in a single operation. This maximizes
    memory bandwidth utilization by ensuring memory accesses are coalesced and aligned
    with the hardware's cache line size.
performance_boost: 25%
note: This kernel is optimized for the Group Normalization backward pass (weight/bias
  gradient). It assumes an NCHW data layout where C is the channel dimension.

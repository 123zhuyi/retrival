optimization_points:
- bdt_layout_rationale: "Update kernel 采用 BDT `[B, D, T]` 布局而非 Prefill 的 BTD `[B, T, D]`。原因是 Decode 阶段 seq_len 小（1 token），但 D 维度大（4096）。BDT 布局下 D 维度连续（stride=1），有利于：(1) 权重 tile `[D_CHK_SIZE, W]` 一次 block load；(2) x_b `[D_CHK_SIZE, buffer_len]` 一次加载；(3) 输出 `[D_CHK_SIZE, T_CHK_SIZE]` 一次 store。BTD 布局对长序列的逐 token 处理更友好（同一 token 的所有 D 维度连续），但对短序列的矩阵式卷积不如 BDT。"
- st_store_head_tile_size_precomputation: "在 host 端预计算 `ST_STORE_HEAD_TILE_SIZE` 作为编译期常量传入 kernel，避免 kernel 内使用 `tl.maximum` 处理负偏移。公式：`ST_STORE_HEAD_TILE_SIZE = width if (seqlen % T_CHK_SIZE) > width else (width - seqlen % T_CHK_SIZE) % T_CHK_SIZE`。在 Ascend 平台上，避免动态负偏移计算可以显著减少 scalar 指令数。用于处理状态更新时 tile 起始偏移为负数（`t_off < -(W-1)`）的特殊情况。"
- double_buffered_state_update: "kernel 写入独立的 `conv_state_update` buffer 而非直接修改 `conv_state`，由宿主函数通过 `conv_state.copy_(conv_state_update)` 一次性同步。这允许多个 program 并发写入不同区域而无竞争，保证状态更新的原子性。类似双缓冲机制，读写分离消除了 WAR（Write-After-Read）依赖。"
- three_dimensional_task_decomposition: "使用 1D grid + strided loop 将 `batch × NUM_D_CHK × NUM_T_CHK` 三维任务映射到硬件。每个 program 通过 `for task in tl.range(pid, total_tasks, num_programs)` 处理多个 tile。相比 2D grid `(batch, cdiv(dim, BLOCK_D))`：(1) 更灵活地处理 D 和 T 两个维度的 tile 化；(2) D_CHK_SIZE=16（小 tile）搭配 T_CHK_SIZE=256（大 tile）的异构 tile 策略被自然支持；(3) 当 total_tasks < num_programs 时自动处理空闲核。"
- d_tiling_size_rationale: "D_CHK_SIZE=16 而非更大的值（如 128 或 256）的原因：BDT 布局下 T 维度在最内层（stride=1），大的 D_CHK_SIZE 会导致跨步访问（各行间距 = seq_len）。D_CHK_SIZE=16 保证每个 D-tile 内的访问连续性好，同时配合 T_CHK_SIZE=256 让每个 tile 覆盖足够多 token 以减少 tile 数量。"
performance_boost: "BDT 布局 + 3D 任务分解 + 双缓冲状态更新：组合贡献约 30-40% 整体性能提升（vs BTD + naive tiling）"
note: "此经验是关于 Update kernel 的整体架构设计决策，涵盖数据布局、tile 大小、Grid 策略、状态更新机制等维度。这些设计决策相互耦合：BDT 布局决定了 D_CHK_SIZE 必须小（避免跨步），小 D_CHK_SIZE 又决定了需要 T-tiling 来并行化，而 T-tiling 引入了重叠加载和状态更新的复杂性。"
version: v1.0
source: causal_conv1d_prefill_GA/conv1d_update_analysis.md §3.1 (并行策略) + §4.2 (布局差异) + §6 (优化1/5/6)
code_snippet:
  st_store_head_precompute: |
    # host 端预计算，避免 kernel 内动态负偏移
    ST_STORE_HEAD_TILE_SIZE = (
        width if (seqlen % T_CHK_SIZE) > width
        else (width - seqlen % T_CHK_SIZE) % T_CHK_SIZE
    )
  three_d_task_decomposition: |
    # 1D grid → 3D task decomposition
    pid = tl.program_id(0)
    total_tasks = batch * NUM_D_CHK * NUM_T_CHK
    for task_id in tl.range(pid, total_tasks, tl.num_programs(0)):
        bi = task_id // (NUM_D_CHK * NUM_T_CHK)
        di = (task_id // NUM_T_CHK) % NUM_D_CHK
        ti = task_id % NUM_T_CHK

ptimization: paged kv cache", "kind": "operator_optimization", "bundle": "runbooks", "category": "memory-sram", "tags": ["访存效率", "attention-operations", "attention"], "resource": "", "description": "attention 场景下，Memory Access Optimization: paged kv cache，收益 45%", "degree": 30, "external": true}, {"id": "runbooks/memory-sram/exp_paged_gqa_001.md", "title": "Memory Access Optimization: paged kv cache with gqa head tiling", "kind": "operator_optimization", "bundle": "runbooks", "category": "memory-sram", "tags": ["访存效率", "matrix-operations", "attention"], "resource": "", "description": "attention 场景下，Memory Access Optimization: paged kv cache with gqa head tiling，收益 35%", "degree": 30, "external": true}], "edges": [{"source": "SPEC-Knowledge-Unit.md", "target": "SPEC-Retrieve-legacy.md", "type": "related", "weight": 1.0, "via": ["llm"], "why": "主题相关：共享 legacy, triton_knowledge_retrieval", "symmetric": true, "cross": true}, {"source": "SPEC-Retrieve-legacy.md", "target": "index.md", "type": "part_of", "weight": 1.0, "via": ["hier"], "why": "directory hierarchy", "symmetric": false, "cross": true}, {"source": "ops/mla-prolog-v3.md", "target": "SPEC-Retrieve-legacy.md", "type": "exemplifies", "weight": 1.0, "via": ["llm"], "why": "同属优化知识，主题相关", "symmetric": false, "cross": true}, {"source": "ops/nsa-compress-with-cache.md", "target": "SPEC-Retrieve-legacy.md", "type": "exemplifies", "weight": 1.0, "via": ["llm"], "why": "同属优化知识，主题相关", "symmetric": false, "cross": true}, {"source": "runbooks/memory-sram/exp_mla_paged_attn_001.md", "target": "SPEC-Retrieve-legacy.md", "type": "explains", "weight": 1.0, "via": ["llm"], "why": "同属优化知识，主题相关", "symmetric": false, "cross": true}, {"source": "runbooks/memory-sram/exp_paged_gqa_001.md", "target": "SPEC-Retrieve-legacy.md", "type": "explains", "weight": 1.0, "via": ["llm"], "why": "同属优化知识，主题相关", "symmetric": false, "cross": true}], "bodies": {"SPEC-Knowledge-Unit.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/references/knowledge-unit-format.md\n    role: primary\n\n> legacy 规范，已被 OKF 卡结构取代，仅作历史参考。\n\n# 知识单元类型与格式规范\n\n> 本文档定义 Triton Ascend 知识检索 Skill 使用的 10 种知识单元类型、  \n> 标准格式模板和优先级体系。\n\n## 一、知识单元类型\n\n| 序号 | 类型标签 | 含义 | 优先级 | 生成阶段 |\n|------|---------|------|--------|---------|\n| 1 | `[硬件约束]` | 必须满足的硬件限制，违反会导致编译错误或运行崩溃 | **P0** | Step 1 |\n| 2 | `[性能约束]` | 违反会导致严重性能退化，但不崩溃 | **P0** | Step 1 |\n| 3 | `[算子分类]` | 算子类型分类结果，决定后续检索方向 | **P0** | Step 2 |\n| 4 | `[API用法]` | 需要使用的 Triton/Ascend API 及其正确用法 | **P1** | Step 3 |\n| 5 | `[API文档]` | API 文档所在路径，供查阅详细参数 | **P2** | Step 3 |\n| 6 | `[潜在瓶颈]` | 该算子类型在此硬件上已知的性能瓶颈点 | **P1** | Step 4 |\n| 7 | `[调优经验]` | 来自 experiences/ 的具体优化经验，含条件和提升幅度 | **P1** | Step 4 |\n| 8 | `[调优策略]` | 来自 techniques/ 的通用优化策略 | **P2** | Step 5 |\n| 9 | `[代码骨架]` | 可直接参考的完整骨架代码 | **P2** | Step 6 |\n| 10 | `[矛盾提示]` / `[调试建议]` | 知识库矛盾说明 / 数值排查方法 | **P3** | 按需 |\n\n### 优先级规则\n\n- **P0 (强制)**: 所有算子必须包含\n- **P1 (必要)**: 直接影响正确性和性能\n- **P2 (推荐)**: 提升性能，按需包含\n- **P3 (辅助)**: 仅在出现具体问题时触发\n\n## 二、标准格式模板\n\n```\n知识单元 {ID} [{类型标签}] {标题}\n  {具体知识内容}\n  来源: {文件路径或经验ID}\n```\n\n## 三、与 OKF 的映射关系\n\n| 原知识单元 | OKF 对应 |\n|-----------|---------|\n| 硬件约束 / 性能约束 | `runbooks/` canonical 条目 |\n| 调优经验 | `runbooks/` 的「已知实例」反链 |\n| 调优策略 | `runbooks/` canonical 条目 |\n| API 用法 / API 文档 | `reference/` 卡 |\n| 代码骨架 | `reference/skeleton-*.md` |\n| 算子分类 | `reference/op-class-*.md` |\n\n---\n\n*原文档其余内容见 primary source。*\n\n\n", "SPEC-Retrieve-legacy.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/references/cache-protocol.md\n    role: primary\n\n> legacy 规范，已被 `triton-knowledge-query` / OKF 检索取代，仅作历史参考。\n\n# 缓存读写协议\n\n> 本文档定义 triton-knowledge-retrieval Skill 的缓存系统规范。  \n> 缓存位于 `knowledge/cache/` 目录，采用扁平化文件结构。\n\n## 一、缓存文件命名\n\n```\n{cache_dir}/{query_type}__{keyword1}_{keyword2}_..._{keywordN}.md\n```\n\n- `query_type`: `codegen_init` | `perf_tuning` | `compile_error` | `precision_debug`\n- `keywords`: 小写，下划线分隔，最多 5 个关键词\n- 双下划线 `__` 分隔 query_type 和 keywords\n\n## 二、缓存文件格式\n\n每个缓存文件包含 YAML frontmatter 和 Markdown 内容两部分。\n\n### 2.1 Frontmatter 必填字段\n\n```yaml\n---\nquery_type: codegen_init\nquery_keywords: [matmul, fp16, m1024, n512, k256]\ncreated: YYYY-MM-DD\nlast_updated: YYYY-MM-DDTHH:MM:SS\nhit_count: <被命中复用的次数>\ncontext_summary: \"<一句话描述此缓存覆盖的检索场景>\"\ntop_units: [<最核心的知识单元ID列表，3-5条>]\nstale: false | partial | true\n---\n```\n\n## 三、命中规则\n\n- 精确匹配：`query_type` 相同且 `query_keywords` 集合完全一致（忽略顺序）\n- 相似匹配：`query_type` 相同且 Jaccard(keywords) ≥ 0.60\n- stale 状态：`false` 正常复用；`partial` 附过期警告；`true` 跳过并完整检索\n\n## 四、stale 处理\n\n- `stale` 字段由定期维护任务统一更新，SKILL 不直接修改\n- `hit_count` 由知识库在命中时更新\n- 相似命中时创建新缓存文件，不修改已有文件\n\n---\n\n*原文档其余内容见 primary source。*\n\n\n", "ops/mla-prolog-v3.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_prolog_v3/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/mla-prolog-v3.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_prolog_v3/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_prolog_v3/)。\n\n# MlaPrologV3 (MLA pre-process)\n\nCANN ops-transformer 中的 `MlaPrologV3` 算子是 **DeepSeek V2/V3 核心创新 MLA（Multi-head Latent Attention）** 的前处理融合算子。对输入 token_x 执行 4 路 matmul（下采样 + 拼接上采样 + 拼接下采样 + 上采样）+ 2 个 RmsNorm + 2 个 RoPE 位置编码 + KVCache/KRCache 更新，输出 query（q^N）、query_rope（q^R_rope）、kv_cache、kr_cache。三架构（arch32 A2/A3 + arch35 950）。\n\n## 1. 输入输出\n\n### 输入（按 `mla_prolog_v3_def.cpp` 与 README L80-116）\n\n| 输入 | 必选/可选 | 含义 | dtype | 格式 |\n|------|-----------|------|-------|------|\n| token_x | 必选 | 输入 token | BF16/INT8/FP8_E4M3FN | ND |\n| weight_dq | 必选 | 下采样 W^{DQ} [He, Hcq] | BF16/INT8/FP8_E4M3FN | **FRACTAL_NZ** |\n| weight_uq_qr | 必选 | [W^{UQ}\\|W^{QR}] 拼接 [Hcq, Hckv+Dr] | BF16/INT8/FP8_E4M3FN | **FRACTAL_NZ** |\n| weight_uk | 必选 | 上采样 W^{UK} [Hckv, N*Hckv] | BF16/FP16 | ND |\n| weight_dkv_kr | 必选 | [W^{DKV}\\|W^{KR}] 拼接 [He, Hckv+Dr] | BF16/INT8/FP8_E4M3FN | **FRACTAL_NZ** |\n| rmsnorm_gamma_cq/ckv | 必选 | RmsNorm γ 参数 | BF16/FP16 | ND |\n| rope_sin/cos | 必选 | RoPE sin/cos 参数 | BF16/FP16 | ND |\n| kv_cache | 输入/输出 | KVCache | FP16/BF16/INT8 | ND |\n| kr_cache | 输入/输出 | KRCache | FP16/BF16/INT8 | ND |\n| cache_index | 必选 | cache 更新索引 [B,S] 或 [T,] | INT64 | ND |\n| 可选 20+ | 可选 | dequant_scale_x/dq/uq_qr/dkv_kr、quant_scale_ckv/ckr、smooth_scales_cq、actual_seq_len、kNopeClipAlpha、qcQrScale、kcScale 等 | 按模式 | ND |\n\n### 输出\n\n| 输出 | 含义 | dtype |\n|------|------|-------|\n| query (q^N) | 上采样后的 query [T,N,Hckv] | FP16/BF16/INT8 |\n| query_rope (q^R_rope) | RoPE 后的 query [T,N,Dr] | FP16/BF16/INT8 |\n| kv_cache（原地更新） | c^{KV}_norm 写入 cache | FP16/BF16/INT8 |\n| kr_cache（原地更新） | k^R_rope 写入 cache | FP16/BF16/INT8 |\n| dequant_scale_q_nope | query 量化参数（可选） | FLOAT |\n| query_norm | c^Q（可选） | INT8/BF16 |\n| dequant_scale_q_norm | query_norm 量化参数（可选） | FLOAT |\n\n### 属性（V3）\n\n`cache_mode`（PA_BSND/PA_NZ）、`qc_qr_scale`（α_q 默认1.0）、`kc_scale`（α_kv 默认1.0）、`query_norm_flag`、`weight_quant_mode`、`kv_cache_quant_mode`、`query_quant_mode`、`ckvkr_repo_mode`、`quant_scale_repo_mode`、`tile_size`（per-tile 128）、`rmsnorm_epsilon_cq/ckv`。\n\n## 2. 核心计算公式\n\n```\nc^Q  = α_q · RmsNorm(x · W^{DQ})                            # ① 下采样 + RmsNorm\nq^N  = c^Q · W^{UQ} · W^{UK}                                # ② 上采样 -> query\nq^R  = ROPE(c^Q · W^{QR})                                   # ③ RoPE -> query_rope\nc^{KV} = α_kv · RmsNorm(x · W^{DKV})                       # ④ 下采样 + RmsNorm -> kv_cache\nk^R  = ROPE(x · W^{KR})                                     # ⑤ RoPE -> kr_cache\n```\n\n利用矩阵乘拼接优化：W^{UQ}+W^{QR} 拼为 [W^{UQ}|W^{QR}]，W^{DKV}+W^{KR} 拼为 [W^{DKV}|W^{KR}]，单次 matmul 后 split。\n\n## 3. 计算流程\n\n### 3.1 四路 matmul + 2 RmsNorm + 2 RoPE（设计介绍 L15-25）\n\n```\nx → MatmulCq (x·W^{DQ}) → c^Q → RmsNormCq → c_norm^Q\n                                            → MatmulQcQr ([W^{UQ}|W^{QR}]) → [q^C|q^R] → split\n                                                                                  q^C → MatmulQn (W^{UK}) → q^N (query)\n                                                                                  q^R → RoPE → q^R_rope (query_rope)\nx → MatmulCkvKr ([W^{DKV}|W^{KR}]) → [c^{KV}|k^R] → split\n                                          c^{KV} → RmsNormCkv → kv_cache\n                                          k^R    → RoPE → kr_cache\n```\n\n### 3.2 CV 流水 6 同步点（设计介绍 L47-68）\n\n不同 matmul 的分核策略不同（Hcq 按 AIC 核数、Hckv 固定 64 块、Hqc 按 AIC 核数），导致 Cube 和 Vector 之间需要 6 个核间同步点（SYNC_MMCQ_NORMSCQ / SYNC_MMCKVKR_NORMROPE / SYNC_MMQCQR_ROPEQR / SYNC_ALL_CUBE / SYNC_ALL_VECTOR 等）。这是 CANN 专有机制，不迁移到 Triton。\n\n### 3.3 TilingKey（26 位二进制，9 字段）\n\n`mla_prolog_v3.cpp` L25-27 的 9 个 uint8_t 模板参数对应 TilingKey（设计介绍 L70-85）：\n\n| 字段 | 位 | 说明 |\n|------|----|------|\n| CACHE_MODE | 0-3 | 0:BNSD / 1:PA_BSND / 2:PA_NZ |\n| SCENARIO | 4-5 | 0:FP16 / 1:非量化 / 2:量化 |\n| QUANT_MODE | 6-9 | 8 种量化组合（非量化/MMQcQr/KVcache pertile/全量/Mxfp8 等） |\n| ENABLE_DEQUANT_OPT | 10 | 反量化使能 |\n| ENABLE_GROUP_COMPUTE_OPT | 11 | 算力分组优化 |\n| EMPTY_TENSOR_MODE | 12-13 | 空 tensor（KV 空/Query 空） |\n| ACTUAL_SEQ_LEN_MODE | 14-15 | actualSeqLen 使能 |\n| SPLIT_M_MODE | 16-17 | 0:切N / 1:切M |\n| CV_MODE | 18-25 | CV 配比（1:1 / 1:2） |\n\n## 4. 架构与产品支持\n\n| 产品 | 架构 | config（def.cpp） | kernel 入口 |\n|------|------|-------------------|-------------|\n| Atlas A2 训练/推理 | arch32（910B） | `ascend910b` L171 | `mla_prolog_v3.cpp`（共享 mla_prolog/） |\n| Atlas A3 训练/推理 | ascend910_93 | `ascend910_93` L172 | 同上 |\n| Ascend 950PR/950DT | arch35 | `ascend950` L315 | 同上（arch35 单独 dtype/layout） |\n\n三架构均支持，无 310P。kernel 实现共享 `mla_prolog/op_kernel/kernel_mla_prolog_split_n.h`（V3 与 V1/V2 共享核心实现）。\n\n## 5. 量化模式\n\n支持 8 种量化模式（QUANT_MODE 0-8，README L147-203）：\n\n| 模式 | token_x | weight_dq/uq_qr/dkv_kr | kv_cache | query 输出 |\n|------|---------|------------------------|----------|-----------|\n| 非量化 | BF16 | BF16 | FP16/BF16 | FP16/BF16 |\n| 部分量化 | BF16 | pertoken INT8 | 非量化/pertensor/pertile | FP16/BF16 |\n| 全量化 | pertoken INT8 | perchannel INT8 | 非量化/pertensor/pertile | pertoken_head INT8 |\n| Mxfp8 | FP8_E4M3FN | FP8_E4M3FN | pertensor | pertoken_head |\n\n## 6. Agent actions\n\n1. 确认目标架构（arch32 / arch35）与量化模式（QUANT_MODE 0-8）。\n2. 4 路 matmul 映射：`tl.dot` × 4（下采样 + 2 个拼接 matmul + 上采样）。\n3. 2 个 RmsNorm：`x * rsqrt(mean(x^2) + eps) * gamma`。\n4. 2 个 RoPE：偶奇拆分 * cos + 翻转 * sin -> 合并。\n5. KVCache/KRCache scatter：`tl.store(cache + cache_index, ...)`。\n6. V3 特有：α_q/α_kv 尺度矫正因子（qcQrScale/kcScale）、query_norm_flag、per-tile 量化（tileSize=128）。\n7. CANN 专有（不迁移）：CV 6 同步点、FRACTAL_NZ 物理格式、TilingKey 26 位 key。\n8. Triton 实现参考 `artifacts/mla-prolog-v3/mla-prolog-v3-triton-skeleton.py`（pseudocode）。\n\n## 7. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。kernel 实现来自共享 `mla_prolog/` 目录（V3 入口仅定义模板参数），核心实现细节需以 `kernel_mla_prolog_split_n.h` 为准。tiling 参数数值、per-tile 量化精度边界、cacheIndex 与 cache 更新关系、Mxfp8 支持需结合源码/硬件进一步验证。Triton skeleton 标记 `reproducibility: pseudocode`，不可直接编译运行。来源见 `ops-transformer-mla-prolog-v3`。\n\n\n", "ops/nsa-compress-with-cache.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/nsa_compress_with_cache/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/nsa-compress-with-cache.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/nsa_compress_with_cache/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/nsa_compress_with_cache/)。\n\n# NsaCompressWithCache（NSA KV 压缩）\n\nCANN ops-transformer 的 `NsaCompressWithCache` 是 **Native-Sparse-Attention 推理阶段 KV 压缩算子**：当某个 batch 的 token 数凑满一个 `compressBlockSize` 窗口时，将该 batch 后 `compressBlockSize` 个 token 用 `weight` 做加权求和压缩成一个 `compress_token`，通过 `slot_mapping` 写回 `output_cache`（README L17-23）。它是 NSA 稀疏注意力流水线的上游步骤，压缩后的 KV 供下游稀疏 attention 使用。\n\n## 1. 输入输出\n\n### 输入（def.cpp L21-51）\n\n| 输入 | 必选/可选 | 含义 | dtype | format |\n|---|---|---|---|---|\n| input | 必选 | 原始的 KV cache | FP16/BF16 | ND |\n| weight | 必选 | 压缩权重 | FP16/BF16 | ND |\n| slot_mapping | 必选 | 每个 batch 压缩结果存储位置索引 | INT32 | ND |\n| output_cache | 必选（输入/输出同 tensor） | 输出的压缩后 cache | FP16/BF16 | ND |\n| act_seq_len | 可选 | 实际序列长度 | INT64 | ND |\n| block_table | 可选 | PageAttention 块表 | INT32 | ND |\n\n### 输出（def.cpp L52-56）\n- `output_cache`（REQUIRED，原地更新）\n\n### 属性（def.cpp L57-61）\n`layout`(\"TND\")、`compress_block_size`(必选)、`compress_stride`(必选)、`act_seq_len_type`(必选)、`page_block_size`(必选)。\n\n### 约束（README L93-105）\n- compressBlockSize/stride 16 倍数，compressBlockSize≤64，compressBlockSize≥stride。\n- headDim 16 倍数，headDim≤256；headNum≤64（>50 时偶数）。\n- pageBlockSize=64 或 128；layout 仅 TND（属性值不生效）。\n- 不支持 input/weight/output_cache 为空。\n\n## 2. 核心公式\n\n```\ncompressIdx = (seqLen - compressBlockSize) / stride\noutputCache[slot_mapping[i]] = Σ(input[compressIdx*stride : compressIdx*stride+compressBlockSize] × weight[:])\n```\n（README L28-29）。weight 与 input 按第三维 broadcast。\n\n## 3. 计算流程\n\n| 阶段 | 操作 | 来源 |\n|---|---|---|\n| 1. InitBase | 读 tiling data，算每核 batch/head 范围，分配 ping-pong buffer | kernel L38-64 |\n| 2. InitActSeqLen | 遍历 batch，检查 `(seqLen-compressBlockSize)%stride==0` | kernel L66-78 |\n| 3. InitWeight | weight 搬入 UB，Cast to FP32 | kernel L80-91 |\n| 4. Compress | 滑动窗口内 token 加权求和 → scatter store | Process |\n\n## 4. tiling 与分核（详见 `artifacts/nsa-compress-with-cache/tiling_dispatch_tables.md`）\n\n- 分核：按 head×batch 切分（`coreStartBatchIdxList`/`coreStartHeadIdxList`）。\n- 核内：`headsNumPerCore`、`tokenNumPerTile`/`tokenRepeatCount`、`bufferNum` ping-pong。\n- 架构：A2/A3（FP16/BF16）+ KirinX90/Kirin9030（仅 FP16）。\n\n## 5. 架构支持（README L7-14；def.cpp L62-67）\n\n| 产品 | 架构 | 支持 | dtype |\n|---|---|---|---|\n| Atlas A2/A3 训练/推理 | Ascend910B1/910_93 | √ | FP16/BF16 |\n| Kirin X90 处理器系列 | KirinX90 | √ | FP16 |\n| Kirin 9030 处理器系列 | Kirin9030 | √ | FP16 |\n\n不支持 950/310P/训练系列。\n\n## 6. Agent actions\n\n1. 识别为 NSA KV 压缩（推理阶段滑动窗口加权求和 + scatter 写回）。\n2. 按 batch 遍历，检查 `(seqLen-compressBlockSize)%stride==0` 触发压缩。\n3. 滑动窗口 offset 计算：`start = compressIdx * stride`，长度 `compressBlockSize`。\n4. weight broadcast 乘后 `tl.sum(axis=0)` 归约。\n5. slot_mapping scatter 写回 output_cache。\n6. PA 场景需通过 block_table 查物理 page 偏移。\n7. `compressBlockSize` 和 `stride` 为 16 倍数，`compressBlockSize≤64`。\n\n## 7. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。tiling 参数数值、weight 初始化方式（`weightInitFlag`）未经硬件实测。Triton skeleton 标记 `reproducibility: pseudocode`。来源见 `ops-transformer-nsa-compress-with-cache`。\n\n\n", "runbooks/memory-sram/exp_mla_paged_attn_001.md": "\n\n## Memory Access Optimization: paged kv cache\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2/910b3，bf16/fp16，BLOCK_N≥64、BLOCK_DNOPE≥64、BLOCK_DROPE≥64，KV cache 已按固定大小块预分配且 block_table 由运行时正确填充；失效边界：KV cache 为连续物理布局（无分页）时块表间接寻址纯属多余开销；BLOCK_DNOPE/BLOCK_DROPE<64 时潜维度切片退化；block_table 未填充或页大小与 kernel 假设不一致时结果错误）\n\n### 原则\n- **paged kv cache**：Implements a paged KV cache mechanism using a block_table to map logical pages to physical memory blocks. This allows efficient handling of variable-length sequences and reduces memory fragmentation by allocating KV cache in fixed-size blocks.\n- **mla decomposition**：Decomposes the attention mechanism into content-based (nope) and positional-based (rope) components. By compressing the Key and Value vectors into a latent dimension (K_NOPE), this drastically reduces the memory bandwidth and storage requirements for the KV cache.\n- **online softmax**：Utilizes an iterative online softmax algorithm within the kernel loop. It maintains running maximums (`history_max`) and normalization sums (`l`) to avoid materializing the full $N \\times N$ attention matrix, which is critical for long-context inference and memory efficiency.\n- **fused gemm pipeline**：Fuses the QK matrix multiplication, softmax calculation, and PV matrix multiplication into a single kernel. This minimizes global memory access by keeping intermediate attention scores and partial accumulators (`acc`) in high-speed SRAM/registers.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\n_paged_mla_fwd_kernel\n```\n\n**坏实践（反例）**：变长序列推理中按最大长度给每条序列连续分配 KV 空间，并把全量注意力分数矩阵物化到 HBM\n```python\nkv_buf = alloc(max_seq_len, head_dim)      # 每序列按上界连续分配，碎片+浪费\nscores = tl.zeros((BLOCK_M, N), dtype=tl.float32)   # 全量分数矩阵\nfor n_blk in range(kv_blocks):\n    scores = q @ k                          # 物化 N×N 分数到 HBM\nprobs = softmax(scores)\n```\n后果：连续大分配导致内存碎片、利用率低；物化全量分数矩阵使 HBM 带宽随上下文长度平方增长。✅ 正解：block_table 将逻辑页映射到固定大小物理块，配合在线 softmax（循环内增量维护 history_max/l）与潜维度压缩（键/值压至 K_NOPE），从不物化全量矩阵，取得 45% 收益。\n\n**已知实例**：attention §raw (`experiences/attention/exp_mla_paged_attn_001.yaml`)\n- 声称性能收益：45%\n- 备注：该类潜空间压缩注意力中，Value（inputC）张量与 Key 内容（K_NOPE）共享同一 buffer。该 kernel 假设 KV cache 已按块预分配、block_table 由运行时正确填充。\n\n\n", "runbooks/memory-sram/exp_paged_gqa_001.md": "\n\n## Memory Access Optimization: paged kv cache with gqa head tiling\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2/910b3/91093/91095，fp16/bf16，q_heads_per_kv_head≥1、BLOCK_DMODEL≥64、BLOCK_N≥1；失效边界：q_heads_per_kv_head=1（无头分组）时 BLOCK_H 复用无收益；BLOCK_H 过大使多块查询头中间量超出 UB 容量时需减小；KV cache 连续物理布局时分页间接寻址多余）\n\n### 原则\n- **paged kv cache**：Utilizes a block_table to map logical sequence pages to non-contiguous physical memory blocks. This decouples sequence length from physical memory layout, enabling efficient memory management for variable-length sequences and reducing fragmentation during 分页注意力推理.\n- **online softmax**：Implements the online softmax algorithm by tracking history_max and the normalization factor l incrementally. This avoids materializing the full N x N attention matrix in global memory or high-bandwidth memory, significantly reducing memory bandwidth consumption.\n- **gqa head tiling**：Processes multiple query heads (defined by BLOCK_H) that share the same KV head in a single kernel launch. This optimization amortizes the cost of loading inputB and inputC tiles across multiple query heads, increasing data reuse and arithmetic intensity.\n- **latency hiding**：Schedules the load of the Value (inputC) tensor immediately after the Key (inputB) load and before the softmax reduction logic. This overlaps memory access latency with the compute-bound operations of the QK dot product and scaling.\n- **accumulator precision**：Maintains intermediate states (acc, l, history_max) in float32 to ensure numerical stability during the exponentiation steps of the softmax, while inputs and outputs can remain in lower precision (fp16/bf16).\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/176-_paged_gqa_fwd_kernel.py\n```\n\n**坏实践（反例）**：共享同一 KV 头的多个查询头逐个单独加载 K/V tile\n```python\nfor h in range(BLOCK_H):                      # 逐查询头串行处理\n    k = tl.load(k_ptr + kv_head_off, ...)     # 每头重复加载同一 K tile\n    v = tl.load(v_ptr + kv_head_off, ...)     # 每头重复加载同一 V tile\n    acc_h = softmax(q_h @ k) @ v\n```\n后果：同一 KV tile 被加载 BLOCK_H 次，KV 读带宽放大为 q_heads_per_kv_head 倍，35% 收益流失。✅ 正解：单 kernel 内一次处理共享同一 KV 头的 BLOCK_H 个查询头，KV tile 加载成本摊薄到头组；Value（inputC）load 紧随 Key（inputB）load 调度，与 QK 点积计算重叠掩盖访存延迟。\n\n**已知实例**：attention §raw (`experiences/attention/exp_paged_gqa_001.yaml`)\n- 声称性能收益：35%\n- 备注：该 kernel 专为大 batch、序列长度各异的解码阶段设计。BLOCK_DPE 参数表明 kernel 加载逻辑内嵌旋转位置编码（rope）分量支持。\n\n\n"}};
const KC={api:'#1f77b4',example:'#2e9e6b',header:'#7e57c2',guide:'#ff7f0e',index:'#cbd5e1',root:'#334155',other:'#94a3b8',operator:'#e6194b',glossary:'#0f766e',operator_optimization:'#3cb371',implementation_trap:'#f032e6',debugging_journey:'#c026d3',cross_skill_gap:'#a21caf',field_note:'#f032e6',runbook:'#3cb371'};
const EC={exemplifies:'#2e9e6b',explains:'#ff7f0e',declares:'#7e57c2',demonstrates:'#0891b2',same_topic:'#1f77b4',related:'#94a3b8',part_of:'#e2e8f0',mentions:'#f1d6c0'};
const ETZH={exemplifies:'实现示例',explains:'开发指南',declares:'声明',demonstrates:'配套',same_topic:'同主题',related:'相关',part_of:'层级',mentions:'提及'};
const nodeById={};G.nodes.forEach(n=>nodeById[n.id]=n);
const back={};G.edges.forEach(e=>{(back[e.target]=back[e.target]||[]).push(e);});
document.getElementById('meta').textContent=`· ${G.meta.card_count} concept / ${G.nodes.length} 节点 / ${G.edges.length} 边`;
const sz=n=>10+Math.min(28,(n.degree||0)*2);
const els=[];
for(const n of G.nodes)els.push({data:{id:n.id,label:n.title,kind:n.kind,bundle:n.bundle,ext:!!n.external,sz:sz(n)}});
for(const e of G.edges)els.push({data:{id:e.source+'|'+e.target,source:e.source,target:e.target,type:e.type,e:e}});
const cy=cytoscape({container:document.getElementById('cy'),elements:els,wheelSensitivity:0.2,
 style:[
  {selector:'node',style:{'background-color':n=>KC[n.data('kind')]||'#94a3b8','width':'data(sz)','height':'data(sz)','label':'data(label)','font-size':6,'color':'#334155','text-opacity':0,'text-valign':'bottom','text-margin-y':2,'text-wrap':'ellipsis','text-max-width':90,'border-width':n=>n.data('ext')?2:0,'border-color':'#94a3b8','border-style':'dashed'}},
  {selector:'node[?ext]',style:{'background-opacity':0.45}},
  {selector:'node:selected',style:{'border-width':3,'border-color':'#f59e0b','border-style':'solid','text-opacity':1,'font-size':9}},
  {selector:'.nbr',style:{'text-opacity':1,'font-size':8}},
  {selector:'edge',style:{'width':e=>e.data('e').cross?2:1,'line-color':e=>EC[e.data('type')]||'#ccc','line-style':e=>e.data('e').cross?'dashed':'solid','curve-style':'haystack','opacity':0.55,'target-arrow-shape':e=>e.data('e').symmetric?'none':'triangle','target-arrow-color':e=>EC[e.data('type')]||'#ccc','arrow-scale':0.6}},
  {selector:'edge:selected',style:{'opacity':1,'width':3}},
  {selector:'.dim',style:{'opacity':0.06,'text-opacity':0}}
 ],
 layout:{name:'cose',animate:false,nodeRepulsion:9000,idealEdgeLength:55,padding:30}});

function resolveLink(fromId,href){let base=fromId.split('/').slice(0,-1);for(const p of href.split('/')){if(p==='..')base.pop();else if(p!=='.')base.push(p);}let id=base.join('/');return nodeById[id]?id:null;}
function showDetail(id){const n=nodeById[id];if(!n)return;cy.$(':selected').unselect();const node=cy.getElementById(id);node.select();cy.elements().removeClass('nbr');node.connectedNodes().addClass('nbr');cy.animate({center:{eles:node},duration:200});
 let h=`<span class="chip" style="background:${KC[n.kind]}">${n.kind}</span> ${n.external?'<span class="chip" style="background:#94a3b8">外部</span>':''}<h2>${esc(n.title)}</h2><div class="id">${n.id}</div>`;
 if(n.description)h+=`<p>${esc(n.description)}</p>`;
 if(n.resource)h+=`<p><a class="ext" href="${n.resource}" target="_blank" rel="noopener">上游 resource ↗</a></p>`;
 if(n.tags&&n.tags.length)h+=`<div>${n.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`;
 const inc=cy.getElementById(id).connectedEdges().map(x=>x.data('e'));
 const groups={};inc.forEach(e=>{if(e.type==='part_of')return;const me=id;const other=e.source===me?e.target:e.source;const lab=persp(e,me);(groups[lab]=groups[lab]||[]).push([other,e]);});
 const order=['实现示例','对应接口','开发指南','讲解接口','声明头文件','声明的接口','配套样例','对应指南','同主题','相关','提及'];
 Object.keys(groups).sort((a,b)=>order.indexOf(a)-order.indexOf(b)).forEach(lab=>{h+=`<div class="grp">${lab} (${groups[lab].length})</div>`;groups[lab].forEach(([o,e])=>{const t=nodeById[o];h+=`<a class="nb" onclick="showDetail('${o}')">${esc(t?t.title:o)} <span class="w">· ${ETZH[e.type]||e.type} ${e.weight.toFixed(1)}</span></a>`;});});
 const bl=(back[id]||[]).filter(e=>e.type!=='part_of'&&!e.symmetric);
 if(bl.length){h+=`<div class="grp">被引用 / 指向本卡 (${bl.length})</div>`;bl.forEach(e=>{const t=nodeById[e.source];h+=`<a class="nb" onclick="showDetail('${e.source}')">${esc(t?t.title:e.source)} <span class="w">· ${ETZH[e.type]||e.type}</span></a>`;});}
 const body=(G.bodies||{})[id];if(body){h+=`<div id="body">${marked.parse(body,{gfm:true,breaks:false})}</div>`;}
 const d=document.getElementById('detail');d.innerHTML=h;d.scrollTop=0;
 d.querySelectorAll('#body a[href]').forEach(a=>{const href=a.getAttribute('href');if(href&&href.endsWith('.md')&&!href.includes('://')){const tid=resolveLink(id,href);if(tid){a.className='int';a.removeAttribute('href');a.onclick=()=>showDetail(tid);return;}}a.className='ext';a.target='_blank';a.rel='noopener';});}
function kg(k){if(['implementation_trap','debugging_journey','cross_skill_gap','field_note'].includes(k))return'field_note';if(['operator_optimization','runbook'].includes(k))return'runbook';return k;}
function persp(e,me){const k=kg(nodeById[me].kind);if(e.type==='exemplifies'){if(k==='api'||k==='guide')return'实现示例';if(k==='operator'||k==='field_note')return'实践案例';return'对应接口';}if(e.type==='explains'){if(k==='api')return'开发指南';if(k==='operator'||k==='field_note'||k==='runbook')return'开发指南';return'讲解接口';}if(e.type==='declares')return k==='api'?'声明头文件':'声明的接口';if(e.type==='demonstrates')return k==='guide'?'配套样例':'对应指南';if(e.type==='same_topic')return'同主题';if(e.type==='related')return'相关';if(e.type==='mentions')return'提及';return'相关';}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
cy.on('tap','node',ev=>showDetail(ev.target.id()));
cy.on('tap','edge',ev=>{const e=ev.target.data('e');document.getElementById('detail').innerHTML=`<div class="grp">边</div><p><b>${ETZH[e.type]||e.type}</b> ${e.symmetric?'(对称)':''}<br><span class="id">${e.source}<br>${e.symmetric?'—':'→'} ${e.target}</span></p><p>via: ${e.via.join(', ')}<br>why: ${esc(e.why)}<br>weight: ${e.weight}</p>`;});
cy.on('tap',ev=>{if(ev.target===cy){cy.elements().removeClass('nbr');cy.$(':selected').unselect();}});
document.getElementById('layout').onchange=e=>cy.layout({name:e.target.value,animate:false,padding:30}).run();
document.getElementById('reset').onclick=()=>{cy.fit(null,30);document.getElementById('q').value='';cy.elements().removeClass('dim');};
document.getElementById('q').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(!q){cy.elements().removeClass('dim');return;}cy.nodes().forEach(n=>{const d=n.data();const hay=(d.label+' '+d.id+' '+d.bundle).toLowerCase();n.toggleClass('dim',!hay.includes(q));});cy.edges().forEach(e=>e.toggleClass('dim',e.source().hasClass('dim')||e.target().hasClass('dim')));};
function mkfilter(host,title,keys,active,attr){let h=`<b>${title}</b>`;keys.forEach(k=>h+=`<label><input type=checkbox ${active(k)?'checked':''} data-f="${attr}" data-v="${k}">${k}</label>`);document.getElementById(host).innerHTML=h;}
mkfilter('bundleF','bundle:',G.meta.bundles,()=>true,'bundle');
mkfilter('kindF','kind:',['api','example','header','guide','glossary','index','other','operator','operator_optimization','implementation_trap','debugging_journey','cross_skill_gap'],()=>true,'kind');
mkfilter('typeF','边:',Object.keys(EC),k=>k!=='mentions'&&k!=='part_of','type');
document.getElementById('legend').innerHTML=Object.keys(EC).map(t=>`<span><b style="background:${EC[t]}"></b>${ETZH[t]}</span>`).join('');
function applyFilters(){const on=a=>new Set([...document.querySelectorAll(`input[data-f="${a}"]:checked`)].map(x=>x.dataset.v));
 const kb=on('bundle'),kk=on('kind'),kt=on('type');
 cy.nodes().forEach(n=>{const d=n.data();n.style('display',(kb.has(d.bundle)||!d.bundle)&&kk.has(d.kind)?'element':'none');});
 cy.edges().forEach(e=>{const vis=kt.has(e.data('type'))&&e.source().style('display')==='element'&&e.target().style('display')==='element';e.style('display',vis?'element':'none');});}
document.querySelectorAll('.filters input').forEach(cb=>cb.onchange=applyFilters);applyFilters();
const first=G.nodes.find(n=>n.kind==='api'&&!n.external)||G.nodes.find(n=>!n.external)||G.nodes[0];if(first)showDetail(first.id);
</script></body></html>

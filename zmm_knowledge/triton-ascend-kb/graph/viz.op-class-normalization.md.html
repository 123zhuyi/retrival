ds × head_dim 独立分块 | 3D tiling `(BLOCK_N, BLOCK_H, BLOCK_D)` |\n\n## 选择指南\n\n| 场景 | 推荐经验 |\n|------|---------|\n| 通用 RoPE，910b2/b3 | `exp_rope_npu_001`（最高 35% 提升） |\n| 变长序列（varlen batch） | `exp_rope_backward_001`（IS_VARLEN 支持）|\n| Llama-3 Partial RoPE | `exp_partial_rope_001` |\n| Qwen2-VL Multi-RoPE | `exp_qwen2vl_mrope_001` |\n| 需同时支持前/反向 | `exp_rope_npu_001`（`BACKWARD_PASS` constexpr 参数） |\n| Llama-4 NPU | `exp_rope_llama4_npu_001`（interleaved complex layout） |\n\n## 常见陷阱\n\n| 陷阱 | 解决方案 |\n|------|----------|\n| cos/sin 在 head 循环内重复加载 | 提到循环外加载，所有 head 共享（exp_rope_001） |\n| rope_dim 与 head_dim 混淆导致越界 | `ALIGNED` constexpr 路径分别处理，加载时用 `mask=offs < rope_dim` |\n| int64 token 索引 | 转为 int32 × stride（fp32 偏移），避免 scalar fallback |\n| 交错布局误用分块加载 | 用 `IS_NEOX_STYLE` constexpr 编译时选择路径，禁止运行时 if |\n| KV cache 偏移未考虑 | `HAS_KV_LENS` 专用路径，用 kv_len 计算 cos/sin 查表偏移 |\n\n## 相关页面\n\n- [ops/elementwise.md](op-class-elementwise.md) — RoPE 本质是 elementwise，激活函数反向传播模式可参考\n- [ops/attention.md](op-class-attention.md) — RoPE 通常在 QKV 投影后、Attention 前执行；Fusion-2 模式\n- [ops/fused_ops.md](op-class-fused_ops.md) — GEMM + RMSNorm + RoPE 三合一融合（Fusion-2）\n- techniques/ilp.md — cos/sin 加载的 for-loop tiling + software pipeline\n- techniques/data_types.md — int64 索引退化问题\n\n## 被以下页面引用\n\n- [ops/attention.md](op-class-attention.md) — Attention 前的 QK RoPE 编码步骤\n- [ops/fused_ops.md](op-class-fused_ops.md) — Fusion-2 Linear+RMSNorm+RoPE\n- experience_index.md — RoPE 区全量经验 ID\n\n## 已知实例（P3 挂载）\n\n### Extracted Kernel 反链\n- `035-rotary_emb_compute.py` — extracted kernel（source: `raw_experiences/extracted_kernels/035-rotary_emb_compute.py`）\n- `036-apply_rotary_pos_emb_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/036-apply_rotary_pos_emb_kernel.py`）\n- `037-partial_rotary_emb_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/037-partial_rotary_emb_kernel.py`）\n- `038-partial_rope_qk_compute.py` — extracted kernel（source: `raw_experiences/extracted_kernels/038-partial_rope_qk_compute.py`）\n- `039-partial_rope_qk_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/039-partial_rope_qk_kernel.py`）\n- `043-rotary_pos_emb_qr_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/043-rotary_pos_emb_qr_kernel.py`）\n- `059-apply_rotary_pos_emb_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/059-apply_rotary_pos_emb_kernel.py`）\n- `063-_compute_rotary_emb.py` — extracted kernel（source: `raw_experiences/extracted_kernels/063-_compute_rotary_emb.py`）\n- `065-fused_single_norm_and_partial_rope_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/065-fused_single_norm_and_partial_rope_kernel.py`）\n- `098-_triton_llama4_rope_npu.py` — extracted kernel（source: `raw_experiences/extracted_kernels/098-_triton_llama4_rope_npu.py`）\n- `099-_triton_qwen2vl_mrope_npu.py` — extracted kernel（source: `raw_experiences/extracted_kernels/099-_triton_qwen2vl_mrope_npu.py`）\n- `104-_triton_rope_npu.py` — extracted kernel（source: `raw_experiences/extracted_kernels/104-_triton_rope_npu.py`）\n- `116-rotary_embedding_rw_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/116-rotary_embedding_rw_kernel.py`）\n- `117-rotary_embedding_siso_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/117-rotary_embedding_siso_kernel.py`）\n- `172-_triton_rope.py` — extracted kernel（source: `raw_experiences/extracted_kernels/172-_triton_rope.py`）\n- `192-fused_rope_qk_mqa_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/192-fused_rope_qk_mqa_kernel.py`）\n- `227-_compute_rope.py` — extracted kernel（source: `raw_experiences/extracted_kernels/227-_compute_rope.py`）\n- `228-_compute_rope_separated.py` — extracted kernel（source: `raw_experiences/extracted_kernels/228-_compute_rope_separated.py`）\n- `229-_rope_forward_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/229-_rope_forward_kernel.py`）\n- `230-_rope_backward_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/230-_rope_backward_kernel.py`）\n\n\n", "op-class-softmax.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/ops/softmax.md\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/ops/softmax.md` 迁移而来，原始为算子类别设计页，未做内容改写，仅转 OKF frontmatter。\n\n# Softmax / LogSoftmax 算子优化\n\n## 概述\n\nSoftmax 将实值向量归一化为概率分布：`softmax(x)_i = exp(x_i) / Σ exp(x_j)`。  \nLogSoftmax 输出对数概率：`log_softmax(x)_i = x_i - log(Σ exp(x_j))`，数值更稳定。\n\n在 Triton-Ascend 中，Softmax 的核心挑战是：\n1. **两趟访存开销**：标准实现需两次遍历（先求 max，再求 exp+sum）\n2. **数值溢出**：fp16/bf16 下 `exp(x)` 容易溢出，需减去最大值稳定化\n3. **归约通信**：跨 tile 归约需要同步，影响并行度\n\n## 检测标准\n\n满足以下条件时归类为 Softmax：\n- PyTorch 原语：`F.softmax(x, dim=...)` 或 `F.log_softmax(x, dim=...)`\n- 归约沿指定维度（inner dim 或 outer dim），输出形状与输入相同\n- 不含跨 batch 归约（跨 batch 属于 Reduction）\n\n## 适用条件\n\n| 条件 | 说明 |\n|------|------|\n| 数据类型 | fp16、bf16、fp32；fp8 需特殊 UB 分片处理 |\n| inner dim N | N≥64 时向量化收益显著；N 超过 UB 容量需分块 |\n| outer dim M | M≥1，通常每个 program 处理一行 |\n\n## 经验路由\n\n| 场景 | 经验ID | 提升% | 关键技术 | 经验文件 |\n|------|--------|-------|----------|----------|\n| 标准 Softmax（inner dim） | exp_softmax_inner_002 | 30% | 在线 max+sum 单趟，数值稳定 | yaml |\n| 非 inner dim Softmax | exp_softmax_non_inner_001 | 25% | 外层维度归约，转置后处理 | yaml |\n| Online Softmax（Attention 内融合） | exp_softmax_online_001 | 50% | 运行 m_i/l_i 迭代更新，消除完整 NxN 矩阵 | yaml |\n| LogSoftmax 前向 | exp_log_softmax_001 | 30% | 两趟：max+sum → log-sum-exp 单核 | yaml |\n| LogSoftmax 反向 | exp_log_softmax_backward_001 | 25% | 反向梯度：`dy - softmax(x) * sum(dy)` | yaml |\n| Softmax 反向（inner） | exp_softmax_backward_001 | 25% | 反向：`p * (dy - dot(p, dy))` | yaml |\n| Softmax 反向（非 inner） | exp_softmax_backward_non_inner_001 | 20% | 非内层维度反向，二维 tile 处理 | yaml |\n\n## 关键技术\n\n### Online Softmax 算法（单趟）\n\n核心思想：维护运行最大值 `m_i` 和运行指数和 `l_i`，一次遍历完成 max+sum：\n\n```\nm_new = max(m_old, x_tile_max)\nl_new = l_old * exp(m_old - m_new) + sum(exp(x_tile - m_new))\n```\n\n最终输出：`softmax(x)_i = exp(x_i - m_final) / l_final`\n\n```python\n@triton.jit\ndef softmax_online_kernel(x_ptr, y_ptr, n_rows, n_cols, BLOCK_N: tl.constexpr):\n    row = tl.program_id(0)\n    x_row = x_ptr + row * n_cols\n\n    # 在线算法：单趟计算 max 和 sum\n    m = tl.full([1], float('-inf'), dtype=tl.float32)\n    l = tl.zeros([1], dtype=tl.float32)\n    for col in range(0, n_cols, BLOCK_N):\n        cols = col + tl.arange(0, BLOCK_N)\n        mask = cols < n_cols\n        x = tl.load(x_row + cols, mask=mask, other=float('-inf')).to(tl.float32)\n        m_new = tl.maximum(m, tl.max(x))\n        l = l * tl.exp(m - m_new) + tl.sum(tl.exp(x - m_new))\n        m = m_new\n\n    # 第二趟：写出归一化结果\n    for col in range(0, n_cols, BLOCK_N):\n        cols = col + tl.arange(0, BLOCK_N)\n        mask = cols < n_cols\n        x = tl.load(x_row + cols, mask=mask, other=0.0).to(tl.float32)\n        y = tl.exp(x - m) / l\n        tl.store(y_ptr + row * n_cols + cols, y.to(tl.float16), mask=mask)\n```\n\n### 数值稳定化\n\nfp16/bf16 下 `exp(x)` 在 x > 65504 时溢出。**必须**在 exp 前减去行内最大值：\n\n```python\nx_stable = x - tl.max(x, axis=0)  # 防止 exp 溢出\np = tl.exp(x_stable)\np = p / tl.sum(p)\n```\n\n参考：exp_stability_001\n\n### UB 容量限制（N 大于 192KB 时分块）\n\n910b2/910b3 UB 约 192KB。fp16 时单行最大元素数：`192*1024/2 = 98304`。  \n超出时使用分块两趟算法（exp_softmax_non_inner_001 / exp_log_softmax_001 的策略）。\n\n## 常见陷阱\n\n| 陷阱 | 说明 | 解决方案 |\n|------|------|----------|\n| fp16 exp 溢出 | x 不减 max 直接 exp，输出 Inf | 先减行内最大值（数值稳定化） |\n| outer dim 效率低 | 非 inner dim 归约需要 gather-like 访问 | 转置后处理内层，或使用 non_inner 变体 |\n| 两趟访存带宽瓶颈 | 独立读两次 HBM | 使用 Online Softmax 合并为单趟 |\n| Attention 中单独 Softmax | 多余 HBM 写回 | 将 Softmax 融入 Attention 内核（Flash Attention） |\n\n## 相关页面\n\n- [ops/attention.md](op-class-attention.md) — Flash Attention 内嵌 Online Softmax，是最重要的 Softmax 融合场景\n- [ops/reduction.md](op-class-reduction.md) — Reduction 原语与 Softmax 共享归约逻辑\n- [ops/loss.md](op-class-loss.md) — CrossEntropy/LogSoftmax 常与 Loss 计算融合\n- techniques/online_algorithms.md — Online Softmax 算法详解\n- techniques/numerical_stability.md — 数值稳定性指南\n\n## 已知实例（P3 挂载）\n\n### Extracted Kernel 反链\n- `126-softmax_kernel_non_inner.py` — extracted kernel（source: `raw_experiences/extracted_kernels/126-softmax_kernel_non_inner.py`）\n- `127-softmax_kernel_inner.py` — extracted kernel（source: `raw_experiences/extracted_kernels/127-softmax_kernel_inner.py`）\n- `128-softmax_backward_kernel_non_inner.py` — extracted kernel（source: `raw_experiences/extracted_kernels/128-softmax_backward_kernel_non_inner.py`）\n- `129-softmax_backward_kernel_inner.py` — extracted kernel（source: `raw_experiences/extracted_kernels/129-softmax_backward_kernel_inner.py`）\n- `144-log_softmax_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/144-log_softmax_kernel.py`）\n- `145-log_softmax_backward_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/145-log_softmax_backward_kernel.py`）\n- `054-vec_a.py` — extracted kernel（source: `raw_experiences/extracted_kernels/054-vec_a.py`）\n\n\n", "op-class-solve_tril.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/ops/solve_tril.md\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/ops/solve_tril.md` 迁移而来，原始为算子类别设计页，未做内容改写，仅转 OKF frontmatter。\n\n# solve_tril 算子优化（三角矩阵求逆）\n\n## 概述\n\n`solve_tril` 算子计算 **(I + A) 的逆矩阵**，其中 A 是严格下三角矩阵。用于 Flash Linear Attention（FLA）中分块求解注意力矩阵的关键组件。\n\n数学原理：对于严格下三角矩阵 A（BT × BT），`(I + A)^(-1)` 可通过有限项 Neumann 级数或分块前向代入法精确计算。实际 kernel 使用**分层分块递推**：以 16×16 为原子计算单元，通过逐层 merge 支持 BT=32 和 BT=64。\n\n特点：\n- **严格下三角结构**：A 对角线及以上全为零，可利用此结构消除冗余计算和 mask\n- **固定块大小**：BT ∈ {16, 32, 64}，16×16 为 NPU 矩阵乘法最优粒度\n- **分块递推**：标量递推（16×16）→ 块递推（32×32、64×64），数学结构统一\n- **完全并行**：所有 chunk 内的所有 (batch, head) 对独立，grid = (NT, B×H)\n\n## 经验路由\n\n| 场景 | 经验ID | 关键技术 | 经验文件 |\n|------|--------|----------|----------|\n| 冗余结构 mask 消除 | exp_solve_tril_001 | 利用矩阵结构零元删除 `tl.where`，1.33x-1.87x | yaml |\n| Preload + extract_slice 消除 HBM 重读 | exp_solve_tril_002 | 寄存器块预加载后用 extract_slice 替代 HBM load | yaml |\n| Constexpr 双路径循环展开 | exp_solve_tril_003 | 完整 tile constexpr 展开 + 边界 tile 运行时循环 | yaml |\n| 三层分级 kernel 调度 | exp_solve_tril_004 | BT=16/32/64 分治架构，16×16 原子单元 | yaml |\n| CANN 兼容性参数审计 | exp_solve_tril_005 | 删除不兼容参数（num_stages/sync_solver 等） | yaml |\n| 无效优化排除分析 | exp_solve_tril_006 | tl.dot vs tl.sum 广播乘决策；寄存器压力权衡 | yaml |\n\n## 关键技术\n\n### 分层分块递推架构\n\n以 16×16 为原子单元，BT=16 直接逐行递推，BT=32/64 通过分块公式逐层 merge：\n\n```\nBT=16:  基础递推（逐行）\nBT=32:  4 块分治 → 对角块递推 + 1 次 merge: X₂₁ = -X₂₂·A₂₁·X₁₁\nBT=64:  16 块分治 → 对角块递推 + 3 层 merge（紧邻→隔行→最远），共 7 次 tl.dot\n```\n\n分块递推公式与标量递推在数学结构上完全一致：\n\n```\n标量: X[i,j] = -A[i,j] - Σ_{k=j+1}^{i-1} A[i,k]·X[k,j]\n分块: X[i,j] = -X[i,i] · Σ_{k=j}^{i-1} A[i,k]·X[k,j]\n```\n\n参考：exp_solve_tril_004\n\n### 冗余结构 mask 消除（V1 优化）\n\n当矩阵具有已知结构零元时，对已为零元素施加的 `tl.where(mask, val, 0.)` 是冗余 ALU 指令。对于严格下三角矩阵 A，`tl.where(o_i < i, b_a, 0.)` 是恒等变换——j≥i 位置本身就是 0：\n\n```python\n# 反模式：冗余 mask（A[i,j≥i] 本身就是 0）\nb_a = -tl.load(A + offset)\nb_a = tl.where(o_i < i, b_a, 0.)  # ← 冗余！删除后可省 14 次 where/循环\n\n# 优化后：依赖矩阵结构保证零值\nb_a = -tl.load(A + offset)\n# b_a[j≥i] 由矩阵数学性质保证为零\n```\n\n**通用性**：适用于所有处理已知结构零元矩阵的 kernel（三角矩阵、对角矩阵、带状矩阵、mask 矩阵）。\n\n参考：exp_solve_tril_001\n\n### Preload + extract_slice 消除 HBM 重读（V4 优化）\n\n循环外通过 `tl.load(make_block_ptr(...))` 已将整个块加载到寄存器，循环内不应再用 `tl.load(A + offset)` 逐行重新从 HBM 读取。虽然 Triton 不支持 `b_A[i, :]` 动态寄存器索引，但 `tl.extract_slice` 可从寄存器提取：\n\n```python\n# 循环外：预加载到寄存器\nneg_A = -b_A  # b_A = tl.load(make_block_ptr(A, ...))\n\n# 循环内：从寄存器提取，零 HBM 访问\nfor i in range(2, BT):\n    b_a = tl.extract_slice(neg_A, (i, 0), (1, 16), (1, 1))\n    b_a = tl.reshape(b_a, (16,))\n    b_a = b_a + tl.sum(b_a[:, None] * b_A, 0)\n    b_A = tl.where((o_i == i)[:, None], b_a, b_A)\n```\n\n**通用性**：适用于所有在循环内重复读取已在寄存器中数据的 kernel（如三角矩阵操作、递推关系、逐行/逐列处理）。\n\n参考：exp_solve_tril_002\n\n### Constexpr 双路径（完整 tile vs 边界 tile）\n\n当绝大多数 chunk 是完整 tile（99%），仅最后一个可能是边界 chunk 时，用 `if T - offset >= BT` 分支：\n\n- **快速路径**：`range(2, BT)` constexpr → 循环完全展开 + extract_slice offset 静态优化为零开销\n- **慢速路径**：`range(2, min(16, remaining))` 运行时循环 → 仍从寄存器读取\n\n```python\nneg_A = -b_A  # 预加载\n\nif T - i_t * 16 >= BT:\n    # 快速路径：99% chunk，constexpr 展开\n    for i in range(2, BT):\n        b_a = tl.extract_slice(neg_A, (i, 0), (1, 16), (1, 1))\n        ...\nelse:\n    # 慢速路径：边界 chunk，运行时循环 → 仍从寄存器读\n    for i in range(2, min(16, T - i_t * 16)):\n        b_a = tl.extract_slice(neg_A, (i, 0), (1, 16), (1, 1))\n        ...\n```\n\n**被排除的方案**：统一运行时循环（V3）→ 失去 constexpr 展开，性能回退；慢速路径保留 tl.load → 不如 extract_slice 统一简洁。\n\n参考：exp_solve_tril_003\n\n### tl.dot vs tl.sum 广播乘决策\n\n对微小矩阵乘法（M=1, K≤16, N=16），`tl.dot`（CUBE 单元）比 `tl.sum(b_a[:, None] * b_A, axis=0)`（VEC 单元广播乘+归约）慢 14-20x。CUBE 单元的调度和启动开销在微小尺寸下远大于 VEC 直接计算：\n\n```python\n# 反模式（14-20x 退化）：微小矩阵强行用 tl.dot\nb_a_2d = tl.reshape(b_a, (1, 16))\nb_a = tl.dot(b_a_2d, b_A)  # CUBE 调度 >> 计算量\n\n# 正模式：VEC 广播乘 + 归约\nb_a = b_a + tl.sum(b_a[:, None] * b_A, 0)  # 1×16 × 16×16\n```\n\n**决策原则**：M=1 或 N=1 或 K≤16 时优先用 VEC 广播乘 + sum 归约。\n\n参考：exp_solve_tril_006\n\n### CANN 兼容性参数审计\n\n从外部仓库（fla、vllm 等）迁移 kernel 时必须逐项审计编译参数。以下参数在 CANN 8.5.0 上不兼容：\n\n| 参数 | 问题 | 处理 |\n|------|------|------|\n| `limit_auto_multi_buffer_of_local_buffer=\"no-limit\"` | CANN 8.5.0 未实现 | 删除 |\n| `sync_solver=True` | CANN 8.5.0 不支持 | 删除 |\n| `num_stages=2`（tl.range） | 依赖 USE_TMA，Ascend 不可用 | 删除 |\n\n参考：exp_solve_tril_005\n\n## 优化效果汇总\n\n| 版本 | 优化内容 | BT=16 加速比 | BT=32 加速比 | BT=64 加速比 |\n|------|---------|------------|------------|------------|\n| Original | 原始代码（fla 仓库） | 1.00x | 1.00x | 1.00x |\n| V1 | 删除冗余 `tl.where` | 1.33x-1.87x | 1.00x | ~1.40x |\n| V4 | Preload + extract_slice（累计） | 1.01x-1.37x (叠加) | 1.25x-1.27x | 1.11x-1.13x (叠加) |\n| **累计** | **Original → V4** | **1.42x-2.54x** | **1.26x-1.29x** | **1.55x-1.57x** |\n\n所有优化零精度损失（max_err < 1e-6），未改变算子接口。\n\n## 适用条件\n\n| 参数 | 推荐范围/说明 |\n|------|-------------|\n| BT（块大小） | 16、32、64（算子语义决定，不可变） |\n| B（batch） | ≥1，大 B 场景 grid 并行度更充分 |\n| H（head 数） | ≥1 |\n| T（序列长度） | BT 的倍数时 100% chunk 走快速 constexpr 展开路径 |\n| fp32 中间精度 | 强制要求（递推累积误差敏感性高） |\n| 输入连续性 | 输入必须 `.contiguous()`，block_ptr 依赖 stride |\n\n## 相关页面\n\n- [ops/ssm.md](op-class-ssm.md) — solve_tril 是 Flash Linear Attention 的关键组件\n- techniques/compute_and_branch.md — 冗余结构 mask 消除；constexpr 双路径展开；tl.dot vs VEC 广播乘决策\n- techniques/memory_access_optimization.md — Preload + extract_slice 消除 HBM 重读\n- techniques/tiling.md — 16×16 原子 tile + 分块递推的层次化 tiling\n- techniques/parallelism_and_loop.md — 2D grid `(NT, B×H)` 完全并行\n- techniques/ilp.md — constexpr 循环展开 vs 运行时循环的性能差异\n- techniques/operator_fusion.md — merge kernel 中括号内累加 + tl.dot 的融合模式\n\n## 已知实例（P3 挂载）\n\n### Extracted Kernel 反链\n- `153-solve_tril_16x16_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/153-solve_tril_16x16_kernel.py`）\n- `154-merge_16x16_to_32x32_inverse_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/154-merge_16x16_to_32x32_inverse_kernel.py`）\n- `155-merge_16x16_to_64x64_inverse_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/155-merge_16x16_to_64x64_inverse_kernel.py`）\n- `182-solve_tril_16x16_kernel_paral.py` — extracted kernel（source: `raw_experiences/extracted_kernels/182-solve_tril_16x16_kernel_paral.py`）\n- `183-solve_tril_16x16_kernel_paral_v3.py` — extracted kernel（source: `raw_experiences/extracted_kernels/183-solve_tril_16x16_kernel_paral_v3.py`）\n- `184-merge_16x16_to_32x32_inverse_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/184-merge_16x16_to_32x32_inverse_kernel.py`）\n- `185-merge_16x16_to_64x64_inverse_kernel_reorder_all_masked.py` — extracted kernel（source: `raw_experiences/extracted_kernels/185-merge_16x16_to_64x64_inverse_kernel_reorder_all_masked.py`）\n\n\n", "op-class-ssm.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/ops/ssm.md\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/ops/ssm.md` 迁移而来，原始为算子类别设计页，未做内容改写，仅转 OKF frontmatter。\n\n# SSM / 状态空间模型算子优化\n\n## 概述\n\n状态空间模型（SSM）是近年快速发展的序列模型架构，代表性工作包括 Mamba、Hyena、RetNet、GLA 等。  \n与 Transformer 不同，SSM 以**线性递推**方式更新隐状态，复杂度 O(T) 而非 O(T²)。\n\nTriton-Ascend 中 SSM 的核心挑战：\n1. **递推依赖**：时间步之间有数据依赖，不能简单并行化\n2. **Chunkwise 分解**：将序列分块，块内并行（GEMM），块间串行（状态转移）\n3. **State 寄存器复用**：隐状态 `h` 需长时间驻留寄存器，避免写回 HBM\n\n## 检测标准\n\n满足以下条件归类为 SSM：\n- 计算模式：线性递推 `h_t = A·h_{t-1} + B·x_t`，`y_t = C·h_t`\n- 或 Chunkwise 线性注意力：`O = (Q·K^T ⊙ M)·V`（因果掩码 M）\n- 或 Delta Rule 更新：`h_new = h - k^T·h·v^T + k^T·v`\n\n## 适用条件\n\n| 条件 | 说明 |\n|------|------|\n| 数据类型 | fp16、bf16；gating 部分通常 fp32 中间计算 |\n| 序列长度 T | ≥128，chunkwise 时 chunk size BT≥16 |\n| 状态维度 K/V | ≥64 |\n| 模型架构 | Mamba/Mamba2、GLA、RetNet、Hyena |\n\n## 经验路由\n\n| 场景 | 经验ID | 关键技术 | 经验文件 |\n|------|--------|----------|----------|\n| Chunkwise 线性注意力前向 | exp_chunk_fwd_001 | block_ptr tiling + gating masking，Q/K/V/H 2D块加载 | yaml |\n| Chunk CumSum（前缀和） | exp_chunk_cumsum_001 | 块内累积和，用于 gating 因子计算 | yaml |\n| Chunk Gated Delta | exp_chunk_gated_delta_001 | 带门控的 delta rule，sigmoid gating + 状态更新 | yaml |\n| Chunk KKT 计算 | exp_chunk_kkt_001 | K·K^T 内积矩阵，用于状态压缩 | yaml |\n| Delta Rule 前向（标准） | exp_fused_delta_rule_001 | sigmoid gating + softplus + delta rule 三合一融合，状态驻寄存器 | yaml |\n| Delta Rule 前向（NPU 专用） | exp_fused_delta_rule_npu_001 | Ascend 910b2/b3 路径优化版 | yaml |\n| SSM Gated Delta | exp_ssm_gated_delta_001 | SSM + gated delta rule 融合 | yaml |\n\n### 反向传播优化（KDA / Linear Attention）\n\n| 场景 | 经验ID | 提升 | 关键技术 |\n|------|--------|------|----------|\n| wy_dqkg_fused 标量消除 | exp_kda_bwd_wy_scalar_opt_001 | 3.33x | i64→i32、i32→fp32 比较、tl.cdiv/min 消除、compile_hint 移除 |\n| wy_dqkg_fused 结构优化 | exp_kda_bwd_wy_structure_opt_001 | 30% | Phase split、barrier 外提、LICM、K%BK 快速路径 |\n| intra 标量消除 | exp_kda_bwd_intra_scalar_opt_001 | 50% | block_ptr→手动指针、fp32 mask、min→tl.where |\n| intra 内存优化 | exp_kda_bwd_intra_memory_opt_001 | 35% | 转置 load 合并化、跨阶段冗余 load 消除 |\n| 标量循环 → 矩阵乘 | exp_kda_bwd_scalar_loop_to_dot_001 | 40% | 非 SAFE_GATE 对角块循环改为 tl.dot |\n\n## 关键技术\n\n### Chunkwise 并行化\n\n将长序列 T 分为 `T/BT` 个 chunk，每个 chunk 内部可做 GEMM 并行：\n\n```\n对每个 chunk c:\n  intra_chunk = Q[c] @ K[c]^T ⊙ causal_mask  (GEMM，块内并行)\n  inter_chunk = Q[c] @ H[c-1]                  (状态转移，串行)\n  O[c] = (intra_chunk + inter_chunk) @ V[c]\n  H[c] = update_state(H[c-1], K[c], V[c])\n```\n\n关键约束：BT（chunk size）通常选 16/32/64，过大超出 UB；状态 H 维度 K×V 需适配 UB。\n\n参考：exp_chunk_fwd_001\n\n### 隐状态寄存器驻留\n\nDelta Rule 更新：`h_new = h - (k^T @ h) * v^T + k * v`  \n将 `h`（维度 K×V）存于寄存器，避免每步写回 HBM：\n\n```python\n@triton.jit\ndef delta_rule_kernel(..., BK: tl.constexpr, BV: tl.constexpr):\n    # h 在寄存器内迭代更新\n    b_h = tl.zeros([BK, BV], dtype=tl.float32)  # 隐状态驻寄存器\n    for i in tl.static_range(T):\n        b_k = tl.load(k_ptr + i * K)\n        b_v = tl.load(v_ptr + i * V)\n        b_gate = tl.sigmoid(tl.load(g_ptr + i))\n        # delta rule 更新（无 HBM 写回）\n        b_h = b_gate * b_h + tl.outer(b_k, b_v)\n        tl.store(o_ptr + i * V, b_h @ b_q)\n```\n\n参考：exp_fused_delta_rule_001\n\n### Gating 融合\n\nsigmoid gating、softplus 激活与主体计算融合到同一 kernel，消除独立激活 kernel 的 HBM 开销。  \n参考：exp_chunk_gated_delta_001\n\n---\n\n## KDA / Linear Attention 反向优化\n\n`chunk_kda_bwd_kernel_wy_dqkg_fused` 和 `chunk_kda_bwd_kernel_intra` 是 Linear Attention 类模型的反向核心。在 Ascend 910B 上的优化重点与标准 SSM 前向不同：\n\n### 1. 标量消除（最高优先级）\n\n反向 kernel 通常有大量小 tile load/store 和 mask 计算，容易触发 Ascend 标量降级：\n\n```python\n# block_ptr + boundary_check → 手动指针 + fp32 mask\no_i = tl.arange(0, BC)\no_k = tl.arange(0, BK)\nm_ti = (i_ti + o_i).to(tl.float32) < T_local.to(tl.float32)\nm_k  = o_k.to(tl.float32) < K.to(tl.float32)\nmask_2d = m_ti[:, None] & m_k[None, :]\n```\n\n### 2. 转置 load 合并化\n\n`dAqk` / `dAkk` 在 Phase 2 中以转置视角加载，直接 block_ptr 会导致跨大步访存。改为行优先加载 + `tl.trans`：\n\n```python\nrow_idx = i_t*BT + i_j*BC + o_i[:, None]\ncol_idx = i_i*BC + o_i[None, :]\nb_dAqk_row = tl.load(dAqk_local + row_idx*H*BT + col_idx, mask=mask, other=0.0)\nb_dAqk = tl.trans(b_dAqk_row)\n```\n\n### 3. 标量循环 → 矩阵乘\n\n非 `SAFE_GATE` 路径的对角块计算使用 `for j in range(BC)` 逐行循环，改为 `tl.dot`：\n\n```python\nb_dAqk_diag = tl.load(p_dAqk_diag, mask=dA_diag_mask, other=0.0)\nb_dq2 += tl.dot(b_dAqk_diag, b_k_exp) * b_exp_g\n```\n\n### 4. Kernel 结构优化\n\n- **Phase split**：将 `i_k==0` 分支（dA/dv2/db）外提为独立 V-only 循环\n- **barrier 外提**：从 `i_v` 循环内移到循环后\n- **LICM**：预计算 `BT_arange[:, None] * V`、`H*K`、`H*V` 等不变量\n\n### 5. 调优配置\n\n```python\n@triton.autotune(\n    configs=[\n        triton.Config({}, num_warps=2, num_stages=2),\n        triton.Config({}, num_warps=2, num_stages=3),\n        triton.Config({}, num_warps=4, num_stages=2),\n        triton.Config({}, num_warps=4, num_stages=3),\n        triton.Config({}, num_warps=8, num_stages=2),\n        triton.Config({}, num_warps=8, num_stages=3),\n    ],\n    key=['BK', 'NC', 'BT'],\n)\n```\n\n实测 `wy_dqkg_fused` 最优：`BK=128, BV=64, num_warps=8, num_stages=2`。\n\n### 优化效果\n\n| Kernel | 优化前 | 优化后 | 加速比 |\n|--------|--------|--------|--------|\n| chunk_kda_bwd_kernel_wy_dqkg_fused | ~169,000 μs | ~50,700 μs | 3.33x |\n| chunk_kda_bwd_kernel_intra | AIV scalar 41.4% / MTE2 37.9% | 预期 scalar <20% / MTE2 <25% | — |\n\n## 常见陷阱\n\n| 陷阱 | 说明 | 解决方案 |\n|------|------|----------|\n| 状态过大超 UB | K×V 状态矩阵超出 192KB | 分块 BK/BV，多次 tile 更新状态 |\n| 递推串行化 | 跨 chunk 状态转移无法并行 | Chunkwise 分解，块内 GEMM 并行 |\n| gating 精度 | sigmoid/softplus 在 fp16 数值不稳定 | 中间计算升 fp32 |\n| block_ptr 对齐 | K/V 维度非 512B 倍数 | 使用 padding 或调整 BK/BV |\n\n## 相关页面\n\n- [ops/attention.md](op-class-attention.md) — Chunkwise 线性注意力与 Flash Attention 结构类似\n- [ops/matmul.md](op-class-matmul.md) — 块内 GEMM 使用矩阵乘优化\n- [ops/fused_ops.md](op-class-fused_ops.md) — 多阶段融合与 Phase split 模式\n- techniques/persistent_kernels.md — 状态驻留与 persistent kernel\n- techniques/tiling.md — BT/BK/BV tile 大小选择\n- techniques/data_types.md — i32→fp32 比较避免 scalar fallback\n- techniques/memory_access_optimization.md — 转置 load 合并化、跨阶段冗余 load 消除\n- techniques/compute_and_branch.md — min()/tl.cdiv 消除、标量循环→tl.dot\n- techniques/parallelism_and_loop.md — 外层循环 grid 并行化\n- techniques/performance_tuning.md — autotune 配置空间扩展\n\n## 已知实例（P3 挂载）\n\n### Extracted Kernel 反链\n- `151-fused_recurrent_gated_delta_rule_fwd_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/151-fused_recurrent_gated_delta_rule_fwd_kernel.py`）\n- `158-chunk_scaled_dot_kkt_fwd_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/158-chunk_scaled_dot_kkt_fwd_kernel.py`）\n- `159-chunk_fwd_kernel_o.py` — extracted kernel（source: `raw_experiences/extracted_kernels/159-chunk_fwd_kernel_o.py`）\n- `160-chunk_gated_delta_rule_fwd_kernel_h_blockdim64.py` — extracted kernel（source: `raw_experiences/extracted_kernels/160-chunk_gated_delta_rule_fwd_kernel_h_blockdim64.py`）\n\n\n", "skeleton-rmsnorm_fused.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/skeletons/rmsnorm_fused.py\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/skeletons/rmsnorm_fused.py` 迁移而来，原始为代码骨架，未做内容改写，仅转 OKF frontmatter。\n\n```python\n\"\"\"\n骨架：RMSNorm（融合变体：支持 Skip Add + RMSNorm）\n适用：fp16/bf16，任意 batch/seq/hidden\n经验：exp_rmsnorm_001(086) Persistent (35%), exp_rmsnorm_npu_001(093) 列分块 (35%)\n       exp_skip_layernorm_001(118) Skip+Norm融合 (30%)\n参考：ops/normalization.md, techniques/persistent_kernels.md\n约束：[hardware/constraints_cheatsheet]\n\"\"\"\n\nimport torch\nimport triton\nimport triton.language as tl\nfrom triton.runtime import driver\n\n\n@triton.heuristics({\n    # 自动选 BLOCK_SIZE_N：尽量一次装入整行，不超 UB（fp32: ~49K elements）\n    'BLOCK_SIZE_N': lambda args: min(\n        triton.next_power_of_2(args['N']),\n        4096  # 上限：4096 * 4B(fp32) = 16KB，远小于 192KB UB\n    ),\n})\n@triton.jit\ndef rmsnorm_kernel(\n    x_ptr,            # 输入 [M, N]\n    residual_ptr,     # Skip 残差输入（可选，HAS_RESIDUAL=True 时使用）\n    weight_ptr,       # 归一化权重 [N]\n    out_ptr,          # 输出 [M, N]\n    residual_out_ptr, # Skip Add 后的中间结果输出（可选）\n    M, N,\n    eps: tl.constexpr,\n    HAS_RESIDUAL: tl.constexpr,   # 是否融合 Skip Add\n    BLOCK_SIZE_N: tl.constexpr,\n):\n    # ── Persistent kernel：固定 grid = num_aicores，grid-stride 遍历行 ──\n    pid = tl.program_id(0)\n    num_programs = tl.num_programs(0)\n\n    # 权重只加载一次，复用于此 program 处理的所有行\n    offs_n = tl.arange(0, BLOCK_SIZE_N)\n    w_mask = offs_n < N\n    weight = tl.load(weight_ptr + offs_n, mask=w_mask, other=0.0).to(tl.float32)\n\n    for row in range(pid, M, num_programs):\n        x_ptrs = x_ptr + row * N + offs_n\n        x = tl.load(x_ptrs, mask=w_mask, other=0.0).to(tl.float32)\n\n        if HAS_RESIDUAL:\n            res_ptrs = residual_ptr + row * N + offs_n\n            residual = tl.load(res_ptrs, mask=w_mask, other=0.0).to(tl.float32)\n            x = x + residual\n            # 写出 skip add 中间结果（后续层可能需要）\n            tl.store(residual_out_ptr + row * N + offs_n, x, mask=w_mask)\n\n        # ── Two-pass RMSNorm ──────────────────────────────────────\n        # Pass 1: 计算 variance = mean(x^2)（fp32 累加）\n        x_sq = x * x\n        var = tl.sum(x_sq, axis=0) / N   # scalar\n\n        # Pass 2: 归一化\n        rstd = 1.0 / tl.sqrt(var + eps)  # rsqrt 替代 sqrt+div\n        x_norm = x * rstd\n        out = x_norm * weight\n\n        tl.store(out_ptr + row * N + offs_n, out.to(tl.float16), mask=w_mask)\n\n\n# ── 大 hidden dim 变体（n_cols > 4096，需列分块 two-pass）──────────\n@triton.jit\ndef rmsnorm_large_hidden_kernel(\n    x_ptr, weight_ptr, out_ptr,\n    M, N,\n    eps: tl.constexpr,\n    BLOCK_SIZE_N: tl.constexpr,   # 每次处理的列数（满足 UB 约束）\n):\n    pid = tl.program_id(0)\n    num_programs = tl.num_programs(0)\n\n    for row in range(pid, M, num_programs):\n        # Pass 1: 分块累加 sum(x^2)\n        var_acc = tl.zeros([1], dtype=tl.float32)\n        for col_start in range(0, N, BLOCK_SIZE_N):\n            offs = col_start + tl.arange(0, BLOCK_SIZE_N)\n            mask = offs < N\n            x = tl.load(x_ptr + row * N + offs, mask=mask, other=0.0).to(tl.float32)\n            var_acc += tl.sum(x * x, axis=0)\n        var = var_acc / N\n        rstd = 1.0 / tl.sqrt(var + eps)\n\n        # Pass 2: 分块归一化\n        for col_start in range(0, N, BLOCK_SIZE_N):\n            offs = col_start + tl.arange(0, BLOCK_SIZE_N)\n            mask = offs < N\n            x = tl.load(x_ptr + row * N + offs, mask=mask, other=0.0).to(tl.float32)\n            w = tl.load(weight_ptr + offs, mask=mask, other=0.0).to(tl.float32)\n            out = x * rstd * w\n            tl.store(out_ptr + row * N + offs, out.to(tl.float16), mask=mask)\n\n\ndef rmsnorm(\n    x: torch.Tensor,          # [M, N]\n    weight: torch.Tensor,     # [N]\n    residual: torch.Tensor = None,  # [M, N]，可选 Skip Add\n    eps: float = 1e-5,\n):\n    assert x.is_contiguous()\n    M, N = x.shape\n    out = torch.empty_like(x)\n    residual_out = torch.empty_like(x) if residual is not None else None\n\n    # 获取 AI Core 数量（Persistent kernel 的 grid 大小）\n    device = x.device\n    try:\n        props = driver.active.utils.get_device_properties(device.index)\n        num_cores = props[\"multiprocessor_count\"]\n    except Exception:\n        num_cores = 20  # 910b2 默认值\n\n    grid_size = min(M, num_cores)\n\n    if N <= 4096:\n        rmsnorm_kernel[(grid_size,)](\n            x, residual if residual is not None else x,\n            weight, out,\n            residual_out if residual_out is not None else out,\n            M, N,\n            eps=eps,\n            HAS_RESIDUAL=(residual is not None),\n        )\n    else:\n        # 列分块：BLOCK_SIZE_N * 4B(fp32) ≤ ~16KB\n        BLOCK_N = min(triton.next_power_of_2(N), 4096)\n        rmsnorm_large_hidden_kernel[(grid_size,)](\n            x, weight, out,\n            M, N,\n            eps=eps,\n            BLOCK_SIZE_N=BLOCK_N,\n        )\n\n    return (out, residual_out) if residual is not None else out\n\n```\n\n\n", "ops/flash-attention-score-grad.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/flash_attention_score_grad/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/flash-attention-score-grad.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/flash_attention_score_grad/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/flash_attention_score_grad/)。\n\n# FlashAttentionScoreGrad (训练反向)\n\nCANN ops-transformer 中的 `FlashAttentionScoreGrad` 算子（简称 FAG）在训练场景下计算 `FlashAttentionScore` 的反向梯度，支持 Atlas A2 训练系列（arch32 / ascend910b / ascend910_93）与 Ascend 950PR/950DT（arch35）。本页归纳反向算子语义与计算流程；可复用的 tiling/流水/dispatch 知识见 `technique-flash-attention-tiling`、`technique-flash-attention-pipeline`、`pattern-flash-attention-tiling-key-dispatch`，反向重算方法见 `technique-flash-attention-backward-recompute`。前向算子见 `kernel-flash-attention-score`。\n\n## 1. 输入输出\n\n### 输入（按 op_host/flash_attention_score_grad_def.cpp 顺序）\n\n| 输入 | 必选/可选 | 含义 | dtype |\n|------|-----------|------|-------|\n| query | 必选 | 查询 Q | FP16/BF16/FLOAT/HIFLOAT8/FLOAT8_E5M2/FLOAT8_E4M3FN |\n| key | 必选 | 键 K | 同 query |\n| value | 必选 | 值 V | 同 query |\n| dy | 必选 | 输出梯度 dY | FP16/BF16/FLOAT（FP8 路径下同 qkv） |\n| pse_shift | 可选 | 位置编码 | FP16/BF16/FLOAT |\n| drop_mask | 可选 | dropout 掩码，1=保留 0=丢弃 | UINT8 |\n| padding_mask | 可选 | padding 掩码 | FP16/BF16/FLOAT |\n| atten_mask | 可选 | 注意力掩码，1=不参与 0=参与 | BOOL/UINT8 |\n| softmax_max | 可选 | 前向 softmax 行最大值，加速重算 | FLOAT |\n| softmax_sum | 可选 | 前向 softmax 行求和，加速重算 | FLOAT |\n| softmax_in | 可选 | 前向 softmax 后的 P | FP16/BF16/FLOAT |\n| attention_in | 可选 | 前向输出 Y=PV，参与 FlashSoftmaxGrad | FP16/BF16/FLOAT |\n| prefix / actual_seq_qlen / actual_seq_kvlen / q_start_idx / kv_start_idx | 可选 | 变长/偏移（TND、varlen） | INT64 |\n| d_scale_q/k/v/dy/o | 可选 | FP8 全量化反量化参数 | FLOAT |\n| query_rope / key_rope | 可选 | RoPE 编码张量 | 同 query |\n| sink / ds_scale / p_scale | 可选 | attention sink / P 缩放（V3+） | FLOAT |\n\n### 输出\n\n| 输出 | 含义 | dtype |\n|------|------|-------|\n| dq / dk / dv | Q/K/V 的梯度 | FP16/BF16/FLOAT |\n| dpse | pse 的梯度 | FP16/BF16/FLOAT |\n| dq_rope / dk_rope | RoPE 梯度（V3+） | FP16/BF16/FLOAT |\n| dsink | sink 梯度（V3+） | FLOAT |\n\n### 维度约定（README L187-194）\n\n以 BNSD/BSND 为例（BSH/SBH 下 H=N*D）：B: 1~2M（prefix 时最大 2K）；N: 1~256；S: 1~1M；D: A2/A3 训练 1~512，950PR 1~768。内核计算逻辑轴：B、N2（kv head）、G（query/kv head 比）、S1（query seq）、S2（kv seq）、D、Dv。\n\n### 属性（def.cpp L222-260）\n\n`scale_value`(1.0)、`keep_prob`(1.0)、`pre_tockens`(INT_MAX)、`next_tockens`(INT_MAX)、`head_num`(必需)、`input_layout`(必需 BSH/SBH/BNSD/BSND/TND)、`inner_precise`(0)、`sparse_mode`(0，0=NO_MASK..8=BAND_LEFT_UP_CASUAL)、`pse_type`(1)、`seed`(2)、`offset`(0)、`out_dtype`(0)、`softmax_in_layout`(\"\")。\n\n## 2. 核心反向公式（6 步，FAG算子设计介绍.md L9-14）\n\n设 `S=Mask(QK^T/√d + pse, atten_mask)`，`P=Dropout(Softmax(S),keep_prob)`，`Y=PV`：\n\n| 步 | 公式 | 说明 |\n|----|------|------|\n| 1 重算 p | `p = SimpleSoftmax(Mask(Matmul(query, key^T) + pse) * scale)` | 重算前向 softmax 结果 P，存 UB |\n| 2 dp | `dp = Dropout(Matmul(dy, value^T))` | dY·V^T |\n| 3 ds | `ds = p * Sub(dp, FlashSoftmaxGrad(dy, attention_in))` | FlashSoftmaxGrad 入参 dY 与前向输出 Y |\n| 4 dq | `dq = Matmul(ds, key) * scale` | ds·K |\n| 5 dk | `dk = Matmul(ds^T, query) * scale` | ds^T·Q |\n| 6 dv | `dv = Matmul(Dropout(p)^T, dy)` | Dropout(P)^T·dY |\n\nFlashSoftmaxGrad 实质：`ds = P ⊙ (dP − rowsum(dP ⊙ P))`，`dP = dY·V^T`（步 2）。反向**重算** P（softmax_max/sum 作为可选输入可加速重算，见 def.cpp L72-83）。共 4 次 matmul：mm1=Q·K^T（重算）、mm2=dy·V^T、mm3=ds·K / ds^T·Q、mm4=P^T·dy。\n\n## 3. 计算流程（3 阶段 Pipeline，FAG算子设计介绍.md L20-23）\n\n| 阶段 | 入口函数 | 单元 | 对应步 |\n|------|----------|------|--------|\n| Cube1 | ComputeMM1 | AIC | 步 1（重算 p：QK^T + softmax） |\n| Vector1 | ComputeVec | AIV | 步 2-3（dp、ds：FlashSoftmaxGrad + elementwise） |\n| Cube2 | ComputeMMDqkv | AIC | 步 4-6（dq/dk/dv matmul） |\n\nV 侧 double buffer（ping-pong）；CV 间 preload（Cube 提前发射）。arch32 C:V=1:2 核数比，1:16 数据配比（nRatio=8）；arch35 C:V=1:2，L0C->UB / UB->L1 高速通路。详见 `technique-flash-attention-pipeline`。\n\n## 4. Tiling 与多模板\n\n- **arch32**：8 类模板，按 shape 路由（FAG算子设计介绍.md L264-319）：S1S2（通用泛化）、SameAB（_sab，Cube 为主核，确定性/大序列）、BN2（S1<1024&&S2<1024&&(B*N2*2>CoreNum‖G==1)）、NGS1S2_BN（G*S1*S2≤32KB&&G==1&&S2<1536）、B（N2*G*S1*S2≤64*128）、Basic/MLA、Basic_det（确定性）、Empty。CV 基本块 C 128×1024 / V 8×1024。\n- **arch35**：4 类模板（BN2: S1≤128&&S2≤128&&G==1；BN2S2: TND&&B*N2*S2>cubeCoreNum&&G==1；BN2GS1S2 通用；确定性），仅 2 个 kernel 文件（非确定性/确定性），模板参数隔离。CV 基本块 C 128×128 / V 64×128。\n- 切分顺序：先核内再核间；S2 不切多核（softmax 在线更新需连续 S2）。详见 `technique-flash-attention-tiling`。\n\n## 5. 模板 dispatch（op_kernel/flash_attention_score_grad.cpp L488-901）\n\n20 个 kernel 模板参数，按 `UB0/UB1/Block/IsSameAB/IsDeterministic` 分发：空 tensor(0,0,0) / SameAB(4,3,4,1 → key 0x1434) / S1S2(4,3,4,0) / BN2(4,3,1 → 0x134) / NGS1S2_BN(9,9,1 → 0x199) / B(9,9,0 → 0x099) / Basic_det(9,9,9,Det=1 → 0x1999) / Basic(9,9,9 → 0x999)。按 dtype（FP16/BF16/FLOAT）特化，FP32 仅 S1S2/BN2/BN/B。dispatch 维度（dtype/layout/has_mask/has_pse/has_dropout/has_rope/deterministic/sparse/NZ 输出/L1 复用/对齐特化）可映射为 Triton `tl.constexpr` 分支与 `BLOCK_*` 选择。详见 artifact `tiling-dispatch-tables.md` 与 `pattern-flash-attention-tiling-key-dispatch`。\n\n## 6. 架构与产品支持\n\n| 产品 | 架构代号 | 支持 | 说明 |\n|------|----------|------|------|\n| Atlas A2 训练 | arch32 (ascend910b) | √ | AIC&AIV 分离，多模板（8 类），aclnn V1-V3 |\n| Atlas A3 训练 | ascend910_93 | √ | 复用 arch32 kernel |\n| Ascend 950PR/950DT | arch35 (DAV_3510) | √ | AIC&AIV 融合，统一模板，aclnn V4 |\n| Atlas A2/A3 推理 | - | × | 仅训练场景 |\n\nFP8（FLOAT8_E5M2/E4M3FN/HIFLOAT8）仅 arch35(950) 支持，且不可配 pse/dropMask/attenMask/keepProb（README L179-181）。aclnn 版本：V1-V3 仅 A2 训练（950PR ×），V4 仅 950PR（A2 ×）；V2 加 pseType，V3 加 sink/dsink，V4 合并 V2+UnpaddingV2+varlen+自动 Dropout（docs/aclnnFlashAttentionScoreGrad*.md）。\n\n## 7. Agent actions\n\n1. 确认架构（arch32 vs arch35）与 dtype，选择对应模板分发路径与 aclnn 版本（V1-V3 A2 / V4 950）。\n2. 反向需重算 P：按 `technique-flash-attention-backward-recompute` 安排 6 步计算与 4 次 matmul。\n3. 按输入 layout 与 shape 推导核内/核间切分轴，参考 `technique-flash-attention-tiling`；S2 不切多核。\n4. 检查 atten_mask/dropMask/pse/softmax_max/sum/attention_in 是否存在，选对应 tiling key bit / constexpr 分支。\n5. 参考 `technique-flash-attention-pipeline` 安排 Cube/Vector 流水与 double buffer；arch35 利用 L0C->UB/UB->L1。\n6. Triton 实现参考 `artifacts/flash-attention-score-grad/flash-attention-score-grad-triton-skeleton.py`（pseudocode）。\n7. 空 tensor 走短路清零（FAG_EMPTY_TILING_KEY，100MB workspace）。\n\n## 8. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred），tiling 参数数值、流水 bound、FP8/BF16 精度边界、aclnn 运行时契约未经硬件实测。Triton skeleton 标记 `reproducibility: pseudocode`，不可直接编译运行。来源见 `ops-transformer-flash-attention-score-grad`。\n\n\n", "ops/flash-attention-score.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/flash_attention_score/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/flash-attention-score.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/flash_attention_score/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/flash_attention_score/)。\n\n# FlashAttentionScore (训练前向)\n\nCANN ops-transformer 中的 `FlashAttentionScore` 算子在训练场景下使用 FlashAttention 算法实现 self-attention 前向计算，支持 Atlas A2 训练系列（arch32）与 Ascend 950PR/950DT（arch35）。本页归纳算子语义与计算流程，可复用的 tiling/流水/dispatch 知识分别见 `technique-flash-attention-tiling`、`technique-flash-attention-pipeline`、`pattern-flash-attention-tiling-key-dispatch`。\n\n## 1. 输入输出\n\n### 输入（按 op_host/flash_attention_score_def.cpp 顺序）\n\n| 输入 | 必选/可选 | 含义 | dtype |\n|------|-----------|------|-------|\n| query | 必选 | 查询，shape 由 input_layout 决定 | FP16/BF16/FLOAT/FP8_E5M2/FP8_E4M3FN/HIFLOAT8 |\n| key | 必选 | 键 | 同 query |\n| value | 必选 | 值 | 同 query |\n| real_shift (pse) | 可选 | 位置编码 | FP16/BF16/FLOAT |\n| drop_mask | 可选 | dropout 掩码，1=保留 0=丢弃 | UINT8 |\n| padding_mask | 可选 | padding 掩码 | FP16/BF16/FLOAT |\n| atten_mask | 可选 | 注意力掩码，1=不参与 0=参与 | BOOL/UINT8 |\n| prefix | 可选 | prefix 序列长度 | INT64 |\n| actual_seq_qlen / actual_seq_kvlen | 可选 | 变长真实序列长度 | INT64 |\n| q_start_idx / kv_start_idx | 可选 | 序列起始偏移 | INT64 |\n| d_scale_q / d_scale_k / d_scale_v | 可选 | FP8 全量化参数 | FLOAT |\n| query_rope / key_rope | 可选 | RoPE 编码张量 | 同 query |\n| sink | 可选 | attention sink | FLOAT |\n| p_scale | 可选 | P 矩阵缩放 | FLOAT |\n\n### 输出\n\n| 输出 | 含义 | dtype |\n|------|------|-------|\n| softmax_max | Softmax 行最大值，供反向 | FLOAT |\n| softmax_sum | Softmax 行求和，供反向 | FLOAT |\n| softmax_out | Softmax 后的 P 矩阵 | FP16/BF16/FLOAT |\n| attention_out | 最终注意力输出 | FP16/BF16/FLOAT |\n\n### 维度约定\n\n以 BNSD/BSND layout 为例（BSH/SBH 下 H=N*D）:\n- B: 1~2M（prefix 时最大 2K）\n- N: 1~256\n- S: 1~1M\n- D: 1~768（FP8 时 1~128）\n\n内核计算逻辑轴为 B、N2（kv head）、G（query/kv head 比）、S1（query seq）、S2（kv seq）、D（head dim）、Dv（value head dim）。\n\n### 属性\n\n- `scale_value` (默认 1.0): QK 缩放系数\n- `keep_prob` (默认 1.0): dropout 保留概率\n- `head_num` (必需): query head 数\n- `input_layout` (必需): BSH/SBH/BNSD/BSND/TND\n- `sparse_mode` (默认 0): 0=ALL,1=NONE,2=ANY,3=CAUSAL,4=BAND,5=PREFIX,...\n- `pse_type` (默认 1): 控制 pse 的 add/mul 顺序\n- `inner_precise` (默认 0): 内部精度模式\n- `pre_tockens` / `next_tockens`: sparse 窗口\n\n## 2. 核心计算公式\n\npseType=1 时（先 add 再 mul）:\n```\nattention_out = Dropout(Softmax(Mask(scale * (pse + (Q·dScaleQ)·(K·dScaleK)ᵀ), atten_mask)), keep_prob) · (V·dScaleV)\n```\n\npseType≠1 时（先 mul 再 add）:\n```\nattention_out = Dropout(Softmax(Mask(scale * ((Q·dScaleQ)·(K·dScaleK)ᵀ) + pse), atten_mask)), keep_prob) · (V·dScaleV)\n```\n\nFP8 场景下 dScaleQ/K/V 为全量化参数，非 FP8 时可视为 1。atten_mask 中为 true 的位置被 select 成负极小值，softmax 后变 0 实现遮蔽。\n\n## 3. 计算流程（FlashSoftmax 在线刷新）\n\n| 阶段 | 入口函数 | 单元 | 操作 |\n|------|----------|------|------|\n| Cube1 | IterateBmm1 | AIC | Q·Kᵀ matmul → 原始 attention_score |\n| Vector1 | ProcessVec1 | AIV | pse add/mul → scale → atten_mask select → FlashSoftmax(在线 max/sum) |\n| Cube2 | IterateBmm2 | AIC | P·V matmul（P 为 softmax 结果） |\n| Vector2 | ProcessVec2 | AIV | rescale（除 softmax_sum）→ dropout → 写回 attention_out |\n\nFlashSoftmax 对 Skv 轴切分，在线更新:\n- `max[i]` = 第 i 个 SkvSplit 的行最大值\n- `exp[i] = e^(max[i-1] - max[i])`\n- `PV[i] = PV[i-1] * exp[i] + PV_new[i]`（PV 累积器按 exp 缩放后累加新分块）\n- 最终 `attention_out = PV_final / softmax_sum`\n\nsoftmax_max 与 softmax_sum 作为中间结果输出，供反向 `FlashAttentionScoreGrad` 使用。\n\n## 4. 变体对照\n\n| 变体 | 算子名 | 场景 |\n|------|--------|------|\n| 训练前向 | flash_attention_score | self-attention 训练，输出 softmax_max/sum 供反向 |\n| 训练反向 | flash_attention_score_grad | 训练反向梯度 |\n| 推理前向 | prompt_flash_attention | 推理 prefill / 全序列 |\n| 增量推理 | incre_flash_attention | 推理增量 decode（KV cache） |\n| 稀疏 | sparse_flash_attention / kv_quant_sparse_flash_attention | 稀疏 / KV 量化注意力<br>- MLA-absorb 模式（attention_mode=2）：query/key 的 nope 和 rope 部分沿 D 维拼接<br>- 离散访存搬运聚合优化（sparse_indices 驱动）<br>- 约束：D=512, Dr=64, N1=1/2/4/8/16/32/64/128, KV_N 只支持 1, block_size=16 倍数(≤1024)<br>- 支持 BSND/TND/PA_BSND 三种 layout<br>- 支持 FP16/BF16 输入输出，FP32 中间计算 |\n\n所有变体共享 QK→softmax→PV 的核心计算骨架，差异在于 mask/sparse 处理、KV cache 管理、是否输出反向中间量。\n\n## 5. 架构与产品支持\n\n| 产品 | 架构代号 | 支持 | 说明 |\n|------|----------|------|------|\n| Atlas A2 训练 | arch32 (DAV_A2) | √ | AIC&AIV 分离，多模板（6 类） |\n| Atlas A2 推理 | arch32 | √ | SFA 场景，稀疏 / KV 量化注意力 |\n| Atlas A3 训练 | ascend910_93 | √ | 复用 arch32 kernel |\n| Ascend 950PR/950DT | arch35 (DAV_3510) | √ | AIC&AIV 融合，单模板覆盖全 shape |\n| Atlas A3 推理 | arch35 | √ | SFA 场景，稀疏 / KV 量化注意力 |\n\nFP8（FLOAT8_E5M2/E4M3FN/HIFLOAT8）仅在 arch35 支持，且不可配 pse/dropMask/attenMask/keepProb 等可选参数。\n\nSFA（sparse_flash_attention）仅支持推理场景，不支持训练。\n\n## 6. Agent actions\n\n1. 确认目标架构（arch32 vs arch35）与 dtype，选择对应模板分发路径。\n2. 按输入 layout（BNSD/BSND/BSH/SBH/TND）和数据轴推导核内/核间切分轴。\n3. 评估 S2 是否 >1024：是则 S1S2 模板（含 FlashSoftmax 刷新流程），否则 S1/SameAB 模板。\n4. 检查 atten_mask/dropMask/pse 是否存在，选择对应 tiling key bit。\n5. 参考 `technique-flash-attention-pipeline` 安排 Cube/Vector 流水与 double buffer。\n6. Triton 实现参考 `artifacts/flash-attention-score/flash-attention-triton-skeleton.py`（pseudocode）。\n7. 对于 sparse_flash_attention 算子，关注 attention_mode=2 的 MLA-absorb 模式，以及 sparse_indices 驱动的离散 KV 取数策略。参考 `technique-sparse-kv-gather` 了解搬运聚合优化，参考 `technique-sparse-attention-tiling` 了解 SFA 特有的 tiling 策略。\n\n## 7. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred），tiling 参数数值、流水 bound 结论未经硬件实测。Triton skeleton 标记 `reproducibility: pseudocode`，不可直接编译运行。来源见 `ops-transformer-flash-attention-score`。\n\n\n", "ops/fused-floyd-attention.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/fused_floyd_attention/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/fused-floyd-attention.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/fused_floyd_attention/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/fused_floyd_attention/)。\n\n# FusedFloydAttention (Floyd 多维注意力)\n\nCANN ops-transformer 中的 `FusedFloydAttention` 算子使用 FloydAttention 算法实现多维自注意力计算，支持 2 组 KV head group（K1/V1 + K2/V2）。仅支持 Atlas A2 训练系列（arch32 / ascend910b / ascend910_93），不支持 ascend950。\n\n## 1. 输入输出\n\n### 输入\n| 输入 | 必选 | 含义 | dtype |\n|------|------|------|-------|\n| query | 是 | 查询 Q | FP16/BF16/FLOAT |\n| key1 | 是 | 键 K1 | FP16/BF16/FLOAT |\n| value1 | 是 | 值 V1 | FP16/BF16/FLOAT |\n| key2 | 是 | 键 K2 | FP16/BF16/FLOAT |\n| value2 | 是 | 值 V2 | FP16/BF16/FLOAT |\n| atten_mask | 可选 | 注意力掩码 | BOOL/UINT8 |\n\n### 输出\n| 输出 | 含义 | dtype |\n|------|------|-------|\n| softmax_max | Softmax 行最大值 | FLOAT |\n| softmax_sum | Softmax 行求和 | FLOAT |\n| attention_out | 注意力输出 | FP16/BF16/FLOAT |\n\n### 约束（README.md L112-124）\nB:1~2K, H:1~256, N:16~1M(N%16==0), M:128~1M(M%128==0), K:128~1M(K%128==0), D:32/64/128\n\n## 2. 核心公式\n\n```\nweights = Softmax(attenMask + scale * (Q@K1^T + Q@K2^T))\nattention_out = weights@V1 + weights@V2\n```\n\n4 次 matmul: Q·K1^T + Q·K2^T + P·V1 + P·V2\n\n## 3. 计算流程\n\n| 阶段 | 入口 | 单元 | 操作 |\n|------|------|------|------|\n| Cube1 | IterateBmm1 | AIC | Q·K1^T |\n| Cube1k1 | IterateBmm1K1 | AIC | Q·K2^T |\n| Vector1 | ProcessVec1 | AIV | QK1+QK2 → scale → mask → Softmax |\n| Cube2 | IterateBmm2 | AIC | P·V1 |\n| Cube2v2 | IterateBmm2V2 | AIC | P·V2 |\n| Vector2 | ProcessVec2 | AIV | P·V1+P·V2 → 写回 |\n\n## 4. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。Triton skeleton 标记 `reproducibility: pseudocode`。来源见 `ops-transformer-fused-floyd-attention`。\n\n\n", "ops/mla-preprocess.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_preprocess/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/mla-preprocess.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_preprocess/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_preprocess/)。\n\n# MlaPreprocess（MLA 前处理融合算子）\n\nCANN ops-transformer 的 `MlaPreprocess` 是**推理场景** Multi-Head Latent Attention（MLA）的前处理融合算子：把输入 x 经 RmsNormQuant + 降维矩阵乘（W^DQKV）拆分为 Q/K 两路，再各自做 RmsNorm/上采样矩阵乘（W^UQ/W^UK）/RoPE，输出 q^N（nope）、q^R（rope）并把 k^N/k^R 写入 KV cache（README L12-19）。它是 `kernel-sparse-flash-attention`/`kernel-prompt-flash-attention` MLA 模式（attention_mode=2）的上游预处理，本身不做 softmax/QK/PV。\n\n## 1. 输入输出\n\n### 输入（def.cpp L73-96；README L74-241，多为 REQUIRED）\n\n| 输入 | 含义 | dtype | format |\n|---|---|---|---|\n| input | x，[tokenNum, hiddenSize] | FP16/BF16 | ND |\n| gamma_0/beta_0/quant_scale_0 | 1st RmsNormQuant 参数 | FP16/BF16 | ND |\n| quant_offset_0 | 1st 量化偏移 | INT8 | NZ |\n| wdqkv | 降维矩阵 W^DQKV，[2112,hiddenSize] | INT8/BF16 | NZ |\n| descale_0/bias_0 | mm1 系数/偏置 | INT64/FLOAT / INT32 | ND |\n| gamma_1/beta_1/quant_scale_1/quant_offset_1 | 2nd RmsNormQuant 参数 | FP16/BF16 / INT8 | ND |\n| wuq | 上采样 Q 矩阵 W^UQ，[headNum*192,1536] | INT8/BF16 | NZ |\n| descale_1/bias_1 | mm2 系数/偏置 | INT64/FLOAT / INT32 | ND/NZ |\n| gamma_2 | 3rd RmsNorm（K 路）参数，[512] | FP16/BF16 | ND |\n| cos/sin | RoPE 正余弦，[tokenNum,64] | INT8 | NZ |\n| wuk | 上采样 K 矩阵 W^UK | FP16/BF16 | ND/NZ |\n| kv_cache / kv_cache_rope | KV cache（与输出同 tensor） | FP16/BF16/INT8 | ND/NZ（随 cacheMode） |\n| slot_mapping | cache 索引，[tokenNum] | INT32 | ND |\n| ctkv_scale / q_nope_scale | 输出量化系数（cacheMode=2） | FP16/BF16 | ND |\n\n### 输出（def.cpp L97-100；README L334-360）\n\n| 输出 | 含义 | dtype | format |\n|---|---|---|---|\n| q_out | q^N（nope），[tokenNum,headNum,512]（cacheMode 0 为 576 拼接） | FP16/BF16/INT8 | ND |\n| kv_cache_out | k^N 写回 cache | FP16/BF16/INT8 | ND/NZ |\n| q_rope_out | q^R（rope），[tokenNum,headNum,64] | FP16/BF16 | ND |\n| kr_cache_out | k^R 写回 cache | FP16/BF16 | ND/NZ |\n\n### 属性（def.cpp L101-113）\n- `wdq_dim`(128,预留)、`q_rope_dim`/`k_rope_dim`(64,预留)、`epsilon`(1e-5)、`q_rotary_coeff`/`k_rotary_coeff`(2,预留)。\n- `transepose_wdq`/`wuq`/`wuk`(true,预留)、`do_rms_norm`(true,预留)、`wdkv_split_count`(1,预留)。\n- `cache_mode`(0-3)、`quant_mode`(0-3，仅 0=per_tensor 静态非对称实现，1/2/3 未实现，README L315)。\n\n### 约束（README L363-371）\ntokenNum 0-256；hiddenSize 2048-10240（256 倍数）；headNum {16,32,64,128}；blockNum 192；blockSize 128。BF16 权重 -> input BF16 且 hiddenSize 仅 6144。\n\n## 2. 核心计算公式\n\n```\nRMS(x) = sqrt(mean(x²) + eps);   RmsNorm(x) = γ · x / RMS(x)\nRmsNormQuant(x) = (RmsNorm(x) + bias) · deqScale\nq^N = RmsNormQuant(x) · W^DQKV · W^UK      # 数学 2-matmul 形式（MLA 权重吸收 W^UQ·W^UK 折叠）\nq^R = ROPE(x^Q)\nk^N = Cache(RmsNorm(RmsNormQuant(x)))\nk^R = Cache(ROPE(RmsNormQuant(x)))\n```\n（README L20-54）。kernel 实际实现 3 个 matmul（mm1=W^DQKV, mm2=W^UQ, mm3=W^UK，tilingdata L51-53）；是否运行时做权重吸收 `needs_verification`。\n\n## 3. 计算流程（CV 分离）\n\nkernel 入口先 `ProcessCube()` 再 `ProcessVector()`（mla_preprocess.cpp L52-53）：\n\n| 阶段 | 单元 | 操作 | tiling 方法 |\n|---|---|---|---|\n| Cube | AIC | 3 matmul（mm1 降维 / mm2 上采样Q / mm3 上采样K）+ RoPEConcat | `RopeConcatTiling`（tiling.h L54） |\n| Vector | AIV | 2× RmsNormQuant + RmsNorm₃ + EinSumQuant + Cache 写回 | `RmsNormQuantTiling` / `EinSumQuantTiling`（L53/55） |\n\n数据流：x -> RmsNormQuant₁ -> mm1 -> 拆 Q/K；Q: RmsNormQuant₂ -> mm2 -> 拆 nope(rope)/rope -> nope: mm3 -> q^N，rope: RoPE -> q^R；K: RmsNorm₃ -> cache k^N，RoPE -> cache k^R。\n\n## 4. tiling 与 dispatch（概要，详见 artifact `tiling_dispatch_tables.md`）\n\n- dtype dispatch：FP16 -> `_fp16.h`；BF16 -> `_bf16.h` + `_no_quant.h`（mla_preprocess.cpp L17-22）。\n- tiling key = cacheMode × 3 输出格式(ND/NZ)（L46+，步长 4，8 组合/cacheMode）。\n- 核间切分：tokenNum 沿 numCore，每核 perTaskNum、尾核 resTaskNum（tilingdata L47-50）。\n- 3 matmul 基本块 m0/k0/n0 + loop + swizzle + ping-pong（MlaPpMatmulTilingData L25-43）。\n- workspace 3 等大 section（s1/s2/s3，L41-43）。\n- buffer 搬运由 9 个 `*_iterator.h`（GM/L1/L0C/UB 间）封装，CANN 专有。\n\n## 5. 与 MLA attention 的关系\n\n`mla_preprocess` 是 MLA attention 的**上游预处理**：\n- 输出 q^N(512)+q^R(64) 与 k^N(512)+k^R(64) 供下游 `kernel-sparse-flash-attention`/`kernel-prompt-flash-attention` 的 MLA-absorb（attention_mode=2）使用。\n- 下游 attention 把 nope+rope 沿 D 拼接成 576 做 QK；key/value 共享张量。\n- 本算子**不做** softmax/QK/PV，只做 norm+matmul+rope+cache 融合。\n\n## 6. 架构支持（README L7-8；def.cpp L118-119）\n\n| 产品 | 架构 | 支持 |\n|---|---|---|\n| Atlas A2 训练/推理 | Ascend910B1 | √ |\n| Atlas A3 训练/推理 | Ascend910_93 | √ |\n\n不支持 950/310P。FP16/BF16（权重 INT8 量化）。\n\n## 7. Agent actions\n\n1. 识别为 MLA 前处理融合（norm+matmul+rope+cache），非 attention 主算子；下游接 MLA attention。\n2. 按 dtype 选 FP16/BF16/no_quant 模板；按 cacheMode 选输出格式(ND/NZ)与量化分支。\n3. Cube 侧 3 个 matmul（mm1/mm2/mm3）注意 MLA 权重吸收等价性（数学 2-matmul）。\n4. Vector 侧 RmsNormQuant 用 FP32 reduce；quantMode 仅 0 实现。\n5. Cache 写回按 slot_mapping scatter store；cacheMode 决定 cache shape/格式/int8 量化。\n6. Triton 实现参考 `artifacts/mla-preprocess/mla-preprocess-triton-skeleton.py`（pseudocode）。\n7. CANN 专有（buffer iterator/ND↔NZ/CV 分离/swizzle）不迁移，抽象为 fused load/store + 单 program。\n\n## 8. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。tiling 参数数值、workspace 预算、MLA 权重吸收实现、quantMode 1/2/3（未实现）、cacheMode=2 int8 量化边界均未经硬件实测。Triton skeleton 标记 `reproducibility: pseudocode`，不可直接编译运行。来源见 `ops-transformer-mla-preprocess`。\n\n\n", "ops/mla-prolog-v3.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_prolog_v3/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/mla-prolog-v3.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_prolog_v3/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_prolog_v3/)。\n\n# MlaPrologV3 (MLA pre-process)\n\nCANN ops-transformer 中的 `MlaPrologV3` 算子是 **DeepSeek V2/V3 核心创新 MLA（Multi-head Latent Attention）** 的前处理融合算子。对输入 token_x 执行 4 路 matmul（下采样 + 拼接上采样 + 拼接下采样 + 上采样）+ 2 个 RmsNorm + 2 个 RoPE 位置编码 + KVCache/KRCache 更新，输出 query（q^N）、query_rope（q^R_rope）、kv_cache、kr_cache。三架构（arch32 A2/A3 + arch35 950）。\n\n## 1. 输入输出\n\n### 输入（按 `mla_prolog_v3_def.cpp` 与 README L80-116）\n\n| 输入 | 必选/可选 | 含义 | dtype | 格式 |\n|------|-----------|------|-------|------|\n| token_x | 必选 | 输入 token | BF16/INT8/FP8_E4M3FN | ND |\n| weight_dq | 必选 | 下采样 W^{DQ} [He, Hcq] | BF16/INT8/FP8_E4M3FN | **FRACTAL_NZ** |\n| weight_uq_qr | 必选 | [W^{UQ}\\|W^{QR}] 拼接 [Hcq, Hckv+Dr] | BF16/INT8/FP8_E4M3FN | **FRACTAL_NZ** |\n| weight_uk | 必选 | 上采样 W^{UK} [Hckv, N*Hckv] | BF16/FP16 | ND |\n| weight_dkv_kr | 必选 | [W^{DKV}\\|W^{KR}] 拼接 [He, Hckv+Dr] | BF16/INT8/FP8_E4M3FN | **FRACTAL_NZ** |\n| rmsnorm_gamma_cq/ckv | 必选 | RmsNorm γ 参数 | BF16/FP16 | ND |\n| rope_sin/cos | 必选 | RoPE sin/cos 参数 | BF16/FP16 | ND |\n| kv_cache | 输入/输出 | KVCache | FP16/BF16/INT8 | ND |\n| kr_cache | 输入/输出 | KRCache | FP16/BF16/INT8 | ND |\n| cache_index | 必选 | cache 更新索引 [B,S] 或 [T,] | INT64 | ND |\n| 可选 20+ | 可选 | dequant_scale_x/dq/uq_qr/dkv_kr、quant_scale_ckv/ckr、smooth_scales_cq、actual_seq_len、kNopeClipAlpha、qcQrScale、kcScale 等 | 按模式 | ND |\n\n### 输出\n\n| 输出 | 含义 | dtype |\n|------|------|-------|\n| query (q^N) | 上采样后的 query [T,N,Hckv] | FP16/BF16/INT8 |\n| query_rope (q^R_rope) | RoPE 后的 query [T,N,Dr] | FP16/BF16/INT8 |\n| kv_cache（原地更新） | c^{KV}_norm 写入 cache | FP16/BF16/INT8 |\n| kr_cache（原地更新） | k^R_rope 写入 cache | FP16/BF16/INT8 |\n| dequant_scale_q_nope | query 量化参数（可选） | FLOAT |\n| query_norm | c^Q（可选） | INT8/BF16 |\n| dequant_scale_q_norm | query_norm 量化参数（可选） | FLOAT |\n\n### 属性（V3）\n\n`cache_mode`（PA_BSND/PA_NZ）、`qc_qr_scale`（α_q 默认1.0）、`kc_scale`（α_kv 默认1.0）、`query_norm_flag`、`weight_quant_mode`、`kv_cache_quant_mode`、`query_quant_mode`、`ckvkr_repo_mode`、`quant_scale_repo_mode`、`tile_size`（per-tile 128）、`rmsnorm_epsilon_cq/ckv`。\n\n## 2. 核心计算公式\n\n```\nc^Q  = α_q · RmsNorm(x · W^{DQ})                            # ① 下采样 + RmsNorm\nq^N  = c^Q · W^{UQ} · W^{UK}                                # ② 上采样 -> query\nq^R  = ROPE(c^Q · W^{QR})                                   # ③ RoPE -> query_rope\nc^{KV} = α_kv · RmsNorm(x · W^{DKV})                       # ④ 下采样 + RmsNorm -> kv_cache\nk^R  = ROPE(x · W^{KR})                                     # ⑤ RoPE -> kr_cache\n```\n\n利用矩阵乘拼接优化：W^{UQ}+W^{QR} 拼为 [W^{UQ}|W^{QR}]，W^{DKV}+W^{KR} 拼为 [W^{DKV}|W^{KR}]，单次 matmul 后 split。\n\n## 3. 计算流程\n\n### 3.1 四路 matmul + 2 RmsNorm + 2 RoPE（设计介绍 L15-25）\n\n```\nx → MatmulCq (x·W^{DQ}) → c^Q → RmsNormCq → c_norm^Q\n                                            → MatmulQcQr ([W^{UQ}|W^{QR}]) → [q^C|q^R] → split\n                                                                                  q^C → MatmulQn (W^{UK}) → q^N (query)\n                                                                                  q^R → RoPE → q^R_rope (query_rope)\nx → MatmulCkvKr ([W^{DKV}|W^{KR}]) → [c^{KV}|k^R] → split\n                                          c^{KV} → RmsNormCkv → kv_cache\n                                          k^R    → RoPE → kr_cache\n```\n\n### 3.2 CV 流水 6 同步点（设计介绍 L47-68）\n\n不同 matmul 的分核策略不同（Hcq 按 AIC 核数、Hckv 固定 64 块、Hqc 按 AIC 核数），导致 Cube 和 Vector 之间需要 6 个核间同步点（SYNC_MMCQ_NORMSCQ / SYNC_MMCKVKR_NORMROPE / SYNC_MMQCQR_ROPEQR / SYNC_ALL_CUBE / SYNC_ALL_VECTOR 等）。这是 CANN 专有机制，不迁移到 Triton。\n\n### 3.3 TilingKey（26 位二进制，9 字段）\n\n`mla_prolog_v3.cpp` L25-27 的 9 个 uint8_t 模板参数对应 TilingKey（设计介绍 L70-85）：\n\n| 字段 | 位 | 说明 |\n|------|----|------|\n| CACHE_MODE | 0-3 | 0:BNSD / 1:PA_BSND / 2:PA_NZ |\n| SCENARIO | 4-5 | 0:FP16 / 1:非量化 / 2:量化 |\n| QUANT_MODE | 6-9 | 8 种量化组合（非量化/MMQcQr/KVcache pertile/全量/Mxfp8 等） |\n| ENABLE_DEQUANT_OPT | 10 | 反量化使能 |\n| ENABLE_GROUP_COMPUTE_OPT | 11 | 算力分组优化 |\n| EMPTY_TENSOR_MODE | 12-13 | 空 tensor（KV 空/Query 空） |\n| ACTUAL_SEQ_LEN_MODE | 14-15 | actualSeqLen 使能 |\n| SPLIT_M_MODE | 16-17 | 0:切N / 1:切M |\n| CV_MODE | 18-25 | CV 配比（1:1 / 1:2） |\n\n## 4. 架构与产品支持\n\n| 产品 | 架构 | config（def.cpp） | kernel 入口 |\n|------|------|-------------------|-------------|\n| Atlas A2 训练/推理 | arch32（910B） | `ascend910b` L171 | `mla_prolog_v3.cpp`（共享 mla_prolog/） |\n| Atlas A3 训练/推理 | ascend910_93 | `ascend910_93` L172 | 同上 |\n| Ascend 950PR/950DT | arch35 | `ascend950` L315 | 同上（arch35 单独 dtype/layout） |\n\n三架构均支持，无 310P。kernel 实现共享 `mla_prolog/op_kernel/kernel_mla_prolog_split_n.h`（V3 与 V1/V2 共享核心实现）。\n\n## 5. 量化模式\n\n支持 8 种量化模式（QUANT_MODE 0-8，README L147-203）：\n\n| 模式 | token_x | weight_dq/uq_qr/dkv_kr | kv_cache | query 输出 |\n|------|---------|------------------------|----------|-----------|\n| 非量化 | BF16 | BF16 | FP16/BF16 | FP16/BF16 |\n| 部分量化 | BF16 | pertoken INT8 | 非量化/pertensor/pertile | FP16/BF16 |\n| 全量化 | pertoken INT8 | perchannel INT8 | 非量化/pertensor/pertile | pertoken_head INT8 |\n| Mxfp8 | FP8_E4M3FN | FP8_E4M3FN | pertensor | pertoken_head |\n\n## 6. Agent actions\n\n1. 确认目标架构（arch32 / arch35）与量化模式（QUANT_MODE 0-8）。\n2. 4 路 matmul 映射：`tl.dot` × 4（下采样 + 2 个拼接 matmul + 上采样）。\n3. 2 个 RmsNorm：`x * rsqrt(mean(x^2) + eps) * gamma`。\n4. 2 个 RoPE：偶奇拆分 * cos + 翻转 * sin -> 合并。\n5. KVCache/KRCache scatter：`tl.store(cache + cache_index, ...)`。\n6. V3 特有：α_q/α_kv 尺度矫正因子（qcQrScale/kcScale）、query_norm_flag、per-tile 量化（tileSize=128）。\n7. CANN 专有（不迁移）：CV 6 同步点、FRACTAL_NZ 物理格式、TilingKey 26 位 key。\n8. Triton 实现参考 `artifacts/mla-prolog-v3/mla-prolog-v3-triton-skeleton.py`（pseudocode）。\n\n## 7. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。kernel 实现来自共享 `mla_prolog/` 目录（V3 入口仅定义模板参数），核心实现细节需以 `kernel_mla_prolog_split_n.h` 为准。tiling 参数数值、per-tile 量化精度边界、cacheIndex 与 cache 更新关系、Mxfp8 支持需结合源码/硬件进一步验证。Triton skeleton 标记 `reproducibility: pseudocode`，不可直接编译运行。来源见 `ops-transformer-mla-prolog-v3`。\n\n\n", "ops/mla-prolog.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_prolog/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/mla-prolog.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_prolog/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/mla_prolog/)。\n\n# MlaProlog（MLA 前处理 Prolog V1）\n\nCANN ops-transformer 的 `MlaProlog` 是**推理场景** MLA 前处理融合算子 V1（与 `kernel-mla-preprocess` V2+ 不同）。四路计算：x→×W^DQ(RmsNorm)→[×W^UQ·W^UK→q^N]+[×W^QR→RoPE→q^R]+[×W^DKV→RmsNorm→cache→k^C]+[×W^KR→RoPE→cache→k^R]。它是 `kernel-sparse-flash-attention`/`kernel-prompt-flash-attention` MLA-absorb 的上游预处理，本身不做 softmax/QK/PV。**与 mla_preprocess 的差异**：权重更细粒度（W^DQ/W^UQ/W^QR/W^DKV/W^KR 独立而非 W^DQKV/W^UQ/W^UK），支持 Ascend950（FP8），CV 同步更复杂（6 event）。\n\n## 1. 输入输出\n\n### 输入（def.cpp L23-117；README L62-86）\n\n| 输入 | 必选/可选 | 含义 | dtype | format |\n|---|---|---|---|---|\n| token_x | 必选 | x，[B,S,He]/[T,He] | BF16/INT8 | ND |\n| weight_dq | 必选 | W^DQ 下采样 [He,Hcq] | BF16/INT8 | NZ |\n| weight_uq_qr | 必选 | [W^UQ\\|W^QR] [Hcq,N*(D+Dr)] | BF16/INT8 | NZ |\n| weight_uk | 必选 | W^UK [N,D,Hckv] | BF16 | ND |\n| weight_dkv_kr | 必选 | [W^DKV\\|W^KR] [He,Hckv+Dr] | BF16/INT8 | NZ |\n| rmsnorm_gamma_cq/ckv | 必选 | RmsNorm γ [Hcq]/[Hckv] | BF16 | ND |\n| rope_sin/cos | 必选 | RoPE [T,Dr]/[B,S,Dr] | BF16 | ND |\n| cache_index | 必选 | Cache 索引 [T]/[B,S] | INT64 | ND |\n| kv_cache/kr_cache | 必选 | KVCache（输入/输出同 tensor） | BF16/INT8 | ND |\n| dequant_scale_x/w_dq/w_dkv_kr | 可选 | 预留（未使用，传空指针） | FLOAT | ND |\n| dequant_scale_w_uq_qr | 可选 | MatmulQcQr 反量化 per-channel | FLOAT | ND |\n| quant_scale_ckv/ckr | 可选 | 输出量化参数 | FLOAT | ND |\n| smooth_scales_cq | 可选 | RmsNormCq 动态量化参数 | FLOAT | ND |\n\n### 输出（def.cpp L118-133）\n\n| 输出 | 含义 | dtype |\n|---|---|---|\n| query | q^N [B,S,N,Hckv]/[T,N,Hckv] | BF16 |\n| query_rope | q^R [B,S,N,Dr]/[T,N,Dr] | BF16 |\n| kv_cache | k^C（原地更新） | BF16/INT8 |\n| kr_cache | k^R（原地更新） | BF16/INT8 |\n\n### 属性（def.cpp L134-136）\n`rmsnorm_epsilon_cq`(1e-5)、`rmsnorm_epsilon_ckv`(1e-5)、`cache_mode`(\"BNSD\"=PA_BSND/PA_NZ)。\n\n### 约束（README L91-128）\n3 场景：非量化(BF16)/部分量化KV非量化(weight_uq_qr=INT8)/部分量化KV量化(kv_cache=INT8 per-channel)。B/S/T/Skv=0 时 query/kv_cache 输出空 tensor。\n\n## 2. 核心计算公式\n\n```\nq^N = RmsNorm(x·W^DQ)·W^UQ·W^UK              # 公式(a), 设计介绍 L154\nq^R = ROPE(RmsNorm(x·W^DQ)·W^QR)              # 公式(b), L158\nk^R = ROPE(x·W^KR)                            # 公式(c), L162\nc^KV = RmsNorm(x·W^DKV)                       # 公式(d), L166\n```\nW^UQ+W^QR 与 W^DKV+W^KR 分别横向拼接为一个 matmul 后 split（公式 7/11）。\n\n## 3. 计算流程（7 阶段 CV 流水，6 sync event）\n\n详见 `artifacts/mla-prolog/pipeline-diagram.md`。主循环（设计介绍 L83-146）：\n\n| # | 阶段 | 单元 | 操作 | 同步 |\n|---|---|---|---|---|\n| 1 | MatmulCq | AIC | x·W^DQ → cQ | →SYNC_MMCQ_NORMSCQ |\n| 2 | MatmulCkvKr | AIC | x·[W^DKV\\|W^KR] | →SYNC_MMCKVKR_NORMROPE |\n| 3 | RmsNormCq | AIV | γ·cQ/RMS(cQ) | ←等1, →全核→↺Cube |\n| 4 | RmsNormRopeScatterCkvKr | AIV | RmsNorm(cKV)+RoPE(kR)+Cache | ←等2 |\n| 5 | MatmulQcQr | AIC | cQ_norm·[W^UQ\\|W^QR] | ←等3, →SYNC_MMQCQR_ROPEQR, →全核→↺全核 |\n| 6 | RopeQr | AIV | RoPE(qR) | ←等5 |\n| 7 | MatmulQn | AIC | qC·W^UK → q^N | ←等全核(5) |\n\n## 4. tiling 与 dispatch（详见 `artifacts/mla-prolog/tiling_dispatch_tables.md`）\n\n- **tiling key 二进制**：CACHE_MODE(2bits)+SCENARIO(2bits)+QUANT_MODE(4bits)+DEQUANT/COMPUTE(2bits)+EMPTY(2bits)（设计介绍 L70-79）。\n- **8 模板参数**：`CacheMode, Scenario, QuantMode, EnableDequantOpt, EnableGroupComputeOpt, EmptyTensorMode, ActualSeqLenMode, SplitMMode, CvMode`（mla_prolog.cpp L20-22）。\n- **3 场景**：NO_QUANT(BF16)/PARTIAL_QUANT_KV_NO_QUANT(INT8_uq_qr)/PARTIAL_QUANT_KV_QUANT_PER_CHANNEL(INT8 cache)（L69-99）。\n- **4 matmul 切分**：BS 合轴 M，N 轴按 Cube 核数（MatmulCq Hcq / MatmulCkvKr Hckv+Dr / MatmulQcQr N*(D+Dr) / MatmulQn Hckv）。\n- **架构**：A2/A3(BF16/INT8) + 950(额外 FP8_E4M3FN)。`MIX_AIC_1_2`（1:2 CV 配比）。\n\n## 5. 与 mla_preprocess 的对比\n\n| 差异 | mla_prolog (V1) | mla_preprocess (V2+) |\n|---|---|---|\n| 权重 | W^DQ/W^UQ/W^QR/W^DKV/W^KR 独立 | W^DQKV/W^UQ/W^UK（W^DQKV=W^DQ+W^DKV 合并） |\n| 架构支持 | A2/A3 + 950(FP8) | 仅 A2/A3 |\n| CV sync | 6 event（更复杂，含全核同步） | ProcessCube+ProcessVector 两阶段 |\n| token_x dtype | BF16/INT8 | FP16/BF16 |\n| 量化 | per-channel cache 量化 | per_tensor 静态非对称 |\n| 公式 | `x·W^DQ→RmsNorm→[W^UQ\\|W^QR]` | `x→RmsNormQuant₁→W^DQKV→[W^UQ\\|W^UK]` |\n\n两者输出等价（q^N/q^R + k^C/k^R），但权重拆分与量化策略不同。`kernel-mla-preprocess` 页有详细对比。\n\n## 6. 架构支持（README L7-9；def.cpp L145-267）\n\n| 产品 | 架构 | 支持 | dtype |\n|---|---|---|---|\n| Atlas A2 训练/推理 | Ascend910B1 | √ | BF16/INT8 |\n| Atlas A3 训练/推理 | Ascend910_93 | √ | BF16/INT8 |\n| Ascend 950PR/950DT | Ascend950 | √ | BF16/INT8/FP8_E4M3FN |\n\n## 7. Agent actions\n\n1. 识别为 MLA prolog V1（权重 W^DQ/W^UQ/W^QR/W^DKV/W^KR 独立），与 mla_preprocess V2+ 区分。\n2. 按架构选 A2/A3(BF16/INT8) 或 950(FP8)；按 scenario 选量化分支（NO_QUANT/PARTIAL_QUANT）。\n3. 4 matmul：W^UQ+W^QR 与 W^DKV+W^KR 分别合并 matmul 后 split；MatmulQn 需等全核 MatmulQcQr。\n4. 6 CV sync event（CANN 专有）抽象为 tile 依赖链：Cube matmul → Vector norm → Cube matmul → Vector rope。\n5. Cache scatter 写回按 cache_index；PA 场景支持 ND/NZ 格式。\n6. 参考 `artifacts/mla-prolog/mla-prolog-triton-skeleton.py`（pseudocode）。\n\n## 8. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。tiling 参数数值、FP8 精度边界、MLA 权重吸收实现、预留参数（未使用）均未经硬件实测。Triton skeleton 标记 `reproducibility: pseudocode`。来源见 `ops-transformer-mla-prolog`。\n\n\n", "ops/moe-gating-top-k-softmax-v2.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_gating_top_k_softmax_v2/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/moe-gating-top-k-softmax-v2.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_gating_top_k_softmax_v2/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_gating_top_k_softmax_v2/)。\n\n# MoeGatingTopKSoftmaxV2 (MoE gating topk + softmax)\n\nCANN ops-transformer 中的 `MoeGatingTopKSoftmaxV2` 是 MoE gating 的 topk + softmax 算子，按 renorm 标记区分 softmax 与 topk 的先后顺序。纯 AIV-only Vector 算子（无 matmul）。\n\n## 1. 输入输出\n\n### 输入\n| 输入 | 必选/可选 | 含义 | dtype |\n|------|-----------|------|-------|\n| x | 必选 | gating 输入 | FP16/FLOAT/BF16 |\n| finished | 可选 | 行完成标记（True 则 expert_idx=num_expert） | BOOL |\n\n### 输出\n| 输出 | 含义 | dtype |\n|------|------|-------|\n| y | softmax 的 topk 结果 | FP16/FLOAT/BF16 |\n| expert_idx | topk 的 indices（专家序号） | INT32 |\n| softmax_result | softmax 结果（可选） | FLOAT |\n\n### 属性\n`k`（必需）、`renorm`(0)、`output_softmax_result_flag`(false)\n\n## 2. 核心公式\n- **renorm=0**：`softmaxResult = softmax(x, axis=-1)`；`yOut, expertIdxOut = topk(softmaxResult, k)`\n- **renorm=1**：`topkOut, expertIdxOut = topk(x, k)`；`yOut = softmax(topkOut, axis=-1)`\n- finished=True 时 expertIdxOut = num_expert\n\n## 3. 模板 dispatch\n\n`KERNEL_TYPE_MIX_AIV_1_0`（AIV-only）。~36 tiling key，4 模板策略：\n- **EKFullLoad**（101xxx）：expert+K 全加载\n- **KFullLoad**（102xxx，renorm=0）：K 全加载\n- **KRenorm**（102xxx，renorm=1）：K renorm\n- **Perf**（103xxx）：高性能，按 colRange 分 3 档（<8 / 8-64 / >64）\n\n## 4. 约束\n- k <= 1024\n- renorm 只支持 0/1\n- x 和 finished 每一维 <= INT32_MAX\n\n## 5. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。Triton skeleton 标记 `reproducibility: pseudocode`。来源见 `ops-transformer-moe-gating-top-k-softmax-v2`。\n\n\n", "ops/moe-gating-top-k-softmax.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_gating_top_k_softmax/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/moe-gating-top-k-softmax.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_gating_top_k_softmax/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_gating_top_k_softmax/)。\n\n# MoeGatingTopKSoftmax（MoE gating softmax + topK）\n\nCANN ops-transformer 的 `MoeGatingTopKSoftmax` 是 **MoE pipeline 的入口算子**：对 gating 输出 x 做 softmax 后取 topK，输出 topk 值(y)/专家序号(expertIdx)/行索引(rowIdx)（README L16）。是 `kernel-moe-init-routing-quant` 的上游（gating -> softmax -> topk -> init_routing -> FFN -> finalize）。**AIV-only**。\n\n## 1. 输入输出\n\n### 输入（def.cpp L23-34）\n- x（REQUIRED，FP16/FP32/BF16）：gating 输出。\n- finished（OPTIONAL，BOOL）：finished 标记。\n\n### 输出（def.cpp L35-49）\n- y（REQUIRED，FP16/FP32/BF16）：softmax 的 topk 值。\n- expert_idx（REQUIRED，INT32）：topk 索引=专家序号。\n- row_idx（REQUIRED，INT32）：行索引。\n\n### 属性（def.cpp L50）\n`k`（INT，topk 的 k 值）。\n\n### 约束（README L93-96）\nk≤1024；x 每维 < int32 max。\n\n## 2. 核心公式（README L19-33）\n\n```\n1. softmaxOut = softmax(x, axis=-1)\n2. yOut, expertIdxOut = topK(softmaxOut, k)\n3. rowIdxOut = arange(N*K).reshape(K,N).transpose(1,0)\n4. 若 finished[i]=True -> expertIdxOut = num_expert\n```\n\n## 3. tiling key dispatch（18 key，3 模板族）\n\n| key | 模板族 | dtype | 说明 |\n|---|---|---|---|\n| 0-5 | E_K_FullLoad | FP32/FP16/BF16 × BUF(1/2) | 小数据量全装载 |\n| 6-8 | K_FullLoad | FP32/FP16/BF16 × BUF(2) | 中数据量 k 全装载 |\n| 9-17 | Perf | FP32/FP16/BF16 × ColRange(<8/8-64/>64) | 大数据量按列范围优化 |\n\n## 4. 架构支持（README L7-12）\n\nA2/A3(arch32) + Ascend950(arch35 regbase)。\n\n## 5. MoE pipeline 位置\n\n```\ngating_top_k_softmax  ->  init_routing_quant  ->  FFN  ->  finalize_routing\n   (本算子)              (排序+量化)            (专家)    (合并)\n```\n\n## 6. Agent actions\n\n1. 识别为 MoE gating 入口（softmax + topk，AIV-only）。\n2. 是 MoE pipeline 第一步，下游接 `kernel-moe-init-routing-quant`。\n3. 3 模板族按数据量选择：E_K_FullLoad（小）/K_FullLoad（中）/Perf（大，按 expert 数 ColRange）。\n4. Triton 中 topk 需自定义（无内置 topk）或 host 预排序。\n5. finished 标记用于推理场景跳过已完成行。\n\n## 7. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。Triton skeleton 标记 `reproducibility: pseudocode`。\n\n\n", "ops/prompt-flash-attention.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/prompt_flash_attention/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/prompt-flash-attention.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/prompt_flash_attention/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/prompt_flash_attention/)。\n\n# PromptFlashAttention（推理 / prefill）\n\nCANN ops-transformer 的 `PromptFlashAttention`（PFA）是**全量推理场景**的 FlashAttention 融合算子，支持 sparse 优化、actualSeqLengthsKv 变长优化、INT8/FP8 量化、高精度/高性能模式选择（README L16）。它与训练前向 `FlashAttentionScore`（见 `kernel-flash-attention-score`）共享 QK->FlashSoftmax->PV 的核心骨架，差异在于推理语义、softmaxLse 输出、KV-cache/PagedAttention/量化/MLA 扩展。可复用的 tiling/流水/dispatch 知识分别见 `technique-flash-attention-tiling`、`technique-flash-attention-pipeline`、`pattern-flash-attention-tiling-key-dispatch`。\n\n## 1. 输入输出\n\n### 输入（按 `prompt_flash_attention_def.cpp` L26-75；kernel 全量入参见 `prompt_flash_attention.cpp` L25-37）\n\n| 输入 | 必选/可选 | 含义 | dtype |\n|---|---|---|---|\n| query / key / value | 必选 | Q/K/V | FP16/BF16/INT8（A2/950）；FP16（310P）；FP8/FP4（V3，部分 arch） |\n| pse_shift (pse) | 可选 | 位置编码 | FP16/BF16/FLOAT |\n| atten_mask | 可选 | 注意力掩码，true=遮蔽 | BOOL/UINT8/INT8/FLOAT16 |\n| actual_seq_lengths / actual_seq_lengths_kv | 可选 | 变长真实序列长度 | INT64 |\n| deq_scale1 / quant_scale1 / deq_scale2 / quant_scale2 / quant_offset2 | 可选 | 量化/反量化参数 | UINT64/FLOAT |\n| blocktable | 可选 | PagedAttention 块表 | INT32 |\n| key_antiquant_scale/offset, value_antiquant_scale/offset | 可选 | KV 反量化 | FP16/BF16/FLOAT |\n| keySharedPrefix / valueSharedPrefix / actualSharedPrefixLen | 可选 | 共享前缀 KV | 同 KV |\n| queryRope / keyRope | 可选 | 解耦 RoPE（MLA nope+rope） | 同 query |\n| dequantScaleQuery / learnableSink | 可选 | Q 反量化 / 可学习 sink | FLOAT |\n\n### 输出\n\n| 输出 | 含义 | dtype |\n|---|---|---|\n| attention_out | 注意力输出 | FP16/BF16/INT8 |\n| softmaxLse | log-sum-exp，供增量解码复用（kernel 入口 L36） | FLOAT |\n\n注：训练 FA 输出 softmax_max + softmax_sum 供反向；PFA 输出 softmaxLse 供推理下游。精确 lse 公式以 `vf_softmaxflashv3.h` 为准（`needs_verification`）。\n\n### 维度约定（README L94-166）\n- B≤65536（D 非 16/32 对齐时仅 128）；N≤256；S≤20971520（20M）；D≤512。\n- layout：BSH（默认）/SBH/BNSD/BSND/TND/NTD/PA_BSND。BNSD_BSND 时 query 为 BNSD、输出为 BSND。\n- TND 约束（A2）：T≤65536，N∈{8,16,32,64,128}，Q_D=K_D=192，V_D=128/192，BF16，sparse=0(无mask)或3(有mask)。\n- 长序列（B·S·N·D 乘积大）可能 aicore timeout，建议 S 切分（README L102）。\n\n### 属性（def.cpp L80-103）\n- `num_heads`（必需）、`num_key_value_heads`（默认0，GQA/MLA）。\n- `scale_value`（默认1.0）、`pre_tokens`（默认214748647）、`next_tokens`（默认0）。\n- `input_layout`（默认BSH）、`sparse_mode`（默认0）、`inner_precise`（默认1）。\n\n## 2. 核心计算公式\n\n```\nattention_out = Softmax(scale * Mask(Q·K^T, atten_mask) [+pse]) · V\n```\n- pse add/mul 顺序由 pse_type 决定（PseMode：OUTER_MUL_ADD/OUTER_ADD_MUL/INNER_MUL_ADD/...，enum L189-194）。\n- atten_mask 中 true 位置 select 成负极小值，softmax 后为 0 实现遮蔽（设计介绍 L11）。\n- scale = scale_value（默认 1/√d 由调用方传入）。\n\n## 3. 计算流程（在线 FlashSoftmax）\n\n| 阶段 | 入口（arch35 service/） | 单元 | 操作 |\n|---|---|---|---|\n| Cube1 (Bmm1) | `prompt_flash_attention_mm1.h` | AIC | Q·K^T -> attention_score（FP32 累加） |\n| Vector1 (Vec1) | `prompt_flash_attention_vector1.h` | AIV | pse -> ×scale -> atten_mask select -> FlashSoftmax(在线 max/sum) |\n| Cube2 (Bmm2) | `prompt_flash_attention_mm2.h` | AIC | P·V matmul |\n| Vector2 (Vec2) | `prompt_flash_attention_vector2.h` | AIV | rescale(÷softmax_sum) -> 可选 quant -> 写回 |\n\n在线 FlashSoftmax 对 Skv 轴切分刷新（设计介绍 L13-22）：\n- `exp[i] = e^(max[i-1] - max[i])`\n- `PV[i] = PV[i-1]·exp[i] + PV_new[i]`（PV 累加器按 exp 缩放后累加新分块）\n- `attention_out = PV_final / softmax_sum`\n- 输出 `softmaxLse = log(softmax_sum) + max`（推理，`needs_verification` 精确公式）。\n\n## 4. tiling 与分核（概要，详见 artifact `tiling_dispatch_tables.md`）\n\n- 逻辑轴 B/N2/G/S1/S2，先核内再核间（设计介绍 L49）。\n- Cube 基本块 128×128，Vector 8×1024，nRatio=8（1:16 CV 配比，设计介绍 L59）。\n- S1 factor 默认 128、S2 factor 默认 1024（tiling.cpp L103-106）；值 source-reported，非最优声明。\n- splitCoreMode：`actualSeqLength≥3072 && b·n·sOuter≥coreNum` -> SPLIT_ONEN_CUBE，否则 SPLIT_NBS_CUBE（tiling.cpp L926-932）；负载均衡 `singleCoreSize = ceil(totalSize/coreNum)`（L713）。\n- MLA 触发：`D != Dv` 或 `D > 256`（tiling.cpp L2848），D=576(nope512+rope64)。\n- 空 KV：tilingkey=20（tiling.cpp L73）。\n- arch32 用十进制 tilingkey（~130 宏）；arch35 用结构化枚举模板分发（27 个 ConfigValue）。\n\n## 5. 变体对照\n\n| 变体 | 算子/版本 | 场景与差异 |\n|---|---|---|\n| 训练前向 | flash_attention_score | 训练，输出 softmax_max/sum 供反向 |\n| **推理 prefill** | **prompt_flash_attention (V1)** | 全序列推理，输出 softmaxLse |\n| V2 | aclnnPromptFlashAttentionV2 | 新增 MLA / PagedAttention / 量化扩展 |\n| V3 | aclnnPromptFlashAttentionV3 | 新增 FP8/FP4 / learnableSink / 解耦 RoPE / sharedPrefix |\n| 增量解码 | incre_flash_attention | KV cache 增量（PFA 的 prefill 结果供其复用 lse） |\n\n所有变体共享 QK->FlashSoftmax->PV 骨架；PFA 相对训练 FA 的差异：推理语义、softmaxLse 输出、KV-cache 写回（`vf_flashupdate.h`，写回时机 `needs_verification`）、PagedAttention、量化（deq_scale/antiquant/MSD）、MLA、共享前缀、解耦 RoPE。\n\n## 6. 架构与产品支持（README L5-12；def.cpp L114-127）\n\n| 产品 | 架构 | 支持 | 说明 |\n|---|---|---|---|\n| Atlas A2 训练/推理 | Ascend910B (arch32) | √ | FP16/BF16/INT8；多模板 |\n| Atlas A3 训练/推理 | Ascend910_93 (arch32) | √ | 复用 arch32 kernel |\n| Ascend 950PR/950DT | Ascend950 (arch35) | √ | 服务化结构，模板参数化 |\n| Atlas 推理系列加速卡 | Ascend310P | √ | 仅 FP16（`needs_verification`：精确芯片型号） |\n\nFP8/FP4 仅 V3 且限定 arch；不支持 Atlas 200I/500 A2、Atlas 训练系列（910A）。\n\n## 7. Agent actions\n\n1. 确认目标架构（arch32 A2/A3 vs arch35 950）与 dtype/layout，选择对应模板分发路径。\n2. 按 shape 评估 MLA 分支（D≠Dv 或 D>256）；MLA 下 Q/K 沿 D 拼接 nope+rope（D=576）。\n3. 评估 S2 是否需 FlashSoftmax 在线刷新（S2 大于单块时）。\n4. PagedAttention 场景：通过 blocktable 查物理 KV 偏移做间接 load。\n5. 量化场景：按 QuantMode（per-channel/per-token/MSD）做 cast + scale 融合。\n6. 参考 `technique-flash-attention-pipeline` 安排 CV 流水与 double buffer；参考 `technique-flash-attention-tiling` 的核内/核间切分原则。\n7. Triton 实现参考 `artifacts/prompt-flash-attention/prompt-flash-attention-triton-skeleton.py`（pseudocode）。\n\n## 8. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。tiling 参数数值、流水 bound、UB/L1 占用、FP8/FP4 精度边界、softmaxLse 精确公式、KV-cache flashupdate 写回时机均未经硬件实测。Triton skeleton 标记 `reproducibility: pseudocode`，不可直接编译运行。来源见 `ops-transformer-prompt-flash-attention`。\n\n\n", "ops/rmsnorm-rope.md": "\n\nsources:\n  - url: https://gitcode.com/gcw_85ZVbQ4M/Triton-Ascend-KernelWiki/blob/7d6a67e7f71d1bfb7cc51f66ae139c34ace40e9d/kernelwiki/wiki/kernels/rmsnorm-rope.md\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/rmsnorm-rope.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/gcw_85ZVbQ4M/Triton-Ascend-KernelWiki/blob/7d6a67e7f71d1bfb7cc51f66ae139c34ace40e9d/kernelwiki/wiki/kernels/rmsnorm-rope.md](https://gitcode.com/gcw_85ZVbQ4M/Triton-Ascend-KernelWiki/blob/7d6a67e7f71d1bfb7cc51f66ae139c34ace40e9d/kernelwiki/wiki/kernels/rmsnorm-rope.md)。\n\n# RMSNorm + RoPE\n\nAccumulate the sum of squares in FP32 and convert only at the output boundary. Keep the RoPE even/odd channel pairing explicit. For the documented small-batch, hidden-4096 case, inspect whether lanes access adjacent addresses before changing tile size.\n\n## Agent actions\n\n1. Preserve RMSNorm and RoPE semantics.\n2. Check UB use for input, weight, FP32 temporaries, and output.\n3. Apply a tail mask when the hidden dimension is not tile-aligned.\n4. Compare the current load order with the contiguous hidden dimension.\n5. Validate correctness before accepting a profiling improvement.\n\n\n", "runbooks/algorithm-numerics/exp-stable-softmax-rmsnorm.md": "\n\n## CT-12 exp 稳定化 — softmax/rmsnorm 必须减最大值、fp32 累加\n\n【优化维度】：数值｜数值稳定\n【泛化层级】：Triton通用（迁移条件：所有含 exp、sum、mean、var、rsqrt 的算子；失效边界：输入已被证明绝对值极小且不会溢出时可放宽，但仍建议统一处理）\n\n<原则：fp16 的 `exp(x)` 在 x > 65504 时溢出为 Inf。softmax、attention score、rmsnorm 等算子若直接 `tl.exp(x)` 再求和，结果会 NaN/Inf。正确做法是先把输入减去最大值（数学等价，结果不变），并在 fp32 中完成累加/归约，最后 cast 回 fp16/bf16。>\n\n**softmax 稳定化模板**：\n\n```python\n# 错误：直接 exp\np = tl.exp(x)\ns = tl.sum(p)\n\n# 正确：减最大值 + fp32 累加\nx_fp32 = x.to(tl.float32)\nm = tl.max(x_fp32, axis=0)\np = tl.exp(x_fp32 - m)          # 最大值为 0，不会溢出\ns = tl.sum(p)                   # fp32 累加\nout = (p / s).to(tl.float16)    # 最终 cast 回低精度\n```\n\n**rmsnorm 稳定化模板**：\n\n```python\n# 错误：fp16 累加 + 1/sqrt\nacc = tl.zeros([BLOCK], dtype=tl.float16)\nacc += x * x\ninv_rms = 1.0 / tl.sqrt(mean_sq + eps)\n\n# 正确：fp32 累加 + rsqrt\nx_fp32 = x.to(tl.float32)\nmean_sq = tl.sum(x_fp32 * x_fp32) / N\ninv_rms = tl.rsqrt(mean_sq + eps)   # 比 1/sqrt 精度更好\nout = (x_fp32 * inv_rms * weight).to(tl.float16)\n```\n\n**数值边界**：\n\n| 操作 | fp16 危险区 | 安全做法 |\n|---|---|---|\n| `tl.exp(x)` | x > 11.09（ln(65504)）即可能溢出 | x - max(x) 后再 exp |\n| `tl.sum(fp16)` | 累加多个 fp16 会精度损失/溢出 | fp32 累加器 |\n| `1/tl.sqrt(x)` | 小 x 下精度差 | `tl.rsqrt(x)` |\n| `x / denom` | denom 可能为 0 | `tl.maximum(denom, eps)` |\n\n**坏实践（反例）**：\n```python\np = tl.exp(x)\ns = tl.sum(p)\nout = p / s\n```\n后果：fp16 下大值 exp 溢出为 Inf，softmax 输出 NaN，训练直接崩溃。✅ 正解即减最大值 + fp32 累加。\n\n**诊断清单**：\n1. 模型训练出现 NaN/Inf，优先检查所有 softmax/rmsnorm/attention 算子。\n2. 确认 kernel 内是否有 `tl.exp` 直接作用于原始输入。\n3. 确认归约/累加是否使用 fp32 accumulator。\n4. 用 fp32 参考实现对比，定位首个误差超阈值的位置。\n5. 修复后做 full-sequence 精度回归。\n\n## 已知实例（P3 挂载）\n\n### Experience YAML 反链\n- `exp_stability_001` — 数值稳定性优化 （收益 数值稳定性提升100%）\n  - 适用于所有包含指数运算的场景（如Softmax、注意力分数计算），fp16/bf16下未做该处理易出现exp(>65504)返回Inf，910b2/910b3平台需强制启用该优化\n- `exp_stability_002` — 数值稳定性优化 （收益 数值稳定性提升95%）\n  - 适用于Attention的sqrt(d_k)、均方差计算、梯度平方根等场景；910b2/910b3平台的硬件sqrt指令对负数输入直接返回NaN，必须前置该防护逻辑\n- `exp_stability_003` — 数值精度优化 （收益 计算精度提升（MAE降低80%））\n  - 适用于多层激活、累积求和等复杂计算场景；fp16/bf16的动态范围有限，中间计算易丢失小数位，910b2/910b3平台建议所有核心计算步骤启用float32转换\n- `exp_stability_004` — 数值精度优化 （收益 累加精度提升（MSE降低90%））\n  - 适用于大步数累加、梯度累积、损失求和等场景；fp16累加器在1000次累加后误差可达1e-3，float32累加器误差仅1e-7，910b2/910b3平台建议所有累加操作启用高精度累加器\n\n\n", "runbooks/algorithm-numerics/exp_stability_001.md": "\n\n## exp 前减维度最大值防溢出（safe-exp/softmax 数值稳定）\n\n【优化维度】：数值稳定\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3；失效边界：减最大值是恒等变换（softmax 类归一化下数学等价），但单独求 exp 不归一化的场景会改变数值语义，仅在后续有归一化/对数抵消时使用；fp32 场景 exp 溢出阈值高（约 88.7），输入有界时可省略；精度收益与性能代价：收益=消除 Inf/NaN（fp16 输入 >65504 或中间值 >~11 即溢出），代价=一次 max 归约（可忽略）；MERE/MARE/ULP 误差指标未测定）\n\n### 原则\n- **核心策略**：指数运算前先减去维度内最大值，消除大数指数导致的数值溢出\n- **适配场景**：专门针对fp16/bf16低精度场景，该处理可100%避免exp函数返回Inf/NaN\n- **无性能损耗**：仅增加一次max计算，910b2/910b3平台的硬件max指令耗时可忽略\n\n### 代码/骨架出处\n- `Triton`:\n```python\n@triton.jit def exp_overflow_opt_kernel(input_ptr, output_ptr, n_elements, dim: tl.constexpr=0, blockSize: tl.constexpr=128):\n    pid = triton.program_id(0)\n    offsets = pid * blockSize + tl.arange(0, blockSize)\n    mask = offsets < n_elements\n    \n    # 加载数据\n    data = tl.load(input_ptr + offsets, mask=mask).to(tl.float32)\n    \n    # 核心优化: 减去维度内最大值防止溢出\n    max_val = tl.max(data, axis=dim)  # 按指定维度取最大值\n    stable_data = data - max_val      # 数值稳定化\n    \n    # 指数计算（无溢出风险）\n    exp_data = tl.exp(stable_data)\n    \n    # 存储结果（转回原精度）\n    tl.store(output_ptr + offsets, exp_data.to(tl.float16), mask=mask)\n\n# Softmax场景示例调用\ndef softmax_opt(input_tensor):\n    if not input_tensor.is_contiguous():\n        input_tensor = input_tensor.contiguous()\n    output = torch.empty_like(input_tensor)\n    n_elements = input_tensor.numel()\n    grid = (triton.cdiv(n_elements, 128),)\n    exp_overflow_opt_kernel[grid](input_tensor, output, n_elements, dim=-1, blockSize=128)\n    # 归一化步骤\n    sum_exp = output.sum(dim=-1, keepdim=True)\n    return output / sum_exp\n```\n\n**坏实践（反例）**：适用于所有包含指数运算的场景（如Softmax、注意力分数计算），fp16/bf16下未做该处理易出现exp(>65504)返回Inf，910b2/910b3平台需强制启用该优化\n\n**已知实例**：general_stability §raw (`experiences/general_stability/exp_stability_001.yaml`)\n- 声称性能收益：数值稳定性提升100%\n\n\n", "runbooks/algorithm-numerics/fp32-reduction-accumulator.md": "\n\n## OPT-1 统计归约 fp32 累加器\n\n【优化维度】：数值｜混合精度\n【泛化层级】：Triton通用（迁移条件：归约统计量含小量相乘/求和/除法；失效边界：纯整数归约或对精度不敏感的场景可放宽）\n\n<原则：归一化统计量（mean/var/rstd/inv_std^3）涉及小量相乘、求和、除法，fp16/bf16 累加会在小 spatial size 或数值接近 0 时产生显著精度误差。var 公式 (sq-sum*sum/N)/N 对累加顺序敏感；inv_std^3、1/S 等小量乘法容易下溢。升 fp32 累加可消除这些误差。关联硬件依据：Vector 单元 fp32 累加无额外开销（寄存器位宽足够）。>\n\n<骨架（占位名伪码）：\nsum_acc = tl.full((), 0.0, tl.float32)\nsq_acc = tl.full((), 0.0, tl.float32)\nx = tl.load(input_ptr + offsets, mask=mask, other=0.0).to(tl.float32)\nsum_acc += tl.sum(x, axis=0)\nsq_acc += tl.sum(x * x, axis=0)\nmean = sum_acc / elemCount\nvar = (sq_acc - sum_acc * sum_acc / elemCount) / elemCount\n>\n\n**坏实践（反例）**：用原始 dtype 直接累加\n```python\nx = tl.load(input_ptr + offsets, mask=mask, other=0.0)   # fp16/bf16\nsum_acc += tl.sum(x, axis=0)                              # 低精度累加\nsq_acc += tl.sum(x * x, axis=0)\n```\n后果：var 公式精度损失，rstd 误差导致 verify 失败（小 spatial size 或数值接近 0 时尤为严重）。✅ 正解即本条 fp32 累加器。\n\n**已知实例**：GroupNormSwish §1 N1、AdaptiveInstanceNorm2DBackward §1 N1（`triton-op-generator/template/normalization.md`）\n\n\n", "runbooks/algorithm-numerics/online-softmax-flash-attention.md": "\n\n## OPT-24 Online Softmax / Flash Attention 单遍稳定计算\n\n【优化维度】：数值｜数值稳定\n【泛化层级】：Triton通用（迁移条件：softmax、attention、log-sum-exp 等需要跨块归约的场景；失效边界：序列很短且可一次装入 UB 的简化场景）\n\n<原则：标准 softmax 需要 O(S²) 的 attention 矩阵，大序列时无法放入 UB。Online softmax 在 K/V 循环中维护 running max、running sum 和 running acc，每块只加载当前 K/V block，将内存复杂度降到 O(S)，同时通过减最大值保证 exp 不溢出。>\n\n**Online Softmax 更新公式**：\n\n```\nm_ij = max(m_i, max(scores_block))        # 新的 running max\np = exp(scores_block - m_ij)              # 稳定 exp\nl_ij = sum(p)                             # 局部 denominator\nalpha = exp(m_i - m_ij)                   # 旧和修正因子\nl_i = l_i * alpha + l_ij                 # 修正 running denominator\nacc = acc * alpha + (p @ V_block)        # 修正 running numerator\nm_i = m_ij                               # 更新 running max\n```\n\n最终输出：`output = acc / l_i`\n\n**内存对比**：\n\n| 方法 | Attention 内存 | S=4096, fp16 |\n|---|---|---|\n| 标准 softmax | O(S²) | 32MB |\n| Online softmax | O(S) | ~48KB |\n\n**Triton 模式**：\n\n```python\n@triton.jit\ndef flash_attention_kernel(Q, K, V, Out, ...):\n    m_i = tl.full([BLOCK_M], float('-inf'), dtype=tl.float32)\n    l_i = tl.zeros([BLOCK_M], dtype=tl.float32)\n    acc = tl.zeros([BLOCK_M, BLOCK_D], dtype=tl.float32)\n\n    for k_start in range(0, seq_len, BLOCK_N):\n        k = tl.load(K_ptr + k_start * d + k_offs, mask=k_mask)\n        scores = tl.dot(q, tl.trans(k)) * scale\n\n        m_ij = tl.max(scores, axis=1)\n        m_new = tl.maximum(m_i, m_ij)\n        p = tl.exp(scores - m_new[:, None])\n        l_ij = tl.sum(p, axis=1)\n        alpha = tl.exp(m_i - m_new)\n\n        l_i = l_i * alpha + l_ij\n        v = tl.load(V_ptr + k_start * d + v_offs, mask=v_mask)\n        acc = acc * alpha[:, None] + tl.dot(p.to(tl.float16), v)\n        m_i = m_new\n\n    output = acc / l_i[:, None]\n    tl.store(Out_ptr + ..., output.to(tl.float16), ...)\n```\n\n**关键注意点**：\n\n- `m_i`、`l_i`、`acc` 必须全程 fp32。\n- `p` 与 `v` 的 `tl.dot` 前需 cast 到合适精度（如 fp16）。\n- causal mask 可在 `scores` 处通过 `m_ij` 前的 mask 实现。\n\n**坏实践（反例）**：\n```python\nscores = tl.dot(q, tl.trans(k))\nprobs = tl.softmax(scores)  # 物化整个 S×S attention 矩阵\n```\n后果：大序列 UB overflow，且 exp 可能溢出。✅ 正解即 online softmax 单遍计算。\n\n## 已知实例（P3 挂载）\n\n### Experience YAML 反链\n- `ex

optimization_points:
- cos_sin_reuse: The cos and sin values are loaded once per row (sequence position)
    outside the inner head iteration loops. These values are then reused for all query
    and key heads within that row, significantly reducing redundant global memory
    accesses and bandwidth pressure.
- software_pipelining: The outer loop utilizes the `num_stages` parameter in `tl.range`
    to enable software pipelining. This overlaps the memory loading operations of
    subsequent rows with the arithmetic computation of the current row, effectively
    hiding memory latency.
- head_blocking: The kernel processes query and key heads in fixed-size blocks (`BLOCK_Q`
    and `BLOCK_K`). This tiling strategy ensures that the intermediate data and pointer
    calculations fit within the NPU's Unified Buffer (UB) or registers, preventing
    overflow and maximizing on-chip memory utilization.
performance_boost: 35%
note: This implementation supports both forward and backward passes (controlled by
  `BACKWARD_PASS`). It also handles broadcasting of cos/sin when `cos_bs` is 1.

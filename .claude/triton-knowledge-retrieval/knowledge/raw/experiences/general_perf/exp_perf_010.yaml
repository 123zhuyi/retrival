experience_type: 算子拆分优化
framework_tag:
- Triton
optimization_points:
- 拆分原则: 复杂算子拆分为多个简单kernel，避免单个kernel逻辑过于复杂导致编译/调度开销大
- 拆分逻辑: 按计算阶段拆分（如“特征提取→归一化→激活”拆分为3个kernel），每个kernel专注单一功能
- 性能优势: 拆分后kernel更易适配硬件资源，调度延迟降低，并行度提升
code_snippet:
  Triton: "# 复杂算子拆分示例: 原单个复杂kernel拆分为3个简单kernel\n# 拆分前: 单个kernel包含卷积+归一化+激活（复杂）\n\
    # 拆分后: 3个独立简单kernel\n\n# 简单kernel1: 卷积计算\n@triton.jit\ndef conv_kernel(input_ptr,\
    \ weight_ptr, output_ptr, B, H, W, C, K, BLOCK_SIZE: tl.constexpr=64):\n    #\
    \ 仅实现卷积计算，逻辑简单\n    pid = triton.program_id(0)\n    offsets = pid * BLOCK_SIZE\
    \ + tl.arange(0, BLOCK_SIZE)\n    mask = offsets < B*H*W*C\n    data = tl.load(input_ptr\
    \ + offsets, mask=mask)\n    weight = tl.load(weight_ptr + tl.arange(0, K*K*C)[:K*K*C])\n\
    \    conv_out = tl.dot(data, weight)\n    tl.store(output_ptr + offsets, conv_out,\
    \ mask=mask)\n\n# 简单kernel2: 归一化计算\n@triton.jit\ndef norm_kernel(input_ptr, output_ptr,\
    \ n_elements, mean, std, BLOCK_SIZE: tl.constexpr=64):\n    # 仅实现归一化，逻辑简单\n  \
    \  pid = triton.program_id(0)\n    offsets = pid * BLOCK_SIZE + tl.arange(0, BLOCK_SIZE)\n\
    \    mask = offsets < n_elements\n    data = tl.load(input_ptr + offsets, mask=mask)\n\
    \    norm_out = (data - mean) / (std + 1e-5)\n    tl.store(output_ptr + offsets,\
    \ norm_out, mask=mask)\n\n# 简单kernel3: 激活计算\n@triton.jit\ndef act_kernel(input_ptr,\
    \ output_ptr, n_elements, BLOCK_SIZE: tl.constexpr=64):\n    # 仅实现激活，逻辑简单\n  \
    \  pid = triton.program_id(0)\n    offsets = pid * BLOCK_SIZE + tl.arange(0, BLOCK_SIZE)\n\
    \    mask = offsets < n_elements\n    data = tl.load(input_ptr + offsets, mask=mask)\n\
    \    act_out = tl.nn.gelu(data)\n    tl.store(output_ptr + offsets, act_out, mask=mask)\n\
    \n# 调用逻辑: 依次执行3个简单kernel\ndef forward_complex_op(input_tensor, weight):\n    #\
    \ 步骤1: 卷积\n    conv_out = torch.empty_like(input_tensor)\n    grid_conv = (triton.cdiv(input_tensor.numel(),\
    \ 64),)\n    conv_kernel[grid_conv](input_tensor, weight, conv_out, *input_tensor.shape,\
    \ K=3, BLOCK_SIZE=64)\n    \n    # 步骤2: 归一化\n    norm_out = torch.empty_like(conv_out)\n\
    \    mean, std = conv_out.mean(), conv_out.std()\n    grid_norm = (triton.cdiv(conv_out.numel(),\
    \ 64),)\n    norm_kernel[grid_norm](conv_out, norm_out, conv_out.numel(), mean,\
    \ std, BLOCK_SIZE=64)\n    \n    # 步骤3: 激活\n    final_out = torch.empty_like(norm_out)\n\
    \    grid_act = (triton.cdiv(norm_out.numel(), 64),)\n    act_kernel[grid_act](norm_out,\
    \ final_out, norm_out.numel(), BLOCK_SIZE=64)\n    \n    return final_out"
performance_boost: 25%
note: 适用于包含多阶段计算的复杂算子（如卷积+BN+激活、Attention全流程等），拆分后单个kernel编译时间缩短40%，910b2/910b3平台的调度并行度提升25%以上
version: v1.0

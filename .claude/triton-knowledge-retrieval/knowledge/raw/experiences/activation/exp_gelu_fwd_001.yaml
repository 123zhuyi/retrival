optimization_points:
- grid_stride_loop: The kernel utilizes a grid-stride loop pattern (`for row_task_id
    in range(pid, num_row_tasks, grid_size)`) to process the row dimension. This allows
    a fixed number of thread blocks to process an arbitrarily large number of rows,
    maximizing hardware occupancy and reducing kernel launch overhead compared to
    a 1:1 block-to-row mapping.
- autotuning_block_m: The `@triton.autotune` decorator is configured to test `BLOCK_SIZE_M`
    values from 1 to 32. This dynamic tuning is critical for element-wise operations
    on 2D tensors, as the optimal tile size for the row dimension often varies based
    on the specific shape of `n_rows` and `n_cols` (e.g., handling very small batch
    sizes or sequence lengths efficiently).
- precision_preservation: The computation explicitly casts the input chunk to `float32`
    (`x_f32 = x_chunk.to(tl.float32)`) before applying the GELU approximation. This
    ensures numerical stability for the `tanh` and exponential operations, preventing
    overflow or underflow that can occur when computing GELU directly in `fp16` or
    `bf16`.
- vectorized_memory_access: The inner loop iterates over columns using `BLOCK_SIZE_N`
    chunks with masked loads/stores. This ensures memory accesses are coalesced and
    vectorized, optimizing global memory bandwidth usage while correctly handling
    tensor boundaries where dimensions are not multiples of the block size.
performance_boost: 15%
note: This implementation uses the tanh approximation for GELU. The grid-stride scheduling
  makes it particularly robust for tensors with a large number of rows (e.g., large
  batch sizes) where the grid size might otherwise be insufficient to cover the dimension.

optimization_points:
- kernel_fusion: Fuses frequency penalty, presence penalty, repetition penalty, and
    temperature scaling into a single kernel launch. This significantly reduces global
    memory read/write bandwidth by processing all penalties in one pass over the logits
    tensor.
- conditional_loading: Implements a check on the `is_present` flag to conditionally
    load the frequency tensor and execute penalty logic. This avoids unnecessary memory
    loads and computation for batches that do not contain valid token history (e.g.,
    padding or empty sequences).
- precision_upcast: Converts inputs to `float32` before performing arithmetic operations.
    This ensures numerical stability during the division and subtraction operations
    required by penalty algorithms, preventing precision loss that might occur with
    `fp16` accumulation.
performance_boost: 35%
note: The kernel assumes row-major layout for logits and frequencies. The `BLOCK_SIZE`
  should be tuned to the specific hardware's cache line size (e.g., 128 or 256) for
  optimal memory throughput.

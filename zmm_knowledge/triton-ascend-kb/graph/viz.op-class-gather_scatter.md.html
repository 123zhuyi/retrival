- `140-outer_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/140-outer_kernel.py`）\n- `141-mm_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/141-mm_kernel.py`）\n- `147-matmul_bias_persistent_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/147-matmul_bias_persistent_kernel.py`）\n- `148-linear_persistent_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/148-linear_persistent_kernel.py`）\n- `195-cube1.py` — extracted kernel（source: `raw_experiences/extracted_kernels/195-cube1.py`）\n- `198-cube1.py` — extracted kernel（source: `raw_experiences/extracted_kernels/198-cube1.py`）\n- `240-_m_grouped_matmul_bKmajor_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/240-_m_grouped_matmul_bKmajor_kernel.py`）\n- `241-_m_grouped_matmul_bNmajor_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/241-_m_grouped_matmul_bNmajor_kernel.py`）\n- `242-_k_grouped_matmul_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/242-_k_grouped_matmul_kernel.py`）\n\n\n", "op-class-normalization.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/ops/normalization.md\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/ops/normalization.md` 迁移而来，原始为算子类别设计页，未做内容改写，仅转 OKF frontmatter。\n\n# 归一化算子优化\n\n## 概述\n\n归一化算子对张量的某一维度（通常是隐藏维度）计算统计量（均值、方差、RMS），然后对输入进行标准化变换，并可选地应用仿射变换（weight × norm + bias）。典型算子包括 LayerNorm、RMSNorm、Softmax 以及它们的融合变体。\n\n在 Ascend 910b2/910b3 上，归一化算子优化的核心挑战在于：\n\n1. **数值精度**：fp16/bf16 累加易溢出，需要混合精度策略\n2. **内存容量**：UB（Unified Buffer）约 192KB，超大隐藏维度需要分块处理\n3. **访存效率**：两遍扫描（two-pass）可以通过在线算法压缩为一遍，减少 HBM 读取次数\n4. **融合机会**：skip-add、残差更新、量化等操作与归一化高度可融合\n\n## 检测标准\n\n满足以下任意模式时，将算子归类为 normalization：\n\n- `mean` / `var` / `rms` 后跟 `(x - mean) / std` 或 `x / rms` 的标准化变换\n- `weight * norm + bias` 仿射变换（与标准化紧密耦合）\n- `rsqrt(var + eps)` 出现在计算图中\n- 独立的 `softmax`（沿某维度的 exp + sum_reduce + div）\n- PyTorch 原语：`F.layer_norm`、`F.rms_norm`、`F.softmax`、`torch.nn.LayerNorm`\n\n## 适用条件\n\n| 条件 | 说明 |\n|------|------|\n| 数据类型 | 输入 fp16/bf16；累加必须 fp32；输出可 fp16/bf16/int8（量化） |\n| 隐藏维度 n_cols | n_cols ≤ UB 容量（~192KB / dtype_bytes）时可单 tile 处理；否则需列分块 |\n| 批量维度 n_rows | 通常每个 program 处理一行，grid=(n_rows,) |\n| weight/bias | 可缓存在寄存器中（当 n_cols 较小时），避免重复从 HBM 加载 |\n| 与残差结合 | skip-add + norm 可融合为单内核，消除中间张量 |\n\n## 经验路由\n\n| 场景 | 经验ID | 提升% | 关键技术 | 内核参考 |\n|------|--------|-------|----------|----------|\n| RMSNorm 基础优化 | exp_rmsnorm_001 | 25% | fp32 混合精度累加，weight 缓存寄存器 | kernel 045, 051 |\n| RMSNorm 大批量 | exp_rmsnorm_001 | 35% | Persistent kernel，grid=num_aicores，weight 仅加载一次 | kernel 086 |\n| Skip + LayerNorm 融合 | exp_skip_layernorm_001 | 30% | 跳跃连接 add 与 LayerNorm 融合，两遍在寄存器内完成 | kernel 118 |\n| 残差原位更新 + RMSNorm | exp_fused_rms_norm_001 | 35% | 计算方差时同步完成残差原位更新 | kernel 115 |\n| 超大隐藏维度 RMSNorm | exp_rmsnorm_npu_001 | 35% | UB 列分块（BLOCK_SIZE_N），两遍遍历 | kernel 093 |\n| RMSNorm + 量化 | exp_rmsnorm_fused_quant_001 | 50% | 归一化与量化在单内核融合 | kernel 189 |\n| LayerNorm 条件分支 | exp_layernorm_fwd_001 | 30% | constexpr HAS_BIAS/HAS_RESIDUAL 编译期分支消除 | kernel 150 |\n| NPU SIMD + LayerNorm + 门控 | exp_layernorm_npu_simd_001 | 35% | NPU SIMD 指令 + LayerNorm + gating 融合 | kernel 180 |\n| Gemma 风格 RMSNorm | exp_gemma_rmsnorm_001 | 35% | (1 + weight) × norm 融合计算 | kernel 190 |\n| Q/K 双路 RMSNorm | exp_fused_split_qk_norm_001 | 35% | Q 和 K 的 RMSNorm 在单内核内并行完成 | kernel 191 |\n| Softmax 单遍 | exp_online_softmax_001 | 35% | log-sum-exp trick 单遍 softmax | — |\n| 均值+方差单遍 | exp_online_mean_var_001 | 30% | Welford 在线算法，均值和方差一遍完成 | — |\n| RMS 单遍 | exp_online_rms_001 | 25% | 单遍 RMS 计算 | — |\n| LayerNorm Welford | exp_layernorm_single_pass_001 | 30% | Welford 用于 LayerNorm，单遍输入扫描 | kernel 181 |\n\n## 关键技术\n\n### 混合精度累加\n\nfp16/bf16 的动态范围不足以安全累加大量平方项（`sum(x²)`），必须在 fp32 中累加：\n\n```python\n@triton.jit\ndef rmsnorm_kernel(x_ptr, w_ptr, y_ptr, n_cols, eps,\n                   BLOCK_SIZE: tl.constexpr):\n    row = tl.program_id(0)\n    x_row_ptr = x_ptr + row * n_cols\n\n    # Pass 1: 以 fp32 累加 sum(x^2)\n    acc = tl.zeros([BLOCK_SIZE], dtype=tl.float32)\n    for col_start in range(0, n_cols, BLOCK_SIZE):\n        cols = col_start + tl.arange(0, BLOCK_SIZE)\n        mask = cols < n_cols\n        x = tl.load(x_row_ptr + cols, mask=mask, other=0.0)\n        x_fp32 = x.to(tl.float32)          # 提升到 fp32\n        acc += x_fp32 * x_fp32\n\n    var = tl.sum(acc) / n_cols\n    rrms = tl.rsqrt(var + eps)             # 硬件 rsqrt 指令\n\n    # Pass 2: 归一化 + 仿射变换\n    # （weight 可在寄存器中缓存，若 n_cols 足够小）\n    for col_start in range(0, n_cols, BLOCK_SIZE):\n        cols = col_start + tl.arange(0, BLOCK_SIZE)\n        mask = cols < n_cols\n        x = tl.load(x_row_ptr + cols, mask=mask, other=0.0).to(tl.float32)\n        w = tl.load(w_ptr + cols, mask=mask, other=1.0).to(tl.float32)\n        y = (x * rrms) * w\n        tl.store(y_ptr + row * n_cols + cols, y.to(tl.float16), mask=mask)\n```\n\n### rsqrt 替代 1/sqrt\n\nAscend 提供硬件 `rsqrt` 指令，比 `1 / sqrt(x)` 快显著：\n\n```python\n# 低效\ninv_std = 1.0 / tl.sqrt(var + eps)\n\n# 高效：使用硬件 rsqrt 指令\ninv_std = tl.rsqrt(var + eps)\n```\n\n### UB 列分块（Column Blocking）\n\n当 `n_cols × dtype_bytes > ~192KB` 时，单 tile 无法放入 UB，必须分块两遍扫描：\n\n```python\n@triton.jit\ndef rmsnorm_large_hidden_kernel(x_ptr, w_ptr, y_ptr, n_cols, eps,\n                                 BLOCK_SIZE_N: tl.constexpr):\n    row = tl.program_id(0)\n    x_row = x_ptr + row * n_cols\n\n    # Pass 1: 分块计算 sum(x^2)\n    var_acc = tl.zeros([1], dtype=tl.float32)\n    for col_start in range(0, n_cols, BLOCK_SIZE_N):\n        cols = col_start + tl.arange(0, BLOCK_SIZE_N)\n        mask = cols < n_cols\n        x = tl.load(x_row + cols, mask=mask, other=0.0).to(tl.float32)\n        var_acc += tl.sum(x * x)\n    var = var_acc / n_cols\n    rrms = tl.rsqrt(var + eps)\n\n    # Pass 2: 分块归一化\n    for col_start in range(0, n_cols, BLOCK_SIZE_N):\n        cols = col_start + tl.arange(0, BLOCK_SIZE_N)\n        mask = cols < n_cols\n        x = tl.load(x_row + cols, mask=mask, other=0.0).to(tl.float32)\n        w = tl.load(w_ptr + cols, mask=mask, other=1.0).to(tl.float32)\n        y = x * rrms * w\n        tl.store(y_ptr + row * n_cols + cols, y.to(tl.float16), mask=mask)\n```\n\n**BLOCK_SIZE_N 推荐值**（910b2，UB ~192KB）：\n\n| 数据类型 | 最大 BLOCK_SIZE_N |\n|----------|------------------|\n| fp16 / bf16 (2B) | ~49152 元素 |\n| fp32 (4B) | ~24576 元素 |\n\n### Online Softmax（单遍 log-sum-exp）\n\n传统 softmax 需要两遍（先求 max，再求 exp+sum），在线算法可在单遍完成：\n\n```python\n@triton.jit\ndef online_softmax_kernel(x_ptr, y_ptr, n_cols, BLOCK_SIZE: tl.constexpr):\n    row = tl.program_id(0)\n    x_row = x_ptr + row * n_cols\n\n    # 单遍：同时维护 running max 和 running sum\n    running_max = tl.full([1], float('-inf'), dtype=tl.float32)\n    running_sum = tl.zeros([1], dtype=tl.float32)\n\n    for col_start in range(0, n_cols, BLOCK_SIZE):\n        cols = col_start + tl.arange(0, BLOCK_SIZE)\n        mask = cols < n_cols\n        x = tl.load(x_row + cols, mask=mask, other=float('-inf')).to(tl.float32)\n        block_max = tl.max(x)\n        new_max = tl.maximum(running_max, block_max)\n        # 更新 running_sum 时补偿 max 变化\n        running_sum = running_sum * tl.exp(running_max - new_max) + \\\n                      tl.sum(tl.exp(x - new_max))\n        running_max = new_max\n\n    # 写回归一化结果\n    log_sum = tl.log(running_sum) + running_max   # log-sum-exp\n    for col_start in range(0, n_cols, BLOCK_SIZE):\n        cols = col_start + tl.arange(0, BLOCK_SIZE)\n        mask = cols < n_cols\n        x = tl.load(x_row + cols, mask=mask, other=float('-inf')).to(tl.float32)\n        y = tl.exp(x - log_sum)\n        tl.store(y_ptr + row * n_cols + cols, y.to(tl.float16), mask=mask)\n```\n\n### Welford 在线均值/方差\n\nWelford 算法单遍稳定计算均值和方差，避免数值不稳定：\n\n```python\n# Welford 在线更新（在 BLOCK_SIZE 维度上应用）\nmean = tl.zeros([1], dtype=tl.float32)\nm2 = tl.zeros([1], dtype=tl.float32)\ncount = tl.zeros([1], dtype=tl.float32)\n\nfor col_start in range(0, n_cols, BLOCK_SIZE):\n    cols = col_start + tl.arange(0, BLOCK_SIZE)\n    mask = cols < n_cols\n    x = tl.load(x_ptr + cols, mask=mask, other=0.0).to(tl.float32)\n    block_count = tl.sum(mask.to(tl.float32))\n    block_mean = tl.sum(x * mask) / block_count\n    # Welford 合并\n    delta = block_mean - mean\n    count += block_count\n    mean += delta * block_count / count\n    m2 += tl.sum((x - mean) * (x - block_mean) * mask)\n\nvar = m2 / count\n```\n\n### Persistent Kernel + Weight 缓存\n\n对 n_rows 很大的情况，持久化内核使 weight 仅加载一次：\n\n```python\n@triton.jit\ndef persistent_rmsnorm_kernel(x_ptr, w_ptr, y_ptr, n_rows, n_cols, eps,\n                               BLOCK_SIZE: tl.constexpr):\n    pid = tl.program_id(0)\n    num_progs = tl.num_programs(0)\n\n    # weight 在寄存器中缓存（每个 program 只加载一次）\n    cols = tl.arange(0, BLOCK_SIZE)\n    mask_w = cols < n_cols\n    w = tl.load(w_ptr + cols, mask=mask_w, other=1.0).to(tl.float32)\n\n    # grid-stride 循环处理所有行\n    for row in range(pid, n_rows, num_progs):\n        x_row = x_ptr + row * n_cols\n        # ... 计算 RMSNorm ...\n        var = tl.sum(x_fp32 * x_fp32) / n_cols\n        rrms = tl.rsqrt(var + eps)\n        y = x_fp32 * rrms * w\n        tl.store(y_ptr + row * n_cols + cols, y.to(tl.float16), mask=mask_w)\n\n# 启动：grid 固定为 AI Core 数量\ngrid = (NUM_AI_CORES,)\n```\n\n### constexpr 标志消除编译期分支\n\n使用 `tl.constexpr` 标志在编译期消除 HAS_BIAS、HAS_RESIDUAL 等条件分支，避免运行时 branch 开销：\n\n```python\n@triton.jit\ndef layernorm_kernel(x_ptr, residual_ptr, w_ptr, b_ptr, y_ptr,\n                     n_cols, eps,\n                     HAS_BIAS: tl.constexpr,\n                     HAS_RESIDUAL: tl.constexpr,\n                     BLOCK_SIZE: tl.constexpr):\n    row = tl.program_id(0)\n    cols = tl.arange(0, BLOCK_SIZE)\n    mask = cols < n_cols\n\n    x = tl.load(x_ptr + row * n_cols + cols, mask=mask).to(tl.float32)\n\n    if HAS_RESIDUAL:  # 编译期展开，无运行时开销\n        res = tl.load(residual_ptr + row * n_cols + cols, mask=mask).to(tl.float32)\n        x = x + res\n\n    mean = tl.sum(x) / n_cols\n    var = tl.sum((x - mean) * (x - mean)) / n_cols\n    x_norm = (x - mean) * tl.rsqrt(var + eps)\n\n    w = tl.load(w_ptr + cols, mask=mask).to(tl.float32)\n    y = x_norm * w\n\n    if HAS_BIAS:      # 编译期展开\n        b = tl.load(b_ptr + cols, mask=mask).to(tl.float32)\n        y = y + b\n\n    tl.store(y_ptr + row * n_cols + cols, y.to(tl.float16), mask=mask)\n```\n\n### RMSNorm + 量化融合\n\n归一化结果直接量化为 int8，消除中间 fp16 张量的写回（50% 提升）：\n\n```python\n@triton.jit\ndef rmsnorm_quant_fused_kernel(x_ptr, w_ptr, scale_ptr, y_int8_ptr,\n                                n_cols, eps, BLOCK_SIZE: tl.constexpr):\n    row = tl.program_id(0)\n    cols = tl.arange(0, BLOCK_SIZE)\n    mask = cols < n_cols\n\n    x = tl.load(x_ptr + row * n_cols + cols, mask=mask).to(tl.float32)\n    w = tl.load(w_ptr + cols, mask=mask).to(tl.float32)\n\n    var = tl.sum(x * x) / n_cols\n    rrms = tl.rsqrt(var + eps)\n    y_norm = x * rrms * w\n\n    # 直接量化为 int8，无中间 HBM 写回\n    scale = tl.load(scale_ptr)\n    y_int8 = tl.clamp(tl.round(y_norm / scale), -128, 127).to(tl.int8)\n    tl.store(y_int8_ptr + row * n_cols + cols, y_int8, mask=mask)\n```\n\n## 常见陷阱\n\n| 陷阱 | 说明 | 解决方案 |\n|------|------|----------|\n| fp16 累加溢出 | `sum(x²)` 在 fp16 下对大 n_cols 易溢出 | 始终在 fp32 下累加（exp_rmsnorm_001） |\n| UB 溢出 | n_cols > UB 容量时编译失败或性能骤降 | 使用列分块（exp_rmsnorm_npu_001），BLOCK_SIZE_N ≤ 49152（fp16） |\n| 两遍 HBM 读取 | 传统两遍算法读两次输入，带宽受限 | 使用 Welford / 在线算法单遍完成（exp_online_*） |\n| weight 重复加载 | 每行都从 HBM 加载 weight，造成大量冗余访问 | Persistent kernel 将 weight 缓存在寄存器（exp_rmsnorm_001 kernel 086） |\n| softmax 数值不稳定 | 未减 max 直接 exp 导致溢出 | 使用 log-sum-exp trick（exp_online_softmax_001） |\n| 独立的 skip-add 内核 | add + norm 分开执行，多一次 HBM 往返 | 融合 skip-add + LayerNorm（exp_skip_layernorm_001） |\n| 忽略 eps 的精度影响 | 极小 var 时 rsqrt 精度不足 | eps 使用 fp32 精度，不随输入 dtype 降精度 |\n\n## 代码模板\n\n### 标准 RMSNorm 模板\n\n```python\nimport torch\nimport triton\nimport triton.language as tl\n\n@triton.jit\ndef rmsnorm_kernel(\n    x_ptr, w_ptr, y_ptr,\n    n_rows, n_cols,\n    eps,\n    BLOCK_SIZE: tl.constexpr,\n):\n    row = tl.program_id(0)\n    x_row = x_ptr + row * n_cols\n    y_row = y_ptr + row * n_cols\n\n    cols = tl.arange(0, BLOCK_SIZE)\n    mask = cols < n_cols\n\n    # 加载并提升到 fp32\n    x = tl.load(x_row + cols, mask=mask, other=0.0).to(tl.float32)\n    w = tl.load(w_ptr + cols, mask=mask, other=1.0).to(tl.float32)\n\n    # 计算 RMS\n    var = tl.sum(x * x) / n_cols\n    rrms = tl.rsqrt(var + eps)\n\n    # 归一化 + 仿射\n    y = x * rrms * w\n\n    tl.store(y_row + cols, y.to(tl.float16), mask=mask)\n\n\ndef rmsnorm(x: torch.Tensor, weight: torch.Tensor, eps: float = 1e-6) -> torch.Tensor:\n    x = x.contiguous()\n    n_rows, n_cols = x.shape\n    y = torch.empty_like(x)\n    # BLOCK_SIZE 需满足 BLOCK_SIZE >= n_cols 且为 2 的幂\n    BLOCK_SIZE = triton.next_power_of_2(n_cols)\n    assert BLOCK_SIZE <= 65536, f\"n_cols={n_cols} 超出单 tile UB 容量，需列分块\"\n    rmsnorm_kernel[(n_rows,)](x, weight, y, n_rows, n_cols, eps, BLOCK_SIZE=BLOCK_SIZE)\n    return y\n```\n\n### Skip + LayerNorm 融合模板\n\n```python\n@triton.jit\ndef skip_layernorm_kernel(\n    x_ptr, residual_ptr, w_ptr, b_ptr,\n    y_ptr, residual_out_ptr,\n    n_cols, eps,\n    BLOCK_SIZE: tl.constexpr,\n    HAS_BIAS: tl.constexpr,\n):\n    row = tl.program_id(0)\n    cols = tl.arange(0, BLOCK_SIZE)\n    mask = cols < n_cols\n\n    x = tl.load(x_ptr + row * n_cols + cols, mask=mask).to(tl.float32)\n    res = tl.load(residual_ptr + row * n_cols + cols, mask=mask).to(tl.float32)\n\n    # skip add（在寄存器内完成）\n    x = x + res\n\n    # 可选：写回残差（供下一层使用）\n    tl.store(residual_out_ptr + row * n_cols + cols, x.to(tl.float16), mask=mask)\n\n    # LayerNorm\n    mean = tl.sum(x) / n_cols\n    var = tl.sum((x - mean) * (x - mean)) / n_cols\n    x_norm = (x - mean) * tl.rsqrt(var + eps)\n\n    w = tl.load(w_ptr + cols, mask=mask).to(tl.float32)\n    y = x_norm * w\n    if HAS_BIAS:\n        b = tl.load(b_ptr + cols, mask=mask).to(tl.float32)\n        y = y + b\n\n    tl.store(y_ptr + row * n_cols + cols, y.to(tl.float16), mask=mask)\n```\n\n## 相关页面\n\n- [elementwise.md](op-class-elementwise.md) — 归一化中的仿射变换（weight × norm + bias）本质是 elementwise 操作\n- [reduction.md](op-class-reduction.md) — 归一化内部的 sum、max 等归约原语\n- [gather_scatter.md](op-class-gather_scatter.md) — MoE 场景中，Expert 归一化（Q/K RMSNorm）与 gather/scatter 结合\n\n## 反向传播经验\n\n| 场景 | 经验ID | 关键技术 | 经验文件 |\n|------|--------|----------|----------|\n| RMSNorm 反向 | exp_rmsnorm_backward_001 | 基础 RMSNorm dX/dW 计算 | yaml |\n| RMSNorm 反向（NPU） | exp_rmsnorm_backward_npu_001 | Ascend 910b 专用反向路径 | yaml |\n| RMSNorm 反向（分块） | exp_rmsnorm_backward_tiled_001 | 大列维度分块反向 | yaml |\n| RMSNorm 反向（大列） | exp_rmsnorm_bwd_large_cols_001 | 超 UB 列维度的反向 | yaml |\n| RMSNorm bwd 基础 | exp_rmsnorm_bwd_001 | RMSNorm bwd 标准实现 | yaml |\n| RMSNorm bwd 融合 | exp_rmsnorm_bwd_fused_001 | RMSNorm bwd 与其他算子融合 | yaml |\n| LayerNorm 反向 | exp_layernorm_bwd_001 | LayerNorm dX/dW/dB | yaml |\n| LayerNorm 反向融合 | exp_layernorm_bwd_fused_001 | LayerNorm bwd + residual 融合 | yaml |\n| GroupNorm 反向 | exp_gn_backward_001 | GroupNorm dX/dW/dB | yaml |\n\n## 推理与变体经验\n\n| 场景 | 经验ID | 关键技术 | 经验文件 |\n|------|--------|----------|----------|\n| RMSNorm 推理优化 | exp_rmsnorm_infer_001 | 推理专用路径，跳过训练相关计算 | yaml |\n| RMSNorm 无 Tiling | exp_rmsnorm_notiling_001 | 小列维度直接计算，无需分块 | yaml |\n| RMSNorm KV 归一化 | exp_rmsnorm_kv_001 | KV cache 归一化专项优化 | yaml |\n| RMSNorm + Add | exp_rmsnorm_add_001 | RMSNorm 与 residual add 融合 | yaml |\n| RMSNorm + RoPE | exp_rmsnorm_rope_001 | RMSNorm 与 RoPE 顺序融合 | yaml |\n\n## 已知实例（P3 挂载）\n\n### Extracted Kernel 反链\n- `041-fused_matmul_ckvkr_and_rms_norm_cq_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/041-fused_matmul_ckvkr_and_rms_norm_cq_kernel.py`）\n- `045-rms_norm_ckv_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/045-rms_norm_ckv_kernel.py`）\n- e.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/ops/reduction.md\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/ops/reduction.md` 迁移而来，原始为算子类别设计页，未做内容改写，仅转 OKF frontmatter。\n\n# 归约算子优化\n\n## 概述\n\n归约算子沿指定维度将多个元素合并为更少的输出元素，典型操作包括 sum、max、min、argmax、logsumexp 等。在深度学习推理/训练中，归约广泛出现于 softmax、cross-entropy loss、LayerNorm、split-K matmul 等场景。\n\n在 Ascend 910b2/910b3 上，归约算子优化的核心挑战为：\n\n1. **数值精度**：fp16/bf16 累加易溢出，尤其对 logsumexp 等涉及 exp 的场景\n2. **并行度**：大 K 维度归约（K ≥ 4096）需要跨核并行（split-K）充分利用全部 AI Core\n3. **多遍开销**：在线算法可将两遍/多遍归约压缩为单遍，减少 HBM 带宽消耗\n4. **联合归约**：argmax+max 等联合操作可在单遍中同时完成，避免重复扫描\n\n## 检测标准\n\n满足以下任意模式时，将算子归类为 reduction：\n\n- Triton 原语：`tl.sum`、`tl.max`、`tl.min`、`tl.reduce`\n- PyTorch 原语（含 `dim=` 参数）：`torch.sum(dim=)`、`torch.mean(dim=)`、`torch.max(dim=)`、`torch.logsumexp(dim=)`\n- 输出张量维度少于输入张量（沿某维度折叠）\n- split-K 并行归约模式（多核写入部分和，再全局合并）\n- 间接归约：cross-entropy（含 log-softmax）、histogram（含原子 binning）、cumsum（前缀扫描）\n\n## 适用条件\n\n| 条件 | 说明 |\n|------|------|\n| 数据类型 | 输入 fp16/bf16；累加必须 fp32 以避免溢出 |\n| 归约维度大小 K | K ≥ 4096 时 split-K 收益显著；K < 256 时单核即可 |\n| 并行维度大小 M | M 足够大时每行分配一个 program；M 小时用 persistent kernel |\n| logsumexp 场景 | 必须使用 log-sum-exp trick（先减 max 再 exp），防止 exp 溢出 |\n| split-K 场景 | 需要额外的全局 reduction buffer（fp32 累加），或使用两阶段方案 |\n\n## 经验路由\n\n| 场景 | 经验ID | 提升% | 关键技术 | 来源文件 |\n|------|--------|-------|----------|----------|\n| fp16/bf16 输入累加溢出 | exp_reduction_fp32_001 | 30% | fp32 累加（提升精度同时提升性能） | numerical_stability.md |\n| logsumexp 数值不稳定 | exp_reduction_logsumexp_001 | 35% | log-sum-exp trick：先减全局 max | numerical_stability.md |\n| exp 溢出保护 | exp_reduction_exp_protection_001 | 25% | exp 前减去局部 max，防止数值溢出 | numerical_stability.md |\n| cross-entropy 计算 | exp_reduction_cross_entropy_001 | 30% | 融合 log-softmax + cross-entropy | numerical_stability.md |\n| argmax 与 max 联合 | exp_reduction_argmax_001 | 25% | 单遍同时计算 max 值和 argmax 索引 | numerical_stability.md |\n| 大 K 并行（K≥4096） | exp_splitk_reduction_001 | 35% | split-K：K 维按核划分 + atomic_add 归约 | parallel_reduction.md |\n| 大 K 两阶段方案 | exp_splitk_two_pass_001 | 40% | Phase1 部分和，Phase2 全局规约 | parallel_reduction.md |\n| 超大张量多遍规约 | exp_multipass_reduction_001 | 30% | 多遍递进规约（层次化） | parallel_reduction.md |\n| 直方图原子 binning | exp_histogram_reduction_001 | 25% | 原子操作 binning，寄存器局部聚合后写回 | parallel_reduction.md |\n| 累加和（前缀扫描） | exp_cumsum_001 | 25% | scan primitive 实现 cumsum | parallel_reduction.md |\n\n## 关键技术\n\n### FP32 累加（避免溢出）\n\nfp16 最大值约 65504，在大 K 场景下累加极易溢出；bf16 精度更低（7 位尾数）。始终在 fp32 中累加：\n\n```python\n@triton.jit\ndef sum_kernel(x_ptr, y_ptr, M, K, BLOCK_K: tl.constexpr):\n    row = tl.program_id(0)\n    x_row = x_ptr + row * K\n\n    acc = tl.zeros([BLOCK_K], dtype=tl.float32)  # fp32 累加器\n    for k_start in range(0, K, BLOCK_K):\n        k_offs = k_start + tl.arange(0, BLOCK_K)\n        mask = k_offs < K\n        x = tl.load(x_row + k_offs, mask=mask, other=0.0)\n        acc += x.to(tl.float32)          # 提升到 fp32\n\n    result = tl.sum(acc)\n    tl.store(y_ptr + row, result.to(tl.float16))\n```\n\n### Log-Sum-Exp Trick\n\n直接计算 `log(sum(exp(x)))` 在大值输入时 exp 溢出。通过减去全局 max 保证数值稳定：\n\n```\nlog(sum(exp(x_i)))\n= log(sum(exp(x_i - max_x) * exp(max_x)))\n= max_x + log(sum(exp(x_i - max_x)))\n```\n\n```python\n@triton.jit\ndef logsumexp_kernel(x_ptr, y_ptr, M, K, BLOCK_K: tl.constexpr):\n    row = tl.program_id(0)\n    x_row = x_ptr + row * K\n\n    # Pass 1: 求全局 max\n    max_val = tl.full([1], float('-inf'), dtype=tl.float32)\n    for k_start in range(0, K, BLOCK_K):\n        k_offs = k_start + tl.arange(0, BLOCK_K)\n        mask = k_offs < K\n        x = tl.load(x_row + k_offs, mask=mask, other=float('-inf')).to(tl.float32)\n        max_val = tl.maximum(max_val, tl.max(x))\n\n    # Pass 2: 减去 max 后 exp + sum\n    sum_exp = tl.zeros([1], dtype=tl.float32)\n    for k_start in range(0, K, BLOCK_K):\n        k_offs = k_start + tl.arange(0, BLOCK_K)\n        mask = k_offs < K\n        x = tl.load(x_row + k_offs, mask=mask, other=float('-inf')).to(tl.float32)\n        sum_exp += tl.sum(tl.exp(x - max_val) * mask.to(tl.float32))\n\n    y = max_val + tl.log(sum_exp)\n    tl.store(y_ptr + row, y.to(tl.float32))\n```\n\n### Split-K 并行归约（atomic_add 方案）\n\n对 K ≥ 4096 的归约，将 K 维拆分到多个 AI Core，用 atomic_add 直接归约（exp_splitk_reduction_001，35% 提升）：\n\n```python\n@triton.jit\ndef splitk_atomic_kernel(x_ptr, y_ptr, M, K,\n                          BLOCK_K: tl.constexpr,\n                          SPLIT: tl.constexpr):\n    # grid = (M, SPLIT)\n    row = tl.program_id(0)\n    split_id = tl.program_id(1)\n\n    k_per_split = tl.cdiv(K, SPLIT)\n    k_start = split_id * k_per_split\n    k_end = tl.minimum(k_start + k_per_split, K)\n\n    acc = tl.zeros([BLOCK_K], dtype=tl.float32)\n    for k in range(k_start, k_end, BLOCK_K):\n        k_offs = k + tl.arange(0, BLOCK_K)\n        mask = k_offs < k_end\n        x = tl.load(x_ptr + row * K + k_offs, mask=mask, other=0.0).to(tl.float32)\n        acc += x\n\n    partial_sum = tl.sum(acc)\n    # 原子加到输出（自动全局归约）\n    tl.atomic_add(y_ptr + row, partial_sum)\n\n\ndef splitk_reduction(x: torch.Tensor) -> torch.Tensor:\n    M, K = x.shape\n    y = torch.zeros(M, dtype=torch.float32, device=x.device)\n    SPLIT = min(32, triton.cdiv(K, 128))  # 根据 K 大小动态确定 SPLIT\n    BLOCK_K = 128\n    grid = (M, SPLIT)\n    splitk_atomic_kernel[grid](x, y, M, K, BLOCK_K=BLOCK_K, SPLIT=SPLIT)\n    return y.to(x.dtype)\n```\n\n### Split-K 两阶段方案（exp_splitk_two_pass_001，40% 提升）\n\natomic_add 有竞争开销。两阶段方案：Phase 1 各核写入独立 partial buffer；Phase 2 单独内核做最终归约：\n\n```python\n@triton.jit\ndef splitk_phase1_kernel(x_ptr, partial_ptr, M, K,\n                          BLOCK_K: tl.constexpr,\n                          SPLIT: tl.constexpr):\n    row = tl.program_id(0)\n    split_id = tl.program_id(1)\n    k_per_split = tl.cdiv(K, SPLIT)\n    k_start = split_id * k_per_split\n    k_end = tl.minimum(k_start + k_per_split, K)\n\n    acc = tl.zeros([BLOCK_K], dtype=tl.float32)\n    for k in range(k_start, k_end, BLOCK_K):\n        k_offs = k + tl.arange(0, BLOCK_K)\n        mask = k_offs < k_end\n        x = tl.load(x_ptr + row * K + k_offs, mask=mask, other=0.0).to(tl.float32)\n        acc += x\n\n    # 写入 partial buffer：shape [M, SPLIT]\n    tl.store(partial_ptr + row * SPLIT + split_id, tl.sum(acc))\n\n\n@triton.jit\ndef splitk_phase2_kernel(partial_ptr, y_ptr, M, SPLIT,\n                          BLOCK_SPLIT: tl.constexpr):\n    row = tl.program_id(0)\n    split_offs = tl.arange(0, BLOCK_SPLIT)\n    mask = split_offs < SPLIT\n    partials = tl.load(partial_ptr + row * SPLIT + split_offs, mask=mask, other=0.0)\n    tl.store(y_ptr + row, tl.sum(partials))\n```\n\n### 联合 Argmax + Max（单遍）\n\n单遍同时维护最大值及其索引，避免两遍扫描（exp_reduction_argmax_001，25% 提升）：\n\n```python\n@triton.jit\ndef argmax_kernel(x_ptr, val_ptr, idx_ptr, M, K, BLOCK_K: tl.constexpr):\n    row = tl.program_id(0)\n    x_row = x_ptr + row * K\n\n    running_max = tl.full([1], float('-inf'), dtype=tl.float32)\n    running_idx = tl.zeros([1], dtype=tl.int32)\n\n    for k_start in range(0, K, BLOCK_K):\n        k_offs = k_start + tl.arange(0, BLOCK_K)\n        mask = k_offs < K\n        x = tl.load(x_row + k_offs, mask=mask, other=float('-inf')).to(tl.float32)\n\n        block_max = tl.max(x)\n        # 找到 block 内 argmax\n        is_max = (x == block_max) & mask\n        block_idx = tl.sum(tl.where(is_max, k_offs, 0))\n\n        # 与全局 running max 合并\n        update = block_max > running_max\n        running_max = tl.where(update, block_max, running_max)\n        running_idx = tl.where(update, block_idx, running_idx)\n\n    tl.store(val_ptr + row, running_max.to(tl.float16))\n    tl.store(idx_ptr + row, running_idx)\n```\n\n### Fused Cross-Entropy（含 log-softmax）\n\ncross-entropy 与 log-softmax 融合：单遍计算 logsumexp，直接输出 loss，无需中间 softmax 张量（exp_reduction_cross_entropy_001，30% 提升）：\n\n```python\n@triton.jit\ndef cross_entropy_kernel(logits_ptr, labels_ptr, loss_ptr,\n                          M, V, BLOCK_V: tl.constexpr):\n    row = tl.program_id(0)\n    logits_row = logits_ptr + row * V\n\n    # Pass 1: max（数值稳定）\n    max_val = tl.full([1], float('-inf'), dtype=tl.float32)\n    for v_start in range(0, V, BLOCK_V):\n        v_offs = v_start + tl.arange(0, BLOCK_V)\n        mask = v_offs < V\n        x = tl.load(logits_row + v_offs, mask=mask, other=float('-inf')).to(tl.float32)\n        max_val = tl.maximum(max_val, tl.max(x))\n\n    # Pass 2: sum(exp(x - max))\n    sum_exp = tl.zeros([1], dtype=tl.float32)\n    for v_start in range(0, V, BLOCK_V):\n        v_offs = v_start + tl.arange(0, BLOCK_V)\n        mask = v_offs < V\n        x = tl.load(logits_row + v_offs, mask=mask, other=float('-inf')).to(tl.float32)\n        sum_exp += tl.sum(tl.exp(x - max_val) * mask.to(tl.float32))\n\n    log_sum_exp = max_val + tl.log(sum_exp)\n\n    # 取 ground truth logit\n    label = tl.load(labels_ptr + row)\n    gt_logit = tl.load(logits_row + label).to(tl.float32)\n\n    loss = log_sum_exp - gt_logit\n    tl.store(loss_ptr + row, loss.to(tl.float32))\n```\n\n### Cumulative Sum（前缀扫描）\n\n使用 scan primitive 实现 cumsum（exp_cumsum_001，25% 提升）：\n\n```python\n@triton.jit\ndef cumsum_kernel(x_ptr, y_ptr, N, BLOCK_SIZE: tl.constexpr):\n    pid = tl.program_id(0)\n    offsets = pid * BLOCK_SIZE + tl.arange(0, BLOCK_SIZE)\n    mask = offsets < N\n    x = tl.load(x_ptr + offsets, mask=mask, other=0.0).to(tl.float32)\n    # Triton 内置 scan（前缀扫描）\n    y = tl.cumsum(x, axis=0)\n    tl.store(y_ptr + offsets, y, mask=mask)\n```\n\n## 常见陷阱\n\n| 陷阱 | 说明 | 解决方案 |\n|------|------|----------|\n| fp16/bf16 累加溢出 | K 较大时 fp16 sum 溢出（最大 65504） | 使用 fp32 累加器（exp_reduction_fp32_001） |\n| exp 直接溢出 | 未减 max 直接 exp(x) 溢出 | 使用 log-sum-exp trick（exp_reduction_logsumexp_001） |\n| split-K atomic 竞争 | 多核 atomic_add 到同一地址，竞争严重时性能下降 | 改用两阶段方案（exp_splitk_two_pass_001） |\n| split-K SPLIT 过大 | SPLIT > AI Core 数时产生资源浪费和同步开销 | SPLIT ≤ num_aicores，通常 SPLIT ≤ 32 |\n| argmax 两遍扫描 | 先 max 再 argmax 需要读两遍输入 | 单遍联合 argmax+max（exp_reduction_argmax_001） |\n| logsumexp 精度下溢 | max 与 x_i 差距极大时 exp(x_i - max) 下溢为 0 | 保持 fp32 精度，不在 fp16 下计算 log-sum-exp |\n| 小 K 使用 split-K | K < 512 时 split-K 的 launch 和同步开销超过收益 | K < 512 时用单核单遍归约 |\n| 忽略 histogram 冲突 | 多核同时写同一 bin，atomic 竞争严重 | 寄存器局部 histogram，最后单次写回（exp_histogram_reduction_001） |\n\n## 代码模板\n\n### 通用行归约模板（sum/max/min）\n\n```python\nimport torch\nimport triton\nimport triton.language as tl\n\n@triton.autotune(\n    configs=[triton.Config({'BLOCK_K': bk}) for bk in [128, 256, 512, 1024]],\n    key=['K'],\n)\n@triton.jit\ndef row_reduction_kernel(\n    x_ptr,\n    y_ptr,\n    M, K,\n    BLOCK_K: tl.constexpr,\n    REDUCE_OP: tl.constexpr,  # 'sum' | 'max' | 'min'\n):\n    row = tl.program_id(0)\n    x_row = x_ptr + row * K\n\n    if REDUCE_OP == 'sum':\n        acc = tl.zeros([BLOCK_K], dtype=tl.float32)\n    elif REDUCE_OP == 'max':\n        acc = tl.full([BLOCK_K], float('-inf'), dtype=tl.float32)\n    else:\n        acc = tl.full([BLOCK_K], float('inf'), dtype=tl.float32)\n\n    for k_start in range(0, K, BLOCK_K):\n        k_offs = k_start + tl.arange(0, BLOCK_K)\n        mask = k_offs < K\n        x = tl.load(x_row + k_offs, mask=mask,\n                     other=(0.0 if REDUCE_OP == 'sum' else float('-inf'))).to(tl.float32)\n        if REDUCE_OP == 'sum':\n            acc += x\n        elif REDUCE_OP == 'max':\n            acc = tl.maximum(acc, x)\n        else:\n            acc = tl.minimum(acc, x)\n\n    if REDUCE_OP == 'sum':\n        result = tl.sum(acc)\n    elif REDUCE_OP == 'max':\n        result = tl.max(acc)\n    else:\n        result = tl.min(acc)\n\n    tl.store(y_ptr + row, result.to(tl.float16))\n\n\ndef row_sum(x: torch.Tensor) -> torch.Tensor:\n    M, K = x.shape\n    y = torch.empty(M, dtype=x.dtype, device=x.device)\n    row_reduction_kernel[(M,)](x, y, M, K, REDUCE_OP='sum')\n    return y\n```\n\n### Split-K 归约完整示例\n\n```python\ndef splitk_sum(x: torch.Tensor, split: int = 16) -> torch.Tensor:\n    \"\"\"两阶段 split-K sum，适用于 K >= 4096。\"\"\"\n    M, K = x.shape\n    BLOCK_K = 256\n\n    # Phase 1: 各核计算部分和\n    partial = torch.zeros(M, split, dtype=torch.float32, device=x.device)\n    splitk_phase1_kernel[(M, split)](x, partial, M, K,\n                                      BLOCK_K=BLOCK_K, SPLIT=split)\n\n    # Phase 2: 全局归约\n    y = torch.empty(M, dtype=x.dtype, device=x.device)\n    BLOCK_SPLIT = triton.next_power_of_2(split)\n    splitk_phase2_kernel[(M,)](partial, y, M, split, BLOCK_SPLIT=BLOCK_SPLIT)\n    return y\n```\n\n## 相关页面\n\n- [normalization.md](op-class-normalization.md) — 归一化算子（LayerNorm、RMSNorm、Softmax）内部大量使用归约原语\n- [elementwise.md](op-class-elementwise.md) — softmax = exp（elementwise）+ sum_reduce + div（elementwise）\n- [gather_scatter.md](op-class-gather_scatter.md) — MoE 场景中 wgrad 需要 scatter 后的 sum 归约\n\n## 已知实例（P3 挂载）\n\n### Extracted Kernel 反链\n- `018-_reduce_split_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/018-_reduce_split_kernel.py`）\n- `022-count_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/022-count_kernel.py`）\n- `114-sum_and_scale.py` — extracted kernel（source: `raw_experiences/extracted_kernels/114-sum_and_scale.py`）\n- `134-bitonic_sortbykey_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/134-bitonic_sortbykey_kernel.py`）\n- `136-digit_hist_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/136-digit_hist_kernel.py`）\n- `138-duplicate_keys_shuffle_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/138-duplicate_keys_shuffle_kernel.py`）\n- `139-multinomial_with_replacement.py` — extracted kernel（source: `raw_experiences/extracted_kernels/139-multinomial_with_replacement.py`）\n- `165-rejection_greedy_sample_spec_len_1_triton.py` — extracted kernel（source: `raw_experiences/extracted_kernels/165-rejection_greedy_sample_spec_len_1_triton.py`）\n- `167-rejection_greedy_sample_triton.py` — extracted kernel（source: `raw_experiences/extracted_kernels/167-rejection_greedy_sample_triton.py`）\n- `168-rejection_random_sample_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/168-rejection_random_sample_kernel.py`）\n- `170-sample_recovered_tokens_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/170-sample_recovered_tokens_kernel.py`）\n- `171-rejection_random_sample_block_verify_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/171-rejection_random_sample_block_verify_kernel.py`）\n- `186-chunk_local_cumsum_scalar_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/186-chunk_local_cumsum_scalar_kernel.py`）\n- `222-_top_p_sample_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/222-_top_p_sample_kernel.py`）\n- `223-_top_p_filter_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/223-_top_p_filter_kernel.py`）\n- `224-_reject_sampler_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/224-_reject_sampler_kernel.py`）\n- `225-_join_prob_reject_sampler_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/225-_join_prob_reject_sampler_kernel.py`）\n\n\n", "op-class-rope.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/ops/rope.md\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/ops/rope.md` 迁移而来，原始为算子类别设计页，未做内容改写，仅转 OKF frontmatter。\n\n# RoPE（旋转位置编码）算子优化\n\n## 概述\n\nRoPE（Rotary Positional Embedding）通过将 token 位置编码嵌入到 Q/K 头的旋转变换中实现位置感知：\n\n```\nq_rot[i] = q[i] * cos(θ_pos) - q[i+d/2] * sin(θ_pos)\nq_rot[i+d/2] = q[i] * sin(θ_pos) + q[i+d/2] * cos(θ_pos)\n```\n\n在 Ascend 910b 上，RoPE 的主要优化目标是：\n1. **cos/sin 复用**：同一位置的 cos/sin 在所有 head 间共享，仅加载一次\n2. **向量化旋转**：将 head_dim 分成前/后两半（或奇/偶），批量向量化处理\n3. **内存对齐**：ALIGNED 路径一次加载整个 rope_dim；非对齐路径分两半加载\n4. **Grid-stride loop**：处理可变序列长度，最大化核心利用率\n\n## 经验路由\n\n| 场景 | 经验ID | 提升% | 关键技术 | 经验文件 |\n|------|--------|-------|----------|----------|\n| 标准 RoPE 前向（通用） | exp_rope_001 | 15% | cos/sin 复用 + persistent grid-stride + constexpr inverse | yaml |\n| RoPE 前向（NPU 专优） | exp_rope_npu_001 | 35% | cos/sin 复用 + software pipeline (`num_stages`) + 前反向合并 | yaml |\n| RoPE 前向（内存对齐） | exp_rope_forward_001 | 25% | ALIGNED 路径单次向量加载 + `do_not_specialize=[\"seq_len\"]` | yaml |\n| RoPE 反向传播 | exp_rope_backward_001 | 25% | grid-stride + IS_VARLEN 变长优化 + HAS_KV_LENS | yaml |\n| 部分 RoPE（Llama-3 style） | exp_partial_rope_001 | 25% | 跳过 NOPE_DIM + 向量化前/后半加载 + core scheduling | yaml |\n| Qwen2-VL Multi-RoPE | exp_qwen2vl_mrope_001 | 25% | 时间/高度/宽度三维融合 + head blocking 复用 + software pipeline | yaml |\n| Llama-4 NPU RoPE | exp_rope_llama4_npu_001 | 25% | UB tiling (BLOCK_Q/BLOCK_K) + FMA 指令 + interleaved 复数布局 | yaml |\n| SISO 布局 RoPE | exp_rope_siso_001 | 25% | 3D tiling (BLOCK_N×BLOCK_H×BLOCK_D) + 非交错向量化路径 | yaml |\n| Triton 标准 RoPE | exp_rope_triton_001 | 25% | 向量化 feat_offset 加载 + fused cos/sin 旋转 | yaml |\n| Neox/非Neox 双路 RoPE | exp_triton_rope_001 | 25% | IS_NEOX_STYLE constexpr 分支消除 + 部分 rope_dim 支持 | yaml |\n\n## 关键技术\n\n### 1. cos/sin 一次加载多头复用\n\ncos/sin 表在同一序列位置对所有 head 相同，在 head 循环外加载一次：\n\n```python\n@triton.jit\ndef rope_kernel(q_ptr, k_ptr, cos_ptr, sin_ptr, output_q_ptr, output_k_ptr,\n                num_tokens, num_heads_q, num_heads_k, head_dim,\n                BLOCK_T: tl.constexpr, HEAD_DIM: tl.constexpr):\n    pid = tl.program_id(0)\n    token_id = pid * BLOCK_T + tl.arange(0, BLOCK_T)\n    mask_t = token_id < num_tokens\n\n    half = HEAD_DIM // 2\n    dim_offs = tl.arange(0, HEAD_DIM)\n\n    # cos/sin：同一位置所有 head 相同，在 head 循环外加载\n    cos = tl.load(cos_ptr + token_id[:, None] * HEAD_DIM + dim_offs[None, :],\n                  mask=mask_t[:, None])\n    sin = tl.load(sin_ptr + token_id[:, None] * HEAD_DIM + dim_offs[None, :],\n                  mask=mask_t[:, None])\n\n    for h in range(num_heads_q):\n        x1 = tl.load(q_ptr + token_id[:, None] * num_heads_q * HEAD_DIM + h * HEAD_DIM + dim_offs[:half][None, :],\n                     mask=mask_t[:, None])\n        x2 = tl.load(q_ptr + token_id[:, None] * num_heads_q * HEAD_DIM + h * HEAD_DIM + dim_offs[half:][None, :],\n                     mask=mask_t[:, None])\n        # 旋转\n        o1 = x1 * cos[:, :half] - x2 * sin[:, :half]\n        o2 = x1 * sin[:, :half] + x2 * cos[:, :half]\n        tl.store(output_q_ptr + ..., o1, mask=mask_t[:, None])\n        tl.store(output_q_ptr + ..., o2, mask=mask_t[:, None])\n```\n\n### 2. constexpr inverse 消除前/反向分支\n\n`inverse` 标志用 `tl.constexpr` 编译时特化，消除运行时分支：\n\n```python\n@triton.jit\ndef rope_fwd_bwd_kernel(..., INVERSE: tl.constexpr):\n    # ...\n    if INVERSE:  # 编译时展开，无运行时开销\n        o1 = x1 * cos - x2 * (-sin)  # 反向：等价于反向旋转\n        o2 = x2 * cos + x1 * (-sin)\n    else:\n        o1 = x1 * cos - x2 * sin\n        o2 = x1 * sin + x2 * cos\n```\n\n### 3. 内存对齐 ALIGNED 路径\n\n当 rope_dim 对齐时一次加载，否则分两半：\n\n```python\n@triton.jit\ndef rope_forward_kernel(..., ALIGNED: tl.constexpr, rope_dim, head_dim):\n    if ALIGNED:\n        # 单次加载完整 rope_dim，最大向量带宽\n        x = tl.load(ptr + offs)\n    else:\n        # 分两半加载（处理非对齐或 rope_dim < head_dim）\n        x_low = tl.load(ptr + low_offs, mask=low_mask)\n        x_high = tl.load(ptr + high_offs, mask=high_mask)\n```\n\n### 4. 部分 RoPE（Partial RoPE，Llama-3 style）\n\n当 `rope_dim < head_dim` 时，只对前 `rope_dim` 维旋转，其余 passthrough：\n\n```python\n# 跳过 NOPE_DIM（非旋转部分），从偏移 NOPE_DIM 开始处理\nnope_dim = head_dim - rope_dim\nhalf_dim = rope_dim // 2\n\nx_l_offs = base + nope_dim + tl.arange(0, half_dim)      # lower half\nx_h_offs = base + nope_dim + half_dim + tl.arange(0, half_dim)  # upper half\n\nx_l = tl.load(ptr + x_l_offs, mask=...)\nx_h = tl.load(ptr + x_h_offs, mask=...)\n\no_l = x_l * cos - x_h * sin\no_h = x_l * sin + x_h * cos\n```\n\n### 5. Multi-RoPE（Qwen2-VL）三维位置编码\n\n时间/高度/宽度三维使用不同 cos/sin 表，通过 `tl.where` 动态选择：\n\n```python\n# 三维 RoPE：t/h/w 维度各有独立位置编码\n@triton.jit\ndef mrope_kernel(..., HEAD_DIM: tl.constexpr, BLOCK_Q: tl.constexpr):\n    dim_idx = tl.arange(0, HEAD_DIM)\n    # 按维度判断使用哪套 cos/sin（t/h/w 各占 head_dim/3）\n    is_t = dim_idx < HEAD_DIM // 3\n    is_h = (dim_idx >= HEAD_DIM // 3) & (dim_idx < 2 * HEAD_DIM // 3)\n    # is_w = dim_idx >= 2 * HEAD_DIM // 3\n\n    cos_val = tl.where(is_t, cos_t, tl.where(is_h, cos_h, cos_w))\n    sin_val = tl.where(is_t, sin_t, tl.where(is_h, sin_h, sin_w))\n```\n\n## 布局变体\n\n| 布局 | 说明 | 加载策略 |\n|------|------|----------|\n| Neox-style（分块） | `[x_0, ..., x_{d/2-1}, x_{d/2}, ..., x_{d-1}]`，前/后分开 | `IS_NEOX_STYLE=True`：连续分两段加载 |\n| GPT-J-style（交错） | `[x_0, x_1, x_2, x_3, ...]`，奇偶交替 | `IS_NEOX_STYLE=False`：步长=2 加载 |\n| Partial RoPE | `[passthrough... | rope_rot...]`，仅后 rope_dim 旋转 | 偏移 NOPE_DIM 后处理 |\n| SISO | tokens × heads × head_dim 独立分块 | 3D tiling `(BLOCK_N, BLOCK_H, BLOCK_D)` |\n\n## 选择指南\n\n| 场景 | 推荐经验 |\n|------|---------|\n| 通用 RoPE，910b2/b3 | `exp_rope_npu_001`（最高 35% 提升） |\n| 变长序列（varlen batch） | `exp_rope_backward_001`（IS_VARLEN 支持）|\n| Llama-3 Partial RoPE | `exp_partial_rope_001` |\n| Qwen2-VL Multi-RoPE | `exp_qwen2vl_mrope_001` |\n| 需同时支持前/反向 | `exp_rope_npu_001`（`BACKWARD_PASS` constexpr 参数） |\n| Llama-4 NPU | `exp_rope_llama4_npu_001`（interleaved complex layout） |\n\n## 常见陷阱\n\n| 陷阱 | 解决方案 |\n|------|----------|\n| cos/sin 在 head 循环内重复加载 | 提到循环外加载，所有 head 共享（exp_rope_001） |\n| rope_dim 与 head_dim 混淆导致越界 | `ALIGNED` constexpr 路径分别处理，加载时用 `mask=offs < rope_dim` |\n| int64 token 索引 | 转为 int32 × stride（fp32 偏移），避免 scalar fallback |\n| 交错布局误用分块加载 | 用 `IS_NEOX_STYLE` constexpr 编译时选择路径，禁止运行时 if |\n| KV cache 偏移未考虑 | `HAS_KV_LENS` 专用路径，用 kv_len 计算 cos/sin 查表偏移 |\n\n## 相关页面\n\n- [ops/elementwise.md](op-class-elementwise.md) — RoPE 本质是 elementwise，激活函数反向传播模式可参考\n- [ops/attention.md](op-class-attention.md) — RoPE 通常在 QKV 投影后、Attention 前执行；Fusion-2 模式\n- [ops/fused_ops.md](op-class-fused_ops.md) — GEMM + RMSNorm + RoPE 三合一融合（Fusion-2）\n- techniques/ilp.md — cos/sin 加载的 for-loop tiling + software pipeline\n- techniques/data_types.md — int64 索引退化问题\n\n## 被以下页面引用\n\n- [ops/attention.md](op-class-attention.md) — Attention 前的 QK RoPE 编码步骤\n- [ops/fused_ops.md](op-class-fused_ops.md) — Fusion-2 Linear+RMSNorm+RoPE\n- experience_index.md — RoPE 区全量经验 ID\n\n## 已知实例（P3 挂载）\n\n### Extracted Kernel 反链\n- `035-rotary_emb_compute.py` — extracted kernel（source: `raw_experiences/extracted_kernels/035-rotary_emb_compute.py`）\n- `036-apply_rotary_pos_emb_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/036-apply_rotary_pos_emb_kernel.py`）\n- `037-partial_rotary_emb_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/037-partial_rotary_emb_kernel.py`）\n- `038-partial_rope_qk_compute.py` — extracted kernel（source: `raw_experiences/extracted_kernels/038-partial_rope_qk_compute.py`）\n- `039-partial_rope_qk_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/039-partial_rope_qk_kernel.py`）\n- `043-rotary_pos_emb_qr_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/043-rotary_pos_emb_qr_kernel.py`）\n- `059-apply_rotary_pos_emb_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/059-apply_rotary_pos_emb_kernel.py`）\n- `063-_compute_rotary_emb.py` — extracted kernel（source: `raw_experiences/extracted_kernels/063-_compute_rotary_emb.py`）\n- `065-fused_single_norm_and_partial_rope_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/065-fused_single_norm_and_partial_rope_kernel.py`）\n- `098-_triton_llama4_rope_npu.py` — extracted kernel（source: `raw_experiences/extracted_kernels/098-_triton_llama4_rope_npu.py`）\n- `099-_triton_qwen2vl_mrope_npu.py` — extracted kernel（source: `raw_experiences/extracted_kernels/099-_triton_qwen2vl_mrope_npu.py`）\n- `104-_triton_rope_npu.py` — extracted kernel（source: `raw_experiences/extracted_kernels/104-_triton_rope_npu.py`）\n- `116-rotary_embedding_rw_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/116-rotary_embedding_rw_kernel.py`）\n- `117-rotary_embedding_siso_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/117-rotary_embedding_siso_kernel.py`）\n- `172-_triton_rope.py` — extracted kernel（source: `raw_experiences/extracted_kernels/172-_triton_rope.py`）\n- `192-fused_rope_qk_mqa_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/192-fused_rope_qk_mqa_kernel.py`）\n- `227-_compute_rope.py` — extracted kernel（source: `raw_experiences/extracted_kernels/227-_compute_rope.py`）\n- `228-_compute_rope_separated.py` — extracted kernel（source: `raw_experiences/extracted_kernels/228-_compute_rope_separated.py`）\n- `229-_rope_forward_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/229-_rope_forward_kernel.py`）\n- `230-_rope_backward_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/230-_rope_backward_kernel.py`）\n\n\n", "op-class-softmax.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/ops/softmax.md\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/ops/softmax.md` 迁移而来，原始为算子类别设计页，未做内容改写，仅转 OKF frontmatter。\n\n# Softmax / LogSoftmax 算子优化\n\n## 概述\n\nSoftmax 将实值向量归一化为概率分布：`softmax(x)_i = exp(x_i) / Σ exp(x_j)`。  \nLogSoftmax 输出对数概率：`log_softmax(x)_i = x_i - log(Σ exp(x_j))`，数值更稳定。\n\n在 Triton-Ascend 中，Softmax 的核心挑战是：\n1. **两趟访存开销**：标准实现需两次遍历（先求 max，再求 exp+sum）\n2. **数值溢出**：fp16/bf16 下 `exp(x)` 容易溢出，需减去最大值稳定化\n3. **归约通信**：跨 tile 归约需要同步，影响并行度\n\n## 检测标准\n\n满足以下条件时归类为 Softmax：\n- PyTorch 原语：`F.softmax(x, dim=...)` 或 `F.log_softmax(x, dim=...)`\n- 归约沿指定维度（inner dim 或 outer dim），输出形状与输入相同\n- 不含跨 batch 归约（跨 batch 属于 Reduction）\n\n## 适用条件\n\n| 条件 | 说明 |\n|------|------|\n| 数据类型 | fp16、bf16、fp32；fp8 需特殊 UB 分片处理 |\n| inner dim N | N≥64 时向量化收益显著；N 超过 UB 容量需分块 |\n| outer dim M | M≥1，通常每个 program 处理一行 |\n\n## 经验路由\n\n| 场景 | 经验ID | 提升% | 关键技术 | 经验文件 |\n|------|--------|-------|----------|----------|\n| 标准 Softmax（inner dim） | exp_softmax_inner_002 | 30% | 在线 max+sum 单趟，数值稳定 | yaml |\n| 非 inner dim Softmax | exp_softmax_non_inner_001 | 25% | 外层维度归约，转置后处理 | yaml |\n| Online Softmax（Attention 内融合） | exp_softmax_online_001 | 50% | 运行 m_i/l_i 迭代更新，消除完整 NxN 矩阵 | yaml |\n| LogSoftmax 前向 | exp_log_softmax_001 | 30% | 两趟：max+sum → log-sum-exp 单核 | yaml |\n| LogSoftmax 反向 | exp_log_softmax_backward_001 | 25% | 反向梯度：`dy - softmax(x) * sum(dy)` | yaml |\n| Softmax 反向（inner） | exp_softmax_backward_001 | 25% | 反向：`p * (dy - dot(p, dy))` | yaml |\n| Softmax 反向（非 inner） | exp_softmax_backward_non_inner_001 | 20% | 非内层维度反向，二维 tile 处理 | yaml |\n\n## 关键技术\n\n### Online Softmax 算法（单趟）\n\n核心思想：维护运行最大值 `m_i` 和运行指数和 `l_i`，一次遍历完成 max+sum：\n\n```\nm_new = max(m_old, x_tile_max)\nl_new = l_old * exp(m_old - m_new) + sum(exp(x_tile - m_new))\n```\n\n最终输出：`softmax(x)_i = exp(x_i - m_final) / l_final`\n\n```python\n@triton.jit\ndef softmax_online_kernel(x_ptr, y_ptr, n_rows, n_cols, BLOCK_N: tl.constexpr):\n    row = tl.program_id(0)\n    x_row = x_ptr + row * n_cols\n\n    # 在线算法：单趟计算 max 和 sum\n    m = tl.full([1], float('-inf'), dtype=tl.float32)\n    l = tl.zeros([1], dtype=tl.float32)\n    for col in range(0, n_cols, BLOCK_N):\n        cols = col + tl.arange(0, BLOCK_N)\n        mask = cols < n_cols\n        x = tl.load(x_row + cols, mask=mask, other=float('-inf')).to(tl.float32)\n        m_new = tl.maximum(m, tl.max(x))\n        l = l * tl.exp(m - m_new) + tl.sum(tl.exp(x - m_new))\n        m = m_new\n\n    # 第二趟：写出归一化结果\n    for col in range(0, n_cols, BLOCK_N):\n        cols = col + tl.arange(0, BLOCK_N)\n        mask = cols < n_cols\n        x = tl.load(x_row + cols, mask=mask, other=0.0).to(tl.float32)\n        y = tl.exp(x - m) / l\n        tl.store(y_ptr + row * n_cols + cols, y.to(tl.float16), mask=mask)\n```\n\n### 数值稳定化\n\nfp16/bf16 下 `exp(x)` 在 x > 65504 时溢出。**必须**在 exp 前减去行内最大值：\n\n```python\nx_stable = x - tl.max(x, axis=0)  # 防止 exp 溢出\np = tl.exp(x_stable)\np = p / tl.sum(p)\n```\n\n参考：exp_stability_001\n\n### UB 容量限制（N 大于 192KB 时分块）\n\n910b2/910b3 UB 约 192KB。fp16 时单行最大元素数：`192*1024/2 = 98304`。  \n超出时使用分块两趟算法（exp_softmax_non_inner_001 / exp_log_softmax_001 的策略）。\n\n## 常见陷阱\n\n| 陷阱 | 说明 | 解决方案 |\n|------|------|----------|\n| fp16 exp 溢出 | x 不减 max 直接 exp，输出 Inf | 先减行内最大值（数值稳定化） |\n| outer dim 效率低 | 非 inner dim 归约需要 gather-like 访问 | 转置后处理内层，或使用 non_inner 变体 |\n| 两趟访存带宽瓶颈 | 独立读两次 HBM | 使用 Online Softmax 合并为单趟 |\n| Attention 中单独 Softmax | 多余 HBM 写回 | 将 Softmax 融入 Attention 内核（Flash Attention） |\n\n## 相关页面\n\n- [ops/attention.md](op-class-attention.md) — Flash Attention 内嵌 Online Softmax，是最重要的 Softmax 融合场景\n- [ops/reduction.md](op-class-reduction.md) — Reduction 原语与 Softmax 共享归约逻辑\n- [ops/loss.md](op-class-loss.md) — CrossEntropy/LogSoftmax 常与 Loss 计算融合\n- techniques/online_algorithms.md — Online Softmax 算法详解\n- techniques/numerical_stability.md — 数值稳定性指南\n\n## 已知实例（P3 挂载）\n\n### Extracted Kernel 反链\n- `126-softmax_kernel_non_inner.py` — extracted kernel（source: `raw_experiences/extracted_kernels/126-softmax_kernel_non_inner.py`）\n- `127-softmax_kernel_inner.py` — extracted kernel（source: `raw_experiences/extracted_kernels/127-softmax_kernel_inner.py`）\n- `128-softmax_backward_kernel_non_inner.py` — extracted kernel（source: `raw_experiences/extracted_kernels/128-softmax_backward_kernel_non_inner.py`）\n- `129-softmax_backward_kernel_inner.py` — extracted kernel（source: `raw_experiences/extracted_kernels/129-softmax_backward_kernel_inner.py`）\n- `144-log_softmax_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/144-log_softmax_kernel.py`）\n- `145-log_softmax_backward_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/145-log_softmax_backward_kernel.py`）\n- `054-vec_a.py` — extracted kernel（source: `raw_experiences/extracted_kernels/054-vec_a.py`）\n\n\n", "op-class-solve_tril.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/ops/solve_tril.md\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/ops/solve_tril.md` 迁移而来，原始为算子类别设计页，未做内容改写，仅转 OKF frontmatter。\n\n# solve_tril 算子优化（三角矩阵求逆）\n\n## 概述\n\n`solve_tril` 算子计算 **(I + A) 的逆矩阵**，其中 A 是严格下三角矩阵。用于 Flash Linear Attention（FLA）中分块求解注意力矩阵的关键组件。\n\n数学原理：对于严格下三角矩阵 A（BT × BT），`(I + A)^(-1)` 可通过有限项 Neumann 级数或分块前向代入法精确计算。实际 kernel 使用**分层分块递推**：以 16×16 为原子计算单元，通过逐层 merge 支持 BT=32 和 BT=64。\n\n特点：\n- **严格下三角结构**：A 对角线及以上全为零，可利用此结构消除冗余计算和 mask\n- **固定块大小**：BT ∈ {16, 32, 64}，16×16 为 NPU 矩阵乘法最优粒度\n- **分块递推**：标量递推（16×16）→ 块递推（32×32、64×64），数学结构统一\n- **完全并行**：所有 chunk 内的所有 (batch, head) 对独立，grid = (NT, B×H)\n\n## 经验路由\n\n| 场景 | 经验ID | 关键技术 | 经验文件 |\n|------|--------|----------|----------|\n| 冗余结构 mask 消除 | exp_solve_tril_001 | 利用矩阵结构零元删除 `tl.where`，1.33x-1.87x | yaml |\n| Preload + extract_slice 消除 HBM 重读 | exp_solve_tril_002 | 寄存器块预加载后用 extract_slice 替代 HBM load | yaml |\n| Constexpr 双路径循环展开 | exp_solve_tril_003 | 完整 tile constexpr 展开 + 边界 tile 运行时循环 | yaml |\n| 三层分级 kernel 调度 | exp_solve_tril_004 | BT=16/32/64 分治架构，16×16 原子单元 | yaml |\n| CANN 兼容性参数审计 | exp_solve_tril_005 | 删除不兼容参数（num_stages/sync_solver 等） | yaml |\n| 无效优化排除分析 | exp_solve_tril_006 | tl.dot vs tl.sum 广播乘决策；寄存器压力权衡 | yaml |\n\n## 关键技术\n\n### 分层分块递推架构\n\n以 16×16 为原子单元，BT=16 直接逐行递推，BT=32/64 通过分块公式逐层 merge：\n\n```\nBT=16:  基础递推（逐行）\nBT=32:  4 块分治 → 对角块递推 + 1 次 merge: X₂₁ = -X₂₂·A₂₁·X₁₁\nBT=64:  16 块分治 → 对角块递推 + 3 层 merge（紧邻→隔行→最远），共 7 次 tl.dot\n```\n\n分块递推公式与标量递推在数学结构上完全一致：\n\n```\n标量: X[i,j] = -A[i,j] - Σ_{k=j+1}^{i-1} A[i,k]·X[k,j]\n分块: X[i,j] = -X[i,i] · Σ_{k=j}^{i-1} A[i,k]·X[k,j]\n```\n\n参考：exp_solve_tril_004\n\n### 冗余结构 mask 消除（V1 优化）\n\n当矩阵具有已知结构零元时，对已为零元素施加的 `tl.where(mask, val, 0.)` 是冗余 ALU 指令。对于严格下三角矩阵 A，`tl.where(o_i < i, b_a, 0.)` 是恒等变换——j≥i 位置本身就是 0：\n\n```python\n# 反模式：冗余 mask（A[i,j≥i] 本身就是 0）\nb_a = -tl.load(A + offset)\nb_a = tl.where(o_i < i, b_a, 0.)  # ← 冗余！删除后可省 14 次 where/循环\n\n# 优化后：依赖矩阵结构保证零值\nb_a = -tl.load(A + offset)\n# b_a[j≥i] 由矩阵数学性质保证为零\n```\n\n**通用性**：适用于所有处理已知结构零元矩阵的 kernel（三角矩阵、对角矩阵、带状矩阵、mask 矩阵）。\n\n参考：exp_solve_tril_001\n\n### Preload + extract_slice 消除 HBM 重读（V4 优化）\n\n循环外通过 `tl.load(make_block_ptr(...))` 已将整个块加载到寄存器，循环内不应再用 `tl.load(A + offset)` 逐行重新从 HBM 读取。虽然 Triton 不支持 `b_A[i, :]` 动态寄存器索引，但 `tl.extract_slice` 可从寄存器提取：\n\n```python\n# 循环外：预加载到寄存器\nneg_A = -b_A  # b_A = tl.load(make_block_ptr(A, ...))\n\n# 循环内：从寄存器提取，零 HBM 访问\nfor i in range(2, BT):\n    b_a = tl.extract_slice(neg_A, (i, 0), (1, 16), (1, 1))\n    b_a = tl.reshape(b_a, (16,))\n    b_a = b_a + tl.sum(b_a[:, None] * b_A, 0)\n    b_A = tl.where((o_i == i)[:, None], b_a, b_A)\n```\n\n**通用性**：适用于所有在循环内重复读取已在寄存器中数据的 kernel（如三角矩阵操作、递推关系、逐行/逐列处理）。\n\n参考：exp_solve_tril_002\n\n### Constexpr 双路径（完整 tile vs 边界 tile）\n\n当绝大多数 chunk 是完整 tile（99%），仅最后一个可能是边界 chunk 时，用 `if T - offset >= BT` 分支：\n\n- **快速路径**：`range(2, BT)` constexpr → 循环完全展开 + extract_slice offset 静态优化为零开销\n- **慢速路径**：`range(2, min(16, remaining))` 运行时循环 → 仍从寄存器读取\n\n```python\nneg_A = -b_A  # 预加载\n\nif T - i_t * 16 >= BT:\n    # 快速路径：99% chunk，constexpr 展开\n    for i in range(2, BT):\n        b_a = tl.extract_slice(neg_A, (i, 0), (1, 16), (1, 1))\n        ...\nelse:\n    # 慢速路径：边界 chunk，运行时循环 → 仍从寄存器读\n    for i in range(2, min(16, T - i_t * 16)):\n        b_a = tl.extract_slice(neg_A, (i, 0), (1, 16), (1, 1))\n        ...\n```\n\n**被排除的方案**：统一运行时循环（V3）→ 失去 constexpr 展开，性能回退；慢速路径保留 tl.load → 不如 extract_slice 统一简洁。\n\n参考：exp_solve_tril_003\n\n### tl.dot vs tl.sum 广播乘决策\n\n对微小矩阵乘法（M=1, K≤16, N=16），`tl.dot`（CUBE 单元）比 `tl.sum(b_a[:, None] * b_A, axis=0)`（VEC 单元广播乘+归约）慢 14-20x。CUBE 单元的调度和启动开销在微小尺寸下远大于 VEC 直接计算：\n\n```python\n# 反模式（14-20x 退化）：微小矩阵强行用 tl.dot\nb_a_2d = tl.reshape(b_a, (1, 16))\nb_a = tl.dot(b_a_2d, b_A)  # CUBE 调度 >> 计算量\n\n# 正模式：VEC 广播乘 + 归约\nb_a = b_a + tl.sum(b_a[:, None] * b_A, 0)  # 1×16 × 16×16\n```\n\n**决策原则**：M=1 或 N=1 或 K≤16 时优先用 VEC 广播乘 + sum 归约。\n\n参考：exp_solve_tril_006\n\n### CANN 兼容性参数审计\n\n从外部仓库（fla、vllm 等）迁移 kernel 时必须逐项审计编译参数。以下参数在 CANN 8.5.0 上不兼容：\n\n| 参数 | 问题 | 处理 |\n|------|------|------|\n| `limit_auto_multi_buffer_of_local_buffer=\"no-limit\"` | CANN 8.5.0 未实现 | 删除 |\n| `sync_solver=True` | CANN 8.5.0 不支持 | 删除 |\n| `num_stages=2`（tl.range） | 依赖 USE_TMA，Ascend 不可用 | 删除 |\n\n参考：exp_solve_tril_005\n\n## 优化效果汇总\n\n| 版本 | 优化内容 | BT=16 加速比 | BT=32 加速比 | BT=64 加速比 |\n|------|---------|------------|------------|------------|\n| Original | 原始代码（fla 仓库） | 1.00x | 1.00x | 1.00x |\n| V1 | 删除冗余 `tl.where` | 1.33x-1.87x | 1.00x | ~1.40x |\n| V4 | Preload + extract_slice（累计） | 1.01x-1.37x (叠加) | 1.25x-1.27x | 1.11x-1.13x (叠加) |\n| **累计** | **Original → V4** | **1.42x-2.54x** | **1.26x-1.29x** | **1.55x-1.57x** |\n\n所有优化零精度损失（max_err < 1e-6），未改变算子接口。\n\n## 适用条件\n\n| 参数 | 推荐范围/说明 |\n|------|-------------|\n| BT（块大小） | 16、32、64（算子语义决定，不可变） |\n| B（batch） | ≥1，大 B 场景 grid 并行度更充分 |\n| H（head 数） | ≥1 |\n| T（序列长度） | BT 的倍数时 100% chunk 走快速 constexpr 展开路径 |\n| fp32 中间精度 | 强制要求（递推累积误差敏感性高） |\n| 输入连续性 | 输入必须 `.contiguous()`，block_ptr 依赖 stride |\n\n## 相关页面\n\n- [ops/ssm.md](op-class-ssm.md) — solve_tril 是 Flash Linear Attention 的关键组件\n- techniques/compute_and_branch.md — 冗余结构 mask 消除；constexpr 双路径展开；tl.dot vs VEC 广播乘决策\n- techniques/memory_access_optimization.md — Preload + extract_slice 消除 HBM 重读\n- techniques/tiling.md — 16×16 原子 tile + 分块递推的层次化 tiling\n- techniques/parallelism_and_loop.md — 2D grid `(NT, B×H)` 完全并行\n- techniques/ilp.md — constexpr 循环展开 vs 运行时循环的性能差异\n- techniques/operator_fusion.md — merge kernel 中括号内累加 + tl.dot 的融合模式\n\n## 已知实例（P3 挂载）\n\n### Extracted Kernel 反链\n- `153-solve_tril_16x16_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/153-solve_tril_16x16_kernel.py`）\n- `154-merge_16x16_to_32x32_inverse_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/154-merge_16x16_to_32x32_inverse_kernel.py`）\n- `155-merge_16x16_to_64x64_inverse_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/155-merge_16x16_to_64x64_inverse_kernel.py`）\n- `182-solve_tril_16x16_kernel_paral.py` — extracted kernel（source: `raw_experiences/extracted_kernels/182-solve_tril_16x16_kernel_paral.py`）\n- `183-solve_tril_16x16_kernel_paral_v3.py` — extracted kernel（source: `raw_experiences/extracted_kernels/183-solve_tril_16x16_kernel_paral_v3.py`）\n- `184-merge_16x16_to_32x32_inverse_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/184-merge_16x16_to_32x32_inverse_kernel.py`）\n- `185-merge_16x16_to_64x64_inverse_kernel_reorder_all_masked.py` — extracted kernel（source: `raw_experiences/extracted_kernels/185-merge_16x16_to_64x64_inverse_kernel_reorder_all_masked.py`）\n\n\n", "op-class-ssm.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/ops/ssm.md\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/ops/ssm.md` 迁移而来，原始为算子类别设计页，未做内容改写，仅转 OKF frontmatter。\n\n# SSM / 状态空间模型算子优化\n\n## 概述\n\n状态空间模型（SSM）是近年快速发展的序列模型架构，代表性工作包括 Mamba、Hyena、RetNet、GLA 等。  \n与 Transformer 不同，SSM 以**线性递推**方式更新隐状态，复杂度 O(T) 而非 O(T²)。\n\nTriton-Ascend 中 SSM 的核心挑战：\n1. **递推依赖**：时间步之间有数据依赖，不能简单并行化\n2. **Chunkwise 分解**：将序列分块，块内并行（GEMM），块间串行（状态转移）\n3. **State 寄存器复用**：隐状态 `h` 需长时间驻留寄存器，避免写回 HBM\n\n## 检测标准\n\n满足以下条件归类为 SSM：\n- 计算模式：线性递推 `h_t = A·h_{t-1} + B·x_t`，`y_t = C·h_t`\n- 或 Chunkwise 线性注意力：`O = (Q·K^T ⊙ M)·V`（因果掩码 M）\n- 或 Delta Rule 更新：`h_new = h - k^T·h·v^T + k^T·v`\n\n## 适用条件\n\n| 条件 | 说明 |\n|------|------|\n| 数据类型 | fp16、bf16；gating 部分通常 fp32 中间计算 |\n| 序列长度 T | ≥128，chunkwise 时 chunk size BT≥16 |\n| 状态维度 K/V | ≥64 |\n| 模型架构 | Mamba/Mamba2、GLA、RetNet、Hyena |\n\n## 经验路由\n\n| 场景 | 经验ID | 关键技术 | 经验文件 |\n|------|--------|----------|----------|\n| Chunkwise 线性注意力前向 | exp_chunk_fwd_001 | block_ptr tiling + gating masking，Q/K/V/H 2D块加载 | yaml |\n| Chunk CumSum（前缀和） | exp_chunk_cumsum_001 | 块内累积和，用于 gating 因子计算 | yaml |\n| Chunk Gated Delta | exp_chunk_gated_delta_001 | 带门控的 delta rule，sigmoid gating + 状态更新 | yaml |\n| Chunk KKT 计算 | exp_chunk_kkt_001 | K·K^T 内积矩阵，用于状态压缩 | yaml |\n| Delta Rule 前向（标准） | exp_fused_delta_rule_001 | sigmoid gating + softplus + delta rule 三合一融合，状态驻寄存器 | yaml |\n| Delta Rule 前向（NPU 专用） | exp_fused_delta_rule_npu_001 | Ascend 910b2/b3 路径优化版 | yaml |\n| SSM Gated Delta | exp_ssm_gated_delta_001 | SSM + gated delta rule 融合 | yaml |\n\n### 反向传播优化（KDA / Linear Attention）\n\n| 场景 | 经验ID | 提升 | 关键技术 |\n|------|--------|------|----------|\n| wy_dqkg_fused 标量消除 | exp_kda_bwd_wy_scalar_opt_001 | 3.33x | i64→i32、i32→fp32 比较、tl.cdiv/min 消除、compile_hint 移除 |\n| wy_dqkg_fused 结构优化 | exp_kda_bwd_wy_structure_opt_001 | 30% | Phase split、barrier 外提、LICM、K%BK 快速路径 |\n| intra 标量消除 | exp_kda_bwd_intra_scalar_opt_001 | 50% | block_ptr→手动指针、fp32 mask、min→tl.where |\n| intra 内存优化 | exp_kda_bwd_intra_memory_opt_001 | 35% | 转置 load 合并化、跨阶段冗余 load 消除 |\n| 标量循环 → 矩阵乘 | exp_kda_bwd_scalar_loop_to_dot_001 | 40% | 非 SAFE_GATE 对角块循环改为 tl.dot |\n\n## 关键技术\n\n### Chunkwise 并行化\n\n将长序列 T 分为 `T/BT` 个 chunk，每个 chunk 内部可做 GEMM 并行：\n\n```\n对每个 chunk c:\n  intra_chunk = Q[c] @ K[c]^T ⊙ causal_mask  (GEMM，块内并行)\n  inter_chunk = Q[c] @ H[c-1]                  (状态转移，串行)\n  O[c] = (intra_chunk + inter_chunk) @ V[c]\n  H[c] = update_state(H[c-1], K[c], V[c])\n```\n\n关键约束：BT（chunk size）通常选 16/32/64，过大超出 UB；状态 H 维度 K×V 需适配 UB。\n\n参考：exp_chunk_fwd_001\n\n### 隐状态寄存器驻留\n\nDelta Rule 更新：`h_new = h - (k^T @ h) * v^T + k * v`  \n将 `h`（维度 K×V）存于寄存器，避免每步写回 HBM：\n\n```python\n@triton.jit\ndef delta_rule_kernel(..., BK: tl.constexpr, BV: tl.constexpr):\n    # h 在寄存器内迭代更新\n    b_h = tl.zeros([BK, BV], dtype=tl.float32)  # 隐状态驻寄存器\n    for i in tl.static_range(T):\n        b_k = tl.load(k_ptr + i * K)\n        b_v = tl.load(v_ptr + i * V)\n        b_gate = tl.sigmoid(tl.load(g_ptr + i))\n        # delta rule 更新（无 HBM 写回）\n        b_h = b_gate * b_h + tl.outer(b_k, b_v)\n        tl.store(o_ptr + i * V, b_h @ b_q)\n```\n\n参考：exp_fused_delta_rule_001\n\n### Gating 融合\n\nsigmoid gating、softplus 激活与主体计算融合到同一 kernel，消除独立激活 kernel 的 HBM 开销。  \n参考：exp_chunk_gated_delta_001\n\n---\n\n## KDA / Linear Attention 反向优化\n\n`chunk_kda_bwd_kernel_wy_dqkg_fused` 和 `chunk_kda_bwd_kernel_intra` 是 Linear Attention 类模型的反向核心。在 Ascend 910B 上的优化重点与标准 SSM 前向不同：\n\n### 1. 标量消除（最高优先级）\n\n反向 kernel 通常有大量小 tile load/store 和 mask 计算，容易触发 Ascend 标量降级：\n\n```python\n# block_ptr + boundary_check → 手动指针 + fp32 mask\no_i = tl.arange(0, BC)\no_k = tl.arange(0, BK)\nm_ti = (i_ti + o_i).to(tl.float32) < T_local.to(tl.float32)\nm_k  = o_k.to(tl.float32) < K.to(tl.float32)\nmask_2d = m_ti[:, None] & m_k[None, :]\n```\n\n### 2. 转置 load 合并化\n\n`dAqk` / `dAkk` 在 Phase 2 中以转置视角加载，直接 block_ptr 会导致跨大步访存。改为行优先加载 + `tl.trans`：\n\n```python\nrow_idx = i_t*BT + i_j*BC + o_i[:, None]\ncol_idx = i_i*BC + o_i[None, :]\nb_dAqk_row = tl.load(dAqk_local + row_idx*H*BT + col_idx, mask=mask, other=0.0)\nb_dAqk = tl.trans(b_dAqk_row)\n```\n\n### 3. 标量循环 → 矩阵乘\n\n非 `SAFE_GATE` 路径的对角块计算使用 `for j in range(BC)` 逐行循环，改为 `tl.dot`：\n\n```python\nb_dAqk_diag = tl.load(p_dAqk_diag, mask=dA_diag_mask, other=0.0)\nb_dq2 += tl.dot(b_dAqk_diag, b_k_exp) * b_exp_g\n```\n\n### 4. Kernel 结构优化\n\n- **Phase split**：将 `i_k==0` 分支（dA/dv2/db）外提为独立 V-only 循环\n- **barrier 外提**：从 `i_v` 循环内移到循环后\n- **LICM**：预计算 `BT_arange[:, None] * V`、`H*K`、`H*V` 等不变量\n\n### 5. 调优配置\n\n```python\n@triton.autotune(\n    configs=[\n        triton.Config({}, num_warps=2, num_stages=2),\n        triton.Config({}, num_warps=2, num_stages=3),\n        triton.Config({}, num_warps=4, num_stages=2),\n        triton.Config({}, num_warps=4, num_stages=3),\n        triton.Config({}, num_warps=8, num_stages=2),\n        triton.Config({}, num_warps=8, num_stages=3),\n    ],\n    key=['BK', 'NC', 'BT'],\n)\n```\n\n实测 `wy_dqkg_fused` 最优：`BK=128, BV=64, num_warps=8, num_stages=2`。\n\n### 优化效果\n\n| Kernel | 优化前 | 优化后 | 加速比 |\n|--------|--------|--------|--------|\n| chunk_kda_bwd_kernel_wy_dqkg_fused | ~169,000 μs | ~50,700 μs | 3.33x |\n| chunk_kda_bwd_kernel_intra | AIV scalar 41.4% / MTE2 37.9% | 预期 scalar <20% / MTE2 <25% | — |\n\n## 常见陷阱\n\n| 陷阱 | 说明 | 解决方案 |\n|------|------|----------|\n| 状态过大超 UB | K×V 状态矩阵超出 192KB | 分块 BK/BV，多次 tile 更新状态 |\n| 递推串行化 | 跨 chunk 状态转移无法并行 | Chunkwise 分解，块内 GEMM 并行 |\n| gating 精度 | sigmoid/softplus 在 fp16 数值不稳定 | 中间计算升 fp32 |\n| block_ptr 对齐 | K/V 维度非 512B 倍数 | 使用 padding 或调整 BK/BV |\n\n## 相关页面\n\n- [ops/attention.md](op-class-attention.md) — Chunkwise 线性注意力与 Flash Attention 结构类似\n- [ops/matmul.md](op-class-matmul.md) — 块内 GEMM 使用矩阵乘优化\n- [ops/fused_ops.md](op-class-fused_ops.md) — 多阶段融合与 Phase split 模式\n- techniques/persistent_kernels.md — 状态驻留与 persistent kernel\n- techniques/tiling.md — BT/BK/BV tile 大小选择\n- techniques/data_types.md — i32→fp32 比较避免 scalar fallback\n- techniques/memory_access_optimization.md — 转置 load 合并化、跨阶段冗余 load 消除\n- techniques/compute_and_branch.md — min()/tl.cdiv 消除、标量循环→tl.dot\n- techniques/parallelism_and_loop.md — 外层循环 grid 并行化\n- techniques/performance_tuning.md — autotune 配置空间扩展\n\n## 已知实例（P3 挂载）\n\n### Extracted Kernel 反链\n- `151-fused_recurrent_gated_delta_rule_fwd_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/151-fused_recurrent_gated_delta_rule_fwd_kernel.py`）\n- `158-chunk_scaled_dot_kkt_fwd_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/158-chunk_scaled_dot_kkt_fwd_kernel.py`）\n- `159-chunk_fwd_kernel_o.py` — extracted kernel（source: `raw_experiences/extracted_kernels/159-chunk_fwd_kernel_o.py`）\n- `160-chunk_gated_delta_rule_fwd_kernel_h_blockdim64.py` — extracted kernel（source: `raw_experiences/extracted_kernels/160-chunk_gated_delta_rule_fwd_kernel_h_blockdim64.py`）\n\n\n", "ops/moe-finalize-routing-v2-grad.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_finalize_routing_v2_grad/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/moe-finalize-routing-v2-grad.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_finalize_routing_v2_grad/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_finalize_routing_v2_grad/)。\n\n# MoeFinalizeRoutingV2Grad (MoE routing finalize backward)\n\nCANN ops-transformer 中的 `MoeFinalizeRoutingV2Grad` 算子是 `MoeFinalizeRoutingV2` 的反向传播算子。核心是 expandedRowIdx 驱动的 scatter-add（gradY 按索引映射到 gradExpandedXOut）+ 可选 scale 梯度计算。三架构（A2/A3/950），纯 Vector 计算，无 Cube。\n\n## 1. 输入输出\n\n### 输入（按 `moe_finalize_routing_v2_grad_def.cpp`）\n\n| 输入 | 必选/可选 | 含义 | dtype |\n|------|-----------|------|-------|\n| gradY | 必选 | 下游梯度 [R, H] | FP16/BF16/FP32 |\n| expandedRowIdx | 必选 | 专家序排序索引 [R*K] | INT32 |\n| expandedX | 可选 | 扩展后的特征 [R*K, H] | FP16/BF16/FP32 |\n| scales | 可选 | 缩放因子 [R, K] | FP16/BF16/FP32 |\n| expertIdx | 可选 | 专家索引 [R, K] | INT32 |\n| bias | 可选 | 偏移 [E, H] | FP16/BF16/FP32 |\n\n### 输出\n\n| 输出 | 含义 | dtype |\n|------|------|-------|\n| gradExpandedXOut | expandedX 的梯度 | FP16/BF16/FP32 |\n| gradScalesOut | scales 的梯度（有 scale 时） | FP16/BF16/FP32 |\n\n### 属性\n\n`dropPadMode`（场景选择）、`activeNum`（最大输出行数）、`expertNum`（专家数）、`expertCapacity`（专家容量）。\n\n## 2. 核心计算公式\n\n```\n场景 1（无 scale）：\n  gradExpandedXOut[expandedRowIdx[i]][j] += gradY[i/K][j]\n\n场景 2（有 scale）：\n  gradExpandedXOut[expandedRowIdx[i]][j] += gradY[i/K][j] * scales[i]\n  gradScalesOut[i] = sum(expandedX[expandedRowIdx[i]][j] * gradY[i/K][j])\n\n场景 3（有 scale + bias）：\n  gradExpandedXOut[expandedRowIdx[i]][j] += gradY[i/K][j] * scales[i]\n  gradScalesOut[i] = sum((expandedX[expandedRowIdx[i]][j] + bias[expertIdx[i]][j]) * gradY[i/K][j])\n```\n\n## 3. 计算流程\n\n```\nfor each (i, j) in (R*K) × H:\n    idx = expandedRowIdx[i]\n    gradExpandedX[idx][j] += gradY[i/K][j] * scales[i]    # scatter-add\n    if with_scale:\n        gradScales[i] += (expandedX[idx][j] | +bias) * gradY[i/K][j]  # reduce\n```\n\n## 4. 模板与 dispatch\n\n| TilingKey | 模板 | scale | 切 H | 文件 |\n|---|---|---|---|---|\n| 10001 | `MoeFinalizeRoutingV2GradWithoutScaleNotCutH` | 无 | 不切 | `without_scale_not_cut_h.h` |\n| 10002 | `MoeFinalizeRoutingV2GradWithoutScaleCutH` | 无 | 切 | `without_scale_cut_h.h` |\n| 20001 | `MoeFinalizeRoutingV2GradWithScaleNotCutH` | 有 | 不切 | `with_scale_not_cut_h.h` |\n| 20002 | `MoeFinalizeRoutingV2GradWithScaleCutH` | 有 | 切 | `with_scale_cut_h.h` |\n\n## 5. 架构与产品支持\n\n| 产品 | 架构 | config（def.cpp） | kernel 入口 |\n|---|---|---|---|\n| Atlas A2 训练/推理 | arch32 | `ascend910b` L104 | `moe_finalize_routing_v2_grad.cpp` |\n| Atlas A3 训练/推理 | ascend910_93 | `ascend910_93` L105 | 同上 |\n| Ascend 950PR/950DT | arch35 | `ascend950` L149 | `moe_finalize_routing_v2_grad_apt.cpp` |\n\n纯 Vector 计算（`KERNEL_TYPE_MIX_AIV_1_0`），无 Cube。支持 FP16/BF16/FP32。\n\n## 6. Agent actions\n\n1. 确认目标架构（arch32 / arch35）与场景（无 scale / 有 scale / 有 scale+bias）。\n2. 核间：expandedRowIdx 驱动的 scatter-add → `tl.atomic_add`。\n3. scale 梯度：`tl.sum(expandedX[idx] * gradY)` reduce。\n4. Triton 实现参考 `artifacts/moe-finalize-routing-v2-grad/moe-finalize-routing-v2-grad-triton-skeleton.py`（pseudocode）。\n\n## 7. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。tiling 参数数值、atomic_add 多核精度边界需结合源码/硬件进一步验证。Triton skeleton 标记 `reproducibility: pseudocode`。来源见 `ops-transformer-moe-finalize-routing-v2-grad`。\n\n\n", "ops/moe-finalize-routing-v2.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_finalize_routing_v2/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/moe-finalize-routing-v2.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_finalize_routing_v2/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_finalize_routing_v2/)。\n\n# MoeFinalizeRoutingV2 (MoE FFN 输出合并)\n\nCANN ops-transformer 中的 `MoeFinalizeRoutingV2` 算子在 MoE 计算中最后合并 FFN 输出结果。纯 AIV-only Vector 算子（无 matmul），核心操作是 gather + scale + bias + reduce sum。\n\n## 1. 输入输出\n\n### 输入\n| 输入 | 必选/可选 | 含义 | dtype |\n|------|-----------|------|-------|\n| expanded_x | 必选 | MoE FFN 输出 | FP16/BF16/FLOAT |\n| expanded_row_idx | 必选 | 行索引映射 | INT32 |\n| x1 | 可选 | 残差连接 1 | FP16/BF16/FLOAT |\n| x2 | 可选 | 残差连接 2 | FP16/BF16/FLOAT |\n| bias | 可选 | 专家偏置 | FP16/BF16/FLOAT |\n| scales | 可选 | 缩放系数 | FP16/BF16/FLOAT |\n| expert_idx | 可选 | 专家索引 | INT32 |\n\n### 输出\n| 输出 | 含义 | dtype |\n|------|------|-------|\n| y | 合并输出 | FP16/BF16/FLOAT |\n\n## 2. 核心公式\n```\nout(i,j) = x1(i,j) + x2(i,j) + Σ_k (scales(i,k) * (expandedX[expandedRowIdx(i+k*num_rows), j] + bias(expertIdx[i,k], j)))\n```\n\n## 3. 模板 dispatch\n\n~50 个 tiling key，按 dtype × 算法策略（CutK/Db/CuthK2/CuthK4/Cuth/AllBias）× 是否有 bias 区分。`KERNEL_TYPE_AIV_ONLY`。\n\n## 4. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。Triton skeleton 标记 `reproducibility: pseudocode`。来源见 `ops-transformer-moe-finalize-routing-v2`。\n\n\n", "ops/moe-finalize-routing.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_finalize_routing/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/moe-finalize-routing.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_finalize_routing/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_finalize_routing/)。\n\n# MoeFinalizeRouting（MoE FFN 输出路由合并）\n\nCANN ops-transformer 的 `MoeFinalizeRouting` 是 **MoE 最终路由合并**算子：将 MoE FFN 的输出按 routing 索引和 scale 加权合并回原始 token 位置，支持 skip connection（x1+x2）和 expert bias（README L18-19）。**纯 AIV-only elementwise 算子**（gather+scale+add，无 Cube/matmul 参与）。\n\n## 1. 输入输出\n\n### 输入（def.cpp L22-63）\n\n| 输入 | 必选/可选 | 含义 | dtype |\n|---|---|---|---|\n| expanded_x | 必选 | MoE FFN 输出 | FP16/FP32/BF16 |\n| x1 | 必选 | skip connection 1 | FP16/FP32/BF16 |\n| x2 | 可选 | skip connection 2 | FP16/FP32/BF16 |\n| bias | 必选 | expert 偏置 | FP16/FP32/BF16 |\n| scales | 必选 | routing scale | FP16/FP32/BF16 |\n| expanded_row_idx | 必选 | expandedX 行索引 | INT32 |\n| expanded_expert_idx | 必选 | expert 索引 | INT32 |\n\n### 输出（def.cpp L64-68）\n- y（REQUIRED，FP16/FP32/BF16）\n\n### 约束（README L101-103）：无特殊约束。\n\n## 2. 核心公式（README L21-27）\n\n```\nout[i, j] = x1[i, j] + x2Optional[i, j]\n            + Σ_{k=0}^{K}(scales[i, k]\n              * (expandedX[expandedRowIdx[i+k*numRows], j]\n                 + bias[expandedExpertIdx[i, k], j]))\n```\n\n## 3. tiling key dispatch（19 key, 20000-20018）\n\ndtype(FP32/FP16/BF16) × 模板变体(CutK/Cuth/K2/K4/Db/DbAllBias/AllBias/CuthK2Optimized)。`BUFFER_NUM=1`，`PARALLEL_NUM=2`。\n\n## 4. 架构支持（def.cpp L79-84）\n\nA2/A3(FP16/FP32/BF16) + KirinX90/Kirin9030(仅 FP16/FP32)。不支持 950/310P。\n\n## 5. Agent actions\n\n1. 识别为 MoE 路由合并（纯 gather+scale+add，AIV-only）。\n2. Triton 中 `tl.load(expanded_row_idx)` 间接寻址 + `tl.sum(scale * (expandedX + bias))` 累加。\n3. 19 tiling key 分支对应 dtype×模板变体，Triton 中由 dtype constexpr + 循环策略处理。\n4. 支持可选 x2 skip connection。\n5. 首个 **moe** kernel_types 的 kernel 页。\n\n## 6. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。Triton skeleton 标记 `reproducibility: pseudocode`。\n\n\n", "ops/moe-init-routing-quant-v2.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_init_routing_quant_v2/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/moe-init-routing-quant-v2.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_init_routing_quant_v2/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_init_routing_quant_v2/)。\n\n# MoeInitRoutingQuantV2（MoE 路由初始化 V2 + 动态量化 + drop）\n\nCANN ops-transformer 的 `MoeInitRoutingQuantV2` 是 `MoeInitRoutingQuant` 的增强版（README L18-24）：新增 drop/dropless 模式、动态 quant、删除 rowIdx 输入、expertTokens 统计、INT4 输出、950(arch35) 支持。**AIV-only**（MIX_AIV_1_0）。\n\n## 1. 输入输出\n\n### 输入（def.cpp L23-46）\n- x（REQUIRED，FP16/BF16/FP32）\n- expert_idx（REQUIRED，INT32）\n- scale / offset（OPTIONAL，FLOAT32）\n\n### 输出（def.cpp L47-71）\n- expanded_x（REQUIRED，INT8/INT4）\n- expanded_row_idx（REQUIRED，INT32）\n- expert_tokens_count_or_cumsum（OPTIONAL，INT32）\n- expert_tokens_before_capacity（OPTIONAL，INT32）\n- dynamic_quant_scale（OPTIONAL，FLOAT32）\n\n### 属性（def.cpp L72-78）\n`active_num`/`expert_capacity`/`expert_num`/`drop_pad_mode`(0=dropless,1=drop)/`expert_tokens_count_or_cumsum_flag`/`expert_tokens_before_capacity_flag`/`quant_mode`(0=静态,1=动态)。\n\n## 2. 核心公式（README L25-83）\n\n```\n1. Sort: sortedExpertIdx, sortedRowIdx = keyValueSort(expertIdx)\n2. SrcToDst: expandedRowIdx[sortedRowIdx[i]] = i\n3. (dropless) expertTokensCumsum = Cumsum(Histogram(sortedExpertIdx))\n   (drop)     expertTokensBeforeCapacity = Histogram(sortedExpertIdx)\n4. Quant:\n   静态: quantResult = round(x * scale + offset)\n   动态: dynScale = row_max(abs(x[·scale])) / 127;  quantResult = round(x / dynScale)\n5. Gather: expandedX[i] = quantResult[sortedRowIdx[i] % NUM_ROWS]\n6. (drop) 容量截断/补零\n```\n\n## 3. tiling key dispatch（3 档）\n\n| key | 模式 |\n|---|---|\n| 20000 | 静态 quant fullload（单阶段快速路径） |\n| 21000 | 动态 quant fullload |\n| 10000-11110 | 多阶段（Sort->ExpertToken->SrcToDst->GatherQuant） |\n\n## 4. V2 vs V1 差异\n\n| 差异 | V1 | V2 |\n|---|---|---|\n| rowIdx | 有 | 删除 |\n| drop/dropless | 无 | 有 |\n| 动态 quant | 无 | 有 |\n| expertTokens 统计 | 无 | 有 |\n| 架构 | A2/A3 | A2/A3 + 950 |\n| 输出 dtype | INT8 | INT8/INT4 |\n\n## 5. 架构支持（README L7-12）\n\nAscend910B1/910_93（arch32）+ Ascend950（arch35 regbase/simt）。不支持 310P/Kirin。\n\n## 6. Agent actions\n\n1. 识别为 MoE routing V2（drop/dropless + 静态/动态 quant + expertTokens 统计）。\n2. 与 `kernel-moe-init-routing-quant` V1 区分：V2 删除 rowIdx、新增 drop 和动态 quant。\n3. 动态 quant：`dynScale = row_max(abs(x[·scale])) / 127`，输出 dynamic_quant_scale。\n4. drop 模式：按 expertCapacity 截断/补零。\n5. arch35(950) 有 regbase/simt 变体（CANN 专有，不迁移）。\n6. tiling key 20000/21000 是 fullload 快速路径（小数据量单阶段）。\n\n## 7. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。Triton skeleton 标记 `reproducibility: pseudocode`。\n\n\n", "ops/moe-init-routing-quant.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_init_routing_quant/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/moe-init-routing-quant.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_init_routing_quant/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_init_routing_quant/)。\n\n# MoeInitRoutingQuant（MoE 路由初始化 + 量化）\n\nCANN ops-transformer 的 `MoeInitRoutingQuant` 是 **MoE 路由初始化 + 量化**算子：根据 gating topk 结果做 routing 处理并量化为 INT8（README L16）。3 阶段：Sort -> SrcToDst -> GatherOut+Quant。**AIV-only**（无 Cube）。与 `kernel-moe-finalize-routing` 配对（init 量化输入，finalize 合并输出）。\n\n## 1. 输入输出\n\n### 输入（def.cpp L23-40）\n- x（REQUIRED，FP16/BF16/FP32）：token 特征。\n- row_idx（REQUIRED，INT32）：原始行位置。\n- expert_idx（REQUIRED，INT32）：每行对应的 K 个 expert。\n\n### 输出（def.cpp L41-55）\n- expanded_x（REQUIRED，INT8）：扩展并量化的特征。\n- expanded_row_idx（REQUIRED，INT32）：expandedX 与 x 的映射。\n- expanded_expert_idx（REQUIRED，INT32）：排序后的 expertIdx。\n\n### 属性（def.cpp L56-58）\n`active_num`（INT）、`scale`（FLOAT）、`offset`（FLOAT）。\n\n## 2. 核心公式（README L19-29）\n\n```\n1. Sort: expandedExpertIdx, sortedRowIdx = keyValueSort(expertIdx, rowIdx)\n2. SrcToDst: expandedRowIdx[sortedRowIdx[i]] = i\n3. Gather+Quant: expandedX[i] = quant(x[sortedRowIdx[i] % numRows], scale, offset)\n```\n\n## 3. tiling key dispatch（4 key）\n\n| key | 排序 | gather |\n|---|---|---|\n| 1 | OneCore | Normal |\n| 2 | MultiCore | Normal |\n| 3 | OneCore | SmallActiveRow |\n| 4 | MultiCore | SmallActiveRow |\n\n## 4. 架构支持（README L7-12；def.cpp L59-60）\n\n仅 Ascend910B1/910_93（A2/A3）。不支持 950/310P/Kirin/A3。\n\n## 5. Agent actions\n\n1. 识别为 MoE 路由初始化+量化（AIV-only，3 阶段 sort+scatter+gather+quant）。\n2. 与 `kernel-moe-finalize-routing` 配对：本算子量化输入供 FFN，finalize 合并 FFN 输出。\n3. 量化：`expandedX = round(x * scale + offset)` cast to INT8。\n4. Triton 中 sort 需自定义（如 bitonic）或 host 预排序。\n\n## 6. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。Triton skeleton 标记 `reproducibility: pseudocode`。\n\n\n", "ops/moe-init-routing-v2-grad.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_init_routing_v2_grad/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/moe-init-routing-v2-grad.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_init_routing_v2_grad/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_init_routing_v2_grad/)。\n\n# MoeInitRoutingV2Grad (MoE init routing 反向)\n\nCANN ops-transformer 中的 `MoeInitRoutingV2Grad` 是 `MoeInitRoutingV2` 的反向传播算子，完成 tokens 的加权求和（反向 gather + reduce sum）。纯 AIV-only Vector 算子（无 matmul）。\n\n## 1. 输入输出\n\n### 输入\n| 输入 | 必选 | 含义 | dtype |\n|------|------|------|-------|\n| grad_expanded_x | 是 | Routing 后的目标张量梯度 | FP16/BF16/FLOAT |\n| expanded_row_idx | 是 | 行索引映射 | INT32 |\n\n### 输出\n| 输出 | 含义 | dtype |\n|------|------|-------|\n| grad_x | 输入梯度 | FP16/BF16/FLOAT |\n\n### 属性\n`top_k`（必需）、`drop_pad_mode`(0)、`active_num`(0)\n\n## 2. 核心公式\n```\ngradX_i = Σ_{t=0}^{topK} gradExpandedX[expandedRowIdx[i*topK + t]]\n```\n\n按 expandedRowIdx 反向 gather gradExpandedX，跨 topK 维 reduce sum。\n\n## 3. 模板 dispatch\n\n`KERNEL_TYPE_AIV_ONLY`。9 tiling key：3 模式（Dropless 1000-1002 / Activate 1010-1012 / PositionPad0 1100-1102）× 3 dtype。3 模板类：`MoeInitRoutingV2GradDroplessCompute` / `ActivateCompute` / `PositionPad0Compute`。arch35 regbase 有 3 套 TilingData（SplitH 200xxx / FullLoad 300xxx / 通用 400xxx）。\n\n## 4. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。Triton skeleton 标记 `reproducibility: pseudocode`。来源见 `ops-transformer-moe-init-routing-v2-grad`。\n\n\n", "ops/moe-init-routing-v2.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_init_routing_v2/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/moe-init-routing-v2.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_init_routing_v2/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_init_routing_v2/)。\n\n# MoeInitRoutingV2（MoE 路由 v2）\n\nCANN ops-transformer 的 `MoeInitRoutingV2` 是 MoE 路由 v2 版本。与 v1 相比：无 rowIdx 输入，新增 expert capacity 控制、drop/pad 模式、expert token 计数输出。来源见 `ops-transformer-moe-init-routing-v2`。\n\n## 1. 输入输出\n\n### 输入\n- x（FP16/BF16/FP32）、expertIdx（INT32）\n\n### 输出\n- expandedX、expandedRowIdx（INT32）\n- expert_tokens_count_or_cumsum（INT32，可选）\n- expert_tokens_before_capacity（INT32，可选）\n\n### 属性\n- active_num（默认0）、expert_capacity（默认0）、expert_num（默认0）、drop_pad_mode（默认0）、expert_tokens_count_or_cumsum_flag（默认0）、expert_tokens_before_capacity_flag（默认false）\n\n## 2. 公式\n\n`sort(expertIdx)` → `srcToDstWithCapacity(expertIdx, sortedRowIdx, expert_capacity)` → `expandedRowIdx / expandedX` → `expertTokenOut`。\n\n## 3. 架构支持\n\nA2 √、A3 √、950 ✓、**310P √**（v1 无 310P）。纯 Vector 核（MIX_AIV_1_0）。\n\n## 4. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。Triton skeleton 标记 `reproducibility: pseudocode`。\n\n\n", "ops/moe-init-routing-v3.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_init_routing_v3/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/moe-init-routing-v3.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_init_routing_v3/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_init_routing_v3/)。\n\n# MoeInitRoutingV3 (MoE routing 含动态/静态量化)\n\nCANN ops-transformer 中的 `MoeInitRoutingV3` 是 MoE routing 计算算子，V2 的升级版。支持不量化/动态量化（int8）/静态量化模式，输出 expanded_x + expanded_row_idx + expert_tokens_count_or_cumsum + expanded_scale。纯 AIV-only Vector 算子（无 matmul），核心操作是 sort + 位置映射 + 直方图 + 量化 + gather。\n\n## 1. 输入输出\n\n### 输入\n| 输入 | 必选/可选 | 含义 | dtype |\n|------|-----------|------|-------|\n| x | 必选 | token 特征输入 | INT8/FP16/BF16/FLOAT（950 +HIFLOAT8）|\n| expert_idx | 必选 | 每行对应的 K 个专家 id | INT32 |\n| scale | 可选 | 量化参数 | FLOAT |\n| offset | 可选 | 量化偏移 | FLOAT |\n\n### 输出\n| 输出 | 含义 | dtype |\n|------|------|-------|\n| expanded_x | 排序+量化后的展开 x | INT8/FP16/BF16/FLOAT（950 +FP8/HIFLOAT8）|\n| expanded_row_idx | 行索引映射 | INT32 |\n| expert_tokens_count_or_cumsum | 专家 token 计数/累计和 | INT64 |\n| expanded_scale | 量化 scale 输出 | FLOAT（950 +FP8_E8M0）|\n\n### 属性\n`active_num`、`expert_capacity`、`expert_num`、`drop_pad_mode`、`expert_tokens_num_type`、`expert_tokens_num_flag`、`quant_mode`、`active_expert_range`、`row_idx_type`\n\n## 2. 核心公式（6 步）\n1. `sortedExpertIdx, sortedRowIdx = keyValueSort(expertIdx, rowIdx)`\n2. `expandedRowIdxOut[sortedRowIdx[i]] = i`\n3. drop 模式：`expertTokensCountOrCumsum = Histogram(sortedExpertIdx)`\n4. 量化：动态 `row_max(abs(x))/127` + round；静态 `scale/offset`\n5. `expandedXOut[i] = quantResult[sortedRowIdx[i] % NUM_ROWS]`\n6. `availableIdxNum = |{x ∈ expertIdx | expert_start ≤ x < expert_end}|`\n\n## 3. 模板 dispatch\n\n`KERNEL_TYPE_MIX_AIV_1_0`（AIV-only）。~30 tiling key：\n- **FullLoad 高性能**（2000000 系列）：UNQUANTIZED/STATIC_QUANT/DYNAMIC_QUANT × GATHER/SCATTER\n- **非 FullLoad**：SortOneCore/SortMultiCore × Gather/Scatter × NonQuant/DynamicQuant/StaticQuant × NoDrop/Drop\n\n## 4. V2 -> V3 变更（README.md）\n1. 增加动态量化，支持 int8 动态量化输出\n2. 增加 activeExpertRange，筛选有效 expertId\n3. 删除 expertTokensBeforeCapacityFlag/输出，改用 expertTokensCountOrCumsumOut\n\n## 5. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。Triton skeleton 标记 `reproducibility: pseudocode`。来源见 `ops-transformer-moe-init-routing-v3`。\n\n\n", "ops/moe-init-routing.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_init_routing/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/moe-init-routing.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_init_routing/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/moe/moe_init_routing/)。\n\n# MoeInitRouting（MoE 路由）\n\nCANN ops-transformer 的 `MoeInitRouting` 是 MoE（Mixture of Experts）路由处理的第一阶段：根据 `MoeGatingTopKSoftmax` 的输出（expertIdx），对 token 特征按 expert 排序和扩展，输出 expandedX（按 expert 排列的 token 特征）、expandedRowIdx（映射关系）、expandedExpertIdx（排序后的 expert 索引）。来源见 `ops-transformer-moe-init-routing`。\n\n## 1. 输入输出\n\n### 输入（def.cpp L23-40）\n\n| 输入 | 必选 | dtype | 含义 |\n|---|---|---|---|\n| x | 必选 | FP16/BF16/FP32 | token 特征输入 |\n| rowIdx | 必选 | INT32 | 每个位置对应的原始行位置 |\n| expertIdx | 必选 | INT32 | MoeGatingTopKSoftmax 的输出，每行对应的 K 个专家 |\n\n### 输出（def.cpp L41-55）\n\n| 输出 | dtype | 含义 |\n|---|---|---|\n| expandedX | FP16/BF16/FP32 | 按 expert 排序扩展后的特征 |\n| expandedRowIdx | INT32 | expandedX 和 x 的映射关系 |\n| expandedExpertIdx | INT32 | 排序后的 expertIdx |\n\n### 属性（def.cpp L56）\n- activeNum（INT64，必选）：总的最大处理 row 数，expandedXOut 只有这么多行有效。\n\n## 2. 核心公式\n\n`expandedExpertIdx, sortedRowIdx = keyValueSort(expertIdx, rowIdx)`\n`expandedRowIdx[sortedRowIdx[i]] = i`\n`expandedX[i] = x[sortedRowIdx[i] % numRows]`

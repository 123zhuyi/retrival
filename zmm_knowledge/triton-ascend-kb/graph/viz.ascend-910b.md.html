 "via": ["llm"], "why": "同属优化知识，主题相关", "symmetric": false, "cross": true}, {"source": "runbooks/memory-sram/exp_causal_conv1d_update_003.md", "target": "ascend-910b.md", "type": "explains", "weight": 1.0, "via": ["llm"], "why": "同属优化知识，主题相关", "symmetric": false, "cross": true}, {"source": "runbooks/memory-sram/exp_solve_tril_002.md", "target": "ascend-910b.md", "type": "explains", "weight": 1.0, "via": ["llm"], "why": "同属优化知识，主题相关", "symmetric": false, "cross": true}, {"source": "runbooks/memory-sram/preload-extract-slice-eliminate-reread.md", "target": "ascend-910b.md", "type": "explains", "weight": 1.0, "via": ["llm"], "why": "同属优化知识，主题相关", "symmetric": false, "cross": true}, {"source": "runbooks/memory-sram/register-shift-sliding-window.md", "target": "ascend-910b.md", "type": "explains", "weight": 1.0, "via": ["llm"], "why": "同属优化知识，主题相关", "symmetric": false, "cross": true}], "bodies": {"ascend-910b.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/hardware/ascend_910b.md\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/hardware/ascend_910b.md` 迁移而来，原始为硬件概念页，未做内容改写，仅转 OKF frontmatter。\n\n# Ascend 910B2/910B3 Hardware Reference\n\n## Core Architecture\n\nEach Ascend AI Core consists of two distinct compute units:\n\n| Unit | Purpose | Operations |\n|------|---------|-----------|\n| **Cube unit** | GEMM / matrix multiply | tl.dot, batch matmul, convolution |\n| **Vector unit** | Elementwise / normalization | tl.exp, tl.sum, arithmetic, LayerNorm |\n\nThese two units can execute concurrently within a single AI Core when scheduled correctly (see `dl.async_task` in techniques/ilp).\n\n### Core Ratio\n\nOn 910B2/910B3, the typical hardware configuration is:\n- 1 Vector core per 2 Cube cores (in terms of compute resources)\n- For Triton scheduling, both are accessed via the same AI Core program model\n\n## Grid Semantics: Physical Core Binding\n\nAscend grid semantics differ fundamentally from GPU (CUDA) grid semantics:\n\n| Dimension | CUDA/GPU | Ascend |\n|-----------|---------|--------|\n| Grid meaning | Logical task dimension | Physical core group |\n| Hardware mapping | Auto-mapped by driver | Must match physical topology |\n| Grid size limit | Very large (millions of blocks) | ≤ Total AI Core count |\n| 2D grid | Logical (rows × cols) | Must match physical topology |\n| Current kernel limit | Platform-dependent | ≤ 65535 cores |\n\n**Key implication**: On Ascend, you cannot launch more grid blocks than there are physical AI Cores. Attempting to do so requires the `TRITON_ALL_BLOCKS_PARALLEL` environment variable or multi-round scheduling.\n\n### 2D Grid Constraint\n\n2D grids must match the physical core layout of the device. Do not assume arbitrary (M, N) grid shapes are valid. Use 1D grids and compute 2D indices manually in the kernel:\n\n```python\n# Safe: 1D grid, compute 2D indices in kernel\npid = tl.program_id(axis=0)\npid_m = pid // num_pid_n\npid_n = pid % num_pid_n\n```\n\n## On-Chip Memory (UB)\n\n**UB = Unified Buffer**: the on-chip SRAM for each AI Core.\n\n| Hardware | UB Capacity per Core |\n|---------|---------------------|\n| Atlas 800T/I A2 (910B2/B3) | **192 KB** |\n\nAll tile data for a single kernel iteration must fit within 192KB:\n\n```\nTile footprint = sum of all live tensor tile sizes\n               = BLOCK_M * BLOCK_K * 2B (fp16 A)\n               + BLOCK_K * BLOCK_N * 2B (fp16 B)\n               + BLOCK_M * BLOCK_N * 4B (fp32 acc)\n               ≤ 192KB\n```\n\nExample for `BLOCK_M=128, BLOCK_K=256, BLOCK_N=128, fp16`:\n```\nA tile: 128 * 256 * 2 = 65,536B = 64KB\nB tile: 256 * 128 * 2 = 65,536B = 64KB\nacc:    128 * 128 * 4 = 65,536B = 64KB\nTotal:  192KB (exactly at limit — leave margin in practice)\n```\n\n## HBM Bandwidth\n\n- **Theoretical peak**: ~1.8 TB/s (shared across all cores)\n- **Practical**: bandwidth is shared when multiple MTE2/MTE3 ops run simultaneously\n- For memory-bound roofline: `Time = Data_volume / 1.8e12`\n\n## Core Detection at Runtime\n\n```python\nimport torch\nfrom triton.runtime import driver\n\ndevice = torch.cuda.current_device()\nprops = driver.active.utils.get_device_properties(device)\nnum_sms = props[\"multiprocessor_count\"]    # number of AI Cores\n```\n\nUse `num_sms` to set the persistent kernel grid size or compute optimal tile counts.\n\n## Compilation Optimization Options\n\nThese options are passed via `dl.compile_hint()` or environment variables:\n\n| Option | Purpose | Default |\n|--------|---------|---------|\n| `multibuffer` | Pipeline parallel data movement (double-buffer) | true |\n| `unit_flag` | Cube data output optimization (format selection) | None |\n| `enable_hivm_auto_cv_balance` | Automatic Cube/Vector balance optimization | None |\n| `tile_mix_vector_loop` | Vector core split granularity for mixed tiles | None |\n| `tile_mix_cube_loop` | Cube core split granularity for mixed tiles | None |\n| `set_workspace_multibuffer N` | Multi-level prefetching (N = buffer depth) | None |\n| `auto_blockify_size` | Maps to TRITON_ALL_BLOCKS_PARALLEL | 1 |\n\n### Usage\n\n```python\nimport triton_ascend.language as dl\n\n@triton.jit\ndef my_kernel(...):\n    dl.compile_hint(\"multibuffer=true\")\n    dl.compile_hint(\"enable_hivm_auto_cv_balance\")\n    dl.compile_hint(\"tile_mix_vector_loop=4\")\n    dl.compile_hint(\"tile_mix_cube_loop=2\")\n    dl.compile_hint(\"set_workspace_multibuffer 4\")\n    # ... kernel body\n```\n\n### `dot_pad_only_k` Hint\n\nFor Cube operations where padding is only needed along the K dimension:\n\n```python\ndl.compile_hint(\"dot_pad_only_k\")\n```\n\n## Environment Variables\n\n| Variable | Purpose | Values |\n|----------|---------|--------|\n| `TRITON_ALL_BLOCKS_PARALLEL` | Submit all blocks in one scheduling round | 0 (disabled), 1 (enabled) |\n\n```bash\n# Enable all-blocks-parallel scheduling (avoids multi-round scheduling overhead)\nexport TRITON_ALL_BLOCKS_PARALLEL=1\npython3 my_kernel_test.py\n```\n\nWhen `TRITON_ALL_BLOCKS_PARALLEL=1`, all grid blocks are submitted to the hardware in a single round. Without it, blocks may be submitted in multiple rounds, adding scheduling latency for large grids.\n\n## 910B2-Specific Features\n\n### `dl.grouped_launch_diagonal`\n\nHardware-level diagonal PID mapping API available on 910B2:\n\n```python\nimport triton_ascend.language as dl\n\npid_m, pid_n = dl.grouped_launch_diagonal(\n    pid,       # linear program ID\n    num_pid_m, # total tiles in M dimension\n    num_pid_n, # total tiles in N dimension\n    GROUP_SIZE # tiles per diagonal group\n)\n```\n\nThis performs the PID → diagonal (m, n) remapping at hardware level, avoiding software overhead.\n\n### Data Format Constraints for Dot API\n\nThe Dot API (tl.dot / Cube unit) requires specific input/output tensor formats on 910B2. Specifically:\n- Input matrices must be in the correct fractal/ND format expected by the Cube unit\n- The compiler handles format conversion automatically when using standard tl.dot\n- Custom format manipulation requires using the Cube API directly (advanced usage)\n\n**Note**: `tl.make_block_ptr` with `order=(1, 0)` (row-major) is the standard format for Dot API compatibility.\n\n## Pipeline Architecture\n\nThe AI Core pipeline:\n\n```\nHBM → [MTE2: Load] → UB ← [Vector: Compute] → UB → [MTE3: Store] → HBM\n                                    ↑\n                              [MTE1: Weight Load from L2]\n```\n\n- **MTE2**: Load from HBM or L2 to UB (external reads)\n- **MTE3**: Store from UB to HBM (external writes)\n- **MTE1**: Load from L2/global memory to Cube input buffers\n- **Vector**: Elementwise and reduction operations on UB\n- **Cube**: Matrix multiply using Cube input/output buffers\n\nThese stages can pipeline (multi-buffer) when data dependencies allow.\n\n## 相关页面\n- techniques/tiling — UB capacity constraints and tile sizing\n- techniques/ilp — Pipeline stages and how to overlap them\n- techniques/core_mapping — Grid constraints and diagonal mapping\n- workflows/profiling — Profiling metrics mapped to pipeline stages\n- api/triton_api_cheatsheet — dl.compile_hint and environment variable reference\n\n\n", "ascend-patterns.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/hardware/ascend_patterns.md\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/hardware/ascend_patterns.md` 迁移而来，原始为硬件概念页，未做内容改写，仅转 OKF frontmatter。\n\n# Ascend NPU 特有语法与模式\n\n> 本页汇总 Triton-Ascend 与标准 GPU Triton 的关键差异，来自 `raw/experiences/general_ascend/` 12 条经验。  \n> **必读**：实现任何 kernel 前先检查本页约束，避免编译错误。\n\n## 1. Grid 配置规范\n\n**约束**：\n- Grid 必须是 `tuple` 类型，最多 3 维\n- 各维度乘积 **≤ 65535**（`x * y * z ≤ 65535`）——**默认硬件限制**\n- 不能使用 4 维 Grid\n\n> **环境变量例外**：设置 `TRITON_ALL_BLOCKS_PARALLEL=1` 时，Runtime 会尝试让所有 block 并发调度，此时 Grid 乘积可超过 65535，但仍受物理核数（910b2: 24 VEC + 24 Cube，910b3: 20+20）限制。**生产代码不应依赖此环境变量**——它会绕过硬件调度保障，可能导致 OOM 或调度死锁。若 block 数量确实需要超过 65535，使用 grid-stride loop 代替。\n\n```python\n# 正确\ngrid = (48,)            # 1D，乘积=48 ✓\ngrid = (24, 2)          # 2D，乘积=48 ✓\n\n# 错误\ngrid = 48               # 不是 tuple ✗\ngrid = (256, 256)       # 乘积=65536 > 65535 ✗\ngrid = (12, 2, 2, 1)   # 4维 ✗\n```\n\n**大 shape 处理**：当 `n_blocks > 65535` 时，使用 grid-stride loop（persistent kernel）：\n```python\ngrid = (min(n_blocks, NUM_CORES),)  # 固定 grid\n# kernel 内部循环处理剩余任务\n```\n\n经验文件：exp_ascend_grid_001，exp_ascend_grid_large_shape_001\n\n---\n\n## 2. tl.constexpr 用法\n\n**规则**：`tl.constexpr` 仅允许在 kernel 函数参数声明中使用，**禁止**在 host 侧使用。\n\n```python\n# 正确：kernel 参数\n@triton.jit\ndef kernel(ptr, n, BLOCK_SIZE: tl.constexpr): ...\n\n# 错误：host 侧使用\ndef forward():\n    BLOCK_SIZE: tl.constexpr = 128  # ✗ 语法错误\n    BLOCK_SIZE = 128  # ✓ host 侧直接用普通变量\n```\n\n经验文件：exp_constexpr_001\n\n---\n\n## 3. 禁用语法列表\n\n| 禁止 | 替代方案 | 说明 |\n|------|----------|------|\n| `return` / `break` / `continue` | mask 控制执行逻辑 | Triton kernel 无提前退出 |\n| `lambda` 表达式 | `tl.where` / 内联函数 | 编译不支持 |\n| 链式布尔运算 `a and b and c` | 分步计算 mask 后组合 | 用 `&` 按位与代替 |\n| `tensor[i]` 直接索引 | `tl.load` / `tl.store` | 必须通过内存访问 API |\n| `tl.swizzle2d` | 使用 `grouped_launch_diagonal` | Ascend 不支持 |\n| int64 CMP/ADD | 转换为 fp32 / int32 | 无原生 SIMD int64 指令 |\n| 负数偏移 | `tl.maximum(offset, 0)` + mask | 避免负地址访问 |\n\n经验文件：exp_api_001，exp_scalar_cast_001\n\n---\n\n## 4. 核心数与并行模式\n\n**910b2 标准核心数**：\n- Cube（矩阵计算）核心：通常 20/24 个\n- Vector（向量计算）核心：通常 48 个\n- 总 AI Core 数：通常 **20（Cube） + 48（Vector）= 68 个**，具体以 `torch_npu.npu_core_num()` 为准\n\n```python\n# 获取实际核心数\nVEC_CORE_NUM = torch_npu.npu_core_num()  # 通常 48（Vector）\nCUBE_CORE_NUM = 20  # 固定值\n\n# 推荐：按核心数配置 grid\ngrid = (VEC_CORE_NUM,)  # 向量密集型算子\n```\n\n经验文件：exp_ascend_core_num_001，exp_ascend_parallel_pattern_001\n\n---\n\n## 5. 大 Shape 分块策略\n\n当输入 shape 极大时（如超长序列、大词表），单 kernel 无法处理：\n\n```python\n# 策略：大 shape 分割为多个 sub-block，每个 program 处理一段\n@triton.jit\ndef large_shape_kernel(ptr, n, BLOCK_SIZE: tl.constexpr, MAX_BLOCKS: tl.constexpr):\n    pid = tl.program_id(0)\n    # grid-stride：每个 core 处理多个 block\n    for block_id in range(pid, tl.cdiv(n, BLOCK_SIZE), tl.num_programs(0)):\n        offs = block_id * BLOCK_SIZE + tl.arange(0, BLOCK_SIZE)\n        ...\n```\n\n经验文件：exp_ascend_large_shape_block_001\n\n---\n\n## 6. where/split/slice 操作\n\n| 操作 | 正确写法 | 注意事项 |\n|------|----------|----------|\n| 条件选择 | `tl.where(cond, x, y)` | cond 必须是 mask tensor，不能是 Python bool |\n| 张量切片 | `tl.load(ptr + start + tl.arange(0, size))` | 不能直接用 `[start:end]` 切片 |\n| 维度分割 | 手动计算偏移，分两次 load | 无原生 split 操作 |\n\n经验文件：exp_ascend_where_001，exp_slice_001，exp_ascend_split_001\n\n---\n\n## 7. Tensor 创建\n\n| 操作 | Triton API |\n|------|-----------|\n| 零张量 | `tl.zeros([SIZE], dtype=tl.float32)` |\n| 全填充 | `tl.full([SIZE], value, dtype=tl.float32)` |\n| 整数序列 | `tl.arange(0, SIZE)` |\n| 2D 广播 | `tl.arange(0, M)[:, None]` + `tl.arange(0, N)[None, :]` |\n\n经验文件：exp_tensor_create_001\n\n---\n\n## 相关页面\n\n- hardware/constraints_cheatsheet.md — 强制约束速查（UB/对齐/Grid）\n- [hardware/ascend_910b.md](ascend-910b.md) — 910b2/910b3 硬件规格\n- techniques/performance_tuning.md — 性能调优通用原则\n- workflows/debugging.md — 调试与稳定性指南\n\n\n", "runbooks/memory-sram/exp_causal_conv1d_update_003.md": "\n\n## Memory Access Optimization: make block ptr hardware acceleration\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2/910b3，tile 加载为性能敏感路径；失效边界：D 较小（<2048）时 block_ptr 与标量 load 差异收窄，混合方案的 extract_slice 开销需实测确认；地址不规则的 gather 场景 block_ptr 不适用）\n\n### 原则\n- **make block ptr hardware acceleration**：`tl.make_block_ptr` 在 Ascend NPU 上映射为硬件 block transfer 指令（类似 DMA），一条指令搬运整个 tile，包含自动边界检查和零填充（padding_option='zero'）。这是 Ascend 专为 tile 加载优化的硬件原语，效率远高于通用标量 load 指令。在 causal_conv1d_update 中用于加载权重 `[D_CHK_SIZE, W]` 和存储输出 `[1, D_CHK_SIZE, T_CHK_SIZE]`。\n- **scalar load degradation**：用 4 次独立 `tl.load(weight_ptr + d_offs * width + offset, mask=mask_w)` 替代 1 次 `tl.load(make_block_ptr(...))` 会导致显著性能倒退。每条独立 load 需要独立的标量地址计算，丧失 block transfer 的 DMA 级效率。这在 W_IS_4 展开优化的负收益 case 中是首要根因。\n- **block ptr boundary check**：`make_block_ptr(..., boundary_check=(0, 1))` 由硬件处理边界检查，不产生软件 mask 运算开销。配合 `padding_option='zero'`，越界访问自动填零，消除 kernel 内的显式 mask 分支。\n- **hybrid loading strategy**：方案 B（进阶）：保留 make_block_ptr 加载权重 tile `[D_CHK_SIZE, W]`，然后展开 W 循环手动提取各列 `w0=tl.extract_slice(w, (0,0), (D_CHK,1))`，同时消除 x_b/w/out 的 3 次 transpose。这样既保留了 block transfer 的硬件加速，又获得了循环展开的数据编排消除收益。需实测验证大 D 时 w 的 4 次 extract_slice 开销是否可忽略。\n- **weight prefetch leverage**：make_block_ptr 提供硬件预取提示，允许 Ascend MTE2 在 Cube 计算期间异步预取下一 tile 的权重。独立 tl.load 无法提供等效的预取语义，导致 MTE2→Vector 流水线停顿增加。\n\n### 代码/骨架出处\n- `hybrid_approach`:\n```python\n# 方案 B: 保留 block_ptr 加载 + 消除 transpose\nw = tl.load(make_block_ptr(weight_ptr, shape=(dim, width), ...,\n          offsets=(di * D_CHK_SIZE, 0), block_shape=(D_CHK_SIZE, width)))\n# w 保持 [D_CHK, 4]，无需 transpose\nw0 = tl.extract_slice(w, (0, 0), (D_CHK, 1), (1, 1))\nw1 = tl.extract_slice(w, (0, 1), (D_CHK, 1), (1, 1))\nw2 = tl.extract_slice(w, (0, 2), (D_CHK, 1), (1, 1))\nw3 = tl.extract_slice(w, (0, 3), (D_CHK, 1), (1, 1))\n# x_b 保持 [D_CHK, buf] 布局，直接提取 4 个滑动窗口切片\nx_s0 = tl.extract_slice(x_b, (0, 0), (D_CHK, T_CHK), (1, 1))\nx_s1 = tl.extract_slice(x_b, (0, 1), (D_CHK, T_CHK), (1, 1))\nx_s2 = tl.extract_slice(x_b, (0, 2), (D_CHK, T_CHK), (1, 1))\nx_s3 = tl.extract_slice(x_b, (0, 3), (D_CHK, T_CHK), (1, 1))\nout_block = (x_s0 * w0 + x_s1 * w1 + x_s2 * w2 + x_s3 * w3)\n```\n\n**坏实践（反例）**：为配合 W 循环展开，把权重 tile 的 block_ptr 加载退化为 W 次独立标量 load\n```python\nw0 = tl.load(weight_ptr + d_offs * width + 0, mask=mask_w)  # 4 次独立标量 load\nw1 = tl.load(weight_ptr + d_offs * width + 1, mask=mask_w)\nw2 = tl.load(weight_ptr + d_offs * width + 2, mask=mask_w)\nw3 = tl.load(weight_ptr + d_offs * width + 3, mask=mask_w)\n```\n后果：每次 load 都要独立标量地址计算，丧失硬件 block transfer（DMA 级）效率与 MTE2 异步预取，D≥2048 时与 block_ptr 方案差 2-3x；这正是 W_IS_4 展开优化出现负收益的首要根因。✅ 正解：混合方案——保留 `make_block_ptr` 整块加载 `[D_CHK_SIZE, W]`，再用 `tl.extract_slice` 提取各列，硬件加速与数据编排消除兼得。\n\n**已知实例**：conv §raw (`experiences/conv/exp_causal_conv1d_update_003.yaml`)\n- 声称性能收益：block_ptr vs scalar load: 在 D≥2048 场景差异可达 2-3x（与循环展开组合效应）\n- 备注：此经验阐明 Ascend 上 make_block_ptr 与标量 tl.load 的根本差异：前者是硬件 DMA 原语，后者是通用标量指令。在性能敏感的 tile 加载路径上，应优先使用 make_block_ptr。若需手动索引权重（如 W 循环展开），应采用混合方案（block_ptr 加载 + extract_slice 切片）而非退化到独立 tl.load。\n\n\n", "runbooks/memory-sram/exp_solve_tril_002.md": "\n\n## Memory Access Optimization: preload extract slice eliminate hbm read\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2/910b3/91093/91095，fp16/bf16/fp32，对角块 block_size=16（实测 BT=16/32/64）；失效边界：小 grid（如 B=1、T=512）场景 preload 的寄存器操作开销与省下的 global load 基本抵消（实测仅 1.01x）；该模式依赖 Triton 不支持运行时动态索引这一前提，若编译器行为变化需重估）\n\n### 原则\n- **preload extract slice eliminate hbm read**：当矩阵块已在循环外通过单次 `tl.load(block_ptr)` 加载到寄存器后，循环内不应再用 `tl.load(A + row_offset)` 逐行重新从 HBM 读取。虽然 Triton 不支持 `b_A[i, :]` 动态寄存器索引，但可以使用 `tl.extract_slice(neg_A, (i, 0), (1, 16), (1, 1))` + `tl.reshape` 从寄存器块提取行数据，完全消除循环体内的 HBM 访问。\n- **why triton cannot dynamic index**：`b_A[i, :]` 在 Triton 中会报错 `ValueError('unsupported tensor index: int32[]')`——i 是运行时 int32，Triton 的 block tensor 不支持运行时动态索引。`tl.extract_slice` 是 Triton 支持的寄存器块子集提取原语，offset 为运行时变量时生成动态偏移指令（开销低于 global load）。\n- **preload pattern**：循环前预加载并取反：`neg_A = -b_A`（或保留原值）。循环内 `b_a = tl.extract_slice(neg_A, (i, 0), (1, BLOCK), (1, 1))` + `b_a = tl.reshape(b_a, (BLOCK,))`。BLOCK=16 时 reshape 零开销。\n- **multi block extension**：对于分块矩阵（如 32×32 有 2 个对角块、64×64 有 4 个对角块），每个对角块独立预加载并独立 extract_slice，块间无依赖。\n- **tradeoff analysis**：小 grid（B=1, T=512）场景下 preload 的额外寄存器操作开销可能与省下的 global load 抵消（实测 1.01x）。大 grid 场景累计效益显著（1.37x）。选择始终使用 extract_slice 可统一代码路径。\n\n### 代码/骨架出处\n- `preload_extract`:\n```python\n# 循环外：预加载整个 16×16 块到寄存器\nneg_A = -b_A  # b_A 已通过 tl.load(make_block_ptr(...)) 加载\n\n# 循环内：从寄存器提取，零 HBM 访问\nfor i in range(2, BT):\n    b_a = tl.extract_slice(neg_A, (i, 0), (1, 16), (1, 1))\n    b_a = tl.reshape(b_a, (16,))\n    b_a = b_a + tl.sum(b_a[:, None] * b_A, 0)\n    b_A = tl.where((o_i == i)[:, None], b_a, b_A)\n```\n- `before_hbm_read`:\n```python\n# 反模式：循环内逐行从 HBM 重新读取（数据已在寄存器中）\nfor i in range(2, min(16, T - i_t * 16)):\n    b_a = -tl.load(A + (i_t * 16 + i) * H*BT + o_i + offset)  # HBM read!\n    ...\n```\n\n**坏实践（反例）**：循环内逐行从 HBM 重读已预加载到寄存器的块数据（即上方 `before_hbm_read` 反模式）\n```python\nfor i in range(2, BT):\n    b_a = -tl.load(A + (i_t * 16 + i) * H*BT + o_i + offset)  # 数据已在寄存器块 b_A 中\n```\n后果：每行一次多余 GM 读，循环体被内存延迟支配。注意不能写成 `b_A[i, :]`——Triton 对运行时 int32 下标报 `ValueError('unsupported tensor index')`。✅ 正解：循环外单次 `tl.load(block_ptr)` 预加载整块，循环内 `tl.extract_slice` + `reshape` 从寄存器块提取行，循环体零 HBM 访问。\n\n**已知实例**：solve_tril §raw (`experiences/solve_tril/exp_solve_tril_002.yaml`)\n- 声称性能收益：1.01x-1.37x（BT=16, V4 vs V1）；1.25x-1.27x（BT=32, V4 vs V1，首次优化）；1.11x-1.13x（BT=64, V4 vs V1）\n- 备注：此为 V4 优化的核心。与 V1（exp_solve_tril_001）组合后，ORIGINAL vs V4 累计加速比：BT=16 达 1.42x-2.54x，BT=32 达 1.26x-1.29x，BT=64 达 1.55x-1.57x。\n\n\n", "runbooks/memory-sram/preload-extract-slice-eliminate-reread.md": "\n\n## OPT-23 preload + extract_slice 消除循环内同一数据重复 HBM 读取\n\n【优化维度】：内存｜访存效率\n【泛化层级】：条件性（迁移条件：循环外已用 block_ptr 加载整个块，循环内需要按行/列/子块访问同一数据；失效边界：数据未在循环外加载，或 extract_slice 偏移无法表达）\n\n<原则：Triton block tensor 不支持动态索引（`b_A[i, :]` 报错）。当矩阵块已在循环外加载到寄存器，循环内需要按行/列/子块访问同一数据时，应使用 `tl.extract_slice` 从寄存器提取，而非退化到 `tl.load(A + row_offset)` 重新从 HBM 读取。>\n\n**核心问题**：\n\n```python\n# 循环外一次性预加载整个块到寄存器\nb_A = tl.load(make_block_ptr(A, ..., block_shape=(BLOCK, BLOCK)))\n\n# 错误：循环内逐行重新从 HBM 读取同一数据\nfor i in range(2, BLOCK):\n    b_a = tl.load(A + i * stride)  # 重复 HBM 读！\n```\n\n**正例**：\n\n```python\n# 循环外：一次性预加载整个块到寄存器\nb_A = tl.load(make_block_ptr(A, ..., block_shape=(BLOCK, BLOCK)))\nneg_A = -b_A  # 预取反后的块\n\n# 循环内：从寄存器提取，零 HBM 访问\nfor i in range(2, BLOCK):\n    b_a = tl.extract_slice(neg_A, (i, 0), (1, BLOCK), (1, 1))\n    b_a = tl.reshape(b_a, (BLOCK,))\n    # ... 使用 b_a 计算 ...\n```\n\n**为什么不用 `b_A[i, :]`**？\n\nTriton 报错 `ValueError('unsupported tensor index: int32[]')`——`i` 是运行时 int32，block tensor 不支持动态索引。`tl.extract_slice` 是 Triton 支持的寄存器块子集提取原语，offset 为运行时变量时生成动态偏移指令，开销远低于 HBM load。\n\n**适用条件**：\n\n- 数据已在循环外的寄存器中（通过 block_ptr 或一次性 load）\n- 循环内需要按行/列/子块访问同一数据\n- 循环次数 ≥ 2，预加载的额外寄存器操作可被摊还\n\n**收益与权衡**：\n\n| 场景 | 收益 |\n|---|---|\n| 大 grid（B≥4, T≥1024） | 显著（1.27x–1.37x），HBM load 节省累积放大 |\n| 小 grid（B=1, T=512） | 微小（~1.01x），额外寄存器操作与省下的 load 几乎抵消 |\n| 多对角块 | 每块独立预加载，各省循环体内 HBM 读取 |\n\n**坏实践（反例）**：\n```python\nb_A = tl.load(make_block_ptr(A, ...))\nfor i in range(BLOCK):\n    row = tl.load(A + i * stride)  # 重复读取已在寄存器中的数据\n```\n后果：同一数据多次 HBM 读取，带宽浪费。✅ 正解即 `tl.extract_slice`。\n\n## 已知实例（P3 挂载）\n\n### Experience YAML 反链\n- `exp_solve_tril_002` — Memory Access Optimization （收益 1.01x-1.37x（BT=16, V4 vs V1）；1.25x-1.27x（BT=32, V4 vs V1，首次优化）；1.11x-1.13x（BT=64, V4 vs V1））\n  - 此为 V4 优化的核心。与 V1（exp_solve_tril_001）组合后，ORIGINAL vs V4 累计加速比：BT=16 达 1.42x-2.54x，BT=32 达 1.26x-1.29x，BT=64 达 1.55x-1.57x。\n\n\n", "runbooks/memory-sram/register-shift-sliding-window.md": "\n\n## OPT-22 寄存器移位复用滑动窗口，消除重复 HBM 读\n\n【优化维度】：内存｜访存效率\n【泛化层级】：条件性（迁移条件：固定小窗口 W≤8 的序列处理，窗口访问为严格移位；失效边界：W 大、随机窗口访问、或 seq_len 太短无法摊还初始化开销）\n\n<原则：对卷积、移动平均、SSM 前缀处理等滑动窗口场景，若每次迭代都重新加载全部 W 个窗口元素，会造成大量冗余 HBM 读。将窗口驻留命名寄存器，每步仅加载 1 个新元素，其余 W-1 个通过寄存器间移位复用，可消除 (W-1)/W 的 HBM 读。>\n\n**核心思想**：\n\n```\n迭代 i:   [col0, col1, col2, col3] → 计算 → store\n迭代 i+1:         [col1, col2, col3, new_col] → 计算 → store\n                ↑ 移位（零 load）  ↑ 仅此 1 次 load\n```\n\n**正例（W=4）**：\n\n```python\n# 初始化：一次加载 W 个窗口元素\ncol0 = tl.load(ptr + 0*stride, mask=mask)\ncol1 = tl.load(ptr + 1*stride, mask=mask)\ncol2 = tl.load(ptr + 2*stride, mask=mask)\ncol3 = tl.load(ptr + 3*stride, mask=mask)\n\nfor i in range(seq_len - W):\n    acc = col0*w0 + col1*w1 + col2*w2 + col3*w3\n    tl.store(out + i*stride, acc, mask=mask)\n    # 寄存器移位：零 HBM 操作\n    col0 = col1; col1 = col2; col2 = col3\n    col3 = tl.load(ptr + (i+W) * stride, mask=mask)  # 仅 1 次新 load\n```\n\n**适用条件**：\n\n| 条件 | 说明 |\n|---|---|\n| W 固定且小 | W ≤ 8，所有窗口元素可驻留寄存器 |\n| 窗口访问严格移位 | 最旧丢弃，其余左移，末尾新元素 |\n| seq_len 足够大 | ≥ 64，初始化的 W 次 load 可被摊还 |\n| 需要滑动窗口连续性 | 卷积、移动平均、SSM 前缀处理 |\n\n**收益**：W=4 时从每步 4 次 load 降至 1 次 load + 3 次寄存器移位，消除 75% HBM 读。\n\n**与重叠 T-tiling 的关系**：\n\n- 寄存器滑动窗口：用于**无 T-tiling** 的 Prefill kernel（逐 token 顺序处理）。\n- 重叠 T-tiling：用于**有 T-tiling** 的 Update kernel（跨 tile 边界连续性）。\n\n两者解决不同维度问题，可在同一 kernel 族中并存。\n\n**坏实践（反例）**：\n```python\nfor i in range(seq_len):\n    # 每步都重新加载 W 个元素\n    for w in range(W):\n        x[w] = tl.load(ptr + (i+w)*stride)\n```\n后果：W=4 时每步 4 次 HBM 读，带宽浪费。✅ 正解即寄存器移位复用。\n\n## 已知实例（P3 挂载）\n\n### Experience YAML 反链\n- `exp_causal_conv1d_prefill_002` — Memory Access Optimization （收益 消除 75% 的 token load，实测贡献 Prefill kernel 整体加速比中的最大份额（与 2D Grid + DIM_IS_MULTIPLE 组合达 1.60x 平均加速比，最高 1.84x））\n  - 滑动窗口寄存器复用是 Prefill kernel 最核心的创新，利用了 W=4 的小卷积核特性。此模式可推广到任何固定小窗口的序列处理 kernel（如移动平均、指数平滑、small-kernel 1D conv），前提是窗口大小在编译期已知且足够小（≤8）。\n\n\n", "runbooks/compute-pipeline/exp_expand_serial_001.md": "\n\n## Scheduling Optimization: compilation specialization control\n\n【优化维度】：多核并行与负载均衡\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3, 91093, 91095；失效边界：本条是 baseline 级实现——串行循环 + `tl.get_element` 标量抽取 ILP 极低，仅适合 MAX_NUM_TOKENS ≤ 128 的小 batch 功能场景；高性能场景应重构为 scatter/gather 向量化；do_not_specialize 仅适用于不影响控制流的标量）\n\n### 原则\n- **compilation specialization control**：The kernel uses `do_not_specialize` for `replace_from` and `replace_to` arguments. This prevents the compiler from generating a new kernel version for every unique scalar value, reducing compilation overhead and binary size.\n- **serial expansion loop**：The core logic relies on a serial loop `for i in tl.range(0, blockSize)` to iterate over the batch elements within a block. This simplifies the handling of variable-length expansions but limits the instruction-level parallelism (ILP) and throughput compared to a fully vectorized approach.\n- **scalar register extraction**：Inside the loop, `tl.get_element` is used to extract scalar values (`num_tokens`, `start_idx`, `src_val`) from the vector registers loaded earlier. This allows for per-element calculation of output pointers and masks but introduces overhead associated with scalar extraction from vector lanes.\n- **masked vector store**：The output is written using a masked store operation where the mask is dynamically generated based on the `num_tokens` for each specific batch element, ensuring memory safety for jagged arrays.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/169-expand_kernel.py\n```\n\n**坏实践（反例）**：不对 `replace_from`/`replace_to` 这类纯数值标量加 `do_not_specialize` → 每个新标量值触发一次 JIT 重编译，编译开销与二进制体积持续膨胀 → ✅ 正解即本条：对纯数值标量禁用特化；同时注意本条的串行循环 + 标量抽取本身是已标注的待优化点。\n\n**已知实例**：misc §raw (`experiences/misc/exp_expand_serial_001.yaml`)\n- 声称性能收益：Baseline\n- 备注：This implementation represents a naive approach to the expand operation. While functionally correct, the serial loop and scalar extraction (`tl.get_element`) inside the loop are significant performance bottlenecks. For high-performance scenarios, refactoring to remove the loop or utilizing a scatter/gather pattern is recommended.\n\n\n", "runbooks/compute-pipeline/exp_fused_norm_rope_matmul_001.md": "\n\n## Scheduling Optimization: hardware unit isolation\n\n【优化维度】：多核并行与负载均衡\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3；失效边界：依赖 dl dialect 异构调度（CANN/Triton 栈支持）；融合链各 stage 间数据必须能驻留 L0/L1；归一化/rope 的 vector 侧耗时若接近 matmul 的 cube 侧，流水重叠空间才存在，否则收益减半）\n\n### 原则\n- **hardware unit isolation**：The kernel explicitly utilizes `dl.async_task` to dispatch the matrix multiplication (`partial_matmul_kernel`) to the Cube unit and the normalization/RoPE operations (`fused_single_norm_and_partial_rope_kernel`) to the Vector unit. This maximizes utilization by allowing the specialized hardware units to operate in parallel or pipelined fashion.\n- **operator fusion**：RMSNorm and Rotary Positional Embedding (RoPE) are fused into a single kernel execution stream. This significantly reduces global memory read/write overhead by keeping intermediate data in high-speed memory or registers, avoiding the need to write back normalized activations before applying RoPE.\n- **asynchronous pipeline**：By using `scope=dl.async_task.cube` and `scope=dl.async_task.vector`, the implementation enables asynchronous execution. This allows the compute-intensive matrix multiplication on the Cube to potentially overlap with the vector operations or data movement, effectively hiding latency and improving throughput.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/081-fused_single_norm_rope_matmul_kernel.py\n```\n\n**坏实践（反例）**：归一化、RoPE、matmul 各自独立 kernel → 中间激活多次 HBM 往返，cube/vector 串行等待 → ✅ 正解即本条：vector 侧融合归一化+RoPE，cube 侧做 matmul，async scope 流水重叠。\n\n**已知实例**：matmul §raw (`experiences/matmul/exp_fused_norm_rope_matmul_001.yaml`)\n- 声称性能收益：35%\n- 备注：This optimization is highly effective for Transformer decoder layers where Matmul is followed by Norm and RoPE. It requires the underlying hardware and compiler stack (e.g., CANN with Triton) to support the `dl` dialect and heterogeneous task scheduling.\n\n\n", "runbooks/compute-pipeline/exp_matmul_qn_001.md": "\n\n## Scheduling Optimization: hardware specific instruction\n\n【优化维度】：多核并行与负载均衡\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3, 91093, 91095；失效边界：依赖 dl 接口与 grouped_launch_diagonal 辅助函数，运行时缺失则不可用；NUM_HEADS 核内迭代在头数极大时片上压力上升；静态跨步调度要求各块负载大致均匀）\n\n### 原则\n- **hardware specific instruction**：Utilizes `dl.compile_hint` with the argument \"dot_pad_only_k\". This is a critical optimization for Ascend NPUs (910 series), instructing the compiler to pad only the K dimension of the matrix tiles. This minimizes the amount of zero-padding required for the dot product engine, thereby reducing memory traffic and increasing the effective throughput of the Cube unit.\n- **batched head iteration**：The kernel iterates over `NUM_HEADS` inside the program body rather than flattening the head dimension into the global grid or launching separate kernels. This reduces kernel launch overhead and allows for efficient handling of the 3D tensor structure (Batch, Heads, Hidden) required by attention mechanisms.\n- **static scheduling strategy**：Implements a static work distribution using the loop `for block_idx in range(pid, NUM_BLOCKS, NUM_CORES)`. This pattern statically assigns blocks to processing cores based on the program ID, avoiding the overhead of dynamic scheduling mechanisms and ensuring predictable memory access patterns across the NPU cores.\n- **grouped launch diagonal**：Employs a `grouped_launch_diagonal` helper to map block indices to task coordinates. This suggests a diagonal or specific tiling traversal order which can improve cache locality for the matrix operands compared to a standard row-major or column-major traversal.\n- **persistent kernel pattern**：Implements a grid-stride loop using `range(pid, NUM_BLOCKS, NUM_CORES)`, allowing a single program instance to process multiple output blocks sequentially. This reduces kernel launch overhead and improves hardware utilization by keeping cores active longer.\n- **intra kernel batch iteration**：Manually iterates over the `NUM_HEADS` dimension inside the kernel body (`for head_idx in range(NUM_HEADS)`). This fuses the batch processing logic, avoiding the overhead of launching separate kernels for each attention head.\n- **hardware specific padding hint**：Utilizes `dl.compile_hint(..., \"dot_pad_only_k\")` to provide explicit instructions to the compiler backend regarding padding strategy for the dot product operation. This ensures the data layout aligns with the requirements of the hardware's matrix compute unit (e.g., Cube unit), preventing performance penalties from implicit padding.\n- **diagonal block mapping**：Uses `grouped_launch_diagonal` to map block indices to the M and N grid dimensions. This scheduling strategy often improves cache locality or load balancing compared to a simple row-major traversal.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/049-matmul_qn_kernel.py\n```\n\n**坏实践（反例）**：每个 head 单独 launch 一个 kernel → NUM_HEADS 次 launch 开销，小 head_dim 时调度主导时延 → ✅ 正解即本条：头维核内迭代 + persistent 跨步 + 对角块映射 + `dot_pad_only_k`。\n\n**已知实例**：matmul §raw (`experiences/matmul/exp_matmul_qn_001.yaml`)\n- 声称性能收益：25%\n- 备注：This kernel is specifically designed for a projection step in attention-like mechanisms on Ascend hardware, leveraging the DeepLink (dl) interface for hardware-specific optimizations.\n\n\n"}};
const KC={api:'#1f77b4',example:'#2e9e6b',header:'#7e57c2',guide:'#ff7f0e',index:'#cbd5e1',root:'#334155',other:'#94a3b8',operator:'#e6194b',glossary:'#0f766e',operator_optimization:'#3cb371',implementation_trap:'#f032e6',debugging_journey:'#c026d3',cross_skill_gap:'#a21caf',field_note:'#f032e6',runbook:'#3cb371'};
const EC={exemplifies:'#2e9e6b',explains:'#ff7f0e',declares:'#7e57c2',demonstrates:'#0891b2',same_topic:'#1f77b4',related:'#94a3b8',part_of:'#e2e8f0',mentions:'#f1d6c0'};
const ETZH={exemplifies:'实现示例',explains:'开发指南',declares:'声明',demonstrates:'配套',same_topic:'同主题',related:'相关',part_of:'层级',mentions:'提及'};
const nodeById={};G.nodes.forEach(n=>nodeById[n.id]=n);
const back={};G.edges.forEach(e=>{(back[e.target]=back[e.target]||[]).push(e);});
document.getElementById('meta').textContent=`· ${G.meta.card_count} concept / ${G.nodes.length} 节点 / ${G.edges.length} 边`;
const sz=n=>10+Math.min(28,(n.degree||0)*2);
const els=[];
for(const n of G.nodes)els.push({data:{id:n.id,label:n.title,kind:n.kind,bundle:n.bundle,ext:!!n.external,sz:sz(n)}});
for(const e of G.edges)els.push({data:{id:e.source+'|'+e.target,source:e.source,target:e.target,type:e.type,e:e}});
const cy=cytoscape({container:document.getElementById('cy'),elements:els,wheelSensitivity:0.2,
 style:[
  {selector:'node',style:{'background-color':n=>KC[n.data('kind')]||'#94a3b8','width':'data(sz)','height':'data(sz)','label':'data(label)','font-size':6,'color':'#334155','text-opacity':0,'text-valign':'bottom','text-margin-y':2,'text-wrap':'ellipsis','text-max-width':90,'border-width':n=>n.data('ext')?2:0,'border-color':'#94a3b8','border-style':'dashed'}},
  {selector:'node[?ext]',style:{'background-opacity':0.45}},
  {selector:'node:selected',style:{'border-width':3,'border-color':'#f59e0b','border-style':'solid','text-opacity':1,'font-size':9}},
  {selector:'.nbr',style:{'text-opacity':1,'font-size':8}},
  {selector:'edge',style:{'width':e=>e.data('e').cross?2:1,'line-color':e=>EC[e.data('type')]||'#ccc','line-style':e=>e.data('e').cross?'dashed':'solid','curve-style':'haystack','opacity':0.55,'target-arrow-shape':e=>e.data('e').symmetric?'none':'triangle','target-arrow-color':e=>EC[e.data('type')]||'#ccc','arrow-scale':0.6}},
  {selector:'edge:selected',style:{'opacity':1,'width':3}},
  {selector:'.dim',style:{'opacity':0.06,'text-opacity':0}}
 ],
 layout:{name:'cose',animate:false,nodeRepulsion:9000,idealEdgeLength:55,padding:30}});

function resolveLink(fromId,href){let base=fromId.split('/').slice(0,-1);for(const p of href.split('/')){if(p==='..')base.pop();else if(p!=='.')base.push(p);}let id=base.join('/');return nodeById[id]?id:null;}
function showDetail(id){const n=nodeById[id];if(!n)return;cy.$(':selected').unselect();const node=cy.getElementById(id);node.select();cy.elements().removeClass('nbr');node.connectedNodes().addClass('nbr');cy.animate({center:{eles:node},duration:200});
 let h=`<span class="chip" style="background:${KC[n.kind]}">${n.kind}</span> ${n.external?'<span class="chip" style="background:#94a3b8">外部</span>':''}<h2>${esc(n.title)}</h2><div class="id">${n.id}</div>`;
 if(n.description)h+=`<p>${esc(n.description)}</p>`;
 if(n.resource)h+=`<p><a class="ext" href="${n.resource}" target="_blank" rel="noopener">上游 resource ↗</a></p>`;
 if(n.tags&&n.tags.length)h+=`<div>${n.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`;
 const inc=cy.getElementById(id).connectedEdges().map(x=>x.data('e'));
 const groups={};inc.forEach(e=>{if(e.type==='part_of')return;const me=id;const other=e.source===me?e.target:e.source;const lab=persp(e,me);(groups[lab]=groups[lab]||[]).push([other,e]);});
 const order=['实现示例','对应接口','开发指南','讲解接口','声明头文件','声明的接口','配套样例','对应指南','同主题','相关','提及'];
 Object.keys(groups).sort((a,b)=>order.indexOf(a)-order.indexOf(b)).forEach(lab=>{h+=`<div class="grp">${lab} (${groups[lab].length})</div>`;groups[lab].forEach(([o,e])=>{const t=nodeById[o];h+=`<a class="nb" onclick="showDetail('${o}')">${esc(t?t.title:o)} <span class="w">· ${ETZH[e.type]||e.type} ${e.weight.toFixed(1)}</span></a>`;});});
 const bl=(back[id]||[]).filter(e=>e.type!=='part_of'&&!e.symmetric);
 if(bl.length){h+=`<div class="grp">被引用 / 指向本卡 (${bl.length})</div>`;bl.forEach(e=>{const t=nodeById[e.source];h+=`<a class="nb" onclick="showDetail('${e.source}')">${esc(t?t.title:e.source)} <span class="w">· ${ETZH[e.type]||e.type}</span></a>`;});}
 const body=(G.bodies||{})[id];if(body){h+=`<div id="body">${marked.parse(body,{gfm:true,breaks:false})}</div>`;}
 const d=document.getElementById('detail');d.innerHTML=h;d.scrollTop=0;
 d.querySelectorAll('#body a[href]').forEach(a=>{const href=a.getAttribute('href');if(href&&href.endsWith('.md')&&!href.includes('://')){const tid=resolveLink(id,href);if(tid){a.className='int';a.removeAttribute('href');a.onclick=()=>showDetail(tid);return;}}a.className='ext';a.target='_blank';a.rel='noopener';});}
function kg(k){if(['implementation_trap','debugging_journey','cross_skill_gap','field_note'].includes(k))return'field_note';if(['operator_optimization','runbook'].includes(k))return'runbook';return k;}
function persp(e,me){const k=kg(nodeById[me].kind);if(e.type==='exemplifies'){if(k==='api'||k==='guide')return'实现示例';if(k==='operator'||k==='field_note')return'实践案例';return'对应接口';}if(e.type==='explains'){if(k==='api')return'开发指南';if(k==='operator'||k==='field_note'||k==='runbook')return'开发指南';return'讲解接口';}if(e.type==='declares')return k==='api'?'声明头文件':'声明的接口';if(e.type==='demonstrates')return k==='guide'?'配套样例':'对应指南';if(e.type==='same_topic')return'同主题';if(e.type==='related')return'相关';if(e.type==='mentions')return'提及';return'相关';}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
cy.on('tap','node',ev=>showDetail(ev.target.id()));
cy.on('tap','edge',ev=>{const e=ev.target.data('e');document.getElementById('detail').innerHTML=`<div class="grp">边</div><p><b>${ETZH[e.type]||e.type}</b> ${e.symmetric?'(对称)':''}<br><span class="id">${e.source}<br>${e.symmetric?'—':'→'} ${e.target}</span></p><p>via: ${e.via.join(', ')}<br>why: ${esc(e.why)}<br>weight: ${e.weight}</p>`;});
cy.on('tap',ev=>{if(ev.target===cy){cy.elements().removeClass('nbr');cy.$(':selected').unselect();}});
document.getElementById('layout').onchange=e=>cy.layout({name:e.target.value,animate:false,padding:30}).run();
document.getElementById('reset').onclick=()=>{cy.fit(null,30);document.getElementById('q').value='';cy.elements().removeClass('dim');};
document.getElementById('q').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(!q){cy.elements().removeClass('dim');return;}cy.nodes().forEach(n=>{const d=n.data();const hay=(d.label+' '+d.id+' '+d.bundle).toLowerCase();n.toggleClass('dim',!hay.includes(q));});cy.edges().forEach(e=>e.toggleClass('dim',e.source().hasClass('dim')||e.target().hasClass('dim')));};
function mkfilter(host,title,keys,active,attr){let h=`<b>${title}</b>`;keys.forEach(k=>h+=`<label><input type=checkbox ${active(k)?'checked':''} data-f="${attr}" data-v="${k}">${k}</label>`);document.getElementById(host).innerHTML=h;}
mkfilter('bundleF','bundle:',G.meta.bundles,()=>true,'bundle');
mkfilter('kindF','kind:',['api','example','header','guide','glossary','index','other','operator','operator_optimization','implementation_trap','debugging_journey','cross_skill_gap'],()=>true,'kind');
mkfilter('typeF','边:',Object.keys(EC),k=>k!=='mentions'&&k!=='part_of','type');
document.getElementById('legend').innerHTML=Object.keys(EC).map(t=>`<span><b style="background:${EC[t]}"></b>${ETZH[t]}</span>`).join('');
function applyFilters(){const on=a=>new Set([...document.querySelectorAll(`input[data-f="${a}"]:checked`)].map(x=>x.dataset.v));
 const kb=on('bundle'),kk=on('kind'),kt=on('type');
 cy.nodes().forEach(n=>{const d=n.data();n.style('display',(kb.has(d.bundle)||!d.bundle)&&kk.has(d.kind)?'element':'none');});
 cy.edges().forEach(e=>{const vis=kt.has(e.data('type'))&&e.source().style('display')==='element'&&e.target().style('display')==='element';e.style('display',vis?'element':'none');});}
document.querySelectorAll('.filters input').forEach(cb=>cb.onchange=applyFilters);applyFilters();
const first=G.nodes.find(n=>n.kind==='api'&&!n.external)||G.nodes.find(n=>!n.external)||G.nodes[0];if(first)showDetail(first.id);
</script></body></html>

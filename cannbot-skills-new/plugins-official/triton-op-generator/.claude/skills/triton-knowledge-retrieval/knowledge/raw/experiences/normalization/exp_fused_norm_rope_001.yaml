optimization_points:
- operator_fusion: Fuses the RMSNorm and Rotary Positional Embedding (RoPE) operations
    into a single kernel. This eliminates the need to write intermediate normalized
    results to global memory (HBM) and read them back for RoPE, significantly reducing
    memory bandwidth consumption and latency.
- partial_rope_optimization: Explicitly handles partial RoPE by separating the head
    dimension into ROPE (rotated) and NOPE (non-rotated) sub-spaces. The kernel only
    applies the computationally expensive rotation logic (cos/sin multiplication)
    to the ROPE dimensions, while the NOPE dimensions are simply normalized and scaled,
    optimizing arithmetic intensity for modern architectures like Llama-3.
- precision_management: Utilizes single-precision floating-point (fp32) for the variance
    calculation (sum of squares and reciprocal square root) to maintain numerical
    stability during the reduction, while performing the rest of the vector operations
    in the input precision (e.g., fp16/bf16) to maximize throughput.
- grid_stride_scheduling: Implements a grid-stride loop over the sequence length dimension.
    This allows the kernel to efficiently process sequence lengths of arbitrary size
    without requiring a 1:1 mapping between grid blocks and sequence tokens, ensuring
    high utilization of the compute units (NUM_CORES).
performance_boost: 25%
note: This kernel is specifically designed for models utilizing partial rotary position
  embeddings (e.g., Llama-3). It assumes the input layout is [seq_len, num_heads,
  head_dim].

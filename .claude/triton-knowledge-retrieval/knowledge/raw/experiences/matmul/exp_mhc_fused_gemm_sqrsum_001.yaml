optimization_points:
- kernel_fusion: Fuses the square-sum reduction and the matrix multiplication into
    a single kernel pass. This significantly reduces global memory access bandwidth
    by reading the input tensor x only once per block instead of twice.
- block_tiling: Employs a tiling strategy with token_block=32 and hidden_block=256.
    The 32-token block aligns with the warp size for efficient reduction, while the
    256 hidden block optimizes memory coalescing and loading efficiency.
- precision_optimization: Loads input data in bfloat16 (bf16) to save memory bandwidth
    but performs accumulation in float32 (fp32). This balances speed with the numerical
    precision required for sum-of-squares calculations.
- hardware_acceleration: Utilizes tl.dot with allow_tf32=True to leverage hardware-accelerated
    matrix units (Tensor Cores/Cube) for the matrix multiplication component, maximizing
    compute throughput.
performance_boost: 30%
note: This kernel is specifically optimized for scenarios where hc_mult3 is small
  (<=32). It combines a reduction and a GEMM, making it highly efficient for pre-GEMM
  feature processing.

optimization_points:
- high_precision_accumulation: The kernel enforces float32 accumulation and disables
    TF32 (allow_tf32=False) during the dot product operations. This is crucial for
    state recomputation in attention mechanisms to prevent numerical drift, ensuring
    stability at the cost of raw compute speed.
- fused_gating_gemm: Element-wise scaling operations (multiplying by beta and g) are
    fused directly into the GEMM pipeline. By computing b_vb and b_kb in registers/SRAM
    immediately before the tl.dot call, the kernel avoids storing intermediate scaled
    tensors to global memory, significantly reducing memory bandwidth usage.
- intra_block_head_iteration: The kernel loops over the head dimension (H) inside
    the kernel body rather than launching a separate grid for each head. This reduces
    kernel launch overhead and can improve cache locality for the attention matrix
    A if it is shared or accessed sequentially across heads.
- varlen_efficiency: Implements a specialized path for variable-length sequences using
    cu_seqlens. This allows the kernel to skip processing padding tokens entirely,
    maximizing hardware utilization for packed batches common in LLM training/inference.
performance_boost: 25%
note: The use of float32 accumulation ensures numerical stability for re-computation
  but may limit peak throughput compared to pure fp16/bf16 pipelines. Best suited
  for scenarios where accuracy of the recurrent state is paramount.

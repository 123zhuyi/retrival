optimization_points:
- block_local_sorting: Restricts the sorting and shuffling scope to the local `BLOCK_SIZE`
    (e.g., 256 elements). This avoids the expensive global synchronization and memory
    traffic associated with sorting the entire tensor, reducing complexity from O(N
    log N) to O(N log B) where B is the block size.
- parallel_prng_state: Utilizes `tl.philox` with a counter offset calculated as `c0
    = c0 + i4`. This ensures that each element within the block has a unique, independent
    random seed state, allowing the random number generation to proceed in parallel
    across all threads without serialization or race conditions.
- in_place_memory_strategy: Performs the load, shuffle, and store operations on the
    same buffer pointer (`value_in`). This in-place approach halves the memory bandwidth
    requirement and peak memory usage compared to an out-of-place shuffle that requires
    a separate output buffer.
performance_boost: 35%
note: This kernel performs a local shuffle within blocks. It is not a global shuffle
  of the entire dataset. Ensure `BLOCK_SIZE` is tuned to fit within the SRAM/Registers
  of the target hardware for optimal argsort performance.

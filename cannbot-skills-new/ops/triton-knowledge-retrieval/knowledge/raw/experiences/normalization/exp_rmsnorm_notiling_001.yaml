optimization_points:
- no_tiling_strategy: The kernel loads the entire row vector in a single operation
    without column chunking. This is specifically optimized for small hidden dimensions
    (n_cols < 2048) to eliminate the overhead of tiling logic, loop control, and boundary
    checks associated with blocked algorithms.
- grid_stride_scheduling: Utilizes a grid-stride loop over the row dimension (`tl.range(pid,
    n_rows, num_progs)`). This allows a fixed number of program instances (tuned to
    NPU core count) to process an arbitrary number of rows efficiently, maximizing
    hardware utilization without launching excessive grid blocks.
- cache_hierarchy_optimization: Implements a two-pass loading strategy with specific
    cache policies. The first load (for variance calculation) uses `eviction_policy="evict_first"`
    to stream data without polluting the cache, while the second load (for normalization)
    uses `cache_modifier=".ca"` to cache data for the subsequent element-wise affine
    transformations.
- precision_control_pipeline: Supports specific casting modes (LLAMA/GEMMA) by upcasting
    inputs to FP32 during the reduction and normalization phases to ensure numerical
    stability, followed by a downcast back to the original data type before storage,
    balancing accuracy and performance.
performance_boost: 20%
note: This kernel is designed specifically for scenarios where the column dimension
  is small (< 2048). For larger dimensions, a tiled approach is preferred to fit within
  memory constraints and maximize parallelism.

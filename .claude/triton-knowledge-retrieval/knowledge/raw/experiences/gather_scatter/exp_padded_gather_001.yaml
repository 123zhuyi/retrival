optimization_points:
- buffered_writes: The kernel accumulates gathered rows in a local buffer (tmp_buf)
    and performs a batched store to global memory only when the expert ID (bin_id)
    changes. This reduces the number of global memory write transactions, which is
    critical for high-bandwidth utilization.
- column_tiling: The embedding dimension (NUM_COLUMNS) is processed in tiles of size
    BLOCK_X. This tiling strategy limits the number of active registers per thread,
    preventing register spilling and allowing the kernel to handle very wide embeddings
    efficiently.
- dynamic_boundary_handling: The kernel dynamically calculates the output offset (idx_o)
    based on bin_ids and padded_bins metadata. This allows it to handle variable-length
    expert assignments (MoE routing) without requiring the input to be strictly sorted
    or pre-padded to a fixed size.
performance_boost: 30%
note: The current implementation uses a scalar loop to handle expert ID changes. For
  extreme optimization, pre-sorting indices by expert ID is recommended to enable
  fully vectorized loads and stores.

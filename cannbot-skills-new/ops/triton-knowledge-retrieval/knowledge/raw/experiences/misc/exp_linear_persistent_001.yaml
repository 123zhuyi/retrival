optimization_points:
- persistent_kernel_grid_stride_loop: The kernel utilizes a fixed-size 1D grid (`GRID_SIZE`)
    where each program iterates over multiple output blocks via `for block_index in
    range(pid, total_blocks, GRID_SIZE)`. This strategy significantly reduces kernel
    launch overhead and maintains high hardware occupancy by keeping compute units
    active throughout the processing of multiple tiles, rather than launching a new
    program instance for every single tile.
- explicit_software_transpose: Matrix B is loaded with shape [BLOCK_N, BLOCK_K] and
    explicitly transposed to [BLOCK_K, BLOCK_N] using `tl.trans` before the `tl.dot`
    operation. This allows the kernel to handle B's memory layout flexibly (potentially
    optimizing for cache locality during the load phase) while satisfying the input
    requirements of the matrix multiplication unit.
- boundary_safe_tiling: Implements robust boundary handling using dynamic masks (`m_mask`,
    `n_mask`, `k_mask`) derived from `tl.arange`. This ensures correct computation
    and memory access for matrices where dimensions (M, N, K) are not integer multiples
    of the block sizes (BLOCK_M, BLOCK_N, BLOCK_K), preventing out-of-bounds errors
    without requiring input padding.

optimization_points:
- fused_rope_computation: Fuses the Rotary Positional Embedding (RoPE) operation directly
    into the matrix multiplication kernel. This eliminates the need to write intermediate
    rotated tensors to global memory (HBM), significantly reducing memory bandwidth
    consumption and latency.
- dual_path_accumulation: Separates the sine and cosine component calculations into
    two distinct calls to `_single_rope_matmul_kernel`. This structure allows for
    cleaner code generation and potentially better register pressure management by
    handling the two parts of the rotation formula (x*cos - y*sin) independently before
    accumulation.
- dynamic_block_tiling: Utilizes configurable `BLOCK_M`, `BLOCK_N`, and `BLOCK_K`
    sizes along with a `BLOCK_TRESHHOLD`. This enables the kernel to adapt its tiling
    strategy based on the specific dimensions of the input matrices (M, N, K) to optimize
    for the L0/L1 cache hierarchy of the NPU hardware.
performance_boost: 25%
note: This kernel is specifically designed for Transformer inference where RoPE is
  applied before the QK projection or similar linear layers. It assumes the availability
  of precomputed sine/cosine coefficients.

  TritonPath: fused_matmul_and_rms_norm_and_rotary_pos_emb_kernel
performance_boost: 25%
note: This optimization is highly effective for Transformer inference/decoding stages
  where MatMul is followed by normalization and RoPE. It requires hardware support
  for asynchronous task scheduling between Cube and Vector units (e.g., Ascend 910B).

experience_type: 语法适配
framework_tag:
- Triton
optimization_points:
- 核心避坑: Ascend后端禁止使用`tl.where`动态计算内存偏移，该场景下硬件支持不完全，易触发执行错误
- 替代方案: 复杂条件的内存偏移计算，改用if-else静态分支处理，提前确定偏移值
- 适配逻辑: 静态分支可被Triton编译器优化为硬件友好的指令，避免动态偏移的兼容性问题
code_snippet:
  Triton: "# ========== Ascend后端内存偏移计算避坑 ==========\n@triton.jit\ndef offset_calc_kernel(input_ptr,\
    \ output_ptr, n_elements, BLOCK_SIZE: tl.constexpr):\n    pid = tl.program_id(0)\n\
    \    base_offset = pid * BLOCK_SIZE\n    \n    # 错误: tl.where动态计算内存偏移（Ascend不兼容）\n\
    \    # offsets = tl.where(base_offset < n_elements, base_offset + tl.arange(0,\
    \ BLOCK_SIZE), 0)\n    \n    # 正确: if-else静态分支处理\n    offsets = base_offset +\
    \ tl.arange(0, BLOCK_SIZE)\n    if base_offset < n_elements:\n        mask = offsets\
    \ < n_elements\n        data = tl.load(input_ptr + offsets, mask=mask)\n     \
    \   tl.store(output_ptr + offsets, data * 2, mask=mask)\n    # 超出范围的分支无需处理（天然跳过）"
performance_boost: 0%
note: Ascend后端对`tl.where`生成的动态指针运算存在底层指令支持缺陷，易导致kernel执行崩溃；静态if-else分支是唯一安全的替代方案
version: v1.0

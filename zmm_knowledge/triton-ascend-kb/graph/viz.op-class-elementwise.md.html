ernel（source: `raw_experiences/extracted_kernels/074-matmul_kernel.py`）\n- `077-_mhc_pre_gemm_sqrsum_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/077-_mhc_pre_gemm_sqrsum_kernel.py`）\n- `078-partial_matmul_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/078-partial_matmul_kernel.py`）\n- `080-fused_sigmoid_single_norm_rope_matmul_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/080-fused_sigmoid_single_norm_rope_matmul_kernel.py`）\n- `081-fused_single_norm_rope_matmul_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/081-fused_single_norm_rope_matmul_kernel.py`）\n- `082-partial_matmul_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/082-partial_matmul_kernel.py`）\n- `084-fused_matmul_norm_sigmoid_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/084-fused_matmul_norm_sigmoid_kernel.py`）\n- `085-fused_matmul_norm_rotary_emb_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/085-fused_matmul_norm_rotary_emb_kernel.py`）\n- `089-_matmul_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/089-_matmul_kernel.py`）\n- `119-addmm_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/119-addmm_kernel.py`）\n- `125-bmm_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/125-bmm_kernel.py`）\n- `140-outer_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/140-outer_kernel.py`）\n- `141-mm_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/141-mm_kernel.py`）\n- `147-matmul_bias_persistent_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/147-matmul_bias_persistent_kernel.py`）\n- `148-linear_persistent_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/148-linear_persistent_kernel.py`）\n- `195-cube1.py` — extracted kernel（source: `raw_experiences/extracted_kernels/195-cube1.py`）\n- `198-cube1.py` — extracted kernel（source: `raw_experiences/extracted_kernels/198-cube1.py`）\n- `240-_m_grouped_matmul_bKmajor_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/240-_m_grouped_matmul_bKmajor_kernel.py`）\n- `241-_m_grouped_matmul_bNmajor_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/241-_m_grouped_matmul_bNmajor_kernel.py`）\n- `242-_k_grouped_matmul_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/242-_k_grouped_matmul_kernel.py`）\n\n\n", "op-class-normalization.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/ops/normalization.md\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/ops/normalization.md` 迁移而来，原始为算子类别设计页，未做内容改写，仅转 OKF frontmatter。\n\n# 归一化算子优化\n\n## 概述\n\n归一化算子对张量的某一维度（通常是隐藏维度）计算统计量（均值、方差、RMS），然后对输入进行标准化变换，并可选地应用仿射变换（weight × norm + bias）。典型算子包括 LayerNorm、RMSNorm、Softmax 以及它们的融合变体。\n\n在 Ascend 910b2/910b3 上，归一化算子优化的核心挑战在于：\n\n1. **数值精度**：fp16/bf16 累加易溢出，需要混合精度策略\n2. **内存容量**：UB（Unified Buffer）约 192KB，超大隐藏维度需要分块处理\n3. **访存效率**：两遍扫描（two-pass）可以通过在线算法压缩为一遍，减少 HBM 读取次数\n4. **融合机会**：skip-add、残差更新、量化等操作与归一化高度可融合\n\n## 检测标准\n\n满足以下任意模式时，将算子归类为 normalization：\n\n- `mean` / `var` / `rms` 后跟 `(x - mean) / std` 或 `x / rms` 的标准化变换\n- `weight * norm + bias` 仿射变换（与标准化紧密耦合）\n- `rsqrt(var + eps)` 出现在计算图中\n- 独立的 `softmax`（沿某维度的 exp + sum_reduce + div）\n- PyTorch 原语：`F.layer_norm`、`F.rms_norm`、`F.softmax`、`torch.nn.LayerNorm`\n\n## 适用条件\n\n| 条件 | 说明 |\n|------|------|\n| 数据类型 | 输入 fp16/bf16；累加必须 fp32；输出可 fp16/bf16/int8（量化） |\n| 隐藏维度 n_cols | n_cols ≤ UB 容量（~192KB / dtype_bytes）时可单 tile 处理；否则需列分块 |\n| 批量维度 n_rows | 通常每个 program 处理一行，grid=(n_rows,) |\n| weight/bias | 可缓存在寄存器中（当 n_cols 较小时），避免重复从 HBM 加载 |\n| 与残差结合 | skip-add + norm 可融合为单内核，消除中间张量 |\n\n## 经验路由\n\n| 场景 | 经验ID | 提升% | 关键技术 | 内核参考 |\n|------|--------|-------|----------|----------|\n| RMSNorm 基础优化 | exp_rmsnorm_001 | 25% | fp32 混合精度累加，weight 缓存寄存器 | kernel 045, 051 |\n| RMSNorm 大批量 | exp_rmsnorm_001 | 35% | Persistent kernel，grid=num_aicores，weight 仅加载一次 | kernel 086 |\n| Skip + LayerNorm 融合 | exp_skip_layernorm_001 | 30% | 跳跃连接 add 与 LayerNorm 融合，两遍在寄存器内完成 | kernel 118 |\n| 残差原位更新 + RMSNorm | exp_fused_rms_norm_001 | 35% | 计算方差时同步完成残差原位更新 | kernel 115 |\n| 超大隐藏维度 RMSNorm | exp_rmsnorm_npu_001 | 35% | UB 列分块（BLOCK_SIZE_N），两遍遍历 | kernel 093 |\n| RMSNorm + 量化 | exp_rmsnorm_fused_quant_001 | 50% | 归一化与量化在单内核融合 | kernel 189 |\n| LayerNorm 条件分支 | exp_layernorm_fwd_001 | 30% | constexpr HAS_BIAS/HAS_RESIDUAL 编译期分支消除 | kernel 150 |\n| NPU SIMD + LayerNorm + 门控 | exp_layernorm_npu_simd_001 | 35% | NPU SIMD 指令 + LayerNorm + gating 融合 | kernel 180 |\n| Gemma 风格 RMSNorm | exp_gemma_rmsnorm_001 | 35% | (1 + weight) × norm 融合计算 | kernel 190 |\n| Q/K 双路 RMSNorm | exp_fused_split_qk_norm_001 | 35% | Q 和 K 的 RMSNorm 在单内核内并行完成 | kernel 191 |\n| Softmax 单遍 | exp_online_softmax_001 | 35% | log-sum-exp trick 单遍 softmax | — |\n| 均值+方差单遍 | exp_online_mean_var_001 | 30% | Welford 在线算法，均值和方差一遍完成 | — |\n| RMS 单遍 | exp_online_rms_001 | 25% | 单遍 RMS 计算 | — |\n| LayerNorm Welford | exp_layernorm_single_pass_001 | 30% | Welford 用于 LayerNorm，单遍输入扫描 | kernel 181 |\n\n## 关键技术\n\n### 混合精度累加\n\nfp16/bf16 的动态范围不足以安全累加大量平方项（`sum(x²)`），必须在 fp32 中累加：\n\n```python\n@triton.jit\ndef rmsnorm_kernel(x_ptr, w_ptr, y_ptr, n_cols, eps,\n                   BLOCK_SIZE: tl.constexpr):\n    row = tl.program_id(0)\n    x_row_ptr = x_ptr + row * n_cols\n\n    # Pass 1: 以 fp32 累加 sum(x^2)\n    acc = tl.zeros([BLOCK_SIZE], dtype=tl.float32)\n    for col_start in range(0, n_cols, BLOCK_SIZE):\n        cols = col_start + tl.arange(0, BLOCK_SIZE)\n        mask = cols < n_cols\n        x = tl.load(x_row_ptr + cols, mask=mask, other=0.0)\n        x_fp32 = x.to(tl.float32)          # 提升到 fp32\n        acc += x_fp32 * x_fp32\n\n    var = tl.sum(acc) / n_cols\n    rrms = tl.rsqrt(var + eps)             # 硬件 rsqrt 指令\n\n    # Pass 2: 归一化 + 仿射变换\n    # （weight 可在寄存器中缓存，若 n_cols 足够小）\n    for col_start in range(0, n_cols, BLOCK_SIZE):\n        cols = col_start + tl.arange(0, BLOCK_SIZE)\n        mask = cols < n_cols\n        x = tl.load(x_row_ptr + cols, mask=mask, other=0.0).to(tl.float32)\n        w = tl.load(w_ptr + cols, mask=mask, other=1.0).to(tl.float32)\n        y = (x * rrms) * w\n        tl.store(y_ptr + row * n_cols + cols, y.to(tl.float16), mask=mask)\n```\n\n### rsqrt 替代 1/sqrt\n\nAscend 提供硬件 `rsqrt` 指令，比 `1 / sqrt(x)` 快显著：\n\n```python\n# 低效\ninv_std = 1.0 / tl.sqrt(var + eps)\n\n# 高效：使用硬件 rsqrt 指令\ninv_std = tl.rsqrt(var + eps)\n```\n\n### UB 列分块（Column Blocking）\n\n当 `n_cols × dtype_bytes > ~192KB` 时，单 tile 无法放入 UB，必须分块两遍扫描：\n\n```python\n@triton.jit\ndef rmsnorm_large_hidden_kernel(x_ptr, w_ptr, y_ptr, n_cols, eps,\n                                 BLOCK_SIZE_N: tl.constexpr):\n    row = tl.program_id(0)\n    x_row = x_ptr + row * n_cols\n\n    # Pass 1: 分块计算 sum(x^2)\n    var_acc = tl.zeros([1], dtype=tl.float32)\n    for col_start in range(0, n_cols, BLOCK_SIZE_N):\n        cols = col_start + tl.arange(0, BLOCK_SIZE_N)\n        mask = cols < n_cols\n        x = tl.load(x_row + cols, mask=mask, other=0.0).to(tl.float32)\n        var_acc += tl.sum(x * x)\n    var = var_acc / n_cols\n    rrms = tl.rsqrt(var + eps)\n\n    # Pass 2: 分块归一化\n    for col_start in range(0, n_cols, BLOCK_SIZE_N):\n        cols = col_start + tl.arange(0, BLOCK_SIZE_N)\n        mask = cols < n_cols\n        x = tl.load(x_row + cols, mask=mask, other=0.0).to(tl.float32)\n        w = tl.load(w_ptr + cols, mask=mask, other=1.0).to(tl.float32)\n        y = x * rrms * w\n        tl.store(y_ptr + row * n_cols + cols, y.to(tl.float16), mask=mask)\n```\n\n**BLOCK_SIZE_N 推荐值**（910b2，UB ~192KB）：\n\n| 数据类型 | 最大 BLOCK_SIZE_N |\n|----------|------------------|\n| fp16 / bf16 (2B) | ~49152 元素 |\n| fp32 (4B) | ~24576 元素 |\n\n### Online Softmax（单遍 log-sum-exp）\n\n传统 softmax 需要两遍（先求 max，再求 exp+sum），在线算法可在单遍完成：\n\n```python\n@triton.jit\ndef online_softmax_kernel(x_ptr, y_ptr, n_cols, BLOCK_SIZE: tl.constexpr):\n    row = tl.program_id(0)\n    x_row = x_ptr + row * n_cols\n\n    # 单遍：同时维护 running max 和 running sum\n    running_max = tl.full([1], float('-inf'), dtype=tl.float32)\n    running_sum = tl.zeros([1], dtype=tl.float32)\n\n    for col_start in range(0, n_cols, BLOCK_SIZE):\n        cols = col_start + tl.arange(0, BLOCK_SIZE)\n        mask = cols < n_cols\n        x = tl.load(x_row + cols, mask=mask, other=float('-inf')).to(tl.float32)\n        block_max = tl.max(x)\n        new_max = tl.maximum(running_max, block_max)\n        # 更新 running_sum 时补偿 max 变化\n        running_sum = running_sum * tl.exp(running_max - new_max) + \\\n                      tl.sum(tl.exp(x - new_max))\n        running_max = new_max\n\n    # 写回归一化结果\n    log_sum = tl.log(running_sum) + running_max   # log-sum-exp\n    for col_start in range(0, n_cols, BLOCK_SIZE):\n        cols = col_start + tl.arange(0, BLOCK_SIZE)\n        mask = cols < n_cols\n        x = tl.load(x_row + cols, mask=mask, other=float('-inf')).to(tl.float32)\n        y = tl.exp(x - log_sum)\n        tl.store(y_ptr + row * n_cols + cols, y.to(tl.float16), mask=mask)\n```\n\n### Welford 在线均值/方差\n\nWelford 算法单遍稳定计算均值和方差，避免数值不稳定：\n\n```python\n# Welford 在线更新（在 BLOCK_SIZE 维度上应用）\nmean = tl.zeros([1], dtype=tl.float32)\nm2 = tl.zeros([1], dtype=tl.float32)\ncount = tl.zeros([1], dtype=tl.float32)\n\nfor col_start in range(0, n_cols, BLOCK_SIZE):\n    cols = col_start + tl.arange(0, BLOCK_SIZE)\n    mask = cols < n_cols\n    x = tl.load(x_ptr + cols, mask=mask, other=0.0).to(tl.float32)\n    block_count = tl.sum(mask.to(tl.float32))\n    block_mean = tl.sum(x * mask) / block_count\n    # Welford 合并\n    delta = block_mean - mean\n    count += block_count\n    mean += delta * block_count / count\n    m2 += tl.sum((x - mean) * (x - block_mean) * mask)\n\nvar = m2 / count\n```\n\n### Persistent Kernel + Weight 缓存\n\n对 n_rows 很大的情况，持久化内核使 weight 仅加载一次：\n\n```python\n@triton.jit\ndef persistent_rmsnorm_kernel(x_ptr, w_ptr, y_ptr, n_rows, n_cols, eps,\n                               BLOCK_SIZE: tl.constexpr):\n    pid = tl.program_id(0)\n    num_progs = tl.num_programs(0)\n\n    # weight 在寄存器中缓存（每个 program 只加载一次）\n    cols = tl.arange(0, BLOCK_SIZE)\n    mask_w = cols < n_cols\n    w = tl.load(w_ptr + cols, mask=mask_w, other=1.0).to(tl.float32)\n\n    # grid-stride 循环处理所有行\n    for row in range(pid, n_rows, num_progs):\n        x_row = x_ptr + row * n_cols\n        # ... 计算 RMSNorm ...\n        var = tl.sum(x_fp32 * x_fp32) / n_cols\n        rrms = tl.rsqrt(var + eps)\n        y = x_fp32 * rrms * w\n        tl.store(y_ptr + row * n_cols + cols, y.to(tl.float16), mask=mask_w)\n\n# 启动：grid 固定为 AI Core 数量\ngrid = (NUM_AI_CORES,)\n```\n\n### constexpr 标志消除编译期分支\n\n使用 `tl.constexpr` 标志在编译期消除 HAS_BIAS、HAS_RESIDUAL 等条件分支，避免运行时 branch 开销：\n\n```python\n@triton.jit\ndef layernorm_kernel(x_ptr, residual_ptr, w_ptr, b_ptr, y_ptr,\n                     n_cols, eps,\n                     HAS_BIAS: tl.constexpr,\n                     HAS_RESIDUAL: tl.constexpr,\n                     BLOCK_SIZE: tl.constexpr):\n    row = tl.program_id(0)\n    cols = tl.arange(0, BLOCK_SIZE)\n    mask = cols < n_cols\n\n    x = tl.load(x_ptr + row * n_cols + cols, mask=mask).to(tl.float32)\n\n    if HAS_RESIDUAL:  # 编译期展开，无运行时开销\n        res = tl.load(residual_ptr + row * n_cols + cols, mask=mask).to(tl.float32)\n        x = x + res\n\n    mean = tl.sum(x) / n_cols\n    var = tl.sum((x - mean) * (x - mean)) / n_cols\n    x_norm = (x - mean) * tl.rsqrt(var + eps)\n\n    w = tl.load(w_ptr + cols, mask=mask).to(tl.float32)\n    y = x_norm * w\n\n    if HAS_BIAS:      # 编译期展开\n        b = tl.load(b_ptr + cols, mask=mask).to(tl.float32)\n        y = y + b\n\n    tl.store(y_ptr + row * n_cols + cols, y.to(tl.float16), mask=mask)\n```\n\n### RMSNorm + 量化融合\n\n归一化结果直接量化为 int8，消除中间 fp16 张量的写回（50% 提升）：\n\n```python\n@triton.jit\ndef rmsnorm_quant_fused_kernel(x_ptr, w_ptr, scale_ptr, y_int8_ptr,\n                                n_cols, eps, BLOCK_SIZE: tl.constexpr):\n    row = tl.program_id(0)\n    cols = tl.arange(0, BLOCK_SIZE)\n    mask = cols < n_cols\n\n    x = tl.load(x_ptr + row * n_cols + cols, mask=mask).to(tl.float32)\n    w = tl.load(w_ptr + cols, mask=mask).to(tl.float32)\n\n    var = tl.sum(x * x) / n_cols\n    rrms = tl.rsqrt(var + eps)\n    y_norm = x * rrms * w\n\n    # 直接量化为 int8，无中间 HBM 写回\n    scale = tl.load(scale_ptr)\n    y_int8 = tl.clamp(tl.round(y_norm / scale), -128, 127).to(tl.int8)\n    tl.store(y_int8_ptr + row * n_cols + cols, y_int8, mask=mask)\n```\n\n## 常见陷阱\n\n| 陷阱 | 说明 | 解决方案 |\n|------|------|----------|\n| fp16 累加溢出 | `sum(x²)` 在 fp16 下对大 n_cols 易溢出 | 始终在 fp32 下累加（exp_rmsnorm_001） |\n| UB 溢出 | n_cols > UB 容量时编译失败或性能骤降 | 使用列分块（exp_rmsnorm_npu_001），BLOCK_SIZE_N ≤ 49152（fp16） |\n| 两遍 HBM 读取 | 传统两遍算法读两次输入，带宽受限 | 使用 Welford / 在线算法单遍完成（exp_online_*） |\n| weight 重复加载 | 每行都从 HBM 加载 weight，造成大量冗余访问 | Persistent kernel 将 weight 缓存在寄存器（exp_rmsnorm_001 kernel 086） |\n| softmax 数值不稳定 | 未减 max 直接 exp 导致溢出 | 使用 log-sum-exp trick（exp_online_softmax_001） |\n| 独立的 skip-add 内核 | add + norm 分开执行，多一次 HBM 往返 | 融合 skip-add + LayerNorm（exp_skip_layernorm_001） |\n| 忽略 eps 的精度影响 | 极小 var 时 rsqrt 精度不足 | eps 使用 fp32 精度，不随输入 dtype 降精度 |\n\n## 代码模板\n\n### 标准 RMSNorm 模板\n\n```python\nimport torch\nimport triton\nimport triton.language as tl\n\n@triton.jit\ndef rmsnorm_kernel(\n    x_ptr, w_ptr, y_ptr,\n    n_rows, n_cols,\n    eps,\n    BLOCK_SIZE: tl.constexpr,\n):\n    row = tl.program_id(0)\n    x_row = x_ptr + row * n_cols\n    y_row = y_ptr + row * n_cols\n\n    cols = tl.arange(0, BLOCK_SIZE)\n    mask = cols < n_cols\n\n    # 加载并提升到 fp32\n    x = tl.load(x_row + cols, mask=mask, other=0.0).to(tl.float32)\n    w = tl.load(w_ptr + cols, mask=mask, other=1.0).to(tl.float32)\n\n    # 计算 RMS\n    var = tl.sum(x * x) / n_cols\n    rrms = tl.rsqrt(var + eps)\n\n    # 归一化 + 仿射\n    y = x * rrms * w\n\n    tl.store(y_row + cols, y.to(tl.float16), mask=mask)\n\n\ndef rmsnorm(x: torch.Tensor, weight: torch.Tensor, eps: float = 1e-6) -> torch.Tensor:\n    x = x.contiguous()\n    n_rows, n_cols = x.shape\n    y = torch.empty_like(x)\n    # BLOCK_SIZE 需满足 BLOCK_SIZE >= n_cols 且为 2 的幂\n    BLOCK_SIZE = triton.next_power_of_2(n_cols)\n    assert BLOCK_SIZE <= 65536, f\"n_cols={n_cols} 超出单 tile UB 容量，需列分块\"\n    rmsnorm_kernel[(n_rows,)](x, weight, y, n_rows, n_cols, eps, BLOCK_SIZE=BLOCK_SIZE)\n    return y\n```\n\n### Skip + LayerNorm 融合模板\n\n```python\n@triton.jit\ndef skip_layernorm_kernel(\n    x_ptr, residual_ptr, w_ptr, b_ptr,\n    y_ptr, residual_out_ptr,\n    n_cols, eps,\n    BLOCK_SIZE: tl.constexpr,\n    HAS_BIAS: tl.constexpr,\n):\n    row = tl.program_id(0)\n    cols = tl.arange(0, BLOCK_SIZE)\n    mask = cols < n_cols\n\n    x = tl.load(x_ptr + row * n_cols + cols, mask=mask).to(tl.float32)\n    res = tl.load(residual_ptr + row * n_cols + cols, mask=mask).to(tl.float32)\n\n    # skip add（在寄存器内完成）\n    x = x + res\n\n    # 可选：写回残差（供下一层使用）\n    tl.store(residual_out_ptr + row * n_cols + cols, x.to(tl.float16), mask=mask)\n\n    # LayerNorm\n    mean = tl.sum(x) / n_cols\n    var = tl.sum((x - mean) * (x - mean)) / n_cols\n    x_norm = (x - mean) * tl.rsqrt(var + eps)\n\n    w = tl.load(w_ptr + cols, mask=mask).to(tl.float32)\n    y = x_norm * w\n    if HAS_BIAS:\n        b = tl.load(b_ptr + cols, mask=mask).to(tl.float32)\n        y = y + b\n\n    tl.store(y_ptr + row * n_cols + cols, y.to(tl.float16), mask=mask)\n```\n\n## 相关页面\n\n- [elementwise.md](op-class-elementwise.md) — 归一化中的仿射变换（weight × norm + bias）本质是 elementwise 操作\n- [reduction.md](op-class-reduction.md) — 归一化内部的 sum、max 等归约原语\n- [gather_scatter.md](op-class-gather_scatter.md) — MoE 场景中，Expert 归一化（Q/K RMSNorm）与 gather/scatter 结合\n\n## 反向传播经验\n\n| 场景 | 经验ID | 关键技术 | 经验文件 |\n|------|--------|----------|----------|\n| RMSNorm 反向 | exp_rmsnorm_backward_001 | 基础 RMSNorm dX/dW 计算 | yaml |\n| RMSNorm 反向（NPU） | exp_rmsnorm_backward_npu_001 | Ascend 910b 专用反向路径 | yaml |\n| RMSNorm 反向（分块） | exp_rmsnorm_backward_tiled_001 | 大列维度分块反向 | yaml |\n| RMSNorm 反向（大列） | exp_rmsnorm_bwd_large_cols_001 | 超 UB 列维度的反向 | yaml |\n| RMSNorm bwd 基础 | exp_rmsnorm_bwd_001 | RMSNorm bwd 标准实现 | yaml |\n| RMSNorm bwd 融合 | exp_rmsnorm_bwd_fused_001 | RMSNorm bwd 与其他算子融合 | yaml |\n| LayerNorm 反向 | exp_layernorm_bwd_001 | LayerNorm dX/dW/dB | yaml |\n| LayerNorm 反向融合 | exp_layernorm_bwd_fused_001 | LayerNorm bwd + residual 融合 | yaml |\n| GroupNorm 反向 | exp_gn_backward_001 | GroupNorm dX/dW/dB | yaml |\n\n## 推理与变体经验\n\n| 场景 | 经验ID | 关键技术 | 经验文件 |\n|------|--------|----------|----------|\n| RMSNorm 推理优化 | exp_rmsnorm_infer_001 | 推理专用路径，跳过训练相关计算 | yaml |\n| RMSNorm 无 Tiling | exp_rmsnorm_notiling_001 | 小列维度直接计算，无需分块 | yaml |\n| RMSNorm KV 归一化 | exp_rmsnorm_kv_001 | KV cache 归一化专项优化 | yaml |\n| RMSNorm + Add | exp_rmsnorm_add_001 | RMSNorm 与 residual add 融合 | yaml |\n| RMSNorm + RoPE | exp_rmsnorm_rope_001 | RMSNorm 与 RoPE 顺序融合 | yaml |\n\n## 已知实例（P3 挂载）\n\n### Extracted Kernel 反链\n- `041-fused_matmul_ckvkr_and_rms_norm_cq_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/041-fused_matmul_ckvkr_and_rms_norm_cq_kernel.py`）\n- `045-rms_norm_ckv_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/045-rms_norm_ckv_kernel.py`）\n- `046-fused_matmul_and_rms_norm_and_rotary_pos_emb_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/046-fused_matmul_and_rms_norm_and_rotary_pos_emb_kernel.py`）\n- `048-fused_matmul_ckvkr_and_rms_norm_cq_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/048-fused_matmul_ckvkr_and_rms_norm_cq_kernel.py`）\n- `051-rms_norm_ckv_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/051-rms_norm_ckv_kernel.py`）\n- `052-fused_matmul_qb_and_rmsnorm_kv_kernel.py` — extracted kernel（source: `raw_experiences/extra . **并行度**：大 K 维度归约（K ≥ 4096）需要跨核并行（split-K）充分利用全部 AI Core\n3. **多遍开销**：在线算法可将两遍/多遍归约压缩为单遍，减少 HBM 带宽消耗\n4. **联合归约**：argmax+max 等联合操作可在单遍中同时完成，避免重复扫描\n\n## 检测标准\n\n满足以下任意模式时，将算子归类为 reduction：\n\n- Triton 原语：`tl.sum`、`tl.max`、`tl.min`、`tl.reduce`\n- PyTorch 原语（含 `dim=` 参数）：`torch.sum(dim=)`、`torch.mean(dim=)`、`torch.max(dim=)`、`torch.logsumexp(dim=)`\n- 输出张量维度少于输入张量（沿某维度折叠）\n- split-K 并行归约模式（多核写入部分和，再全局合并）\n- 间接归约：cross-entropy（含 log-softmax）、histogram（含原子 binning）、cumsum（前缀扫描）\n\n## 适用条件\n\n| 条件 | 说明 |\n|------|------|\n| 数据类型 | 输入 fp16/bf16；累加必须 fp32 以避免溢出 |\n| 归约维度大小 K | K ≥ 4096 时 split-K 收益显著；K < 256 时单核即可 |\n| 并行维度大小 M | M 足够大时每行分配一个 program；M 小时用 persistent kernel |\n| logsumexp 场景 | 必须使用 log-sum-exp trick（先减 max 再 exp），防止 exp 溢出 |\n| split-K 场景 | 需要额外的全局 reduction buffer（fp32 累加），或使用两阶段方案 |\n\n## 经验路由\n\n| 场景 | 经验ID | 提升% | 关键技术 | 来源文件 |\n|------|--------|-------|----------|----------|\n| fp16/bf16 输入累加溢出 | exp_reduction_fp32_001 | 30% | fp32 累加（提升精度同时提升性能） | numerical_stability.md |\n| logsumexp 数值不稳定 | exp_reduction_logsumexp_001 | 35% | log-sum-exp trick：先减全局 max | numerical_stability.md |\n| exp 溢出保护 | exp_reduction_exp_protection_001 | 25% | exp 前减去局部 max，防止数值溢出 | numerical_stability.md |\n| cross-entropy 计算 | exp_reduction_cross_entropy_001 | 30% | 融合 log-softmax + cross-entropy | numerical_stability.md |\n| argmax 与 max 联合 | exp_reduction_argmax_001 | 25% | 单遍同时计算 max 值和 argmax 索引 | numerical_stability.md |\n| 大 K 并行（K≥4096） | exp_splitk_reduction_001 | 35% | split-K：K 维按核划分 + atomic_add 归约 | parallel_reduction.md |\n| 大 K 两阶段方案 | exp_splitk_two_pass_001 | 40% | Phase1 部分和，Phase2 全局规约 | parallel_reduction.md |\n| 超大张量多遍规约 | exp_multipass_reduction_001 | 30% | 多遍递进规约（层次化） | parallel_reduction.md |\n| 直方图原子 binning | exp_histogram_reduction_001 | 25% | 原子操作 binning，寄存器局部聚合后写回 | parallel_reduction.md |\n| 累加和（前缀扫描） | exp_cumsum_001 | 25% | scan primitive 实现 cumsum | parallel_reduction.md |\n\n## 关键技术\n\n### FP32 累加（避免溢出）\n\nfp16 最大值约 65504，在大 K 场景下累加极易溢出；bf16 精度更低（7 位尾数）。始终在 fp32 中累加：\n\n```python\n@triton.jit\ndef sum_kernel(x_ptr, y_ptr, M, K, BLOCK_K: tl.constexpr):\n    row = tl.program_id(0)\n    x_row = x_ptr + row * K\n\n    acc = tl.zeros([BLOCK_K], dtype=tl.float32)  # fp32 累加器\n    for k_start in range(0, K, BLOCK_K):\n        k_offs = k_start + tl.arange(0, BLOCK_K)\n        mask = k_offs < K\n        x = tl.load(x_row + k_offs, mask=mask, other=0.0)\n        acc += x.to(tl.float32)          # 提升到 fp32\n\n    result = tl.sum(acc)\n    tl.store(y_ptr + row, result.to(tl.float16))\n```\n\n### Log-Sum-Exp Trick\n\n直接计算 `log(sum(exp(x)))` 在大值输入时 exp 溢出。通过减去全局 max 保证数值稳定：\n\n```\nlog(sum(exp(x_i)))\n= log(sum(exp(x_i - max_x) * exp(max_x)))\n= max_x + log(sum(exp(x_i - max_x)))\n```\n\n```python\n@triton.jit\ndef logsumexp_kernel(x_ptr, y_ptr, M, K, BLOCK_K: tl.constexpr):\n    row = tl.program_id(0)\n    x_row = x_ptr + row * K\n\n    # Pass 1: 求全局 max\n    max_val = tl.full([1], float('-inf'), dtype=tl.float32)\n    for k_start in range(0, K, BLOCK_K):\n        k_offs = k_start + tl.arange(0, BLOCK_K)\n        mask = k_offs < K\n        x = tl.load(x_row + k_offs, mask=mask, other=float('-inf')).to(tl.float32)\n        max_val = tl.maximum(max_val, tl.max(x))\n\n    # Pass 2: 减去 max 后 exp + sum\n    sum_exp = tl.zeros([1], dtype=tl.float32)\n    for k_start in range(0, K, BLOCK_K):\n        k_offs = k_start + tl.arange(0, BLOCK_K)\n        mask = k_offs < K\n        x = tl.load(x_row + k_offs, mask=mask, other=float('-inf')).to(tl.float32)\n        sum_exp += tl.sum(tl.exp(x - max_val) * mask.to(tl.float32))\n\n    y = max_val + tl.log(sum_exp)\n    tl.store(y_ptr + row, y.to(tl.float32))\n```\n\n### Split-K 并行归约（atomic_add 方案）\n\n对 K ≥ 4096 的归约，将 K 维拆分到多个 AI Core，用 atomic_add 直接归约（exp_splitk_reduction_001，35% 提升）：\n\n```python\n@triton.jit\ndef splitk_atomic_kernel(x_ptr, y_ptr, M, K,\n                          BLOCK_K: tl.constexpr,\n                          SPLIT: tl.constexpr):\n    # grid = (M, SPLIT)\n    row = tl.program_id(0)\n    split_id = tl.program_id(1)\n\n    k_per_split = tl.cdiv(K, SPLIT)\n    k_start = split_id * k_per_split\n    k_end = tl.minimum(k_start + k_per_split, K)\n\n    acc = tl.zeros([BLOCK_K], dtype=tl.float32)\n    for k in range(k_start, k_end, BLOCK_K):\n        k_offs = k + tl.arange(0, BLOCK_K)\n        mask = k_offs < k_end\n        x = tl.load(x_ptr + row * K + k_offs, mask=mask, other=0.0).to(tl.float32)\n        acc += x\n\n    partial_sum = tl.sum(acc)\n    # 原子加到输出（自动全局归约）\n    tl.atomic_add(y_ptr + row, partial_sum)\n\n\ndef splitk_reduction(x: torch.Tensor) -> torch.Tensor:\n    M, K = x.shape\n    y = torch.zeros(M, dtype=torch.float32, device=x.device)\n    SPLIT = min(32, triton.cdiv(K, 128))  # 根据 K 大小动态确定 SPLIT\n    BLOCK_K = 128\n    grid = (M, SPLIT)\n    splitk_atomic_kernel[grid](x, y, M, K, BLOCK_K=BLOCK_K, SPLIT=SPLIT)\n    return y.to(x.dtype)\n```\n\n### Split-K 两阶段方案（exp_splitk_two_pass_001，40% 提升）\n\natomic_add 有竞争开销。两阶段方案：Phase 1 各核写入独立 partial buffer；Phase 2 单独内核做最终归约：\n\n```python\n@triton.jit\ndef splitk_phase1_kernel(x_ptr, partial_ptr, M, K,\n                          BLOCK_K: tl.constexpr,\n                          SPLIT: tl.constexpr):\n    row = tl.program_id(0)\n    split_id = tl.program_id(1)\n    k_per_split = tl.cdiv(K, SPLIT)\n    k_start = split_id * k_per_split\n    k_end = tl.minimum(k_start + k_per_split, K)\n\n    acc = tl.zeros([BLOCK_K], dtype=tl.float32)\n    for k in range(k_start, k_end, BLOCK_K):\n        k_offs = k + tl.arange(0, BLOCK_K)\n        mask = k_offs < k_end\n        x = tl.load(x_ptr + row * K + k_offs, mask=mask, other=0.0).to(tl.float32)\n        acc += x\n\n    # 写入 partial buffer：shape [M, SPLIT]\n    tl.store(partial_ptr + row * SPLIT + split_id, tl.sum(acc))\n\n\n@triton.jit\ndef splitk_phase2_kernel(partial_ptr, y_ptr, M, SPLIT,\n                          BLOCK_SPLIT: tl.constexpr):\n    row = tl.program_id(0)\n    split_offs = tl.arange(0, BLOCK_SPLIT)\n    mask = split_offs < SPLIT\n    partials = tl.load(partial_ptr + row * SPLIT + split_offs, mask=mask, other=0.0)\n    tl.store(y_ptr + row, tl.sum(partials))\n```\n\n### 联合 Argmax + Max（单遍）\n\n单遍同时维护最大值及其索引，避免两遍扫描（exp_reduction_argmax_001，25% 提升）：\n\n```python\n@triton.jit\ndef argmax_kernel(x_ptr, val_ptr, idx_ptr, M, K, BLOCK_K: tl.constexpr):\n    row = tl.program_id(0)\n    x_row = x_ptr + row * K\n\n    running_max = tl.full([1], float('-inf'), dtype=tl.float32)\n    running_idx = tl.zeros([1], dtype=tl.int32)\n\n    for k_start in range(0, K, BLOCK_K):\n        k_offs = k_start + tl.arange(0, BLOCK_K)\n        mask = k_offs < K\n        x = tl.load(x_row + k_offs, mask=mask, other=float('-inf')).to(tl.float32)\n\n        block_max = tl.max(x)\n        # 找到 block 内 argmax\n        is_max = (x == block_max) & mask\n        block_idx = tl.sum(tl.where(is_max, k_offs, 0))\n\n        # 与全局 running max 合并\n        update = block_max > running_max\n        running_max = tl.where(update, block_max, running_max)\n        running_idx = tl.where(update, block_idx, running_idx)\n\n    tl.store(val_ptr + row, running_max.to(tl.float16))\n    tl.store(idx_ptr + row, running_idx)\n```\n\n### Fused Cross-Entropy（含 log-softmax）\n\ncross-entropy 与 log-softmax 融合：单遍计算 logsumexp，直接输出 loss，无需中间 softmax 张量（exp_reduction_cross_entropy_001，30% 提升）：\n\n```python\n@triton.jit\ndef cross_entropy_kernel(logits_ptr, labels_ptr, loss_ptr,\n                          M, V, BLOCK_V: tl.constexpr):\n    row = tl.program_id(0)\n    logits_row = logits_ptr + row * V\n\n    # Pass 1: max（数值稳定）\n    max_val = tl.full([1], float('-inf'), dtype=tl.float32)\n    for v_start in range(0, V, BLOCK_V):\n        v_offs = v_start + tl.arange(0, BLOCK_V)\n        mask = v_offs < V\n        x = tl.load(logits_row + v_offs, mask=mask, other=float('-inf')).to(tl.float32)\n        max_val = tl.maximum(max_val, tl.max(x))\n\n    # Pass 2: sum(exp(x - max))\n    sum_exp = tl.zeros([1], dtype=tl.float32)\n    for v_start in range(0, V, BLOCK_V):\n        v_offs = v_start + tl.arange(0, BLOCK_V)\n        mask = v_offs < V\n        x = tl.load(logits_row + v_offs, mask=mask, other=float('-inf')).to(tl.float32)\n        sum_exp += tl.sum(tl.exp(x - max_val) * mask.to(tl.float32))\n\n    log_sum_exp = max_val + tl.log(sum_exp)\n\n    # 取 ground truth logit\n    label = tl.load(labels_ptr + row)\n    gt_logit = tl.load(logits_row + label).to(tl.float32)\n\n    loss = log_sum_exp - gt_logit\n    tl.store(loss_ptr + row, loss.to(tl.float32))\n```\n\n### Cumulative Sum（前缀扫描）\n\n使用 scan primitive 实现 cumsum（exp_cumsum_001，25% 提升）：\n\n```python\n@triton.jit\ndef cumsum_kernel(x_ptr, y_ptr, N, BLOCK_SIZE: tl.constexpr):\n    pid = tl.program_id(0)\n    offsets = pid * BLOCK_SIZE + tl.arange(0, BLOCK_SIZE)\n    mask = offsets < N\n    x = tl.load(x_ptr + offsets, mask=mask, other=0.0).to(tl.float32)\n    # Triton 内置 scan（前缀扫描）\n    y = tl.cumsum(x, axis=0)\n    tl.store(y_ptr + offsets, y, mask=mask)\n```\n\n## 常见陷阱\n\n| 陷阱 | 说明 | 解决方案 |\n|------|------|----------|\n| fp16/bf16 累加溢出 | K 较大时 fp16 sum 溢出（最大 65504） | 使用 fp32 累加器（exp_reduction_fp32_001） |\n| exp 直接溢出 | 未减 max 直接 exp(x) 溢出 | 使用 log-sum-exp trick（exp_reduction_logsumexp_001） |\n| split-K atomic 竞争 | 多核 atomic_add 到同一地址，竞争严重时性能下降 | 改用两阶段方案（exp_splitk_two_pass_001） |\n| split-K SPLIT 过大 | SPLIT > AI Core 数时产生资源浪费和同步开销 | SPLIT ≤ num_aicores，通常 SPLIT ≤ 32 |\n| argmax 两遍扫描 | 先 max 再 argmax 需要读两遍输入 | 单遍联合 argmax+max（exp_reduction_argmax_001） |\n| logsumexp 精度下溢 | max 与 x_i 差距极大时 exp(x_i - max) 下溢为 0 | 保持 fp32 精度，不在 fp16 下计算 log-sum-exp |\n| 小 K 使用 split-K | K < 512 时 split-K 的 launch 和同步开销超过收益 | K < 512 时用单核单遍归约 |\n| 忽略 histogram 冲突 | 多核同时写同一 bin，atomic 竞争严重 | 寄存器局部 histogram，最后单次写回（exp_histogram_reduction_001） |\n\n## 代码模板\n\n### 通用行归约模板（sum/max/min）\n\n```python\nimport torch\nimport triton\nimport triton.language as tl\n\n@triton.autotune(\n    configs=[triton.Config({'BLOCK_K': bk}) for bk in [128, 256, 512, 1024]],\n    key=['K'],\n)\n@triton.jit\ndef row_reduction_kernel(\n    x_ptr,\n    y_ptr,\n    M, K,\n    BLOCK_K: tl.constexpr,\n    REDUCE_OP: tl.constexpr,  # 'sum' | 'max' | 'min'\n):\n    row = tl.program_id(0)\n    x_row = x_ptr + row * K\n\n    if REDUCE_OP == 'sum':\n        acc = tl.zeros([BLOCK_K], dtype=tl.float32)\n    elif REDUCE_OP == 'max':\n        acc = tl.full([BLOCK_K], float('-inf'), dtype=tl.float32)\n    else:\n        acc = tl.full([BLOCK_K], float('inf'), dtype=tl.float32)\n\n    for k_start in range(0, K, BLOCK_K):\n        k_offs = k_start + tl.arange(0, BLOCK_K)\n        mask = k_offs < K\n        x = tl.load(x_row + k_offs, mask=mask,\n                     other=(0.0 if REDUCE_OP == 'sum' else float('-inf'))).to(tl.float32)\n        if REDUCE_OP == 'sum':\n            acc += x\n        elif REDUCE_OP == 'max':\n            acc = tl.maximum(acc, x)\n        else:\n            acc = tl.minimum(acc, x)\n\n    if REDUCE_OP == 'sum':\n        result = tl.sum(acc)\n    elif REDUCE_OP == 'max':\n        result = tl.max(acc)\n    else:\n        result = tl.min(acc)\n\n    tl.store(y_ptr + row, result.to(tl.float16))\n\n\ndef row_sum(x: torch.Tensor) -> torch.Tensor:\n    M, K = x.shape\n    y = torch.empty(M, dtype=x.dtype, device=x.device)\n    row_reduction_kernel[(M,)](x, y, M, K, REDUCE_OP='sum')\n    return y\n```\n\n### Split-K 归约完整示例\n\n```python\ndef splitk_sum(x: torch.Tensor, split: int = 16) -> torch.Tensor:\n    \"\"\"两阶段 split-K sum，适用于 K >= 4096。\"\"\"\n    M, K = x.shape\n    BLOCK_K = 256\n\n    # Phase 1: 各核计算部分和\n    partial = torch.zeros(M, split, dtype=torch.float32, device=x.device)\n    splitk_phase1_kernel[(M, split)](x, partial, M, K,\n                                      BLOCK_K=BLOCK_K, SPLIT=split)\n\n    # Phase 2: 全局归约\n    y = torch.empty(M, dtype=x.dtype, device=x.device)\n    BLOCK_SPLIT = triton.next_power_of_2(split)\n    splitk_phase2_kernel[(M,)](partial, y, M, split, BLOCK_SPLIT=BLOCK_SPLIT)\n    return y\n```\n\n## 相关页面\n\n- [normalization.md](op-class-normalization.md) — 归一化算子（LayerNorm、RMSNorm、Softmax）内部大量使用归约原语\n- [elementwise.md](op-class-elementwise.md) — softmax = exp（elementwise）+ sum_reduce + div（elementwise）\n- [gather_scatter.md](op-class-gather_scatter.md) — MoE 场景中 wgrad 需要 scatter 后的 sum 归约\n\n## 已知实例（P3 挂载）\n\n### Extracted Kernel 反链\n- `018-_reduce_split_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/018-_reduce_split_kernel.py`）\n- `022-count_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/022-count_kernel.py`）\n- `114-sum_and_scale.py` — extracted kernel（source: `raw_experiences/extracted_kernels/114-sum_and_scale.py`）\n- `134-bitonic_sortbykey_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/134-bitonic_sortbykey_kernel.py`）\n- `136-digit_hist_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/136-digit_hist_kernel.py`）\n- `138-duplicate_keys_shuffle_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/138-duplicate_keys_shuffle_kernel.py`）\n- `139-multinomial_with_replacement.py` — extracted kernel（source: `raw_experiences/extracted_kernels/139-multinomial_with_replacement.py`）\n- `165-rejection_greedy_sample_spec_len_1_triton.py` — extracted kernel（source: `raw_experiences/extracted_kernels/165-rejection_greedy_sample_spec_len_1_triton.py`）\n- `167-rejection_greedy_sample_triton.py` — extracted kernel（source: `raw_experiences/extracted_kernels/167-rejection_greedy_sample_triton.py`）\n- `168-rejection_random_sample_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/168-rejection_random_sample_kernel.py`）\n- `170-sample_recovered_tokens_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/170-sample_recovered_tokens_kernel.py`）\n- `171-rejection_random_sample_block_verify_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/171-rejection_random_sample_block_verify_kernel.py`）\n- `186-chunk_local_cumsum_scalar_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/186-chunk_local_cumsum_scalar_kernel.py`）\n- `222-_top_p_sample_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/222-_top_p_sample_kernel.py`）\n- `223-_top_p_filter_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/223-_top_p_filter_kernel.py`）\n- `224-_reject_sampler_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/224-_reject_sampler_kernel.py`）\n- `225-_join_prob_reject_sampler_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/225-_join_prob_reject_sampler_kernel.py`）\n\n\n", "op-class-rope.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/ops/rope.md\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/ops/rope.md` 迁移而来，原始为算子类别设计页，未做内容改写，仅转 OKF frontmatter。\n\n# RoPE（旋转位置编码）算子优化\n\n## 概述\n\nRoPE（Rotary Positional Embedding）通过将 token 位置编码嵌入到 Q/K 头的旋转变换中实现位置感知：\n\n```\nq_rot[i] = q[i] * cos(θ_pos) - q[i+d/2] * sin(θ_pos)\nq_rot[i+d/2] = q[i] * sin(θ_pos) + q[i+d/2] * cos(θ_pos)\n```\n\n在 Ascend 910b 上，RoPE 的主要优化目标是：\n1. **cos/sin 复用**：同一位置的 cos/sin 在所有 head 间共享，仅加载一次\n2. **向量化旋转**：将 head_dim 分成前/后两半（或奇/偶），批量向量化处理\n3. **内存对齐**：ALIGNED 路径一次加载整个 rope_dim；非对齐路径分两半加载\n4. **Grid-stride loop**：处理可变序列长度，最大化核心利用率\n\n## 经验路由\n\n| 场景 | 经验ID | 提升% | 关键技术 | 经验文件 |\n|------|--------|-------|----------|----------|\n| 标准 RoPE 前向（通用） | exp_rope_001 | 15% | cos/sin 复用 + persistent grid-stride + constexpr inverse | yaml |\n| RoPE 前向（NPU 专优） | exp_rope_npu_001 | 35% | cos/sin 复用 + software pipeline (`num_stages`) + 前反向合并 | yaml |\n| RoPE 前向（内存对齐） | exp_rope_forward_001 | 25% | ALIGNED 路径单次向量加载 + `do_not_specialize=[\"seq_len\"]` | yaml |\n| RoPE 反向传播 | exp_rope_backward_001 | 25% | grid-stride + IS_VARLEN 变长优化 + HAS_KV_LENS | yaml |\n| 部分 RoPE（Llama-3 style） | exp_partial_rope_001 | 25% | 跳过 NOPE_DIM + 向量化前/后半加载 + core scheduling | yaml |\n| Qwen2-VL Multi-RoPE | exp_qwen2vl_mrope_001 | 25% | 时间/高度/宽度三维融合 + head blocking 复用 + software pipeline | yaml |\n| Llama-4 NPU RoPE | exp_rope_llama4_npu_001 | 25% | UB tiling (BLOCK_Q/BLOCK_K) + FMA 指令 + interleaved 复数布局 | yaml |\n| SISO 布局 RoPE | exp_rope_siso_001 | 25% | 3D tiling (BLOCK_N×BLOCK_H×BLOCK_D) + 非交错向量化路径 | yaml |\n| Triton 标准 RoPE | exp_rope_triton_001 | 25% | 向量化 feat_offset 加载 + fused cos/sin 旋转 | yaml |\n| Neox/非Neox 双路 RoPE | exp_triton_rope_001 | 25% | IS_NEOX_STYLE constexpr 分支消除 + 部分 rope_dim 支持 | yaml |\n\n## 关键技术\n\n### 1. cos/sin 一次加载多头复用\n\ncos/sin 表在同一序列位置对所有 head 相同，在 head 循环外加载一次：\n\n```python\n@triton.jit\ndef rope_kernel(q_ptr, k_ptr, cos_ptr, sin_ptr, output_q_ptr, output_k_ptr,\n                num_tokens, num_heads_q, num_heads_k, head_dim,\n                BLOCK_T: tl.constexpr, HEAD_DIM: tl.constexpr):\n    pid = tl.program_id(0)\n    token_id = pid * BLOCK_T + tl.arange(0, BLOCK_T)\n    mask_t = token_id < num_tokens\n\n    half = HEAD_DIM // 2\n    dim_offs = tl.arange(0, HEAD_DIM)\n\n    # cos/sin：同一位置所有 head 相同，在 head 循环外加载\n    cos = tl.load(cos_ptr + token_id[:, None] * HEAD_DIM + dim_offs[None, :],\n                  mask=mask_t[:, None])\n    sin = tl.load(sin_ptr + token_id[:, None] * HEAD_DIM + dim_offs[None, :],\n                  mask=mask_t[:, None])\n\n    for h in range(num_heads_q):\n        x1 = tl.load(q_ptr + token_id[:, None] * num_heads_q * HEAD_DIM + h * HEAD_DIM + dim_offs[:half][None, :],\n                     mask=mask_t[:, None])\n        x2 = tl.load(q_ptr + token_id[:, None] * num_heads_q * HEAD_DIM + h * HEAD_DIM + dim_offs[half:][None, :],\n                     mask=mask_t[:, None])\n        # 旋转\n        o1 = x1 * cos[:, :half] - x2 * sin[:, :half]\n        o2 = x1 * sin[:, :half] + x2 * cos[:, :half]\n        tl.store(output_q_ptr + ..., o1, mask=mask_t[:, None])\n        tl.store(output_q_ptr + ..., o2, mask=mask_t[:, None])\n```\n\n### 2. constexpr inverse 消除前/反向分支\n\n`inverse` 标志用 `tl.constexpr` 编译时特化，消除运行时分支：\n\n```python\n@triton.jit\ndef rope_fwd_bwd_kernel(..., INVERSE: tl.constexpr):\n    # ...\n    if INVERSE:  # 编译时展开，无运行时开销\n        o1 = x1 * cos - x2 * (-sin)  # 反向：等价于反向旋转\n        o2 = x2 * cos + x1 * (-sin)\n    else:\n        o1 = x1 * cos - x2 * sin\n        o2 = x1 * sin + x2 * cos\n```\n\n### 3. 内存对齐 ALIGNED 路径\n\n当 rope_dim 对齐时一次加载，否则分两半：\n\n```python\n@triton.jit\ndef rope_forward_kernel(..., ALIGNED: tl.constexpr, rope_dim, head_dim):\n    if ALIGNED:\n        # 单次加载完整 rope_dim，最大向量带宽\n        x = tl.load(ptr + offs)\n    else:\n        # 分两半加载（处理非对齐或 rope_dim < head_dim）\n        x_low = tl.load(ptr + low_offs, mask=low_mask)\n        x_high = tl.load(ptr + high_offs, mask=high_mask)\n```\n\n### 4. 部分 RoPE（Partial RoPE，Llama-3 style）\n\n当 `rope_dim < head_dim` 时，只对前 `rope_dim` 维旋转，其余 passthrough：\n\n```python\n# 跳过 NOPE_DIM（非旋转部分），从偏移 NOPE_DIM 开始处理\nnope_dim = head_dim - rope_dim\nhalf_dim = rope_dim // 2\n\nx_l_offs = base + nope_dim + tl.arange(0, half_dim)      # lower half\nx_h_offs = base + nope_dim + half_dim + tl.arange(0, half_dim)  # upper half\n\nx_l = tl.load(ptr + x_l_offs, mask=...)\nx_h = tl.load(ptr + x_h_offs, mask=...)\n\no_l = x_l * cos - x_h * sin\no_h = x_l * sin + x_h * cos\n```\n\n### 5. Multi-RoPE（Qwen2-VL）三维位置编码\n\n时间/高度/宽度三维使用不同 cos/sin 表，通过 `tl.where` 动态选择：\n\n```python\n# 三维 RoPE：t/h/w 维度各有独立位置编码\n@triton.jit\ndef mrope_kernel(..., HEAD_DIM: tl.constexpr, BLOCK_Q: tl.constexpr):\n    dim_idx = tl.arange(0, HEAD_DIM)\n    # 按维度判断使用哪套 cos/sin（t/h/w 各占 head_dim/3）\n    is_t = dim_idx < HEAD_DIM // 3\n    is_h = (dim_idx >= HEAD_DIM // 3) & (dim_idx < 2 * HEAD_DIM // 3)\n    # is_w = dim_idx >= 2 * HEAD_DIM // 3\n\n    cos_val = tl.where(is_t, cos_t, tl.where(is_h, cos_h, cos_w))\n    sin_val = tl.where(is_t, sin_t, tl.where(is_h, sin_h, sin_w))\n```\n\n## 布局变体\n\n| 布局 | 说明 | 加载策略 |\n|------|------|----------|\n| Neox-style（分块） | `[x_0, ..., x_{d/2-1}, x_{d/2}, ..., x_{d-1}]`，前/后分开 | `IS_NEOX_STYLE=True`：连续分两段加载 |\n| GPT-J-style（交错） | `[x_0, x_1, x_2, x_3, ...]`，奇偶交替 | `IS_NEOX_STYLE=False`：步长=2 加载 |\n| Partial RoPE | `[passthrough... | rope_rot...]`，仅后 rope_dim 旋转 | 偏移 NOPE_DIM 后处理 |\n| SISO | tokens × heads × head_dim 独立分块 | 3D tiling `(BLOCK_N, BLOCK_H, BLOCK_D)` |\n\n## 选择指南\n\n| 场景 | 推荐经验 |\n|------|---------|\n| 通用 RoPE，910b2/b3 | `exp_rope_npu_001`（最高 35% 提升） |\n| 变长序列（varlen batch） | `exp_rope_backward_001`（IS_VARLEN 支持）|\n| Llama-3 Partial RoPE | `exp_partial_rope_001` |\n| Qwen2-VL Multi-RoPE | `exp_qwen2vl_mrope_001` |\n| 需同时支持前/反向 | `exp_rope_npu_001`（`BACKWARD_PASS` constexpr 参数） |\n| Llama-4 NPU | `exp_rope_llama4_npu_001`（interleaved complex layout） |\n\n## 常见陷阱\n\n| 陷阱 | 解决方案 |\n|------|----------|\n| cos/sin 在 head 循环内重复加载 | 提到循环外加载，所有 head 共享（exp_rope_001） |\n| rope_dim 与 head_dim 混淆导致越界 | `ALIGNED` constexpr 路径分别处理，加载时用 `mask=offs < rope_dim` |\n| int64 token 索引 | 转为 int32 × stride（fp32 偏移），避免 scalar fallback |\n| 交错布局误用分块加载 | 用 `IS_NEOX_STYLE` constexpr 编译时选择路径，禁止运行时 if |\n| KV cache 偏移未考虑 | `HAS_KV_LENS` 专用路径，用 kv_len 计算 cos/sin 查表偏移 |\n\n## 相关页面\n\n- [ops/elementwise.md](op-class-elementwise.md) — RoPE 本质是 elementwise，激活函数反向传播模式可参考\n- [ops/attention.md](op-class-attention.md) — RoPE 通常在 QKV 投影后、Attention 前执行；Fusion-2 模式\n- [ops/fused_ops.md](op-class-fused_ops.md) — GEMM + RMSNorm + RoPE 三合一融合（Fusion-2）\n- techniques/ilp.md — cos/sin 加载的 for-loop tiling + software pipeline\n- techniques/data_types.md — int64 索引退化问题\n\n## 被以下页面引用\n\n- [ops/attention.md](op-class-attention.md) — Attention 前的 QK RoPE 编码步骤\n- [ops/fused_ops.md](op-class-fused_ops.md) — Fusion-2 Linear+RMSNorm+RoPE\n- experience_index.md — RoPE 区全量经验 ID\n\n## 已知实例（P3 挂载）\n\n### Extracted Kernel 反链\n- `035-rotary_emb_compute.py` — extracted kernel（source: `raw_experiences/extracted_kernels/035-rotary_emb_compute.py`）\n- `036-apply_rotary_pos_emb_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/036-apply_rotary_pos_emb_kernel.py`）\n- `037-partial_rotary_emb_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/037-partial_rotary_emb_kernel.py`）\n- `038-partial_rope_qk_compute.py` — extracted kernel（source: `raw_experiences/extracted_kernels/038-partial_rope_qk_compute.py`）\n- `039-partial_rope_qk_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/039-partial_rope_qk_kernel.py`）\n- `043-rotary_pos_emb_qr_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/043-rotary_pos_emb_qr_kernel.py`）\n- `059-apply_rotary_pos_emb_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/059-apply_rotary_pos_emb_kernel.py`）\n- `063-_compute_rotary_emb.py` — extracted kernel（source: `raw_experiences/extracted_kernels/063-_compute_rotary_emb.py`）\n- `065-fused_single_norm_and_partial_rope_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/065-fused_single_norm_and_partial_rope_kernel.py`）\n- `098-_triton_llama4_rope_npu.py` — extracted kernel（source: `raw_experiences/extracted_kernels/098-_triton_llama4_rope_npu.py`）\n- `099-_triton_qwen2vl_mrope_npu.py` — extracted kernel（source: `raw_experiences/extracted_kernels/099-_triton_qwen2vl_mrope_npu.py`）\n- `104-_triton_rope_npu.py` — extracted kernel（source: `raw_experiences/extracted_kernels/104-_triton_rope_npu.py`）\n- `116-rotary_embedding_rw_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/116-rotary_embedding_rw_kernel.py`）\n- `117-rotary_embedding_siso_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/117-rotary_embedding_siso_kernel.py`）\n- `172-_triton_rope.py` — extracted kernel（source: `raw_experiences/extracted_kernels/172-_triton_rope.py`）\n- `192-fused_rope_qk_mqa_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/192-fused_rope_qk_mqa_kernel.py`）\n- `227-_compute_rope.py` — extracted kernel（source: `raw_experiences/extracted_kernels/227-_compute_rope.py`）\n- `228-_compute_rope_separated.py` — extracted kernel（source: `raw_experiences/extracted_kernels/228-_compute_rope_separated.py`）\n- `229-_rope_forward_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/229-_rope_forward_kernel.py`）\n- `230-_rope_backward_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/230-_rope_backward_kernel.py`）\n\n\n", "op-class-softmax.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/ops/softmax.md\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/ops/softmax.md` 迁移而来，原始为算子类别设计页，未做内容改写，仅转 OKF frontmatter。\n\n# Softmax / LogSoftmax 算子优化\n\n## 概述\n\nSoftmax 将实值向量归一化为概率分布：`softmax(x)_i = exp(x_i) / Σ exp(x_j)`。  \nLogSoftmax 输出对数概率：`log_softmax(x)_i = x_i - log(Σ exp(x_j))`，数值更稳定。\n\n在 Triton-Ascend 中，Softmax 的核心挑战是：\n1. **两趟访存开销**：标准实现需两次遍历（先求 max，再求 exp+sum）\n2. **数值溢出**：fp16/bf16 下 `exp(x)` 容易溢出，需减去最大值稳定化\n3. **归约通信**：跨 tile 归约需要同步，影响并行度\n\n## 检测标准\n\n满足以下条件时归类为 Softmax：\n- PyTorch 原语：`F.softmax(x, dim=...)` 或 `F.log_softmax(x, dim=...)`\n- 归约沿指定维度（inner dim 或 outer dim），输出形状与输入相同\n- 不含跨 batch 归约（跨 batch 属于 Reduction）\n\n## 适用条件\n\n| 条件 | 说明 |\n|------|------|\n| 数据类型 | fp16、bf16、fp32；fp8 需特殊 UB 分片处理 |\n| inner dim N | N≥64 时向量化收益显著；N 超过 UB 容量需分块 |\n| outer dim M | M≥1，通常每个 program 处理一行 |\n\n## 经验路由\n\n| 场景 | 经验ID | 提升% | 关键技术 | 经验文件 |\n|------|--------|-------|----------|----------|\n| 标准 Softmax（inner dim） | exp_softmax_inner_002 | 30% | 在线 max+sum 单趟，数值稳定 | yaml |\n| 非 inner dim Softmax | exp_softmax_non_inner_001 | 25% | 外层维度归约，转置后处理 | yaml |\n| Online Softmax（Attention 内融合） | exp_softmax_online_001 | 50% | 运行 m_i/l_i 迭代更新，消除完整 NxN 矩阵 | yaml |\n| LogSoftmax 前向 | exp_log_softmax_001 | 30% | 两趟：max+sum → log-sum-exp 单核 | yaml |\n| LogSoftmax 反向 | exp_log_softmax_backward_001 | 25% | 反向梯度：`dy - softmax(x) * sum(dy)` | yaml |\n| Softmax 反向（inner） | exp_softmax_backward_001 | 25% | 反向：`p * (dy - dot(p, dy))` | yaml |\n| Softmax 反向（非 inner） | exp_softmax_backward_non_inner_001 | 20% | 非内层维度反向，二维 tile 处理 | yaml |\n\n## 关键技术\n\n### Online Softmax 算法（单趟）\n\n核心思想：维护运行最大值 `m_i` 和运行指数和 `l_i`，一次遍历完成 max+sum：\n\n```\nm_new = max(m_old, x_tile_max)\nl_new = l_old * exp(m_old - m_new) + sum(exp(x_tile - m_new))\n```\n\n最终输出：`softmax(x)_i = exp(x_i - m_final) / l_final`\n\n```python\n@triton.jit\ndef softmax_online_kernel(x_ptr, y_ptr, n_rows, n_cols, BLOCK_N: tl.constexpr):\n    row = tl.program_id(0)\n    x_row = x_ptr + row * n_cols\n\n    # 在线算法：单趟计算 max 和 sum\n    m = tl.full([1], float('-inf'), dtype=tl.float32)\n    l = tl.zeros([1], dtype=tl.float32)\n    for col in range(0, n_cols, BLOCK_N):\n        cols = col + tl.arange(0, BLOCK_N)\n        mask = cols < n_cols\n        x = tl.load(x_row + cols, mask=mask, other=float('-inf')).to(tl.float32)\n        m_new = tl.maximum(m, tl.max(x))\n        l = l * tl.exp(m - m_new) + tl.sum(tl.exp(x - m_new))\n        m = m_new\n\n    # 第二趟：写出归一化结果\n    for col in range(0, n_cols, BLOCK_N):\n        cols = col + tl.arange(0, BLOCK_N)\n        mask = cols < n_cols\n        x = tl.load(x_row + cols, mask=mask, other=0.0).to(tl.float32)\n        y = tl.exp(x - m) / l\n        tl.store(y_ptr + row * n_cols + cols, y.to(tl.float16), mask=mask)\n```\n\n### 数值稳定化\n\nfp16/bf16 下 `exp(x)` 在 x > 65504 时溢出。**必须**在 exp 前减去行内最大值：\n\n```python\nx_stable = x - tl.max(x, axis=0)  # 防止 exp 溢出\np = tl.exp(x_stable)\np = p / tl.sum(p)\n```\n\n参考：exp_stability_001\n\n### UB 容量限制（N 大于 192KB 时分块）\n\n910b2/910b3 UB 约 192KB。fp16 时单行最大元素数：`192*1024/2 = 98304`。  \n超出时使用分块两趟算法（exp_softmax_non_inner_001 / exp_log_softmax_001 的策略）。\n\n## 常见陷阱\n\n| 陷阱 | 说明 | 解决方案 |\n|------|------|----------|\n| fp16 exp 溢出 | x 不减 max 直接 exp，输出 Inf | 先减行内最大值（数值稳定化） |\n| outer dim 效率低 | 非 inner dim 归约需要 gather-like 访问 | 转置后处理内层，或使用 non_inner 变体 |\n| 两趟访存带宽瓶颈 | 独立读两次 HBM | 使用 Online Softmax 合并为单趟 |\n| Attention 中单独 Softmax | 多余 HBM 写回 | 将 Softmax 融入 Attention 内核（Flash Attention） |\n\n## 相关页面\n\n- [ops/attention.md](op-class-attention.md) — Flash Attention 内嵌 Online Softmax，是最重要的 Softmax 融合场景\n- [ops/reduction.md](op-class-reduction.md) — Reduction 原语与 Softmax 共享归约逻辑\n- [ops/loss.md](op-class-loss.md) — CrossEntropy/LogSoftmax 常与 Loss 计算融合\n- techniques/online_algorithms.md — Online Softmax 算法详解\n- techniques/numerical_stability.md — 数值稳定性指南\n\n## 已知实例（P3 挂载）\n\n### Extracted Kernel 反链\n- `126-softmax_kernel_non_inner.py` — extracted kernel（source: `raw_experiences/extracted_kernels/126-softmax_kernel_non_inner.py`）\n- `127-softmax_kernel_inner.py` — extracted kernel（source: `raw_experiences/extracted_kernels/127-softmax_kernel_inner.py`）\n- `128-softmax_backward_kernel_non_inner.py` — extracted kernel（source: `raw_experiences/extracted_kernels/128-softmax_backward_kernel_non_inner.py`）\n- `129-softmax_backward_kernel_inner.py` — extracted kernel（source: `raw_experiences/extracted_kernels/129-softmax_backward_kernel_inner.py`）\n- `144-log_softmax_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/144-log_softmax_kernel.py`）\n- `145-log_softmax_backward_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/145-log_softmax_backward_kernel.py`）\n- `054-vec_a.py` — extracted kernel（source: `raw_experiences/extracted_kernels/054-vec_a.py`）\n\n\n", "op-class-solve_tril.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/ops/solve_tril.md\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/ops/solve_tril.md` 迁移而来，原始为算子类别设计页，未做内容改写，仅转 OKF frontmatter。\n\n# solve_tril 算子优化（三角矩阵求逆）\n\n## 概述\n\n`solve_tril` 算子计算 **(I + A) 的逆矩阵**，其中 A 是严格下三角矩阵。用于 Flash Linear Attention（FLA）中分块求解注意力矩阵的关键组件。\n\n数学原理：对于严格下三角矩阵 A（BT × BT），`(I + A)^(-1)` 可通过有限项 Neumann 级数或分块前向代入法精确计算。实际 kernel 使用**分层分块递推**：以 16×16 为原子计算单元，通过逐层 merge 支持 BT=32 和 BT=64。\n\n特点：\n- **严格下三角结构**：A 对角线及以上全为零，可利用此结构消除冗余计算和 mask\n- **固定块大小**：BT ∈ {16, 32, 64}，16×16 为 NPU 矩阵乘法最优粒度\n- **分块递推**：标量递推（16×16）→ 块递推（32×32、64×64），数学结构统一\n- **完全并行**：所有 chunk 内的所有 (batch, head) 对独立，grid = (NT, B×H)\n\n## 经验路由\n\n| 场景 | 经验ID | 关键技术 | 经验文件 |\n|------|--------|----------|----------|\n| 冗余结构 mask 消除 | exp_solve_tril_001 | 利用矩阵结构零元删除 `tl.where`，1.33x-1.87x | yaml |\n| Preload + extract_slice 消除 HBM 重读 | exp_solve_tril_002 | 寄存器块预加载后用 extract_slice 替代 HBM load | yaml |\n| Constexpr 双路径循环展开 | exp_solve_tril_003 | 完整 tile constexpr 展开 + 边界 tile 运行时循环 | yaml |\n| 三层分级 kernel 调度 | exp_solve_tril_004 | BT=16/32/64 分治架构，16×16 原子单元 | yaml |\n| CANN 兼容性参数审计 | exp_solve_tril_005 | 删除不兼容参数（num_stages/sync_solver 等） | yaml |\n| 无效优化排除分析 | exp_solve_tril_006 | tl.dot vs tl.sum 广播乘决策；寄存器压力权衡 | yaml |\n\n## 关键技术\n\n### 分层分块递推架构\n\n以 16×16 为原子单元，BT=16 直接逐行递推，BT=32/64 通过分块公式逐层 merge：\n\n```\nBT=16:  基础递推（逐行）\nBT=32:  4 块分治 → 对角块递推 + 1 次 merge: X₂₁ = -X₂₂·A₂₁·X₁₁\nBT=64:  16 块分治 → 对角块递推 + 3 层 merge（紧邻→隔行→最远），共 7 次 tl.dot\n```\n\n分块递推公式与标量递推在数学结构上完全一致：\n\n```\n标量: X[i,j] = -A[i,j] - Σ_{k=j+1}^{i-1} A[i,k]·X[k,j]\n分块: X[i,j] = -X[i,i] · Σ_{k=j}^{i-1} A[i,k]·X[k,j]\n```\n\n参考：exp_solve_tril_004\n\n### 冗余结构 mask 消除（V1 优化）\n\n当矩阵具有已知结构零元时，对已为零元素施加的 `tl.where(mask, val, 0.)` 是冗余 ALU 指令。对于严格下三角矩阵 A，`tl.where(o_i < i, b_a, 0.)` 是恒等变换——j≥i 位置本身就是 0：\n\n```python\n# 反模式：冗余 mask（A[i,j≥i] 本身就是 0）\nb_a = -tl.load(A + offset)\nb_a = tl.where(o_i < i, b_a, 0.)  # ← 冗余！删除后可省 14 次 where/循环\n\n# 优化后：依赖矩阵结构保证零值\nb_a = -tl.load(A + offset)\n# b_a[j≥i] 由矩阵数学性质保证为零\n```\n\n**通用性**：适用于所有处理已知结构零元矩阵的 kernel（三角矩阵、对角矩阵、带状矩阵、mask 矩阵）。\n\n参考：exp_solve_tril_001\n\n### Preload + extract_slice 消除 HBM 重读（V4 优化）\n\n循环外通过 `tl.load(make_block_ptr(...))` 已将整个块加载到寄存器，循环内不应再用 `tl.load(A + offset)` 逐行重新从 HBM 读取。虽然 Triton 不支持 `b_A[i, :]` 动态寄存器索引，但 `tl.extract_slice` 可从寄存器提取：\n\n```python\n# 循环外：预加载到寄存器\nneg_A = -b_A  # b_A = tl.load(make_block_ptr(A, ...))\n\n# 循环内：从寄存器提取，零 HBM 访问\nfor i in range(2, BT):\n    b_a = tl.extract_slice(neg_A, (i, 0), (1, 16), (1, 1))\n    b_a = tl.reshape(b_a, (16,))\n    b_a = b_a + tl.sum(b_a[:, None] * b_A, 0)\n    b_A = tl.where((o_i == i)[:, None], b_a, b_A)\n```\n\n**通用性**：适用于所有在循环内重复读取已在寄存器中数据的 kernel（如三角矩阵操作、递推关系、逐行/逐列处理）。\n\n参考：exp_solve_tril_002\n\n### Constexpr 双路径（完整 tile vs 边界 tile）\n\n当绝大多数 chunk 是完整 tile（99%），仅最后一个可能是边界 chunk 时，用 `if T - offset >= BT` 分支：\n\n- **快速路径**：`range(2, BT)` constexpr → 循环完全展开 + extract_slice offset 静态优化为零开销\n- **慢速路径**：`range(2, min(16, remaining))` 运行时循环 → 仍从寄存器读取\n\n```python\nneg_A = -b_A  # 预加载\n\nif T - i_t * 16 >= BT:\n    # 快速路径：99% chunk，constexpr 展开\n    for i in range(2, BT):\n        b_a = tl.extract_slice(neg_A, (i, 0), (1, 16), (1, 1))\n        ...\nelse:\n    # 慢速路径：边界 chunk，运行时循环 → 仍从寄存器读\n    for i in range(2, min(16, T - i_t * 16)):\n        b_a = tl.extract_slice(neg_A, (i, 0), (1, 16), (1, 1))\n        ...\n```\n\n**被排除的方案**：统一运行时循环（V3）→ 失去 constexpr 展开，性能回退；慢速路径保留 tl.load → 不如 extract_slice 统一简洁。\n\n参考：exp_solve_tril_003\n\n### tl.dot vs tl.sum 广播乘决策\n\n对微小矩阵乘法（M=1, K≤16, N=16），`tl.dot`（CUBE 单元）比 `tl.sum(b_a[:, None] * b_A, axis=0)`（VEC 单元广播乘+归约）慢 14-20x。CUBE 单元的调度和启动开销在微小尺寸下远大于 VEC 直接计算：\n\n```python\n# 反模式（14-20x 退化）：微小矩阵强行用 tl.dot\nb_a_2d = tl.reshape(b_a, (1, 16))\nb_a = tl.dot(b_a_2d, b_A)  # CUBE 调度 >> 计算量\n\n# 正模式：VEC 广播乘 + 归约\nb_a = b_a + tl.sum(b_a[:, None] * b_A, 0)  # 1×16 × 16×16\n```\n\n**决策原则**：M=1 或 N=1 或 K≤16 时优先用 VEC 广播乘 + sum 归约。\n\n参考：exp_solve_tril_006\n\n### CANN 兼容性参数审计\n\n从外部仓库（fla、vllm 等）迁移 kernel 时必须逐项审计编译参数。以下参数在 CANN 8.5.0 上不兼容：\n\n| 参数 | 问题 | 处理 |\n|------|------|------|\n| `limit_auto_multi_buffer_of_local_buffer=\"no-limit\"` | CANN 8.5.0 未实现 | 删除 |\n| `sync_solver=True` | CANN 8.5.0 不支持 | 删除 |\n| `num_stages=2`（tl.range） | 依赖 USE_TMA，Ascend 不可用 | 删除 |\n\n参考：exp_solve_tril_005\n\n## 优化效果汇总\n\n| 版本 | 优化内容 | BT=16 加速比 | BT=32 加速比 | BT=64 加速比 |\n|------|---------|------------|------------|------------|\n| Original | 原始代码（fla 仓库） | 1.00x | 1.00x | 1.00x |\n| V1 | 删除冗余 `tl.where` | 1.33x-1.87x | 1.00x | ~1.40x |\n| V4 | Preload + extract_slice（累计） | 1.01x-1.37x (叠加) | 1.25x-1.27x | 1.11x-1.13x (叠加) |\n| **累计** | **Original → V4** | **1.42x-2.54x** | **1.26x-1.29x** | **1.55x-1.57x** |\n\n所有优化零精度损失（max_err < 1e-6），未改变算子接口。\n\n## 适用条件\n\n| 参数 | 推荐范围/说明 |\n|------|-------------|\n| BT（块大小） | 16、32、64（算子语义决定，不可变） |\n| B（batch） | ≥1，大 B 场景 grid 并行度更充分 |\n| H（head 数） | ≥1 |\n| T（序列长度） | BT 的倍数时 100% chunk 走快速 constexpr 展开路径 |\n| fp32 中间精度 | 强制要求（递推累积误差敏感性高） |\n| 输入连续性 | 输入必须 `.contiguous()`，block_ptr 依赖 stride |\n\n## 相关页面\n\n- [ops/ssm.md](op-class-ssm.md) — solve_tril 是 Flash Linear Attention 的关键组件\n- techniques/compute_and_branch.md — 冗余结构 mask 消除；constexpr 双路径展开；tl.dot vs VEC 广播乘决策\n- techniques/memory_access_optimization.md — Preload + extract_slice 消除 HBM 重读\n- techniques/tiling.md — 16×16 原子 tile + 分块递推的层次化 tiling\n- techniques/parallelism_and_loop.md — 2D grid `(NT, B×H)` 完全并行\n- techniques/ilp.md — constexpr 循环展开 vs 运行时循环的性能差异\n- techniques/operator_fusion.md — merge kernel 中括号内累加 + tl.dot 的融合模式\n\n## 已知实例（P3 挂载）\n\n### Extracted Kernel 反链\n- `153-solve_tril_16x16_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/153-solve_tril_16x16_kernel.py`）\n- `154-merge_16x16_to_32x32_inverse_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/154-merge_16x16_to_32x32_inverse_kernel.py`）\n- `155-merge_16x16_to_64x64_inverse_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/155-merge_16x16_to_64x64_inverse_kernel.py`）\n- `182-solve_tril_16x16_kernel_paral.py` — extracted kernel（source: `raw_experiences/extracted_kernels/182-solve_tril_16x16_kernel_paral.py`）\n- `183-solve_tril_16x16_kernel_paral_v3.py` — extracted kernel（source: `raw_experiences/extracted_kernels/183-solve_tril_16x16_kernel_paral_v3.py`）\n- `184-merge_16x16_to_32x32_inverse_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/184-merge_16x16_to_32x32_inverse_kernel.py`）\n- `185-merge_16x16_to_64x64_inverse_kernel_reorder_all_masked.py` — extracted kernel（source: `raw_experiences/extracted_kernels/185-merge_16x16_to_64x64_inverse_kernel_reorder_all_masked.py`）\n\n\n", "op-class-ssm.md": "\n\nsources:\n  - url: https://gitcode.com/zhou_huaman/cannbot-skills_5171/blob/d972095e7b5842b59302088cdaa07749eef5b901/ops/triton-knowledge-retrieval/knowledge/pages/ops/ssm.md\n    role: primary\n\n> 迁移备注：本卡由 `cannbot-skills_5171/ops/triton-knowledge-retrieval/knowledge/pages/ops/ssm.md` 迁移而来，原始为算子类别设计页，未做内容改写，仅转 OKF frontmatter。\n\n# SSM / 状态空间模型算子优化\n\n## 概述\n\n状态空间模型（SSM）是近年快速发展的序列模型架构，代表性工作包括 Mamba、Hyena、RetNet、GLA 等。  \n与 Transformer 不同，SSM 以**线性递推**方式更新隐状态，复杂度 O(T) 而非 O(T²)。\n\nTriton-Ascend 中 SSM 的核心挑战：\n1. **递推依赖**：时间步之间有数据依赖，不能简单并行化\n2. **Chunkwise 分解**：将序列分块，块内并行（GEMM），块间串行（状态转移）\n3. **State 寄存器复用**：隐状态 `h` 需长时间驻留寄存器，避免写回 HBM\n\n## 检测标准\n\n满足以下条件归类为 SSM：\n- 计算模式：线性递推 `h_t = A·h_{t-1} + B·x_t`，`y_t = C·h_t`\n- 或 Chunkwise 线性注意力：`O = (Q·K^T ⊙ M)·V`（因果掩码 M）\n- 或 Delta Rule 更新：`h_new = h - k^T·h·v^T + k^T·v`\n\n## 适用条件\n\n| 条件 | 说明 |\n|------|------|\n| 数据类型 | fp16、bf16；gating 部分通常 fp32 中间计算 |\n| 序列长度 T | ≥128，chunkwise 时 chunk size BT≥16 |\n| 状态维度 K/V | ≥64 |\n| 模型架构 | Mamba/Mamba2、GLA、RetNet、Hyena |\n\n## 经验路由\n\n| 场景 | 经验ID | 关键技术 | 经验文件 |\n|------|--------|----------|----------|\n| Chunkwise 线性注意力前向 | exp_chunk_fwd_001 | block_ptr tiling + gating masking，Q/K/V/H 2D块加载 | yaml |\n| Chunk CumSum（前缀和） | exp_chunk_cumsum_001 | 块内累积和，用于 gating 因子计算 | yaml |\n| Chunk Gated Delta | exp_chunk_gated_delta_001 | 带门控的 delta rule，sigmoid gating + 状态更新 | yaml |\n| Chunk KKT 计算 | exp_chunk_kkt_001 | K·K^T 内积矩阵，用于状态压缩 | yaml |\n| Delta Rule 前向（标准） | exp_fused_delta_rule_001 | sigmoid gating + softplus + delta rule 三合一融合，状态驻寄存器 | yaml |\n| Delta Rule 前向（NPU 专用） | exp_fused_delta_rule_npu_001 | Ascend 910b2/b3 路径优化版 | yaml |\n| SSM Gated Delta | exp_ssm_gated_delta_001 | SSM + gated delta rule 融合 | yaml |\n\n### 反向传播优化（KDA / Linear Attention）\n\n| 场景 | 经验ID | 提升 | 关键技术 |\n|------|--------|------|----------|\n| wy_dqkg_fused 标量消除 | exp_kda_bwd_wy_scalar_opt_001 | 3.33x | i64→i32、i32→fp32 比较、tl.cdiv/min 消除、compile_hint 移除 |\n| wy_dqkg_fused 结构优化 | exp_kda_bwd_wy_structure_opt_001 | 30% | Phase split、barrier 外提、LICM、K%BK 快速路径 |\n| intra 标量消除 | exp_kda_bwd_intra_scalar_opt_001 | 50% | block_ptr→手动指针、fp32 mask、min→tl.where |\n| intra 内存优化 | exp_kda_bwd_intra_memory_opt_001 | 35% | 转置 load 合并化、跨阶段冗余 load 消除 |\n| 标量循环 → 矩阵乘 | exp_kda_bwd_scalar_loop_to_dot_001 | 40% | 非 SAFE_GATE 对角块循环改为 tl.dot |\n\n## 关键技术\n\n### Chunkwise 并行化\n\n将长序列 T 分为 `T/BT` 个 chunk，每个 chunk 内部可做 GEMM 并行：\n\n```\n对每个 chunk c:\n  intra_chunk = Q[c] @ K[c]^T ⊙ causal_mask  (GEMM，块内并行)\n  inter_chunk = Q[c] @ H[c-1]                  (状态转移，串行)\n  O[c] = (intra_chunk + inter_chunk) @ V[c]\n  H[c] = update_state(H[c-1], K[c], V[c])\n```\n\n关键约束：BT（chunk size）通常选 16/32/64，过大超出 UB；状态 H 维度 K×V 需适配 UB。\n\n参考：exp_chunk_fwd_001\n\n### 隐状态寄存器驻留\n\nDelta Rule 更新：`h_new = h - (k^T @ h) * v^T + k * v`  \n将 `h`（维度 K×V）存于寄存器，避免每步写回 HBM：\n\n```python\n@triton.jit\ndef delta_rule_kernel(..., BK: tl.constexpr, BV: tl.constexpr):\n    # h 在寄存器内迭代更新\n    b_h = tl.zeros([BK, BV], dtype=tl.float32)  # 隐状态驻寄存器\n    for i in tl.static_range(T):\n        b_k = tl.load(k_ptr + i * K)\n        b_v = tl.load(v_ptr + i * V)\n        b_gate = tl.sigmoid(tl.load(g_ptr + i))\n        # delta rule 更新（无 HBM 写回）\n        b_h = b_gate * b_h + tl.outer(b_k, b_v)\n        tl.store(o_ptr + i * V, b_h @ b_q)\n```\n\n参考：exp_fused_delta_rule_001\n\n### Gating 融合\n\nsigmoid gating、softplus 激活与主体计算融合到同一 kernel，消除独立激活 kernel 的 HBM 开销。  \n参考：exp_chunk_gated_delta_001\n\n---\n\n## KDA / Linear Attention 反向优化\n\n`chunk_kda_bwd_kernel_wy_dqkg_fused` 和 `chunk_kda_bwd_kernel_intra` 是 Linear Attention 类模型的反向核心。在 Ascend 910B 上的优化重点与标准 SSM 前向不同：\n\n### 1. 标量消除（最高优先级）\n\n反向 kernel 通常有大量小 tile load/store 和 mask 计算，容易触发 Ascend 标量降级：\n\n```python\n# block_ptr + boundary_check → 手动指针 + fp32 mask\no_i = tl.arange(0, BC)\no_k = tl.arange(0, BK)\nm_ti = (i_ti + o_i).to(tl.float32) < T_local.to(tl.float32)\nm_k  = o_k.to(tl.float32) < K.to(tl.float32)\nmask_2d = m_ti[:, None] & m_k[None, :]\n```\n\n### 2. 转置 load 合并化\n\n`dAqk` / `dAkk` 在 Phase 2 中以转置视角加载，直接 block_ptr 会导致跨大步访存。改为行优先加载 + `tl.trans`：\n\n```python\nrow_idx = i_t*BT + i_j*BC + o_i[:, None]\ncol_idx = i_i*BC + o_i[None, :]\nb_dAqk_row = tl.load(dAqk_local + row_idx*H*BT + col_idx, mask=mask, other=0.0)\nb_dAqk = tl.trans(b_dAqk_row)\n```\n\n### 3. 标量循环 → 矩阵乘\n\n非 `SAFE_GATE` 路径的对角块计算使用 `for j in range(BC)` 逐行循环，改为 `tl.dot`：\n\n```python\nb_dAqk_diag = tl.load(p_dAqk_diag, mask=dA_diag_mask, other=0.0)\nb_dq2 += tl.dot(b_dAqk_diag, b_k_exp) * b_exp_g\n```\n\n### 4. Kernel 结构优化\n\n- **Phase split**：将 `i_k==0` 分支（dA/dv2/db）外提为独立 V-only 循环\n- **barrier 外提**：从 `i_v` 循环内移到循环后\n- **LICM**：预计算 `BT_arange[:, None] * V`、`H*K`、`H*V` 等不变量\n\n### 5. 调优配置\n\n```python\n@triton.autotune(\n    configs=[\n        triton.Config({}, num_warps=2, num_stages=2),\n        triton.Config({}, num_warps=2, num_stages=3),\n        triton.Config({}, num_warps=4, num_stages=2),\n        triton.Config({}, num_warps=4, num_stages=3),\n        triton.Config({}, num_warps=8, num_stages=2),\n        triton.Config({}, num_warps=8, num_stages=3),\n    ],\n    key=['BK', 'NC', 'BT'],\n)\n```\n\n实测 `wy_dqkg_fused` 最优：`BK=128, BV=64, num_warps=8, num_stages=2`。\n\n### 优化效果\n\n| Kernel | 优化前 | 优化后 | 加速比 |\n|--------|--------|--------|--------|\n| chunk_kda_bwd_kernel_wy_dqkg_fused | ~169,000 μs | ~50,700 μs | 3.33x |\n| chunk_kda_bwd_kernel_intra | AIV scalar 41.4% / MTE2 37.9% | 预期 scalar <20% / MTE2 <25% | — |\n\n## 常见陷阱\n\n| 陷阱 | 说明 | 解决方案 |\n|------|------|----------|\n| 状态过大超 UB | K×V 状态矩阵超出 192KB | 分块 BK/BV，多次 tile 更新状态 |\n| 递推串行化 | 跨 chunk 状态转移无法并行 | Chunkwise 分解，块内 GEMM 并行 |\n| gating 精度 | sigmoid/softplus 在 fp16 数值不稳定 | 中间计算升 fp32 |\n| block_ptr 对齐 | K/V 维度非 512B 倍数 | 使用 padding 或调整 BK/BV |\n\n## 相关页面\n\n- [ops/attention.md](op-class-attention.md) — Chunkwise 线性注意力与 Flash Attention 结构类似\n- [ops/matmul.md](op-class-matmul.md) — 块内 GEMM 使用矩阵乘优化\n- [ops/fused_ops.md](op-class-fused_ops.md) — 多阶段融合与 Phase split 模式\n- techniques/persistent_kernels.md — 状态驻留与 persistent kernel\n- techniques/tiling.md — BT/BK/BV tile 大小选择\n- techniques/data_types.md — i32→fp32 比较避免 scalar fallback\n- techniques/memory_access_optimization.md — 转置 load 合并化、跨阶段冗余 load 消除\n- techniques/compute_and_branch.md — min()/tl.cdiv 消除、标量循环→tl.dot\n- techniques/parallelism_and_loop.md — 外层循环 grid 并行化\n- techniques/performance_tuning.md — autotune 配置空间扩展\n\n## 已知实例（P3 挂载）\n\n### Extracted Kernel 反链\n- `151-fused_recurrent_gated_delta_rule_fwd_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/151-fused_recurrent_gated_delta_rule_fwd_kernel.py`）\n- `158-chunk_scaled_dot_kkt_fwd_kernel.py` — extracted kernel（source: `raw_experiences/extracted_kernels/158-chunk_scaled_dot_kkt_fwd_kernel.py`）\n- `159-chunk_fwd_kernel_o.py` — extracted kernel（source: `raw_experiences/extracted_kernels/159-chunk_fwd_kernel_o.py`）\n- `160-chunk_gated_delta_rule_fwd_kernel_h_blockdim64.py` — extracted kernel（source: `raw_experiences/extracted_kernels/160-chunk_gated_delta_rule_fwd_kernel_h_blockdim64.py`）\n\n\n", "ops/add-broadcast-alpha.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-math/tree/a6dca6d1b0c7efefff6ba699f2c025f1a6fd820b/math/add\n    role: primary\n  - url: https://gitcode.com/sijiaali/ascendc-kernelgen-data/blob/4cafd80ed5856d3b4c012c208c77c6a4a7fee290/npu_benchmark/level1/3_Add.py\n    role: example\n\n> 迁移备注：本卡由 AscendC→OKF 转化工作流（zmm_source_retrieval/ascendc_to_okf_workflow，P0~P3 产出）适配入库，分析对象为 `cann/ops-math` 仓 `math/add` 的本地快照（目录结构已与 master @a6dca6d 核对一致，行号锚点以快照为准）。status: draft / confidence: inferred，未硬件实测；P4 双盲回放验证待执行。与 [Elementwise add with a tail mask](elementwise-add.md) 分工：那卡讲 elementwise kernel 通用范式（offset 构造 + 尾块 mask + fp32 中间精度），本卡讲 GEIR Add 算子语义（广播 + alpha + dtype 组合约束）。\n\n# Add（broadcast 逐元素加 + alpha）\n\nGEIR Add：逐元素二目加 + numpy 广播（README L20-28）。**AIV-only**（TilingPrepare 取 `GetCoreNumAiv()`，add_tiling_arch35.cpp:182），kernel 侧调度器 BroadcastSch 本体不可得，但分核/BLOCK 机制已在 op_common base 库源码（`atvoss/broadcast/broadcast_tiling*.cpp`，本地快照见 `model/opbase-master-src-op_common`）确认（§4/§5）——**半壳算子**：kernel 本体是 4 路 dtype 分派壳（add.cpp:24-51），计算 DAG（add_dag.h）、aclnn 层 alpha 分解策略（aclnn_add.cpp:371-466）与 base 库 tiling 实现在仓内，是主要语义资产。benchmark 标杆为 `3_Add.py`（torch.add(x, y, alpha=alpha)）。\n\n## 1. 功能与公式（详设 §1.1）\n\n- aclnn 语义（benchmark 采用）：**out = self + alpha × other**（aclnn_add.cpp:318 起；alpha 必选标参）\n- GEIR kernel 语义：y = x1 + x2（README L24-28；无 alpha）\n- 广播：标准 numpy 规则，输出形状 = broadcast_shapes(x1.shape, x2.shape)（infershape 委托 base 库 InferShape4Broadcast，add_infershape.cpp:17-23）\n- **计算顺序：alpha 先乘 other 再加 self**（torch.add 契约），不是 (x+y)·alpha\n\n## 2. 原型与约束（详设 §2 / §2.1）\n\n### 输入输出（GEIR，add_def.cpp；⚠️ README 参数表含 INT16/FLOAT64/COMPLEX128/STRING 为文档过期，以 def.cpp + add_binary.json 为准）\n\n| 参数名 | 方向 | dtype | 约束 |\n|---|---|---|---|\n| x1 | 输入 | BF16/FP16/FP32/INT32/UINT8/INT8/INT64/BOOL/COMPLEX32/COMPLEX64 | ND，动态 rank/shape（def.cpp:24-35, 64-70） |\n| x2 | 输入 | 同 x1；跨 dtype 仅允许 FP16×FP32 / BF16×FP32 四种组合（add_tiling_arch35.cpp:37-43） | ND |\n| y | 输出 | 同 x1；mix-dtype 组合时必须是 FP32（add_tiling_arch35.cpp:60-67） | ND |\n\n属性：**GEIR 无属性**；alpha 仅存在于 aclnn 层（CheckNotNull 校验，aclnn_add.cpp:77-81；cast 合法性校验 L201-228）\n\n### aclnn 层 alpha 消化策略（alpha ≠ 1 时四路径，aclnn_add.cpp:371-466）\n\n1. alpha==1 → 直调 `l0op::Add`（mix-dtype 且 alpha==1 走 L0 混合 kernel，L352-365）\n2. `IsSupportAxpy(promoteType)` → **`l0op::Axpy(self, other, alpha)` 单 kernel 融合**（L404-421）\n3. RegBase 平台 `IsSupportAxpyV2` → alpha 张量化（L422-442）\n4. 兜底 → `Mul(other, alpha)` + `Add` **两 kernel**（L443-466）\n5. 输出统一 Cast + ViewCopy（支持非连续 out，L470-476）\n\n## 3. 规格约束（详设 §3）\n\n| 类别 | 取值 | 锚点 |\n|---|---|---|\n| 支持 NPU | GEIR 仅注册 ascend950（def.cpp:72）；README 产品表另列 A3/A2（走其他 kernel 仓） | README L6-15 |\n| dtype | 见 §2；binary 实例 13 个（add_binary.json），shape=[-2] rank 无关 | §3 |\n| format | ND，FormatAgnostic | add_binary.json |\n| 确定性 | 天然确定（无归约/无 atomic/无跨核共享） | — |\n| 交付 | aclnn（Add/Adds/AddV3/Inplace*）+ GEIR 图模式 + AICPU 兜底 | op_api/、op_graph/、op_kernel_aicpu/ |\n| workspace | GEIR kernel 无（add_tiling_arch35.cpp:143-146）；aclnn 层按需（Contiguous/Cast 中转） | §5 |\n| tilingkey | 仅 schMode 一维（add_struct.h:21-23），枚举在 base 库 | §4.1.3 |\n\n## 4. 分核策略（详设 §4.1.1 → Triton grid）\n\n- Ascend C 事实（源码锚点，op_common base 库）：coreNum = AIV 核数（add_tiling_arch35.cpp:182）；官方两级切分——UB 内切分（ubFormer/ubOuter/ubTail，broadcast_tiling.cpp:494-536）+ 核间均分 `blockFormer = ceil(fusedProduct/coreNum)`、尾核 blockTail（L565-588）；**preferMultiCore 回调**：核数占不满时按 CACHE_LINE 步长缩 BLOCK 直到铺满（L569-586）；连续输入先 DimensionCollapse 合轴、合轴后 ≤8 维（L151-269, 632-634）\n- **Triton 决策**：\n  - 任务轴：输出展平 1-D，`NUM_BLOCKS = cdiv(NUMEL, BLOCK)`\n  - 核分配范式：\n    ```python\n    pid = tl.program_id(0)\n    NUM_CORE = tl.num_programs(0)   # grid = AIV 物理核数\n    for blk in range(pid, NUM_BLOCKS, NUM_CORE):\n        ...\n    ```\n  - 语义等价说明：Ascend C「每核 blockFormer 块 + 尾核 blockTail」静态均分 ≈ Triton「grid-stride 循环 + 尾块 mask」动态轮询；preferMultiCore 策略由 autotune 小 BLOCK config 覆盖（§10-6）\n\n## 5. BLOCK / Tiling 参数（详设 §4.1.2 / §4.1.3）\n\n### tilingkey → constexpr\n\nschMode（语义已破译）：`innerKey = computeKey(恒1)×OFFSET + scheduleKey`（broadcast_tiling.cpp:604-605），scheduleKey 仅区分 UB 内轴数 ≤5（NDDMA 搬运上限）与否（100/1100，broadcast_tiling_base.cpp:28-34）——与 Triton 无关。重定义 `SAME_SHAPE: tl.constexpr`：1 = 等形直通，0 = 通用广播（stride 折算）。dtype 由指针类型推导天然分派（13 个 binary → 1 个 Triton kernel）。\n\n### BLOCK\n\nAscend C 官方推导（broadcast_tiling_base.cpp:36-45）：`maxElemNum = (ubSize - extraSize) × BITS / bufferDivisor`，按 256B 重复粒度对齐。Triton 候选 {1024, 2048, 4096, 8192}，autotune key=[\"NUMEL\", \"SAME_SHAPE\"]；UB 预算：BLOCK=8192 fp32 时 x/y/out 三 tile 96KB ≤ 192KB ✅。\n\n## 6. 片上内存预算（详设 §5）\n\n- Ascend C：全 UB 队列进出（MemCfg=LEVEL_2，add_dag.h:39/56/72/87），无 GM workspace\n- Triton：BLOCK×3 tile，中间零驻留；workspace = 0（优于 aclnn 层 Mul+Add 兜底的 GM 往返）\n\n## 7. 流水编排与 Triton 可达性（详设 §6）\n\n### 可达性判定表\n\n| Ascend C 手段 | 锚点 | 可达性 | Triton 写法 / 降级方案 | 预期影响 |\n|---|---|---|---|---|\n| BroadcastSch/DAGSch 自动排布 | base 库（调度器本体仍不可得，⚠️ inferred） | ❌ | 不需要：load→计算→store 编译器自动流水 | 无 |\n| 连续输入合轴 DimensionCollapse / 非连续 KEEP-MERGE-ABSORB 计划（broadcast_tiling.cpp:151-333, 344-492） | op_common 源码 | ✅ 语义替代 | wrapper 侧 `expand` + stride 折算天然覆盖（等形 case 合轴后 = SAME_SHAPE 直通）；Triton 无需显式合轴 | 无 |\n| CopyInBrc 广播 DMA 展开 | base 库 | ❌→替代 | expand-stride 地址折算（§8 骨架） | 等价；最内维 stride=0 的重复 load 有带宽浪费风险，见 §10 优化项 |\n| Contiguous 中转 | aclnn_add.cpp:358-364 | ❌→不需要 | wrapper 断言连续（benchmark 输入天然连续） | 少一次 GM 拷贝 |\n| Cast/ViewCopy 输出中转 | aclnn_add.cpp:470-476 | ❌→不需要 | 直写 out | 少一次 GM 拷贝 |\n| aclnn 四策略分解（Mul+Add 两 kernel） | aclnn_add.cpp:443-466 | ❌→不需要 | alpha 融为 runtime 标量，单 kernel | 少一次 GM 往返，优于兜底路径 |\n| AddWithCastCompute 的 fp32 提升 + RTNE | add_dag.h:48-51 | ✅ | `.to(tl.float32)` → 计算 → `.to(out_dtype)`（RTNE 为默认舍入） | 等价 |\n\n### 广播坐标折算（通用路径核心）\n\n输出连续 ⇒ 线性 offs 逐维 div/mod 分解坐标，按各输入 expand 后 stride 折算：`in_off = Σ_d coord_d · in_stride_d`（广播维 stride=0 自动复用）。最内维 out stride=1。≤4 维（benchmark 域），扩维加 stride 参数对 + 静态分支。\n\n## 8. Triton 骨架（生成用伪码）\n\n完整骨架见 `output/add/triton_skeleton.py`（转化工作流产出目录）。核心结构：\n\n```python\n@triton.autotune(configs=[BLOCK ∈ {1024,2048,4096,8192}], key=[\"NUMEL\", \"SAME_SHAPE\"])\n@triton.jit\ndef add_kernel(x_ptr, y_ptr, out_ptr, alpha, NUMEL,\n               xs0..xs3, ys0..ys3, os0..os2,          # expand 后 stride + out 外维 stride\n               NDIM: tl.constexpr, SAME_SHAPE: tl.constexpr, BLOCK: tl.constexpr):\n    for blk in range(pid, NUM_BLOCKS, NUM_CORE):\n        offs = blk * BLOCK + tl.arange(0, BLOCK);  mask = offs < NUMEL\n        if SAME_SHAPE:  x_off = y_off = offs\n        else:           # 逐维 div/mod 分解坐标 → stride 折算（broadcast 维 stride=0）\n        x = tl.load(x_ptr + x_off, mask=mask);  y = tl.load(y_ptr + y_off, mask=mask)\n        res = x.to(tl.float32) + alpha * y.to(tl.float32)   # fp32 中间 + alpha 先乘 y\n        tl.store(out_ptr + offs, res.to(out_ptr.dtype.element_ty), mask=mask)\n```\n\nwrapper 要点：grid=AIV 物理核数；`out_shape = torch.broadcast_shapes(x.shape, y.shape)`；`xe = x.expand(out_shape)` 取 stride；等形（含 1D）走 SAME_SHAPE=1 展平直通；断言同 dtype ∈ {fp32, fp16, bf16} + contiguous；alpha 经 `float(alpha)` 传入。\n\n## 9. 精度标杆与验收（详设 §测试设计）\n\n- **标杆**：benchmark `3_Add.py` torch golden（`torch.add(x, y, alpha=alpha)`，L68）+ evaluator 默认阈值（correctness.py:34-39）：fp32 rtol=2⁻¹⁰/atol=2⁻¹⁶/max_abs 1e-2；fp16 2⁻⁹/2⁻⁹/1e-1；bf16 2⁻⁶/2⁻⁶/1.0；性能标杆 = evaluator 实测参考\n- **验收域 = 3_Add.json 41 条 case**：\n  - 广播形态：1D/2D/3D 等形、[M,1]/[1,N]/[N] 单向广播、4D×2D 尾维广播、[1,C,1,1] 逐通道广播、大 2D [4096,8192]/[8192,4096]（后两者 + 等形是性能关键 case）\n  - dtype：fp32/fp16/bf16 同型（Ascend C dtype 域子集，无风险）\n  - **alpha 大量 ≠1**（0.5/2/-1/1.5/3/0.25/-0.5）——必须融合进 kernel，不得依赖 aclnn 式两 kernel 分解\n- **输入值域（精度风险点）**：偶数 case x~N(μ∈[-100,100], σ∈[1,25])（大数值，fp16/bf16 与 golden 同溢出行为），奇数 case x~U(-5,5)，y~randn；alpha·y 与 x 叠加 → **fp32 中间精度必选**（对齐 add_dag.h AddWithCastCompute）\n- 公式与 golden 已核对：alpha 先乘后加顺序、广播规则、RTNE 回写均一致\n- 扩展参考（非验收域）：ST csv 的异 rank 高维（6~8 维）、(1,) 标量广播、625 万 1D；int/complex/bool 形态\n- 源码未附标杆脚本；benchmark 侧 torch golden 即标杆\n\n## 10. Agent actions（生成指引）\n\n1. 识别类别：纯广播 elementwise，AIV-only，无 tl.dot、无归约；单输出。\n2. 分核：输出展平 1-D + BLOCK grid-stride 循环，grid=物理核数（§4 范式）；尾块 mask。\n3. **必须保留的语义点**：fp32 中间精度 + RTNE 回写（fp16/bf16 case）；`alpha·y + x` 顺序；广播坐标按 expand-stride 折算。\n4. **不要复刻**：aclnn 四策略分解（一律单 kernel 融合 alpha）、Contiguous/Cast/ViewCopy 中转、schMode 分派。\n5. SAME_SHAPE=1 直通路径必须保留（大 2D case 性能关键，零整数除法）；通用路径整数 div 每元素每维一次，带宽-bound 下可接受。\n6. **preferMultiCore 语义**：BLOCK 初选偏大导致核数占用不足时，优先降 BLOCK（对齐 base 库 broadcast_tiling.cpp:569-586 的官方策略），autotune 会自动完成，但手工定 BLOCK 时须遵守。\n7. 优化项（非语义）：最内维 stride=0 的输入（[M,1] 型）按通用路径重复 load 同地址——可改为加载 1 宽最内 tile + tl.broadcast_to 省带宽；benchmark 通过后再做。\n8. dtype 不做 constexpr 分支：指针类型推导 + `.to(tl.float32)` 统一路径覆盖 fp32/fp16/bf16。\n9. 验收按 §9：41 条 case 全过 + 大数值 case 精度达标；勿引入归约/atomic。\n\n## 11. 复现性声明\n\n本卡由 Ascend C 源码静态分析转化（confidence: inferred），锚点指向 `math/add/`（cann/ops-math 本地快照，结构已核对与 master @a6dca6d 一致），分核/BLOCK 事实补充自 op_common base 库源码（本地快照 `model/opbase-master-src-op_common/src/op_common/atvoss/broadcast/`，2026-09-03）。未经硬件实测的点：BLOCK 最优值、通用广播路径 div/mod 相对直通路径的实际开销、广播重复 load 的带宽影响。残留不确定项：kernel 侧 BroadcastSch 调度器本体（op_common 拷贝未含）与 broadcast_tiling.h 头文件（CACHE_LINE 等常量值从 .cpp 反推）、aclnn 层 Axpy dtype 清单（外部常量）。验收标杆已对齐 NPUKernelBench level1（3_Add.py，41 case，含 alpha≠1 与大数值输入域）。回放验证：未做（P4 待执行，报告将补至转化工作流 `output/add/validation_report.md`）。\n\n\n", "ops/apply-rotary-pos-emb.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/posembedding/apply_rotary_pos_emb\n    role: primary\n  - url: https://gitcode.com/cann/ops-transformer/blob/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/posembedding/apply_rotary_pos_emb/examples/test_aclnn_apply_rotary_pos_emb_v2.cpp\n    role: example\n\n> 迁移备注：本卡由 AscendC→OKF 转化工作流（zmm_source_retrieval/ascendc_to_okf_workflow，P0~P3 产出，过程产物在 `output/apply_rotary_pos_emb/`）适配入库，分析对象为 `cann/ops-transformer` 仓 `posembedding/apply_rotary_pos_emb` 的本地快照（@d28d8f9，行号锚点以快照为准）。**P4 双盲回放已通过（2026-09-08，confidence: verified）**：三组对照 45/45 全过，终点单调——直给卡 4.2060x > KB 检索 3.5789x > 无知识 3.1749x；实测修订已回流本卡（§7 interleave 定局、§8 骨架改 P4 收敛结构且**自包含**、§10 勿复刻清单更正）。与 [RMSNorm-RoPE fused kernel](rmsnorm-rope.md) / [RoPE paired-channel pointer addressing](rope-pointer-addressing.md) 分工：那两张是 910B 单算例的 RoPE 融合/寻址经验卡（interleave 单模式），本卡是 ApplyRotaryPosEmb 算子的全规格语义卡——三旋转模式 × 四布局 × 广播 × partial rope 的完整定义域，以及「4 tilingkey/3 kernel 类 → 单 Triton kernel」的多路径合并论证。\n\n# ApplyRotaryPosEmb（旋转位置编码，q/k 双路融合原地更新）\n\n对 query、key 两路执行 RoPE：`out = x·cos + rotate(x)·sin`，rotate 结构由 rotary_mode 决定（half/interleave/quarter）；推理网络为省一次 launch 将两路融合（README.md:18）。**AIV-only 纯向量**（arch35 入口 AIC 直接 return，apply_rotary_pos_emb_apt.cpp:31；legacy 入口 `KERNEL_TYPE_AIV_ONLY`，apply_rotary_pos_emb.cpp:24），无 Cube/规约/atomic。**非壳算子**：tiling×5 + kernel×7 全部本体在仓内。arch35（ascend950）为主线：4 个 tilingkey（20010/20011/20020/20030）对应 3 个 kernel 类，**计算数学完全相同**（共享 common.h 的 Half/Quarter/Interleave VF），差异仅在循环结构与 cos/sin 广播处理——Triton 侧据此收敛为**单 kernel + constexpr**。legacy（910b/910_93/310p/kirin）为另一套（key 1/3/4，layout 仅 BSND/TND、D∈{64,128}、rotary 仅 half），见 §3 架构差异。语义分层：aclnn V1 = V2 锁 rotary_mode=\"half\"（aclnn_apply_rotary_pos_emb.cpp:27-29），无其他参数消化；benchmark 已有精确 case（ascendc-migration/level2/5_ApplyRotaryPosEmb，§9）。\n\n## 1. 功能与公式（详设 §1.1）\n\n- 功能：RoPE 旋转位置编码，q/k 双路融合、原地更新语义（输出与输入同名同形）。\n- 计算公式（README.md:19-136）：`q_embed = query·cos + rotate(query)·sin`，`k_embed = key·cos + rotate(key)·sin`；cos/sin 的 N 维恒为 1（同层所有 head 共享一组旋转角），B 维可广播（CosB∈{qB,1}），末维 realDim ≤ D（partial rope：仅前 realDim 维旋转，[realDim, D) 直通，tiling_base_arch35.cpp:319）。\n\n  | rotary_mode | rotate(x) 定义 | 逐元素展开（pair 索引 i） |\n  |---|---|---|\n  | half（默认） | cat(−x₂, x₁)，x₁/x₂ 为前后半场 | out[i]=x[i]·c[i]−x[i+h]·s[i]；out[i+h]=x[i+h]·c[i+h]+x[i]·s[i+h]，h=RD/2 |\n  | interleave | 奇偶对 (x[2i],x[2i+1])→(−x[2i+1],x[2i]) | out[2i]=xe·ce−xo·se；out[2i+1]=xo·co+xe·so |\n  | quarter | cat(−x₂,x₁,−x₄,x₃)，四等分 | 段内同 half：段 1↔2、3↔4，q=RD/4 |\n\n  展开式已与 kernel VF 逐行核对一致（half：common.h:111-119；quarter：common.h:193-209；interleave：common.h:270-280）。\n- **语义分层**：GEIR kernel 本体 = 上式（layout/rotary_mode 是编译期分派维度，不进数据流）；aclnn 层 V1=V2 锁 half，无参数消化；benchmark 层已有精确 case（45 case，定义域 ⊆ 算子定义域，无超集偏差，§9）。\n- 计算流程概述（以 ABAAndBA 为例，aba_and_ba.h:168-244）：S 轴 ubFactorS 步进 → B 轴循环（BA 广播时 cos/sin 载一次复用）→ 先 QN 全循环后 KN → 每块 CopyIn（LoopModeParams 多维跨步 DMA）→ Compute（VF，fp32 Reg 域）→ CopyOut。\n- 锚点：`op_kernel/arch35/apply_rotary_pos_emb_common.h:66-328`（三模式 VF）、`apply_rotary_pos_emb_apt.cpp:35-59`（key 分派）。\n\n## 2. 原型与约束（详设 §2 / §2.1）\n\n### 输入输出（来源：`op_host/apply_rotary_pos_emb_def.cpp:27-52`）\n\n| 参数名 | 入参类型 | 必选性 | dtype | format | shape | 语义 |\n|---|---|---|---|---|---|---|\n| query | 输入 | 必选 | FP16 / FP32 / BF16（310p/kirin 仅 FP16/FP32） | ND | 4 维（TND 3 维） | 主输入 |\n| key | 输入 | 必选 | 同 query | ND | 与 query 仅 N 维可不同（QN vs KN） | 主输入 |\n| cos | 输入 | 必选 | 同 query | ND | N 维=1、B 维∈{qB,1}、末维 realDim≤qD | 旋转角余弦 |\n| sin | 输入 | 必选 | 同 query | ND | 与 cos 完全相同 | 旋转角正弦 |\n| query | 输出 | 必选 | 同输入 | ND | 与输入 query 相同 | 原地语义输出 |\n| key | 输出 | 必选 | 同输入 | ND | 与输入 key 相同 | 原地语义输出 |\n\n四输入均 AutoContiguous（def.cpp:32-50）。\n\n### 属性\n\n| 属性 | 类型 | 默认值 | 语义 |\n|---|---|---|---|\n| layout | int 可选 | 1 | 1=BSND、2=SBND、3=BNSD、4=TND（def.cpp:53；tiling.h:139-144） |\n| rotary_mode | string 可选 | \"half\" | \"half\"/\"interleave\"/\"quarter\"（def.cpp:54；校验 tiling_base_arch35.cpp:236-238） |\n\n### 原型约束（arch35，tiling_base_arch35.cpp）\n\n- shape 关系：cos==sin shape；cos/sin N 维==1；q/k/cos/sin S 维一致；cosD≤qD、kD≤qD；非 TND 时 kB==qB 且 cosB∈{qB,1}；q/k 输出与输入同形（L158-207）；所有维度为正（L120-140）。\n- rotary 约束：**D≤1024**；half/interleave 要 D%2==0；quarter 要 D%4==0（L142-156，D_LIMIT=1024 L33）。\n- dtype：六 tensor 全同型，全集 {F32, BF16, F16}（L233-259）。\n- infershape：输出 = 输入与 cos/sin 广播对齐；BroadcastDim 放行 dim1>dim2 即 partial rope 包容（infershape.cpp:52-54, 116-125）。\n- **文档/实现偏差**：docs V2 称支持空 tensor，但 arch35 tiling 拒绝非正维度（L120-140）——以实现为准。docs V2 内部亦自相矛盾：q/k 行写「不支持空 Tensor」而 cos/sin 行写「支持空 Tensor」（aclnnApplyRotaryPosEmbV2.md 参数表），进一步印证以实现为准。\n- **legacy D∈{64,128} 的根因**（docs V2 `ub_required` 公式，aclnnApplyRotaryPosEmbV2.md 约束节）：legacy kernel 把 q/k 全部 head 的整行同时驻留 UB，`ub_required ≈ (q_n+k_n)·lastDim·castSize·2 + …`；tiling.cpp:195-200 的硬编码检查是该公式的保守上界。arch35 改按 ubFactor 循环后此约束消失（D≤1024）。\n\n## 3. 规格约束（详设 §3）\n\n| 类别 | 取值 | 来源锚点 |\n|---|---|---|\n| 支持 NPU 型号 | ascend950（arch35 主线）；910b/910_93（legacy）；310p/kirinx90/kirin9030（legacy，dtype 裁剪 FP16/FP32） | def.cpp:62-109；config/ 7 平台目录 |\n| dtype 全集 | FP16/FP32/BF16（310p/kirin 无 BF16） | def.cpp:20-21 vs 76-106 |\n| format | ND（AutoContiguous） | def.cpp:27-50 |\n| 确定性计算 | 是（无规约/atomic；16MB workspace 仅系统保留，kernel 数据流不使用） | tiling_ab_arch35.cpp:21、apt.cpp 未读 workspace |\n| 交付形式 | aclnn V1/V2 + GEIR | op_api/；examples/ |\n\n### 架构差异（arch35 vs legacy）\n\n| 维度 | arch35（ascend950，本卡主线） | legacy（910b/910_93/310p/kirin） |\n|---|---|---|\n| kernel 文件 | apt.cpp + arch35/{common,ab,bab,aba_and_ba}.h | apply_rotary_pos_emb.cpp + {base,small,compute_ab,compute_ab_cast}.h |\n| tiling 体系 | Regbase 模板注册（优先级 10000 AB → 20000 ABA/BA → 30000 BAB → 40000 legacy 兜底，小者先尝试） | 单 tiling 类（tiling.cpp，注册优先级 40000；非 regbase 平台实际命中它） |\n| tilingkey | 20010(ABA)/20011(BA)/20020(BAB)/20030(AB) | 1(SMALL)/3(AB)/4(AB_CAST) |\n| layout | 全 4 种 | 仅 BSND/TND（tiling.cpp:188） |\n| D 约束 | ≤1024，%2/%4 | **必须 ∈{64,128}**（tiling.cpp:195-200） |\n| rotary_mode | half/interleave/quarter | 仅 half（kernel 无模式分支） |\n| BF16 | 原生（VF Load/Store 转 fp32） | 计算类型 float 模板参 + CAST_ROUND 回写（apply_rotary_pos_emb.cpp:52-62；compute_ab_cast.h:250-284） |\n| 其他 | qkcNum 无上限 | qkcNum≤255（Mul repeatTimes uint8，tiling.cpp:306-308） |\n\n## 4. 分核策略（详设 §4.1.1 → Triton grid 设计）\n\n- Ascend C 事实：三模板分核轴不同——AB 把 BS 打平 `blockFactor=CeilDiv(bs,coreNum)`（tiling_ab_arch35.cpp:69-71）；ABA/BA 按 B×S 二维分核（整除优先单轴、否则双方案比选，tiling_aba_and_ba_arch35.cpp:80-135）；BAB 同构但比选乘 ubFactorS（tiling_bab_arch35.cpp:105-149）。kernel 内均以 ubFactor 步进循环（如 aba_and_ba.h:168-178）。\n- **Triton 决策**：\n  - 任务轴选择：**行（row = 一个 (b,s,n) 位置的 D 维向量）**。rope 只耦合行内 D 维配对，行间完全独立——三种源码分核轴都是行空间的不同切法，行是公共子结构。rows = B×S×N（每路）。\n  - 任务块总量公式：`NUM_BLOCKS = CeilDiv(rows, BLOCK_ROWS)`；**grid = min(NUM_BLOCKS, vector_core_num)**（persistent-core，NPU 上超额 block 串行排队，勿用裸 NUM_BLOCKS grid）。\n  - 核分配范式（persistent-core + 核内连续段循环，与源码「每核 blockFactor 连续段 + 核内 ubFactor 循环」同构）：\n\n    ```python\n    pid = tl.program_id(0); num_progs = tl.num_programs(0)\n    total_blocks = tl.cdiv(rows, BLOCK_ROWS)\n    per_prog = tl.cdiv(total_blocks, num_progs)\n    for blk in range(pid * per_prog, tl.minimum((pid + 1) * per_prog, total_blocks)):\n        row = blk * BLOCK_ROWS + tl.arange(0, BLOCK_ROWS)   # 连续行段\n        row_m = row < rows                                   # 尾块统一 mask\n        n = row % N; s = (row // N) % S; b = row // (N * S)  # 行号→(b,s,n)\n    ```\n\n  - 行号解码的物理布局由 strides 吸收（§5），与 layout 无关；核数动态读 `torch_npu.npu.npu_config`，禁硬编码。\n  - Q/K 两路：**两次 launch**（共享 kernel）——P4 实测融合单 launch 反而劣化（4.2060→3.8252）；cos/sin 体量 S×RD（KB 级），第二次 launch 全命中 L2，替代了源码「先 Q 后 K 复用 cos/sin UB」（aba_and_ba.h:214-234）与「Q/K 跨界块拼接」（ab.h:142-161）两个机制——两者均勿复刻。\n  - **核内循环结构（P4 实测收敛，优于逐行打平）**：以 (b,s) 组为外循环、组内 n 行展开为 tile——`for bs in ...: cos/sin 载一次（标量 c_base）；x tile [BLOCK_N, BLOCK_DH]`。理由：cos/sin 在组内恒等，逐行重载实测慢一倍（循环不变量外提单点 +100%，2.0956→4.2060）；且 bs 为**标量**循环使行解码退化为标量 div/mod，规避了「向量 div/mod × 特定访存模式」的后端缺陷面（§7 ⚠️）。BLOCK_N = next_pow2(N)（N≤128 时单 tile 覆盖整组）。\n\n## 5. BLOCK / Tiling 参数（详设 §4.1.2 / §4.1.3）\n\n### Ascend C tilingdata → Triton 超参映射\n\n| tilingdata 字段 | 语义 | host 侧计算式 | Triton 对应 | 候选值/推导式 |\n|---|---|---|---|---|\n| realDim / D | 旋转维 / 头维 | SetBsnd 按 layout 抽取（tiling_base L284-320） | `RD` 形参；D 不进 kernel | RD≤1024 |\n| dSplitCoef∈{2,1,4} | 模式切分系数 | ConvertRotaryMode（L270-282） | 配对宽 `pair`：half/interleave=RD/2、quarter=RD/4 | wrapper 计算传入 |\n| dAlign | 32B 对齐行宽 | CeilAlign(RD/coef, 32B/sizeof(T))×coef（tiling_ab L68） | `BLOCK_DH: tl.constexpr` | `next_pow2(pair)` |\n| ubFactorS/B/QN/KN | 核内 UB 切分 | UB 预算反解（tiling_aba L137-185；tiling_bab L151-181；tiling_ab L73-85） | `BLOCK_N: tl.constexpr`（(b,s) 组内 n 行 tile 宽） | `next_pow2(N)`；N>128 时固定 128 + 内层循环 |\n| blockNumB/S 等 | 分核 | 见 §4 | 不需要（persistent-core 隐式覆盖） | — |\n| isPartialRope | realDim≠D | L319 | wrapper：`out=x.clone()` 保底直通段，kernel 只写 [0,RD) | RD==D 走 empty_like 快路径 |\n| layout | 属性 | — | 不进 kernel；wrapper 按 layout 取 (stride_b, stride_s, stride_n)（TND 时 B=1、stride_b=0） | 直接读 tensor.stride() |\n| CosB | cos/sin B 维 | — | `stride_cb`：CosB==1 → 0（广播退化为寻址） | wrapper 判定 |\n\n### tilingkey / 模板分支 → constexpr\n\n| tilingkey / 分支 | 分支语义 | Triton 处理 |\n|---|---|---|\n| 20010(ABA)/20011(BA)/20020(BAB)/20030(AB) | 循环结构 + cos/sin 广播策略（计算数学相同） | **合并为单 kernel**：广播 → stride_cb=0；循环结构差异 → persistent-core 行循环吸收 |\n| rotaryMode∈{1,2,3} → Half/Interleave/QuarterVF | 三种配对数学 | `ROTARY_MODE: t

optimization_points:
- vectorized_non_interleaved_path: For non-interleaved data layouts, the kernel constructs
    dimension ranges using tl.arange to process the entire head dimension block in
    a single pass. This eliminates loop overhead and maximizes vector unit utilization
    compared to the scalar iteration used in the interleaved path.
- 3d_tiling_strategy: The kernel employs a 3D tiling strategy (BLOCK_N for tokens,
    BLOCK_H for heads, BLOCK_D for dimensions). This maps the computation efficiently
    to the hardware grid, ensuring data loaded into registers/SRAM is reused before
    eviction, optimizing memory bandwidth usage.
- layout_specific_optimization: By using a compile-time constant (rotary_interleaved),
    the kernel generates specialized code paths. The interleaved path handles element-wise
    pairs via a loop, while the non-interleaved path leverages bulk vector operations,
    ensuring optimal performance for both common tensor formats without runtime divergence.
performance_boost: 25%
note: The performance relies heavily on the BLOCK_D size matching the hardware's vector
  width. The helper function rotary_embedding_rw_kernel is assumed to handle the actual
  load/store and arithmetic operations.

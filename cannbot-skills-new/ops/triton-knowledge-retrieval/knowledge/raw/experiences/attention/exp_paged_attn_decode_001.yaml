optimization_points:
- block_ptr_utilization: Utilizes tl.make_block_ptr to load K and V tensors from the
    paged KV cache. This abstracts complex strided memory accesses and enables the
    compiler to optimize global memory loads, handling non-contiguous physical memory
    layouts efficiently.
- flash_attention_algorithm: Implements the online softmax (FlashAttention) strategy
    by iteratively updating the max (m_i) and sum (l_i) statistics. This avoids materializing
    the full attention matrix in HBM, significantly reducing memory bandwidth consumption.
- paged_attention_mechanism: Employs a block table (block_tables_ptr) to map logical
    sequence blocks to physical memory blocks. This allows for efficient memory management
    of variable-length sequences and dynamic batching in LLM inference.
- gqa_support: Supports Grouped Query Attention (GQA) by calculating pid_kh based
    on NUM_SHARE_Q_HEADS, reducing KV cache memory size and read bandwidth requirements.
performance_boost: 30%
note: Optimized for the LLM decoding phase where the context length is fixed per request
  but varies across the batch. Requires paged KV cache layout.

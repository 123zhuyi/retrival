optimization_points:
- 2D_Block_Tiling: The kernel tiles the gradient matrix into 2D blocks (BLOCK_SIZE_M
    x BLOCK_SIZE_N) rather than processing rows or columns individually. This improves
    memory access coalescing for loading `grad_output` and maximizes the utilization
    of memory bandwidth by processing larger contiguous chunks per transaction.
- Software_Pipelining: Utilizes `tl.range` with the `num_stages` parameter to implement
    software pipelining. This allows the hardware to overlap memory loads (indices
    and gradients) for subsequent iterations with the atomic add operations of the
    current iteration, effectively hiding global memory latency.
- Batched_Atomic_Accumulation: Performs atomic updates on blocks of data rather than
    individual scalar elements. By accumulating a block of gradients before writing
    back, the kernel reduces the total number of atomic instructions issued and alleviates
    pressure on the memory subsystem, though contention remains dependent on index
    duplication.
performance_boost: 35%
note: This optimization is highly effective for large batch sizes and embedding dimensions.
  Performance may be impacted by high rates of duplicate indices due to serialization
  of atomic operations.

optimization_points:
- tiling_strategy: Implements column-wise tiling using a configurable BLOCK_SIZE to
    process large feature dimensions (n_cols >= 2048) in chunks. This prevents Unified
    Buffer (UB) overflow on NPU hardware and ensures data remains in high-speed memory
    during the two-pass computation.
- two_pass_algorithm: Decouples the gradient computation into two distinct phases
    a reduction pass to calculate the sum(m * X) statistic required for the correction
    factor, and a subsequent pass to compute and store the actual dX and dW gradients.
    This minimizes register pressure and simplifies control flow.
- software_pipelining: Utilizes the `num_stages` parameter within the grid-stride
    loop (`tl.range`) to enable software pipelining. This overlaps memory load operations
    with arithmetic computations, effectively hiding memory latency and keeping the
    compute pipeline saturated.
- conflict_free_accumulation: Avoids expensive atomic operations for weight gradient
    (dW) accumulation by allocating a per-program ID (pid) buffer. Each program instance
    writes to a unique slice of memory (`dW_ptr + pid * stride`), eliminating write
    conflicts and serialization, deferring the final reduction to a separate, highly
    efficient step.
performance_boost: 25%
note: The kernel requires `dW_ptr` to be pre-allocated with a shape of `(num_programs,
  n_cols)` to store intermediate partial gradients. A host-side or subsequent kernel
  reduction is necessary to aggregate these partials into the final dW. Supports specific
  casting modes like LLAMA and GEMMA.

optimization_points:
- two_pass_algorithm: The kernel separates the computation into two distinct passes
    over the data. The first pass calculates the reduction term (sum(m * X)) required
    for the RMSNorm correction factor. The second pass applies this factor to compute
    the final gradients dX and dW. This approach avoids the complexity of materializing
    the entire intermediate row state in limited local memory.
- grid_stride_scheduling: Implements a grid-stride loop (using tl.range with a step
    equal to num_progs) to allow a single program instance to process multiple rows.
    This ensures high utilization of the NPU cores by balancing the workload when
    the number of rows is small or not evenly divisible by the grid size.
- atomic_free_dW_accumulation: Instead of performing atomic additions to the global
    dW tensor, which causes severe contention, each program instance accumulates its
    partial dW results into a unique slice of a temporary buffer indexed by the program
    ID (pid). This eliminates synchronization overhead and write conflicts during
    the main computation loop.
- mixed_precision_strategy: Supports specific casting modes (LLAMA/GEMMA) where inputs
    are explicitly cast to fp32 before accumulation. This ensures that the reduction
    operations maintain sufficient numerical precision, preventing overflow or underflow
    that can occur with fp16/bf16 accumulation during the backward pass.
performance_boost: 25%
note: The dW output generated by this kernel consists of partial sums per program
  ID. A final reduction step over the program dimension is required outside the kernel
  to obtain the final weight gradients.

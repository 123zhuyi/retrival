optimization_points:
- dynamic_block_sizing: The heuristic adjusts BLOCK_SIZE_M based on n_cols to maintain
    a constant tile area (~4096 elements), optimizing L1/L0 cache utilization and
    register pressure regardless of the hidden dimension size.
- operator_fusion: Fuses the RMSNorm backward pass with the addition of the residual
    gradient (dS_out), reducing global memory read/write operations by avoiding an
    intermediate kernel launch.
- register_accumulation: Accumulates the weight gradient (dW) in a register-level
    float32 buffer (dW_acc) across all processed rows, writing to global memory only
    once per program ID to minimize memory bandwidth.
- grid_stride_scheduling: Implements a grid-stride loop for row processing, ensuring
    efficient load balancing across GPU/NPU cores even when the number of rows is
    not perfectly divisible by the block size.
performance_boost: 25%
note: Supports specific casting modes (LLAMA, GEMMA) to handle mixed precision requirements.
  The heuristic ensures robustness across varying sequence lengths and hidden sizes.

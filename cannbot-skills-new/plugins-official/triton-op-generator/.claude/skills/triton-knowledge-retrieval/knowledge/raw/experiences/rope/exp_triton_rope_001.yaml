optimization_points:
- vectorized_chunked_processing: The kernel explicitly calculates offsets for the
    first and second halves of the head dimension (`first_half_q_offsets`, `second_half_q_offsets`)
    based on the `IS_NEOX_STYLE` flag. This enables loading contiguous blocks of memory
    for the rotation calculation, maximizing memory bandwidth utilization and allowing
    the compiler to generate efficient SIMD instructions for the `x1*cos - x2*sin`
    operations.
- padded_access_with_masking: The kernel utilizes padding parameters (`pad_n_qh`,
    `pad_rope_dim`) to calculate static, aligned memory offsets for vectorized loads.
    It simultaneously applies runtime masks (`first_q_mask`, `cos_mask`) to handle
    cases where the actual dimensions are smaller than the padded block size. This
    strategy ensures memory access alignment for performance while maintaining correctness
    for arbitrary tensor shapes without expensive global memory re-padding.
- loop_tiling_over_tokens: The kernel employs a grid-stride loop (`tl.range`) over
    the `num_tokens` dimension, allowing a single kernel launch to process the entire
    sequence. This significantly reduces kernel launch overhead compared to launching
    a separate kernel instance for each token or head, and improves data locality
    by keeping cos/sin values in registers/cache across head iterations.
performance_boost: 25%
note: Supports both Neox-style (chunked) and non-Neox-style (interleaved) RoPE, as
  well as partial RoPE application where rope_dim < head_dim. It also handles both
  pre-computed cos/sin tensors and position-indexed lookups.

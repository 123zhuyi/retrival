optimization_points:
- fused_lse_reduction: The current implementation performs three separate reduction
    loops over the vocabulary dimension V to calculate the LogSumExp for new, ref,
    and old logits. These loops should be fused into a single loop. This reduces loop
    control overhead and improves data locality by processing the same vocabulary
    indices for all three tensors simultaneously, allowing for better utilization
    of memory bandwidth.
- vectorization_alignment: The BLOCK_SIZE_V should be tuned to align with the hardware's
    memory burst length (e.g., 128 bytes). For fp16/bf16 data, this typically means
    a block size of 64 elements. This ensures that all memory accesses are fully coalesced,
    minimizing the number of memory transactions.
- ilp_optimization: Within the fused reduction loop, utilize Instruction Level Parallelism
    (ILP) by interleaving the load operations of the current vocabulary chunk with
    the arithmetic operations (exp, max, sum) of the previous chunk. This helps hide
    the latency of global memory accesses behind compute operations.
performance_boost: 25%
note: This optimization is critical for large vocabulary sizes (e.g., V=32k or 128k)
  where the kernel is memory-bandwidth bound. Fusing the loops reduces the total number
  of memory loads required for the reduction phase.

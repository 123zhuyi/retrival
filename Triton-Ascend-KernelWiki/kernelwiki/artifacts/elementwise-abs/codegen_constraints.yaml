## Triton Mapping

| CANN | Triton | Notes |
|------|--------|-------|
| `ElementwiseSch` | `@triton.jit` kernel | CANN's DAG pipeline → sequential Triton ops |
| `Vec::CopyIn` | `tl.load(..., mask=mask)` | Tail mask required |
| `Vec::Cast<A,B>` | `x.to(dtype)` | Explicit dtype conversion |
| `Vec::Abs` | `tl.abs(x)` | Direct |
| `Vec::CopyOut` | `tl.store(..., mask=mask)` | Tail mask required |
| `KERNEL_TYPE_AIV_ONLY` | Default Triton Ascend | Vector core mapping |
| `TILING_KEY` | `if dtype == ...` dispatch | Triton uses compile-time dtype |
| Workspace | N/A | Triton manages temporary memory internally |
| Non-contiguous tensor | Pointer + stride + mask | Triton `tl.load` supports arbitrary strides |

## Codegen Guidelines

1. **Always generate tail mask**: `mask = offsets < n_elements`
2. **BF16 always needs FP32 intermediate**: cast before and after abs
3. **Complex abs requires interleaved layout**: each complex element = 2 storage slots
4. **Complex64 abs needs numerical stability** for large/small values
5. **Complex32 abs can use simpler `sqrt(sum_sq)`** path
6. **UINT8/BOOL are identity operations**: passthrough (no abs needed)
7. **Output shape always equals input shape**: no broadcasting in this op
8. **Platform check is required**: not all dtypes available on all platforms
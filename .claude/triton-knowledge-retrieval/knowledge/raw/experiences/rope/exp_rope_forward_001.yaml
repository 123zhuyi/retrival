optimization_points:
- dynamic_specialization: Uses `do_not_specialize=["seq_len"]` to prevent kernel recompilation
    for varying sequence lengths, significantly reducing launch overhead in dynamic
    batching scenarios.
- memory_alignment_handling: Implements an `ALIGNED` path that loads the full RoPE
    dimension in a single vectorized load, and a fallback path for unaligned dimensions,
    ensuring maximum memory bandwidth utilization regardless of tensor layout.
- grid_stride_scheduling: Employs a grid-stride loop (`for block_id in range(pid,
    total_blocks, grid_size)`) to map a fixed number of thread blocks to a variable
    number of sequence blocks, maintaining high hardware occupancy.
- efficient_masking: Combines sequence validity masks with head and dimension masks
    to perform safe loads/stores for variable-length sequences and KV caches without
    expensive branching.
performance_boost: 25%
note: Optimized for LLM inference with variable length sequences and KV cache support.
  Handles both contiguous and non-contiguous memory layouts for RoPE dimensions.

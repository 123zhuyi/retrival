p_fused_attention_002` — 内存优化+数值稳定优化 （收益 50%）\n  - 适用于大序列长度（seq_len≥1024）的Attention计算，分块计算减少内存占用（从O(S²)降至O(S)），在线Softmax提升数值稳定性，910b2/910b3硬件上性能提升显著\n\n\n", "runbooks/memory-sram/exp_attn_sinks_001.md": "\n\n## Memory Access Optimization: online softmax\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2/910b3/91093/91095，fp16/bf16，D ≥64，分页存储 + 预计算 sink 分数；失效边界：sink 分数未预计算或序列短到无需滑窗时，sink 集成逻辑成为纯开销；非分页的连续 KV 存储场景 block_table 间接寻址无收益）\n\n### 原则\n- **online softmax**：Implements the 在线 softmax algorithm within the main loop. By iteratively updating the maximum value (history_max) and the normalization sum (l) using the 're_scale' factor, the kernel avoids materializing the large N x N attention matrix in high-bandwidth memory (HBM), significantly reducing memory access overhead.\n- **paged attention**：Utilizes a block table mechanism (block_tables) to map logical page indices to physical memory blocks. This allows the kernel to efficiently handle non-contiguous KV cache storage, which is essential for managing variable-length sequences and dynamic memory allocation in LLM inference without memory fragmentation.\n- **attention sinks integration**：Explicitly loads pre-computed attention scores for 'sink' tokens (the first few tokens of a sequence) and incorporates them into the online softmax statistics. The sink scores are initialized into history_max and l, and later re-scaled and added to the final accumulator, ensuring generation stability even when using sliding windows.\n- **sliding window optimization**：Calculates the start page (start_page_num) and start KV length (start_kv_len) based on the sliding_window_size. The kernel applies a mask (mask_page) to ignore tokens outside the sliding window, thereby reducing the number of load operations and matrix multiplications for long sequences.\n- **head grouping vectorization**：Processes multiple query heads simultaneously (defined by block_group_size) within a single program instance. This batches the computation of QK scores and value accumulation, improving instruction-level parallelism and better utilizing the hardware's vector units compared to processing heads one by one.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/173-attention_sinks_kernel.py\n```\n\n**坏实践（反例）**：把完整 N×N 评分矩阵物化到 GM 再做 softmax\n```python\nscores = tl.load(...)              # 全量 N×N 评分写回 HBM\ntl.store(scores_ptr + ..., scores)\nm = tl.max(...)                    # 二次读回做 max/sum 归一化\n```\n后果：长序列下 N×N 矩阵的 HBM 读写成为带宽瓶颈，且显存占用随 N² 增长。✅ 正解：online softmax——循环内用 re_scale 因子增量更新 history_max 与 l，评分矩阵永不落盘。\n\n**已知实例**：attention §raw (`experiences/attention/exp_attn_sinks_001.yaml`)\n- 声称性能收益：40%\n- 备注：This kernel is specifically optimized for the decoding phase of LLMs. It assumes that sink scores are pre-computed and passed as an argument. The use of tl.dot for matrix multiplication ensures high throughput on supported hardware.\n\n\n", "runbooks/memory-sram/exp_flashattn_fwd_001.md": "\n\n## Memory Access Optimization: online softmax algorithm\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3, 91093, 91095，fp16/bf16，BLOCK_C≥64、GROUP_SIZE≥1；失效边界：该 micro-kernel 假设查询块 block_q 已预载，仅覆盖内层循环；GROUP_SIZE=1（无头共享）时分组寻址无额外收益；block_q 与输出累加器常驻片上，head_dim 过大超出 UB 容量时需减小 BLOCK_C）\n\n### 原则\n- **online softmax algorithm**：Implements 分块注意力的在线归一化策略 by iteratively updating the running maximum (block_m) and the sum of exponentials (block_l). This avoids materializing the large $S \\times S$ attention matrix in High Bandwidth Memory (HBM), significantly reducing memory traffic.\n- **block tiling strategy**：Loads k/v 张量 in blocks defined by BLOCK_C. This keeps the 查询张量 (block_q) resident in fast on-chip memory (SRAM/Registers) while streaming k and v, maximizing data reuse per byte loaded from HBM.\n- **mixed precision computation**：Utilizes LOW_TYPE (e.g., fp16/bf16) for the output accumulation (block_o) to leverage high-throughput tensor core operations, while implicitly using higher precision (HIGH_TYPE) for the softmax statistics (block_s, block_m, block_l) to ensure numerical stability during exponential calculations.\n- **gqa memory optimization**：The stride calculation incorporates GROUP_SIZE (idx_n // GROUP_SIZE), enabling efficient memory access patterns for 多个查询头共享同一份 k/v 数据块的分组注意力变体场景。\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/256-micro_kernel_fwd.py\n```\n\n**坏实践（反例）**：每个 k/v 块算完就把评分写回 HBM 攒全量矩阵\n```python\nfor c in range(0, S, BLOCK_C):\n    s = tl.dot(block_q, k_c)\n    tl.store(scores_ptr + c, s)          # S x S 中间矩阵落 HBM\n# 第二个 kernel 再读回做归一化与加权求和\n```\n后果：中间评分矩阵 HBM 写读随 S² 增长，长序列带宽打满。✅ 正解：block_q 常驻片上，流式加载 k/v 块，迭代更新 block_m/block_l 与 block_o，全程无中间矩阵落盘，收益 200%。\n\n**已知实例**：attention §raw (`experiences/attention/exp_flashattn_fwd_001.yaml`)\n- 声称性能收益：200%\n- 备注：This is a micro-kernel designed for the inner loop of a 分块注意力 forward pass. It assumes block_q is pre-loaded and handles the incremental update of output and softmax statistics.\n\n\n", "runbooks/memory-sram/exp_fused_attention_002.md": "\n\n## 长序列注意力分块计算 + 在线 Softmax\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2/910b3，fp16/bf16，seq_len ≥1024、d_k ≥64、num_heads ≥8；失效边界：seq_len <1024 的短序列分块循环调度开销占比升高，收益收窄；num_heads <8 时 grid 并行度不足，核利用率成为瓶颈）\n\n### 原则\n- **分块计算**：将大序列长度矩阵按BLOCK_SIZE分块处理，避免存储完整的注意力分数矩阵，降低内存占用\n- **在线Softmax**：增量式计算Softmax，维护全局最大值(m_i)和全局exp和(l_i)，无需存储完整scores矩阵\n- **数值稳定**：分块内先减去块内最大值再计算exp，避免指数运算溢出，提升数值稳定性\n- **内存复用**：累加器(acc)分块更新，减少重复加载V张量的开销\n\n### 代码/骨架出处\n- `Triton`:\n```python\n@triton.jit def flash_attention_kernel(Q_ptr, K_ptr, V_ptr, output_ptr, B, H, S, D, blockSize: tl.constexpr=128):\n    # Flash Attention优化实现：分块计算+在线Softmax\n    pid = tl.program_id(0)\n    b = pid // (H * (S // blockSize))\n    h = (pid % (H * (S // blockSize))) // (S // blockSize)\n    s_q = (pid % (S // blockSize)) * blockSize\n    \n    # 加载当前查询块Q\n    q_ptr = Q_ptr + b * H * S * D + h * S * D + s_q * D + tl.arange(0, blockSize)[:, None] * D + tl.arange(0, D)[None, :]\n    Q = tl.load(q_ptr, mask=tl.arange(0, blockSize)[:, None] < S - s_q and tl.arange(0, D)[None, :] < D, other=0.0)\n    \n    # 初始化全局统计量\n    m_i = tl.full((blockSize, 1), -float('inf'), dtype=tl.float32)  # 全局最大值\n    l_i = tl.full((blockSize, 1), 0.0, dtype=tl.float32)           # 全局exp和\n    acc = tl.full((blockSize, D), 0.0, dtype=tl.float32)           # 输出累加器\n    \n    # 分块处理K/V（在线Softmax核心逻辑）\n    for start_k in range(0, S, blockSize):\n        # 1. 加载当前K/V块\n        k_ptr = K_ptr + b * H * S * D + h * S * D + start_k * D + tl.arange(0, blockSize)[:, None] * D + tl.arange(0, D)[None, :]\n        v_ptr = V_ptr + b * H * S * D + h * S * D + start_k * D + tl.arange(0, blockSize)[:, None] * D + tl.arange(0, D)[None, :]\n        K = tl.load(k_ptr, mask=tl.arange(0, blockSize)[:, None] < S - start_k and tl.arange(0, D)[None, :] < D, other=0.0)\n        V = tl.load(v_ptr, mask=tl.arange(0, blockSize)[:, None] < S - start_k and tl.arange(0, D)[None, :] < D, other=0.0)\n        \n        # 2. 计算当前块QK^T分数\n        scores = tl.matmul(Q, tl.trans(K)) / tl.sqrt(tl.cast(D, tl.float32))\n        load_mask = tl.arange(0, blockSize)[None, :] < S - start_k\n        scores = tl.where(load_mask, scores, -float('inf'))\n        \n        # 3. 更新全局最大值\n        m_ij = tl.maximum(m_i, tl.max(scores, axis=1, keepdims=True))\n        \n        # 4. 计算当前块exp值（数值稳定化）\n        scores = scores - m_ij\n        p = tl.exp(scores)\n        \n        # 5. 更新全局exp和\n        l_ij = tl.sum(p, axis=1, keepdims=True)\n        alpha = tl.exp(m_i - m_ij)\n        l_i = l_i * alpha + l_ij\n        \n        # 6. 更新输出累加器\n        acc = acc * alpha + tl.matmul(p, V)\n        \n        # 7. 更新全局最大值\n        m_i = m_ij\n    \n    # 最终归一化\n    output = acc / l_i\n    \n    # 存储输出\n    output_ptr = output_ptr + b * H * S * D + h * S * D + s_q * D + tl.arange(0, blockSize)[:, None] * D + tl.arange(0, D)[None, :]\n    tl.store(output_ptr, output.to(Q.dtype), mask=tl.arange(0, blockSize)[:, None] < S - s_q and tl.arange(0, D)[None, :] < D)\n```\n\n**坏实践（反例）**：一次性物化完整 S×S 评分矩阵，且 exp 前不减最大值\n```python\nscores = tl.matmul(Q, tl.trans(K)) / sqrt(D)   # S×S 全量评分驻留内存\np = tl.exp(scores)                              # 未减 max，大 logits 直接溢出\nout = tl.matmul(p / tl.sum(p, axis=1), V)\n```\n后果：内存占用 O(S²)，长序列下 GM 带宽与容量双双成为瓶颈；数值上 exp 溢出产生 inf/NaN。✅ 正解：按 BLOCK_SIZE 分块遍历 K/V，循环内用 m_i/l_i 增量维护在线 Softmax 统计量，评分矩阵永不物化，内存降至 O(S)，分块内先减块内最大值再 exp。\n\n**已知实例**：attention §raw (`experiences/attention/exp_fused_attention_002.yaml`)\n- 声称性能收益：50%\n- 备注：适用于大序列长度（seq_len≥1024）的Attention计算，分块计算减少内存占用（从O(S²)降至O(S)），在线Softmax提升数值稳定性，910b2/910b3硬件上性能提升显著\n\n\n", "runbooks/memory-sram/exp_fused_rms_norm_001.md": "\n\n## Memory Access Optimization: fused residual-add RMSNorm with in-place writeback\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3, 91093，fp16/bf16，hidden dim N≥1024；失效边界：N<1024 时两遍加载（reduction 一遍、输出一遍）的成本无法摊销，融合收益稀释；单行 N×4B(fp32 累加） 超过 UB 可用容量时需沿 N 切 tile，原地写回模式不变但需重算 UB 预算）\n\n### 原则\n- **kernel fusion**：Fuses the residual addition (X+R), variance calculation (sum of squares), reciprocal root mean square computation, and final scaling/weight multiplication into a single kernel. This significantly reduces global memory access overhead by keeping intermediate data in high-speed memory (SRAM/Registers) and avoiding multiple kernel launch latencies.\n- **residual inplace update**：Optimizes the data path by writing back the intermediate sum (X+R) to the residual pointer R and the normalized output to X. This eliminates the need for a separate add kernel or extra memory allocation for the residual connection, effectively halving the memory traffic required for the residual path.\n- **precision management**：Utilizes float32 precision specifically for the variance accumulation (_var_base) to maintain numerical stability during the reduction of squared values, while performing the final arithmetic and storage in the lower precision input type (e.g., fp16/bf16) to maximize memory bandwidth utilization.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/115-fused_add_rms_norm_kernel.py\n```\n\n**坏实践（反例）**：残差相加与归一化拆成两个 kernel，中间结果 X+R 落 GM\n```python\n# kernel 1: 只算残差和并写回 GM\ntl.store(R_ptr + off, x + r)\n# kernel 2: 重新从 GM 读 X+R，再算方差与归一化\ns = tl.load(R_ptr + off); var = tl.sum(s * s) / N\n```\n后果：X+R 在 GM 写一次、读一次，残差路径访存流量翻倍，叠加两次 kernel launch 开销。✅ 正解：融合为单 kernel，X+R 保留在 UB/寄存器，同时写回 R 指针（原地更新残差）与 X 指针（归一化输出）；方差累加用 fp32 保数值稳定，最终算术与存储回到 fp16/bf16 打满带宽。\n\n**已知实例**：normalization §raw (`experiences/normalization/exp_fused_rms_norm_001.yaml`)\n- 声称性能收益：35%\n- 备注：This kernel is optimized for scenarios where the hidden dimension N is large enough to amortize the cost of the two-pass loading (once for reduction, once for output). 尤其适用于 Pre-Norm / Post-Norm 结构的归一化场景。\n\n\n", "runbooks/memory-sram/exp_gemma_rmsnorm_001.md": "\n\n## Memory Access Optimization: fused add-RMSNorm with weight hoisting\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3，fp16/bf16，dim≥1024、batch≥32；失效边界：dim 过小无法打满内存总线，融合与 hoisting 收益稀释；权重张量过大无法常驻寄存器/UB 时 hoisting 失效，需改回循环内加载或沿 dim 切块）\n\n### 原则\n- **operator fusion**：Fuses the residual addition (hidden_state + residual) and RMSNorm operations into a single kernel. This eliminates the need to write and read back the intermediate addition result from global memory, significantly reducing memory bandwidth pressure.\n- **weight hoisting**：The weight tensor is loaded inside the row processing loop. An optimization is to move the weight loading statement outside the `for row_start` loop. Since weights are constant across the batch, this ensures the data is loaded once and kept in registers or cache, minimizing redundant global memory accesses.\n- **vectorized reduction**：Utilizes `tl.sum` on the squared values to compute variance efficiently. This maps well to the vector units of the target hardware, allowing for parallel reduction of the `dim` axis.\n- **precision control**：Performs the reduction (variance calculation) in `float32` to maintain numerical stability, while keeping the loads and stores in the lower precision `fp16`/`bf16` to optimize memory throughput.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/190-add_gemma_rms_norm_kernel.py\n```\n\n**坏实践（反例）**：权重在 row 处理循环内重复加载\n```python\nfor row_start in range(0, batch, BLOCK_M):\n    w = tl.load(w_ptr + tl.arange(0, BLOCK_N))  # 每个 row tile 重复读同一份权重\n    x = tl.load(x_ptr + row_start * dim + offs)\n    ...\n```\n后果：对 batch 内所有行不变的常量权重被重复 GM 读取 batch/BLOCK_M 次，纯属带宽浪费。✅ 正解：把权重 load 提升到 `for row_start` 循环外，只读一次并驻留寄存器/UB；残差相加与归一化融合为单 kernel，中间和不再落 GM；方差规约用 fp32。\n\n**已知实例**：matmul §raw (`experiences/matmul/exp_gemma_rmsnorm_001.yaml`)\n- 声称性能收益：35%\n- 备注：该 kernel 实现的是一种缩放权重按 (w + 1.0) 使用的 RMSNorm 变体。适用于 hidden dimension 足够大、能打满内存总线的场景。\n\n\n", "runbooks/memory-sram/exp_softmax_backward_001.md": "\n\n## Memory Access Optimization: two pass reduction strategy\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2/910b3/91093/91095，fp16/bf16/fp32，N ≥128；失效边界：N 超单 tile 容量时才需要两遍结构，小 N 应走 ONE_TILE_PER_CTA 快路径；evict_last 只适用于两遍间会复用的张量，对不再复用的数据误用会污染缓存）\n\n### 原则\n- **two pass reduction strategy**：The kernel decouples the computation into two distinct loops a reduction phase to compute the scale (sum of output * gradient) and an update phase to calculate the input gradient. This approach avoids the need to store intermediate results for the entire row in registers or scratchpad, which is critical for handling large N dimensions that exceed register capacity.\n- **explicit cache eviction policy**：In the reduction loop, the `eviction_policy=\"evict_last\"` argument is used for the `out` tensor. This explicitly instructs the memory subsystem to retain the loaded `out` data in the cache (L1/L2), as it will be accessed again in the subsequent update loop. This optimization significantly reduces global memory bandwidth pressure by maximizing data reuse across the two passes.\n- **adaptive tiling and heuristics**：The kernel utilizes `triton.autotune` and runtime heuristics to dynamically select the optimal `TILE_M` and `TILE_N` based on the input shapes M and N. This ensures that the memory access patterns 沿连续维对齐 GM→UB 向量访存 and that NPU 核占用率 is maximized for varying batch sizes and sequence lengths.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/129-softmax_backward_kernel_inner.py\n```\n\n**坏实践（反例）**：单遍法把整行的中间结果（输出与梯度的逐元素积）驻留寄存器，同时算 scale 和 dx\n```python\nrow = tl.load(out_ptr + offs)         # 整行驻留寄存器\ng   = tl.load(grad_ptr + offs)\nscale = tl.sum(row * g)               # 归约依赖未完成前无法释放 row\n```\n后果：N 超过寄存器容量时编译器 spill 或 kernel 不可用。✅ 正解：两遍解耦——第一遍只归约出 scale（fp32 标量），第二遍重读数据算 dx；第一遍对 `out` 用 `eviction_policy=\"evict_last\"` 保留在缓存中供第二遍复用。\n\n**已知实例**：softmax §raw (`experiences/softmax/exp_softmax_backward_001.yaml`)\n- 声称性能收益：30%\n- 备注：The `ONE_TILE_PER_CTA` path provides a fast-path for smaller N dimensions where the data fits in a single tile, bypassing the overhead of the two-pass loop structure.\n\n\n", "runbooks/memory-sram/exp_softmax_backward_non_inner_001.md": "\n\n## Memory Access Optimization: two pass reduction strategy\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2/910b3，fp16/bf16，M ≥1、N ≥128、K ≥128，归约发生在非最内层维 N；失效边界：N 装入单 tile 时循环结构无意义（ONE_TILE_PER_CTA 直接单载单算）；归约沿最内层维的场景应看 inner 版本的卡）\n\n### 原则\n- **two pass reduction strategy**：For large reduction dimensions (N), the kernel employs a two-pass approach. The first pass iterates over tiles of N to accumulate the 'scale' (sum of output * gradient) in float32. The second pass iterates again to compute the final gradient using the accumulated scale. This decouples the reduction dependency from the element-wise computation, preventing register overflow.\n- **adaptive tiling heuristic**：The kernel utilizes the 'ONE_TILE_PER_CTA' heuristic to optimize for different tensor sizes. If N fits within a single tile (TILE_N), it bypasses the reduction loop entirely, performing a single load and compute. If N is larger, it automatically switches to the looped tiling mode, ensuring optimal performance across varying sequence lengths.\n- **high precision accumulation**：The intermediate 'scale' variable is explicitly defined with 'tl.float32'. This ensures that the summation over the N dimension maintains higher precision than the input type (fp16/bf16), which is crucial for numerical stability in softmax backward propagation.\n- **连续访存布局**：Data access is strided using 'offsets_n[:, None] * inputB + offsets_k', ensuring that loads and stores 沿 inputB 维保持 GM→UB 连续. This maximizes memory bandwidth utilization on the NPU.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/128-softmax_backward_kernel_non_inner.py\n```\n\n**坏实践（反例）**：大 N 场景仍用单遍结构，把归约依赖和 element-wise 计算耦在同一循环里\n```python\nfor k in range(K):\n    tile = tl.load(ptr + offs_n[:, None] * inputB + k)  # 整个 [N] 切片驻留寄存器\n    dx = tile * (g - scale)      # scale 未归约完，所有 tile 都得活着\n```\n后果：N 大时寄存器溢出，编译器 spill 到本地内存，性能崩塌。✅ 正解：第一遍只用 fp32 标量累加 scale（output×gradient 之和），第二遍再重扫算最终梯度；归约依赖与 element-wise 计算解耦，寄存器压力与 N 脱钩。\n\n**已知实例**：softmax §raw (`experiences/softmax/exp_softmax_backward_non_inner_001.yaml`)\n- 声称性能收益：30%\n- 备注：This implementation is specifically optimized for the \"non-inner\" dimension case where the reduction happens along N. It effectively handles the boundary conditions where N is not a multiple of TILE_N via masking.\n\n\n", "runbooks/meta-skills/attention-fusion-failure-diagnosis.md": "\n\n## DG-4 attention 单 kernel 融合失败诊断\n\n【优化维度】：元技能｜瓶颈诊断\n【泛化层级】：条件性（迁移条件：attention 算子尝试单 kernel 融合 QK+Softmax+PV；失效边界：非 attention 或已确认三 kernel 架构）\n\n<判定依据：attention 的 softmax 中间状态（max/sum）需要跨 tile 聚合，单 kernel 融合要么省 workspace（精度失败）要么加 workspace（性能差）。大 D（如 1024）时 UB 放不下完整 q/k/v tile，加剧矛盾。与 [[two-pass-reduce-then-apply]] 同源：softmax 归约必须两阶段。>\n\n<诊断决策树（单 kernel 融合失败分支）：\n尝试单 kernel 融合 QK+Softmax+PV\n├─ 方案A：无 workspace FlashAttention（D 维分块在线 softmax）\n│  └─ softmax 基于不完整分块数据 -> 精度失败\n│     根因：D 维分块时 softmax 的 max/sum 跨块无法在线聚合正确\n├─ 方案B：按行单 kernel + workspace\n│  ├─ 必须 BLOCK_M=8（UB 放不下大 tile）-> matmul 效率骤降\n│  └─ speedup 0.043（远低于三 kernel 的 0.197）\n│     根因：大 D（1024）UB 放不下完整 q/k/v tile，被迫小 BLOCK_M\n└─ 正解：维持三 kernel 分离（QK / Softmax / PV）+ BLOCK_M 增大到 256\n   - 三 kernel 让 softmax 独立用 fp32 + workspace，matmul 用大 BLOCK_M\n   - 与 [[split-kernel-gm-roundtrip]] 一致：必要时拆 kernel 强制正确中间状态\n>\n\n<瓶颈定位指标：\n- 大 shape（如 [1,384,1536]）speedup 0.017，小 shape（如 [1,256,16,32]）1.12 -> 典型 cube 利用率问题，大 shape BLOCK_M 不够\n- 单 kernel speedup 0.043 vs 三 kernel 0.197 -> 融合未必更快，matmul 效率主导\n>\n\n**坏实践（反例）**：盲目追求单 kernel 融合\n```python\n# 假设单 kernel 一定更快，强行融合 QK+Softmax+PV\n# 用小 BLOCK_M=8 塞进 UB -> matmul 效率骤降\n```\n后果：speedup 0.043，比三 kernel 差 4.6 倍。✅ 正解即三 kernel 分离 + 大 BLOCK_M。\n\n**已知实例**：op_0_12_FusedInferAttentionScore（5 轮优化，0.0807->0.1974，方案A/B 均失败，最终三 kernel + BLOCK_M=256）\n\n\n", "runbooks/compute-pipeline/exp_softmax_inner_002.md": "\n\n## Compute Optimization: vectorized accumulation strategy\n\n【优化维度】：AICore 单元利用/Scalar 削减\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3；失效边界：N 维很大、循环内水平归约开销不可接受时收益最大（备注自述）；N < TILE_N 时单块即可，向量化累计的多余宽度浪费；evict_first 只适用于写完不再读的数据）\n\n### 原则\n- **vectorized accumulation strategy**：The kernel employs a vectorized reduction strategy where intermediate max (m) and sum (z) values are maintained as vectors of size TILE_N instead of scalars within the reduction loop. This avoids expensive horizontal reduction operations (e.g., tl.max) inside the hot loop, replacing them with efficient element-wise operations (tl.maximum). The final reduction to a scalar is performed only once after the loop completes.\n- **online softmax algorithm**：Implements the numerically stable online softmax algorithm adapted for the vectorized strategy. It updates the running max and sum using the formula z = z * exp(m_old - m_new) + exp(x - m_new), ensuring stability against overflow/underflow for large input values.\n- **cache eviction policy**：Utilizes eviction_policy=\"evict_first\" in the second pass (write-back). This optimizes L1 cache behavior by treating input data loads as transient, preventing them from polluting the cache and evicting the accumulator values or other critical data during the final normalization phase.\n- **loop specialization and tiling**：The kernel tiles the reduction dimension N into blocks of TILE_N. It specializes the loop logic for the main body and the boundary (remainder) tiles. This removes redundant mask checks from the main loop body, significantly improving instruction throughput and reducing branch mispredictions.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/127-softmax_kernel_inner.py\n```\n\n**坏实践（反例）**：归约循环内每次迭代都做水平归约（`tl.max`/`tl.sum` 出标量）→ 热循环被横向归约指令主导 → ✅ 正解即本条：max/sum 以 TILE_N 向量形式在循环内逐元素更新（`tl.maximum`），循环结束后才归约一次出标量。\n\n**已知实例**：softmax §raw (`experiences/softmax/exp_softmax_inner_002.yaml`)\n- 声称性能收益：30%\n- 备注：This optimization is particularly effective for large N dimensions where the cost of horizontal reductions in the loop would be prohibitive. The vectorized approach leverages the full width of the vector units.\n\n\n", "runbooks/compute-pipeline/exp_softmax_non_inner_001.md": "\n\n## Compute Optimization: online softmax algorithm\n\n【优化维度】：AICore 单元利用/Scalar 削减\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3, 91093, 91095；失效边界：N ≤ TILE_N 时应走 ONE_TILE_PER_CTA 的单 pass 快速路径，两遍策略是 N 超 tile 时的兜底；两遍以重读输入换寄存器压力，带宽充裕时可能不如单遍；依赖 libentry 运行时）\n\n### 原则\n- **online softmax algorithm**：Implements the numerically stable online softmax algorithm within the reduction loop. It updates the running maximum (m) and sum (z) using the formulas m_new = max(m, inp) and z = z * exp(m - m_new) + exp(inp - m_new), allowing the reduction to be performed in chunks without storing the entire input tensor in registers.\n- **two pass strategy**：For reduction dimensions (N) larger than the tile size (TILE_N), the kernel employs a two-pass approach. The first pass iterates over N to compute the global max and sum, and the second pass iterates again to compute the final exponential and division values. This trades off memory bandwidth for reduced register pressure.\n- **heuristic dispatch**：Utilizes the ONE_TILE_PER_CTA heuristic to dynamically select the kernel strategy at runtime. If N fits within TILE_N, it uses a faster single-pass load-compute-store path; otherwise, it falls back to the two-pass strategy for larger dimensions.\n- **vectorized memory access**：Loads data in tiles of (TILE_N, TILE_K), processing multiple elements of the K dimension simultaneously to maximize memory bandwidth utilization and ensure coalesced access patterns.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/126-softmax_kernel_non_inner.py\n```\n\n**坏实践（反例）**：不分 case 地对所有 N 走两遍策略（或单 pass 整行驻留寄存器）→ 小 N 白读一遍输入 / 大 N 寄存器 spill → ✅ 正解即本条：ONE_TILE_PER_CTA 启发式运行时 dispatch，单块走单 pass，超块走 online softmax 两遍。\n\n**已知实例**：softmax §raw (`experiences/softmax/exp_softmax_non_inner_001.yaml`)\n- 声称性能收益：30%\n- 备注：This kernel is optimized for softmax over the N dimension of a 3D tensor (M, N, K). The libentry decorator suggests integration with specific runtime environments.\n\n\n", "runbooks/compute-pipeline/operator-fusion-patterns.md": "\n\n## DG-11 算子融合模式与约束决策\n\n【优化维度】：计算｜融合\n【泛化层级】：条件性（迁移条件：数据依赖的连续算子；失效边界：独立并行、多消费者、UB 放不下或对齐冲突）\n\n<原则：融合把多个算子的 HBM 往返消除，将中间结果保留在 UB/寄存器内。对内存受限算子（elementwise、norm、activation）通常带来 25–50% 提升。但融合必须满足 UB 容量、相同 grid 结构、无多消费者、对齐兼容四个约束，否则反而导致 UB overflow 或编译失败。>\n\n**为什么融合能提速**：\n\n```\n未融合：GEMM → [HBM 写 C] → RMSNorm → [HBM 读 C] → [HBM 写 Y]\n已融合：GEMM → [UB 内] → RMSNorm → [HBM 写 Y]\n```\n\n每消除一对 HBM 读/写，约省 15–20% 延迟。\n\n**常见融合模式与收益**：\n\n| 模式 | 收益 | 关键约束 |\n|---|---|---|\n| GEMM + Activation | 15–20% | activation 在 fp32 accumulator 上计算 |\n| GEMM + Bias | 10–15% | bias 向量寄存器驻留 |\n| GEMM + RMSNorm | ~35% | 输出 tile UB 内完成归一化 |\n| GEMM + RoPE | ~25% | Q/K head 布局兼容 |\n| Skip + LayerNorm | ~30% | residual 与输入同 grid |\n| RMSNorm + Quantization | ~50% | scale 在 UB 内计算并写出 |\n| Conv1D + State + SiLU | ~35% | 状态更新用双缓冲避免竞争 |\n\n**Cube/Vector 异构融合（dl.async_task）**：\n\n```python\nimport triton_ascend.language as dl\n\n@triton.jit\ndef fused_gemm_norm(...):\n    with dl.async_task(scope=\"cube\"):\n        acc = tl.dot(a_tile, b_tile)\n\n    with dl.async_task(scope=\"vector\"):\n        rms = tl.sqrt(tl.sum(acc * acc, axis=1) / N + eps)\n        out = (acc / rms[:, None]) * weight\n        tl.store(Y_ptr + ..., out)\n```\n\nCube 计算 tile `i+1` 的同时，Vector 归一化 tile `i`。\n\n**融合约束清单**：\n\n```\n□ 操作 A 的输出是操作 B 的输入（数据依赖）\n□ 融合后所有中间 tensor 能放入 UB（≤ 192KB，matmul 保守 ≤ 64KB）\n□ 两个操作使用相同 grid / block 结构\n□ 中间结果不被多个下游消费者使用\n□ 对齐要求兼容（如 GEMM BLOCK_N=256 vs GroupNorm cpg=64 可能冲突）\n□ 激活函数在 fp32 累加器上计算，避免 fp16 溢出\n```\n\n**坏实践（反例）**：\n```python\n# 强行融合独立操作，grid 不一致\nop1_grid = (batch, M)\nop2_grid = (batch, N)\n```\n后果：编译失败或性能倒退。✅ 正解即只融合数据依赖且 grid 一致的操作。\n\n**双缓冲状态融合**：当多个 program 并发写入共享状态（conv_state、KV cache）时，写独立 buffer + host 侧 `copy_` 同步，避免 WAR 依赖和伪共享。\n\n**决策流程**：\n\n```\n1. 是否存在数据依赖链 A→B？\n   NO → 不融合\n2. 中间 tensor 是否多消费者？\n   YES → 不融合（保留中间 HBM）\n3. 融合后 tile 是否超 UB？\n   YES → 增大 BLOCK 或拆分为两阶段\n4. grid/对齐是否兼容？\n   NO → 不融合或调整 BLOCK\n5. 使用 dl.async_task 区分 Cube/Vector？\n   YES → 异构并行\n```\n\n\n"}};

  {selector:'node:selected',style:{'border-width':3,'border-color':'#f59e0b','border-style':'solid','text-opacity':1,'font-size':9}},
  {selector:'.nbr',style:{'text-opacity':1,'font-size':8}},
  {selector:'edge',style:{'width':e=>e.data('e').cross?2:1,'line-color':e=>EC[e.data('type')]||'#ccc','line-style':e=>e.data('e').cross?'dashed':'solid','curve-style':'haystack','opacity':0.55,'target-arrow-shape':e=>e.data('e').symmetric?'none':'triangle','target-arrow-color':e=>EC[e.data('type')]||'#ccc','arrow-scale':0.6}},
  {selector:'edge:selected',style:{'opacity':1,'width':3}},
  {selector:'.dim',style:{'opacity':0.06,'text-opacity':0}}
 ],
 layout:{name:'cose',animate:false,nodeRepulsion:9000,idealEdgeLength:55,padding:30}});

function resolveLink(fromId,href){let base=fromId.split('/').slice(0,-1);for(const p of href.split('/')){if(p==='..')base.pop();else if(p!=='.')base.push(p);}let id=base.join('/');return nodeById[id]?id:null;}
function showDetail(id){const n=nodeById[id];if(!n)return;cy.$(':selected').unselect();const node=cy.getElementById(id);node.select();cy.elements().removeClass('nbr');node.connectedNodes().addClass('nbr');cy.animate({center:{eles:node},duration:200});
 let h=`<span class="chip" style="background:${KC[n.kind]}">${n.kind}</span> ${n.external?'<span class="chip" style="background:#94a3b8">外部</span>':''}<h2>${esc(n.title)}</h2><div class="id">${n.id}</div>`;
 if(n.description)h+=`<p>${esc(n.description)}</p>`;
 if(n.resource)h+=`<p><a class="ext" href="${n.resource}" target="_blank" rel="noopener">上游 resource ↗</a></p>`;
 if(n.tags&&n.tags.length)h+=`<div>${n.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`;
 const inc=cy.getElementById(id).connectedEdges().map(x=>x.data('e'));
 const groups={};inc.forEach(e=>{if(e.type==='part_of')return;const me=id;const other=e.source===me?e.target:e.source;const lab=persp(e,me);(groups[lab]=groups[lab]||[]).push([other,e]);});
 const order=['实现示例','对应接口','开发指南','讲解接口','声明头文件','声明的接口','配套样例','对应指南','同主题','相关','提及'];
 Object.keys(groups).sort((a,b)=>order.indexOf(a)-order.indexOf(b)).forEach(lab=>{h+=`<div class="grp">${lab} (${groups[lab].length})</div>`;groups[lab].forEach(([o,e])=>{const t=nodeById[o];h+=`<a class="nb" onclick="showDetail('${o}')">${esc(t?t.title:o)} <span class="w">· ${ETZH[e.type]||e.type} ${e.weight.toFixed(1)}</span></a>`;});});
 const bl=(back[id]||[]).filter(e=>e.type!=='part_of'&&!e.symmetric);
 if(bl.length){h+=`<div class="grp">被引用 / 指向本卡 (${bl.length})</div>`;bl.forEach(e=>{const t=nodeById[e.source];h+=`<a class="nb" onclick="showDetail('${e.source}')">${esc(t?t.title:e.source)} <span class="w">· ${ETZH[e.type]||e.type}</span></a>`;});}
 const body=(G.bodies||{})[id];if(body){h+=`<div id="body">${marked.parse(body,{gfm:true,breaks:false})}</div>`;}
 const d=document.getElementById('detail');d.innerHTML=h;d.scrollTop=0;
 d.querySelectorAll('#body a[href]').forEach(a=>{const href=a.getAttribute('href');if(href&&href.endsWith('.md')&&!href.includes('://')){const tid=resolveLink(id,href);if(tid){a.className='int';a.removeAttribute('href');a.onclick=()=>showDetail(tid);return;}}a.className='ext';a.target='_blank';a.rel='noopener';});}
function kg(k){if(['implementation_trap','debugging_journey','cross_skill_gap','field_note'].includes(k))return'field_note';if(['operator_optimization','runbook'].includes(k))return'runbook';return k;}
function persp(e,me){const k=kg(nodeById[me].kind);if(e.type==='exemplifies'){if(k==='api'||k==='guide')return'实现示例';if(k==='operator'||k==='field_note')return'实践案例';return'对应接口';}if(e.type==='explains'){if(k==='api')return'开发指南';if(k==='operator'||k==='field_note'||k==='runbook')return'开发指南';return'讲解接口';}if(e.type==='declares')return k==='api'?'声明头文件':'声明的接口';if(e.type==='demonstrates')return k==='guide'?'配套样例':'对应指南';if(e.type==='same_topic')return'同主题';if(e.type==='related')return'相关';if(e.type==='mentions')return'提及';return'相关';}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
cy.on('tap','node',ev=>showDetail(ev.target.id()));
cy.on('tap','edge',ev=>{const e=ev.target.data('e');document.getElementById('detail').innerHTML=`<div class="grp">边</div><p><b>${ETZH[e.type]||e.type}</b> ${e.symmetric?'(对称)':''}<br><span class="id">${e.source}<br>${e.symmetric?'—':'→'} ${e.target}</span></p><p>via: ${e.via.join(', ')}<br>why: ${esc(e.why)}<br>weight: ${e.weight}</p>`;});
cy.on('tap',ev=>{if(ev.target===cy){cy.elements().removeClass('nbr');cy.$(':selected').unselect();}});
document.getElementById('layout').onchange=e=>cy.layout({name:e.target.value,animate:false,padding:30}).run();
document.getElementById('reset').onclick=()=>{cy.fit(null,30);document.getElementById('q').value='';cy.elements().removeClass('dim');};
document.getElementById('q').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(!q){cy.elements().removeClass('dim');return;}cy.nodes().forEach(n=>{const d=n.data();const hay=(d.label+' '+d.id+' '+d.bundle).toLowerCase();n.toggleClass('dim',!hay.includes(q));});cy.edges().forEach(e=>e.toggleClass('dim',e.source().hasClass('dim')||e.target().hasClass('dim')));};
function mkfilter(host,title,keys,active,attr){let h=`<b>${title}</b>`;keys.forEach(k=>h+=`<label><input type=checkbox ${active(k)?'checked':''} data-f="${attr}" data-v="${k}">${k}</label>`);document.getElementById(host).innerHTML=h;}
mkfilter('bundleF','bundle:',G.meta.bundles,()=>true,'bundle');
mkfilter('kindF','kind:',['api','example','header','guide','glossary','index','other','operator','operator_optimization','implementation_trap','debugging_journey','cross_skill_gap'],()=>true,'kind');
mkfilter('typeF','边:',Object.keys(EC),k=>k!=='mentions'&&k!=='part_of','type');
document.getElementById('legend').innerHTML=Object.keys(EC).map(t=>`<span><b style="background:${EC[t]}"></b>${ETZH[t]}</span>`).join('');
function applyFilters(){const on=a=>new Set([...document.querySelectorAll(`input[data-f="${a}"]:checked`)].map(x=>x.dataset.v));
 const kb=on('bundle'),kk=on('kind'),kt=on('type');
 cy.nodes().forEach(n=>{const d=n.data();n.style('display',(kb.has(d.bundle)||!d.bundle)&&kk.has(d.kind)?'element':'none');});
 cy.edges().forEach(e=>{const vis=kt.has(e.data('type'))&&e.source().style('display')==='element'&&e.target().style('display')==='element';e.style('display',vis?'element':'none');});}
document.querySelectorAll('.filters input').forEach(cb=>cb.onchange=applyFilters);applyFilters();
const first=G.nodes.find(n=>n.kind==='api'&&!n.external)||G.nodes.find(n=>!n.external)||G.nodes[0];if(first)showDetail(first.id);
</script></body></html>

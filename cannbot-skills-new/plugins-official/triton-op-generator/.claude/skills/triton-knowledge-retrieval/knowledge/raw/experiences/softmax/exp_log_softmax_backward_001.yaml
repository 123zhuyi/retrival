optimization_points:
- two_pass_algorithm: The kernel separates the computation into two distinct passes
    a reduction pass to calculate the sum of gradients (scale) and a computation pass
    to derive the input gradients. This decouples the global reduction dependency
    from the element-wise calculation.
- block_tiling: Utilizes 2D tiling with BLOCK_M and BLOCK_N to process data in chunks.
    This allows for vectorized memory loads and stores, significantly improving memory
    bandwidth utilization compared to element-wise processing.
- high_precision_accumulation: The reduction variable 'scale' is explicitly initialized
    and computed using tl.float32. This ensures numerical stability during the summation
    of gradients, preventing overflow or underflow which is critical for softmax derivative
    calculations.
- mask_loading: Implements boundary checks using masks during memory loads and stores.
    This ensures the kernel operates correctly even when the matrix dimensions (M,
    N) are not perfectly divisible by the block sizes.
performance_boost: 25%
note: The current implementation loads 'out_grad' twice (once for reduction, once
  for calculation). While this improves readability and reduces register pressure,
  it increases memory traffic. For memory-bound scenarios, consider caching 'out_grad'
  in software-managed cache (SRAM) if available or fusing the loops if register file
  permits.

  hardware:
  - 910b2
  - 910b3
  core_param:
    m:
    - '>=256'
    n:
    - '>=128'
    k:
    - '>=256'
  optimization_level: high
  tensor_shape:
  - nd
  left_matrix_transpose: true
  right_matrix_transpose: true
experience_type: 切分优化
framework_tag:
- Triton
optimization_points:
- 分块策略: 按M0=256、K0=256、N0=128划分分块行宽，适配Ascend后端512B整数倍要求
- 带宽优化: 双转置场景下优先保证M0/K0对齐512B，平衡N0的访存效率
- 数据排布: 转置后矩阵指针计算适配分块规则，减少内存重排开销
code_snippet:
  Triton: "@triton.jit def matmul_both_trans_kernel(x, y, output, M, N, K, BLOCK_M=256,\
    \ BLOCK_K=256, BLOCK_N=128, **kwargs):\n    # A、B都转置 - M0=256、K0=256、N0=128分块代码\n\
    \    pid = triton.program_id(0)\n    rm = pid // (N // BLOCK_N)\n    rn = pid\
    \ % (N // BLOCK_N)\n    # 双转置矩阵按指定分块计算指针\n    x_ptr = x + rm * BLOCK_K * M + triton.arange(0,\
    \ BLOCK_K)[:, None] + triton.arange(0, BLOCK_M)[None, :] * M\n    y_ptr = y +\
    \ rn * BLOCK_K * N + triton.arange(0, BLOCK_K)[:, None] + triton.arange(0, BLOCK_N)[None,\
    \ :] * N\n    acc = triton.zeros((BLOCK_M, BLOCK_N), dtype=triton.float32)\n \
    \   for k in range(0, K, BLOCK_K):\n        a = triton.load(x_ptr, mask=triton.arange(0,\
    \ BLOCK_K)[:, None] < K - k, other=0.0)\n        b = triton.load(y_ptr, mask=triton.arange(0,\
    \ BLOCK_K)[:, None] < K - k, other=0.0)\n        acc += a @ b\n        x_ptr +=\
    \ BLOCK_K * M\n        y_ptr += BLOCK_K * N\n    acc = acc.to(x.dtype)\n    output_ptr\
    \ = output + rm * BLOCK_M * N + triton.arange(0, BLOCK_M)[:, None] * N + triton.arange(0,\
    \ BLOCK_N)[None, :]\n    triton.store(output_ptr, acc, mask=triton.arange(0, BLOCK_M)[:,\
    \ None] < M - rm * BLOCK_M and triton.arange(0, BLOCK_N)[None, :] < N - rn * BLOCK_N)"
performance_boost: 32%
note: 适用于A、B矩阵均转置的matmul场景，M0=256、K0=256满足512B整数倍，N0=128适配转置后的数据排布

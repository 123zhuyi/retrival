code_snippet:
  dot_vs_sum: |
    # 反模式（14-20x 退化）：微小矩阵用 tl.dot
    b_a = tl.reshape(b_a, (1, 16))
    b_a = tl.dot(b_a, b_A)  # CUBE 调度开销 >> 计算量

    # 正模式（高效）：VEC 广播乘 + 归约
    b_a = b_a + tl.sum(b_a[:, None] * b_A, 0)  # 1×16 × 16×16 → VEC

optimization_points:
- vectorization_alignment: Align BLOCK_SIZE_D to the hardware's vector width (e.g.,
    128 for fp16/bf16 on Ascend 910 series) to ensure the Vector Unit processes data
    efficiently without remainder handling, maximizing throughput for the element-wise
    multiplication.
- memory_coalescing: Ensure the stride for the HEAD_DIM (stride_od, stride_dod) is
    1 (contiguous). This allows the memory controller to issue contiguous load instructions,
    significantly reducing memory access latency compared to strided loads.
- block_size_tuning: Increase BLOCK_SIZE_O to improve data reuse and hide memory latency.
    By processing more sequence elements per program ID, the kernel can better saturate
    the compute units while keeping the intermediate accumulation in registers or
    high-speed cache (L0C/UB).

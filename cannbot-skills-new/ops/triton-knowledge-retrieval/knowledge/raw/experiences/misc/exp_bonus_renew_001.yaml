- do_not_specialize_strategy: The argument 'max_spec_len' is explicitly marked with
    'do_not_specialize'. This is a critical optimization for dynamic workloads (e.g.,
    variable length sequences). It instructs the Triton compiler to treat 'max_spec_len'
    as a runtime variable rather than a compile-time constant, preventing the generation
    of multiple kernel binaries for different sequence lengths. This drastically reduces
    compilation overhead and memory footprint.
- inline_pointer_arithmetic: The memory address for the store operation is calculated
    directly within the kernel using the formula 'position * (max_spec_len + 1) +
    num_tokens1'. This allows efficient mapping to a flattened 2D tensor structure
    without requiring expensive pre-processing or tensor reshaping on the host.
- minimal_register_pressure: The kernel operates on a single scalar value ('bonus_token_id')
    per invocation. This minimizes register usage, ensuring high occupancy on the
    SM/TPC units and reducing latency for the specific update task.

## Pipeline Constraints

### Real dtype (non-BF16)

```
load(dtype) → abs(dtype) → store(dtype)
```

No intermediate dtype conversion needed.

### BF16

```
load(bf16) → cast(f32) → abs(f32) → cast(bf16) → store(bf16)
```

The FP32 intermediate is REQUIRED to prevent precision loss.  The CANN DAG explicitly inserts Cast nodes for this.

### Complex

```
load_pairs(f32/f16) → deinterleave → compute_sqrt_sum_sq → store(f32/f16)
```

**Numerical stability requirements for COMPLEX64 → FLOAT** (the CANN kernel implements this; a Triton implementation should match):
1. Sort `|real|` and `|imag|` so `a ≥ b`
2. If `b == 0`, result = `a` (avoid 0/0)
3. Normalize `a` to [1, 2) range by extracting exponent factor
4. Compute `sqrt(a_norm² + b_norm²)`
5. Multiply exponent factor back
6. Handle subnormals (scale up/down by 2²⁴)

For COMPLEX32 → FLOAT16, the simpler path (square → sum → sqrt → cast) is sufficient because the inputs are already low-precision.


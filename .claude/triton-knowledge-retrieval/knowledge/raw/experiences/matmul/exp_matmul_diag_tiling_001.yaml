experience_id: exp_matmul_diag_tiling_001
match_cond:
  operator_type: Matrix Operations
  compute_pattern: Matrix Multiplication
  data_type:
  - bf16
  - fp16
  - fp32
  hardware:
  - 910b2
  - 910b3
  core_param:
    m:
    - '>=512'
    n:
    - '>=512'
    k:
    - '>=256'
  optimization_level: advanced
  tensor_shape:
  - nd
experience_type: Scheduling Optimization
framework_tag:
- Triton
optimization_points:
- diagonal_tiling_strategy: Replaces the traditional row-major (horizontal) core splitting
    with an 8x8 diagonal tiling strategy. The kernel calculates task indices (`task_m_idx`,
    `task_n_idx`) such that program IDs are mapped to blocks along the diagonal of
    the MxN grid, rather than filling rows sequentially.
- bank_conflict_mitigation: In horizontal splitting, multiple cores simultaneously
    access the same row of the left matrix (mat_a), causing severe bank conflicts.
    Diagonal tiling distributes these accesses across different memory banks, significantly
    improving memory access bandwidth and efficiency.
- l2_cache_locality_optimization: Horizontal splitting requires loading the entire
    right matrix (mat_b) for each row of the output, often exceeding L2 cache capacity
    and causing thrashing. Diagonal tiling reuses active blocks of mat_b across adjacent
    diagonal steps, greatly increasing L2 cache hit rates and reducing global memory
    access latency.
- adaptive_thresholding: Introduces a `BLOCK_TRESHHOLD` parameter (tuned between 4-8)
    to conditionally enable diagonal tiling. This ensures the optimization is only
    applied when the matrix dimensions are large enough to justify the scheduling
    overhead, falling back to standard tiling for smaller shapes.
- diagonal_tiling_strategy: '将传统行主序（水平）分核替换为 8×8 对角线分块策略。Kernel 通过计算 `task_m_idx`、`task_n_idx`，将
    program ID 映射到 MxN 网格的对角线方向， 而非逐行顺序填充。具体实现中，利用当前块在局部 BLOCK_TRESHHOLD×BLOCK_TRESHHOLD
    子格内的相对位置（`localRelativeBlock`），结合最小公倍数（lcm）求解 N 轴坐标， 确保同一时刻各核心访问的任务块在 M、N 方向均匀分布。

    '
- bank_conflict_mitigation: '水平分核时，同一时刻大量核心并发访问左矩阵（mat_a）的同一行数据，引发严重 Bank 冲突，硬件访问效率显著下降。对角线分块将各核心的访问分散至不同内存
    Bank， 从根本上消除冲突热点，大幅提升内存访问带宽与效率。

    '
- l2_cache_locality_optimization: '水平分核完成一整行 mat_c 的计算后，已将右矩阵（mat_b）全部数据消费完毕； 当 mat_b
    较大时将超出 L2 Cache 容量，导致频繁换入换出（Cache Thrashing）， 后续每行均产生大量 Cache Miss。对角线分块使相邻对角步骤间可复用
    mat_b 的活跃 数据块，显著提升 L2 Cache 命中率，降低全局内存访问延迟。

    '
- adaptive_thresholding: '引入可调参数 `BLOCK_TRESHHOLD`（通过 autotune 在 4～8 范围内搜索最优值）， 仅当
    M、N 方向的块数均不低于该阈值时（即 `NUM_BLOCKS_M >= BLOCK_TRESHHOLD and NUM_BLOCKS_N >= BLOCK_TRESHHOLD`）才启用对角线分块；否则回退至传统顺序
    分核，避免小矩阵场景下调度开销得不偿失。

    '
- block_size_tuning: 'autotune 搜索空间覆盖两组基础分块配置： （1）BLOCK_M=128, BLOCK_N=256, BLOCK_K=256；
    （2）BLOCK_M=256, BLOCK_N=128, BLOCK_K=256。 两组配置均与 NPU 芯片亲和的 512B 对齐场景匹配，结合 `BLOCK_TRESHHOLD`
    共同 构成 10 个候选 Config，以 [M, N, K] 为 key 进行离线调优。

    '
- instruction_level_hint: '对 `mat_a_block` 与 `mat_b_block` 均调用 `tl.compile_hint(tensor,
    "dot_pad_only_k")`， 指示编译器仅在 K 轴方向进行 Pad 补齐，避免不必要的 M/N 轴 Pad，降低无效计算量， 提升指令执行效率。

    '
- core_parallel_launch: '以硬件实际 AI Core 数（`num_aicore`，通过 `driver.active.utils.get_device_properties`
    动态获取）作为 grid size 启动 Kernel，每个 Core 通过步长为 `num_cores` 的循环 处理多个任务块，实现负载均衡与全核心利用。

    '
- autotune_config:
    search_space:
      BLOCK_M:
      - 128
      - 256
      BLOCK_N:
      - 256
      - 128
      BLOCK_K:
      - 256
      BLOCK_TRESHHOLD:
      - 4
      - 5
      - 6
      - 7
      - 8
    total_configs: 10
    tune_key:
    - M
    - N
    - K
performance_boost: 25%
note: '本优化专为昇腾 910B 大规模矩阵场景设计，核心目标是缓解内存带宽压力与 L2 Cache 容量 瓶颈。对角线分核在 M、N 方向均超过 BLOCK_TRESHHOLD
  个基本块时生效，右矩阵大小超过 L2 Cache 容量时优化效果尤为显著。输出结果以 bfloat16 写回（`mat_c_block.to(tl.bfloat16)`），
  中间累加保持 float32 精度以保证数值稳定性。

  '
version: v1.0

  TritonPath: linear_persistent_kernel
performance_boost: 25%
note: This persistent kernel pattern is highly effective for large-scale matrix multiplications
  where the number of output tiles exceeds the number of available physical cores,
  minimizing the latency associated with kernel scheduling and launch.

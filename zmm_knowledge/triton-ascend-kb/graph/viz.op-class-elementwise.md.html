l.constexpr` 三分支 |\n| dtype 模板 DTYPE_QUERY | fp16/bf16/fp32 实例化 | 单 kernel 指针 dtype 自动分派 + `.to(tl.float32)` 统一计算域 |\n| 队列双缓冲（4 队列 ×2） | 流水掩盖 | 不需要 constexpr——**勿用 num_stages/autotune**（实测：num_stages 在 Triton-Ascend 运行时不支持、仅 WARNING 不生效；µs 级 kernel 上 autotune 的 do_bench 噪声会误选配置，P4 三组一致拒绝） | 编译器自动流水 |\n| legacy key 1/3/4 | 老平台小 shape/聚集搬出/cast | 丢弃（目标平台 arch35；BF16 由统一 fp32 计算域覆盖） |\n\n## 6. 片上内存预算（详设 §5）\n\n| Ascend C buffer（ABAAndBA，aba_and_ba.h:139-148） | 位置 | 容量表达式 | Triton 等效 tile | 字节数校核（BLOCK_ROWS=8, RD=128 half, fp16） |\n|---|---|---|---|---|\n| qInQueue_/qOutQueue_ | VECIN/VECOUT ×2 | ubFactorB×ubFactorS×ubFactorN×dAlign×T×2 | [BLOCK_ROWS, BLOCK_DH] 输入×2 半 + 输出 tile | 8×64×2B×2×2 ≈ 4KB |\n| cosInQueue_/sinInQueue_ | VECIN ×2 | BA: ubFactorS×dAlign×T；ABA: ×ubFactorB | [BLOCK_DH]×4（c1/c2/s1/s2），全行共享 | 64×2B×4 = 512B |\n| fp32 Reg 计算域 | 寄存器 | — | 计算 tile（编译器分配） | 8×64×4B×~6 ≈ 12KB |\n\n- UB 预算合计：每迭代活跃数据量级 **<32KB** vs UB 192KB/核（Ascend950：AIV 40 核、UB=196608B，tiling UT 实参锚点 `tests/ut/op_host/test_apply_rotary_pos_emb_tiling.cpp:1478`）——富余近两个数量级；BLOCK_N=next_pow2(N) 在 N≤128 时单 tile 覆盖 (b,s) 整组，容量无压力。D≤1024 保证单行 rope 区域 ≤4KB（fp32），整行单次载入无压力。\n- double buffer：源码 4 队列全双缓冲；Triton 侧**勿用 num_stages/autotune**（实测不支持/噪声误选，§5），行循环的 GM 往返由编译器自动流水掩盖；cos/sin 小且经 (b,s) 组级外提后每组只载一次。\n\n## 7. 流水编排与 Triton 可达性（详设 §6 kernel 方案）\n\n### 流水结构\n\n源码三 kernel 同构：外层（S 或 BS 打平）→ 中层（B / N）→ 内层单块 CopyIn→Compute→CopyOut；cos/sin 在能复用的层级载一次（BA 广播：S 段级复用，aba_and_ba.h:185-196；BAB：S 段级，bab.h:135-154）；Compute 按 rotaryMode 分派 VF，fp32 RegTensor 域。Triton 对应（P4 实测收敛）：persistent-core 以 **(b,s) 组为外循环**，组内 load cos/sin 一次 + n 行 tile load x → fp32 计算 → store——**cos/sin 组级外提是单点 +100% 的决定性杠杆，必须显式写**（不能依赖 L1/L2 自然驻留：驻留只省带宽，不省重复 load 的指令与地址计算开销）。\n\n### 可达性判定表\n\n| Ascend C 手段 | 锚点 | 可达性 | Triton 写法 / 降级方案 | 预期影响 |\n|---|---|---|---|---|\n| CopyIn→Compute→CopyOut 核内循环 | aba_and_ba.h:236-244 | ✅ | 行循环内 load→compute→store | 无 |\n| LoopModeParams 多维跨步 DMA（BNSD B→N→S） | aba_and_ba.h:284-291 | ✅ | strides 参数化寻址 `b*sxb+s*sxs+n*sxn` | 无 |\n| DataCopyPad 越界保护 | 各 kernel | ✅ | `tl.load/tl.store(mask=...)` | 无 |\n| TQue 双缓冲 ×4 | aba_and_ba.h:139-148 等 | ⚠️ 编译器自动 | **勿用 num_stages/autotune**：num_stages 在 Triton-Ascend 运行时不支持（WARNING 不生效）；µs 级 kernel autotune do_bench 噪声误选（P4 三组实测一致拒绝） | 交给编译器注流 |\n| MicroAPI DeInterleave/Interleave（interleave 模式奇偶重排） | common.h:272-274, 681-683 | ✅ 已实测定局 | **连续 load + `tl.split(tl.reshape(x,(…,2)))` / `tl.interleave` 寄存器重排**（P4 采纳路径，interleave 7 case 达 4.5~7.0x）。**禁用 strided-2 访存**（de=2i/do=2i+1 两次半宽 load/store）：实测触发两个后端正确性缺陷——① 向量 div/mod 行解码 × strided-2 → 静默错值；② 并发下 masked strided-2 store → 非确定性相邻行污染（grid=1 不复现，并发才出）；另 `InterleaveStatusWithMaskOptimization` pass 对带 mask 的重叠/移位 load 静默丢 mask → 越界。契约细节见 [Triton-Ascend strided-2/interleave 访存契约](../runbooks/memory-sram/triton-ascend-strided2-interleave-contract.md) | 无（连续路径带宽与 half 相当） |\n| MicroAPI UpdateMask 逐 VL 尾处理 | common.h:101 等 | ✅ | `mask = i < pair` 统一 | 无 |\n| RegTensor\\<float\\> 全程 fp32 计算 | common.h 全部 VF | ✅ | `.to(tl.float32)` + 末段 `.to(out_dtype)`（RTNE） | 必须保留（精度） |\n| partial rope 双段搬运（CopyIn/OutHalf/QuarterMode） | common.h:781-877 | ✅ | wrapper `out=x.clone()` + kernel 只写 [0,RD)；或 kernel 内补写直通段 | clone 多一次全量拷贝（RD≈D 时可忽略；RD≪D 时直通占比大，可选 kernel 内直通） |\n| BA 广播 cos/sin 载一次复用 | aba_and_ba.h:185-196 | ✅ **必须显式复刻** | **(b,s) 组级循环不变量外提**：bs 标量外循环 + 组内 cos/sin 只载一次（实测单点 +100%，2.0956→4.2060）；stride_cb=0 处理 B 广播。**勿依赖 L1/L2 驻留自然复用**（只省带宽不省指令，P2 初版判断错误已更正） | 决定性性能杠杆 |\n| Q/K 融合单 launch（UB 复用 cos/sin） | apt.cpp 单入口 | ✅ 不需要 | 两次 launch，L2 覆盖复用 | 省跨界拼接逻辑 |\n| Q/K 跨界块拼接 | ab.h:142-161 | 丢弃 | 两次 launch 后无跨界 | 无 |\n| workspace 16MB / 4095 blockCount 上限 | tiling 各文件 | 丢弃 | Triton 无对应概念 | 无 |\n\n**❌ 不可达项：0 个**。interleave 的 Reg 级重排已由 `tl.split`/`tl.interleave` 寄存器路径实测定局（P4：连续 load + 寄存器重排正确且高效；strided-2 访存路径有后端正确性缺陷，已禁）。\n\n## 8. Triton 骨架（生成用伪码，自包含）\n\n以下为 **P4 实测收敛后的结构**（2026-09-08 三组回放优胜方形态，几何均值 4.2060x）：(b,s) 组外循环 + cos/sin 组级外提 + interleave 寄存器重排。half/quarter/interleave 三分支完整给出：\n\n```python\n@triton.jit  # 无 autotune/num_stages：µs 级 kernel 上实测有害/不生效（§5）\ndef apply_rope_kernel(x_ptr, cos_ptr, sin_ptr, out_ptr,\n                      BS, S, N, RD,                # BS = B*S（TND 时 B=1）\n                      sxb, sxs, sxn,               # x 的 (b,s,n) 元素 stride，layout 归一化\n                      scb, scs,                    # cos/sin 的 (b,s) stride；CosB==1 → scb=0\n                      SEG,                         # half/interleave=RD//2；quarter=RD//4\n                      ROTARY_MODE: tl.constexpr,\n                      BLOCK_N: tl.constexpr, BLOCK_DH: tl.constexpr):\n    pid = tl.program_id(0); num_progs = tl.num_programs(0)\n    per_prog = tl.cdiv(BS, num_progs)            # grid = min(BS, vector_core_num)，persistent-core\n    bs_start, bs_end = pid * per_prog, tl.minimum((pid + 1) * per_prog, BS)\n    nn_idx = tl.arange(0, BLOCK_N)               # BLOCK_N = next_pow2(N)，单 tile 覆盖组内全部 n 行\n    nm = nn_idx < N                              # mask 保持 int32 比较（fp32 导出 mask 实测触发后端污染）\n    i = tl.arange(0, BLOCK_DH)\n    mi = i < SEG\n    for bs in range(bs_start, bs_end):           # (b,s) 标量外循环：解码退化为标量 div/mod，规避后端缺陷面\n        b = bs // S\n        s = bs - b * S                           # kernel 内禁用 % 运算符，写 a-(a//b)*b（MLIR 常量折叠陷阱）\n        x_base = b * sxb + s * sxs + nn_idx * sxn      # [BLOCK_N]\n        c_base = b * scb + s * scs                     # 标量\n        if ROTARY_MODE == HALF or ROTARY_MODE == QUARTER:\n            m = nm[:, None] & mi[None, :]\n            # cos/sin 循环不变量外提：每 (b,s) 组只载一次（决定性杠杆，实测 +100%）\n            c1 = tl.load(cos_ptr + c_base + i,       mask=mi, other=0).to(tl.float32)\n            c2 = tl.load(cos_ptr + c_base + SEG + i, mask=mi, other=0).to(tl.float32)\n            s1 = tl.load(sin_ptr + c_base + i,       mask=mi, other=0).to(tl.float32)\n            s2 = tl.load(sin_ptr + c_base + SEG + i, mask=mi, other=0).to(tl.float32)\n            p1 = x_base[:, None] + i[None, :]; p2 = p1 + SEG\n            x1 = tl.load(x_ptr + p1, mask=m, other=0).to(tl.float32)\n            x2 = tl.load(x_ptr + p2, mask=m, other=0).to(tl.float32)\n            # out1 = x1*c1 - x2*s1 ; out2 = x2*c2 + x1*s2（common.h:111-119）\n            tl.store(out_ptr + p1, (x1 * c1[None, :] - x2 * s1[None, :]).to(out_ptr.dtype.element_ty), mask=m)\n            tl.store(out_ptr + p2, (x2 * c2[None, :] + x1 * s2[None, :]).to(out_ptr.dtype.element_ty), mask=m)\n            if ROTARY_MODE == QUARTER:\n                # 第二对段 (i+2SEG, i+3SEG)，同构（common.h:201-209）；四段 cos/sin 同组外提\n                c3 = tl.load(cos_ptr + c_base + 2*SEG + i, mask=mi, other=0).to(tl.float32)\n                c4 = tl.load(cos_ptr + c_base + 3*SEG + i, mask=mi, other=0).to(tl.float32)\n                s3 = tl.load(sin_ptr + c_base + 2*SEG + i, mask=mi, other=0).to(tl.float32)\n                s4 = tl.load(sin_ptr + c_base + 3*SEG + i, mask=mi, other=0).to(tl.float32)\n                p3 = p1 + 2*SEG; p4 = p1 + 3*SEG\n                x3 = tl.load(x_ptr + p3, mask=m, other=0).to(tl.float32)\n                x4 = tl.load(x_ptr + p4, mask=m, other=0).to(tl.float32)\n                # o3 = x3*c3 - x4*s3 ; o4 = x4*c4 + x3*s4（p4 区段用 s4，勿写成 s3）\n                tl.store(out_ptr + p3, (x3 * c3[None, :] - x4 * s3[None, :]).to(out_ptr.dtype.element_ty), mask=m)\n                tl.store(out_ptr + p4, (x4 * c4[None, :] + x3 * s4[None, :]).to(out_ptr.dtype.element_ty), mask=m)\n        else:  # INTERLEAVE：全程连续 load/store + 寄存器重排（strided-2 已禁用，§7）\n            j = tl.arange(0, 2 * BLOCK_DH)         # 连续覆盖 [0, RD)\n            jm = j < RD\n            m = nm[:, None] & jm[None, :]\n            p = x_base[:, None] + j[None, :]\n            xrow = tl.load(x_ptr + p, mask=m, other=0).to(tl.float32)          # 连续整段\n            crow = tl.load(cos_ptr + c_base + j, mask=jm, other=0).to(tl.float32)\n            srow = tl.load(sin_ptr + c_base + j, mask=jm, other=0).to(tl.float32)\n            xe, xo = tl.split(tl.reshape(xrow, (BLOCK_N, BLOCK_DH, 2)))        # 寄存器级 deinterleave\n            ce, co = tl.split(tl.reshape(crow, (BLOCK_DH, 2)))\n            se, so = tl.split(tl.reshape(srow, (BLOCK_DH, 2)))\n            oe = xe * ce[None, :] - xo * se[None, :]   # out[2i]   = xe*ce - xo*se\n            oo = xo * co[None, :] + xe * so[None, :]   # out[2i+1] = xo*co + xe*so\n            o = tl.interleave(oe, oo)                    # 寄存器重组回连续布局\n            tl.store(out_ptr + p, o.to(out_ptr.dtype.element_ty), mask=m)      # 单次连续 store\n```\n\nwrapper 要点：① 按 layout 取 (b,s,n) 轴 stride（`_LAYOUT_DIMS = {1:(0,1,2), 2:(1,0,2), 3:(0,2,1), 4:(None,0,1)}`，TND 时 B=1/stride_b=0），直接读 `tensor.stride()`；② cos/sin B 广播 → scb=0；③ `SEG = RD//4 if quarter else RD//2`、`BLOCK_DH = next_pow2(SEG)`、`BLOCK_N = next_pow2(N)`；④ partial rope：`RD<D → out = x.clone()`，否则 `empty_like`；⑤ q/k 各一次 launch（融合单 launch 实测劣化，§4）；⑥ grid = `min(B*S, vector_core_num)`，核数动态读禁硬编码；⑦ 全部 `.contiguous()`（对应 AutoContiguous）；⑧ **形状/stride 全部 constexpr 化**（单次 launch 内不变，编译期折叠 mask 与地址强度削减）；⑨ **勿加 @triton.autotune**（µs 级 kernel do_bench 噪声误选，三组实测一致）。完整可运行版（含 wrapper 与自建标杆 golden）为转化工作流的过程产物 `triton_skeleton.py`，结构与本节一致。\n\n## 9. 精度标杆与验收（详设 §测试设计）\n\n- 标杆类别：**benchmark 精确 case 已补建**（ascendc-kernelgen-data `npu_benchmark/ascendc-migration/level2/5_ApplyRotaryPosEmb/`，45 case：{3 模式}×{4 layout}×{fp16,bf16,fp32}×GQA/MQA×{CosB∈{1,B}}×{RD=D, RD<D partial} + zero/inf/nan 特殊值；其 Model golden 与本节自建标杆同舍入序列——全 dtype fp32 计算 + 末段单次 RTNE；2026-09-08 修复其 fp16 原生计算缺陷后，45/45 与「fp32+RTNE 完美 kernel 代理」在 evaluator 真实判定逻辑下互验通过，含 partial 直通段 bitwise 校验）。自建 torch golden 保留用于补边界（D=1024 上界、D 非 2 幂 half 等）。\n- 标杆实现要点（torch golden，fp32 计算域 + 末段单次 RTNE，与 kernel 舍入序列对齐）：\n\n  ```python\n  rot = x[..., :RD].float()\n  emb = rot * cos.float() + rotate(rot, rotary_mode) * sin.float()   # 三模式参数化 rotate\n  out = torch.cat((emb, x.float()[..., RD:]), -1) if RD < D else emb # partial 直通\n  out = out.to(x.dtype)\n  ```\n\n- **算子级验收标准**：\n  - fp32：rtol=1e-5 / atol=1e-5（一乘一加无累加，应接近 bitwise）；\n  - fp16/bf16：对 fp32 标杆 ≤1 ulp（唯一舍入点为末段 RTNE）——**本卡自控线，严于官方**：官方 ST（tests/st/op_api/aclnnApplyRotaryPosEmb/，300 case、V1 锁 half、D∈{64,128}、输入填充 [-1,1]）统一 `fp16_error = 2⁻⁸ = 0.00390625`（high_precision 标准，≈4 ulp@1.0）；验收对线时以官方 2⁻⁸ 为准，1 ulp 用于开发自验；\n  - **官方 golden 的坑**：官方 ST executor（executor_aclnnApplyRotaryPosEmb.py `single_golden`）只把 bf16 升 fp32、fp16 原生计算——它只在 [-1,1] 填充 + 2⁻⁸ 容差组合下安全；自定义 benchmark 若换大量级填充（如 N(±100,25²)）或更严 cap，fp16 原生 golden 会把完美 kernel 误判 FAIL。golden 一律全 dtype 升 fp32（kernel 是 RegTensor\\<float\\> 全域 + 单次 RTNE）；\n  - **模式专项**：half 验前后半场交叉配对；interleave 验奇偶位（构造 x[2i]=1, x[2i+1]=0 类探针）；quarter 验四段；\n  - **partial rope 专项**：[RD, D) 区间输出必须 bitwise 等于输入；\n  - **广播专项**：CosB=1 与 CosB=B 各一遍，结果逐点一致（同一份 cos/sin 内容广播）；\n  - **layout 专项**：同一逻辑 tensor 按 4 种 layout 物化，结果逐点一致。\n- **填充纪律**：对齐官方 ST 实践，输入填充幅度控制在 [-1,1] 量级；fp16/bf16 大量级填充（|v|>~100）会撞 evaluator max_abs_error cap（fp16=0.1/bf16=1.0），即使相对误差达标也误判。\n- **benchmark 语义超集检查**：case 定义域 ⊆ 算子定义域，无超集偏差；覆盖 {3 模式}×{4 layout}×{CosB∈{1,B}}×{RD=D, RD<D}×{3 dtype}（官方 ST 只有 V1 half × D∈{64,128}，interleave/quarter 官方零覆盖，benchmark 是必要补位）；未覆盖项：D=1024 上界、BNSD×CosB=1（tilingkey 20011 路径）、SBND×interleave、BNSD×quarter——由自建标杆补齐。\n- 典型用例 shape：LLM 推理典型值——B∈{1,8}、S∈{1, 2048}、QN∈{32}、KN∈{8}（GQA）、D∈{64,128}、RD∈{D, D/2}；examples/ 下 aclnn V1/V2 样例。**测试资产锚点**：① tiling UT `tests/ut/op_host/test_apply_rotary_pos_emb_tiling.cpp:1459-1607` 含 6 个 Ascend950 用例，期望 key 与本卡分派表完全吻合（BNSD→20010、BSND→20030；小 shape 在 950 也走 AB 20030 而非 legacy key 1，证实优先级链小者先命中），compileInfo 实参锚定 AIV=40 核、UB=196608B；② ST `tests/st/op_api/all_aclnnApplyRotaryPosEmb.json` 300 官方案例（V1 half-only）；③ regbase kernel CPU-sim UT（test_apply_rotary_pos_emb_regbase.cpp）在仓内但**全部注释**，arch35 kernel 无活跃 UT——属已知空白，非提取遗漏。\n- 边界/特殊值用例：D=1024（D_LIMIT 上界）、D 非 2 幂（如 96，half，验证 mask 正确性）、rows=1（单行）、rows 非 BLOCK_ROWS 整数倍、QN≠KN。\n\n## 10. Agent actions（生成指引）\n\n1. 识别算子类别：行独立 elementwise（行内 D 维配对耦合），kernel 类型 **AIV-only**；单 kernel + `ROTARY_MODE: tl.constexpr`，**不要**按源码 4 tilingkey 拆 4 个 kernel（差异仅是循环结构与广播寻址，§5 已给出吸收方式）。\n2. 切分轴：**(b,s) 组为 persistent-core 外循环**（grid = min(B*S, 物理核数)，连续块划分——相邻 bs 共享 cos 行，L2 友好），组内 n 行展开为 [BLOCK_N, BLOCK_DH] tile（BLOCK_N=next_pow2(N)）；**勿用一块一 program 裸 grid，也勿逐行 (b,s,n) 打平循环**（后者丢失 cos/sin 组级复用，实测差一倍）。\n3. layout 处理：wrapper 读 stride 传参，kernel 内零 layout 分支；TND → B=1。\n4. BLOCK 静态规则：BLOCK_N = next_pow2(N)（N>128 时 128 + 内层循环）、BLOCK_DH = next_pow2(SEG) 固定（D≤1024 → SEG≤512，§6 校核富余）。**勿挂 @triton.autotune、勿设 num_stages**——µs 级 kernel 上 autotune 的 do_bench 噪声会误选配置（P4 实测：autotune 轮 4.1228 < 静态轮 4.2060；对照组另证实 µs 级 kernel 误选）；num_stages 在 Triton-Ascend 运行时不支持（WARNING 不生效）。\n5. 精度提升点：**任何 dtype 都 `.to(tl.float32)` 计算、末段单次 `.to(out_dtype)` RTNE 回写**——多一次中间舍入即可能超 1 ulp 验收线（对齐 common.h RegTensor\\<float\\> 全域）。\n6. 属性/形态两态指引（不给绝对禁令）：rotary_mode、layout 在 GEIR 语境是编译期常量，Triton 侧 ROTARY_MODE 用 constexpr 顺理成章；layout 的 stride 参数化是运行时值（同一 kernel 服务多 layout），无需 constexpr 化。interleave 的访存形态**已定局（非两态）**：连续 load + tl.split/tl.interleave 寄存器重排；strided-2 两次半宽 load/store 因后端正确性缺陷**禁用**（§7）。in-place 两态：源码是原地更新语义（图级证据：op_graph/fusion_pass 的 tensormove pass 专门消除喂给本算子的 TensorMove 拷贝）——Triton wrapper 可选 `out=x` 真原地写（RD<D 时 kernel 只写 [0,RD)，直通段天然不动）；默认仍用 clone/empty_like 出参，避免 benchmark/调试语境的输入变异副作用。\n7. 不可达点：无 ❌；勿在 Triton 中复刻 LoopModeParams 多级 DMA 配置、4095 blockCount 分片、workspace 管理——strides/mask/编译器已覆盖。\n8. 「勿复刻」清单：① 4 kernel 类分派；② Q/K 跨界块拼接（ab.h:142-161）与 N 合并轴（tiling_ab L73-82）——两次 launch 后不存在；③ legacy key 1/3/4 与 BF16 cast 模板参。**（已移出）**BA/BAB 的 cos/sin「载一次复用」——P2 初版误判为「stride_cb=0 + cache 驻留等价」列入勿复刻，P4 实测显式 (b,s) 组级外提是 +100% 决定性杠杆，**必须复刻其语义**（仅不必复刻其显式队列管理形式）。\n9. partial rope：默认 wrapper clone 保底直通段；RD≪D 且性能敏感时改 kernel 内直通写回，注意两写区域不重叠。\n10. 验收按 §9 标准执行（自建标杆 + 模式/广播/layout/partial 四专项 + 填充幅度 [-1,1] 纪律）。\n\n## 11. 复现性声明\n\n本卡由 Ascend C 源码静态分析转化，过程产物：zmm_source_retrieval `ascendc_to_okf_workflow/output/apply_rotary_pos_emb/{manifest,extraction,mapping}.md` + `triton_skeleton.py`。**P4 双盲回放已完成（2026-09-08，confidence 升 verified）**：三组对照全 45/45 通过，终点单调——直给卡组 **4.2060x** > KB 检索组 3.5789x > 无知识对照组 3.1749x（验证报告随工作流落盘 `validation_report.md`）。P4 实测核销/更正项：① interleave 访存形态——strided-2 有后端正确性缺陷（静默错值/并发 store 污染），连续 load + tl.split/tl.interleave 寄存器重排正确且高效，§7/§8 已定局；② BLOCK autotune/num_stages——µs 级 kernel 上实测有害/不生效，已改静态规则；③ 奇偶交织 store 的 DMA 合并问题——随 strided-2 禁用而消解；④ bf16 `.to(tl.float32)` 精度路径——45 case 含 bf16 全过，与 golden 互验一致；⑤ cos/sin 复用——P2 初版「cache 驻留等价」判断错误，实测显式组级外提 +100%，§7/§8/§10 已更正。仍未实测：legacy 平台差异节为源码对照，未在 910b 实测。\n\n\n", "ops/elementwise-add.md": "\n\nsources:\n  - url: https://gitcode.com/gcw_85ZVbQ4M/Triton-Ascend-KernelWiki/blob/7d6a67e7f71d1bfb7cc51f66ae139c34ace40e9d/kernelwiki/wiki/kernels/elementwise-add.md\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/elementwise-add.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/gcw_85ZVbQ4M/Triton-Ascend-KernelWiki/blob/7d6a67e7f71d1bfb7cc51f66ae139c34ace40e9d/kernelwiki/wiki/kernels/elementwise-add.md](https://gitcode.com/gcw_85ZVbQ4M/Triton-Ascend-KernelWiki/blob/7d6a67e7f71d1bfb7cc51f66ae139c34ace40e9d/kernelwiki/wiki/kernels/elementwise-add.md)。\n\n# Elementwise add\n\nBuild one-dimensional offsets from the program id and block size. Use `offsets < n` on all loads and the final store. If accumulation or nonlinear work is sensitive, compute the intermediate value in FP32 before conversion.\n\n\n", "ops/fused-bias-leaky-relu.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-nn/tree/2d727e96866daa3418f16b7ccd743a5f0c5e9f62/activation/fused_bias_leaky_relu\n    role: primary\n  - url: https://gitcode.com/cann/ops-nn/blob/2d727e96866daa3418f16b7ccd743a5f0c5e9f62/activation/fused_bias_leaky_relu/examples/test_geir_fused_bias_leaky_relu.cpp\n    role: example\n\n> 迁移备注：本卡由 AscendC→OKF 转化工作流（zmm_source_retrieval/ascendc_to_okf_workflow，P0~P3 产出，过程产物在 `output/fused_bias_leaky_relu/`）适配入库，分析对象为 `cann/ops-nn` 仓 `activation/fused_bias_leaky_relu` 的本地快照（@2d727e9，行号锚点以快照为准）。status: draft / confidence: inferred，未硬件实测；P4 双盲回放验证待执行。与 [Elementwise add with a tail mask](elementwise-add.md) / [Add（broadcast 逐元素加 + alpha）](add-broadcast-alpha.md) 分工：那两张讲 elementwise 通用范式与广播+alpha 语义，本卡讲等形无广播的 activation 融合（bias + LeakyReLU + scale）与「无不可达项」的最简转化实例。\n\n# FusedBiasLeakyRelu（偏置 + LeakyReLU + 缩放融合）\n\n对输入 x 加**等形**偏置 bias（无广播），施加 LeakyReLU（负半轴斜率 negative_slope），再整体乘缩放因子 scale。纯 elementwise 三输入输出等形（2 入 1 出），**AIV-only**（kernel 仅 Vector 指令 Add/LeakyRelu/Muls + Cast，tiling 取 `GetCoreNumAiv()`，fused_bias_leaky_relu_tiling_arch35.cpp:50）。**非壳算子**：kernel 本体（192 行）与 tiling（218 行）全量在仓内，单模板类 `FusedBiasLeakyRelu<T, BUFFER_MODE>`，无 base 库依赖。**仅 GEIR 图模式入口**（无 op_api/aclnn 层），**仅 arch35/ascend950 一套实现**（def.cpp:53），全套文件为 CANNBot 生成。语义分层：GEIR kernel 本体即全部语义；aclnn 层不存在；benchmark 库未收录（验收标杆须自建，见 §9）。\n\n## 1. 功能与公式（详设 §1.1）\n\n- 功能：`y = LeakyRelu(x + bias, negative_slope) * scale`，兼容 mmcv `FusedBiasLeakyrelu`（proto 注释 fused_bias_leaky_relu_proto.h:39）。\n- 计算公式（README.md:19-25）：\n\n$$\ny = \\begin{cases} (x+bias)\\cdot scale, & x+bias \\ge 0 \\\\ (x+bias)\\cdot negative\\_slope \\cdot scale, & x+bias < 0 \\end{cases}\n$$\n\n  x/bias/y 同 shape（≤8 维 ND）；negative_slope 默认 0.2；scale 默认 1.414213562373（√2）。\n- **语义分层**：GEIR kernel 本体 = 上式（属性经 tilingdata 以 runtime 标量透传，tiling_data.h:25-26 → kernel fused_bias_leaky_relu.h:93-94）；aclnn 层**不存在**；benchmark 层**未收录**，无超集偏差。\n- 计算流程概述（kernel Compute，fused_bias_leaky_relu.h:146-175）：\n  1. fp16 路径：`Cast(x/bias → fp32, CAST_NONE 精确)`；fp32 路径跳过\n  2. `t = x + bias`（fp32 Add）\n  3. `u = LeakyRelu(t, negative_slope)`（fp32；t=0 时两分支同值 0，文档 `>`/`≥` 表述差异无影响）\n  4. `y = u * scale`（fp32 Muls 标量广播）\n  5. fp16 路径：`Cast(y → fp16, CAST_ROUND=RTNE)` 单次舍入回写\n- 锚点：`op_kernel/arch35/fused_bias_leaky_relu.h:158-169`\n\n## 2. 原型与约束（详设 §2 / §2.1）\n\n### 输入输出（来源：`op_host/fused_bias_leaky_relu_def.cpp:24-41`）\n\n| 参数名 | 入参类型 | 必选性 | dtype | format | shape | 语义 |\n|---|---|---|---|---|---|---|\n| x | 输入 | 必选 | FLOAT16 / FLOAT | ND | 0-8 维 | 主输入，支持空 tensor |\n| bias | 输入 | 必选 | FLOAT16 / FLOAT | ND | 与 x **完全相同**（无广播） | 偏置 |\n| y | 输出 | 必选 | FLOAT16 / FLOAT | ND | 与 x 相同 | 输出 |\n\n三者均 `.AutoContiguous()`（def.cpp:29/35/41）——非连续输入由框架转连续，kernel 只处理连续 ND。\n\n### 属性\n\n| 属性 | 类型 | 默认值 | 语义 |\n|---|---|---|---|\n| negative_slope | float 可选 | 0.2 | LeakyReLU 负半轴斜率（def.cpp:42） |\n| scale | float 可选 | 1.414213562373 | 整体缩放因子（def.cpp:43） |\n\n### 原型约束\n\n- shape 边界：dim ≤ 8（tiling_arch35.cpp:60-80）；x/bias/y 三者元素总数相等校验（L86-90）；infershape 直接复制 x 形状（infershape.cpp:32）。\n- 值域边界：属性任意 float，无范围校验（L117-120 仅空指针取默认）。\n- 输入间依赖：x 与 bias dtype 必须一致（L110-113）。\n- 拦截校验：全部在 tiling host 侧 OP_CHECK；空 tensor（totalNum=0）合法走短路（L155-164）。\n- **文档偏差**：proto 声明 dtype 含 DT_DOUBLE（fused_bias_leaky_relu_proto.h:42-46），kernel/def 无 double 路径——以 def.cpp 为准。\n\n## 3. 规格约束（详设 §3）\n\n| 类别 | 取值 | 来源锚点 |\n|---|---|---|\n| 支持 NPU 型号 | 仅 ascend950（arch35） | def.cpp:53（README 产品支持表列 A2/A3 等为文档表述，以 def 为准） |\n| dtype 全集 | FLOAT16、FLOAT（三参数同型） | def.cpp:26-38 |\n| format | ND | def.cpp:27-40 |\n| 确定性计算 | 是（纯 elementwise，无规约/atomic/workspace，WS_SYS_SIZE=0） | tiling_arch35.cpp:34 |\n| 交付形式 | GEIR 图模式（REG_OP）；无 aclnn | README.md:116；examples/test_geir_fused_bias_leaky_relu.cpp |\n\n### 架构差异（arch22 vs arch35）\n\n不涉及——仅 arch35 一套 kernel（def.cpp 只注册 ascend950，op_kernel 仅 arch35 目录）。\n\n## 4. 分核策略（详设 §4.1.1 → Triton grid 设计）\n\n- Ascend C 事实：整体打平一维，按元素数静态均分 AIV 核——`blockFactor = CeilAlign(CeilDiv(totalNum, coreNum), 32B/typeSize)`、`usedCoreNum = CeilDiv(totalNum, blockFactor)`（tiling_arch35.cpp:166-170, 199）；kernel 侧 `blockOffset = GetBlockIdx()*blockFactor`、末核少载/空载由 `blockLength_ = min(blockFactor, totalNum-blockOffset)` 与 `blockLength_<=0 return` 兜底（fused_bias_leaky_relu.h:79-81, 114-116）。\n- **Triton 决策**（2026-09-07 P4 回放修订：初版「一块一 program、grid=NUM_BLOCKS」实测为次优起点，被生成器优化循环修掉；改回与源码结构同构的 persistent-core 范式）：\n  - 任务轴选择：打平后的一维元素轴（唯一轴；elementwise 无规约轴）。\n  - 任务块总量公式：`NUM_BLOCKS = CeilDiv(numel, BLOCK)`；**grid = min(NUM_BLOCKS, vector_core_num)**——grid 超过物理核数的部分在 NPU 上串行排队，调度开销实测可观（对照实验 case6 grid=123 vs 40 核时仅 0.69x）。\n  - 核分配范式（**persistent-core + 核内连续段循环**，即源码 blockFactor/ubFactor 两级切分的忠实映射：每核一段连续区间，核内按 BLOCK 流水迭代）：\n\n    ```python\n    pid = tl.program_id(0)\n    num_progs = tl.num_programs(0)          # 与 host grid 一致\n    total_blocks = tl.cdiv(numel, BLOCK)\n    per_prog = tl.cdiv(total_blocks, num_progs)\n    start_block = pid * per_prog\n    end_block = tl.minimum(start_block + per_prog, total_blocks)\n    for blk in range(start_block, end_block):   # 连续区间，禁止交织划分\n        offs = blk * BLOCK + tl.arange(0, BLOCK)\n        mask = offs < numel                      # 尾块统一 mask，无单独尾分支\n        ...\n    ```\n\n  - 核数动态读取（`torch_npu.npu.npu_config.get_device_limit`），禁止硬编码。\n  - 空 tensor：wrapper `if numel == 0: return out`（对应 host 短路 tiling_arch35.cpp:155-164）。\n\n## 5. BLOCK / Tiling 参数（详设 §4.1.2 / §4.1.3）\n\n### Ascend C tilingdata → Triton 超参映射\n\n| tilingdata 字段 | 语义 | host 侧计算式 | Triton 对应 | 候选值/推导式 |\n|---|---|---|---|---|\n| totalNum | 打平总元素数 | x ShapeSize（tiling L92） | `numel` 形参 | wrapper `x.numel()` |\n| blockFactor | 每核处理量（32B 对齐） | CeilAlign(CeilDiv(totalNum,coreNum), 32B/typeSize)（L169） | persistent-core 的 per_prog 段长（kernel 内 cdiv 计算） | — |\n| ubFactor | 单循环 UB 元素数 | fp32: FloorAlign(ubSize/4/queueBufNum, 8)；fp16: FloorAlign(ubSize/(queueBufNum·2+12), 16)（L184-191） | `BLOCK: tl.constexpr` | {2048, 4096, 8192}，对齐 128；参考量级 ubSize/24B ≈ 8K@192KB |\n| negativeSlope | 属性透传 | attrs 缺省 0.2（L117-118） | kernel runtime 标量形参 | wrapper 注入 |\n| scale | 属性透传 | attrs 缺省 1.414213562373（L119-120） | kernel runtime 标量形参 | wrapper 注入 |\n| 尾块 tailNum_ | blockLength % ubFactor | kernel h:89-90 | `mask = offs < numel` | 主尾统一 |\n\n### tilingkey / 模板分支 → constexpr\n\n| tilingkey 位 / 模板分支 | 分支语义 | Triton 处理 |\n|---|---|---|\n| BUFFER_MODE ∈ {0,1}（tiling_key.h:26-28；host 判定 loopCountIfDouble≥2，tiling L177-179） | 队列双缓冲开关 | 不需要 constexpr——编译器注流语义，由 autotune `num_stages ∈ {2,3,4}` 覆盖 |\n| DTYPE_X 宏（fp16/fp32 两实例） | dtype 模板分派 | **单 kernel**：指针 dtype 自动分派 + `.to(tl.float32)` 统一计算路径（fp32 输入 cast 为恒等，编译器消除） |\n\n## 6. 片上内存预算（详设 §5）\n\n| Ascend C buffer | 位置 | 容量表达式 | Triton 等效 tile | 字节数校核（BLOCK=8192） |\n|---|---|---|---|---|\n| inputQueueX / inputQueueBias | VECIN | ubFactor×sizeof(T)×BUFFER_NUM（h:56-57, 101-102） | 两次 `tl.load` 的 [BLOCK] tile | fp16: 2×16KB×2(dbuf)=64KB |\n| outputQueueY | VECOUT | ubFactor×sizeof(T)×BUFFER_NUM（h:58, 103） | `tl.store` tile | fp16: 16KB×2=32KB |\n| xFp32/biasFp32/yFp32 TBuf | VECCALC | ubFactor×4B×1，仅 fp16（h:59-61, 104-108） | 计算寄存器（编译器分配） | 3×32KB=96KB |\n\n- UB 预算合计：host 公式按「打满 ubSize」反解 ubFactor（每元素开销 fp16 双缓冲 24B、fp16 单缓冲 18B、fp32 双缓冲 24B、fp32 单缓冲 12B）；Triton BLOCK=8192 fp16 峰值约 96KB（队列双缓冲）+ 计算 tile ≈ 192KB 上限内但偏紧，**autotune 上限建议 8192**。结论：BLOCK ≤ 8192 有富余，16384 需降 num_stages 权衡。\n- double buffer 使用：三条 TQue 队列（BUFFER_NUM=2 当 BUFFER_MODE=1）；cast TBuf 恒单份（tiling L186 注释）。Triton 侧由 num_stages 覆盖，约束：「两次 GM load + 一次 GM store 的往返值得双缓冲掩盖」。\n\n## 7. 流水编排与 Triton 可达性（详设 §6 kernel 方案）\n\n### 流水结构\n\nAscend C：主循环 `for i in [0, loopCount_): CopyIn(i) → Compute → CopyOut(i)` + 单次尾块（fused_bias_leaky_relu.h:117-126）；CopyIn 双路 DataCopyPad（stride=0、不补零、越界保护，h:134-143），CopyOut 单路 DataCopyPad（h:180-187）；TQue EnQue/DeQue 自动事件同步，无手工 SetFlag/WaitFlag；无 Reg gather/scatter、无 NZ、无 CV 交互——纯向量直通。\n\n### 可达性判定表\n\n| Ascend C 手段 | 锚点 | 可达性 | Triton 写法 / 降级方案 | 预期影响 |\n|---|---|---|---|---|\n| DataCopyPad（GM↔UB，越界保护） | h:140-141, 186 | ✅ | `tl.load(ptr+offs, mask=offs<numel)` / `tl.store(..., mask=...)` | 无 |\n| 三段式 CopyIn/Compute/CopyOut 循环 | h:117-126 | ✅ | load→compute→store 单 BLOCK 内天然三段 | 无 |\n| TQue 双缓冲（buffer_num=2） | h:56-58, 39 | ⚠️ 编译器自动 | `num_stages` autotune 候选 {2,3,4}；卡片只约束「GM 往返需掩盖」 | 编译器注流质量决定 |\n| TPipe EnQue/DeQue 事件同步 | h:142-143, 172-174 | ⚠️ | 丢弃，编译器自动插同步 | 无 |\n| host useDoubleBuffer 判定公式 | tiling L177-179 | 丢弃（语义保留） | num_stages 候选空间覆盖「能循环≥2 次才双缓冲」策略 | 无 |\n| blockFactor 32B 对齐（ubBlockSize） | tiling L166-169 | 丢弃 | BLOCK 对齐 128 覆盖 DMA 粒度语义 | 无 |\n\n**本算子不可达项（❌）：0 个**——无 Reg API、无手工同步、无 NZ、无 bank 冲突规避手段。\n\n## 8. Triton 骨架（生成用伪码）\n\n完整可运行版见工作流 `output/fused_bias_leaky_relu/triton_skeleton.py`；核心：\n\n```python\n@triton.autotune(configs=[triton.Config({\"BLOCK\": b}, num_stages=s)\n                          for b, s in [(1024, 2), (2048, 2), (4096, 3), (8192, 3), (16384, 4)]],\n                 key=[\"numel\"])\n@triton.jit\ndef fused_bias_leaky_relu_kernel(x_ptr, bias_ptr, y_ptr, numel,\n                                 negative_slope, scale, BLOCK: tl.constexpr):\n    # persistent-core：grid = min(cdiv(numel, BLOCK), vector_core_num)，核内连续段循环\n    pid = tl.program_id(0)\n    num_progs = tl.num_programs(0)\n    total_blocks = tl.cdiv(numel, BLOCK)\n    per_prog = tl.cdiv(total_blocks, num_progs)\n    start_block = pid * per_prog\n    end_block = tl.minimum(start_block + per_prog, total_blocks)\n    for blk in range(start_block, end_block):\n        offs = blk * BLOCK + tl.arange(0, BLOCK)\n        mask = offs < numel\n        x = tl.load(x_ptr + offs, mask=mask).to(tl.float32)     # Cast CAST_NONE 精确提升\n        b = tl.load(bias_ptr + offs, mask=mask).to(tl.float32)\n        t = x + b                                               # Add\n        u = tl.where(t >= 0, t, t * negative_slope)             # LeakyRelu\n        y = u * scale                                           # Muls\n        tl.store(y_ptr + offs, y.to(y_ptr.dtype.element_ty), mask=mask)  # RTNE 回写\n```\n\nwrapper 要点：`assert x.shape == bias.shape`（无广播）；`x.contiguous()`（对应 AutoContiguous）；`numel == 0` 短路返回；grid = `min(CeilDiv(numel, BLOCK), vector_core_num)`（核数动态读 `torch_npu.npu.npu_config`，禁硬编码）；属性作 runtime 标量传入；输出 `torch.empty_like(x)`。\n可选强度折减：`y = t * tl.where(t >= 0, scale, scale * negative_slope)`（2 步替代 3 步）——数学等价但浮点舍入序列不同（`(t*ns)*scale` vs `t*(ns*scale)`），默认不启用以保持与标杆逐点对齐。\n\n## 9. 精度标杆与验收（详设 §测试设计）\n\n- 标杆类别：**自建单标杆**（benchmark 库未收录本算子——ascendc-kernelgen-data `npu_benchmark/level1` 与 `ascendc-migration` 2026-09-07 全库检索无 fused_bias_leaky_relu/leaky 条目；源码侧亦无标杆脚本）。\n- 标杆实现要点（torch golden，与 kernel 舍入序列逐点对齐）：\n\n  ```python\n  t = x.float() + bias.float()                                   # fp32 计算域\n  ref = torch.where(t >= 0, t, t * negative_slope) * scale\n  ref = ref.to(x.dtype)                                          # 末段 RTNE\n  ```\n\n- **算子级验收标准**：\n  - fp32：rtol=1e-6 / atol=1e-6 全通过（kernel 与标杆同序计算，应 bitwise 接近）；\n  - fp16：对「fp32 计算 + RTNE 回写」标杆 ≤ 1 ulp（唯一舍入点在末段 cast）；\n  - 分段边界专项：构造 x+bias 精确等于 0 的元素，输出必须为 0（两分支同值性质）；\n  - 属性变体：ns=0（退化为 ReLU×scale）、scale=1.0、ns=0.5（对齐 kernel UT 用例）。\n- **benchmark 语义超集检查**：无 benchmark case，无超集；若后续补建 case，须覆盖 {fp16, fp32} × {非默认属性} × {非 32B 对齐 numel}。\n- 典型用例 shape：GEIR 示例 (2,4)；kernel UT totalNum ∈ {8, 1024, 8192, 65536}（tests/ut/op_kernel/test_fused_bias_leaky_relu.cpp:74-135）。\n- 边界/特殊值用例：numel=8（非 32B 对齐、单块尾）、numel=65536（双缓冲域）、空 tensor、x+bias 跨零点混合分布。\n\n## 10. Agent actions（生成指引）\n\n1. 识别算子类别：elementwise 融合（2 入 1 出等形、无广播），kernel 类型 **AIV-only**。\n2. 切分轴：打平一维元素轴；**persistent-core**：grid = min(CeilDiv(numel, BLOCK), 物理核数），核内连续段循环 + 尾块 mask（§4；勿用一块一 program 的裸 NUM_BLOCKS grid，NPU 上超额 block 串行排队）。\n3. BLOCK 候选 {2048, 4096, 8192} + num_stages {2,3,4}，UB 校核见 §6（峰值 24B/elem）；benchmark 场景可把候选扩到 {1024..16384} 两端（小 shape 回落 1024、大 shape 试 16384）。\n4. 精度提升点：**fp16 输入必须 `.to(tl.float32)` 全程计算、末段单次 `.to(fp16)` RTNE 回写**——多一次中间舍入即可能超 1 ulp 验收线。\n5. 属性 negative_slope/scale：**默认 runtime 标量形参**（生产语义，对应 tilingdata 透传）；**benchmark/属性编译期稳定的场景可改 `tl.constexpr`** 换常量折叠（scale=1.0 时消去 Muls，P4 实测单项 +17.3%），注意属性每变一次触发一次重编译——GEIR 语境下属性本来就是编译期常量，constexpr 更贴近源码执行模型。\n6. 不可达点：无。勿在 Triton 中复刻 host 双缓冲判定公式与 32B 对齐逻辑（编译器/128 对齐已覆盖）。\n7. 「勿复刻」清单：本算子无 aclnn 分解、无多 kernel 策略，清单为空；唯二需主动丢弃的是 useDoubleBuffer 判定与 ubBlockSize 对齐（见 §7 表末两行）。\n8. 强度折减 `t * where(t>=0, scale, scale*ns)` 默认不启用；追求指令数时启用并在报告中注明舍入序列变化。\n9. 验收按 §9 标准执行（自建标杆 + 边界专项）。\n\n## 11. 复现性声明\n\n本卡由 Ascend C 源码静态分析转化（confidence: inferred），过程产物：zmm_source_retrieval `ascendc_to_okf_workflow/output/fused_bias_leaky_relu/{manifest,extraction,mapping}.md` + `triton_skeleton.py`。未经硬件实测的点：① Triton-Ascend 编译器对本 kernel 的注流质量（num_stages 实际收益）；② BLOCK=8192 fp16 的 UB 实测占用（§6 为静态估算）；③ `LeakyRelu` 向量指令与 `tl.where(t>=0, t, t*ns)` 在特殊值（±0、denormal、inf/nan）上的逐点一致性——tl.where 语义按公式推导，未对硬件指令真值表实测。\n回放验证：已做（2026-09-07 双盲对照，详见工作流 `output/fused_bias_leaky_relu/validation_report.md`）——对照组（无知识）4.5231x / KB 检索组 4.3725x / 直给卡组 5.2816x，三组首轮 verify 均 10/10。结论：本算子过简，对照组已撞正确性天花板，卡片正确性增益≈0；性能主增量来自生成器优化循环。卡片 §4/§8/§10 据此修订（grid 改 persistent-core、BLOCK 候选扩 {1024..16384}、属性补 constexpr 变体——constexpr 单项实测 +17.3%），confidence 维持 inferred。\n\n\n", "ops/lightning-indexer.md": "\n\nsources:\n  - url: https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/lightning_indexer/\n    role: primary\n\n> 迁移备注：本卡由 A 的 `kernelwiki/wiki/kernels/lightning-indexer.md` 迁移而来，原始为 CANN 源码静态分析，status: active / confidence: inferred，未硬件实测。资源 pinned 到 [https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/lightning_indexer/](https://gitcode.com/cann/ops-transformer/tree/d28d8f99a8858b71caa27a535da32bb5ba68ce2a/attention/lightning_indexer/)。\n\n# LightningIndexer（稀疏注意力索引选择器）\n\nCANN ops-transformer 的 `LightningIndexer` 是稀疏注意力（SparseFlashAttention）的**索引选择器**：根据 Q_index 和 K_index 计算重要性分数，经 ReLU 激活和 weights 缩放后，topK 选出每个 token 对应的最重要 KV 位置（sparse_indices），供下游稀疏注意力算子使用。来源见 `ops-transformer-lightning-indexer`。\n\n## 1. 输入输出\n\n### 输入（def.cpp L23-37；README L39-53）\n\n| 输入 | 必选/可选 | dtype | shape |\n|---|---|---|---|\n| query | 必选 | FP16/BF16 | BSND`[B,S1,N1,D]`/TND`[T1,N1,D]`，N1≤64 |\n| key | 必选 | FP16/BF16 | BSND`[B,S2,N2,D]`/TND`[T2,N2,D]`/PA_BSND`[block_count,block_size,N2,D]`，N2=1 |\n| weights | 必选 | FP16/BF16/FP32 | `[B,S1,N1]`/`[T1,N1]` |\n| actual_seq_lengths_q | 可选 | INT32 | `[B]`，TND 必选 |\n| actual_seq_lengths_k | 可选 | INT32 | `[B]`，TND/PA 必选 |\n| block_table | 可选 | INT32 | `[B, maxBlockNumPerSeq]`，PA 场景 |\n\n### 输出（README L74-77）\n\n| 输出 | dtype | shape |\n|---|---|---|\n| sparse_indices | INT32 | `[B,S1,N2,sparseCount]`/`[T1,N2,sparseCount]` |\n| sparse_values | FP16/BF16 | 同 sparse_indices shape（可选，return_values=True） |\n\n### 属性（def.cpp L61-67）\n- layout_query（BSND/TND）、layout_key（BSND/TND/PA_BSND）、sparse_count（2048，最高 8192）、sparse_mode（0/3 rightDownCausal）、pre_tokens/next_tokens（仅 INT64_MAX）、return_values（False）。\n\n## 2. 核心公式\n\n`Indices = Top-k( [1]_{1×g} @ [(W @ [1]_{1×S_k}) ⊙ ReLU(Q_index @ K_index^T)] )`\n\n即：Q·K^T → ReLU（负数置 0）→ weights 缩放 → g 组求和 → topK 选择最重要的 sparse_count 个位置。\n\n## 3. 架构支持\n\nA2（Ascend910B1）√、A3（Ascend910_93）√；训练+推理。\n\n## 4. 复现性声明\n\n本页结论基于源码静态分析（confidence: inferred）。Triton skeleton 标记 `reproducibility: pseudocode`。\n\n\n", "runbooks/algorithm-numerics/atomic-add-cross-tile-reduction.md": "\n\n## OPT-3 跨 tile 归约 tl.atomic_add 原语\n\n【优化维度】：算法｜跨 Block 归约\n【泛化层级】：条件性（迁移条件：spatial 维度被拆为多 tile 且 tile 间需合并部分和；失效边界：大 batch 大 channel 场景 atomic 冲突成为性能瓶颈，需改用 per-channel 独立 reduction kernel）\n\n<原则：tl.atomic_add 是当前 Triton-Ascend 上最可靠的跨 tile 归约原语；spatial 维度拆为多 tile 后，tile 间必须合并，atomic_add 无需显式同步即可完成跨核累加。弥补 Ascend 缺少 CUDA __shfl_sync Warp 同步机制的不足。与 [[two-pass-reduce-then-apply]] 的双 kernel split 形式配套。>\n\n<骨架（占位名伪码）：\n# reduce kernel：每 tile 计算部分和，atomic_add 聚合\ns1_raw = tl.sum(grad_out * mask)\ns2_raw = tl.sum(grad_out * x_centered * mask)\ntl.atomic_add(partial_s1_ptr + workUnitIdx, s1_raw)\ntl.atomic_add(partial_s2_ptr + workUnitIdx, s2_raw)\ntl.atomic_add(grad_bias_ptr + channelIdx, s1_raw)\ntl.atomic_add(grad_weight_ptr + channelIdx, s2_raw * inv_std)\n>\n\n**坏实践（反例）**：试图用单线程串行归约替代 atomic_add\n```python\n# 单线程串行处理全部 spatial，无跨 tile 并行\nfor s in range(0, S, 1):           # 标量循环，spatial 大时严重拖慢\n    s1 += grad_output[s]\n```\n后果：spatial 大时单线程负载过重，无法利用多核 tile 级并行。✅ 正解即本条 atomic_add 跨 tile 聚合。\n\n**已知实例**：AdaptiveInstanceNorm2DBackward §1 N4 / §3.3 L3.1（`triton-op-generator/template/normalization.md`）\n\n\n", "runbooks/algorithm-numerics/exp-stable-softmax-rmsnorm.md": "\n\n## CT-12 exp 稳定化 — softmax/rmsnorm 必须减最大值、fp32 累加\n\n【优化维度】：数值｜数值稳定\n【泛化层级】：Triton通用（迁移条件：所有含 exp、sum、mean、var、rsqrt 的算子；失效边界：输入已被证明绝对值极小且不会溢出时可放宽，但仍建议统一处理）\n\n<原则：fp16 的 `exp(x)` 在 x > 65504 时溢出为 Inf。softmax、attention score、rmsnorm 等算子若直接 `tl.exp(x)` 再求和，结果会 NaN/Inf。正确做法是先把输入减去最大值（数学等价，结果不变），并在 fp32 中完成累加/归约，最后 cast 回 fp16/bf16。>\n\n**softmax 稳定化模板**：\n\n```python\n# 错误：直接 exp\np = tl.exp(x)\ns = tl.sum(p)\n\n# 正确：减最大值 + fp32 累加\nx_fp32 = x.to(tl.float32)\nm = tl.max(x_fp32, axis=0)\np = tl.exp(x_fp32 - m)          # 最大值为 0，不会溢出\ns = tl.sum(p)                   # fp32 累加\nout = (p / s).to(tl.float16)    # 最终 cast 回低精度\n```\n\n**rmsnorm 稳定化模板**：\n\n```python\n# 错误：fp16 累加 + 1/sqrt\nacc = tl.zeros([BLOCK], dtype=tl.float16)\nacc += x * x\ninv_rms = 1.0 / tl.sqrt(mean_sq + eps)\n\n# 正确：fp32 累加 + rsqrt\nx_fp32 = x.to(tl.float32)\nmean_sq = tl.sum(x_fp32 * x_fp32) / N\ninv_rms = tl.rsqrt(mean_sq + eps)   # 比 1/sqrt 精度更好\nout = (x_fp32 * inv_rms * weight).to(tl.float16)\n```\n\n**数值边界**：\n\n| 操作 | fp16 危险区 | 安全做法 |\n|---|---|---|\n| `tl.exp(x)` | x > 11.09（ln(65504)）即可能溢出 | x - max(x) 后再 exp |\n| `tl.sum(fp16)` | 累加多个 fp16 会精度损失/溢出 | fp32 累加器 |\n| `1/tl.sqrt(x)` | 小 x 下精度差 | `tl.rsqrt(x)` |\n| `x / denom` | denom 可能为 0 | `tl.maximum(denom, eps)` |\n\n**坏实践（反例）**：\n```python\np = tl.exp(x)\ns = tl.sum(p)\nout = p / s\n```\n后果：fp16 下大值 exp 溢出为 Inf，softmax 输出 NaN，训练直接崩溃。✅ 正解即减最大值 + fp32 累加。\n\n**诊断清单**：\n1. 模型训练出现 NaN/Inf，优先检查所有 softmax/rmsnorm/attention 算子。\n2. 确认 kernel 内是否有 `tl.exp` 直接作用于原始输入。\n3. 确认归约/累加是否使用 fp32 accumulator。\n4. 用 fp32 参考实现对比，定位首个误差超阈值的位置。\n5. 修复后做 full-sequence 精度回归。\n\n## 已知实例（P3 挂载）\n\n### Experience YAML 反链\n- `exp_stability_001` — 数值稳定性优化 （收益 数值稳定性提升100%）\n  - 适用于所有包含指数运算的场景（如Softmax、注意力分数计算），fp16/bf16下未做该处理易出现exp(>65504)返回Inf，910b2/910b3平台需强制启用该优化\n- `exp_stability_002` — 数值稳定性优化 （收益 数值稳定性提升95%）\n  - 适用于Attention的sqrt(d_k)、均方差计算、梯度平方根等场景；910b2/910b3平台的硬件sqrt指令对负数输入直接返回NaN，必须前置该防护逻辑\n- `exp_stability_003` — 数值精度优化 （收益 计算精度提升（MAE降低80%））\n  - 适用于多层激活、累积求和等复杂计算场景；fp16/bf16的动态范围有限，中间计算易丢失小数位，910b2/910b3平台建议所有核心计算步骤启用float32转换\n- `exp_stability_004` — 数值精度优化 （收益 累加精度提升（MSE降低90%））\n  - 适用于大步数累加、梯度累积、损失求和等场景；fp16累加器在1000次累加后误差可达1e-3，float32累加器误差仅1e-7，910b2/910b3平台建议所有累加操作启用高精度累加器\n\n\n", "runbooks/algorithm-numerics/exp_stability_001.md": "\n\n## exp 前减维度最大值防溢出（safe-exp/softmax 数值稳定）\n\n【优化维度】：数值稳定\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3；失效边界：减最大值是恒等变换（softmax 类归一化下数学等价），但单独求 exp 不归一化的场景会改变数值语义，仅在后续有归一化/对数抵消时使用；fp32 场景 exp 溢出阈值高（约 88.7），输入有界时可省略；精度收益与性能代价：收益=消除 Inf/NaN（fp16 输入 >65504 或中间值 >~11 即溢出），代价=一次 max 归约（可忽略）；MERE/MARE/ULP 误差指标未测定）\n\n### 原则\n- **核心策略**：指数运算前先减去维度内最大值，消除大数指数导致的数值溢出\n- **适配场景**：专门针对fp16/bf16低精度场景，该处理可100%避免exp函数返回Inf/NaN\n- **无性能损耗**：仅增加一次max计算，910b2/910b3平台的硬件max指令耗时可忽略\n\n### 代码/骨架出处\n- `Triton`:\n```python\n@triton.jit def exp_overflow_opt_kernel(input_ptr, output_ptr, n_elements, dim: tl.constexpr=0, blockSize: tl.constexpr=128):\n    pid = triton.program_id(0)\n    offsets = pid * blockSize + tl.arange(0, blockSize)\n    mask = offsets < n_elements\n    \n    # 加载数据\n    data = tl.load(input_ptr + offsets, mask=mask).to(tl.float32)\n    \n    # 核心优化: 减去维度内最大值防止溢出\n    max_val = tl.max(data, axis=dim)  # 按指定维度取最大值\n    stable_data = data - max_val      # 数值稳定化\n    \n    # 指数计算（无溢出风险）\n    exp_data = tl.exp(stable_data)\n    \n    # 存储结果（转回原精度）\n    tl.store(output_ptr + offsets, exp_data.to(tl.float16), mask=mask)\n\n# Softmax场景示例调用\ndef softmax_opt(input_tensor):\n    if not input_tensor.is_contiguous():\n        input_tensor = input_tensor.contiguous()\n    output = torch.empty_like(input_tensor)\n    n_elements = input_tensor.numel()\n    grid = (triton.cdiv(n_elements, 128),)\n    exp_overflow_opt_kernel[grid](input_tensor, output, n_elements, dim=-1, blockSize=128)\n    # 归一化步骤\n    sum_exp = output.sum(dim=-1, keepdim=True)\n    return output / sum_exp\n```\n\n**坏实践（反例）**：适用于所有包含指数运算的场景（如Softmax、注意力分数计算），fp16/bf16下未做该处理易出现exp(>65504)返回Inf，910b2/910b3平台需强制启用该优化\n\n**已知实例**：general_stability §raw (`experiences/general_stability/exp_stability_001.yaml`)\n- 声称性能收益：数值稳定性提升100%\n\n\n", "runbooks/memory-sram/exp_elem_add_001_20260526.md": "\n\n## Add算子块大小动态调整优化经验\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3，fp32/fp16/bf16 的逐元素二元运算（含广播与标量 alpha）；失效边界：含多次中间张量读写的复合算子单一档位不够，需更精细的调优策略；分档阈值（1024/8192）按 910B2 向量单元标定，核数/UB 容量不同的硬件需重新标定）\n\n### 原则\n- 小张量使用过大的块大小会导致资源浪费和效率低下\n- 根据张量大小动态调整块大小可优化资源利用率\n- 在Ascend910B2硬件上，合适的块大小直接影响向量单元利用率\n- 性能提升：从1.7890x加速比提升至2.1456x\n- 适用场景：各种规模的elementwise add操作\n- 验证案例：50个测试case全部通过\n\n### 代码/骨架出处\n- `python`:\n```python\n# 根据元素数量动态选择块大小\nif n_elements < 1024:\n    blockSize = min(512, triton.next_power_of_2(n_elements))\nelif n_elements < 8192:\n    blockSize = 1024\nelse:\n    blockSize = 2048\n```\n\n**坏实践（反例）**：所有规模固定一个块大小\n```python\nBLOCK_SIZE = 2048                                    # 一刀切\ngrid = (triton.cdiv(n_elements, BLOCK_SIZE),)        # n=512 时仅 1 个 program，大量 lane 空转\n```\n后果：小张量下向量单元利用率低，加速比只有 1.7890x。✅ 正解：按 n_elements 分档（<1024 取 min(512, next_power_of_2(n))，<8192 取 1024，否则 2048），加速比提升至 2.1456x。\n\n**已知实例**：elementwise §raw (`experiences/elementwise/exp_elem_add_001_20260526.yaml`)\n- 声称性能收益：从1.7890x加速比提升至2.1456x\n- 备注：- 此优化对简单的elementwise操作效果显著 - 对于复杂的复合操作，可能需要更精细的调优策略\n\n\n", "runbooks/memory-sram/exp_elemwise_add_001_20260526.md": "\n\n## 带 alpha 缩放的逐元素 add 访存与块大小优化\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3，fp32/fp16/bf16，支持广播的逐元素 add（x + alpha*y）；失效边界：归约/扫描等非逐元素模式不适用；多算子复合链需单独调优；块大小档位为 910b2 标定，换硬件需重测）\n\n### 原则\n- **block size tuning**：按张量维度动态选择块大小，避免小张量下向量单元空转、大张量下 program 数膨胀带来的调度开销。\n- **continuous memory access**：采用 GM→UB 连续访存模式组织 load/store，配合 mask 处理尾部越界元素，保证边界正确性。\n- **broadcast alpha scaling**：利用 Triton 广播能力实现 x + alpha * y，标量 alpha 直接参与向量运算，无需额外张量读写。\n- 实测收益：平均时延 2.50ms → 1.50ms，相对 PyTorch baseline 加速 1.67x（910b2，fp32/fp16/bf16）。\n\n**坏实践（反例）**：块大小一刀切且不做边界 mask\n```python\nBLOCK_SIZE = 1024\noffs = pid * BLOCK_SIZE + tl.arange(0, BLOCK_SIZE)\nx = tl.load(x_ptr + offs)            # 无 mask，尾部越界\ny = tl.load(y_ptr + offs)\ntl.store(out_ptr + offs, x + alpha * y)\n```\n后果：小张量时向量单元空转、大张量时 program 数膨胀；尾部越界读写导致结果错误。✅ 正解：按张量维度分档选择块大小，所有 load/store 带 `mask=offs < n_elements` 处理尾部。\n\n**已知实例**：elementwise §raw (`experiences/elementwise/exp_elemwise_add_001_20260526.yaml`)\n- 声称性能收益：1.67x（平均时延 2.50ms → 1.50ms，vs PyTorch baseline）\n- 备注：适用于带广播与 alpha 标量参数的逐元素加法场景。\n\n\n", "runbooks/memory-sram/exp_fused_rms_norm_001.md": "\n\n## Memory Access Optimization: fused residual-add RMSNorm with in-place writeback\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3, 91093，fp16/bf16，hidden dim N≥1024；失效边界：N<1024 时两遍加载（reduction 一遍、输出一遍）的成本无法摊销，融合收益稀释；单行 N×4B(fp32 累加） 超过 UB 可用容量时需沿 N 切 tile，原地写回模式不变但需重算 UB 预算）\n\n### 原则\n- **kernel fusion**：Fuses the residual addition (X+R), variance calculation (sum of squares), reciprocal root mean square computation, and final scaling/weight multiplication into a single kernel. This significantly reduces global memory access overhead by keeping intermediate data in high-speed memory (SRAM/Registers) and avoiding multiple kernel launch latencies.\n- **residual inplace update**：Optimizes the data path by writing back the intermediate sum (X+R) to the residual pointer R and the normalized output to X. This eliminates the need for a separate add kernel or extra memory allocation for the residual connection, effectively halving the memory traffic required for the residual path.\n- **precision management**：Utilizes float32 precision specifically for the variance accumulation (_var_base) to maintain numerical stability during the reduction of squared values, while performing the final arithmetic and storage in the lower precision input type (e.g., fp16/bf16) to maximize memory bandwidth utilization.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/115-fused_add_rms_norm_kernel.py\n```\n\n**坏实践（反例）**：残差相加与归一化拆成两个 kernel，中间结果 X+R 落 GM\n```python\n# kernel 1: 只算残差和并写回 GM\ntl.store(R_ptr + off, x + r)\n# kernel 2: 重新从 GM 读 X+R，再算方差与归一化\ns = tl.load(R_ptr + off); var = tl.sum(s * s) / N\n```\n后果：X+R 在 GM 写一次、读一次，残差路径访存流量翻倍，叠加两次 kernel launch 开销。✅ 正解：融合为单 kernel，X+R 保留在 UB/寄存器，同时写回 R 指针（原地更新残差）与 X 指针（归一化输出）；方差累加用 fp32 保数值稳定，最终算术与存储回到 fp16/bf16 打满带宽。\n\n**已知实例**：normalization §raw (`experiences/normalization/exp_fused_rms_norm_001.yaml`)\n- 声称性能收益：35%\n- 备注：This kernel is optimized for scenarios where the hidden dimension N is large enough to amortize the cost of the two-pass loading (once for reduction, once for output). 尤其适用于 Pre-Norm / Post-Norm 结构的归一化场景。\n\n\n", "runbooks/memory-sram/exp_gemma_rmsnorm_001.md": "\n\n## Memory Access Optimization: fused add-RMSNorm with weight hoisting\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3，fp16/bf16，dim≥1024、batch≥32；失效边界：dim 过小无法打满内存总线，融合与 hoisting 收益稀释；权重张量过大无法常驻寄存器/UB 时 hoisting 失效，需改回循环内加载或沿 dim 切块）\n\n### 原则\n- **operator fusion**：Fuses the residual addition (hidden_state + residual) and RMSNorm operations into a single kernel. This eliminates the need to write and read back the intermediate addition result from global memory, significantly reducing memory bandwidth pressure.\n- **weight hoisting**：The weight tensor is loaded inside the row processing loop. An optimization is to move the weight loading statement outside the `for row_start` loop. Since weights are constant across the batch, this ensures the data is loaded once and kept in registers or cache, minimizing redundant global memory accesses.\n- **vectorized reduction**：Utilizes `tl.sum` on the squared values to compute variance efficiently. This maps well to the vector units of the target hardware, allowing for parallel reduction of the `dim` axis.\n- **precision control**：Performs the reduction (variance calculation) in `float32` to maintain numerical stability, while keeping the loads and stores in the lower precision `fp16`/`bf16` to optimize memory throughput.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/190-add_gemma_rms_norm_kernel.py\n```\n\n**坏实践（反例）**：权重在 row 处理循环内重复加载\n```python\nfor row_start in range(0, batch, BLOCK_M):\n    w = tl.load(w_ptr + tl.arange(0, BLOCK_N))  # 每个 row tile 重复读同一份权重\n    x = tl.load(x_ptr + row_start * dim + offs)\n    ...\n```\n后果：对 batch 内所有行不变的常量权重被重复 GM 读取 batch/BLOCK_M 次，纯属带宽浪费。✅ 正解：把权重 load 提升到 `for row_start` 循环外，只读一次并驻留寄存器/UB；残差相加与归一化融合为单 kernel，中间和不再落 GM；方差规约用 fp32。\n\n**已知实例**：matmul §raw (`experiences/matmul/exp_gemma_rmsnorm_001.yaml`)\n- 声称性能收益：35%\n- 备注：该 kernel 实现的是一种缩放权重按 (w + 1.0) 使用的 RMSNorm 变体。适用于 hidden dimension 足够大、能打满内存总线的场景。\n\n\n", "runbooks/memory-sram/exp_groupnorm_001.md": "\n\n## Memory Access Optimization: dynamic vectorization tuning\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3, 91093, 91095，fp16/bf16/fp32，HW≥32；失效边界：HW 较小时三遍读 X 的 GM 流量开销无法摊销，单遍融合方案更优；BLOCK_SUB_HW_SIZE×dtype 字节数超过 UB 容量时 autotune 的大配置不可达，搜索空间需按硬件重裁剪）\n\n### 原则\n- **dynamic vectorization tuning**：The kernel employs an extensive autotuning configuration for `BLOCK_SUB_HW_SIZE`, sweeping values from 32 to 16384. This allows the runtime to select the optimal vectorization width for the HW dimension, balancing instruction overhead against memory bandwidth saturation and cache capacity for specific tensor shapes.\n- **coalesced memory access pattern**：The memory access logic is structured to iterate over the HW dimension (`hw_offsets`) as the inner-most stride. By calculating `base_offset` using `channel_offset * HW + hw_offsets`, the kernel ensures that GM→UB loads and stores are contiguous in global memory, maximizing memory bus utilization.\n- **high precision accumulation**：To ensure numerical stability during reduction, the kernel casts input data to `tl.float32` before accumulating `X_sum` and `X_var_sum`. This prevents precision loss or overflow that can occur when summing a large number of elements in lower precision formats (fp16/bf16).\n- **three pass algorithm**：The computation is split into three distinct passes (Mean calculation, Variance calculation, and Normalization). While this increases global memory read traffic (loading X three times), it significantly reduces register pressure and simplifies the control flow compared to a single-pass fused approach, enhancing stability for autotuning.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/122-group_norm_kernel.py\n```\n\n**坏实践（反例）**：所有 shape 共用一个固定向量宽度，且内层沿非连续维迭代\n```python\nBLOCK_SUB_HW_SIZE = 512                      # 一刀切，不做 autotune\noffs = tl.arange(0, BLOCK_SUB_HW_SIZE) * HW  # 内层按 C 维步进，stride=HW\nx = tl.load(x_ptr + channel_offset + offs)\n```\n后果：GM 访问按 stride=HW 跳跃、完全不连续，总线利用率低；固定宽度在不同 shape 下不是过细（指令开销大）就是过粗（超出 UB）。✅ 正解：内层以 `hw_offsets` 为最内连续维（`base_offset = channel_offset * HW + hw_offsets`），`BLOCK_SUB_HW_SIZE` 在 32~16384 间 autotune 按 shape 选宽；三遍算法降低寄存器压力、简化控制流，累加用 fp32 保精度。\n\n**已知实例**：normalization §raw (`experiences/normalization/exp_groupnorm_001.yaml`)\n- 声称性能收益：25%\n- 备注：This implementation is optimized for stability and ease of tuning via the three-pass method. It is best suited for scenarios where HW dimensions are large enough to amortize the memory access overhead.\n\n\n", "runbooks/memory-sram/exp_paged_kv_cache_001.md": "\n\n## Memory Access Optimization: head vectorization\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2/910b3/91093/91095，fp16/bf16，num_kv_heads≥1、head_dim≥64、block_size≥16；失效边界：num_kv_heads 很小（如 1–2）时头维向量化宽度不足，收益稀释；head_dim<64 时连续访存凑不满一个对齐事务；head_dim 非 32B/64B 对齐倍数时 mask 分支开销上升）\n\n### 原则\n- **head vectorization**：The original implementation iterates over `num_kv_heads` sequentially using a Python loop. This optimization vectorizes the head dimension by incorporating it into the tensor load/store operations (e.g., expanding pointer arithmetic to handle a range of heads simultaneously). This removes the loop overhead and allows the hardware to process multiple heads in parallel, significantly increasing throughput for models with many heads.\n- **memory coalescing**：Optimizes the stride and pointer calculations to ensure that memory accesses along the `head_dim` are contiguous and aligned to the hardware's transaction granularity (e.g., 32 or 64 bytes). This reduces the number of GM transactions required and maximizes bus utilization, which is critical for high-bandwidth memory-bound kernels like KV cache writing.\n- **chunk size alignment**：Adjusts the `CHUNK_SIZE` and the internal processing loop to ensure that the amount of data processed per iteration aligns with the hardware's vector width. This prevents partial register writes and ensures that the mask logic does not introduce significant branching overhead.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/238-_store_paged_kv_cache_kernel.py\n```\n\n**坏实践（反例）**：Python 循环逐头串行处理 KV cache 写入\n```python\nfor h in range(num_kv_heads):\n    vals = tl.load(kv_in_ptr + h * head_dim + d_off)    # 一次只处理一个头\n    phys = tl.load(block_table_ptr + blk)\n    tl.store(cache_ptr + phys * slot_stride + h * head_dim + d_off, vals)\n```\n后果：头维循环 overhead 大，每次 load/store 宽度仅 head_dim，多头无法并行，总线利用率低，40% 收益流失。✅ 正解：把头维并入张量 load/store 的指针算术（一次覆盖多个头），并保证 head_dim 方向访存连续、对齐 32/64B 事务粒度，CHUNK_SIZE 对齐硬件向量宽度。\n\n**已知实例**：attention §raw (`experiences/attention/exp_paged_kv_cache_001.yaml`)\n- 声称性能收益：40%\n- 备注：该优化对 KV 头数量多（如 32、64、128）的分页注意力场景尤为有效，把 kernel 从串行逐头处理转变为宽向量化 store。\n\n\n", "runbooks/memory-sram/exp_rmsnorm_bwd_fused_001.md": "\n\n## Memory Access Optimization: dynamic block sizing with fused backward+add\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2/910b3，fp16/bf16/fp32，反向梯度与残差梯度相加融合的归一化场景；失效边界：寄存器累加 dW 要求整行 fp32 累加器可驻留：n_cols × 4B ≤ 单核寄存器/UB 可用预算，n_cols 过大导致寄存器溢出时应改用 pid 分区 buffer 方案；n_rows 很小、grid-stride 退化为单轮时负载均衡收益消失）\n\n### 原则\n- **dynamic block sizing**：The heuristic adjusts BLOCK_SIZE_M based on n_cols to maintain a constant tile area (~4096 elements), optimizing L1/L0 cache utilization and register pressure regardless of the hidden dimension size.\n- **operator fusion**：Fuses the normalization backward pass with the addition of the residual gradient (dS_out), reducing global memory read/write operations by avoiding an intermediate kernel launch.\n- **register accumulation**：Accumulates the weight gradient (dW) in a register-level float32 buffer (dW_acc) across all processed rows, writing to global memory only once per program ID to minimize memory bandwidth.\n- **grid stride scheduling**：Implements a grid-stride loop for row processing, ensuring efficient load balancing across NPU cores even when the number of rows is not perfectly divisible by the block size.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/249-_fused_add_rmsnorm_bwd_kernel.py\n```\n\n**坏实践（反例）**：残差梯度相加与反向计算拆成两个 kernel，中间结果写回 GM 再读回\n```python\nkernel_a: dS_out = dY + dR; store dS_out to GM   # 中间张量落 GM\nkernel_b: load dS_out from GM; compute dX, dW    # 再次读回\n```\n后果：中间张量多一次 GM 写 + 一次 GM 读，并多付一次 kernel launch 开销。✅ 正解：单 kernel 内融合相加与反向，中间结果留在寄存器/SRAM；dW 用 fp32 寄存器累加器跨行累加，每个 pid 仅写 GM 一次（收益 25%）。\n\n**已知实例**：normalization §raw (`experiences/normalization/exp_rmsnorm_bwd_fused_001.yaml`)\n- 声称性能收益：25%\n- 备注：支持多种模型特定的精度转换（cast）模式以满足混合精度需求。The heuristic ensures robustness across varying sequence lengths and hidden sizes.\n\n\n", "runbooks/memory-sram/exp_rmsnorm_fused_quant_001.md": "\n\n## Memory Access Optimization: fusing add/norm/bias/quant into one kernel\n\n【优化维度】：访存效率\n【泛化层级】：条件性（迁移条件：硬件 910b2/910b3，fp16/bf16 输入、int8 量化输出，hidden_size >= 128 的推理归一化+量化场景；失效边界：hidden_size 过大、单行归一化结果无法整体驻留时，量化循环必须按 COL_BLOCK_SIZE 切片：COL_BLOCK_SIZE × dtype 字节数 × 驻留份数 ≤ UB 预算；无量化需求时应走 SCALE 条件关闭的纯加+归一化路径；需要反向传播的训练场景不适用）\n\n### 原则\n- **operator fusion**：The kernel fuses four distinct operations (Element-wise Add, RMSNorm, Bias Addition, and Affine Quantization) into a single kernel launch. This drastically reduces global memory access by keeping intermediate results (e.g., the sum of input and residual) in high-speed registers/SRAM rather than writing them back to HBM.\n- **weight caching**：The normalization weights (`norm_weight_values`) are loaded outside the main batch processing loop (`for i in tl.range...`). This leverages data reuse, as the same weights are applied to every row in the batch, significantly reducing memory traffic for the weight tensor.\n- **block tiling quantization**：The quantization logic employs a tiling strategy using `COL_BLOCK_SIZE`. By iterating over the hidden dimension in blocks (`range(0, hidden_size, COL_BLOCK_SIZE)`), the kernel efficiently manages register pressure and allows for vectorized loading of quantization parameters (`quant_scale_ptr`, `quant_offset_ptr`).\n- **slice extraction**：The use of `tl.extract_slice` inside the quantization loop allows the kernel to operate on sub-sections of the normalized data without reloading the entire row, optimizing memory bandwidth usage during the per-channel quantization step.\n- **precision management**：The variance calculation is explicitly upcast to `tl.float32` before summation and division to ensure numerical stability during the RMSNorm calculation, while the final output is cast to `tl.int8` with saturation to handle quantization clamping correctly.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/189-add_rmsnorm_bias_kernel.py\n```\n\n**坏实践（反例）**：加、归一化、bias、量化拆成 4 个独立 kernel\n```python\nS = add(X, R)        # kernel 1，S 写 GM\nN = rmsnorm(S)       # kernel 2，读 S 写 N\nB = N + bias         # kernel 3，读 N 写 B\nQ = quant(B)         # kernel 4，读 B 写 Q\n```\n后果：每个中间结果各付一次 GM 写 + 读，外加 3 次多余 kernel launch。✅ 正解：四算子融合为单 kernel，中间结果驻留寄存器/SRAM；归一化权重在 batch 循环外只载一次；量化段用 `tl.extract_slice` 取子块避免整行重载（收益 50%）。\n\n**已知实例**：normalization §raw (`experiences/normalization/exp_rmsnorm_fused_quant_001.yaml`)\n- 声称性能收益：50%\n- 备注：This kernel is specifically optimized for inference scenarios requiring post-fusion normalization and quantization（网络末端归一化与量化串联的推理场景）。The `SCALE` conditional allows it to function as a standard Add+RMSNorm kernel when quantization is not required.\n\n\n", "runbooks/memory-sram/ub-fill-and-compute-hoist.md": "\n\n## UB 打满与外提策略（来源：GDN FLA 移植 + Triton 体系化实践互证）\n\n【优化维度】：内存｜UB 容量利用\n【泛化层级】：条件性（迁移条件：UB 192KB 平台上分块受容量限制、且 kernel 内存在可因式分解/可预计算的中间张量（mask、广播 exp 等）；失效边界：UB 超出量大（外提省不出空间），或外提计算无法从 kernel 内循环中剥离——需逐 case 核算 UB 账目）\n\n<原则：GPU 惯用分块 64 是为 warp=32 折中，昇腾 UB 192KB 下合适 Tile 为 16~64KB——BV/BK 从 64 调 128（FP32 下 [64,128]→[128,128]，32KB→64KB）可一次搬运更大块、减少循环与搬运次数。若调大后 UB 微超（如 dqkwg BK=128 需 192.4KB，仅超 0.4KB），不退回小块，而是把 kernel 内的 mask_A（下三角 (BT,BT)）与 g_exp 广播 exp(b_g[:,None]-b_g[None,:]) 外提到调用侧在 GM 融合预计算，kernel 内不再开辟 mask 缓冲。>\n\n**正例（Triton-Ascend）**：\n\n```python\n# 调用侧：预计算融合 mask 与 g_exp（GM 侧一次 elementwise pass）\ng_diff_exp = torch.exp(g[:, None] - g[None, :]) * tril_mask   # (BT, BT)\n\n@triton.jit\ndef chunk_bwd_dqkwg(..., GEXP, ...):\n    gexp = tl.load(GEXP + offs)   # 直接加载，不再 kernel 内 exp + where + 开缓冲\n    ...\n```\n\n**坏实践（反例）**：\n\n```python\n# BK=128 报 UB overflow 后直接退回 BK=64\n```\n\n后果：小块计算效率大打折扣。dqkwg 实测 32K 场景外提后 18ms→10ms；FLA 移植实践常用场景平均 +51%（含外提引入的额外 DIV/EXP/MUL 开销，占比很小）。✅ 正解即外提可预计算项，保住大块。\n\n**配套手段——mask 计算本身也要省**：\n\n- 下三角 mask 的 `tl.where(cond, a, b)` / Select 改为**乘法**（`a * tril_mask`），Vector 上乘法远快于 Select；\n- 前序算子已保证输入为下三角时（如 solve_tril 的 A），删除 kernel 内冗余的 `tl.where(m_A, b_A, 0)` 下三角化，符号在 load 阶段附加，实测省约 2ms。\n\n**收益数据（带实现语境）**：\n\n| 来源 | 实现 | 场景 | 收益 |\n|---|---|---|---|\n| FLA 移植(2025-12) | Triton/A2/A3 | chunk_bwd_dqkwg 常用场景 | 平均 +51% |\n| Triton 体系化(2026-03) | Triton/A2/A3 | dqkwg 32K；solve_tril 冗余删除 | 18ms→10ms；省 2ms |\n| AscendC(2026-08) | AscendC | Select→乘法 | 基线对齐默认手段 |\n\n**Triton 可达性**：✅ 完全可达（外提、乘法 mask、冗余删除均为 Triton 层改动）。\n\n\n", "runbooks/compute-pipeline/exp_backward_sum_001.md": "\n\n## Compute Optimization: vectorization alignment\n\n【优化维度】：AICore 单元利用/Scalar 削减\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3, 91093, 91095；失效边界：headDim 维 stride 不为 1（非连续 layout）时合并访存假设失效，需先做 layout 变换；o_len < 128 的小规模场景调大 BLOCK_SIZE_O 反而造成核间负载不均；BLOCK_SIZE_D 未对齐向量宽度时收益消失）\n\n### 原则\n- **vectorization alignment**：Align BLOCK_SIZE_D to the hardware's vector width (e.g., 128 for fp16/bf16 on Ascend 910 series) to ensure the Vector Unit processes data efficiently without remainder handling, maximizing throughput for the element-wise multiplication.\n- **memory coalescing**：Ensure the stride for the headDim (stride_od, stride_dod) is 1 (contiguous). This allows the memory controller to issue contiguous load instructions, significantly reducing memory access latency compared to strided loads.\n- **block size tuning**：Increase BLOCK_SIZE_O to improve data reuse and hide memory latency. By processing more sequence elements per program ID, the kernel can better saturate the compute units while keeping the intermediate accumulation in registers or high-speed cache (L0C/UB).\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/021-backward_sum_o_do.py\n```\n\n**坏实践（反例）**：BLOCK_SIZE_D 取 100 这类不对齐向量宽度的值，且按非连续 stride 访问 headDim 维 → 每条向量指令都要做 remainder 处理、load 无法合并，吞吐明显下跌 → ✅ 正解即本条：BLOCK_SIZE_D 对齐硬件向量宽度（fp16/bf16 下 128）、保证最内维连续、调大 BLOCK_SIZE_O 提高数据复用。\n\n**已知实例**：reduction §raw (`experiences/reduction/exp_backward_sum_001.yaml`)\n- 声称性能收益：25%\n- 备注：This kernel computes the gradient for the scale parameter in normalization-like layers. The current implementation is functionally correct but requires tuning of block sizes and alignment to achieve peak performance on Ascend hardware.\n\n\n", "runbooks/compute-pipeline/exp_layernorm_npu_simd_001.md": "\n\n## Compute Optimization: npu simd vectorization\n\n【优化维度】：AICore 单元利用/Scalar 削减\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3；失效边界：N < 128 时向量化块配置需重调；gating 与 norm 的顺序（NORM_BEFORE_GATE）必须与模型语义一致，顺序错即结果错；可选输入的 heuristics 特化组合过多时编译产物膨胀）\n\n### 原则\n- **npu simd vectorization**：The kernel is explicitly optimized for NPU SIMD units. By utilizing vectorized loads and arithmetic operations across the blockN dimension, it maximizes the throughput of the vector processing pipeline on the Ascend hardware.\n- **operator fusion**：Fuses the Gating (Swish z * sigmoid(z)) operation with the LayerNorm/RMSNorm computation. This is performed either before or after normalization based on the NORM_BEFORE_GATE flag, eliminating the need to write intermediate results to global memory (HBM), thus significantly reducing memory bandwidth consumption.\n- **heuristic specialization**：Utilizes @triton.heuristics to generate specialized code paths for optional inputs (Bias B and residual Z). This ensures that the compiled kernel contains only the necessary instructions for the specific configuration, avoiding runtime branching overhead for unused features.\n- **float32 accumulation**：Performs statistical calculations (mean and variance) in float32 precision before casting back to the input type. This ensures numerical stability during the reduction operations, which is critical for training convergence.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/180-_layer_norm_fwd_1pass_kernel_npu_simd.py\n```\n\n**坏实践（反例）**：门控（z*sigmoid(z)）与归一化拆成两个 kernel → 中间结果落 HBM 再读回，带宽翻倍 → ✅ 正解即本条：融合 + `@triton.heuristics` 按 Bias/Residual 有无裁剪代码路径 + fp32 统计量。\n\n**已知实例**：normalization §raw (`experiences/normalization/exp_layernorm_npu_simd_001.yaml`)\n- 声称性能收益：35%\n- 备注：Supports both LayerNorm and RMSNorm, as well as flexible gating mechanisms (pre- or post-normalization). Best suited for transformer architectures requiring fused normalization and activation steps.\n\n\n", "runbooks/compute-pipeline/exp_spec_decode_verify_scalar.md": "\n\n## Compute Optimization: scalar loop vectorization\n\n【优化维度】：AICore 单元利用/Scalar 削减\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3；失效边界：本条描述的是 baseline 缺陷与优化方向（备注自述标量循环是主要瓶颈）；log 空间累加改变数值路径，需验证与线性空间 min(pi*p/q,1) 的等价性；变长需 mask 处理；vocab_size 大时概率 load 的块化收益明显）\n\n### 原则\n- **scalar loop vectorization**：The current implementation uses a Python-style scalar loop `for pos in range(num_draft_tokens)` inside the kernel. This serializes the verification of draft tokens, preventing the NPU from utilizing SIMD parallelism for the sequence dimension. The optimization is to vectorize this loop by processing multiple draft positions simultaneously using Triton's vectorized load and arithmetic operations.\n- **memory access coalescing**：Inside the scalar loop, `tl.load` is called for individual tokens and probabilities (`draft_token_ids_ptr`, `target_probs_ptr`, etc.). This results in poor memory access patterns and high latency. The optimization involves loading contiguous blocks of data into SRAM before computation, ensuring memory transactions are coalesced.\n- **log space accumulation**：The calculation of `pi` involves multiplying probabilities (`pi = min(pi * target_prob / draft_prob, 1.0)`), which can lead to numerical underflow. An optimization is to perform the accumulation in log-space (summing log-probabilities) and converting back to linear space only for the final comparison with the uniform random number.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/171-rejection_random_sample_block_verify_kernel.py\n```\n\n**坏实践（反例）**：即本条主题——kernel 内 `for pos in range(num_draft_tokens)` 标量循环 + 逐 token 标量 load → SIMD 完全闲置、访存不合并（潜在收益 300%）→ ✅ 正解：序列维向量化（多位置同时验证）+ 块式合并 load + log 空间累加防概率连乘下溢。\n\n**已知实例**：misc §raw (`experiences/misc/exp_spec_decode_verify_scalar.yaml`)\n- 声称性能收益：300%\n- 备注：The provided code represents a baseline implementation. The scalar loop over `num_draft_tokens` is the primary bottleneck. Optimizing this requires vectorizing the sequence dimension and handling variable lengths with masks.\n\n\n", "runbooks/compute-pipeline/exp_swiglu_oai_001.md": "\n\n## Compute Optimization: interleaved vectorization\n\n【优化维度】：AICore 单元利用/Scalar 削减\n【泛化层级】：条件性（迁移条件：硬件 910b2, 910b3；失效边界：要求输入为 gate/up 交错布局（备注自述），非交错布局不适用；clamp 阈值需按数据分布设；MINIBLOCK_SIZE 需按寄存器/L1 容量调）\n\n### 原则\n- **interleaved vectorization**：The kernel utilizes a stride-based loading mechanism (offset * 2 and offset * 2 + 1) to de-interleave gate and up projections from a single tensor in memory. This maximizes memory bandwidth utilization by ensuring contiguous memory access patterns and vectorized loads.\n- **numerical stability clamping**：Implements pre-activation clamping using `tl.where` to constrain input values before the exponential function. This prevents overflow/underflow in the Sigmoid calculation, which is critical for the numerical stability of BF16/FP16 training on Ascend hardware.\n- **minibatch tiling**：The outer loop iterates over `blockSize` using `MINIBLOCK_SIZE` steps. This tiling strategy ensures that the working set fits within the GPU's register file or L1 cache, reducing register pressure and improving arithmetic intensity for the element-wise operations.\n- **operator fusion**：Fuses the gating mechanism, Sigmoid activation, and final multiplication into a single kernel pass. This eliminates the need to write intermediate results to global memory (HBM), significantly reducing memory access latency.\n\n### 代码/骨架出处\n- `TritonPath`:\n```python\nraw_experiences/extracted_kernels/178-swiglu_oai_kernel.py\n```\n\n**坏实践（反例）**：先把交错输入拆成两个张量（额外 kernel/拷贝）再算激活，且 exp 不做 clamp → 拆分开销 + 大输入溢出 → ✅ 正解即本条：stride 化 load 直接解交错 + `tl.where` 预 clamp + 门控/sigmoid/乘法单 pass 融合。\n\n**已知实例**：activation §raw (`experiences/activation/exp_swiglu_oai_001.yaml`)\n- 声称性能收益：25%\n- 备注：Requires input `hidden_states` to be interleaved (gate, up, gate, up...). The `gemm1_alpha` parameter allows for scaling the sigmoid input.\n\n\n"}};
const KC={api:'#1f77b4',example:'#2e9e6b',header:'#7e57c2',guide:'#ff7f0e',index:'#cbd5e1',root:'#334155',other:'#94a3b8',operator:'#e6194b',glossary:'#0f766e',operator_optimization:'#3cb371',implementation_trap:'#f032e6',debugging_journey:'#c026d3',cross_skill_gap:'#a21caf',field_note:'#f032e6',runbook:'#3cb371'};
const EC={exemplifies:'#2e9e6b',explains:'#ff7f0e',declares:'#7e57c2',demonstrates:'#0891b2',same_topic:'#1f77b4',related:'#94a3b8',part_of:'#e2e8f0',mentions:'#f1d6c0'};
const ETZH={exemplifies:'实现示例',explains:'开发指南',declares:'声明',demonstrates:'配套',same_topic:'同主题',related:'相关',part_of:'层级',mentions:'提及'};
const nodeById={};G.nodes.forEach(n=>nodeById[n.id]=n);
const back={};G.edges.forEach(e=>{(back[e.target]=back[e.target]||[]).push(e);});
document.getElementById('meta').textContent=`· ${G.meta.card_count} concept / ${G.nodes.length} 节点 / ${G.edges.length} 边`;
const sz=n=>10+Math.min(28,(n.degree||0)*2);
const els=[];
for(const n of G.nodes)els.push({data:{id:n.id,label:n.title,kind:n.kind,bundle:n.bundle,ext:!!n.external,sz:sz(n)}});
for(const e of G.edges)els.push({data:{id:e.source+'|'+e.target,source:e.source,target:e.target,type:e.type,e:e}});
const cy=cytoscape({container:document.getElementById('cy'),elements:els,wheelSensitivity:0.2,
 style:[
  {selector:'node',style:{'background-color':n=>KC[n.data('kind')]||'#94a3b8','width':'data(sz)','height':'data(sz)','label':'data(label)','font-size':6,'color':'#334155','text-opacity':0,'text-valign':'bottom','text-margin-y':2,'text-wrap':'ellipsis','text-max-width':90,'border-width':n=>n.data('ext')?2:0,'border-color':'#94a3b8','border-style':'dashed'}},
  {selector:'node[?ext]',style:{'background-opacity':0.45}},
  {selector:'node:selected',style:{'border-width':3,'border-color':'#f59e0b','border-style':'solid','text-opacity':1,'font-size':9}},
  {selector:'.nbr',style:{'text-opacity':1,'font-size':8}},
  {selector:'edge',style:{'width':e=>e.data('e').cross?2:1,'line-color':e=>EC[e.data('type')]||'#ccc','line-style':e=>e.data('e').cross?'dashed':'solid','curve-style':'haystack','opacity':0.55,'target-arrow-shape':e=>e.data('e').symmetric?'none':'triangle','target-arrow-color':e=>EC[e.data('type')]||'#ccc','arrow-scale':0.6}},
  {selector:'edge:selected',style:{'opacity':1,'width':3}},
  {selector:'.dim',style:{'opacity':0.06,'text-opacity':0}}
 ],
 layout:{name:'cose',animate:false,nodeRepulsion:9000,idealEdgeLength:55,padding:30}});

function resolveLink(fromId,href){let base=fromId.split('/').slice(0,-1);for(const p of href.split('/')){if(p==='..')base.pop();else if(p!=='.')base.push(p);}let id=base.join('/');return nodeById[id]?id:null;}
function showDetail(id){const n=nodeById[id];if(!n)return;cy.$(':selected').unselect();const node=cy.getElementById(id);node.select();cy.elements().removeClass('nbr');node.connectedNodes().addClass('nbr');cy.animate({center:{eles:node},duration:200});
 let h=`<span class="chip" style="background:${KC[n.kind]}">${n.kind}</span> ${n.external?'<span class="chip" style="background:#94a3b8">外部</span>':''}<h2>${esc(n.title)}</h2><div class="id">${n.id}</div>`;
 if(n.description)h+=`<p>${esc(n.description)}</p>`;
 if(n.resource)h+=`<p><a class="ext" href="${n.resource}" target="_blank" rel="noopener">上游 resource ↗</a></p>`;
 if(n.tags&&n.tags.length)h+=`<div>${n.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`;
 const inc=cy.getElementById(id).connectedEdges().map(x=>x.data('e'));
 const groups={};inc.forEach(e=>{if(e.type==='part_of')return;const me=id;const other=e.source===me?e.target:e.source;const lab=persp(e,me);(groups[lab]=groups[lab]||[]).push([other,e]);});
 const order=['实现示例','对应接口','开发指南','讲解接口','声明头文件','声明的接口','配套样例','对应指南','同主题','相关','提及'];
 Object.keys(groups).sort((a,b)=>order.indexOf(a)-order.indexOf(b)).forEach(lab=>{h+=`<div class="grp">${lab} (${groups[lab].length})</div>`;groups[lab].forEach(([o,e])=>{const t=nodeById[o];h+=`<a class="nb" onclick="showDetail('${o}')">${esc(t?t.title:o)} <span class="w">· ${ETZH[e.type]||e.type} ${e.weight.toFixed(1)}</span></a>`;});});
 const bl=(back[id]||[]).filter(e=>e.type!=='part_of'&&!e.symmetric);
 if(bl.length){h+=`<div class="grp">被引用 / 指向本卡 (${bl.length})</div>`;bl.forEach(e=>{const t=nodeById[e.source];h+=`<a class="nb" onclick="showDetail('${e.source}')">${esc(t?t.title:e.source)} <span class="w">· ${ETZH[e.type]||e.type}</span></a>`;});}
 const body=(G.bodies||{})[id];if(body){h+=`<div id="body">${marked.parse(body,{gfm:true,breaks:false})}</div>`;}
 const d=document.getElementById('detail');d.innerHTML=h;d.scrollTop=0;
 d.querySelectorAll('#body a[href]').forEach(a=>{const href=a.getAttribute('href');if(href&&href.endsWith('.md')&&!href.includes('://')){const tid=resolveLink(id,href);if(tid){a.className='int';a.removeAttribute('href');a.onclick=()=>showDetail(tid);return;}}a.className='ext';a.target='_blank';a.rel='noopener';});}
function kg(k){if(['implementation_trap','debugging_journey','cross_skill_gap','field_note'].includes(k))return'field_note';if(['operator_optimization','runbook'].includes(k))return'runbook';return k;}
function persp(e,me){const k=kg(nodeById[me].kind);if(e.type==='exemplifies'){if(k==='api'||k==='guide')return'实现示例';if(k==='operator'||k==='field_note')return'实践案例';return'对应接口';}if(e.type==='explains'){if(k==='api')return'开发指南';if(k==='operator'||k==='field_note'||k==='runbook')return'开发指南';return'讲解接口';}if(e.type==='declares')return k==='api'?'声明头文件':'声明的接口';if(e.type==='demonstrates')return k==='guide'?'配套样例':'对应指南';if(e.type==='same_topic')return'同主题';if(e.type==='related')return'相关';if(e.type==='mentions')return'提及';return'相关';}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
cy.on('tap','node',ev=>showDetail(ev.target.id()));
cy.on('tap','edge',ev=>{const e=ev.target.data('e');document.getElementById('detail').innerHTML=`<div class="grp">边</div><p><b>${ETZH[e.type]||e.type}</b> ${e.symmetric?'(对称)':''}<br><span class="id">${e.source}<br>${e.symmetric?'—':'→'} ${e.target}</span></p><p>via: ${e.via.join(', ')}<br>why: ${esc(e.why)}<br>weight: ${e.weight}</p>`;});
cy.on('tap',ev=>{if(ev.target===cy){cy.elements().removeClass('nbr');cy.$(':selected').unselect();}});
document.getElementById('layout').onchange=e=>cy.layout({name:e.target.value,animate:false,padding:30}).run();
document.getElementById('reset').onclick=()=>{cy.fit(null,30);document.getElementById('q').value='';cy.elements().removeClass('dim');};
document.getElementById('q').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(!q){cy.elements().removeClass('dim');return;}cy.nodes().forEach(n=>{const d=n.data();const hay=(d.label+' '+d.id+' '+d.bundle).toLowerCase();n.toggleClass('dim',!hay.includes(q));});cy.edges().forEach(e=>e.toggleClass('dim',e.source().hasClass('dim')||e.target().hasClass('dim')));};
function mkfilter(host,title,keys,active,attr){let h=`<b>${title}</b>`;keys.forEach(k=>h+=`<label><input type=checkbox ${active(k)?'checked':''} data-f="${attr}" data-v="${k}">${k}</label>`);document.getElementById(host).innerHTML=h;}
mkfilter('bundleF','bundle:',G.meta.bundles,()=>true,'bundle');
mkfilter('kindF','kind:',['api','example','header','guide','glossary','index','other','operator','operator_optimization','implementation_trap','debugging_journey','cross_skill_gap'],()=>true,'kind');
mkfilter('typeF','边:',Object.keys(EC),k=>k!=='mentions'&&k!=='part_of','type');
document.getElementById('legend').innerHTML=Object.keys(EC).map(t=>`<span><b style="background:${EC[t]}"></b>${ETZH[t]}</span>`).join('');
function applyFilters(){const on=a=>new Set([...document.querySelectorAll(`input[data-f="${a}"]:checked`)].map(x=>x.dataset.v));
 const kb=on('bundle'),kk=on('kind'),kt=on('type');
 cy.nodes().forEach(n=>{const d=n.data();n.style('display',(kb.has(d.bundle)||!d.bundle)&&kk.has(d.kind)?'element':'none');});
 cy.edges().forEach(e=>{const vis=kt.has(e.data('type'))&&e.source().style('display')==='element'&&e.target().style('display')==='element';e.style('display',vis?'element':'none');});}
document.querySelectorAll('.filters input').forEach(cb=>cb.onchange=applyFilters);applyFilters();
const first=G.nodes.find(n=>n.kind==='api'&&!n.external)||G.nodes.find(n=>!n.external)||G.nodes[0];if(first)showDetail(first.id);
</script></body></html>

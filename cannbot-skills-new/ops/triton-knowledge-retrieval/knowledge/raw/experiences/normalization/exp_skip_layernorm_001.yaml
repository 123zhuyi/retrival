optimization_points:
- precision_control: Accumulators for the sum (sum_x) and sum of squares (sum_sq)
    are explicitly computed in float32. This prevents overflow and ensures numerical
    stability during the variance calculation, which is critical when inputs are fp16
    or bf16.
- kernel_fusion: The residual connection (X + R) and the affine transformation (W
    * x_hat + B) are fused directly into the LayerNorm kernel. This eliminates the
    need for separate kernel launches and intermediate global memory storage, significantly
    reducing memory bandwidth pressure.
- two_pass_algorithm: The kernel utilizes a two-pass strategy the first pass iterates
    over the data in blocks to compute mean and variance (reduction), and the second
    pass applies the normalization and affine transform. This approach decouples the
    reduction phase from the element-wise phase, allowing the kernel to handle hidden
    dimensions (N) larger than the register file capacity by processing data in BLOCK_SIZE
    chunks.
performance_boost: 30%
note: The two-pass approach trades off some memory bandwidth (reloading X and R in
  the second pass) for flexibility in handling large N dimensions. Ensure BLOCK_SIZE
  is tuned to the L1 cache size for optimal performance.

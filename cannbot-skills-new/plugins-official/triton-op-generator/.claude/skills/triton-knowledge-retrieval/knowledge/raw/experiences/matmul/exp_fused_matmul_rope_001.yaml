optimization_points:
- operator_fusion: Fuses the Rotary Position Embedding (RoPE) operation with the Matrix
    Multiplication (MatMul) into a single kernel launch. This eliminates the need
    to write the intermediate Query tensor back to High Bandwidth Memory (HBM) after
    applying RoPE, significantly reducing memory bandwidth consumption and latency.
- hardware_unit_scheduling: Utilizes `dl.async_task` with specific scopes (`vector`
    for RoPE, `cube` for MatMul) to explicitly map computations to the appropriate
    processing units on the Ascend Da Vinci architecture. This allows for efficient
    pipelining where the Vector unit handles the trigonometric calculations while
    the Cube unit handles the matrix accumulation.
- data_locality_optimization: By keeping the data within the on-chip memory hierarchy
    (L1/L0 buffers) between the RoPE and MatMul stages, the kernel maximizes data
    reuse. The output of the vector calculation is directly fed into the cube unit
    without global memory synchronization.
- operator_fusion: Fuses the Rotary Position Embedding (RoPE) element-wise operations
    with the Matrix Multiplication (MatMul) into a single kernel launch. This eliminates
    the need to write intermediate Q and K embeddings to global memory (HBM) and read
    them back for the MatMul operation, significantly reducing memory traffic.
- hardware_unit_pipelining: Utilizes `dl.async_task` to explicitly dispatch the RoPE
    computation to the Vector unit (`scope=vector`) and the MatMul computation to
    the Cube unit (`scope=cube`). This allows the hardware to schedule these tasks
    on different physical execution units, potentially overlapping computation and
    hiding latency.
- memory_access_optimization: By fusing the operations, the data path is shortened.
    The rotated embeddings can be consumed directly by the matrix multiplication units
    or kept in higher-level cache (L1/L0 buffer), minimizing the bandwidth pressure
    on the external memory interface.
performance_boost: 25%
note: This pattern is specifically designed for Transformer architectures (e.g., LLaMA,
  ChatGLM) where RoPE is a prerequisite for the attention mechanism. The `dl.async_task`
  API implies a dependency on a specific runtime environment (likely Ascend/CANN)
  that supports hardware-level task disaggregation.

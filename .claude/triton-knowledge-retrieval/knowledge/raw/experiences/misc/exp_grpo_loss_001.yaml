optimization_points:
- numerical_stability: Implements the iterative LogSumExp (LSE) algorithm to compute
    log-probabilities. This prevents floating-point overflow/underflow that is common
    when computing softmax over large vocabulary sizes by separating the max and sum
    operations.
- memory_chunking: Processes the vocabulary dimension V in fixed-size blocks defined
    by BLOCK_SIZE_V. This allows the kernel to handle vocabulary sizes that exceed
    the register file capacity or shared memory limits, ensuring flexibility across
    different model architectures.
- loop_fusion_analysis: The current implementation performs three separate reduction
    loops for new_logits, ref_logits, and old_logits. A critical optimization point
    is to fuse these three loops into a single pass. By loading chunks of all three
    tensors simultaneously, memory bandwidth utilization can be tripled, and cache
    locality can be significantly improved.
- compile_time_branching: Utilizes tl.constexpr for hyperparameters like HAS_DELTA.
    This ensures that conditional logic related to algorithm variants is resolved
    during compilation, eliminating runtime thread divergence within the warp.
performance_boost: 30%
note: The kernel is currently memory-bandwidth bound due to sequential passes over
  the logits. Fusing the reduction loops is the primary path to performance improvement
  on NPU hardware.
